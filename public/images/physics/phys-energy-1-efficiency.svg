<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
  <title id="title">Efficiency</title>
  <desc id="desc">Diagram showing energy input, useful output, and wasted energy for a motor lifting a weight, with efficiency calculation.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; fill: #dc2626; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="410" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Efficiency</text>

  <!-- Efficiency formula -->
  <rect x="20" y="50" width="370" height="140" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Efficiency Formula</text>
  
  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="310" height="45" rx="6" fill="#fef2f2"/>
    <text x="155" y="18" text-anchor="middle" class="formula">Efficiency = Useful Output ÷ Total Input</text>
    <text x="155" y="36" text-anchor="middle" class="sublabel">Can be expressed as decimal or percentage (×100)</text>

    <rect x="0" y="55" width="310" height="25" rx="6" fill="#fef3c7"/>
    <text x="155" y="72" text-anchor="middle" class="sublabel">Always ≤ 1 (or 100%) — cannot create energy!</text>
  </g>

  <!-- Sankey for motor -->
  <rect x="410" y="50" width="370" height="140" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">Example: Electric Motor Lifting a Weight</text>
  
  <g transform="translate(430, 90)">
    <rect x="0" y="5" width="310" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="155" y="21" text-anchor="middle" class="sublabel" fill="#dc2626">Input: 100 J electrical</text>

    <rect x="0" y="35" width="217" height="22" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
    <text x="108" y="51" text-anchor="middle" class="sublabel" fill="#166534">Useful: 70 J (lifting)</text>
    <polygon points="217,35 225,46 217,57" fill="#bbf7d0"/>

    <rect x="0" y="65" width="93" height="22" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
    <text x="46" y="81" text-anchor="middle" class="sublabel" fill="#dc2626">Wasted: 30 J (heat + sound)</text>
    <polygon points="93,65 101,76 93,87" fill="#fecaca"/>
    
    <text x="155" y="108" text-anchor="middle" class="label" fill="#dc2626">Efficiency = 70%</text>
  </g>

  <!-- Ways to improve -->
  <rect x="20" y="210" width="370" height="80" rx="10" class="box"/>
  <text x="205" y="235" text-anchor="middle" class="label">How to Improve Efficiency</text>
  <g transform="translate(40, 250)">
    <text x="0" y="14" class="sublabel">• Lubricate moving parts (reduce friction)</text>
    <text x="0" y="30" class="sublabel">• Streamline shapes (reduce air resistance)</text>
  </g>

  <!-- Power efficiency -->
  <rect x="410" y="210" width="370" height="80" rx="10" class="box"/>
  <text x="595" y="235" text-anchor="middle" class="label">Power Efficiency</text>
  <g transform="translate(430, 250)">
    <text x="0" y="14" class="sublabel">Efficiency = Useful Power Out ÷ Total Power In</text>
    <text x="0" y="30" class="sublabel">Example: motor output = 35 W, input = 50 W → 70%</text>
  </g>

  <!-- No 100% note -->
  <rect x="20" y="310" width="760" height="35" rx="10" class="box"/>
  <text x="400" y="332" text-anchor="middle" class="sublabel">No device is 100% efficient — some energy is always dissipated as thermal energy due to friction/electrical resistance</text>
</svg>
