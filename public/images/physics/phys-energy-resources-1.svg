<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Energy Resources and Sustainability</title>
  <desc id="desc">Diagram comparing renewable and non-renewable energy resources, showing how a thermal power station generates electricity, and listing sustainability factors.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Energy Resources &amp; Sustainability</text>

  <!-- Renewable vs Non-renewable -->
  <rect x="20" y="50" width="370" height="210" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Renewable vs Non-Renewable</text>

  <g transform="translate(35, 90)">
    <rect x="0" y="0" width="340" height="75" rx="6" fill="#fff1f2"/>
    <text x="10" y="20" class="label" fill="#dc2626">Non-Renewable</text>
    <text x="10" y="38" class="sublabel">Coal, oil, natural gas, nuclear fuels</text>
    <text x="10" y="54" class="sublabel">Finite supply · high CO₂ emissions (except nuclear)</text>
    <text x="10" y="70" class="sublabel">Reliable · high power output · established infrastructure</text>

    <rect x="0" y="85" width="340" height="75" rx="6" fill="#f0fdf4"/>
    <text x="10" y="105" class="label" fill="#16a34a">Renewable</text>
    <text x="10" y="123" class="sublabel">Solar, wind, hydro, geothermal, biomass, tidal</text>
    <text x="10" y="139" class="sublabel">Replenished naturally · low CO₂ during operation</text>
    <text x="10" y="155" class="sublabel">Intermittent · location-dependent · high initial cost</text>
  </g>

  <!-- Power station -->
  <rect x="410" y="50" width="370" height="210" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">How a Thermal Power Station Works</text>

  <g transform="translate(430, 90)">
    <rect x="0" y="35" width="50" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="58" text-anchor="middle" class="sublabel" fill="#991b1b">Fuel</text>

    <line x1="50" y1="55" x2="90" y2="55" class="line" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6" fill="#6b7280"/>
      </marker>
    </defs>

    <rect x="90" y="35" width="50" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="115" y="58" text-anchor="middle" class="sublabel" fill="#92400e">Boiler</text>

    <line x1="140" y1="55" x2="180" y2="55" class="line" marker-end="url(#arrow)"/>

    <rect x="180" y="35" width="50" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="205" y="58" text-anchor="middle" class="sublabel" fill="#1e40af">Turbine</text>

    <line x1="230" y1="55" x2="270" y2="55" class="line" marker-end="url(#arrow)"/>

    <rect x="270" y="35" width="60" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="300" y="58" text-anchor="middle" class="sublabel" fill="#166534">Generator</text>

    <line x1="330" y1="55" x2="350" y2="55" class="line" marker-end="url(#arrow)"/>
    <text x="345" y="78" text-anchor="end" class="sublabel">Grid</text>

    <text x="180" y="108" text-anchor="middle" class="sublabel">Fuel burns → water boils → steam spins turbine → generator</text>
    <text x="180" y="126" text-anchor="middle" class="sublabel">produces electricity · waste heat released to surroundings</text>
  </g>

  <!-- Efficiency -->
  <rect x="20" y="275" width="240" height="100" rx="10" class="box"/>
  <text x="140" y="300" text-anchor="middle" class="label">Efficiency</text>
  <g transform="translate(35, 315)">
    <rect x="0" y="0" width="210" height="45" rx="6" fill="#fef2f2"/>
    <text x="105" y="18" text-anchor="middle" class="label" fill="#dc2626">Useful Output ÷ Input × 100%</text>
    <text x="105" y="36" text-anchor="middle" class="sublabel">No power station is 100% efficient</text>
  </g>

  <!-- Carbon footprint -->
  <rect x="280" y="275" width="240" height="100" rx="10" class="box"/>
  <text x="400" y="300" text-anchor="middle" class="label">Carbon Footprint</text>
  <g transform="translate(295, 315)">
    <rect x="0" y="0" width="210" height="45" rx="6" fill="#f0fdf4"/>
    <text x="105" y="18" text-anchor="middle" class="sublabel">Total greenhouse gas emissions</text>
    <text x="105" y="36" text-anchor="middle" class="sublabel">Fossil fuels &gt; high · Renewables &gt; low</text>
  </g>

  <!-- Sustainability factors -->
  <rect x="540" y="275" width="240" height="100" rx="10" class="box"/>
  <text x="660" y="300" text-anchor="middle" class="label">Sustainability Factors</text>
  <g transform="translate(555, 315)">
    <text x="0" y="14" class="sublabel">• Reliability</text>
    <text x="0" y="30" class="sublabel">• Cost</text>
    <text x="0" y="46" class="sublabel">• Environmental impact</text>
    <text x="0" y="62" class="sublabel">• Energy security</text>
  </g>

  <!-- Energy mix bar -->
  <rect x="20" y="390" width="760" height="110" rx="10" class="box"/>
  <text x="400" y="415" text-anchor="middle" class="label">Example Energy Mix Comparison</text>

  <g transform="translate(40, 435)">
    <text x="0" y="14" class="sublabel">Fossil fuels</text>
    <rect x="90" y="0" width="280" height="18" rx="4" fill="#fca5a5"/>
    <text x="230" y="13" text-anchor="middle" class="sublabel" fill="#7f1d1d">Reliable · high CO₂</text>

    <text x="0" y="42" class="sublabel">Nuclear</text>
    <rect x="90" y="28" width="180" height="18" rx="4" fill="#fde68a"/>
    <text x="180" y="41" text-anchor="middle" class="sublabel" fill="#713f12">Reliable · low CO₂ · waste</text>

    <text x="0" y="70" class="sublabel">Renewables</text>
    <rect x="90" y="56" width="220" height="18" rx="4" fill="#86efac"/>
    <text x="200" y="69" text-anchor="middle" class="sublabel" fill="#14532d">Low CO₂ · intermittent</text>
  </g>

  <text x="400" y="505" text-anchor="middle" class="sublabel">Sustainable choices balance reliability, cost, emissions, and impacts on people and ecosystems.</text>
</svg>