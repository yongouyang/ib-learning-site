<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Pressure in Liquids</title>
  <desc id="desc">Liquid column showing pressure increases with depth: P = ρgh.</desc>
  <defs><style>
    .t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}
    .l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}
    .s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}
    .f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}
    .b{fill:#fff;stroke:#e5e7eb;stroke-width:2}
  </style></defs>
  <rect width="800" height="340" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="t">Pressure in Liquids</text>
  <g transform="translate(0,55)"><rect x="20" y="0" width="360" height="240" rx="10" class="b"/><text x="200" y="25" text-anchor="middle" class="l">Pressure Increases with Depth</text>
    <g transform="translate(40,38)"><rect x="40" y="0" width="60" height="180" rx="4" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="70" cy="40" r="3" fill="#ef4444"/><line x1="73" y1="40" x2="120" y2="35" stroke="#ef4444" stroke-width="1.5"/>
    <text x="130" y="35" class="s" fill="#dc2626">Low P (shallow)</text>
    <circle cx="70" cy="100" r="3" fill="#f97316"/><line x1="73" y1="100" x2="120" y2="95" stroke="#f97316" stroke-width="1.5"/>
    <text x="130" y="95" class="s" fill="#f97316">Medium P</text>
    <circle cx="70" cy="160" r="3" fill="#dc2626"/><line x1="73" y1="160" x2="120" y2="155" stroke="#dc2626" stroke-width="1.5"/>
    <text x="130" y="155" class="s" fill="#dc2626">High P (deep)</text></g>
    <rect x="420" y="0" width="360" height="240" rx="10" class="b"/><text x="600" y="25" text-anchor="middle" class="l">Liquid Pressure Equation</text>
    <g transform="translate(440,38)"><rect x="0" y="0" width="320" height="55" rx="6" fill="#fef2f2"/>
    <text x="160" y="20" text-anchor="middle" class="f">P = ρgh</text><text x="160" y="40" text-anchor="middle" class="s">Density (kg/m³) × g × depth (m)</text>
    <rect x="0" y="62" width="320" height="55" rx="6" fill="#f3f4f6"/>
    <text x="10" y="80" class="l">Key Points:</text>
    <text x="10" y="96" class="s">• Pressure acts equally in all directions at a given depth</text>
    <text x="10" y="112" class="s">• Independent of container shape — depends only on depth</text>
    <text x="10" y="132" class="s">• Dams are thicker at the base (to withstand greater pressure!)</text></g>
    <rect x="20" y="258" width="760" height="35" rx="8" class="b"/><text x="400" y="280" text-anchor="middle" class="s">Liquid pressure = weight of liquid above that point divided by area. P = ρgh works for any point in a liquid at rest.</text></g>
</svg>