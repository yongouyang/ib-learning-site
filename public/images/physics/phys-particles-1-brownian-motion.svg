<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Brownian Motion</title>
  <desc id="desc">Diagram showing pollen grains suspended in water being bombarded by invisible water molecules, causing random motion.</desc>
  <defs><style>
    .t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}
    .l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}
    .s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}
    .f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}
    .b{fill:#fff;stroke:#e5e7eb;stroke-width:2}
    .g{stroke:#e5e7eb;stroke-width:.5}
    .a{stroke:#374151;stroke-width:2}
    .p{fill:none;stroke:#ef4444;stroke-width:3}
  </style></defs>
  <rect width="800" height="360" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="t">Brownian Motion</text>
  <rect x="20" y="55" width="460" height="240" rx="10" class="b"/><text x="250" y="78" text-anchor="middle" class="l">Brownian Motion of Pollen Grains in Water</text>
    <g transform="translate(40,92)"><rect x="0" y="0" width="400" height="160" rx="8" fill="#e0f2fe"/>
    <!-- Pollen grains -->
    <circle cx="80" cy="60" r="18" fill="#fbbf24" stroke="#eab308" stroke-width="1.5" opacity="0.8"/>
    <circle cx="200" cy="80" r="22" fill="#fbbf24" stroke="#eab308" stroke-width="1.5" opacity="0.8"/>
    <circle cx="320" cy="50" r="16" fill="#fbbf24" stroke="#eab308" stroke-width="1.5" opacity="0.8"/>
    <!-- Water molecules -->
    <circle cx="45" cy="35" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="115" cy="50" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="90" cy="85" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="145" cy="70" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="170" cy="45" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="225" cy="65" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="250" cy="95" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="285" cy="40" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="355" cy="60" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="330" cy="85" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="55" cy="120" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="175" cy="130" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="280" cy="120" r="4" fill="#3b82f6" opacity="0.6"/><circle cx="370" cy="100" r="4" fill="#3b82f6" opacity="0.6"/>
    <text x="200" y="175" text-anchor="middle" class="s">Pollen grains (yellow) jiggle randomly as invisible</text><text x="200" y="191" text-anchor="middle" class="s">water molecules (blue) bombard them.</text></g>
    <rect x="500" y="55" width="280" height="240" rx="10" class="b"/><text x="640" y="78" text-anchor="middle" class="l">What It Proves</text>
    <g transform="translate(520,92)"><rect x="0" y="0" width="240" height="190" rx="6" fill="#fef2f2"/>
    <text x="10" y="22" class="l" fill="#dc2626">Evidence for Kinetic Theory:</text>
    <text x="10" y="42" class="s">• Brownian motion proves matter is made</text>
    <text x="10" y="58" class="s">  of tiny particles in constant random motion</text>
    <text x="10" y="76" class="s">• Observed by Robert Brown (1827):</text>
    <text x="10" y="92" class="s">  pollen grains in water</text>
    <text x="10" y="110" class="s">• Einstein (1905) explained it mathematically</text>
    <text x="10" y="128" class="s">• Higher temperature → faster motion</text>
    <text x="10" y="146" class="s">• The same effect is seen with smoke in air</text>
    <text x="10" y="164" class="s">• Water molecules are too small to see,</text>
    <text x="10" y="180" class="s">  but their effects are visible!</text></g>
</svg>