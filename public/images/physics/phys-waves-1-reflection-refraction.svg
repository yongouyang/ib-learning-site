<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Wave Reflection and Refraction</title><desc id="desc">Wavefront diagrams showing reflection at a barrier and refraction as waves change speed in different depths.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Wave Reflection and Refraction</text><g transform="translate(0,55)"><rect x="20" y="0" width="380" height="240" rx="10" class="b"/><text x="210" y="25" text-anchor="middle" class="l">Reflection of Waves</text>
  <g transform="translate(40,42)">
  <line x1="0" y1="20" x2="0" y2="180" stroke="#6b7280" stroke-width="3"/><text x="-5" y="210" text-anchor="middle" class="s">Barrier</text>
  <line x1="120" y1="30" x2="0" y2="100" stroke="#ef4444" stroke-width="2"/><text x="80" y="40" class="s" fill="#dc2626">Incident wavefronts</text>
  <line x1="120" y1="50" x2="0" y2="120" stroke="#ef4444" stroke-width="2"/>
  <line x1="0" y1="100" x2="120" y2="170" stroke="#22c55e" stroke-width="2"/><text x="80" y="175" class="s" fill="#22c55e">Reflected wavefronts</text>
  <line x1="0" y1="120" x2="120" y2="190" stroke="#22c55e" stroke-width="2"/>
  <text x="60" y="100" text-anchor="middle" class="s">i = r (law of reflection for waves too!)</text></g>
  <rect x="420" y="0" width="360" height="240" rx="10" class="b"/><text x="600" y="25" text-anchor="middle" class="l">Refraction of Water Waves</text>
  <g transform="translate(440,42)">
  <rect x="0" y="80" width="320" height="80" rx="4" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1.5"/><text x="160" y="130" text-anchor="middle" class="s" fill="#3b82f6">Shallow water (slower)</text>
  <line x1="0" y1="40" x2="180" y2="40" stroke="#ef4444" stroke-width="2"/>
  <line x1="240" y1="110" x2="320" y2="110" stroke="#f97316" stroke-width="2"/>
  <line x1="60" y1="20" x2="200" y2="20" stroke="#ef4444" stroke-width="2"/><line x1="250" y1="80" x2="320" y2="80" stroke="#f97316" stroke-width="2"/>
  <text x="130" y="25" class="s" fill="#dc2626">Deep (faster)</text><text x="50" y="165" class="s" fill="#f97316">Shallow water bends the wave toward the normal</text></g>
  <rect x="20" y="235" width="760" height="45" rx="8" class="b"/><text x="400" y="255" text-anchor="middle" class="s">Refraction occurs when waves change speed (usually at a boundary). Wave speed changes →</text><text x="400" y="271" text-anchor="middle" class="s">wavelength changes → direction changes. Frequency stays the same!</text></g></svg>