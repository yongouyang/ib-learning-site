<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Magnets and Magnetic Fields</title>
  <desc id="desc">Bar magnet showing magnetic field lines from north to south pole, with compass plotting method and magnetic materials.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .field-line { fill: none; stroke: #6b7280; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="400" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Magnets and Magnetic Fields</text>

  <!-- Bar magnet + field lines -->
  <rect x="20" y="50" width="420" height="250" rx="10" class="box"/>
  <text x="230" y="75" text-anchor="middle" class="label">Magnetic Field Around a Bar Magnet</text>

  <g transform="translate(60, 100)">
    <!-- Bar magnet -->
    <rect x="100" y="30" width="150" height="30" rx="4" fill="#ef4444"/>
    <rect x="175" y="30" width="75" height="30" rx="0" fill="#3b82f6"/>
    <rect x="175" y="30" width="75" height="30" rx="0" fill="#3b82f6"/>

    <text x="130" y="50" text-anchor="middle" class="sublabel" fill="white">N</text>
    <text x="220" y="50" text-anchor="middle" class="sublabel" fill="white">S</text>

    <!-- Field lines -->
    <path d="M100,45 Q60,45 40,10" class="field-line"/>
    <path d="M100,45 Q50,45 20,45" class="field-line"/>
    <path d="M100,45 Q60,45 40,80" class="field-line"/>
    <path d="M130,45 Q80,20 40,10" class="field-line"/>
    <path d="M130,45 Q80,70 40,80" class="field-line"/>
    <path d="M250,45 Q290,20 320,10" class="field-line"/>
    <path d="M250,45 Q300,45 340,45" class="field-line"/>
    <path d="M250,45 Q290,70 320,80" class="field-line"/>
    <path d="M220,45 Q270,20 320,10" class="field-line"/>
    <path d="M220,45 Q270,70 320,80" class="field-line"/>

    <!-- Arrow heads -->
    <polygon points="38,8 42,12 34,12" fill="#6b7280"/>
    <polygon points="18,43 22,47 18,47" fill="#6b7280"/>
    <polygon points="322,8 326,12 318,12" fill="#6b7280"/>
    <polygon points="342,43 346,47 342,47" fill="#6b7280"/>

    <text x="175" y="100" text-anchor="middle" class="sublabel">Field lines go from North → to South (outside the magnet)</text>
    <text x="175" y="116" text-anchor="middle" class="sublabel">Closer lines = stronger field</text>
  </g>

  <!-- Properties panel -->
  <rect x="460" y="50" width="320" height="250" rx="10" class="box"/>
  <text x="620" y="75" text-anchor="middle" class="label">Magnetic Properties</text>
  <g transform="translate(480, 92)">
    <rect x="0" y="0" width="280" height="55" rx="6" fill="#fef2f2"/>
    <text x="10" y="18" class="label" fill="#dc2626">Like poles repel; unlike poles attract</text>
    <text x="10" y="36" class="sublabel">N-N repels, S-S repels, N-S attracts</text>

    <rect x="0" y="62" width="280" height="55" rx="6" fill="#fef2f2"/>
    <text x="10" y="80" class="label">Magnetic Materials</text>
    <text x="10" y="96" class="sublabel">Iron · Steel · Cobalt · Nickel (ferromagnetic)</text>
    <text x="10" y="112" class="sublabel">Steel = hard (retains magnetism) · Iron = soft (loses it)</text>

    <rect x="0" y="124" width="280" height="55" rx="6" fill="#eff6ff"/>
    <text x="10" y="142" class="label" fill="#3b82f6">Compass Plotting</text>
    <text x="10" y="158" class="sublabel">Place compass near magnet → needle aligns with field</text>
    <text x="10" y="174" class="sublabel">Mark dots → connect to plot field lines</text>
  </g>

  <!-- Bottom -->
  <rect x="20" y="315" width="760" height="40" rx="8" class="box"/>
  <text x="400" y="335" text-anchor="middle" class="label">A magnet always has both N and S poles — you cannot have a magnetic monopole (single pole)</text>
</svg>
