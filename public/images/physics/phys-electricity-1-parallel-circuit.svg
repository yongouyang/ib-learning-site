<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Parallel Circuits</title>
  <desc id="desc">A parallel circuit diagram with two resistor branches, ammeters on each branch and the main line, and the key rules for parallel circuits.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 700; fill: #dc2626; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .wire { fill: none; stroke: #374151; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .component { fill: #ffffff; stroke: #374151; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="460" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Parallel Circuits</text>

  <!-- Circuit diagram -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="420" height="270" rx="10" class="box"/>
    
    <!-- Battery -->
    <g transform="translate(30, 85)">
      <rect x="0" y="15" width="14" height="30" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <rect x="14" y="23" width="8" height="14" rx="1" fill="#ef4444"/>
      <text x="25" y="42" text-anchor="middle" class="sublabel">6 V</text>
    </g>

    <!-- Main loop wires -->
    <line x1="44" y1="85" x2="44" y2="15" class="wire"/>
    <line x1="44" y1="15" x2="350" y2="15" class="wire"/>
    
    <!-- Main ammeter -->
    <g transform="translate(155, 8)">
      <circle cx="16" cy="16" r="14" class="component"/>
      <text x="16" y="20" text-anchor="middle" class="sublabel" fill="#dc2626">A</text>
      <text x="16" y="38" text-anchor="middle" class="sublabel">1.5 A</text>
    </g>

    <!-- Junction split -->
    <line x1="350" y1="15" x2="350" y2="70" class="wire"/>

    <!-- Branch 1 (top): R1 -->
    <line x1="350" y1="70" x2="120" y2="70" class="wire"/>
    
    <!-- Ammeter A1 -->
    <g transform="translate(260, 63)">
      <circle cx="14" cy="14" r="12" class="component"/>
      <text x="14" y="18" text-anchor="middle" class="sublabel" fill="#dc2626">A₁</text>
      <text x="14" y="36" text-anchor="middle" class="sublabel">1.0 A</text>
    </g>

    <!-- R1 -->
    <g transform="translate(140, 63)">
      <rect x="0" y="0" width="50" height="20" rx="3" class="component"/>
      <text x="25" y="28" text-anchor="middle" class="sublabel" fill="#dc2626">6 Ω</text>
    </g>

    <!-- Branch 1 wire back to junction -->
    <line x1="120" y1="73" x2="120" y2="130" class="wire"/>

    <!-- Branch 2 (bottom): R2 -->
    <line x1="350" y1="70" x2="350" y2="130" class="wire"/>
    
    <!-- Ammeter A2 -->
    <g transform="translate(260, 123)">
      <circle cx="14" cy="14" r="12" class="component"/>
      <text x="14" y="18" text-anchor="middle" class="sublabel" fill="#dc2626">A₂</text>
      <text x="14" y="36" text-anchor="middle" class="sublabel">0.5 A</text>
    </g>

    <!-- R2 -->
    <g transform="translate(140, 123)">
      <rect x="0" y="0" width="50" height="20" rx="3" class="component"/>
      <text x="25" y="28" text-anchor="middle" class="sublabel" fill="#dc2626">12 Ω</text>
    </g>

    <!-- Branch 2 wire back -->
    <line x1="120" y1="133" x2="120" y2="130" class="wire"/>

    <!-- Bottom junction -->
    <line x1="120" y1="130" x2="120" y2="235" class="wire"/>
    <line x1="120" y1="235" x2="120" y2="235" class="wire"/>

    <!-- Voltmeter across branches -->
    <g transform="translate(310, 190)">
      <circle cx="16" cy="16" r="14" class="component"/>
      <text x="16" y="20" text-anchor="middle" class="sublabel" fill="#dc2626">V</text>
      <text x="16" y="44" text-anchor="middle" class="sublabel">6 V</text>
      <line x1="0" y1="8" x2="-15" y2="-35" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="0" y1="24" x2="-15" y2="50" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Wire back to battery -->
    <line x1="120" y1="235" x2="30" y2="235" class="wire"/>
    <line x1="30" y1="235" x2="30" y2="120" class="wire"/>
  </g>

  <!-- Parallel rules panel -->
  <rect x="470" y="55" width="310" height="270" rx="10" class="box"/>
  <text x="625" y="80" text-anchor="middle" class="label">Parallel Circuit Rules</text>

  <g transform="translate(490, 98)">
    <rect x="0" y="0" width="270" height="50" rx="6" fill="#fef2f2"/>
    <text x="10" y="18" class="label" fill="#dc2626">1. Current SPLITS at junctions</text>
    <text x="10" y="36" class="sublabel">I_total = I₁ + I₂ + I₃ (1.5 = 1.0 + 0.5)</text>

    <rect x="0" y="58" width="270" height="50" rx="6" fill="#fef2f2"/>
    <text x="10" y="76" class="label" fill="#dc2626">2. Voltage is the SAME across branches</text>
    <text x="10" y="94" class="sublabel">V₁ = V₂ = V_total (= 6 V)</text>

    <rect x="0" y="116" width="270" height="50" rx="6" fill="#fef2f2"/>
    <text x="10" y="134" class="label" fill="#dc2626">3. Total resistance DECREASES</text>
    <text x="10" y="152" class="sublabel">1/R_total = 1/R₁ + 1/R₂ + 1/R₃</text>

    <rect x="0" y="174" width="270" height="30" rx="6" fill="#fef3c7"/>
    <text x="10" y="193" class="sublabel">⚠ Branches independent — one break ≠ all off</text>
  </g>

  <!-- Bottom -->
  <rect x="30" y="340" width="740" height="45" rx="10" class="box"/>
  <text x="400" y="360" text-anchor="middle" class="label">Parallel = Home wiring: each appliance gets full 230 V independently</text>
  <text x="400" y="376" text-anchor="middle" class="sublabel">More parallel branches → more current paths → total resistance ↓ → total current from battery ↑</text>
</svg>
