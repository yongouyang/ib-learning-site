<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc"><title id="title">Penetrating Power of Alpha, Beta and Gamma Radiation</title><desc id="desc">A radioactive source emits alpha, beta and gamma radiation towards three barriers: alpha is stopped by a sheet of paper, beta passes through paper but is stopped by a few millimetres of aluminium, and gamma passes through both and is only reduced by a thick lead block.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style><marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker></defs><rect width="800" height="330" fill="#f9fafb" rx="12"/><text x="400" y="30" text-anchor="middle" class="t">Penetrating Power of Alpha, Beta and Gamma</text>
<rect x="20" y="48" width="760" height="236" rx="10" class="b"/>
<rect x="36" y="110" width="56" height="100" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="64" y="232" text-anchor="middle" class="s">radioactive</text><text x="64" y="246" text-anchor="middle" class="s">source</text>
<rect x="240" y="96" width="8" height="140" fill="#e5e7eb" stroke="#9ca3af"/><text x="244" y="252" text-anchor="middle" class="s">paper</text>
<rect x="420" y="96" width="16" height="140" fill="#93c5fd" stroke="#3b82f6"/><text x="428" y="252" text-anchor="middle" class="s">aluminium</text>
<rect x="600" y="96" width="44" height="140" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/><text x="622" y="252" text-anchor="middle" class="s">thick lead</text>
<text x="100" y="118" class="s">alpha (helium nucleus)</text>
<line x1="92" y1="130" x2="240" y2="130" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahA)"/>
<line x1="248" y1="124" x2="260" y2="136" stroke="#dc2626" stroke-width="2"/><line x1="248" y1="136" x2="260" y2="124" stroke="#dc2626" stroke-width="2"/>
<text x="100" y="148" class="s">beta (electron)</text>
<line x1="92" y1="160" x2="420" y2="160" stroke="#f97316" stroke-width="2.5" marker-end="url(#ahB)"/>
<line x1="442" y1="154" x2="454" y2="166" stroke="#f97316" stroke-width="2"/><line x1="442" y1="166" x2="454" y2="154" stroke="#f97316" stroke-width="2"/>
<text x="100" y="182" class="s">gamma (EM wave)</text>
<line x1="92" y1="190" x2="620" y2="190" stroke="#8b5cf6" stroke-width="2.5"/>
<line x1="644" y1="190" x2="730" y2="190" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ahG)"/>
<line x1="687" y1="94" x2="710" y2="184" stroke="#6b7280" stroke-width="1.5"/><text x="687" y="88" text-anchor="middle" class="s">reduced, not stopped</text>
<rect x="20" y="296" width="760" height="30" rx="8" class="b"/><text x="400" y="315" text-anchor="middle" class="s">Ionising power: alpha &gt; beta &gt; gamma. Penetrating power is the reverse — the strongest ioniser loses its energy fastest.</text></svg>
