<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Wave Behaviour: Diffraction, Absorption, Transmission</title><desc id="desc">Wave behaviour at boundaries: passing through (transmission), being absorbed, and diffracting around edges.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Wave Behaviour: Diffraction, Absorption, Transmission</text><g transform="translate(0,55)"><rect x="20" y="0" width="240" height="240" rx="10" class="b"/><text x="140" y="25" text-anchor="middle" class="l">Diffraction</text>
  <g transform="translate(40,42)"><rect x="0" y="70" width="60" height="8" rx="2" fill="#6b7280"/><rect x="120" y="70" width="60" height="8" rx="2" fill="#6b7280"/>
  <line x1="80" y1="20" x2="80" y2="74" stroke="#ef4444" stroke-width="2"/>
  <path d="M70,78 A20,20 0 0 0 110,78" fill="none" stroke="#ef4444" stroke-width="2"/><path d="M52,78 A38,38 0 0 0 128,78" fill="none" stroke="#ef4444" stroke-width="2"/><path d="M34,78 A56,56 0 0 0 146,78" fill="none" stroke="#ef4444" stroke-width="2"/><text x="100" y="152" text-anchor="middle" class="s">Wave bends around gap</text>
  <text x="100" y="170" text-anchor="middle" class="s">Gap ≈ λ → maximum diffraction</text></g>
  <rect x="280" y="0" width="240" height="240" rx="10" class="b"/><text x="400" y="25" text-anchor="middle" class="l">Absorption</text>
  <g transform="translate(300,42)"><rect x="0" y="70" width="200" height="30" rx="4" fill="#9ca3af"/><text x="100" y="90" text-anchor="middle" class="s" fill="white">Material</text>
  <line x1="40" y1="20" x2="60" y2="68" stroke="#ef4444" stroke-width="2.5"/><text x="40" y="15" class="s" fill="#dc2626">Wave</text>
  <text x="100" y="120" text-anchor="middle" class="s">Energy absorbed → no wave on other side</text></g>
  <rect x="540" y="0" width="240" height="240" rx="10" class="b"/><text x="660" y="25" text-anchor="middle" class="l">Transmission</text>
  <g transform="translate(560,42)"><rect x="0" y="70" width="200" height="30" rx="4" fill="#e0f2fe" opacity="0.5"/><text x="100" y="90" text-anchor="middle" class="s" fill="#3b82f6">Transparent material</text>
  <line x1="40" y1="20" x2="80" y2="68" stroke="#ef4444" stroke-width="2.5"/><text x="40" y="15" class="s" fill="#dc2626">Wave in</text>
  <line x1="100" y1="100" x2="158" y2="100" stroke="#22c55e" stroke-width="2.5"/><text x="165" y="115" class="s" fill="#22c55e">Wave out</text>
  <text x="100" y="125" text-anchor="middle" class="s">Wave passes through</text></g>
  <rect x="20" y="235" width="760" height="45" rx="8" class="b"/><text x="400" y="255" text-anchor="middle" class="s">Diffraction is greatest when the gap size is similar to the wavelength.</text><text x="400" y="271" text-anchor="middle" class="s">This is why you can hear sound around corners (long λ) but not see around them (short λ for light).</text></g></svg>