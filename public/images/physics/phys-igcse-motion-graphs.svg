<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" role="img" aria-labelledby="title desc">
  <title id="title">Motion graphs</title>
  <desc id="desc">Two exam-style graphs. Left: a distance-time graph whose gradient equals speed, with a flat section showing the object stationary. Right: a speed-time graph whose gradient equals acceleration and whose shaded area equals the distance travelled.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .axis { stroke: #374151; stroke-width: 2; fill: none; }
      .data { stroke: #2563eb; stroke-width: 3; fill: none; }
      .leader { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="800" height="395" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Reading Motion Graphs</text>

  <!-- Left panel: distance-time -->
  <rect x="20" y="50" width="370" height="280" rx="10" class="panel"/>
  <text x="205" y="75" text-anchor="middle" class="label">Distance-time graph</text>
  <line x1="70" y1="290" x2="70" y2="95" class="axis"/>
  <line x1="70" y1="290" x2="370" y2="290" class="axis"/>
  <text x="70" y="90" text-anchor="middle" class="sublabel">distance (m)</text>
  <text x="366" y="312" text-anchor="end" class="sublabel">time (s)</text>
  <polyline points="70,290 230,150 350,150" class="data"/>
  <text x="235" y="105" text-anchor="middle" class="label">gradient = speed</text>
  <line x1="235" y1="112" x2="150" y2="218" class="leader"/>
  <text x="290" y="138" text-anchor="middle" class="sublabel">stationary (speed = 0)</text>

  <!-- Right panel: speed-time -->
  <rect x="410" y="50" width="370" height="280" rx="10" class="panel"/>
  <text x="595" y="75" text-anchor="middle" class="label">Speed-time graph</text>
  <line x1="460" y1="290" x2="460" y2="95" class="axis"/>
  <line x1="460" y1="290" x2="760" y2="290" class="axis"/>
  <text x="460" y="90" text-anchor="middle" class="sublabel">speed (m/s)</text>
  <text x="756" y="312" text-anchor="end" class="sublabel">time (s)</text>
  <polygon points="460,290 580,170 730,170 730,290" fill="#dbeafe"/>
  <polyline points="460,290 580,170 730,170" class="data"/>
  <text x="515" y="118" text-anchor="middle" class="label">gradient = acceleration</text>
  <line x1="515" y1="125" x2="518" y2="222" class="leader"/>
  <rect x="592" y="216" width="116" height="42" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="650" y="233" text-anchor="middle" class="sublabel">area under the line</text>
  <text x="650" y="249" text-anchor="middle" class="sublabel">= distance travelled</text>
  <text x="655" y="158" text-anchor="middle" class="sublabel">constant speed</text>

  <!-- Bottom summary strip -->
  <rect x="20" y="345" width="760" height="38" rx="8" class="panel"/>
  <text x="400" y="369" text-anchor="middle" class="sublabel">Distance-time: gradient = speed. Speed-time: gradient = acceleration and area under the line = distance.</text>
</svg>
