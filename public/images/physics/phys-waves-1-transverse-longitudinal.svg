<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Transverse and Longitudinal Waves</title><desc id="desc">Side-by-side comparison of transverse (light, water) and longitudinal (sound) waves.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Transverse and Longitudinal Waves</text><g transform="translate(0,55)"><rect x="20" y="0" width="380" height="240" rx="10" class="b"/><text x="210" y="25" text-anchor="middle" class="l">Transverse Wave (Light, Water, Seismic S)</text>
  <g transform="translate(40,42)"><path d="M0,60 Q30,0 60,60 Q90,120 120,60 Q150,0 180,60 Q210,120 240,60 Q270,0 300,60" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="0" y1="60" x2="310" y2="60" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="300" y="65" text-anchor="middle" class="s" fill="#dc2626">Vibration ⟂ to direction of travel</text>
  <text x="150" y="95" text-anchor="middle" class="s">Oscillations are PERPENDICULAR to energy transfer</text>
  <text x="150" y="120" text-anchor="middle" class="s">Examples: light, water ripples, S-waves, guitar string</text></g>
  <rect x="420" y="0" width="360" height="240" rx="10" class="b"/><text x="600" y="25" text-anchor="middle" class="l">Longitudinal Wave (Sound, Seismic P)</text>
  <g transform="translate(440,42)"><circle cx="10" cy="40" r="6" fill="#3b82f6"/><circle cx="30" cy="40" r="6" fill="#3b82f6"/><circle cx="40" cy="40" r="6" fill="#3b82f6"/>
  <circle cx="80" cy="40" r="6" fill="#3b82f6"/><circle cx="92" cy="40" r="6" fill="#3b82f6"/><circle cx="105" cy="40" r="6" fill="#3b82f6"/>
  <circle cx="130" cy="40" r="6" fill="#3b82f6"/><circle cx="140" cy="40" r="6" fill="#3b82f6"/>
  <circle cx="175" cy="40" r="6" fill="#3b82f6"/><circle cx="190" cy="40" r="6" fill="#3b82f6"/><circle cx="205" cy="40" r="6" fill="#3b82f6"/>
  <text x="10" y="30" class="s" fill="#dc2626">Compression</text><text x="145" y="30" class="s" fill="#dc2626">Rarefaction</text>
  <text x="150" y="80" text-anchor="middle" class="s">Oscillations are PARALLEL to energy transfer</text>
  <text x="150" y="105" text-anchor="middle" class="s">Examples: sound, P-waves (earthquakes)</text>
  <text x="150" y="130" text-anchor="middle" class="s" fill="#dc2626">Cannot travel through vacuum (needs medium!)</text></g>
  <rect x="20" y="235" width="760" height="45" rx="8" class="b"/><text x="400" y="255" text-anchor="middle" class="s">Key difference: transverse waves oscillate perpendicular to direction of travel;</text><text x="400" y="271" text-anchor="middle" class="s">longitudinal waves oscillate parallel. Earthquakes produce both P and S waves.</text></g></svg>