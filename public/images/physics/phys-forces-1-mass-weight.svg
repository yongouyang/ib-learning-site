<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Mass, Weight and Gravity</title>
  <desc id="desc">Comparison of mass and weight on Earth vs the Moon, with W=mg formula and centre of mass stability diagram.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; fill: #dc2626; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="380" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Mass, Weight and Gravity</text>

  <!-- Earth vs Moon -->
  <rect x="20" y="50" width="370" height="210" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Mass vs Weight on Earth and Moon</text>

  <g transform="translate(40, 88)">
    <!-- Person on Earth -->
    <circle cx="50" cy="20" r="14" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="34" x2="50" y2="70" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="44" x2="30" y2="55" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="44" x2="70" y2="55" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="70" x2="38" y2="95" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="70" x2="62" y2="95" stroke="#374151" stroke-width="2"/>

    <!-- Earth -->
    <rect x="10" y="95" width="80" height="10" rx="3" fill="#22c55e"/>
    <text x="50" y="120" text-anchor="middle" class="label">Earth</text>
    <text x="50" y="136" text-anchor="middle" class="sublabel">g = 9.8 m/s²</text>
    <text x="50" y="152" text-anchor="middle" class="sublabel">Mass: 70 kg</text>
    <text x="50" y="168" text-anchor="middle" class="sublabel" fill="#dc2626">Weight: 700 N</text>

    <!-- Arrow connecting -->
    <text x="155" y="78" text-anchor="middle" class="label" fill="#3b82f6">Same person!</text>

    <!-- Person on Moon -->
    <circle cx="260" cy="20" r="14" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="260" y1="34" x2="260" y2="70" stroke="#374151" stroke-width="2"/>
    <line x1="260" y1="44" x2="240" y2="55" stroke="#374151" stroke-width="2"/>
    <line x1="260" y1="44" x2="280" y2="55" stroke="#374151" stroke-width="2"/>
    <line x1="260" y1="70" x2="248" y2="95" stroke="#374151" stroke-width="2"/>
    <line x1="260" y1="70" x2="272" y2="95" stroke="#374151" stroke-width="2"/>

    <!-- Moon -->
    <rect x="220" y="95" width="80" height="10" rx="3" fill="#9ca3af"/>
    <text x="260" y="120" text-anchor="middle" class="label">Moon</text>
    <text x="260" y="136" text-anchor="middle" class="sublabel">g = 1.6 m/s²</text>
    <text x="260" y="152" text-anchor="middle" class="sublabel">Mass: 70 kg</text>
    <text x="260" y="168" text-anchor="middle" class="sublabel" fill="#dc2626">Weight: 112 N (~⅙)</text>
  </g>

  <!-- W=mg and stability -->
  <rect x="410" y="50" width="370" height="210" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">W = mg and Stability</text>

  <g transform="translate(430, 92)">
    <rect x="0" y="0" width="310" height="35" rx="6" fill="#fef2f2"/>
    <text x="155" y="15" text-anchor="middle" class="formula">W = m × g</text>
    <text x="155" y="30" text-anchor="middle" class="sublabel">Weight (N) = mass (kg) × gravitational field strength (N/kg)</text>

    <rect x="0" y="45" width="310" height="70" rx="6" fill="#f3f4f6"/>
    <text x="10" y="62" class="label">Centre of Mass and Stability</text>
    <text x="10" y="80" class="sublabel">• Centre of mass: point where weight appears to act</text>
    <text x="10" y="96" class="sublabel">• Stable: wide base + low centre of mass</text>
    <text x="10" y="112" class="sublabel">• Topples when centre of mass moves beyond base</text>

    <!-- Simple stability diagram -->
    <g transform="translate(20, 130)">
      <!-- Stable -->
      <rect x="0" y="20" width="50" height="8" rx="2" fill="#9ca3af"/>
      <rect x="15" y="5" width="20" height="15" rx="2" fill="#ef4444"/>
      <circle cx="25" cy="8" r="2" fill="#fbbf24"/>
      <line x1="25" y1="8" x2="25" y2="30" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,1"/>
      <text x="25" y="38" text-anchor="middle" class="sublabel">Stable</text>

      <!-- Unstable -->
      <rect x="80" y="20" width="50" height="8" rx="2" fill="#9ca3af"/>
      <rect x="88" y="0" width="15" height="20" rx="2" fill="#f97316" transform="rotate(15 95 10)"/>
      <circle cx="95" cy="5" r="2" fill="#fbbf24"/>
      <text x="105" y="38" text-anchor="middle" class="sublabel">Unstable</text>

      <!-- Toppled -->
      <rect x="150" y="20" width="50" height="8" rx="2" fill="#9ca3af"/>
      <rect x="165" y="20" width="20" height="15" rx="2" fill="#f97316" transform="rotate(45 175 27)"/>
      <circle cx="175" cy="22" r="2" fill="#fbbf24"/>
      <text x="175" y="38" text-anchor="middle" class="sublabel">Toppled!</text>

      <text x="90" y="58" text-anchor="middle" class="sublabel" fill="#dc2626">CoM beyond base → topples!</text>
    </g>
  </g>

  <!-- Key comparison -->
  <rect x="20" y="280" width="760" height="50" rx="10" class="box"/>
  <g transform="translate(40, 295)">
    <text x="0" y="14" class="sublabel">Mass: amount of matter (kg) — same everywhere · Weight: gravitational force (N) — depends on g · Measured with Newton meter, not balance</text>
    <text x="300" y="32" class="sublabel">g_Earth ≈ 9.8 N/kg | g_Moon ≈ 1.6 N/kg | W = mg</text>
  </g>
</svg>
