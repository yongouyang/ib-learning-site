<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Practical Optics</title>
  <desc id="desc">Ray diagrams of a periscope and an endoscope showing how prisms and optical fibres use total internal reflection.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .ray { fill: none; stroke-width: 2.5; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="380" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Practical Optics: Periscopes and Total Internal Reflection</text>

  <!-- Periscope -->
  <rect x="20" y="55" width="360" height="210" rx="10" class="box"/>
  <text x="200" y="78" text-anchor="middle" class="label">Periscope (Uses Prisms/Mirrors)</text>

  <g transform="translate(40, 95)">
    <!-- Tube -->
    <rect x="60" y="0" width="50" height="180" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Top prism (45° mirror) -->
    <rect x="85" y="5" width="30" height="2" fill="#6b7280" transform="rotate(-45 100 6)"/>
    <line x1="25" y1="20" x2="85" y2="12" class="ray" stroke="#ef4444"/>
    <line x1="85" y1="12" x2="85" y2="80" class="ray" stroke="#ef4444"/>

    <!-- Bottom prism (45° mirror) -->
    <rect x="55" y="165" width="30" height="2" fill="#6b7280" transform="rotate(-45 70 166)"/>
    <line x1="85" y1="80" x2="85" y2="170" class="ray" stroke="#ef4444"/>
    <line x1="85" y1="170" x2="145" y2="158" class="ray" stroke="#ef4444"/>

    <!-- Eye -->
    <circle cx="155" cy="158" r="8" fill="none" stroke="#374151" stroke-width="1.5"/>
    <text x="170" y="156" class="sublabel">Eye</text>
    <text x="30" y="15" class="sublabel">Object</text>

    <text x="225" y="168" text-anchor="middle" class="sublabel">Two 45° mirrors/prisms</text>
  </g>

  <!-- Total Internal Reflection -->
  <rect x="400" y="55" width="380" height="210" rx="10" class="box"/>
  <text x="590" y="78" text-anchor="middle" class="label">Total Internal Reflection &amp; Optical Fibres</text>
  <g transform="translate(420, 96)">
    <!-- Optical fibre -->
    <rect x="60" y="0" width="250" height="8" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
    
    <!-- Light ray bouncing inside -->
    <path d="M60,4 L120,0 L180,4 L240,0 L300,4" fill="none" stroke="#ef4444" stroke-width="2.5"/>

    <text x="180" y="25" text-anchor="middle" class="label">Optical Fibre</text>
    <text x="180" y="42" text-anchor="middle" class="sublabel">Light bounces along the fibre by total internal reflection</text>

    <rect x="0" y="55" width="330" height="55" rx="6" fill="#fef2f2"/>
    <text x="10" y="73" class="label" fill="#dc2626">Conditions for TIR:</text>
    <text x="10" y="90" class="sublabel">1. Light must travel from denser → less dense medium</text>
    <text x="10" y="106" class="sublabel">2. Angle of incidence must be &gt; critical angle</text>

    <rect x="0" y="118" width="330" height="55" rx="6" fill="#f3f4f6"/>
    <text x="10" y="136" class="label">Uses</text>
    <text x="10" y="152" class="sublabel">• Endoscopes (medical imaging inside body)</text>
    <text x="10" y="168" class="sublabel">• Fibre optic broadband (data as light pulses)</text>
  </g>

  <rect x="20" y="280" width="760" height="45" rx="10" class="box"/>
  <text x="400" y="300" text-anchor="middle" class="sublabel">Periscope: two 45° prisms/mirrors allow seeing over obstacles · Binoculars use prisms to flip inverted image upright</text>
  <text x="400" y="318" text-anchor="middle" class="sublabel">Optical fibres: thin glass/plastic strands · Light travels by TIR · Carries internet data as light pulses · Endoscopes for keyhole surgery</text>
</svg>
