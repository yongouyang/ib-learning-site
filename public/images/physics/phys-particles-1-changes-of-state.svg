<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">Internal Energy and Changes of State</title><desc id="desc">Heating/cooling curve graph showing melting, boiling, freezing and condensing, with the latent heat concept.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}.g{stroke:#e5e7eb;stroke-width:.5}.a{stroke:#374151;stroke-width:2}.p{fill:none;stroke:#ef4444;stroke-width:3}</style></defs><rect width="800" height="380" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Internal Energy and Changes of State</text>

<rect x="20" y="50" width="480" height="250" rx="10" class="b"/><text x="260" y="75" text-anchor="middle" class="l">Heating/Cooling Curve</text>
<g transform="translate(50,92)">
  <line x1="0" y1="0" x2="0" y2="200" class="a"/><line x1="0" y1="200" x2="380" y2="200" class="a"/>
  <line x1="0" y1="40" x2="380" y2="40" class="g"/><line x1="0" y1="80" x2="380" y2="80" class="g"/>
  <line x1="0" y1="120" x2="380" y2="120" class="g"/><line x1="0" y1="160" x2="380" y2="160" class="g"/>
  <line x1="60" y1="0" x2="60" y2="200" class="g"/><line x1="120" y1="0" x2="120" y2="200" class="g"/>
  <line x1="180" y1="0" x2="180" y2="200" class="g"/><line x1="240" y1="0" x2="240" y2="200" class="g"/>
  <line x1="300" y1="0" x2="300" y2="200" class="g"/>

  <line x1="0" y1="190" x2="60" y2="160" class="p"/><text x="20" y="170" class="s" fill="#dc2626">Solid</text>
  <line x1="60" y1="160" x2="120" y2="160" class="p"/><text x="80" y="155" class="s" fill="#dc2626">Melting</text>
  <line x1="120" y1="160" x2="180" y2="100" class="p"/><text x="140" y="120" class="s" fill="#dc2626">Liquid</text>
  <line x1="180" y1="100" x2="240" y2="100" class="p"/><text x="200" y="95" class="s" fill="#dc2626">Boiling</text>
  <line x1="240" y1="100" x2="380" y2="20" class="p"/><text x="300" y="50" class="s" fill="#dc2626">Gas</text>

  <text x="190" y="216" text-anchor="middle" class="s" fill="#374151">Heat added →</text>
  <text x="-5" y="20" text-anchor="end" class="s" fill="#374151">Temp°C</text>

  <rect x="60" y="225" width="300" height="18" rx="4" fill="#fef3c7"/>
  <text x="210" y="238" text-anchor="middle" class="s">Flat sections: energy goes into breaking bonds, NOT raising temperature (latent heat!)</text>
</g>

<rect x="520" y="50" width="260" height="250" rx="10" class="b"/><text x="650" y="75" text-anchor="middle" class="l">State Changes</text>
<g transform="translate(540,92)">
  <rect x="0" y="0" width="220" height="40" rx="6" fill="#fef2f2"/>
  <text x="110" y="18" text-anchor="middle" class="l">Solid → Liquid = Melting</text><text x="110" y="34" text-anchor="middle" class="s">Reverse: freezing/solidification</text>
  <rect x="0" y="46" width="220" height="40" rx="6" fill="#fef2f2"/>
  <text x="110" y="64" text-anchor="middle" class="l">Liquid → Gas = Boiling/Evap.</text><text x="110" y="80" text-anchor="middle" class="s">Reverse: condensing</text>
  <rect x="0" y="92" width="220" height="40" rx="6" fill="#fef2f2"/>
  <text x="110" y="110" text-anchor="middle" class="l">Solid → Gas = Sublimation</text>
  <rect x="0" y="138" width="220" height="60" rx="6" fill="#eff6ff"/>
  <text x="10" y="154" class="l" fill="#3b82f6">Internal Energy</text>
  <text x="10" y="172" class="s">= Kinetic (particle motion) + Potential</text>
  <text x="10" y="186" class="s">(bond positions). ↑ during state changes</text>
</g>

<rect x="20" y="315" width="760" height="50" rx="8" class="b"/><text x="400" y="335" text-anchor="middle" class="s">Latent heat: energy needed to change state without temperature change.</text><text x="400" y="355" text-anchor="middle" class="s">Specific latent heat of fusion (L_f, solid↔liquid) and vaporisation (L_v, liquid↔gas). E = mL</text></svg>
