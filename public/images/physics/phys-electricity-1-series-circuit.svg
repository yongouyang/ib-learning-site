<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Series Circuits</title>
  <desc id="desc">A series circuit diagram with two resistors, an ammeter, voltmeters across each component, and the key rules for series circuits.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 700; fill: #dc2626; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .wire { fill: none; stroke: #374151; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .component { fill: #ffffff; stroke: #374151; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="460" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Series Circuits</text>

  <!-- Circuit diagram -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="420" height="270" rx="10" class="box"/>
    
    <!-- Battery -->
    <g transform="translate(30, 100)">
      <rect x="0" y="20" width="14" height="30" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <rect x="14" y="28" width="8" height="14" rx="1" fill="#ef4444"/>
      <text x="-12" y="40" text-anchor="middle" class="sublabel">6 V</text>
    </g>

    <!-- Wire: battery top to R1 -->
    <line x1="44" y1="100" x2="44" y2="30" class="wire"/>
    <line x1="44" y1="30" x2="150" y2="30" class="wire"/>

    <!-- R1 (resistor) -->
    <g transform="translate(140, 30)">
      <rect x="0" y="0" width="50" height="20" rx="3" class="component"/>
      <text x="25" y="28" text-anchor="middle" class="sublabel" fill="#dc2626">4 Ω</text>
    </g>

    <!-- Wire: R1 to R2 -->
    <line x1="190" y1="40" x2="190" y2="95" class="wire"/>
    <line x1="190" y1="95" x2="240" y2="95" class="wire"/>

    <!-- Ammeter -->
    <g transform="translate(235, 88)">
      <circle cx="20" cy="20" r="16" class="component"/>
      <text x="20" y="24" text-anchor="middle" class="sublabel" fill="#dc2626">A</text>
      <text x="20" y="46" text-anchor="middle" class="sublabel">0.5 A</text>
    </g>

    <!-- Wire: ammeter to R2 -->
    <line x1="271" y1="108" x2="270" y2="130" class="wire"/>

    <!-- R2 -->
    <g transform="translate(245, 128)">
      <rect x="0" y="0" width="50" height="20" rx="3" class="component"/>
      <text x="25" y="28" text-anchor="middle" class="sublabel" fill="#dc2626">8 Ω</text>
    </g>

    <!-- Wire: R2 back to battery -->
    <line x1="295" y1="138" x2="295" y2="235" class="wire"/>
    <line x1="295" y1="235" x2="220" y2="235" class="wire"/>
    
    <!-- V1 voltmeter (across R1) -->
    <g transform="translate(105, 180)">
      <circle cx="16" cy="16" r="14" class="component"/>
      <text x="16" y="20" text-anchor="middle" class="sublabel" fill="#dc2626">V₁</text>
      <text x="16" y="48" text-anchor="middle" class="sublabel">2 V</text>
      <line x1="30" y1="8" x2="45" y2="8" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="30" y1="24" x2="45" y2="35" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- V2 voltmeter (across R2) -->
    <g transform="translate(320, 140)">
      <circle cx="16" cy="16" r="14" class="component"/>
      <text x="16" y="20" text-anchor="middle" class="sublabel" fill="#dc2626">V₂</text>
      <text x="16" y="48" text-anchor="middle" class="sublabel">4 V</text>
      <line x1="0" y1="8" x2="-15" y2="8" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="0" y1="24" x2="-15" y2="14" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Wire: battery bottom back -->
    <line x1="30" y1="235" x2="30" y2="135" class="wire"/>
  </g>

  <!-- Series rules panel -->
  <rect x="470" y="55" width="310" height="270" rx="10" class="box"/>
  <text x="625" y="80" text-anchor="middle" class="label">Series Circuit Rules</text>

  <g transform="translate(490, 98)">
    <rect x="0" y="0" width="270" height="50" rx="6" fill="#fef2f2"/>
    <text x="10" y="18" class="label" fill="#dc2626">1. Current is the SAME everywhere</text>
    <text x="10" y="36" class="sublabel">I₁ = I₂ = I₃ (Ammeter reads same at all points)</text>

    <rect x="0" y="58" width="270" height="50" rx="6" fill="#fef2f2"/>
    <text x="10" y="76" class="label" fill="#dc2626">2. Voltage is SHARED</text>
    <text x="10" y="94" class="sublabel">V_total = V₁ + V₂ + V₃ (6 = 2 + 4)</text>

    <rect x="0" y="116" width="270" height="50" rx="6" fill="#fef2f2"/>
    <text x="10" y="134" class="label" fill="#dc2626">3. Resistance ADDS</text>
    <text x="10" y="152" class="sublabel">R_total = R₁ + R₂ + R₃ (4 + 8 = 12 Ω)</text>

    <rect x="0" y="174" width="270" height="30" rx="6" fill="#fef3c7"/>
    <text x="10" y="193" class="sublabel">⚠ One break → all components stop working</text>
  </g>

  <!-- Bottom summary -->
  <rect x="30" y="340" width="740" height="45" rx="10" class="box"/>
  <text x="400" y="360" text-anchor="middle" class="label">Ammeters connected in SERIES · Voltmeters connected in PARALLEL</text>
  <text x="400" y="376" text-anchor="middle" class="sublabel">More resistors in series → total resistance increases → current decreases</text>
</svg>
