<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Thermal Energy Transfer: Conduction, Convection, Radiation</title>
  <desc id="desc">Three methods of thermal energy transfer: conduction in solids, convection in fluids, and radiation through electromagnetic waves.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="460" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Thermal Energy Transfer</text>

  <!-- Conduction -->
  <rect x="20" y="50" width="240" height="220" rx="10" class="box"/>
  <text x="140" y="75" text-anchor="middle" class="label">Conduction</text>

  <g transform="translate(35, 88)">
    <!-- Metal rod with flame -->
    <rect x="0" y="30" width="200" height="14" rx="7" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
    
    <!-- Flame -->
    <ellipse cx="20" cy="50" rx="12" ry="18" fill="#fca5a5"/>
    <ellipse cx="20" cy="45" rx="8" ry="12" fill="#fbbf24"/>
    <ellipse cx="20" cy="40" rx="5" ry="8" fill="#fef08a"/>

    <!-- Particles vibrating -->
    <circle cx="50" cy="37" r="4" fill="#ef4444" opacity="0.9"/>
    <circle cx="65" cy="37" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="80" cy="37" r="4" fill="#f97316" opacity="0.7"/>
    <circle cx="95" cy="37" r="4" fill="#f97316" opacity="0.6"/>
    <circle cx="110" cy="37" r="4" fill="#fbbf24" opacity="0.5"/>
    <circle cx="125" cy="37" r="4" fill="#fbbf24" opacity="0.4"/>
    <circle cx="140" cy="37" r="4" fill="#eab308" opacity="0.3"/>
    <circle cx="160" cy="37" r="4" fill="#eab308" opacity="0.2"/>

    <text x="20" y="70" text-anchor="middle" class="sublabel" fill="#dc2626">HOT</text>
    <text x="180" y="70" text-anchor="middle" class="sublabel" fill="#3b82f6">COLD</text>

    <text x="100" y="95" text-anchor="middle" class="sublabel">Vibrating particles pass energy</text>
    <text x="100" y="110" text-anchor="middle" class="sublabel">along the rod by collisions</text>

    <rect x="10" y="120" width="180" height="14" rx="4" fill="#fef2f2"/>
    <text x="100" y="131" text-anchor="middle" class="sublabel">Occurs mainly in SOLIDS</text>
  </g>

  <!-- Convection -->
  <rect x="280" y="50" width="240" height="220" rx="10" class="box"/>
  <text x="400" y="75" text-anchor="middle" class="label">Convection</text>

  <g transform="translate(300, 88)">
    <!-- Beaker -->
    <path d="M0,120 L0,20 L80,20 L80,120" fill="#e0f2fe" stroke="#475569" stroke-width="2"/>
    <rect x="-5" y="120" width="90" height="10" rx="2" fill="#475569"/>

    <!-- Flame under beaker -->
    <ellipse cx="40" cy="145" rx="15" ry="22" fill="#fca5a5"/>
    <ellipse cx="40" cy="140" rx="10" ry="15" fill="#fbbf24"/>
    <ellipse cx="40" cy="135" rx="6" ry="10" fill="#fef08a"/>

    <!-- Convection arrows -->
    <path d="M60,50 C70,65 75,80 70,100" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowConv)"/>
    <path d="M20,100 C15,80 10,65 20,50" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowConvBlue)"/>

    <text x="100" y="65" text-anchor="middle" class="sublabel" fill="#dc2626">Hot water Rises</text>
    <text x="100" y="80" text-anchor="middle" class="sublabel" fill="#3b82f6">Cold water Sinks</text>

    <text x="100" y="100" text-anchor="middle" class="sublabel">Cycles form a convection current</text>

    <rect x="-5" y="110" width="110" height="14" rx="4" fill="#eff6ff"/>
    <text x="50" y="121" text-anchor="middle" class="sublabel">Occurs in FLUIDS</text>
  </g>

  <marker id="arrowConv" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L5,8 L10,0" fill="#ef4444"/>
  </marker>
  <marker id="arrowConvBlue" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L5,8 L10,0" fill="#3b82f6"/>
  </marker>

  <!-- Radiation -->
  <rect x="540" y="50" width="240" height="220" rx="10" class="box"/>
  <text x="660" y="75" text-anchor="middle" class="label">Radiation</text>

  <g transform="translate(560, 88)">
    <!-- Sun -->
    <circle cx="100" cy="30" r="22" fill="#fbbf24" stroke="#eab308" stroke-width="2"/>
    <!-- Rays -->
    <line x1="100" y1="8" x2="100" y2="0" stroke="#fbbf24" stroke-width="2"/>
    <line x1="115" y1="15" x2="122" y2="8" stroke="#fbbf24" stroke-width="2"/>
    <line x1="120" y1="30" x2="128" y2="30" stroke="#fbbf24" stroke-width="2"/>
    <line x1="115" y1="45" x2="122" y2="52" stroke="#fbbf24" stroke-width="2"/>
    <line x1="85" y1="15" x2="78" y2="8" stroke="#fbbf24" stroke-width="2"/>
    <line x1="80" y1="30" x2="72" y2="30" stroke="#fbbf24" stroke-width="2"/>
    <line x1="85" y1="45" x2="78" y2="52" stroke="#fbbf24" stroke-width="2"/>

    <!-- Wavy arrows to person -->
    <path d="M80,45 Q65,55 70,70 Q75,85 50,95" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2"/>
    
    <!-- Person absorbing -->
    <circle cx="50" cy="105" r="10" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="115" x2="50" y2="135" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="122" x2="38" y2="132" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="122" x2="62" y2="132" stroke="#374151" stroke-width="2"/>

    <text x="100" y="155" text-anchor="middle" class="sublabel">Infrared waves — no medium needed</text>

    <rect x="10" y="165" width="180" height="14" rx="4" fill="#fef3c7"/>
    <text x="100" y="176" text-anchor="middle" class="sublabel">Can travel through a VACUUM</text>
  </g>

  <!-- Summary -->
  <rect x="20" y="290" width="760" height="155" rx="10" class="box"/>
  <text x="400" y="315" text-anchor="middle" class="label">Summary Comparison</text>

  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="240" height="95" rx="6" fill="#fef2f2"/>
    <text x="120" y="20" text-anchor="middle" class="label" fill="#dc2626">Conduction</text>
    <text x="120" y="38" text-anchor="middle" class="sublabel">Mainly in solids</text>
    <text x="120" y="53" text-anchor="middle" class="sublabel">Vibrating particles collide</text>
    <text x="120" y="68" text-anchor="middle" class="sublabel">Metals = good (free electrons)</text>
    <text x="120" y="83" text-anchor="middle" class="sublabel">Non-metals/gases = poor</text>

    <rect x="260" y="0" width="240" height="95" rx="6" fill="#eff6ff"/>
    <text x="380" y="20" text-anchor="middle" class="label" fill="#3b82f6">Convection</text>
    <text x="380" y="38" text-anchor="middle" class="sublabel">In liquids and gases only</text>
    <text x="380" y="53" text-anchor="middle" class="sublabel">Hot fluid rises, cold sinks</text>
    <text x="380" y="68" text-anchor="middle" class="sublabel">Forms convection currents</text>
    <text x="380" y="83" text-anchor="middle" class="sublabel">Cannot happen in solids</text>

    <rect x="520" y="0" width="200" height="95" rx="6" fill="#fef3c7"/>
    <text x="620" y="20" text-anchor="middle" class="label" fill="#eab308">Radiation</text>
    <text x="620" y="38" text-anchor="middle" class="sublabel">Travels through vacuum</text>
    <text x="620" y="53" text-anchor="middle" class="sublabel">Infrared EM waves</text>
    <text x="620" y="68" text-anchor="middle" class="sublabel">Shiny surfaces = poor</text>
    <text x="620" y="83" text-anchor="middle" class="sublabel">Dull black = best</text>
  </g>
</svg>
