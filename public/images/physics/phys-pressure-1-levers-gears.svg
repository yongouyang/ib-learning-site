<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Levers, Gears and Mechanical Advantage</title>
  <desc id="desc">Lever classes, gear pairs showing how they act as force multipliers and change direction.</desc>
  <defs><style>
    .t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}
    .l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}
    .s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}
    .f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}
    .b{fill:#fff;stroke:#e5e7eb;stroke-width:2}
  </style></defs>
  <rect width="800" height="340" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="t">Levers, Gears and Mechanical Advantage</text>
  <g transform="translate(0,55)"><rect x="20" y="0" width="370" height="240" rx="10" class="b"/><text x="205" y="25" text-anchor="middle" class="l">Lever Classes</text>
    <g transform="translate(40,38)"><text x="160" y="14" text-anchor="middle" class="s">Class 1: Pivot between load and effort (see-saw, scissors)</text>
    <text x="160" y="42" text-anchor="middle" class="s">Class 2: Load between pivot and effort (wheelbarrow)</text>
    <text x="160" y="70" text-anchor="middle" class="s">Class 3: Effort between pivot and load (tweezers, arm)</text>
    <rect x="10" y="90" width="300" height="48" rx="6" fill="#fef2f2"/>
    <text x="160" y="110" text-anchor="middle" class="s">Levers act as force multipliers —</text>
    <text x="160" y="128" text-anchor="middle" class="s">small effort over large distance → large load force</text></g>
    <rect x="410" y="0" width="370" height="240" rx="10" class="b"/><text x="595" y="25" text-anchor="middle" class="l">Gears</text>
    <g transform="translate(430,38)"><circle cx="142" cy="65" r="35" fill="none" stroke="#6b7280" stroke-width="3"/><text x="142" y="70" text-anchor="middle" class="l">20</text>
    <circle cx="230" cy="85" r="55" fill="none" stroke="#6b7280" stroke-width="3"/><text x="230" y="90" text-anchor="middle" class="l">40</text>
    <text x="142" y="120" text-anchor="middle" class="s">Driver</text><text x="230" y="155" text-anchor="middle" class="s">Driven</text>
    <rect x="30" y="170" width="300" height="35" rx="6" fill="#fef2f2"/>
    <text x="180" y="192" text-anchor="middle" class="s">Speed ratio = 2:1 (driver turns twice per driven turn)</text></g>
    <rect x="20" y="258" width="760" height="35" rx="8" class="b"/><text x="400" y="280" text-anchor="middle" class="s">Gears transmit rotation. Small gear driving large gear = force multiplier (low speed, high torque). Large driving small = speed multiplier.</text></g>
</svg>