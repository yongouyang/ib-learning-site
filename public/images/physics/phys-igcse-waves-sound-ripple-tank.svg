<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">The Ripple Tank</title><desc id="desc">Side view of a ripple tank: a lamp above a shallow glass-bottomed tray of water, a vibrating bar producing straight wavefronts, and their shadows on a screen below; plus a top view of plane wavefronts diffracting through a gap between two barriers into semicircular wavefronts of unchanged wavelength.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style><marker id="ahW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="800" height="400" fill="#f9fafb" rx="12"/><text x="400" y="32" text-anchor="middle" class="t">The Ripple Tank</text>
<rect x="20" y="48" width="400" height="296" rx="10" class="b"/><text x="220" y="70" text-anchor="middle" class="l">Side view — making the wavefronts visible</text>
<circle cx="80" cy="100" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="80" y="78" text-anchor="middle" class="s">lamp</text>
<line x1="80" y1="116" x2="150" y2="307" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/><line x1="80" y1="116" x2="300" y2="307" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
<rect x="110" y="150" width="260" height="84" fill="none" stroke="#374151" stroke-width="2"/><rect x="112" y="164" width="256" height="54" fill="#dbeafe"/><line x1="112" y1="164" x2="368" y2="164" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="118" y="130" width="8" height="46" fill="#111827"/><line x1="104" y1="134" x2="104" y2="172" stroke="#6b7280" stroke-width="1.5" marker-start="url(#ahW)" marker-end="url(#ahW)"/>
<line x1="126" y1="134" x2="148" y2="126" stroke="#6b7280" stroke-width="1.5"/><text x="150" y="124" class="s">vibrating bar</text>
<line x1="160" y1="168" x2="160" y2="214" stroke="#2563eb" stroke-width="2"/><line x1="200" y1="168" x2="200" y2="214" stroke="#2563eb" stroke-width="2"/><line x1="240" y1="168" x2="240" y2="214" stroke="#2563eb" stroke-width="2"/><line x1="280" y1="168" x2="280" y2="214" stroke="#2563eb" stroke-width="2"/><line x1="320" y1="168" x2="320" y2="214" stroke="#2563eb" stroke-width="2"/>
<line x1="160" y1="224" x2="200" y2="224" stroke="#dc2626" stroke-width="1.5"/><line x1="160" y1="220" x2="160" y2="228" stroke="#dc2626" stroke-width="1.5"/><line x1="200" y1="220" x2="200" y2="228" stroke="#dc2626" stroke-width="1.5"/><text x="180" y="240" text-anchor="middle" class="s" fill="#dc2626">λ</text>
<text x="340" y="158" text-anchor="middle" class="s">water</text>
<text x="320" y="252" text-anchor="middle" class="s">glass-bottomed tray</text>
<rect x="130" y="300" width="220" height="14" fill="#f3f4f6" stroke="#9ca3af"/><rect x="176" y="300" width="7" height="14" fill="#fde68a"/><rect x="214" y="300" width="7" height="14" fill="#fde68a"/><rect x="252" y="300" width="7" height="14" fill="#fde68a"/><rect x="290" y="300" width="7" height="14" fill="#fde68a"/>
<text x="240" y="332" text-anchor="middle" class="s">screen — bright bands mark the crests</text>
<rect x="440" y="48" width="340" height="296" rx="10" class="b"/><text x="610" y="70" text-anchor="middle" class="l">Top view — diffraction at a gap</text>
<line x1="478" y1="100" x2="478" y2="300" stroke="#2563eb" stroke-width="2"/><line x1="503" y1="100" x2="503" y2="300" stroke="#2563eb" stroke-width="2"/><line x1="528" y1="100" x2="528" y2="300" stroke="#2563eb" stroke-width="2"/><line x1="553" y1="100" x2="553" y2="300" stroke="#2563eb" stroke-width="2"/>
<text x="515" y="92" text-anchor="middle" class="s">plane wavefronts</text>
<rect x="561" y="100" width="12" height="85" fill="#9ca3af" stroke="#4b5563"/><rect x="561" y="215" width="12" height="85" fill="#9ca3af" stroke="#4b5563"/>
<line x1="573" y1="140" x2="594" y2="120" stroke="#6b7280" stroke-width="1.5"/><text x="596" y="116" class="s">barriers</text>
<line x1="573" y1="193" x2="588" y2="178" stroke="#6b7280" stroke-width="1.5"/><text x="590" y="174" class="s">gap</text>
<path d="M 573 172 A 28 28 0 0 1 573 228" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M 573 146 A 54 54 0 0 1 573 254" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M 573 120 A 80 80 0 0 1 573 280" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M 573 94 A 106 106 0 0 1 573 306" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="650" y="318" text-anchor="middle" class="s">semicircular wavefronts — same λ</text>
<rect x="20" y="356" width="760" height="32" rx="8" class="b"/><text x="400" y="376" text-anchor="middle" class="s">The lamp casts shadows of the wavefronts onto the screen; a gap about one wavelength wide gives strong, semicircular diffraction.</text></svg>
