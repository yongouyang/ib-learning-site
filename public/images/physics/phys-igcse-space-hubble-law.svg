<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">Hubble's Law: Recession Speed against Distance</title><desc id="desc">A graph of recession speed against distance for galaxies: a straight line through the origin, with galaxy A at distance d receding at speed v and galaxy B at twice the distance receding at twice the speed. The slope of the line is the Hubble constant H0.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style><marker id="ahK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="800" height="380" fill="#f9fafb" rx="12"/><text x="400" y="30" text-anchor="middle" class="t">Hubble's Law: Recession Speed against Distance</text>
<rect x="20" y="44" width="760" height="280" rx="10" class="b"/>
<line x1="140" y1="280" x2="720" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#ahK)"/><line x1="140" y1="280" x2="140" y2="70" stroke="#374151" stroke-width="2" marker-end="url(#ahK)"/>
<text transform="rotate(-90 62 175)" x="62" y="175" text-anchor="middle" class="l">recession speed v (km/s)</text>
<text x="430" y="312" text-anchor="middle" class="l">distance d (million light-years)</text>
<line x1="140" y1="280" x2="640" y2="110" stroke="#2563eb" stroke-width="2.5"/>
<text x="560" y="96" text-anchor="middle" class="l" fill="#2563eb">v = H₀d</text>
<circle cx="300" cy="226" r="5" fill="#dc2626"/><line x1="300" y1="226" x2="300" y2="280" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="300" y1="226" x2="140" y2="226" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="560" cy="137" r="5" fill="#dc2626"/><line x1="560" y1="137" x2="560" y2="280" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="560" y1="137" x2="140" y2="137" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="314" y="222" class="l">A</text><text x="574" y="133" class="l">B</text>
<text x="300" y="296" text-anchor="middle" class="s">d</text><text x="560" y="296" text-anchor="middle" class="s">2d</text>
<text x="130" y="230" text-anchor="end" class="s">v</text><text x="130" y="141" text-anchor="end" class="s">2v</text><text x="130" y="296" text-anchor="end" class="s">0</text>
<text x="430" y="62" text-anchor="middle" class="s">twice the distance means twice the recession speed</text>
<rect x="20" y="340" width="760" height="30" rx="8" class="b"/><text x="400" y="359" text-anchor="middle" class="s">The slope is the Hubble constant H₀ — and 1/H₀ ≈ 14 billion years estimates the age of the Universe.</text></svg>
