<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="title desc"><title id="title">Dark Matter and Dark Energy</title><desc id="desc">Universe composition: 68% dark energy, 27% dark matter, 5% ordinary matter — pie chart.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="310" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Dark Matter and Dark Energy</text><g transform="translate(0,55)"><rect x="20" y="0" width="370" height="210" rx="10" class="b"/><text x="205" y="25" text-anchor="middle" class="l">Composition of the Universe</text>
  <g transform="translate(40,40)"><circle cx="100" cy="90" r="75" fill="none" stroke="#e5e7eb" stroke-width="75" stroke-dasharray="170 235"/>
  <circle cx="100" cy="90" r="75" fill="none" stroke="#8b5cf6" stroke-width="75" stroke-dasharray="110 295" stroke-dashoffset="-170"/>
  <circle cx="100" cy="90" r="75" fill="none" stroke="#6b7280" stroke-width="75" stroke-dasharray="20 385" stroke-dashoffset="-280"/>
  <text x="200" y="30" class="s">68% Dark Energy</text><text x="200" y="80" class="s">27% Dark Matter</text><text x="200" y="130" class="s">5% Ordinary Matter</text></g>
  <rect x="410" y="0" width="370" height="210" rx="10" class="b"/><text x="595" y="25" text-anchor="middle" class="l">What Are They?</text>
  <g transform="translate(430,40)"><rect x="0" y="0" width="330" height="55" rx="6" fill="#fef2f2"/>
  <text x="10" y="20" class="l" fill="#8b5cf6">Dark Energy:</text><text x="10" y="38" class="s">Mysterious force causing the universe's</text><text x="10" y="52" class="s">expansion to ACCELERATE. 68% of universe.</text>
  <rect x="0" y="62" width="330" height="55" rx="6" fill="#f3f4f6"/>
  <text x="10" y="82" class="l" fill="#6b7280">Dark Matter:</text><text x="10" y="100" class="s">Invisible mass detected only by its</text><text x="10" y="114" class="s">gravitational effects. 27% of universe.</text>
  <rect x="0" y="124" width="330" height="30" rx="6" fill="#fef3c7"/>
  <text x="165" y="144" text-anchor="middle" class="s">The fate of the universe depends on dark energy!</text></g>
  <rect x="20" y="228" width="760" height="40" rx="8" class="b"/><text x="400" y="250" text-anchor="middle" class="l">Everything we can see — stars, planets, galaxies, us — is just 5% of what exists. The other 95% is totally mysterious.</text></g></svg>