<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Space Exploration and Satellites</title><desc id="desc">Comparison of rocket, satellite, and ISS, with uses of artificial satellites.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Space Exploration and Satellites</text><g transform="translate(0,55)"><rect x="20" y="0" width="420" height="240" rx="10" class="b"/><text x="230" y="25" text-anchor="middle" class="l">Artificial Satellites</text>
  <g transform="translate(40,42)"><rect x="0" y="0" width="380" height="60" rx="6" fill="#fef2f2"/>
  <text x="10" y="20" class="l" fill="#dc2626">Communications:</text><text x="10" y="38" class="s">TV broadcast, phones, internet (Starlink)</text><text x="10" y="52" class="s">— often geostationary for fixed dishes</text>
  <rect x="0" y="66" width="380" height="56" rx="6" fill="#eff6ff"/>
  <text x="10" y="84" class="l" fill="#3b82f6">Navigation:</text><text x="10" y="100" class="s">GPS, Galileo, GLONASS — timing signals</text><text x="10" y="114" class="s">allow position calculation</text>
  <rect x="0" y="122" width="380" height="56" rx="6" fill="#f0fdf4"/>
  <text x="10" y="140" class="l" fill="#22c55e">Observation:</text><text x="10" y="156" class="s">Weather, mapping, climate monitoring,</text><text x="10" y="170" class="s">military reconnaissance (spy satellites)</text>
  <rect x="0" y="178" width="380" height="30" rx="6" fill="#fef3c7"/>
  <text x="190" y="198" text-anchor="middle" class="s">ISS: microgravity laboratory, orbits at ~400 km, visible from Earth!</text></g>
  <rect x="460" y="0" width="320" height="240" rx="10" class="b"/><text x="620" y="25" text-anchor="middle" class="l">Milestones</text>
  <g transform="translate(480,42)"><text x="0" y="18" class="s">1957: Sputnik 1 (first satellite, USSR)</text>
  <text x="0" y="42" class="s">1961: Yuri Gagarin (first human in space)</text>
  <text x="0" y="66" class="s">1969: Apollo 11 (first Moon landing)</text>
  <text x="0" y="90" class="s">1990: Hubble Space Telescope launched</text>
  <text x="0" y="114" class="s">1998: ISS construction began</text>
  <text x="0" y="138" class="s">2021: Perseverance rover on Mars</text>
  <text x="0" y="162" class="s">2022: James Webb Space Telescope</text></g>
  <rect x="20" y="258" width="760" height="35" rx="8" class="b"/><text x="400" y="280" text-anchor="middle" class="s">Satellites need to travel at orbital velocity (~7.8 km/s for LEO). Rockets provide the initial thrust to reach this speed and overcome Earth's gravity.</text></g></svg>