<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Pressure in Solids</title>
  <desc id="desc">Pressure = force/area: high heels vs snowshoes showing same force over different areas.</desc>
  <defs><style>
    .t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}
    .l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}
    .s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}
    .f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}
    .b{fill:#fff;stroke:#e5e7eb;stroke-width:2}
  </style></defs>
  <rect width="800" height="340" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="t">Pressure in Solids</text>
  <g transform="translate(0,55)"><rect x="20" y="0" width="370" height="210" rx="10" class="b"/><text x="164" y="17" text-anchor="middle" class="l">High Heel</text><text x="164" y="32" text-anchor="middle" class="s">(Small Area)</text><text x="280" y="17" text-anchor="middle" class="l">Snowshoe</text><text x="280" y="32" text-anchor="middle" class="s">(Large Area)</text>
    <g transform="translate(60,38)"><rect x="80" y="20" width="50" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="100" y="60" width="8" height="30" fill="#ef4444"/><text x="104" y="110" text-anchor="middle" class="s">Area = 1 cm²</text>
    <text x="100" y="135" text-anchor="middle" class="f">P = F/1 → HIGH</text></g>
    <g transform="translate(230,38)"><rect x="0" y="20" width="100" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="10" y="40" width="80" height="12" rx="2" fill="#22c55e"/><text x="50" y="75" text-anchor="middle" class="s">Area = 80 cm²</text>
    <text x="50" y="100" text-anchor="middle" class="f" fill="#22c55e">P = F/80 → LOW</text></g>
    <rect x="420" y="0" width="360" height="210" rx="10" class="b"/><text x="600" y="25" text-anchor="middle" class="l">Pressure Formula</text>
    <g transform="translate(440,38)"><rect x="0" y="0" width="320" height="55" rx="6" fill="#fef2f2"/>
    <text x="160" y="20" text-anchor="middle" class="f">P = F / A</text><text x="160" y="40" text-anchor="middle" class="s">Pressure (Pa) = Force (N) ÷ Area (m²) · 1 Pa = 1 N/m²</text>
    <rect x="0" y="62" width="320" height="78" rx="6" fill="#f3f4f6"/>
    <text x="10" y="78" class="s">Large area → low pressure:</text><text x="10" y="94" class="s">snowshoes, wide tyres, foundations</text>
    <text x="10" y="114" class="s">Small area → high pressure:</text><text x="10" y="130" class="s">blade edges, drawing pins, high heels</text></g>
    <rect x="20" y="225" width="760" height="45" rx="8" class="b"/><text x="400" y="247" text-anchor="middle" class="l">Same force over a smaller area gives higher pressure — a drawing pin concentrates force onto a tiny point, so it pierces!</text></g>
</svg>