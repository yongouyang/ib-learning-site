<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">Electrical Power and Energy</title>
  <desc id="desc">Power triangle showing P = VI, I²R, and V²/R, with a worked example calculating energy cost in kilowatt-hours.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; fill: #dc2626; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="430" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Electrical Power and Energy</text>

  <!-- Power formulas panel -->
  <rect x="20" y="50" width="370" height="220" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Power Formulas</text>

  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="330" height="40" rx="6" fill="#fef2f2"/>
    <text x="165" y="18" text-anchor="middle" class="formula">P = V × I</text>
    <text x="165" y="34" text-anchor="middle" class="sublabel">Power (W) = Voltage (V) × Current (A)</text>

    <rect x="0" y="48" width="330" height="40" rx="6" fill="#fef2f2"/>
    <text x="165" y="66" text-anchor="middle" class="formula">P = I² × R</text>
    <text x="165" y="82" text-anchor="middle" class="sublabel">Power (W) = Current² (A²) × Resistance (Ω)</text>

    <rect x="0" y="96" width="330" height="40" rx="6" fill="#fef2f2"/>
    <text x="165" y="114" text-anchor="middle" class="formula">P = V² / R</text>
    <text x="165" y="130" text-anchor="middle" class="sublabel">Power (W) = Voltage² (V²) ÷ Resistance (Ω)</text>

    <rect x="0" y="144" width="330" height="30" rx="6" fill="#fef3c7"/>
    <text x="165" y="163" text-anchor="middle" class="sublabel">Energy: E = Pt = VIt (joules, J)</text>
  </g>

  <!-- Energy cost panel -->
  <rect x="410" y="50" width="370" height="220" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">Worked Example: Cost of Electricity</text>

  <g transform="translate(430, 95)">
    <rect x="0" y="0" width="330" height="28" rx="6" fill="#f3f4f6"/>
    <text x="165" y="19" text-anchor="middle" class="label">2 kW heater used for 3 hours</text>

    <text x="10" y="55" class="sublabel">Energy = power (kW) × time (h)</text>
    <text x="10" y="70" class="sublabel">Energy = 2 kW × 3 h = 6 kWh</text>

    <rect x="0" y="82" width="330" height="28" rx="6" fill="#fef2f2"/>
    <text x="10" y="100" class="sublabel" fill="#dc2626">Cost = 6 kWh × £0.30/kWh = £1.80</text>

    <rect x="0" y="120" width="330" height="55" rx="6" fill="#f3f4f6"/>
    <text x="10" y="138" class="label">Appliance Power Comparison</text>
    <text x="10" y="154" class="sublabel">LED bulb: 10 W | Kettle: 2200 W | Oven: 3000 W</text>
    <text x="10" y="168" class="sublabel">Shower: 8500 W | Phone charger: 5 W</text>
  </g>

  <!-- Energy triangle -->
  <rect x="20" y="290" width="370" height="125" rx="10" class="box"/>
  <text x="205" y="315" text-anchor="middle" class="label">Energy Transfer Triangle</text>
  <g transform="translate(115, 328)">
    <text x="45" y="30" text-anchor="middle" class="formula">E</text>
    <text x="10" y="72" text-anchor="middle" class="label">P</text>
    <text x="80" y="72" text-anchor="middle" class="label">t</text>
    <line x1="22" y1="22" x2="2" y2="62" stroke="#d1d5db" stroke-width="2"/>
    <line x1="68" y1="22" x2="88" y2="62" stroke="#d1d5db" stroke-width="2"/>
    <line x1="2" y1="62" x2="88" y2="62" stroke="#d1d5db" stroke-width="2"/>
  </g>
  <text x="205" y="400" text-anchor="middle" class="sublabel">E = Pt, P = E/t, t = E/P</text>

  <!-- Key conversion -->
  <rect x="410" y="290" width="370" height="125" rx="10" class="box"/>
  <text x="595" y="315" text-anchor="middle" class="label">Unit Conversion</text>
  <g transform="translate(430, 330)">
    <text x="0" y="16" class="label">1 kilowatt-hour (kWh) =</text>
    <text x="0" y="36" class="formula">1000 W × 3600 s = 3,600,000 J</text>
    <rect x="0" y="48" width="330" height="28" rx="6" fill="#fef3c7"/>
    <text x="165" y="67" text-anchor="middle" class="sublabel">1 unit of electricity on your bill = 1 kWh</text>
  </g>
</svg>
