<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Buoyancy and Archimedes Principle</title>
  <desc id="desc">Submerged object showing upthrust equals weight of displaced fluid, with density comparison for floating vs sinking.</desc>
  <defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs>
  <rect width="800" height="340" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="t">Buoyancy and Archimedes Principle</text>
  <rect x="20" y="55" width="460" height="240" rx="10" class="b"/><text x="250" y="78" text-anchor="middle" class="l">Archimedes Principle</text>
  <g transform="translate(40,100)"><rect x="10" y="40" width="350" height="140" rx="6" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="80" y="60" width="120" height="80" rx="6" fill="#fbbf24" stroke="#eab308" stroke-width="2"/>
  <line x1="140" y1="140" x2="140" y2="165" stroke="#ef4444" stroke-width="2.5" marker-end="url(#aD2)"/>
  <text x="155" y="162" class="s" fill="#dc2626">Weight (down)</text>
  <line x1="140" y1="60" x2="140" y2="35" stroke="#22c55e" stroke-width="2.5" marker-end="url(#aU2)"/>
  <text x="155" y="40" class="s" fill="#22c55e">Upthrust (up)</text>
  <text x="150" y="25" class="f" fill="#dc2626">Upthrust = weight of fluid displaced!</text>
  <text x="220" y="100" class="s">Upthrust &gt; weight → floats</text>
  <text x="220" y="116" class="s">Upthrust &lt; weight → sinks</text></g>
  <rect x="500" y="55" width="280" height="240" rx="10" class="b"/><text x="640" y="78" text-anchor="middle" class="l">Floating vs Sinking</text>
  <g transform="translate(520,100)"><rect x="0" y="0" width="240" height="80" rx="6" fill="#f3f4f6"/>
  <text x="10" y="20" class="l">Floating:</text><text x="10" y="38" class="s">Object density &lt; fluid density</text>
  <text x="10" y="56" class="s">Upthrust = weight (displaces enough water)</text>
  <text x="10" y="74" class="s">Example: wood, ship (steel but hollow!)</text>
  <rect x="0" y="88" width="240" height="50" rx="6" fill="#fff1f2"/>
  <text x="10" y="106" class="l" fill="#dc2626">Sinking:</text><text x="10" y="122" class="s">Object density &gt; fluid density</text>
  <text x="10" y="138" class="s">Upthrust &lt; weight (can't displace enough)</text></g>
  <marker id="aD2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L5,8 L9,2" fill="#ef4444"/></marker>
  <marker id="aU2" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,8 L5,2 L9,8" fill="#22c55e"/></marker>
  <rect x="20" y="305" width="760" height="35" rx="4" class="b"/><text x="400" y="318" text-anchor="middle" class="s">A steel ship floats because it is hollow — its average density (including air) is less than water.</text><text x="400" y="335" text-anchor="middle" class="s">The shape displaces a huge volume of water → large upthrust.</text>
</svg>