<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Critical Angle and Total Internal Reflection</title><desc id="desc">Three panels showing a ray of light travelling upwards inside glass towards the glass-air boundary: below the critical angle the ray refracts out away from the normal; at the critical angle of 42 degrees the refracted ray runs along the boundary; above the critical angle the ray is totally internally reflected back into the glass.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="800" height="360" fill="#f9fafb" rx="12"/><text x="400" y="30" text-anchor="middle" class="t">Critical Angle and Total Internal Reflection</text>
<rect x="20" y="48" width="240" height="232" rx="10" class="b"/><text x="140" y="68" text-anchor="middle" class="l">i less than c</text>
<rect x="40" y="170" width="200" height="88" fill="#dbeafe"/><line x1="40" y1="170" x2="240" y2="170" stroke="#374151" stroke-width="2"/><line x1="140" y1="88" x2="140" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="52" y="92" class="s">air</text><rect x="46" y="226" width="42" height="18" rx="3" fill="#f9fafb"/><text x="67" y="239" text-anchor="middle" class="s">glass</text>
<line x1="110" y1="250" x2="140" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="140" y1="170" x2="190" y2="90" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/>
<rect x="94" y="222" width="18" height="16" rx="3" fill="#f9fafb"/><text x="103" y="235" text-anchor="middle" class="s">i</text>
<rect x="146" y="112" width="18" height="16" rx="3" fill="#f9fafb"/><text x="155" y="125" text-anchor="middle" class="s">r</text>
<text x="140" y="270" text-anchor="middle" class="s">light refracts out, away from the normal</text>
<rect x="280" y="48" width="240" height="232" rx="10" class="b"/><text x="400" y="68" text-anchor="middle" class="l">i = c = 42°</text>
<rect x="300" y="170" width="200" height="88" fill="#dbeafe"/><line x1="300" y1="170" x2="500" y2="170" stroke="#374151" stroke-width="2"/><line x1="400" y1="88" x2="400" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="312" y="92" class="s">air</text><rect x="306" y="226" width="42" height="18" rx="3" fill="#f9fafb"/><text x="327" y="239" text-anchor="middle" class="s">glass</text>
<line x1="328" y1="250" x2="400" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="400" y1="170" x2="496" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/>
<rect x="366" y="226" width="18" height="16" rx="3" fill="#f9fafb"/><text x="375" y="239" text-anchor="middle" class="s">c</text>
<text x="400" y="270" text-anchor="middle" class="s">refracted ray runs along the boundary</text>
<rect x="540" y="48" width="240" height="232" rx="10" class="b"/><text x="660" y="68" text-anchor="middle" class="l">i greater than c</text>
<rect x="560" y="170" width="200" height="88" fill="#dbeafe"/><line x1="560" y1="170" x2="760" y2="170" stroke="#374151" stroke-width="2"/><line x1="660" y1="88" x2="660" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="572" y="92" class="s">air</text><rect x="566" y="226" width="42" height="18" rx="3" fill="#f9fafb"/><text x="587" y="239" text-anchor="middle" class="s">glass</text>
<line x1="565" y1="250" x2="660" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="660" y1="170" x2="755" y2="250" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/>
<rect x="600" y="226" width="18" height="16" rx="3" fill="#f9fafb"/><text x="609" y="239" text-anchor="middle" class="s">i</text>
<rect x="690" y="226" width="18" height="16" rx="3" fill="#f9fafb"/><text x="699" y="239" text-anchor="middle" class="s">r</text>
<text x="660" y="270" text-anchor="middle" class="s">all light reflects back inside (i = r)</text>
<rect x="20" y="292" width="760" height="56" rx="8" class="b"/><text x="400" y="314" text-anchor="middle" class="s">Glass with n = 1.5 has c ≈ 42° (from n = 1/sin c). Below c, light refracts out into the air; at c, it runs along the boundary;</text><text x="400" y="332" text-anchor="middle" class="s">above c, total internal reflection sends it all back into the glass — the principle of optical fibres.</text></svg>
