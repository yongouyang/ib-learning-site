<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Big Bang and Expanding Universe</title><desc id="desc">Balloon analogy for universal expansion, redshift of distant galaxies, and CMB radiation.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Big Bang and Expanding Universe</text><g transform="translate(0,55)"><rect x="20" y="0" width="460" height="240" rx="10" class="b"/><text x="250" y="25" text-anchor="middle" class="l">Expanding Universe — Balloon Analogy</text>
  <g transform="translate(40,42)"><circle cx="110" cy="80" r="40" fill="#fef3c7" stroke="#eab308" stroke-width="2"/>
  <circle cx="95" cy="65" r="4" fill="#ef4444"/><circle cx="120" cy="70" r="4" fill="#3b82f6"/>
  <circle cx="105" cy="85" r="4" fill="#22c55e"/><circle cx="125" cy="90" r="4" fill="#f97316"/>
  <text x="110" y="135" text-anchor="middle" class="s">Before</text>
  <circle cx="270" cy="80" r="70" fill="#fef3c7" stroke="#eab308" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="250" cy="55" r="5" fill="#ef4444"/><circle cx="285" cy="60" r="5" fill="#3b82f6"/>
  <circle cx="265" cy="85" r="5" fill="#22c55e"/><circle cx="295" cy="95" r="5" fill="#f97316"/>
  <text x="270" y="165" text-anchor="middle" class="s">After (galaxies move apart!)</text>
  <line x1="150" y1="80" x2="195" y2="80" stroke="#dc2626" stroke-width="3" marker-end="url(#aR)"/></g>
  <rect x="500" y="0" width="280" height="240" rx="10" class="b"/><text x="640" y="25" text-anchor="middle" class="l">Evidence</text>
  <g transform="translate(520,42)"><rect x="0" y="0" width="240" height="90" rx="6" fill="#f3f4f6"/>
  <text x="10" y="20" class="l">Redshift:</text><text x="10" y="40" class="s">Light from distant galaxies is shifted to longer (redder) wavelengths → moving away from us!</text>
  <text x="10" y="60" class="s">More distant galaxy = greater redshift = faster recession (Hubble's Law)</text>
  <rect x="0" y="96" width="240" height="55" rx="6" fill="#fef3c7"/>
  <text x="10" y="114" class="l">Cosmic Microwave Background:</text><text x="10" y="134" class="s">Leftover heat from Big Bang (~2.7 K), discovered 1965 — nearly uniform in all directions</text></g>
  <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L8,5 L0,9" fill="#dc2626"/></marker>
  <rect x="20" y="258" width="760" height="35" rx="8" class="b"/><text x="400" y="280" text-anchor="middle" class="s">Big Bang: ~13.8 billion years ago, all matter and energy was concentrated in a single point. The universe has been expanding and cooling ever since. Not an explosion IN space — it created space itself.</text></g></svg>