<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Light as a Transverse Wave</title>
  <desc id="desc">Labelled diagram of a transverse wave showing wavelength, amplitude, crest, trough, and the wave equation v = fλ.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; fill: #dc2626; }
      .wave { fill: none; stroke: #ef4444; stroke-width: 3; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="380" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Light as a Transverse Wave</text>

  <!-- Wave diagram -->
  <rect x="20" y="55" width="500" height="220" rx="10" class="box"/>
  <text x="270" y="78" text-anchor="middle" class="label">Transverse Wave Properties</text>

  <g transform="translate(50, 100)">
    <!-- Wave (sine curve) -->
    <path d="M0,80 Q40,0 80,80 Q120,160 160,80 Q200,0 240,80 Q280,160 320,80 Q360,0 400,80" class="wave"/>
    
    <!-- Rest position line -->
    <line x1="0" y1="80" x2="420" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6,3"/>

    <!-- Crest marker -->
    <line x1="40" y1="0" x2="40" y2="80" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="40" y="-8" text-anchor="middle" class="sublabel" fill="#22c55e">Crest</text>

    <!-- Trough marker -->
    <line x1="120" y1="160" x2="120" y2="80" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="120" y="178" text-anchor="middle" class="sublabel" fill="#f97316">Trough</text>

    <!-- Amplitude arrow -->
    <line x1="180" y1="80" x2="180" y2="5" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="176" y1="10" x2="184" y2="10" stroke="#3b82f6" stroke-width="1"/>
    <text x="195" y="48" class="sublabel" fill="#3b82f6">Amplitude (A)</text>

    <!-- Wavelength arrow -->
    <line x1="40" y1="-45" x2="200" y2="-45" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="40" y1="-50" x2="40" y2="-40" stroke="#dc2626" stroke-width="1"/>
    <line x1="200" y1="-50" x2="200" y2="-40" stroke="#dc2626" stroke-width="1"/>
    <text x="120" y="-58" text-anchor="middle" class="sublabel" fill="#dc2626">Wavelength (λ)</text>

    <!-- Oscillation direction -->
    <line x1="350" y1="80" x2="350" y2="0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aU)"/>
    <line x1="350" y1="80" x2="350" y2="160" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aD)"/>
    <text x="365" y="82" class="sublabel" fill="#dc2626">Vibration ↑↓</text>

    <!-- Energy direction -->
    <line x1="380" y1="100" x2="415" y2="100" stroke="#22c55e" stroke-width="2" marker-end="url(#aR3)"/>
    <text x="395" y="93" class="sublabel" fill="#22c55e">Energy →</text>
  </g>

  <marker id="aU" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,8 L5,2 L9,8" fill="#dc2626"/></marker>
  <marker id="aD" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L5,8 L9,2" fill="#dc2626"/></marker>
  <marker id="aR3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L8,5 L0,9" fill="#22c55e"/></marker>

  <!-- Wave equation -->
  <rect x="540" y="55" width="240" height="220" rx="10" class="box"/>
  <text x="660" y="78" text-anchor="middle" class="label">Wave Equation</text>

  <g transform="translate(560, 95)">
    <rect x="0" y="0" width="200" height="45" rx="6" fill="#fef2f2"/>
    <text x="100" y="20" text-anchor="middle" class="formula">v = f × λ</text>
    <text x="100" y="38" text-anchor="middle" class="sublabel">Speed = frequency × wavelength</text>

    <rect x="0" y="55" width="200" height="60" rx="6" fill="#f3f4f6"/>
    <text x="10" y="72" class="label">Units</text>
    <text x="10" y="88" class="sublabel">v: m/s (metres per second)</text>
    <text x="10" y="104" class="sublabel">f: Hz (hertz, per second)</text>
    <text x="10" y="120" class="sublabel">λ: m (metres)</text>

    <rect x="0" y="125" width="200" height="65" rx="6" fill="#eff6ff"/>
    <text x="10" y="143" class="label" fill="#3b82f6">Key Points</text>
    <text x="10" y="160" class="sublabel">• Light is a transverse wave</text>
    <text x="10" y="176" class="sublabel">• Vibration ⟂ to direction of travel</text>
    <text x="10" y="192" class="sublabel">• Speed of light c = 3×10⁸ m/s</text>
  </g>

  <rect x="20" y="295" width="760" height="35" rx="8" class="box"/>
  <text x="400" y="317" text-anchor="middle" class="sublabel">Light = electromagnetic transverse wave · Does not need a medium · Travels at 300,000 km/s in vacuum · Frequency determines colour</text>
</svg>
