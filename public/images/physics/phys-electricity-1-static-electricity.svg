<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Static Electricity (Electrostatics)</title>
  <desc id="desc">Diagram showing charge transfer by friction between a plastic rod and cloth, with the rod gaining electrons and attracting small paper pieces.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .electron { fill: #ef4444; }
      .proton { fill: #3b82f6; }
    </style>
  </defs>

  <rect width="800" height="440" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Static Electricity (Electrostatics)</text>

  <!-- Charging by friction -->
  <rect x="20" y="50" width="370" height="210" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Charging by Friction</text>

  <!-- Before friction -->
  <g transform="translate(40, 90)">
    <text x="80" y="14" text-anchor="middle" class="sublabel">Before rubbing</text>

    <!-- Rod -->
    <rect x="45" y="10" width="70" height="16" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="40" text-anchor="middle" class="sublabel">Plastic rod</text>

    <!-- Cloth -->
    <rect x="30" y="50" width="100" height="35" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="80" y="72" text-anchor="middle" class="sublabel">Cloth</text>

    <!-- Neutral charges on rod -->
    <circle cx="60" cy="18" r="3" class="proton"/><text x="60" y="20" text-anchor="middle" class="sublabel" fill="white" font-size="7">+</text>
    <circle cx="73" cy="18" r="3" class="electron"/>
    <circle cx="83" cy="18" r="3" class="proton"/><text x="83" y="20" text-anchor="middle" class="sublabel" fill="white" font-size="7">+</text>
    <circle cx="96" cy="18" r="3" class="electron"/>

    <text x="80" y="100" text-anchor="middle" class="sublabel">Both neutral (equal + and −)</text>
  </g>

  <!-- After friction (right side) -->
  <g transform="translate(190, 90)">
    <text x="80" y="0" text-anchor="middle" class="sublabel">After rubbing</text>

    <!-- Rod (negatively charged) -->
    <rect x="45" y="10" width="70" height="16" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="55" cy="18" r="3" class="electron"/>
    <circle cx="65" cy="18" r="3" class="electron"/>
    <circle cx="75" cy="18" r="3" class="electron"/>
    <circle cx="85" cy="18" r="3" class="electron"/>
    <circle cx="95" cy="18" r="3" class="electron"/>
    <text x="80" y="40" text-anchor="middle" class="sublabel" fill="#dc2626">Rod: − charged</text>

    <!-- Cloth (positively charged) -->
    <rect x="30" y="50" width="100" height="35" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="55" cy="68" r="3" class="proton"/><text x="55" y="70" text-anchor="middle" class="sublabel" fill="white" font-size="7">+</text>
    <circle cx="70" cy="68" r="3" class="proton"/><text x="70" y="70" text-anchor="middle" class="sublabel" fill="white" font-size="7">+</text>
    <circle cx="85" cy="68" r="3" class="proton"/><text x="85" y="70" text-anchor="middle" class="sublabel" fill="white" font-size="7">+</text>
    <text x="80" y="100" text-anchor="middle" class="sublabel" fill="#3b82f6">Cloth: + charged</text>

    <!-- Arrow showing electron transfer -->
    <path d="M20,68 C20,40 140,40 140,68" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowE)"/>
    <text x="80" y="130" text-anchor="middle" class="sublabel" fill="#dc2626">e⁻ transferred from cloth → rod</text>
  </g>

  <marker id="arrowE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0,1 L8,5 L0,9" fill="#ef4444"/>
  </marker>

  <!-- Attraction/Repulsion -->
  <rect x="410" y="50" width="370" height="210" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">Like Charges Repel · Unlike Charges Attract</text>

  <g transform="translate(440, 92)">
    <!-- Repulsion -->
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#fef2f2"/>
    <text x="75" y="18" text-anchor="middle" class="sublabel" fill="#dc2626">Repulsion</text>
    <circle cx="40" cy="48" r="14" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="40" y="53" text-anchor="middle" class="sublabel" font-size="14">−</text>
    <circle cx="110" cy="48" r="14" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="53" text-anchor="middle" class="sublabel" font-size="14">−</text>
    <line x1="55" y1="35" x2="40" y2="20" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="55" y1="60" x2="40" y2="75" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="95" y1="35" x2="110" y2="20" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="95" y1="60" x2="110" y2="75" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Attraction -->
    <rect x="170" y="0" width="150" height="70" rx="6" fill="#eff6ff"/>
    <text x="245" y="18" text-anchor="middle" class="sublabel" fill="#3b82f6">Attraction</text>
    <circle cx="210" cy="48" r="14" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="53" text-anchor="middle" class="sublabel" font-size="14">−</text>
    <circle cx="280" cy="48" r="14" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="53" text-anchor="middle" class="sublabel" font-size="14">+</text>
    <line x1="225" y1="48" x2="265" y2="48" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <g transform="translate(440, 180)">
    <text x="150" y="10" text-anchor="middle" class="label">Charged rod attracts neutral paper</text>
  </g>

  <!-- Uses and dangers -->
  <rect x="20" y="280" width="370" height="145" rx="10" class="box"/>
  <text x="205" y="305" text-anchor="middle" class="label">Uses of Electrostatics</text>
  <g transform="translate(40, 320)">
    <text x="0" y="14" class="sublabel">• Photocopiers/printer: toner attracted to charged drum</text>
    <text x="0" y="30" class="sublabel">• Electrostatic paint spraying: charged droplets → earthed car body</text>
    <text x="0" y="46" class="sublabel">• Electrostatic precipitators: remove smoke particles</text>
    <text x="0" y="62" class="sublabel">• Crop spraying: charged droplets wrap around plants</text>
  </g>

  <rect x="410" y="280" width="370" height="145" rx="10" class="box"/>
  <text x="595" y="305" text-anchor="middle" class="label">Dangers and Precautions</text>
  <g transform="translate(430, 320)">
    <text x="0" y="14" class="sublabel" fill="#dc2626">• Sparks near flammable vapours (petrol stations)</text>
    <text x="0" y="30" class="sublabel" fill="#dc2626">• Electrostatic discharge damages electronics</text>
    <text x="0" y="50" class="label" fill="#22c55e">Precautions:</text>
    <text x="0" y="66" class="sublabel">• Earthing straps on fuel tankers</text>
    <text x="0" y="82" class="sublabel">• Anti-static wrist straps for electronics work</text>
  </g>
</svg>
