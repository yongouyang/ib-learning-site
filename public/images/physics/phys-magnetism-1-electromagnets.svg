<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Electromagnets</title>
  <desc id="desc">Diagram of an electromagnet: a wire coil wrapped around an iron core, connected to a battery, attracting iron filings.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="380" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Electromagnets</text>

  <!-- Electromagnet diagram -->
  <rect x="20" y="50" width="450" height="230" rx="10" class="box"/>
  <text x="245" y="75" text-anchor="middle" class="label">Simple Electromagnet</text>

  <g transform="translate(40, 92)">
    <!-- Iron core -->
    <rect x="80" y="20" width="150" height="20" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    
    <!-- Coil (wire wrapped around) -->
    <path d="M90,20 L90,50 L100,50 L100,20 L110,20 L110,50 L120,50 L120,20 L130,20 L130,50 L140,50 L140,20 L150,20 L150,50 L160,50 L160,20 L170,20 L170,50 L180,50 L180,20 L190,20 L190,50 L200,50 L200,20 L210,20 L210,50 L220,50 L220,20" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Battery -->
    <rect x="220" y="80" width="15" height="30" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="228" y="124" text-anchor="middle" class="sublabel">Battery</text>

    <!-- Wires to battery -->
    <line x1="90" y1="40" x2="70" y2="40" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="70" y1="40" x2="70" y2="95" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="70" y1="95" x2="220" y2="95" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="220" y1="40" x2="235" y2="40" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="235" y1="40" x2="235" y2="95" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- N/S labels -->
    <text x="75" y="15" class="label" fill="#dc2626">N</text>
    <text x="230" y="15" class="label" fill="#3b82f6">S</text>

    <!-- Iron filings being attracted -->
    <g fill="#6b7280">
      <rect x="20" y="25" width="4" height="8" rx="1" transform="rotate(-20 22 29)"/>
      <rect x="10" y="35" width="4" height="8" rx="1" transform="rotate(-10 12 39)"/>
      <rect x="28" y="18" width="4" height="8" rx="1"/>
    </g>

    <text x="180" y="140" text-anchor="middle" class="label" fill="#dc2626">How it works:</text>
    <text x="180" y="156" text-anchor="middle" class="sublabel">Current through coil → magnetic field</text>
    <text x="180" y="172" text-anchor="middle" class="sublabel">Iron core concentrates the field (becomes magnetised)</text>
  </g>

  <!-- Properties -->
  <rect x="490" y="50" width="290" height="230" rx="10" class="box"/>
  <text x="635" y="75" text-anchor="middle" class="label">Properties of Electromagnets</text>
  <g transform="translate(510, 92)">
    <rect x="0" y="0" width="250" height="95" rx="6" fill="#fef2f2"/>
    <text x="10" y="18" class="label" fill="#dc2626">Ways to Increase Strength:</text>
    <text x="10" y="36" class="sublabel">1. Increase current (more amps)</text>
    <text x="10" y="54" class="sublabel">2. More turns of wire in the coil</text>
    <text x="10" y="72" class="sublabel">3. Use an iron core (not steel)</text>
    <text x="10" y="90" class="sublabel">4. Coils closer together</text>

    <rect x="0" y="102" width="250" height="95" rx="6" fill="#eff6ff"/>
    <text x="10" y="120" class="label" fill="#3b82f6">Advantages over Permanent Magnets</text>
    <text x="10" y="138" class="sublabel">• Can be switched ON and OFF</text>
    <text x="10" y="156" class="sublabel">• Strength can be varied (current)</text>
    <text x="10" y="174" class="sublabel">• Poles can be reversed (reverse current)</text>
    <text x="10" y="192" class="sublabel">• Uses: scrapyard cranes, relays, doorbells</text>
  </g>

  <rect x="20" y="300" width="760" height="35" rx="8" class="box"/>
  <text x="400" y="322" text-anchor="middle" class="sublabel">An electromagnet is a temporary magnet: when current stops, magnetism disappears. Steel core would retain magnetism — use soft iron instead.</text>
</svg>
