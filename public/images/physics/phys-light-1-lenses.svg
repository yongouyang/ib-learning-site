<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Convex and Concave Lenses</title>
  <desc id="desc">Ray diagrams for a convex (converging) lens and a concave (diverging) lens, showing focal points and image formation.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .ray { fill: none; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="400" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Convex and Concave Lenses</text>

  <!-- Convex lens -->
  <rect x="20" y="50" width="370" height="230" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Convex (Converging) Lens</text>

  <g transform="translate(40, 88)">
    <!-- Principal axis -->
    <line x1="0" y1="80" x2="320" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Lens -->
    <path d="M150,20 Q170,80 150,140 L150,140 Q170,80 150,20" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>

    <!-- Focal points -->
    <circle cx="90" cy="80" r="3" fill="#dc2626"/>
    <text x="90" y="95" text-anchor="middle" class="sublabel" fill="#dc2626">F</text>
    <circle cx="210" cy="80" r="3" fill="#dc2626"/>
    <text x="210" y="95" text-anchor="middle" class="sublabel" fill="#dc2626">F'</text>

    <!-- Parallel ray -->
    <line x1="20" y1="40" x2="150" y2="40" class="ray" stroke="#ef4444"/>
    <line x1="150" y1="40" x2="210" y2="80" class="ray" stroke="#ef4444"/>

    <!-- Through centre ray -->
    <line x1="20" y1="80" x2="320" y2="80" class="ray" stroke="#22c55e"/>
    <line x1="150" y1="80" x2="320" y2="80" stroke="#22c55e" stroke-width="2"/>

    <text x="280" y="73" class="sublabel" fill="#22c55e">Converges</text>
    <text x="160" y="160" text-anchor="middle" class="sublabel">Focal length f (positive)</text>
    <text x="160" y="175" text-anchor="middle" class="sublabel">Used in: magnifying glass, cameras, eyes</text>
  </g>

  <!-- Concave lens -->
  <rect x="410" y="50" width="370" height="230" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">Concave (Diverging) Lens</text>

  <g transform="translate(430, 88)">
    <line x1="0" y1="80" x2="320" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Lens (concave) -->
    <path d="M150,20 Q130,80 150,140 L150,140 Q130,80 150,20" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>

    <!-- Focal point (virtual) -->
    <circle cx="90" cy="80" r="3" fill="#dc2626"/>
    <text x="90" y="95" text-anchor="middle" class="sublabel" fill="#dc2626">F</text>

    <!-- Parallel ray in, diverges out -->
    <line x1="20" y1="40" x2="150" y2="40" class="ray" stroke="#ef4444"/>
    <line x1="150" y1="40" x2="220" y2="20" class="ray" stroke="#ef4444"/>
    <!-- Virtual extension -->
    <line x1="150" y1="40" x2="90" y2="80" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="90" y1="80" x2="70" y2="95" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Through centre -->
    <line x1="40" y1="120" x2="300" y2="40" class="ray" stroke="#22c55e"/>

    <text x="250" y="20" class="sublabel" fill="#ef4444">Diverges</text>
    <text x="160" y="160" text-anchor="middle" class="sublabel">Focal length f (negative)</text>
    <text x="160" y="175" text-anchor="middle" class="sublabel">Used in: correcting short-sightedness</text>
  </g>

  <!-- Summary -->
  <rect x="20" y="300" width="760" height="85" rx="10" class="box"/>
  <text x="400" y="322" text-anchor="middle" class="label">Real vs Virtual Images · Magnification = image height / object height</text>
  <text x="400" y="342" text-anchor="middle" class="sublabel">Convex: can form real images (on screen) or virtual (magnifier) · Concave: always virtual, upright, smaller</text>
  <text x="400" y="360" text-anchor="middle" class="sublabel">Lens formula: 1/f = 1/u + 1/v · Power (D) = 1/f (metres)</text>
</svg>
