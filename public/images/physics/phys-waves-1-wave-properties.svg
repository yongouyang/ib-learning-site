<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Wave Properties</title><desc id="desc">Labelled transverse wave showing amplitude, wavelength, crest, trough, and wave equation v=fλ.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Wave Properties</text><g transform="translate(0,55)"><rect x="20" y="0" width="520" height="240" rx="10" class="b"/><text x="280" y="25" text-anchor="middle" class="l">Transverse Wave</text>
  <g transform="translate(50,40)"><path d="M0,80 Q40,0 80,80 Q120,160 160,80 Q200,0 240,80 Q280,160 320,80 Q360,0 400,80" fill="none" stroke="#ef4444" stroke-width="3"/>
  <line x1="0" y1="80" x2="420" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="40" y1="0" x2="40" y2="80" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/><text x="40" y="-5" text-anchor="middle" class="s" fill="#22c55e">Crest</text>
  <line x1="120" y1="160" x2="120" y2="80" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2"/><text x="120" y="175" text-anchor="middle" class="s" fill="#f97316">Trough</text>
  <line x1="200" y1="40" x2="200" y2="80" stroke="#3b82f6" stroke-width="1.5"/><text x="200" y="32" text-anchor="middle" class="s" fill="#3b82f6">Amplitude</text>
  <line x1="40" y1="-30" x2="200" y2="-30" stroke="#dc2626" stroke-width="1.5"/><line x1="40" y1="-30" x2="40" y2="-23" stroke="#dc2626" stroke-width="1.5"/><line x1="200" y1="-30" x2="200" y2="-23" stroke="#dc2626" stroke-width="1.5"/><text x="120" y="-38" text-anchor="middle" class="s" fill="#dc2626">Wavelength λ</text></g>
  <rect x="560" y="0" width="220" height="240" rx="10" class="b"/><text x="670" y="25" text-anchor="middle" class="l">Wave Equation</text>
  <g transform="translate(580,42)"><rect x="0" y="0" width="180" height="80" rx="6" fill="#fef2f2"/>
  <text x="90" y="22" text-anchor="middle" class="f">v = fλ</text><text x="90" y="44" text-anchor="middle" class="s">Speed = frequency × wavelength</text>
  <text x="90" y="66" text-anchor="middle" class="s">v (m/s) · f (Hz) · λ (m)</text></g>
  <rect x="20" y="258" width="760" height="35" rx="8" class="b"/><text x="400" y="280" text-anchor="middle" class="s">Frequency = number of complete waves passing per second. Period T = 1/f. Wave speed depends on the medium, not the source.</text></g></svg>