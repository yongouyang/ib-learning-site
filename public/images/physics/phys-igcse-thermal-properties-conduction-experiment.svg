<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Comparing thermal conductors — wax and pin experiment</title>
  <desc id="desc">Rods of copper, aluminium, iron and glass project from a heated water bath, each with a drawing pin stuck to its far end by wax. The pin has fallen from the copper rod and is tilting on the aluminium rod, showing copper is the best conductor of the four.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-size: 12px; fill: #1f2937; }
      .small { font-size: 11px; fill: #4b5563; }
      .note { font-size: 12px; fill: #4b5563; }
      .rod { stroke: #374151; stroke-width: 1; }
      .wax { fill: #fef08a; stroke: #ca8a04; stroke-width: 1; }
      .pin { stroke: #374151; stroke-width: 2; }
      .pinhead { fill: #374151; }
    </style>
    <marker id="heatArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#f8fafc" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Comparing thermal conductors — the wax and pin experiment</text>

  <rect x="30" y="55" width="840" height="345" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Leader chip -->
  <rect x="290" y="70" width="320" height="26" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="450" y="88" text-anchor="middle" class="small">thermal energy travels along the rods from the hot water</text>
  <line x1="450" y1="96" x2="450" y2="186" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Water bath -->
  <rect x="70" y="170" width="150" height="160" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <path d="M78,192 q10,-7 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="262" text-anchor="middle" class="label" fill="#1d4ed8">hot water</text>
  <!-- rising heat in the bath -->
  <line x1="108" y1="310" x2="108" y2="230" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#heatArrow)"/>
  <line x1="180" y1="310" x2="180" y2="230" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#heatArrow)"/>

  <!-- Bunsen burner -->
  <polygon points="133,356 157,356 145,332" fill="#f97316"/>
  <line x1="145" y1="356" x2="145" y2="372" stroke="#374151" stroke-width="2"/>
  <line x1="125" y1="372" x2="165" y2="372" stroke="#374151" stroke-width="2"/>
  <text x="145" y="392" text-anchor="middle" class="small">Bunsen burner</text>

  <!-- Rods -->
  <rect x="210" y="190" width="430" height="12" fill="#d97706" class="rod"/>
  <rect x="210" y="240" width="430" height="12" fill="#9ca3af" class="rod"/>
  <rect x="210" y="290" width="430" height="12" fill="#6b7280" class="rod"/>
  <rect x="210" y="340" width="430" height="12" fill="#93c5fd" opacity="0.75" class="rod"/>

  <!-- Rod labels -->
  <text x="655" y="200" class="label">copper — best conductor</text>
  <text x="655" y="250" class="label">aluminium</text>
  <text x="655" y="300" class="label">iron</text>
  <text x="655" y="350" class="label">glass — insulator (pin stays)</text>

  <!-- Copper: wax melted flat, pin has fallen -->
  <ellipse cx="560" cy="205" rx="10" ry="4" class="wax"/>
  <circle cx="398" cy="382" r="3.5" class="pinhead"/>
  <line x1="402" y1="382" x2="424" y2="382" class="pin"/>
  <text x="413" y="397" text-anchor="middle" class="small">pin has fallen (copper first)</text>

  <!-- Aluminium: wax softening, pin tilting -->
  <g transform="rotate(20 560 254)">
    <ellipse cx="560" cy="254" rx="7" ry="7" class="wax"/>
    <circle cx="560" cy="264" r="3.5" class="pinhead"/>
    <line x1="560" y1="268" x2="560" y2="284" class="pin"/>
  </g>

  <!-- Iron: pin still hanging -->
  <ellipse cx="560" cy="306" rx="7" ry="8" class="wax"/>
  <circle cx="560" cy="317" r="3.5" class="pinhead"/>
  <line x1="560" y1="321" x2="560" y2="336" class="pin"/>

  <!-- Glass: pin untouched -->
  <ellipse cx="560" cy="356" rx="7" ry="8" class="wax"/>
  <circle cx="560" cy="367" r="3.5" class="pinhead"/>
  <line x1="560" y1="371" x2="560" y2="386" class="pin"/>

  <!-- Result notes -->
  <text x="40" y="424" class="note">Result: the pin drops from the copper rod first, then aluminium, then iron — copper is the best conductor.</text>
  <text x="40" y="446" class="note">In a metal, energy is carried by lattice vibrations and by free electrons moving through the structure.</text>
</svg>
