<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Resultant Forces in Sport and Transport</title>
  <desc id="desc">Three panels showing forces on a cyclist, a braking car, and a runner, with arrows for driving force, drag, friction, weight, and reaction force.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .ground { stroke: #9ca3af; stroke-width: 3; }
    </style>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L8,5 L0,9" fill="#ef4444"/></marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M8,1 L0,5 L8,9" fill="#3b82f6"/></marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,8 L5,0 L9,8" fill="#10b981"/></marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L5,10 L9,2" fill="#f59e0b"/></marker>
  </defs>

  <rect width="900" height="480" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Resultant Forces in Sport and Transport</text>

  <!-- Panel 1: Cyclist -->
  <rect x="20" y="60" width="270" height="310" rx="10" class="box"/>
  <text x="155" y="88" text-anchor="middle" class="label" fill="#dc2626">Cyclist at constant speed</text>

  <g transform="translate(40, 105)">
    <!-- Cyclist body -->
    <circle cx="85" cy="35" r="10" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="45" x2="85" y2="85" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="60" x2="55" y2="40" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="60" x2="115" y2="40" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="85" x2="60" y2="120" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="85" x2="110" y2="120" stroke="#374151" stroke-width="2"/>

    <!-- Bike -->
    <circle cx="55" cy="130" r="22" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="115" cy="130" r="22" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="55" y1="130" x2="85" y2="80" stroke="#374151" stroke-width="2"/>
    <line x1="115" y1="130" x2="85" y2="80" stroke="#374151" stroke-width="2"/>
    <line x1="70" y1="130" x2="100" y2="130" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="80" x2="100" y2="120" stroke="#374151" stroke-width="2"/>

    <!-- Ground -->
    <line x1="0" y1="155" x2="230" y2="155" class="ground"/>

    <!-- Forces -->
    <line x1="100" y1="80" x2="160" y2="80" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrR)"/>
    <text x="175" y="76" class="sublabel" fill="#dc2626">Driving force</text>

    <line x1="70" y1="95" x2="20" y2="95" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrL)"/>
    <text x="15" y="90" class="sublabel" fill="#3b82f6">Drag + friction</text>

    <line x1="85" y1="45" x2="85" y2="10" stroke="#10b981" stroke-width="2" marker-end="url(#arrU)"/>
    <text x="95" y="20" class="sublabel" fill="#059669">Normal reaction</text>

    <line x1="85" y1="85" x2="85" y2="125" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrD)"/>
    <text x="95" y="120" class="sublabel" fill="#d97706">Weight</text>

    <rect x="20" y="170" width="190" height="50" rx="6" fill="#fef2f2"/>
    <text x="115" y="190" text-anchor="middle" class="sublabel" fill="#dc2626">Forces balanced</text>
    <text x="115" y="208" text-anchor="middle" class="sublabel">Resultant = 0</text>
  </g>

  <!-- Panel 2: Braking car -->
  <rect x="315" y="60" width="270" height="310" rx="10" class="box"/>
  <text x="450" y="88" text-anchor="middle" class="label" fill="#dc2626">Car braking hard</text>

  <g transform="translate(335, 105)">
    <!-- Car -->
    <rect x="50" y="80" width="130" height="50" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="75" y="55" width="75" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="80" cy="135" r="14" fill="#374151"/>
    <circle cx="150" cy="135" r="14" fill="#374151"/>

    <!-- Ground -->
    <line x1="0" y1="155" x2="230" y2="155" class="ground"/>

    <!-- Forces -->
    <line x1="80" y1="110" x2="80" y2="145" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrD)"/>
    <text x="90" y="140" class="sublabel" fill="#d97706">Weight</text>

    <line x1="150" y1="100" x2="150" y2="60" stroke="#10b981" stroke-width="2" marker-end="url(#arrU)"/>
    <text x="160" y="70" class="sublabel" fill="#059669">Normal reaction</text>

    <line x1="55" y1="105" x2="15" y2="105" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrL)"/>
    <text x="5" y="95" class="sublabel" fill="#3b82f6">Braking friction</text>

    <line x1="175" y1="95" x2="175" y2="55" stroke="#ef4444" stroke-width="2" marker-end="url(#arrU)"/>
    <text x="185" y="50" class="sublabel" fill="#dc2626">Motion</text>

    <!-- Brake marks -->
    <line x1="30" y1="155" x2="5" y2="155" stroke="#1f2937" stroke-width="3" stroke-dasharray="6,4"/>
    <line x1="200" y1="155" x2="225" y2="155" stroke="#1f2937" stroke-width="3" stroke-dasharray="6,4"/>

    <rect x="20" y="170" width="190" height="50" rx="6" fill="#fef2f2"/>
    <text x="115" y="190" text-anchor="middle" class="sublabel" fill="#dc2626">Resultant force backwards</text>
    <text x="115" y="208" text-anchor="middle" class="sublabel">Car decelerates</text>
  </g>

  <!-- Panel 3: Runner -->
  <rect x="610" y="60" width="270" height="310" rx="10" class="box"/>
  <text x="745" y="88" text-anchor="middle" class="label" fill="#dc2626">Runner starting to sprint</text>

  <g transform="translate(630, 105)">
    <!-- Runner body -->
    <circle cx="90" cy="30" r="10" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="90" y1="40" x2="90" y2="80" stroke="#374151" stroke-width="2"/>
    <line x1="90" y1="55" x2="60" y2="35" stroke="#374151" stroke-width="2"/>
    <line x1="90" y1="55" x2="120" y2="40" stroke="#374151" stroke-width="2"/>
    <line x1="90" y1="80" x2="65" y2="120" stroke="#374151" stroke-width="2"/>
    <line x1="90" y1="80" x2="115" y2="120" stroke="#374151" stroke-width="2"/>

    <!-- Ground -->
    <line x1="0" y1="130" x2="230" y2="130" class="ground"/>

    <!-- Forces -->
    <line x1="70" y1="115" x2="40" y2="115" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrL)"/>
    <text x="10" y="126" class="sublabel" fill="#3b82f6">Foot pushes ground BACK</text>

    <line x1="95" y1="55" x2="165" y2="55" stroke="#ef4444" stroke-width="3" marker-end="url(#arrR)"/>
    <text x="245" y="48" text-anchor="end" class="sublabel" fill="#dc2626">Ground pushes runner</text>
    <text x="245" y="62" text-anchor="end" class="sublabel" fill="#dc2626">FORWARD</text>

    <line x1="90" y1="85" x2="90" y2="115" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrD)"/>
    <text x="100" y="110" class="sublabel" fill="#d97706">Weight</text>

    <line x1="125" y1="115" x2="125" y2="90" stroke="#10b981" stroke-width="2" marker-end="url(#arrU)"/>
    <text x="140" y="90" class="sublabel" fill="#059669">Normal reaction</text>

    <rect x="20" y="150" width="190" height="55" rx="6" fill="#fef2f2"/>
    <text x="115" y="170" text-anchor="middle" class="sublabel" fill="#dc2626">Newton's Third Law pair</text>
    <text x="115" y="188" text-anchor="middle" class="sublabel">Equal and opposite forces</text>
    <text x="115" y="206" text-anchor="middle" class="sublabel">on DIFFERENT objects</text>
  </g>

  <!-- Bottom summary -->
  <rect x="20" y="390" width="860" height="75" rx="10" class="box"/>
  <text x="450" y="415" text-anchor="middle" class="label">Key Idea</text>
  <text x="450" y="440" text-anchor="middle" class="sublabel">The resultant force determines whether an object accelerates, decelerates, or stays at constant velocity.</text>
  <text x="450" y="458" text-anchor="middle" class="sublabel">Balanced forces → constant velocity. Unbalanced forces → acceleration in the direction of the resultant force.</text>
</svg>
