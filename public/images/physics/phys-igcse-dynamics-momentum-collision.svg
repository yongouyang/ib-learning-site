<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Conservation of momentum</title>
  <desc id="desc">A 2 kg trolley moving at 3 m/s collides with a stationary 1 kg trolley and they stick together, moving off at 2 m/s. Total momentum is 6 kilogram metres per second both before and after the collision.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; }
      .trolley { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2; }
      .vel { stroke: #dc2626; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="800" height="380" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Conservation of Momentum — a Collision</text>

  <!-- Before panel -->
  <rect x="20" y="50" width="370" height="250" rx="10" class="panel"/>
  <text x="205" y="75" text-anchor="middle" class="label">Before</text>
  <rect x="60" y="175" width="70" height="42" rx="4" class="trolley"/>
  <circle cx="78" cy="223" r="7" fill="#64748b"/>
  <circle cx="112" cy="223" r="7" fill="#64748b"/>
  <text x="95" y="201" text-anchor="middle" class="label">2 kg</text>
  <line x1="138" y1="196" x2="198" y2="196" class="vel"/>
  <polygon points="208,196 194,190 194,202" fill="#dc2626"/>
  <text x="168" y="186" text-anchor="middle" class="sublabel">3 m/s</text>
  <rect x="270" y="175" width="70" height="42" rx="4" class="trolley"/>
  <circle cx="288" cy="223" r="7" fill="#64748b"/>
  <circle cx="322" cy="223" r="7" fill="#64748b"/>
  <text x="305" y="201" text-anchor="middle" class="label">1 kg</text>
  <text x="305" y="246" text-anchor="middle" class="sublabel">at rest</text>
  <text x="205" y="278" text-anchor="middle" class="sublabel">total momentum = (2 × 3) + (1 × 0) = 6 kg·m/s</text>

  <!-- After panel -->
  <rect x="410" y="50" width="370" height="250" rx="10" class="panel"/>
  <text x="595" y="75" text-anchor="middle" class="label">After — they stick together</text>
  <rect x="470" y="175" width="112" height="42" rx="4" class="trolley"/>
  <circle cx="490" cy="223" r="7" fill="#64748b"/>
  <circle cx="526" cy="223" r="7" fill="#64748b"/>
  <circle cx="562" cy="223" r="7" fill="#64748b"/>
  <text x="526" y="201" text-anchor="middle" class="label">3 kg</text>
  <line x1="590" y1="196" x2="650" y2="196" class="vel"/>
  <polygon points="660,196 646,190 646,202" fill="#dc2626"/>
  <text x="620" y="186" text-anchor="middle" class="sublabel">2 m/s</text>
  <text x="595" y="278" text-anchor="middle" class="sublabel">total momentum = 3 × 2 = 6 kg·m/s</text>

  <!-- Bottom summary strip -->
  <rect x="20" y="315" width="760" height="48" rx="8" class="panel"/>
  <text x="400" y="337" text-anchor="middle" class="label">total momentum before = total momentum after</text>
  <text x="400" y="355" text-anchor="middle" class="sublabel">(2 × 3) + (1 × 0) = (2 + 1) × v, so v = 6 ÷ 3 = 2 m/s</text>
</svg>
