<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">Balanced and Unbalanced Forces</title>
  <desc id="desc">Free body diagrams showing balanced forces (stationary box, constant velocity) and unbalanced forces (accelerating box), plus common force types.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="430" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Balanced and Unbalanced Forces</text>

  <!-- Balanced forces -->
  <rect x="20" y="50" width="370" height="190" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label" fill="#22c55e">Balanced Forces</text>

  <g transform="translate(40, 88)">
    <!-- Box on surface -->
    <rect x="80" y="20" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>

    <!-- Weight down -->
    <line x1="125" y1="75" x2="125" y2="110" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrD2)"/>
    <text x="135" y="98" class="sublabel" fill="#dc2626">W = mg ↓</text>

    <!-- Normal reaction up -->
    <line x1="100" y1="15" x2="100" y2="-20" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrU)"/>
    <text x="105" y="-2" class="sublabel" fill="#22c55e">N ↑</text>

    <!-- Equal sign -->
    <text x="70" y="55" text-anchor="middle" class="formula" font-size="24">=</text>

    <!-- Resultant zero -->
    <rect x="170" y="20" width="160" height="50" rx="6" fill="#f0fdf4"/>
    <text x="250" y="42" text-anchor="middle" class="label" fill="#22c55e">F_res = 0</text>
    <text x="250" y="58" text-anchor="middle" class="sublabel">Stationary or constant velocity</text>

    <text x="200" y="120" text-anchor="middle" class="sublabel">Forces cancel out — no change in motion</text>
  </g>

  <!-- Unbalanced forces -->
  <rect x="410" y="50" width="370" height="190" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label" fill="#dc2626">Unbalanced Forces</text>

  <g transform="translate(430, 88)">
    <!-- Box -->
    <rect x="60" y="20" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>

    <!-- Driving force right (bigger) -->
    <line x1="60" y1="45" x2="20" y2="45" stroke="#22c55e" stroke-width="3" marker-end="url(#arrL2)"/>
    <text x="30" y="38" class="sublabel" fill="#22c55e">8 N ←</text>

    <!-- Friction right (smaller) -->
    <line x1="150" y1="45" x2="190" y2="45" stroke="#ef4444" stroke-width="2" marker-end="url(#arrR2)"/>
    <text x="160" y="38" class="sublabel" fill="#dc2626">3 N →</text>

    <!-- Resultant -->
    <line x1="60" y1="80" x2="20" y2="80" stroke="#dc2626" stroke-width="4" marker-end="url(#arrL5)"/>
    <text x="95" y="98" text-anchor="middle" class="label" fill="#dc2626">F_res = 5 N ← (accelerates)</text>

    <text x="140" y="120" text-anchor="middle" class="sublabel">Net force causes acceleration in its direction</text>
  </g>

  <marker id="arrD2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,2 L5,8 L9,2" fill="#ef4444"/></marker>
  <marker id="arrU" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,8 L5,2 L9,8" fill="#22c55e"/></marker>
  <marker id="arrR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L8,5 L0,9" fill="#ef4444"/></marker>
  <marker id="arrL2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M8,1 L0,5 L8,9" fill="#22c55e"/></marker>
  <marker id="arrL5" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M8,1 L0,5 L8,9" fill="#dc2626"/></marker>

  <!-- Force types -->
  <rect x="20" y="260" width="450" height="155" rx="10" class="box"/>
  <text x="245" y="285" text-anchor="middle" class="label">Common Forces</text>
  <g transform="translate(40, 298)">
    <rect x="0" y="0" width="200" height="22" rx="4" fill="#fef2f2"/>
    <text x="10" y="15" class="sublabel">Weight: W = mg (downwards)</text>

    <rect x="0" y="26" width="200" height="22" rx="4" fill="#fef2f2"/>
    <text x="10" y="41" class="sublabel">Normal reaction (surface push)</text>

    <rect x="0" y="52" width="200" height="22" rx="4" fill="#fef2f2"/>
    <text x="10" y="67" class="sublabel">Tension (in ropes/strings)</text>

    <rect x="220" y="0" width="200" height="22" rx="4" fill="#fef2f2"/>
    <text x="230" y="15" class="sublabel">Friction (opposes motion)</text>

    <rect x="220" y="26" width="200" height="22" rx="4" fill="#fef2f2"/>
    <text x="230" y="41" class="sublabel">Air resistance/drag</text>

    <rect x="220" y="52" width="200" height="22" rx="4" fill="#fef2f2"/>
    <text x="230" y="67" class="sublabel">Driving force (engine thrust)</text>
  </g>

  <!-- Free body diagram guide -->
  <rect x="490" y="260" width="290" height="155" rx="10" class="box"/>
  <text x="635" y="285" text-anchor="middle" class="label">Drawing Free Body Diagrams</text>
  <g transform="translate(510, 300)">
    <text x="0" y="14" class="sublabel">1. Represent object as a point/box</text>
    <text x="0" y="32" class="sublabel">2. Draw arrows for ALL forces</text>
    <text x="0" y="50" class="sublabel">3. Arrow length ∝ force magnitude</text>
    <text x="0" y="68" class="sublabel">4. Label each force clearly</text>
    <text x="0" y="86" class="sublabel">5. Find resultant = vector sum</text>
  </g>
</svg>
