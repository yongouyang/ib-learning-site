<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">The National Grid</title><desc id="desc">Diagram showing the National Grid: power station → step-up transformer → high voltage pylons → step-down transformer → homes.</desc><defs><style>.title{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.label{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.sub{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.box{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="380" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="title">The National Grid and Power Transmission</text>

<rect x="20" y="50" width="760" height="250" rx="10" class="box"/><text x="400" y="75" text-anchor="middle" class="label">How Electricity Gets from Power Station to Your Home</text>
<g transform="translate(30,92)">
  <rect x="0" y="15" width="70" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="35" y="35" text-anchor="middle" class="sub">Power</text><text x="35" y="50" text-anchor="middle" class="sub">Station</text>
  <text x="35" y="78" text-anchor="middle" class="sub">25 kV</text>

  <line x1="70" y1="40" x2="130" y2="40" stroke="#374151" stroke-width="2.5"/>
  <polygon points="130,35 140,40 130,45" fill="#374151"/>

  <rect x="145" y="10" width="60" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="175" y="35" text-anchor="middle" class="sub">Step-Up</text><text x="175" y="50" text-anchor="middle" class="sub">Transformer</text>
  <text x="175" y="78" text-anchor="middle" class="sub" fill="#dc2626">→ 400 kV</text>

  <line x1="205" y1="40" x2="270" y2="40" stroke="#374151" stroke-width="2.5"/>
  <polygon points="270,35 280,40 270,45" fill="#374151"/>

  <rect x="285" y="5" width="100" height="15" rx="3" fill="#fbbf24"/><text x="335" y="16" text-anchor="middle" class="sub">High-voltage pylons</text>
  <rect x="285" y="60" width="100" height="15" rx="3" fill="#fbbf24"/><text x="335" y="71" text-anchor="middle" class="sub">(low current = less heat loss)</text>

  <line x1="385" y1="40" x2="450" y2="40" stroke="#374151" stroke-width="2.5"/>
  <polygon points="450,35 460,40 450,45" fill="#374151"/>

  <rect x="465" y="10" width="60" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="495" y="35" text-anchor="middle" class="sub">Step-Down</text><text x="495" y="50" text-anchor="middle" class="sub">Transformer</text>
  <text x="495" y="78" text-anchor="middle" class="sub" fill="#3b82f6">→ 230 V</text>

  <line x1="525" y1="40" x2="580" y2="40" stroke="#374151" stroke-width="2.5"/>
  <polygon points="580,35 590,40 580,45" fill="#374151"/>

  <rect x="595" y="15" width="70" height="50" rx="6" fill="#fef3c7" stroke="#eab308" stroke-width="2"/>
  <text x="630" y="35" text-anchor="middle" class="sub">Homes,</text><text x="630" y="50" text-anchor="middle" class="sub">Schools</text>

  <!-- Why high voltage -->
  <rect x="100" y="120" width="520" height="80" rx="8" fill="#fef2f2"/>
  <text x="360" y="144" text-anchor="middle" class="label" fill="#dc2626">Why Use High Voltage in Transmission?</text>
  <text x="360" y="162" text-anchor="middle" class="sub">Power loss in cables: P_loss = I²R</text>
  <text x="360" y="180" text-anchor="middle" class="sub">High voltage → Low current → Much less heat lost in cables!</text>
  <text x="360" y="196" text-anchor="middle" class="sub">Example: 400,000V at 100A instead of 25,000V at 1600A for same power</text>
</g>

<rect x="20" y="318" width="760" height="35" rx="8" class="box"/><text x="400" y="340" text-anchor="middle" class="sub">The National Grid is a network of cables and transformers connecting power stations to consumers across the whole country</text></svg>
