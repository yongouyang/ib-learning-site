<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Boyle's law graphs</title>
  <desc id="desc">Two graphs for a fixed mass of gas at constant temperature: pressure against volume is a smooth falling curve, and pressure against 1 over volume is a straight line through the origin, showing p is proportional to 1 over V.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #111827; }
      .heading { font-size: 13px; font-weight: 600; fill: #1f2937; }
      .label { font-size: 12px; fill: #374151; }
      .small { font-size: 11px; fill: #64748b; }
      .axis { stroke: #334155; stroke-width: 1.6; }
      .ticklabel { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="900" height="430" fill="#f8fafc" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Boyle's law — fixed mass of gas at constant temperature</text>

  <!-- Left panel: p against V -->
  <rect x="40" y="55" width="400" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="240" y="82" text-anchor="middle" class="heading">Pressure against volume</text>
  <line x1="110" y1="320" x2="110" y2="105" class="axis"/>
  <line x1="110" y1="320" x2="405" y2="320" class="axis"/>
  <text x="98" y="100" class="label">p</text>
  <text x="257" y="345" text-anchor="middle" class="label">volume V</text>
  <text transform="rotate(-90 66 212)" x="66" y="212" text-anchor="middle" class="label">pressure</text>
  <path d="M110,130 C126,200 142,230 158,244 C174,258 190,270 206,282 C226,296 240,299 254,301 C272,304 288,309 302,312 C318,315 336,318 350,320" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- marked point V1, p1 -->
  <circle cx="206" cy="282" r="4" fill="#2563eb"/>
  <line x1="206" y1="282" x2="206" y2="320" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="110" y1="282" x2="206" y2="282" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="206" y="336" text-anchor="middle" class="ticklabel">V₁</text>
  <text x="102" y="286" text-anchor="end" class="ticklabel">p₁</text>
  <!-- chip -->
  <rect x="190" y="105" width="150" height="26" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="265" y="123" text-anchor="middle" class="label" fill="#1d4ed8">p × V = constant</text>
  <text x="340" y="165" text-anchor="middle" class="small">halving V doubles p</text>

  <!-- Right panel: p against 1/V -->
  <rect x="470" y="55" width="400" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="670" y="82" text-anchor="middle" class="heading">Pressure against 1/volume</text>
  <line x1="540" y1="320" x2="540" y2="105" class="axis"/>
  <line x1="540" y1="320" x2="835" y2="320" class="axis"/>
  <text x="528" y="100" class="label">p</text>
  <text x="687" y="345" text-anchor="middle" class="label">1/V</text>
  <text transform="rotate(-90 496 212)" x="496" y="212" text-anchor="middle" class="label">pressure</text>
  <line x1="540" y1="320" x2="810" y2="142" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="540" cy="320" r="4" fill="#2563eb"/>
  <text x="528" y="336" text-anchor="end" class="ticklabel">0</text>
  <!-- chip -->
  <rect x="595" y="105" width="230" height="26" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="710" y="123" text-anchor="middle" class="label" fill="#1d4ed8">straight line through the origin</text>
  <text x="690" y="285" text-anchor="middle" class="small">shows p is proportional to 1/V</text>

  <text x="450" y="412" text-anchor="middle" class="small">Core skill: use p₁V₁ = p₂V₂ for calculations — the mass of gas and the temperature must stay constant.</text>
</svg>
