<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Sound Waves</title><desc id="desc">How sound travels as longitudinal compression/rarefaction in air, with ear diagram.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Sound Waves</text><g transform="translate(0,55)"><rect x="20" y="0" width="520" height="240" rx="10" class="b"/><text x="280" y="25" text-anchor="middle" class="l">Sound as Longitudinal Waves</text>
  <g transform="translate(40,42)">
  <circle cx="10" cy="50" r="6" fill="#3b82f6"/><circle cx="25" cy="50" r="6" fill="#3b82f6"/><circle cx="38" cy="50" r="6" fill="#3b82f6"/>
  <circle cx="60" cy="50" r="6" fill="#3b82f6"/><circle cx="72" cy="50" r="6" fill="#3b82f6"/><circle cx="82" cy="50" r="6" fill="#3b82f6"/>
  <circle cx="100" cy="50" r="6" fill="#3b82f6"/><circle cx="110" cy="50" r="6" fill="#3b82f6"/>
  <circle cx="130" cy="50" r="6" fill="#3b82f6"/><circle cx="142" cy="50" r="6" fill="#3b82f6"/>
  <circle cx="170" cy="50" r="6" fill="#3b82f6"/><circle cx="185" cy="50" r="6" fill="#3b82f6"/><circle cx="195" cy="50" r="6" fill="#3b82f6"/>
  <text x="45" y="40" class="s" fill="#dc2626">Compression</text><text x="140" y="40" class="s" fill="#dc2626">Rarefaction</text>
  <rect x="210" y="20" width="280" height="80" rx="6" fill="#f3f4f6"/>
  <text x="350" y="40" text-anchor="middle" class="l">Properties of Sound</text>
  <text x="350" y="58" text-anchor="middle" class="s">• Speed in air: ~340 m/s (depends on temperature)</text>
  <text x="350" y="74" text-anchor="middle" class="s">• Faster in solids/liquids than gases</text>
  <text x="350" y="90" text-anchor="middle" class="s">• Cannot travel through vacuum (no medium!)</text>
  <text x="350" y="115" text-anchor="middle" class="s">Human hearing range: 20 Hz – 20,000 Hz</text></g>
  <rect x="560" y="0" width="220" height="240" rx="10" class="b"/><text x="670" y="25" text-anchor="middle" class="l">Speed of Sound</text>
  <g transform="translate(580,42)"><rect x="-10" y="0" width="200" height="80" rx="6" fill="#fef2f2"/>
  <text x="90" y="22" text-anchor="middle" class="f">v = d / t</text>
  <text x="90" y="44" text-anchor="middle" class="s">Use echo method: v = 2d/t</text>
  <text x="90" y="66" text-anchor="middle" class="s">Measure wall distance, clap, time echo</text></g>
  <rect x="20" y="258" width="760" height="35" rx="8" class="b"/><text x="400" y="280" text-anchor="middle" class="s">Sound reflects to form echoes (sonar, ultrasound imaging). Ultrasound = sound &gt;20 kHz — used in medical scanning and industrial testing.</text></g></svg>