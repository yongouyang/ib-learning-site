<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Speed, Velocity and Acceleration Graphs</title>
  <desc id="desc">Distance-time and velocity-time graphs showing constant speed, stationary, acceleration, and deceleration with labelled gradients and areas.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .grid { stroke: #e5e7eb; stroke-width: 0.5; }
      .axis { stroke: #374151; stroke-width: 2; }
      .plot { stroke: #ef4444; stroke-width: 3; fill: none; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="420" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Speed, Velocity and Acceleration Graphs</text>

  <!-- Distance-time graph -->
  <rect x="20" y="50" width="370" height="215" rx="10" class="box"/>
  <text x="205" y="73" text-anchor="middle" class="label">Distance-Time Graph</text>

  <g transform="translate(50, 82)">
    <line x1="0" y1="0" x2="0" y2="140" class="grid"/><line x1="40" y1="0" x2="40" y2="140" class="grid"/>
    <line x1="80" y1="0" x2="80" y2="140" class="grid"/><line x1="120" y1="0" x2="120" y2="140" class="grid"/>
    <line x1="160" y1="0" x2="160" y2="140" class="grid"/>
    <line x1="0" y1="0" x2="160" y2="0" class="grid"/><line x1="0" y1="35" x2="160" y2="35" class="grid"/>
    <line x1="0" y1="70" x2="160" y2="70" class="grid"/><line x1="0" y1="105" x2="160" y2="105" class="grid"/>
    <line x1="0" y1="140" x2="160" y2="140" class="axis"/><line x1="0" y1="0" x2="0" y2="140" class="axis"/>

    <!-- Constant speed (straight line) -->
    <line x1="0" y1="105" x2="80" y2="35" class="plot"/>
    <text x="35" y="58" class="sublabel" fill="#dc2626">Constant speed</text>

    <!-- Stationary (horizontal) -->
    <line x1="80" y1="35" x2="120" y2="35" stroke="#3b82f6" stroke-width="3"/>
    <text x="88" y="28" class="sublabel" fill="#3b82f6">Stationary</text>

    <!-- Acceleration (curving up) -->
    <path d="M120,35 Q150,50 160,10" class="plot"/>
    <text x="125" y="18" class="sublabel" fill="#dc2626">Acceleration</text>

    <text x="80" y="156" text-anchor="middle" class="sublabel" fill="#374151">Time</text>
    <text x="-5" y="72" text-anchor="end" class="sublabel" fill="#374151">Distance</text>
    <text x="80" y="172" text-anchor="middle" class="sublabel">Gradient = speed</text>
  </g>

  <!-- Velocity-time graph -->
  <rect x="410" y="50" width="370" height="215" rx="10" class="box"/>
  <text x="595" y="73" text-anchor="middle" class="label">Velocity-Time Graph</text>

  <g transform="translate(440, 82)">
    <line x1="0" y1="0" x2="0" y2="140" class="grid"/><line x1="40" y1="0" x2="40" y2="140" class="grid"/>
    <line x1="80" y1="0" x2="80" y2="140" class="grid"/><line x1="120" y1="0" x2="120" y2="140" class="grid"/>
    <line x1="160" y1="0" x2="160" y2="140" class="grid"/>
    <line x1="0" y1="0" x2="160" y2="0" class="grid"/><line x1="0" y1="35" x2="160" y2="35" class="grid"/>
    <line x1="0" y1="70" x2="160" y2="70" class="grid"/><line x1="0" y1="105" x2="160" y2="105" class="grid"/>
    <line x1="0" y1="140" x2="160" y2="140" class="axis"/><line x1="0" y1="0" x2="0" y2="140" class="axis"/>

    <!-- Constant velocity -->
    <line x1="0" y1="70" x2="60" y2="70" stroke="#3b82f6" stroke-width="3"/>
    <text x="20" y="62" class="sublabel" fill="#3b82f6">Constant v</text>

    <!-- Acceleration (slope up) -->
    <line x1="60" y1="70" x2="110" y2="10" class="plot"/>
    <text x="70" y="30" class="sublabel" fill="#dc2626">Acceleration</text>

    <!-- Constant velocity again -->
    <line x1="110" y1="10" x2="140" y2="10" stroke="#3b82f6" stroke-width="3"/>
    <text x="118" y="5" class="sublabel" fill="#3b82f6">Constant v</text>

    <!-- Deceleration (slope down) -->
    <line x1="140" y1="10" x2="160" y2="140" stroke="#22c55e" stroke-width="3"/>
    <text x="145" y="80" class="sublabel" fill="#22c55e">Deceleration</text>

    <text x="80" y="156" text-anchor="middle" class="sublabel" fill="#374151">Time</text>
    <text x="-5" y="72" text-anchor="end" class="sublabel" fill="#374151">Velocity</text>
    <text x="80" y="172" text-anchor="middle" class="sublabel">Gradient = acceleration | Area = distance</text>
  </g>

  <!-- Formulas -->
  <rect x="20" y="280" width="370" height="55" rx="10" class="box"/>
  <text x="205" y="300" text-anchor="middle" class="label">Key Formulas</text>
  <text x="205" y="320" text-anchor="middle" class="sublabel">v = d/t | a = (v−u)/t | v = u + at</text>

  <rect x="410" y="280" width="370" height="55" rx="10" class="box"/>
  <text x="595" y="300" text-anchor="middle" class="label">Scalar vs Vector</text>
  <text x="595" y="320" text-anchor="middle" class="sublabel">Speed (scalar, magnitude only) | Velocity (vector, magnitude + direction)</text>
</svg>
