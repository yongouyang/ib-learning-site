<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Our Solar System</title><desc id="desc">The eight planets orbiting the Sun, with inner rocky planets and outer gas giants.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Our Solar System</text><g transform="translate(0,55)"><rect x="20" y="0" width="760" height="200" rx="10" class="b"/>
  <g transform="translate(30,42)"><circle cx="30" cy="80" r="20" fill="#fbbf24" stroke="#eab308" stroke-width="2"/><text x="30" y="85" text-anchor="middle" class="s" fill="#92400e">Sun</text>
  <circle cx="90" cy="80" r="5" fill="#9ca3af"/><text x="90" y="58" class="s">Mercury</text>
  <circle cx="130" cy="80" r="7" fill="#fbbf24"/><text x="130" y="92" class="s">Venus</text>
  <circle cx="180" cy="80" r="8" fill="#3b82f6"/><text x="180" y="58" class="s">Earth</text>
  <circle cx="230" cy="80" r="6" fill="#ef4444"/><text x="230" y="92" class="s">Mars</text>
  <circle cx="310" cy="80" r="14" fill="#f97316"/><text x="310" y="68" class="s">Jupiter</text>
  <circle cx="390" cy="80" r="12" fill="#fbbf24"/><text x="390" y="68" class="s">Saturn</text>
  <circle cx="470" cy="80" r="10" fill="#3b82f6"/><text x="470" y="68" class="s">Uranus</text>
  <circle cx="540" cy="80" r="10" fill="#6366f1"/><text x="540" y="68" class="s">Neptune</text>
  <text x="400" y="120" text-anchor="middle" class="s">Inner planets (rocky): Mercury, Venus, Earth, Mars · Outer planets (gas giants): Jupiter, Saturn, Uranus, Neptune</text>
  <text x="400" y="140" text-anchor="middle" class="s">Asteroid belt between Mars and Jupiter. All planets orbit Sun in elliptical orbits, counter-clockwise when viewed from above.</text></g>
  <rect x="20" y="218" width="760" height="75" rx="8" class="b"/><text x="400" y="240" text-anchor="middle" class="l">Key Facts</text>
  <text x="400" y="260" text-anchor="middle" class="s">Sun: 99.86% of solar system mass · Planets: 0.14% · Jupiter: more massive than all other planets combined</text>
  <text x="400" y="280" text-anchor="middle" class="s">Earth is the only planet known to support life — liquid water, atmosphere, right distance from Sun (habitable zone)</text></g></svg>