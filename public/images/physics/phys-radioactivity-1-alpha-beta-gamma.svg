<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Alpha, Beta and Gamma Radiation</title>
  <desc id="desc">Penetration comparison showing paper stops alpha, aluminium stops beta, lead needed for gamma.</desc>
  <defs><style>
    .t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}
    .l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}
    .s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}
    .f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}
    .b{fill:#fff;stroke:#e5e7eb;stroke-width:2}
  </style></defs>
  <rect width="800" height="340" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="t">Alpha, Beta and Gamma Radiation</text>
  <g transform="translate(0,55)"><rect x="20" y="0" width="520" height="240" rx="10" class="b"/><text x="280" y="25" text-anchor="middle" class="l">Penetrating Power</text>
  <g transform="translate(50,38)"><rect x="0" y="30" width="20" height="40" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="10" y="55" text-anchor="middle" class="s" fill="#dc2626">α</text>
  <rect x="30" y="30" width="12" height="40" rx="2" fill="#d1d5db"/><text x="36" y="90" text-anchor="middle" class="s">Paper</text>
  <line x1="10" y1="70" x2="55" y2="70" stroke="#ef4444" stroke-width="2"/>
  <rect x="42" y="66" width="6" height="8" fill="#ef4444"/><text x="36" y="106" text-anchor="middle" class="s" fill="#dc2626">Stopped!</text>
  <rect x="80" y="50" width="20" height="40" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="75" text-anchor="middle" class="s" fill="#3b82f6">β</text>
  <rect x="110" y="30" width="12" height="40" rx="2" fill="#d1d5db"/><text x="116" y="105" text-anchor="middle" class="s">Paper</text>
  <rect x="170" y="30" width="12" height="40" rx="2" fill="#9ca3af"/><text x="176" y="105" text-anchor="middle" class="s">3 mm Al</text>
  <line x1="90" y1="90" x2="195" y2="90" stroke="#3b82f6" stroke-width="2"/>
  <rect x="182" y="86" width="6" height="8" fill="#3b82f6"/>
  <rect x="230" y="50" width="20" height="40" rx="2" fill="#fef3c7" stroke="#eab308" stroke-width="2"/>
  <text x="240" y="75" text-anchor="middle" class="s" fill="#eab308">γ</text>
  <rect x="260" y="30" width="12" height="40" rx="2" fill="#d1d5db"/><rect x="300" y="30" width="12" height="40" rx="2" fill="#9ca3af"/>
  <rect x="340" y="22" width="16" height="56" rx="2" fill="#6b7280"/><text x="348" y="105" text-anchor="middle" class="s">Lead</text>
  <line x1="240" y1="90" x2="365" y2="90" stroke="#eab308" stroke-width="2"/><text x="300" y="122" text-anchor="middle" class="s" fill="#eab308">Passes through, reduced</text></g>
  <rect x="560" y="0" width="220" height="240" rx="10" class="b"/><text x="670" y="25" text-anchor="middle" class="l">Comparison</text>
  <g transform="translate(580,38)"><rect x="0" y="0" width="180" height="60" rx="6" fill="#fef2f2"/>
  <text x="90" y="18" text-anchor="middle" class="l" fill="#dc2626">α (Alpha)</text><text x="90" y="34" text-anchor="middle" class="s">He nucleus (2p+2n)</text><text x="90" y="48" text-anchor="middle" class="s">+2 charge, most ionising</text>
  <rect x="0" y="58" width="180" height="50" rx="6" fill="#eff6ff"/>
  <text x="90" y="76" text-anchor="middle" class="l" fill="#3b82f6">β (Beta)</text><text x="90" y="92" text-anchor="middle" class="s">Fast electron, −1 charge</text><text x="90" y="106" text-anchor="middle" class="s">Medium ionising</text>
  <rect x="0" y="114" width="180" height="50" rx="6" fill="#fef3c7"/>
  <text x="90" y="132" text-anchor="middle" class="l" fill="#eab308">γ (Gamma)</text><text x="90" y="148" text-anchor="middle" class="s">EM wave, no charge</text><text x="90" y="162" text-anchor="middle" class="s">Least ionising, most penetrating</text></g>
  <rect x="20" y="235" width="760" height="45" rx="8" class="b"/><text x="400" y="255" text-anchor="middle" class="s">Penetration: γ > β > α. Ionisation: α > β > γ.</text><text x="400" y="271" text-anchor="middle" class="s">Alpha is stopped by skin but dangerous inside the body. Gamma needs thick lead/concrete.</text></g>
</svg>