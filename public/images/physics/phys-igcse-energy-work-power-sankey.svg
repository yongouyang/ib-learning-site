<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Sankey diagram for a petrol car</title>
  <desc id="desc">A Sankey diagram of energy transfer in a petrol car: a 100 joule chemical energy input band splits into a 25 joule useful kinetic energy output arrow and a 75 joule wasted thermal and sound output arrow, with the efficiency formula giving 25 percent.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 11px; fill: #4b5563; }
      .label { font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-size: 11px; fill: #4b5563; }
      .formula { font-size: 13px; font-weight: 700; fill: #991b1b; }
    </style>
  </defs>

  <rect width="900" height="500" fill="#f8fafc" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Sankey diagram — energy transfer in a petrol car</text>
  <text x="450" y="56" text-anchor="middle" class="subtitle">The width of each arrow is drawn to scale with the energy it carries</text>

  <!-- Input band: 100 J (160 px tall, 1.6 px per J) -->
  <rect x="60" y="140" width="240" height="160" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="52" y="92" width="330" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="62" y="110" class="label">Total input: chemical energy in fuel = 100 J</text>

  <!-- Useful output band: 25 J (40 px tall), continuing right -->
  <path d="M300,140 L560,140 L560,128 L600,160 L560,192 L560,180 L300,180 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <rect x="430" y="84" width="270" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="102" class="label">Useful output: kinetic energy = 25 J</text>

  <!-- Wasted output band: 75 J (120 px tall), turning down -->
  <path d="M300,180 L470,180 L470,390 L488,390 L410,458 L332,390 L350,390 L350,300 L300,300 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <rect x="520" y="330" width="300" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="530" y="348" class="label">Wasted: thermal energy + sound = 75 J</text>
  <line x1="520" y1="343" x2="474" y2="343" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Efficiency formula chip -->
  <rect x="540" y="210" width="330" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="555" y="234" class="formula">efficiency = (useful output ÷ total input) × 100%</text>
  <text x="555" y="258" class="sublabel">For this car: 25 J ÷ 100 J × 100% = 25%</text>

  <!-- Note bottom-left -->
  <text x="60" y="410" class="sublabel">Wasted energy is dissipated to the surroundings —</text>
  <text x="60" y="428" class="sublabel">it is transferred, not destroyed.</text>
</svg>
