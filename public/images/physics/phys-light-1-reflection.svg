<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Reflection and Mirrors</title>
  <desc id="desc">Ray diagram showing the law of reflection with incident ray, reflected ray, normal, and angles of incidence and reflection.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .ray { fill: none; stroke-width: 2.5; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="380" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Reflection and Mirrors</text>

  <!-- Ray diagram -->
  <rect x="20" y="50" width="500" height="250" rx="10" class="box"/>
  <text x="270" y="75" text-anchor="middle" class="label">Law of Reflection</text>

  <g transform="translate(30, 88)">
    <!-- Mirror surface -->
    <rect x="200" y="0" width="8" height="200" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5" rx="2"/>

    <!-- Normal line -->
    <line x1="204" y1="30" x2="204" y2="170" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="210" y="100" class="sublabel" fill="#6b7280">Normal (90°)</text>

    <!-- Incident ray -->
    <line x1="30" y1="160" x2="204" y2="60" class="ray" stroke="#ef4444"/>
    <polygon points="35,155 20,150 25,165" fill="#ef4444"/>
    <text x="110" y="118" class="sublabel" fill="#dc2626">Incident ray</text>

    <!-- Reflected ray -->
    <line x1="204" y1="60" x2="380" y2="160" class="ray" stroke="#22c55e"/>
    <polygon points="375,155 380,165 370,160" fill="#22c55e"/>
    <text x="270" y="118" class="sublabel" fill="#22c55e">Reflected ray</text>

    <!-- Angle i -->
    <g transform="translate(204,60)">
      <path d="M-30,0 A30,30 0 0,1 -15,-26" fill="none" stroke="#ef4444" stroke-width="1.5"/>
      <text x="-18" y="-14" class="sublabel" fill="#dc2626">i</text>
    </g>

    <!-- Angle r -->
    <g transform="translate(204,60)">
      <path d="M30,0 A30,30 0 0,0 15,-26" fill="none" stroke="#22c55e" stroke-width="1.5"/>
      <text x="12" y="-14" class="sublabel" fill="#22c55e">r</text>
    </g>

    <!-- Law statement -->
    <text x="270" y="195" text-anchor="middle" class="label" fill="#dc2626">Angle of incidence = Angle of reflection · i = r</text>

    <!-- Eye -->
    <circle cx="380" cy="160" r="10" fill="none" stroke="#374151" stroke-width="1.5"/>
    <circle cx="383" cy="160" r="4" fill="#374151"/>
    <text x="400" y="158" class="sublabel">Eye</text>
  </g>

  <!-- Mirror types -->
  <rect x="540" y="50" width="240" height="250" rx="10" class="box"/>
  <text x="660" y="75" text-anchor="middle" class="label">Mirror Types</text>

  <g transform="translate(560, 92)">
    <rect x="0" y="0" width="200" height="55" rx="6" fill="#fef2f2"/>
    <text x="10" y="18" class="label" fill="#dc2626">Plane (flat) mirror</text>
    <text x="10" y="34" class="sublabel">• Image: virtual, upright, same size</text>
    <text x="10" y="50" class="sublabel">• Lateral inversion (left ↔ right)</text>

    <rect x="0" y="62" width="200" height="55" rx="6" fill="#fef2f2"/>
    <text x="10" y="80" class="label" fill="#dc2626">Convex mirror</text>
    <text x="10" y="96" class="sublabel">• Curves outwards</text>
    <text x="10" y="112" class="sublabel">• Wider field of view · Smaller image</text>

    <rect x="0" y="124" width="200" height="55" rx="6" fill="#fef2f2"/>
    <text x="10" y="142" class="label" fill="#dc2626">Concave mirror</text>
    <text x="10" y="158" class="sublabel">• Curves inwards</text>
    <text x="10" y="174" class="sublabel">• Can magnify · Focal point</text>

    <rect x="-15" y="186" width="230" height="30" rx="6" fill="#fef3c7"/>
    <text x="100" y="206" text-anchor="middle" class="sublabel">Uses: rear-view, telescopes, shaving mirrors</text>
  </g>

  <rect x="20" y="315" width="760" height="30" rx="8" class="box"/>
  <text x="400" y="335" text-anchor="middle" class="sublabel">Specular reflection (smooth surface — clear image) · Diffuse reflection (rough surface — scattered light)</text>
</svg>
