<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">Life Cycle of Stars</title><desc id="desc">Stellar evolution from nebula to main sequence to red giant/supergiant to white dwarf/neutron star/black hole.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="350" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Life Cycle of Stars</text><g transform="translate(0,55)"><rect x="20" y="0" width="760" height="200" rx="10" class="b"/><text x="400" y="25" text-anchor="middle" class="l">Life Cycle of Stars</text>
  <g transform="translate(30,42)"><rect x="0" y="0" width="90" height="30" rx="6" fill="#f3f4f6"/><text x="45" y="20" text-anchor="middle" class="s">Nebula (gas/dust)</text>
  <line x1="90" y1="15" x2="120" y2="15" stroke="#374151" stroke-width="1.5"/><polygon points="120,10 130,15 120,20" fill="#374151"/>
  <rect x="135" y="0" width="90" height="30" rx="6" fill="#fef3c7"/><text x="180" y="20" text-anchor="middle" class="s">Protostar</text>
  <line x1="225" y1="15" x2="255" y2="15" stroke="#374151" stroke-width="1.5"/><polygon points="255,10 265,15 255,20" fill="#374151"/>
  <rect x="270" y="0" width="110" height="30" rx="6" fill="#fbbf24"/><text x="325" y="20" text-anchor="middle" class="s">Main Sequence Star</text>

  <line x1="325" y1="30" x2="325" y2="55" stroke="#374151" stroke-width="1.5"/>
  <text x="325" y="50" text-anchor="middle" class="s">Small/medium star</text>
  <rect x="270" y="60" width="110" height="30" rx="6" fill="#f97316"/><text x="325" y="80" text-anchor="middle" class="s">Red Giant</text>
  <line x1="325" y1="90" x2="325" y2="115" stroke="#374151" stroke-width="1.5"/>
  <rect x="280" y="120" width="90" height="30" rx="6" fill="#d1d5db"/><text x="325" y="140" text-anchor="middle" class="s" style="fill:#1f2937">White Dwarf</text>

  <line x1="380" y1="15" x2="436" y2="50" stroke="#374151" stroke-width="1.5"/>
  <text x="448" y="46" class="s">Massive star</text>
  <rect x="440" y="52" width="110" height="26" rx="6" fill="#ef4444"/><text x="495" y="70" text-anchor="middle" class="s" style="fill:#fff">Red Supergiant</text>
  <line x1="495" y1="78" x2="495" y2="92" stroke="#374151" stroke-width="1.5"/>
  <rect x="465" y="94" width="60" height="26" rx="6" fill="#ef4444"/><text x="495" y="112" text-anchor="middle" class="s" style="fill:#fff">Supernova</text>
  <line x1="495" y1="120" x2="495" y2="130" stroke="#374151" stroke-width="1.5"/>
  <rect x="450" y="132" width="35" height="24" rx="4" fill="#374151"/><text x="467" y="149" text-anchor="middle" class="s" fill="white">NS/BH</text>
  <text x="492" y="149" class="s">Neutron star or Black hole</text></g>
  <rect x="20" y="218" width="760" height="80" rx="8" class="b"/><text x="400" y="240" text-anchor="middle" class="l">Fusion in Stars</text>
  <text x="400" y="260" text-anchor="middle" class="s">Main sequence: hydrogen → helium fusion (like our Sun). Red giant: helium → carbon/oxygen. Massive stars fuse up to iron — then go supernova!</text>
  <text x="400" y="280" text-anchor="middle" class="s">Elements heavier than iron are created in supernova explosions. We are literally made of stardust!</text></g></svg>