<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Energy Stores, Transfers and Sankey Diagrams</title>
  <desc id="desc">Energy stores diagram showing kinetic, thermal, chemical, gravitational potential, elastic, and nuclear stores, plus a Sankey diagram for a light bulb.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Energy Stores, Transfers and Sankey Diagrams</text>

  <!-- Energy Stores panel -->
  <rect x="20" y="50" width="370" height="200" rx="10" class="box"/>
  <text x="205" y="75" text-anchor="middle" class="label">Energy Stores</text>

  <g transform="translate(40, 88)">
    <rect x="0" y="0" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="78" y="19" text-anchor="middle" class="sublabel">Kinetic (moving objects)</text>

    <rect x="165" y="0" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="243" y="19" text-anchor="middle" class="sublabel">Thermal (heat)</text>

    <rect x="0" y="34" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="78" y="53" text-anchor="middle" class="sublabel">Chemical (fuel, food)</text>

    <rect x="165" y="34" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="243" y="53" text-anchor="middle" class="sublabel">GPE (height × weight)</text>

    <rect x="0" y="68" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="78" y="87" text-anchor="middle" class="sublabel">Elastic (stretched spring)</text>

    <rect x="165" y="68" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="243" y="87" text-anchor="middle" class="sublabel">Nuclear (atoms)</text>

    <rect x="0" y="102" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="78" y="121" text-anchor="middle" class="sublabel">Magnetic</text>

    <rect x="165" y="102" width="155" height="28" rx="6" fill="#fef2f2"/>
    <text x="243" y="121" text-anchor="middle" class="sublabel">Electrostatic</text>

    <rect x="-5" y="138" width="350" height="20" rx="6" fill="#fef3c7"/>
    <text x="170" y="153" text-anchor="middle" class="sublabel">Energy is transferred between stores, never created or destroyed</text>
  </g>

  <!-- Transfer pathways -->
  <rect x="410" y="50" width="370" height="200" rx="10" class="box"/>
  <text x="595" y="75" text-anchor="middle" class="label">Energy Transfer Pathways</text>

  <g transform="translate(430, 88)">
    <!-- Flow chart -->
    <rect x="60" y="0" width="100" height="28" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="110" y="19" text-anchor="middle" class="sublabel">Chemical Store</text>
    
    <path d="M160,14 L200,14" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed2)"/>
    <text x="180" y="10" text-anchor="middle" class="sublabel" fill="#dc2626" font-size="9">heat</text>

    <rect x="205" y="0" width="100" height="28" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="255" y="19" text-anchor="middle" class="sublabel">Thermal Store</text>

    <path d="M255,28 L255,50 L110,50 L110,54" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="180" y="45" text-anchor="middle" class="sublabel" fill="#22c55e" font-size="9">work done</text>

    <rect x="60" y="56" width="100" height="28" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="110" y="75" text-anchor="middle" class="sublabel">Kinetic Store</text>

    <rect x="-12" y="110" width="340" height="25" rx="6" fill="#f3f4f6"/>
    <text x="155" y="127" text-anchor="middle" class="sublabel">↓ Mechanically (forces) · Electrically · By heating · By radiation</text>
  </g>

  <marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L8,5 L0,9" fill="#ef4444"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L8,5 L0,9" fill="#22c55e"/>
  </marker>

  <!-- Sankey Diagram -->
  <rect x="20" y="270" width="760" height="195" rx="10" class="box"/>
  <text x="400" y="295" text-anchor="middle" class="label">Sankey Diagram: 100 J Light Bulb</text>

  <g transform="translate(60, 310)">
    <!-- Input arrow -->
    <rect x="0" y="15" width="200" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="40" text-anchor="middle" class="label" fill="#dc2626">Input: 100 J</text>
    <text x="100" y="55" text-anchor="middle" class="sublabel">Electrical energy</text>

    <!-- Efficiency arrow -->
    <rect x="200" y="10" width="45" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="245" y="15" width="80" height="45" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>

    <!-- Useful output (light) -->
    <rect x="245" y="15" width="440" height="15" rx="3" fill="#fbbf24" stroke="#eab308" stroke-width="1.5"/>
    <text x="465" y="10" text-anchor="middle" class="sublabel" fill="#92400e">Useful output: 10 J light</text>

    <!-- Wasted (heat) -->
    <rect x="245" y="30" width="440" height="30" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
    <text x="465" y="50" text-anchor="middle" class="sublabel" fill="#dc2626">Wasted: 90 J heat</text>

    <!-- Arrow head -->
    <polygon points="685,15 705,22 685,30" fill="#fbbf24"/>
    <polygon points="685,30 705,45 685,60" fill="#fecaca"/>

    <!-- Efficiency formula -->
    <text x="360" y="80" text-anchor="middle" class="label" fill="#dc2626">Efficiency = Useful ÷ Total = 10/100 = 10%</text>
    <text x="360" y="96" text-anchor="middle" class="sublabel">Width of arrow ∝ amount of energy</text>
  </g>
</svg>
