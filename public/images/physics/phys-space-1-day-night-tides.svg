<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Day, Night, Seasons and Tides</title><desc id="desc">Earth tilt creates seasons, rotation creates day/night, Moon/tide diagrams.</desc><defs><style>.t{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:#111827}.l{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:#1f2937}.s{font-family:system-ui,sans-serif;font-size:11px;fill:#4b5563}.f{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:#dc2626}.b{fill:#fff;stroke:#e5e7eb;stroke-width:2}</style></defs><rect width="800" height="340" fill="#f9fafb" rx="12"/><text x="400" y="34" text-anchor="middle" class="t">Day, Night, Seasons and Tides</text><g transform="translate(0,55)"><rect x="20" y="0" width="370" height="240" rx="10" class="b"/><text x="205" y="25" text-anchor="middle" class="l">Day, Night and Seasons</text>
  <g transform="translate(40,42)"><circle cx="100" cy="70" r="45" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <line x1="100" y1="25" x2="100" y2="17" stroke="#ef4444" stroke-width="3"/><text x="100" y="12" text-anchor="middle" class="s">N</text>
  <text x="100" y="80" text-anchor="middle" class="s">23.5° tilt</text>
  <rect x="200" y="92" width="130" height="30" rx="6" fill="#fef2f2"/>
  <text x="265" y="112" text-anchor="middle" class="s">Tilt → seasons! (not distance from Sun)</text>
  <rect x="200" y="128" width="130" height="24" rx="6" fill="#eff6ff"/>
  <text x="265" y="145" text-anchor="middle" class="s">Rotation → day/night cycle</text></g>
  <rect x="410" y="0" width="370" height="240" rx="10" class="b"/><text x="595" y="25" text-anchor="middle" class="l">Tides (Moon's Gravity)</text>
  <g transform="translate(440,44)"><circle cx="160" cy="100" r="30" fill="#3b82f6"/><text x="160" y="105" text-anchor="middle" class="s" fill="white">Earth</text>
  <circle cx="310" cy="100" r="15" fill="#9ca3af"/><text x="310" y="105" text-anchor="middle" class="s">Moon</text>
  <ellipse cx="160" cy="65" rx="30" ry="12" fill="none" stroke="#ef4444" stroke-width="2"/><text x="120" y="48" class="s">High tide</text>
  <ellipse cx="160" cy="135" rx="30" ry="12" fill="none" stroke="#ef4444" stroke-width="2"/><text x="120" y="152" class="s">High tide</text>
  <text x="160" y="180" text-anchor="middle" class="s">Moon pulls water → 2 high tides/day</text></g>
  <rect x="20" y="235" width="760" height="45" rx="8" class="b"/><text x="400" y="255" text-anchor="middle" class="s">Summer in Northern Hemisphere = tilted TOWARDS Sun · Winter = tilted AWAY.</text><text x="400" y="271" text-anchor="middle" class="s">Equator has ~12 h day all year. Tides are also affected by the Sun (spring/neap tides).</text></g></svg>