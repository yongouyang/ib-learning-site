<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">Momentum and Collisions</title>
  <desc id="desc">Conservation of momentum diagram showing two cars colliding and sticking together, with calculations before and after the collision.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .formula { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; fill: #dc2626; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="390" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Momentum and Collisions</text>

  <!-- Before collision -->
  <rect x="20" y="50" width="450" height="160" rx="10" class="box"/>
  <text x="245" y="75" text-anchor="middle" class="label">Before Collision</text>

  <g transform="translate(40, 88)">
    <!-- Car A -->
    <rect x="0" y="10" width="90" height="35" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <circle cx="25" cy="50" r="8" fill="#374151"/>
    <circle cx="65" cy="50" r="8" fill="#374151"/>
    <text x="45" y="32" text-anchor="middle" class="sublabel" fill="#dc2626">1000 kg</text>

    <!-- Velocity arrow -->
    <line x1="90" y1="28" x2="145" y2="28" stroke="#ef4444" stroke-width="2.5" marker-end="url(#aR)"/>
    <text x="115" y="22" class="sublabel" fill="#dc2626">20 m/s</text>

    <!-- Car B (stationary) -->
    <rect x="180" y="10" width="80" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="200" cy="50" r="8" fill="#374151"/>
    <circle cx="240" cy="50" r="8" fill="#374151"/>
    <text x="220" y="32" text-anchor="middle" class="sublabel" fill="#3b82f6">800 kg</text>
    <text x="220" y="70" text-anchor="middle" class="sublabel">v = 0</text>

    <!-- Momentum calculation -->
    <text x="310" y="39" class="sublabel">p_A = 1000 × 20</text>
    <text x="310" y="54" class="sublabel" fill="#dc2626">p_A = 20,000 kg·m/s</text>
    <text x="310" y="74" class="sublabel" fill="#dc2626">p_total = 20,000</text>
  </g>

  <!-- After collision -->
  <rect x="20" y="225" width="450" height="120" rx="10" class="box"/>
  <text x="245" y="250" text-anchor="middle" class="label">After Collision (Stick Together — Inelastic)</text>

  <g transform="translate(40, 262)">
    <!-- Combined -->
    <rect x="0" y="10" width="140" height="35" rx="6" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    <circle cx="30" cy="50" r="8" fill="#374151"/>
    <circle cx="110" cy="50" r="8" fill="#374151"/>
    <text x="70" y="32" text-anchor="middle" class="sublabel" fill="#dc2626">1800 kg combined</text>
    
    <line x1="140" y1="28" x2="190" y2="28" stroke="#ef4444" stroke-width="2" marker-end="url(#aR)"/>
    <text x="160" y="22" class="sublabel" fill="#dc2626">v</text>

    <text x="230" y="39" class="sublabel">20,000 = 1800 × v</text>
    <text x="230" y="54" class="sublabel" fill="#dc2626">v ≈ 11.1 m/s</text>
    <text x="230" y="74" class="sublabel">(slower — mass increased)</text>
  </g>

  <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L8,5 L0,9" fill="#ef4444"/></marker>

  <!-- Formulas & Safety -->
  <rect x="490" y="50" width="290" height="295" rx="10" class="box"/>
  <text x="635" y="75" text-anchor="middle" class="label">Key Concepts</text>

  <g transform="translate(510, 92)">
    <rect x="0" y="0" width="250" height="40" rx="6" fill="#fef2f2"/>
    <text x="125" y="15" text-anchor="middle" class="formula">p = mv</text>
    <text x="125" y="34" text-anchor="middle" class="sublabel">Momentum = mass × velocity (kg·m/s)</text>

    <rect x="0" y="42" width="250" height="50" rx="6" fill="#fef2f2"/>
    <text x="125" y="60" text-anchor="middle" class="label" fill="#dc2626">Conservation of Momentum</text>
    <text x="125" y="76" text-anchor="middle" class="sublabel">m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂</text>
    <text x="125" y="90" text-anchor="middle" class="sublabel">Total momentum before = total momentum after</text>

    <rect x="0" y="100" width="250" height="55" rx="6" fill="#eff6ff"/>
    <text x="125" y="118" text-anchor="middle" class="label" fill="#3b82f6">Safety Features</text>
    <text x="125" y="136" text-anchor="middle" class="sublabel">F = Δp / Δt</text>
    <text x="125" y="152" text-anchor="middle" class="sublabel">Same Δp over longer time = smaller force</text>

    <rect x="0" y="165" width="250" height="80" rx="6" fill="#f3f4f6"/>
    <text x="10" y="183" class="label">Types of Collision</text>
    <text x="10" y="202" class="sublabel">• Elastic: KE conserved (ideal)</text>
    <text x="10" y="220" class="sublabel">• Inelastic: KE NOT conserved</text>
    <text x="10" y="238" class="sublabel">  (→ heat, sound, deformation)</text>
  </g>
</svg>
