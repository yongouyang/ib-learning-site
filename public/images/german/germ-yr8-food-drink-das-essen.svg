  <text x="60" y="409" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Ich esse gern Fisch mit Reis. — I like eating fish with rice.   ·   das Ei → die Eier (plural)</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Do not mix up das Essen (the food, a noun) with essen (to eat, a verb): Das Essen ist gut — ich esse gern hier.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Learn each food with its article: der Käse, die Wurst, das Brot.</text>
