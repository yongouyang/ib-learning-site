  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Orte in der Stadt — places in town</text>
  <text x="548" y="62" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">article colour key:</text>
  <circle cx="560" cy="58" r="6" fill="#1d4ed8"/>
  <text x="572" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">der</text>
  <circle cx="632" cy="58" r="6" fill="#be123c"/>
  <text x="644" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">die</text>
  <circle cx="704" cy="58" r="6" fill="#15803d"/>
  <text x="716" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">das</text>
  <rect x="50" y="84" width="780" height="320" rx="12" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1.6"/>
  <text x="70" y="106" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">the town plan</text>
  <line x1="60" y1="150" x2="820" y2="150" stroke="#e7e5e4" stroke-width="14"/>
  <line x1="60" y1="214" x2="820" y2="214" stroke="#e7e5e4" stroke-width="14"/>
  <line x1="60" y1="278" x2="820" y2="278" stroke="#e7e5e4" stroke-width="14"/>
  <line x1="60" y1="342" x2="820" y2="342" stroke="#e7e5e4" stroke-width="14"/>
  <line x1="190" y1="90" x2="190" y2="398" stroke="#e7e5e4" stroke-width="14"/>
