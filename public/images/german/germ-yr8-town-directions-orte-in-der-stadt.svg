<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A plan of a German town with places labelled</title>
  <desc id="desc">A simple street plan with ten places: der Bahnhof, das Kino, die Schule, der Marktplatz, die Post, das Schwimmbad, die Kirche, das Rathaus, der Supermarkt and die Bibliothek, each labelled with its article.</desc>
