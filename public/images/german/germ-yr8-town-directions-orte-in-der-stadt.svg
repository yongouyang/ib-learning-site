  <text x="102.2" y="142" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Bahnhof</text>
  <text x="76" y="157" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">train station</text>
  <rect x="300" y="120" width="150" height="44" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
