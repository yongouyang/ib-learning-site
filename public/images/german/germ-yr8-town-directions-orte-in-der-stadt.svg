  <rect x="300" y="182" width="150" height="44" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="310" y="204" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c">die</text>
