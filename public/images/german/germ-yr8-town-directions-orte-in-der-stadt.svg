  <text x="76" y="283" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">church</text>
  <rect x="300" y="246" width="150" height="44" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="310" y="268" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d">das</text>
  <text x="336.2" y="268" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Rathaus</text>
  <text x="310" y="283" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">town hall</text>
  <rect x="530" y="246" width="150" height="44" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="540" y="268" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">der</text>
  <text x="566.2" y="268" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Supermarkt</text>
  <text x="540" y="283" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">supermarket</text>
  <rect x="66" y="310" width="150" height="44" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="76" y="332" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c">die</text>
  <text x="102.2" y="332" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Bibliothek</text>
  <text x="76" y="347" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">library</text>
  <rect x="420" y="310" width="400" height="44" rx="8" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="440" y="337" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Das Kino ist groß. — The cinema is big.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">All German nouns take a capital letter: das Kino, never das kino.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Learn each place with its article — der, die or das — because the article changes in other cases.</text>
</svg>
