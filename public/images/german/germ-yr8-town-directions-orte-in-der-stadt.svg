  <text x="336.2" y="142" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Kino</text>
  <text x="310" y="157" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">cinema</text>
