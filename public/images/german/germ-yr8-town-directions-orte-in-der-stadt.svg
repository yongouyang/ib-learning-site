  <text x="310" y="219" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">post office</text>
  <rect x="530" y="182" width="150" height="44" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="540" y="204" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d">das</text>
  <text x="566.2" y="204" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Schwimmbad</text>
