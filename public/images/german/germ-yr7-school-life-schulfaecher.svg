<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A poster of German school subjects</title>
  <desc id="desc">Twelve school subjects with their German names and English meanings, from Mathe and Englisch to Kunst, Musik and Erdkunde. A note explains that subjects are normally used without an article, and gives the phrases das Fach and mein Lieblingsfach.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Die Schulfächer — school subjects</text>
  <rect x="40" y="88" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="135" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Mathe / Mathematik</text>
  <text x="135" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">maths</text>
  <rect x="246" y="88" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="341" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Englisch</text>
  <text x="341" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">English</text>
  <rect x="452" y="88" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="547" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Deutsch</text>
  <text x="547" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">German</text>
  <rect x="658" y="88" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="753" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">die Naturwissenschaften</text>
  <text x="753" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">the sciences</text>
  <rect x="40" y="162" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="135" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Sport</text>
  <text x="135" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">PE</text>
  <rect x="246" y="162" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="341" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Kunst</text>
  <text x="341" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">art</text>
  <rect x="452" y="162" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="547" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Musik</text>
  <text x="547" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">music</text>
  <rect x="658" y="162" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="753" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Informatik</text>
  <text x="753" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">computing / ICT</text>
  <rect x="40" y="236" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="135" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Geschichte</text>
  <text x="135" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">history</text>
  <rect x="246" y="236" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="341" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Erdkunde / Geografie</text>
  <text x="341" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">geography</text>
  <rect x="452" y="236" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="547" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Religion</text>
  <text x="547" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">RE</text>
  <rect x="658" y="236" width="190" height="62" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="753" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">Französisch</text>
  <text x="753" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">French</text>
  <rect x="40" y="338" width="760" height="72" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="60" y="364" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Subjects are normally used without der, die or das: Ich habe heute Mathe. Mein Lieblingsfach ist Sport. das Fach</text>
  <text x="60" y="382" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">is the word for a subject, and mein Lieblingsfach is my favourite subject.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Only the sciences take an article, because die Naturwissenschaften is plural: die Naturwissenschaften sind interessant.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Ich habe heute Mathe — I have maths today. Subjects take a capital letter, like every German noun.</text>
</svg>
