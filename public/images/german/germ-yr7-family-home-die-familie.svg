<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A German family tree with articles and English meanings</title>
  <desc id="desc">Three levels: grandparents at the top, parents in the middle, children at the bottom, with the aunt and uncle beside them. Each person is labelled with the German word, its article and the English meaning.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Die Familie — family members</text>
  <text x="548" y="62" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">article colour key:</text>
  <circle cx="560" cy="58" r="6" fill="#1d4ed8"/>
  <text x="572" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">der</text>
  <circle cx="632" cy="58" r="6" fill="#be123c"/>
  <text x="644" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">die</text>
  <circle cx="704" cy="58" r="6" fill="#15803d"/>
  <text x="716" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">das</text>
  <rect x="150" y="86" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="240.0" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c">die</text>
  <text x="240.0" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Großmutter</text>
  <text x="240.0" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the grandmother</text>
  <rect x="350" y="86" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440.0" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">der</text>
  <text x="440.0" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Großvater</text>
  <text x="440.0" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the grandfather</text>
  <rect x="150" y="196" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="240.0" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c">die</text>
  <text x="240.0" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Mutter</text>
  <text x="240.0" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the mother</text>
  <rect x="350" y="196" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440.0" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">der</text>
  <text x="440.0" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Vater</text>
  <text x="440.0" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the father</text>
  <rect x="150" y="306" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="240.0" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c">die</text>
  <text x="240.0" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Schwester</text>
  <text x="240.0" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the sister</text>
  <rect x="350" y="306" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440.0" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">der</text>
  <text x="440.0" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Bruder</text>
  <text x="440.0" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the brother</text>
  <rect x="620" y="150" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="710.0" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c">die</text>
  <text x="710.0" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Tante</text>
  <text x="710.0" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the aunt</text>
  <rect x="620" y="272" width="180" height="66" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="710.0" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">der</text>
  <text x="710.0" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Onkel</text>
  <text x="710.0" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">the uncle</text>
  <path d="M 240 152 L 240 170 M 440 152 L 440 170 M 240 170 L 440 170 M 240 170 L 240 196 M 440 170 L 440 196" fill="none" stroke="#a8a29e" stroke-width="1.6"/>
  <path d="M 240 262 L 240 280 M 440 262 L 440 280 M 240 280 L 440 280 M 240 280 L 240 306 M 440 280 L 440 306" fill="none" stroke="#a8a29e" stroke-width="1.6"/>
  <path d="M 710 216 L 710 272" fill="none" stroke="#a8a29e" stroke-width="1.6"/>
  <rect x="620" y="366" width="240" height="54" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="640" y="388" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">die Eltern — the parents</text>
  <text x="640" y="408" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">die Geschwister — the siblings</text>
  <rect x="150" y="392" width="420" height="44" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="360" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Hast du Geschwister? — Ja, ich habe einen Bruder und eine Schwester.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Nein, ich bin Einzelkind. — No, I am an only child.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Other family words: das Kind, das Baby, der Cousin, die Cousine, die Großeltern, das Enkelkind.</text>
</svg>
