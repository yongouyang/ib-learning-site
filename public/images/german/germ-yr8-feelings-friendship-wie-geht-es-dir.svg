<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A German poster of feelings and moods</title>
  <desc id="desc">Seven feelings with simple faces and their German words: müde, traurig, glücklich, wütend, nervös, krank and gestresst. The question Wie geht es dir? and the answer pattern Mir geht es gut are shown, with a warning that Ich bin gut is wrong here.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Wie geht es dir? — feelings and moods</text>
  <rect x="40" y="90" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(109,102)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <path d="M 12 22 q 6 5 12 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <path d="M 30 22 q 6 5 12 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <path d="M 16 40 q 10 3 20 0" fill="none" stroke="#7c2d12" stroke-width="2.4"/>
  </g>
  <text x="135" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">müde</text>
  <text x="135" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">tired</text>
  <rect x="246" y="90" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(315,102)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="17" cy="24" r="2.6" fill="#7c2d12"/><circle cx="35" cy="24" r="2.6" fill="#7c2d12"/>
    <path d="M 16 44 q 10 -12 20 0" fill="none" stroke="#7c2d12" stroke-width="2.4"/>
  </g>
  <text x="341" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">traurig</text>
  <text x="341" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">sad</text>
  <rect x="452" y="90" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(521,102)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="17" cy="22" r="2.6" fill="#7c2d12"/><circle cx="35" cy="22" r="2.6" fill="#7c2d12"/>
    <path d="M 14 32 q 12 14 24 0" fill="none" stroke="#7c2d12" stroke-width="2.4"/>
  </g>
  <text x="547" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">glücklich</text>
  <text x="547" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">happy</text>
  <rect x="658" y="90" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(727,102)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <path d="M 10 16 l 14 6" stroke="#7c2d12" stroke-width="2.4"/><path d="M 42 16 l -14 6" stroke="#7c2d12" stroke-width="2.4"/>
    <circle cx="17" cy="26" r="2.6" fill="#7c2d12"/><circle cx="35" cy="26" r="2.6" fill="#7c2d12"/>
    <path d="M 16 44 q 10 -10 20 0" fill="none" stroke="#7c2d12" stroke-width="2.4"/>
  </g>
  <text x="753" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">wütend</text>
  <text x="753" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">angry</text>
  <rect x="40" y="230" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(109,242)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <circle cx="17" cy="24" r="2.6" fill="#7c2d12"/><circle cx="35" cy="24" r="2.6" fill="#7c2d12"/>
    <path d="M 18 40 q 4 -5 8 0 q 4 5 8 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <path d="M 46 12 l 6 -8 M 50 20 l 8 -4" stroke="#7c2d12" stroke-width="1.6"/>
  </g>
  <text x="135" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">nervös</text>
  <text x="135" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">nervous</text>
  <rect x="246" y="230" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(315,242)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <path d="M 12 24 q 5 4 10 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <path d="M 30 24 q 5 4 10 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <path d="M 18 42 q 8 -4 16 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <rect x="34" y="34" width="14" height="11" rx="2" fill="#ffffff" stroke="#7c2d12" stroke-width="1.6"/>
  </g>
  <text x="341" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">krank</text>
  <text x="341" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">ill</text>
  <rect x="452" y="230" width="190" height="124" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(521,242)">
    <circle cx="26" cy="26" r="24" fill="#fde68a" stroke="#92400e" stroke-width="1.8"/>
    <path d="M 12 20 l 10 4 M 30 24 l 10 -4" stroke="#7c2d12" stroke-width="2.2"/>
    <circle cx="17" cy="28" r="2.6" fill="#7c2d12"/><circle cx="35" cy="28" r="2.6" fill="#7c2d12"/>
    <path d="M 16 45 q 10 -8 20 0" fill="none" stroke="#7c2d12" stroke-width="2.2"/>
    <path d="M 44 10 l 8 -6 M 48 16 l 9 -2" stroke="#7c2d12" stroke-width="1.6"/>
  </g>
  <text x="547" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">gestresst</text>
  <text x="547" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">stressed</text>
  <rect x="40" y="364" width="800" height="56" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="388" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Wie geht es dir? — Mir geht es gut / schlecht / so la la.  (I am fine / not well / so-so)</text>
  <text x="60" y="408" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Nicht so gut. Ich bin müde und ein bisschen nervös — morgen habe ich eine Prüfung.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Common mistake: do not answer with Ich bin gut — that sounds like "I am a good person". Use Mir geht es gut.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Feelings after sein take no ending: Ich bin müde, not Ich bin müdes.</text>
</svg>
