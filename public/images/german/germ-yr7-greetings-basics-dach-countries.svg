<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The German-speaking countries D-A-CH</title>
  <desc id="desc">Three panels: Deutschland with its capital Berlin and about 84 million people, Österreich with Wien and about 9 million, and die Schweiz with Bern where German is one of four official languages. A note gives the article rule for die Schweiz and lists other countries where German is spoken.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Die deutschsprachige Welt — D-A-CH</text>
  <rect x="50" y="96" width="240" height="214" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.8"/>
  <rect x="50" y="96" width="240" height="52" rx="12" fill="#f5f5f4"/>
  <text x="170" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1c1917">D</text>
  <text x="170" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1c1917">Deutschland</text>
  <text x="170" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#292524">Berlin</text>
  <text x="170" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#a8a29e">capital</text>
  <text x="70" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">About 84 million people</text>
  <rect x="70" y="282" width="46" height="14" rx="3" fill="#facc15" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="120" y="282" width="46" height="14" rx="3" fill="#dc2626" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="170" y="282" width="46" height="14" rx="3" fill="#1c1917" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="320" y="96" width="240" height="214" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.8"/>
  <rect x="320" y="96" width="240" height="52" rx="12" fill="#f5f5f4"/>
  <text x="440" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1c1917">A</text>
  <text x="440" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1c1917">Österreich</text>
  <text x="440" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#292524">Wien</text>
  <text x="440" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#a8a29e">capital</text>
  <text x="340" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">About 9 million people</text>
  <rect x="340" y="282" width="46" height="14" rx="3" fill="#dc2626" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="390" y="282" width="46" height="14" rx="3" fill="#dc2626" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="440" y="282" width="46" height="14" rx="3" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="590" y="96" width="240" height="214" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.8"/>
  <rect x="590" y="96" width="240" height="52" rx="12" fill="#f5f5f4"/>
  <text x="710" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1c1917">CH</text>
  <text x="710" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1c1917">die Schweiz</text>
  <text x="710" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#292524">Bern</text>
  <text x="710" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#a8a29e">capital</text>
  <text x="610" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">German is one of four official</text>
  <text x="610" y="273" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">languages</text>
  <rect x="610" y="282" width="46" height="14" rx="3" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="660" y="282" width="46" height="14" rx="3" fill="#dc2626" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="710" y="282" width="46" height="14" rx="3" fill="#dc2626" stroke="#d6d3d1" stroke-width="1"/>
  <rect x="50" y="326" width="760" height="94" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="70" y="352" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">German is also an official language in Luxemburg, Liechtenstein and parts of Belgien, and is widely understood in</text>
  <text x="70" y="370" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Südtirol in northern Italien. More than 100 million people speak German as a first or second language.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Watch out: die Schweiz is a feminine country name, so it keeps its article — Ich komme aus der Schweiz.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Most countries need no article: Ich komme aus Österreich, Ich komme aus Deutschland.</text>
</svg>
