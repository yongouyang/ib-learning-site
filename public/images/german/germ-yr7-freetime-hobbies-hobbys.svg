<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A vocabulary poster of German hobbies and activities</title>
  <desc id="desc">Eight activities with their German phrases and English meanings: Fußball spielen, Tennis spielen, Klavier spielen, lesen, schwimmen, Musik hören, fernsehen and Rad fahren. A note explains that spielen works for both sports and instruments.</desc>
