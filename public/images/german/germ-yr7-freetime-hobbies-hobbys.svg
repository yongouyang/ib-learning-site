  <text x="371" y="276" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">to ride a bike</text>
  <rect x="586" y="232" width="253" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <circle cx="616" cy="262" r="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="616" y="267" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca">z</text>
