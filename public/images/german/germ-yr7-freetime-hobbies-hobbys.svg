  <text x="644" y="348" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">to play computer games</text>
  <rect x="40" y="384" width="800" height="38" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="409" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">spielen works for sports AND instruments: Tennis spielen, Klavier spielen.   ·   Ich spiele gern Fußball.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Many hobby words are international: das Hobby, das Tennis, der Computer — so they are easy to remember.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">To say you like doing something, add gern: Ich schwimme gern, Ich lese gern.</text>
</svg>
