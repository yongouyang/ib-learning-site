  <text x="644" y="276" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">to draw</text>
  <rect x="40" y="304" width="253" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
