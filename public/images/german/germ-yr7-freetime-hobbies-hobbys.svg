  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Hobbys und Aktivitäten — hobbies</text>
  <circle cx="560" cy="58" r="6" fill="#1d4ed8"/>
  <text x="572" y="62" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#57534e">der</text>
