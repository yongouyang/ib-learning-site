<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A German transport vocabulary poster</title>
  <desc id="desc">Nine ways of travelling, each with its German phrase and English meaning: mit dem Zug, mit dem Bus, mit dem Auto, mit dem Flugzeug, mit dem Schiff, mit dem Fahrrad, mit der U-Bahn, mit der Straßenbahn and zu Fuß.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Verkehrsmittel — getting around</text>
  <rect x="40" y="84" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(54,104)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <rect x="4" y="6" width="36" height="24" rx="6"/><rect x="9" y="11" width="11" height="8" fill="#ffffff"/><rect x="24" y="11" width="11" height="8" fill="#ffffff"/>
    <circle cx="12" cy="34" r="3" fill="#1e3a8a"/><circle cx="32" cy="34" r="3" fill="#1e3a8a"/><path d="M 6 40 l 36 0" stroke-width="2"/>
  </g>
  <text x="122" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit dem Zug</text>
  <text x="122" y="144" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by train</text>
  <rect x="313" y="84" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(327,104)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <rect x="4" y="8" width="38" height="24" rx="5"/><rect x="8" y="13" width="12" height="9" fill="#ffffff"/><rect x="24" y="13" width="13" height="9" fill="#ffffff"/>
    <circle cx="13" cy="35" r="3.4" fill="#1e3a8a"/><circle cx="33" cy="35" r="3.4" fill="#1e3a8a"/>
  </g>
  <text x="395" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit dem Bus</text>
  <text x="395" y="144" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by bus</text>
  <rect x="586" y="84" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(600,104)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 6 30 l 3 -10 q 1 -4 6 -4 l 20 0 q 5 0 6 4 l 3 10 z"/><rect x="12" y="16" width="9" height="7" fill="#ffffff"/><rect x="24" y="16" width="9" height="7" fill="#ffffff"/>
    <circle cx="13" cy="32" r="3.6" fill="#1e3a8a"/><circle cx="33" cy="32" r="3.6" fill="#1e3a8a"/>
  </g>
  <text x="668" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit dem Auto</text>
  <text x="668" y="144" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by car</text>
  <rect x="40" y="172" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(54,192)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 4 20 l 36 -6 l -6 12 l -10 2 l -6 8 l -4 0 l 2 -9 l -12 -1 z"/>
  </g>
  <text x="122" y="212" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit dem Flugzeug</text>
  <text x="122" y="232" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by plane</text>
  <rect x="313" y="172" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(327,192)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 6 22 l 32 0 l -6 14 l -20 0 z"/><rect x="18" y="6" width="4" height="16" fill="#1e3a8a"/><path d="M 22 8 l 12 8 l -12 4 z" fill="#ffffff"/>
  </g>
  <text x="395" y="212" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit dem Schiff</text>
  <text x="395" y="232" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by ship</text>
  <rect x="586" y="172" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(600,192)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <circle cx="12" cy="28" r="8" fill="none" stroke-width="2"/><circle cx="34" cy="28" r="8" fill="none" stroke-width="2"/><path d="M 12 28 l 8 -12 l 8 12 l -16 0 M 20 16 l 6 -2" fill="none" stroke-width="2"/>
  </g>
  <text x="668" y="212" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit dem Fahrrad</text>
  <text x="668" y="232" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by bike</text>
  <rect x="40" y="260" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(54,280)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <rect x="4" y="6" width="36" height="26" rx="10"/><text x="22" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" stroke="none">U</text>
    <circle cx="12" cy="36" r="3" fill="#1e3a8a"/><circle cx="32" cy="36" r="3" fill="#1e3a8a"/>
  </g>
  <text x="122" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit der U-Bahn</text>
  <text x="122" y="320" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by underground</text>
  <rect x="313" y="260" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(327,280)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <rect x="4" y="10" width="36" height="22" rx="5"/><path d="M 22 10 l 0 -6 l 10 0" fill="none" stroke-width="1.6"/><rect x="9" y="15" width="10" height="8" fill="#ffffff"/><rect x="25" y="15" width="10" height="8" fill="#ffffff"/>
  </g>
  <text x="395" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">mit der Straßenbahn</text>
  <text x="395" y="320" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">by tram</text>
  <rect x="586" y="260" width="253" height="76" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <g transform="translate(600,280)" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round">
    <circle cx="22" cy="9" r="5" fill="#f5f5f4"/><path d="M 22 15 l 0 12 M 22 19 l -8 6 M 22 19 l 8 6 M 22 27 l -6 12 M 22 27 l 6 12" fill="none" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="668" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">zu Fuß</text>
  <text x="668" y="320" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">on foot</text>
  <rect x="40" y="354" width="800" height="38" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="379" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Wann fährt der Zug ab? — When does the train leave?   ·   der Bahnhof, der Flughafen, die Fahrkarte</text>
  <rect x="40" y="402" width="800" height="26" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="420" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Note the case: mit dem Zug (masculine or neuter), but mit der U-Bahn and mit der Straßenbahn (feminine).</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Common mistake: zu Fuß takes no article and no mit — Ich gehe zu Fuß zur Schule.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">abfahren = to depart, ankommen = to arrive.</text>
</svg>
