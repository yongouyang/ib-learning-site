  <rect x="40" y="394" width="800" height="34" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="416" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">Im Winter trage ich einen Mantel und eine Mütze.   ·   tragen: ich trage, du trägst, er/sie trägt</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Die Schuhe is plural, so it is always die Schuhe — a pair of shoes.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">The verb for wearing clothes is tragen: the a becomes ä for du and er/sie.</text>
</svg>
