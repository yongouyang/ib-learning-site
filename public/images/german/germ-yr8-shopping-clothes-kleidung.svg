  <title id="title">A German clothing vocabulary poster</title>
  <desc id="desc">Ten clothing items with their articles and English meanings, from die Hose and das T-Shirt to der Mantel and die Mütze, plus the sentence Im Winter trage ich einen Mantel und eine Mütze.</desc>
