  <text x="410" y="404" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#15803d">Singular → tut    ·    Plural → tun</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Ich bin krank. — I am ill.   ·   Ich fühle mich nicht gut.   ·   Ich habe Fieber / eine Erkältung / Husten.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">The pattern is dative: mir, not ich. der Rücken (the back) is not visible from the front.</text>
