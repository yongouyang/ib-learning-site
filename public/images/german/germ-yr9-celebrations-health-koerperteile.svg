  <title id="title">Body parts in German and the pattern Mir tut ... weh</title>
  <desc id="desc">A simple figure with nine numbered body parts, beside a numbered legend giving the German word with its article and the English meaning: der Kopf, das Ohr, der Hals, der Arm, die Hand, der Bauch, das Bein, der Fuß and der Zahn. A panel explains the pattern Mir tut der Kopf weh.</desc>
