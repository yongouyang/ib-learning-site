  <text x="410" y="356" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Mir tut der Kopf weh.</text>
  <text x="570" y="356" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">My head hurts.</text>
  <text x="410" y="382" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Mir tun die Ohren weh.</text>
