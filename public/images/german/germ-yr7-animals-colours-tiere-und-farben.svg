  <text x="60" y="400" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#292524">hellblau = light blue   ·   dunkelgrün = dark green   ·   Welche Farbe hat dein Fahrrad? — Es ist rot.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Der Hund ist braun. After sein, colours never change their form — so die Katze ist schwarz, not schwarze.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Learn every animal with its article: der, die or das is part of the word, not an extra.</text>
