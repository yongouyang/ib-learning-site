  <title id="title">A vocabulary poster of German animals and colours</title>
  <desc id="desc">Eight animals with their German article and English meaning: der Hund, die Katze, das Pferd, der Vogel, die Kuh, das Schwein, das Schaf and die Maus. Below, eleven colour swatches with their German names, and the sentence pattern Der Hund ist braun.</desc>
