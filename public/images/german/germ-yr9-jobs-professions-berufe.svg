<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">German job names in their masculine and feminine forms</title>
  <desc id="desc">Twelve jobs shown as pairs, masculine and feminine: der Arzt and die Ärztin, der Lehrer and die Lehrerin, der Polizist and die Polizistin, der Koch and die Köchin, and so on, each with its English meaning.</desc>
