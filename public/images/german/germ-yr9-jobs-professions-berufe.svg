  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">The feminine form adds -in, usually with an umlaut: der Koch → die Köchin, der Arzt → die Ärztin.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Some pairs are different words: der Krankenpfleger / die Krankenschwester, der Feuerwehrmann / die Feuerwehrfrau.</text>
