  <rect x="60" y="92" width="260" height="150" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="190.0" y="161.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">das</text>
  <text x="190.0" y="181.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Wohnzimmer</text>
  <text x="190.0" y="199.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">living room</text>
  <rect x="320" y="92" width="130" height="150" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="385.0" y="161.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">das</text>
  <text x="385.0" y="181.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Schlafzimmer</text>
  <text x="385.0" y="199.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">bedroom</text>
  <rect x="450" y="92" width="130" height="75" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="515.0" y="123.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#be123c">die</text>
  <text x="515.0" y="143.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Küche</text>
  <text x="515.0" y="161.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">kitchen</text>
  <rect x="450" y="167" width="130" height="75" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="515.0" y="198.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">das</text>
  <text x="515.0" y="218.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Badezimmer</text>
  <text x="515.0" y="236.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">bathroom</text>
  <rect x="60" y="242" width="260" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="190.0" y="276.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">das</text>
  <text x="190.0" y="296.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Esszimmer</text>
  <text x="190.0" y="314.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">dining room</text>
  <rect x="320" y="242" width="130" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="385.0" y="276.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">das</text>
  <text x="385.0" y="296.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Arbeitszimmer</text>
  <text x="385.0" y="314.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">study</text>
  <rect x="450" y="242" width="130" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="515.0" y="276.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">der</text>
  <text x="515.0" y="296.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Flur</text>
  <text x="515.0" y="314.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">hallway</text>
  <rect x="320" y="322" width="130" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="385.0" y="356.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">der</text>
  <text x="385.0" y="376.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Keller</text>
  <text x="385.0" y="394.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">cellar</text>
  <rect x="450" y="322" width="130" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="515.0" y="356.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">der</text>
  <text x="515.0" y="376.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Dachboden</text>
  <text x="515.0" y="394.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">attic</text>
  <rect x="60" y="322" width="260" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="190.0" y="356.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">das</text>
  <text x="190.0" y="376.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Haus</text>
  <text x="190.0" y="394.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">the house you are in</text>
  <rect x="600" y="92" width="240" height="58" rx="8" fill="#bbf7d0" stroke="#57534e" stroke-width="1.4"/>
  <text x="720.0" y="127.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">der Garten</text>
  <rect x="600" y="158" width="240" height="58" rx="8" fill="#e7e5e4" stroke="#57534e" stroke-width="1.4"/>
  <text x="720.0" y="193.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">der Balkon</text>
  <rect x="600" y="224" width="240" height="58" rx="8" fill="#e7e5e4" stroke="#57534e" stroke-width="1.4"/>
  <text x="720.0" y="259.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">die Garage</text>
  <rect x="600" y="290" width="240" height="112" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="720" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">Types of home</text>
  <text x="720" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#292524">das Haus</text>
  <text x="720" y="351" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#292524">das Einfamilienhaus</text>
  <text x="720" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#292524">die Wohnung</text>
  <text x="720" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#292524">das Hochhaus</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#292524">Compounds: Schlafen + Zimmer = das Schlafzimmer, Bad + Zimmer = das Badezimmer — the last part gives the gender.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Everything ending in -zimmer is das: das Wohnzimmer, das Schlafzimmer, das Esszimmer. der Keller and der Dachboden are der.</text>
</svg>
