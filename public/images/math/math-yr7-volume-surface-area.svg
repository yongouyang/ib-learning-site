<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Volume and surface area of 3D shapes: cuboid, prism and cylinder</title>
  <desc id="desc">Visual comparison of volume vs surface area; a cuboid with labelled dimensions and formulas; volume as counting unit cubes; nets of common prisms showing how surface area is the sum of all face areas.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
    .cube { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; fill-opacity: 0.5; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>

  <text x="30" y="35" class="heading">Volume and surface area</text>

  <!-- Volume vs Surface Area -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="410" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="205" y="22" class="subhead" text-anchor="middle">Volume</text>
    <text x="205" y="46" class="label" text-anchor="middle">The amount of space inside a 3D shape. Measured in cubic units (cm³, m³).</text>
  </g>
  <g transform="translate(460, 55)">
    <rect x="0" y="0" width="410" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="205" y="22" class="subhead" text-anchor="middle">Surface Area</text>
    <text x="205" y="46" class="label" text-anchor="middle">The total area of all faces of a 3D shape. Measured in square units (cm², m²).</text>
  </g>

  <!-- Cuboid with unit cubes -->
  <text x="30" y="165" class="subhead">Volume = length × width × height</text>
  <g transform="translate(30, 180)">
    <!-- Isometric-ish cuboid made of unit cubes -->
    <g transform="translate(0, 0)">
      <!-- 4x3x2 cuboid visual -->
      <!-- Bottom layer (front face visible) -->
      <polygon points="0,60 120,60 140,40 20,40" fill="#93c5fd" stroke="#2563eb" stroke-width="1" fill-opacity="0.5"/>
      <!-- Top layer -->
      <polygon points="0,40 120,40 140,20 20,20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" fill-opacity="0.7"/>
      <!-- Front-right face -->
      <polygon points="120,60 140,40 140,20 120,40" fill="#60a5fa" stroke="#2563eb" stroke-width="1" fill-opacity="0.5"/>
      <!-- Right face -->
      <polygon points="140,40 140,20 120,0 120,20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Top face -->
      <polygon points="0,40 120,40 120,20 0,20" fill="#dbeafe" stroke="#2563eb" stroke-width="1" fill-opacity="0.8"/>

      <text x="160" y="15" class="label">h (height)</text>
      <text x="60" y="28" class="label">w (width)</text>
      <text x="65" y="80" class="label">l (length)</text>

      <text x="160" y="50" class="math" fill="#2563eb">V = l × w × h</text>
    </g>
  </g>

  <!-- Surface area formula -->
  <g transform="translate(400, 165)">
    <rect x="0" y="0" width="470" height="100" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="235" y="22" class="subhead" text-anchor="middle">Surface area of a cuboid</text>
    <g transform="translate(20, 38)">
      <text x="0" y="0" class="label">A cuboid has 3 pairs of identical faces:</text>
      <text x="10" y="22" class="math" fill="#2563eb">Front/back: 2 × (l × h)</text>
      <text x="10" y="42" class="math" fill="#16a34a">Top/bottom: 2 × (l × w)</text>
      <text x="10" y="62" class="math" fill="#d97706">Left/right: 2 × (w × h)</text>
    </g>
  </g>

  <!-- Prisms and nets -->
  <text x="30" y="310" class="heading">Volume of prisms</text>
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="410" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="205" y="22" class="subhead" text-anchor="middle">General formula for any prism</text>
    <text x="205" y="52" class="math" text-anchor="middle" fill="#d97706" font-size="18">V = area of cross-section × length</text>
    <text x="205" y="72" class="label" text-anchor="middle">Works for cuboids, cylinders, triangular prisms and all prisms!</text>
  </g>
  <g transform="translate(460, 330)">
    <rect x="0" y="0" width="410" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="205" y="22" class="subhead" text-anchor="middle">Cylinder</text>
    <text x="205" y="48" class="math" text-anchor="middle" fill="#7c3aed" font-size="16">V = πr²h</text>
    <text x="205" y="70" class="label" text-anchor="middle">Cross-section is a circle with area πr²</text>
  </g>
</svg>
