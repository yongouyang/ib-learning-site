<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">Adding a site updates the Voronoi diagram locally</title>
  <desc id="desc">Existing sites A(0, 0) and B(4, 0) are joined by new site C(2, 3). The perpendicular bisectors of AC and BC meet the original AB boundary at V(2, 5/6). C gains the shaded cell above V, while the AB boundary below V remains. All three sites are 13/6 units from V.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <rect width="900" height="580" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">Add C(2, 3): only the neighbouring cell boundaries change</text>
  <rect x="35" y="65" width="520" height="480" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M80 85 V525 M150 85 V525 M220 85 V525 M290 85 V525 M360 85 V525 M430 85 V525 M500 85 V525 M55 120 H540 M55 190 H540 M55 260 H540 M55 330 H540 M55 400 H540" class="grid"/>
  <rect x="80" y="190" width="420" height="280" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="290,411.7 500,271.7 500,190 80,190 80,271.7" fill="#dcfce7" fill-opacity="0.85"/>
  <line x1="80" y1="271.7" x2="290" y2="411.7" stroke="#2563eb" stroke-width="3"/>
  <line x1="290" y1="411.7" x2="500" y2="271.7" stroke="#2563eb" stroke-width="3"/>
  <line x1="290" y1="411.7" x2="290" y2="470" stroke="#334155" stroke-width="3"/>
  <line x1="290" y1="190" x2="290" y2="411.7" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="55" y1="470" x2="540" y2="470" stroke="#334155" stroke-width="1.8"/>
  <line x1="150" y1="85" x2="150" y2="525" stroke="#334155" stroke-width="1.8"/>
  <text x="528" y="460" class="small">x</text>
  <text x="161" y="101" class="small">y</text>
  <text x="132" y="489" class="small">O</text>
  <text x="430" y="491" class="small" text-anchor="middle">4</text>
  <text x="138" y="265" class="small" text-anchor="end">3</text>
  <circle cx="150" cy="470" r="7" fill="#2563eb"/>
  <circle cx="430" cy="470" r="7" fill="#2563eb"/>
  <circle cx="290" cy="260" r="7" fill="#16a34a"/>
  <circle cx="290" cy="411.7" r="7" fill="#d97706"/>
  <rect x="93" y="432" width="88" height="32" rx="5" fill="#f8fafc"/>
  <text x="137" y="454" class="label" text-anchor="middle">A (0, 0)</text>
  <rect x="405" y="432" width="88" height="32" rx="5" fill="#f8fafc"/>
  <text x="449" y="454" class="label" text-anchor="middle">B (4, 0)</text>
  <rect x="305" y="225" width="88" height="32" rx="5" fill="#f8fafc"/>
  <text x="349" y="247" class="label" text-anchor="middle">C (2, 3)</text>
  <rect x="305" y="394" width="100" height="32" rx="5" fill="#f8fafc"/>
  <text x="355" y="416" class="label" text-anchor="middle">V (2, 5/6)</text>
  <rect x="338" y="305" width="150" height="32" rx="5" fill="#f8fafc"/>
  <text x="413" y="327" class="label" text-anchor="middle">new cell for C</text>
  <rect x="300" y="151" width="190" height="32" rx="5" fill="#f8fafc"/>
  <text x="395" y="173" class="label" text-anchor="middle" fill="#dc2626">removed old AB edge</text>
  <line x1="300" y1="183" x2="293" y2="235" stroke="#6b7280" stroke-width="1.5"/>
  <text x="302" y="496" class="label" fill="#334155">AB edge kept</text>
  <rect x="585" y="65" width="280" height="480" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="610" y="103" class="subhead">New boundaries</text>
  <text x="610" y="140" class="math">AC: 4x + 6y = 13</text>
  <text x="610" y="174" class="math">BC: 4x − 6y = 3</text>
  <text x="610" y="208" class="math">AB: x = 2</text>
  <text x="610" y="260" class="subhead">Voronoi vertex</text>
  <text x="610" y="299" class="math">V = (2, 5/6)</text>
  <text x="610" y="345" class="label">Equal distances from V:</text>
  <text x="610" y="383" class="math">VA = VB = VC = 13/6</text>
  <line x1="610" y1="414" x2="840" y2="414" stroke="#e2e8f0"/>
  <text x="610" y="454" class="label">The old AB edge above V is</text>
  <text x="610" y="480" class="label">replaced by two new edges.</text>
  <text x="610" y="520" class="label">Below V, it stays unchanged.</text>
</svg>
