<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Algebraic substitution: replacing letters with numbers</title>
  <desc id="desc">Visual explanation showing how to substitute values into expressions; key vocabulary including coefficient, variable, constant and term; a worked example evaluating 3x²+2x−5 when x=4; and a formula substitution example using v=u+at.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 15px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="420" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Algebraic substitution</text>
  <text x="30" y="55" class="label">Substitution means replacing letters (variables) with given numbers and calculating the result.</text>

  <!-- Vocabulary -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="840" height="65" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="20" class="subhead" text-anchor="middle">Key words in algebra</text>
    <text x="20" y="44" class="label">Expression: 3x² + 2x − 5</text>
    <text x="280" y="44" class="label">3 = coefficient, x = variable, ² = index, −5 = constant</text>
    <text x="20" y="60" class="label">Terms are separated by + or −. This expression has 3 terms.</text>
  </g>

  <!-- Worked example -->
  <text x="30" y="180" class="subhead">Example: evaluate 3x² + 2x − 5 when x = 4</text>
  <g transform="translate(30, 200)">
    <rect x="0" y="0" width="400" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="15" y="22" class="label" fill="#2563eb">Step 1: Replace every x with 4 (use brackets!)</text>
    <text x="15" y="48" class="math" fill="#2563eb">3(4)² + 2(4) − 5</text>
    <text x="15" y="72" class="label" fill="#2563eb">Step 2: Follow BIDMAS: index first → multiply → add/subtract</text>
  </g>
  <g transform="translate(450, 200)">
    <rect x="0" y="0" width="420" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="15" y="22" class="label">= 3 × 16 + 8 − 5</text>
    <text x="15" y="44" class="label">= 48 + 8 − 5</text>
    <text x="15" y="68" class="math" fill="#16a34a" font-size="20">= 51</text>
  </g>

  <!-- Formula substitution -->
  <text x="30" y="335" class="subhead">Substitution into formulas</text>
  <g transform="translate(30, 355)">
    <rect x="0" y="0" width="840" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="20" y="20" class="math" fill="#d97706">v = u + at  →  Given: u = 10, a = 2, t = 5</text>
    <text x="20" y="42" class="math" fill="#d97706">v = 10 + 2 × 5 = 10 + 10 = 20</text>
  </g>
</svg>
