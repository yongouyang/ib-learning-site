<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Statistics: data types, sampling and probability</title>
  <desc id="desc">Overview of primary vs secondary data; sampling methods including random, stratified and systematic; a frequency table with grouped data; and probability concepts including sample space, events and expected frequency.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="420" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Statistics, sampling and probability</text>

  <!-- Data types -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="260" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="130" y="20" class="subhead" text-anchor="middle">Primary data</text>
    <text x="130" y="44" class="label" text-anchor="middle">You collect it yourself</text>
    <text x="130" y="62" class="label" text-anchor="middle">Surveys, experiments, measurements</text>
  </g>
  <g transform="translate(310, 55)">
    <rect x="0" y="0" width="260" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="130" y="20" class="subhead" text-anchor="middle">Secondary data</text>
    <text x="130" y="44" class="label" text-anchor="middle">Someone else collected it</text>
    <text x="130" y="62" class="label" text-anchor="middle">Census, internet, books, databases</text>
  </g>
  <g transform="translate(590, 55)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="140" y="20" class="subhead" text-anchor="middle">Population vs Sample</text>
    <text x="140" y="44" class="label" text-anchor="middle">Population = everyone/everything</text>
    <text x="140" y="62" class="label" text-anchor="middle">Sample = a subset used for study</text>
  </g>

  <!-- Sampling methods -->
  <text x="30" y="160" class="subhead">Sampling methods</text>
  <g transform="translate(30, 178)">
    <rect x="0" y="0" width="270" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="135" y="18" class="math" fill="#dc2626">Random</text>
    <text x="135" y="38" class="label" text-anchor="middle">Everyone has equal chance</text>
    <text x="135" y="56" class="label" text-anchor="middle">Use random number generator</text>
  </g>
  <g transform="translate(315, 178)">
    <rect x="0" y="0" width="270" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="135" y="18" class="math" fill="#2563eb">Stratified</text>
    <text x="135" y="38" class="label" text-anchor="middle">Sample reflects group proportions</text>
    <text x="135" y="56" class="label" text-anchor="middle">Random within each stratum</text>
  </g>
  <g transform="translate(600, 178)">
    <rect x="0" y="0" width="270" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="135" y="18" class="math" fill="#16a34a">Systematic</text>
    <text x="135" y="38" class="label" text-anchor="middle">Pick every nth from a list</text>
    <text x="135" y="56" class="label" text-anchor="middle">e.g. every 10th person</text>
  </g>

  <!-- Expected frequency -->
  <g transform="translate(30, 275)">
    <rect x="0" y="0" width="840" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">Expected frequency</text>
    <text x="420" y="48" class="label" text-anchor="middle">Expected = probability × number of trials  |  Example: P(heads)=0.5, toss coin 100 times → expect 50 heads</text>
  </g>

  <!-- Relative frequency -->
  <g transform="translate(30, 355)">
    <rect x="0" y="0" width="840" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle" fill="#7c3aed">Relative frequency → experimental probability</text>
    <text x="420" y="42" class="label" text-anchor="middle">Relative frequency = number of times event happens ÷ total trials. The more trials, the closer it gets to the true probability.</text>
  </g>
</svg>
