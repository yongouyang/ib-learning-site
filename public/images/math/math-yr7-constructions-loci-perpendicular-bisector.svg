<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-labelledby="title desc">
  <title id="title">Constructing a perpendicular bisector of a line segment</title>
  <desc id="desc">A line segment AB with arcs drawn from both ends intersecting above and below, and the perpendicular bisector drawn through the intersection points.</desc>
  <line x1="80" y1="140" x2="420" y2="140" stroke="#374151" stroke-width="3"/>
  <circle cx="80" cy="140" r="110" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="420" cy="140" r="110" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="250" y1="40" x2="250" y2="240" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="170" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#374151">A</text>
  <text x="430" y="170" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#374151">B</text>
  <text x="250" y="30" text-anchor="middle" font-family="system-ui" font-size="14" fill="#dc2626">Perpendicular bisector</text>
  <text x="250" y="265" text-anchor="middle" font-family="system-ui" font-size="14" fill="#374151">All points on the red line are equidistant from A and B.</text>
</svg>