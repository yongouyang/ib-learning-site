<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Bounds of a sum and a difference</title>
  <desc id="desc">Two number lines show the range of a and of b, and beneath them the resulting range for a plus b and for a minus b.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Bounds of a sum and a difference</text>
  <rect x="30" y="55" width="840" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="450.0" y="77" class="subhead" text-anchor="middle">Adding and subtracting rounded values</text>
  <line x1="150" y1="150" x2="700" y2="150" stroke="#334155" stroke-width="1.6"/>
  <rect x="610" y="136" width="40" height="28" fill="#bfdbfe" opacity="0.55"/>
  <line x1="610" y1="140" x2="610" y2="160" stroke="#dc2626" stroke-width="2"/>
  <line x1="650" y1="140" x2="650" y2="160" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="126" class="label">a is 12 to the nearest whole number</text>
  <text x="610.0" y="184" class="math" text-anchor="middle" fill="#dc2626">11.5</text>
  <text x="650.0" y="184" class="math" text-anchor="middle" fill="#2563eb">12.5</text>
  <line x1="150" y1="250" x2="700" y2="250" stroke="#334155" stroke-width="1.6"/>
  <rect x="410" y="236" width="40" height="28" fill="#bfdbfe" opacity="0.55"/>
  <line x1="410" y1="240" x2="410" y2="260" stroke="#dc2626" stroke-width="2"/>
  <line x1="450" y1="240" x2="450" y2="260" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="226" class="label">b is 7 to the nearest whole number</text>
  <text x="410.0" y="284" class="math" text-anchor="middle" fill="#dc2626">6.5</text>
  <text x="450.0" y="284" class="math" text-anchor="middle" fill="#2563eb">7.5</text>
  <text x="60" y="320" class="label" fill="#dc2626">Lowest a + b = 11.5 + 6.5 = 18</text>
  <text x="60" y="346" class="label" fill="#2563eb">Highest a + b = 12.5 + 7.5 = 20</text>
  <text x="60" y="372" class="label" fill="#0f172a">Lowest a − b = 11.5 − 7.5 = 4   ·   highest a − b = 12.5 − 6.5 = 6</text>
  <text x="60" y="398" class="small">For a difference the LOWEST is the smallest minus the largest — mixing the ends is the classic error.</text>
</svg>
