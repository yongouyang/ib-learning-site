<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Exponential and logarithmic functions: graphs and properties</title>
  <desc id="desc">Graphs of y=eˣ and y=ln x showing inverse symmetry across y=x; key properties of exponential growth/decay models y=Aeᵏᵗ; and log laws with worked examples.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="420" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Exponential and logarithmic functions</text>

  <!-- Graphs -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="380" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="190" y="15" class="subhead" text-anchor="middle">y = eˣ and y = ln x</text>
    <g transform="translate(20, 25)">
      <line x1="0" y1="150" x2="340" y2="150" stroke="#94a3b8" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="160" stroke="#94a3b8" stroke-width="1"/>
      <!-- y=x -->
      <line x1="100" y1="150" x2="260" y2="-10" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- y=e^x -->
      <path d="M 20 149 C 60 147, 85 142, 100 130 C 111 121, 118 108, 124 90 C 129 74, 133 58, 136 42 C 138 30, 140 18, 141 8" fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="150" y="14" class="label" fill="#2563eb" font-size="11">y=eˣ</text>
      <!-- y=ln x -->
      <path d="M 105 161 C 112 154, 116 151, 121 149 C 132 144, 143 136, 158 129 C 178 120, 205 114, 228 111 C 255 107.5, 300 103, 340 100" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="280" y="92" class="label" fill="#dc2626" font-size="11">y=ln x</text>
    </g>
  </g>

  <!-- Properties -->
  <g transform="translate(430, 55)">
    <rect x="0" y="0" width="440" height="200" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="220" y="20" class="subhead" text-anchor="middle">Key properties</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#2563eb">eˣ domain: ℝ, range: (0,∞), asymptote y=0</text>
      <text x="0" y="24" class="math" fill="#dc2626">ln x domain: (0,∞), range: ℝ, asymptote x=0</text>
      <text x="0" y="50" class="math">eˣ and ln x are inverse functions: e^(ln x)=x</text>
      <text x="0" y="76" class="math" fill="#16a34a">Exponential model: A(t) = A₀eᵏᵗ</text>
      <text x="0" y="96" class="label" fill="#16a34a">k&gt;0: growth ; k&lt;0: decay ; half-life: t=ln2/|k|</text>
      <text x="0" y="124" class="math" fill="#d97706">Log laws: ln(ab)=ln a+ln b ; ln(a/b)=ln a−ln b ; ln(aⁿ)=n·ln a</text>
      <text x="0" y="148" class="label" fill="#d97706">Also: logₐ(b)=ln b/ln a (change of base)</text>
    </g>
  </g>

  <!-- Exponential growth/decay -->
  <g transform="translate(30, 285)">
    <rect x="0" y="0" width="840" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="420" y="20" class="subhead" text-anchor="middle">Solving eˣ and ln equations</text>
    <text x="420" y="42" class="label" text-anchor="middle">eˣ=5 → x=ln5 | ln(2x−3)=4 → 2x−3=e⁴ → x=(e⁴+3)/2</text>
  </g>
</svg>
