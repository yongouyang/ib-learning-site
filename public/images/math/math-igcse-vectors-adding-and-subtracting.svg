<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Adding and subtracting vectors</title>
  <desc id="desc">Tip-to-tail addition: AB plus BC gives AC. Subtracting reverses the second vector, so AB is b minus a, with the parallelogram completing the same result.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <defs><marker id="av" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#334155"/></marker></defs>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Adding and subtracting vectors</text>
  <rect x="30" y="55" width="480" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="270.0" y="77" class="subhead" text-anchor="middle">Tip to tail: AB + BC = AC</text>
  <line x1="110" y1="300" x2="220" y2="300" stroke="#2563eb" stroke-width="2.6" marker-end="url(#av)"/>
  <line x1="220" y1="300" x2="330" y2="215" stroke="#16a34a" stroke-width="2.6" marker-end="url(#av)"/>
  <line x1="110" y1="300" x2="330" y2="215" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#av)"/>
  <circle cx="110" cy="300" r="3.5" fill="#334155"/>
  <text x="94" y="318" class="math">A</text>
  <circle cx="220" cy="300" r="3.5" fill="#334155"/>
  <text x="216" y="320" class="math">B</text>
  <circle cx="330" cy="215" r="3.5" fill="#334155"/>
  <text x="342" y="213" class="math">C</text>
  <text x="160" y="322" class="math" fill="#2563eb">a</text>
  <text x="278" y="270" class="math" fill="#16a34a">b</text>
  <text x="200" y="242" class="math" fill="#dc2626">a + b</text>
  <text x="270" y="380" class="small" text-anchor="middle">Follow one vector, then the other — the result joins start to finish.</text>
  <rect x="530" y="55" width="340" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="700.0" y="77" class="subhead" text-anchor="middle">Subtracting</text>
  <line x1="560" y1="230" x2="660" y2="230" stroke="#2563eb" stroke-width="2.6" marker-end="url(#av)"/>
  <line x1="660" y1="230" x2="740" y2="150" stroke="#16a34a" stroke-width="2.6" marker-end="url(#av)"/>
  <line x1="560" y1="230" x2="740" y2="150" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#av)"/>
  <text x="590" y="252" class="math" fill="#2563eb">a</text>
  <text x="712" y="180" class="math" fill="#16a34a">b</text>
  <text x="636" y="196" class="math" fill="#dc2626">a + b</text>
  <text x="552" y="300" class="label">AB = b − a when a and b are position</text>
  <text x="552" y="322" class="small">vectors from the origin.</text>
  <text x="552" y="344" class="small"></text>
  <text x="552" y="366" class="label">Parallel vectors are scalar multiples:</text>
  <text x="552" y="388" class="small">one is k times the other.</text>
  <text x="552" y="410" class="small"></text>
  <text x="552" y="432" class="label">Magnitude = √(x² + y²), from Pythagoras.</text>
</svg>
