<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">The unit circle and exact values</title>
  <desc id="desc">A unit circle whose special angles 30, 45 and 60 degrees are marked in the first quadrant with their coordinates written as cosine theta and sine theta, the four axis points labelled, and a side panel listing the arc length, sector area and degree-radian conversions.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 13px; fill: #111827; }
    .small { font-size: 11px; fill: #64748b; }
  </style>
  <rect width="900" height="540" fill="#f8fafc" rx="12"/>
  <text x="30" y="34" class="heading">The unit circle and exact values</text>
  <text x="30" y="54" class="small">The point at angle θ is (cos θ, sin θ): cosine is the x-coordinate, sine is the y-coordinate.</text>
  <circle cx="250" cy="290" r="155" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="71" y1="290" x2="445" y2="290" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="111" x2="250" y2="475" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="405.0" cy="290.0" r="4.5" fill="#2563eb"/>
  <text x="435.0" y="295.0" class="label" text-anchor="start">(1, 0)</text>
  <circle cx="384.2" cy="212.5" r="4.5" fill="#2563eb"/>
  <line x1="250" y1="290" x2="384.2" y2="212.5" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <text x="406.2" y="200.5" class="label" text-anchor="start">(√3/2, 1/2)</text>
  <circle cx="359.6" cy="180.4" r="4.5" fill="#2563eb"/>
  <line x1="250" y1="290" x2="359.6" y2="180.4" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <text x="381.6" y="168.4" class="label" text-anchor="start">(√2/2, √2/2)</text>
  <circle cx="327.5" cy="155.8" r="4.5" fill="#2563eb"/>
  <line x1="250" y1="290" x2="327.5" y2="155.8" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <text x="349.5" y="143.8" class="label" text-anchor="start">(1/2, √3/2)</text>
  <circle cx="250.0" cy="135.0" r="4.5" fill="#64748b"/>
  <text x="250.0" y="121.0" class="math" text-anchor="middle">(0, 1)</text>
  <circle cx="95.0" cy="290.0" r="4.5" fill="#64748b"/>
  <text x="65.0" y="295.0" class="math" text-anchor="end">(−1, 0)</text>
  <circle cx="250.0" cy="445.0" r="4.5" fill="#64748b"/>
  <text x="250.0" y="469.0" class="math" text-anchor="middle">(0, −1)</text>
  <text x="230.0" y="179.0" class="small" text-anchor="end">sin θ</text>
  <text x="308.0" y="278.0" class="small" text-anchor="start">θ</text>
  <text x="435.0" y="312.0" class="small" text-anchor="start">cos θ</text>
  <text x="250.0" y="500.0" class="small" text-anchor="middle">Quadrant signs:  Q1 all positive  ·  Q2 sin positive  ·  Q3 tan positive  ·  Q4 cos positive</text>
  <rect x="490" y="74" width="380" height="330" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="508.0" y="100.0" class="subhead" text-anchor="start">Radians and exact values</text>
  <text x="510.0" y="132.0" class="math" text-anchor="start">π radians = 180°</text>
  <text x="510.0" y="160.0" class="math" text-anchor="start">degrees → radians</text>
  <text x="672.0" y="160.0" class="math" text-anchor="start">× π/180</text>
  <text x="510.0" y="188.0" class="math" text-anchor="start">arc length</text>
  <text x="672.0" y="188.0" class="math" text-anchor="start">l = rθ</text>
  <text x="510.0" y="216.0" class="math" text-anchor="start">sector area</text>
  <text x="672.0" y="216.0" class="math" text-anchor="start">A = ½r²θ</text>
  <text x="510.0" y="272.0" class="math" text-anchor="start">sin 30° = 1/2</text>
  <text x="672.0" y="272.0" class="math" text-anchor="start">cos 30° = √3/2</text>
  <text x="510.0" y="300.0" class="math" text-anchor="start">sin 45° = √2/2</text>
  <text x="672.0" y="300.0" class="math" text-anchor="start">cos 45° = √2/2</text>
  <text x="510.0" y="328.0" class="math" text-anchor="start">sin 60° = √3/2</text>
  <text x="672.0" y="328.0" class="math" text-anchor="start">cos 60° = 1/2</text>
  <text x="510.0" y="356.0" class="math" text-anchor="start">tan 45° = 1</text>
  <text x="672.0" y="356.0" class="math" text-anchor="start">tan 60° = √3</text>
  <text x="510.0" y="420.0" class="small" text-anchor="start">θ in the formulas is measured in radians, never in degrees.</text>
  <text x="510.0" y="442.0" class="small" text-anchor="start">Sine is the height of the point; cosine is its horizontal distance.</text>
  <text x="510.0" y="464.0" class="small" text-anchor="start">Two angles share a sine in a full turn: α and 180° − α.</text>
  <text x="510.0" y="486.0" class="small" text-anchor="start">Two angles share a cosine: α and 360° − α.</text>
</svg>
