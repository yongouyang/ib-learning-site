<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Arithmetic and geometric sequences</title>
  <desc id="desc">An arithmetic sequence adds a constant difference while a geometric sequence multiplies by a constant ratio, with the nth-term and sum formulas for each and a chart showing a geometric series converging.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Arithmetic and geometric sequences</text>
  <rect x="30" y="55" width="420" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="240.0" y="77" class="subhead" text-anchor="middle">Arithmetic: add d</text>
  <text x="60" y="110" class="math">uₙ = u₁ + (n − 1)d</text>
  <text x="60" y="144" class="math">Sₙ = n/2 (2u₁ + (n − 1)d)</text>
  <text x="60" y="178" class="math">Sₙ = n/2 (u₁ + uₙ)</text>
  <rect x="470" y="55" width="400" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="670.0" y="77" class="subhead" text-anchor="middle">Geometric: multiply by r</text>
  <text x="500" y="110" class="math">uₙ = u₁ rⁿ⁻¹</text>
  <text x="500" y="144" class="math">Sₙ = u₁(rⁿ − 1) / (r − 1)</text>
  <text x="500" y="178" class="math">S∞ = u₁ / (1 − r)   when |r| &lt; 1</text>
  <rect x="30" y="250" width="420" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="240.0" y="272" class="subhead" text-anchor="middle">Arithmetic versus geometric</text>
  <text x="60" y="306" class="math">3, 7, 11, 15, …</text>
  <text x="250" y="306" class="small">arithmetic</text>
  <text x="60" y="332" class="label">common difference d = 4</text>
  <text x="60" y="382" class="math">2, 6, 18, 54, …</text>
  <text x="250" y="382" class="small">geometric</text>
  <text x="60" y="408" class="label">common ratio r = 3</text>
  <rect x="470" y="250" width="400" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="670.0" y="272" class="subhead" text-anchor="middle">A geometric series converging</text>
  <line x1="505" y1="425" x2="850" y2="425" stroke="#334155" stroke-width="1.4"/>
  <line x1="505" y1="425" x2="505" y2="270" stroke="#334155" stroke-width="1.4"/>
  <rect x="505" y="398" width="34" height="27" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="543" y="411" width="34" height="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="582" y="418" width="34" height="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="620" y="422" width="34" height="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="658" y="423" width="34" height="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="697" y="424" width="34" height="1" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="735" y="425" width="34" height="0" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="773" y="425" width="34" height="0" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="812" y="425" width="34" height="0" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <line x1="505" y1="374" x2="850" y2="374" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="844" y="365" class="math" text-anchor="end" fill="#dc2626">S∞ = 16</text>
  <text x="515" y="285" class="small">each term is r times the one before</text>
</svg>
