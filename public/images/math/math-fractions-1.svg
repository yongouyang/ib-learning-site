<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Fractions: parts of a whole, types, and operations</title>
  <desc id="desc">Visual explanation of fractions showing a whole split into equal parts; proper fractions, improper fractions and mixed numbers with diagrams; equivalent fractions shown by differently partitioned bars; and fraction operations including adding, subtracting, multiplying and dividing.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
    .frac-num { fill: #2563eb; font-weight: 700; }
    .frac-den { fill: #16a34a; font-weight: 700; }
    .pie-whole { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .pie-slice { fill: #2563eb; fill-opacity: 0.6; stroke: #1d4ed8; stroke-width: 1.5; }
    .bar-bg { fill: #e2e8f0; }
    .bar-fill { fill: #2563eb; fill-opacity: 0.7; }
    .bar-fill2 { fill: #16a34a; fill-opacity: 0.7; }
    .bar-fill3 { fill: #d97706; fill-opacity: 0.7; }
  </style>

  <rect width="900" height="500" fill="#f8fafc" rx="12"/>

  <!-- SECTION 1: What is a fraction -->
  <text x="30" y="35" class="heading">What is a fraction?</text>

  <g transform="translate(30, 55)">
    <text x="0" y="0" class="label">A fraction shows equal parts of a whole:</text>
    
    <!-- Circle with 3/8 shaded -->
    <g transform="translate(20, 20)">
      <circle cx="55" cy="55" r="50" class="pie-whole"/>
      <!-- 3 slices out of 8 -->
      <path d="M55,55 L55,5 A50,50 0 0,1 90,20 Z" class="pie-slice"/>
      <path d="M55,55 L90,20 A50,50 0 0,1 105,55 Z" class="pie-slice"/>
      <path d="M55,55 L105,55 A50,50 0 0,1 90,90 Z" class="pie-slice"/>
      <!-- Division lines -->
      <line x1="55" y1="5" x2="55" y2="105" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="5" y1="55" x2="105" y2="55" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="20" y1="20" x2="90" y2="90" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="90" y1="20" x2="20" y2="90" stroke="#cbd5e1" stroke-width="1"/>
      <text x="55" y="125" class="label" text-anchor="middle">3 out of 8 equal parts</text>
    </g>

    <!-- Numerator/denominator labels -->
    <g transform="translate(180, 30)">
      <text x="0" y="15" class="frac-num" font-size="26">3</text>
      <line x1="-5" y1="24" x2="35" y2="24" stroke="#1f2937" stroke-width="2"/>
      <text x="0" y="44" class="frac-den" font-size="26">8</text>
      
      <!-- Leader to numerator -->
      <line x1="45" y1="12" x2="75" y2="12" stroke="#2563eb" stroke-width="1.2"/>
      <text x="80" y="16" class="label" fill="#2563eb">← numerator — how many parts you have</text>
      <!-- Leader to denominator -->
      <line x1="45" y1="38" x2="75" y2="38" stroke="#16a34a" stroke-width="1.2"/>
      <text x="80" y="42" class="label" fill="#16a34a">← denominator — total number of equal parts</text>
    </g>
  </g>

  <!-- SECTION 2: Types of fractions -->
  <text x="30" y="165" class="heading">Types of fractions</text>

  <!-- Proper fraction 3/4 -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="22" class="subhead" text-anchor="middle">Proper</text>
    <rect x="15" y="32" width="90" height="16" rx="3" class="bar-bg"/>
    <rect x="15" y="32" width="67" height="16" rx="3" class="bar-fill"/>
    <text x="60" y="65" class="math" text-anchor="middle">numerator &lt; denominator</text>
    <text x="60" y="83" class="label" fill="#6b7280" text-anchor="middle" font-size="11">Value &lt; 1</text>
  </g>

  <!-- Improper fraction 5/3 -->
  <g transform="translate(175, 185)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="70" y="22" class="subhead" text-anchor="middle">Improper</text>
    <!-- 5/3 shown as bars -->
    <rect x="15" y="32" width="100" height="14" rx="3" class="bar-bg"/>
    <rect x="15" y="32" width="100" height="14" rx="3" class="bar-fill3"/>
    <rect x="15" y="49" width="100" height="14" rx="3" class="bar-bg"/>
    <rect x="15" y="49" width="66" height="14" rx="3" class="bar-fill3"/>
    <text x="125" y="45" class="label" font-size="11">1 + ²/₃</text>
    <text x="70" y="83" class="label" fill="#6b7280" text-anchor="middle" font-size="11">Value ≥ 1</text>
  </g>

  <!-- Mixed number 1⅔ -->
  <g transform="translate(340, 185)">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="60" y="22" class="subhead" text-anchor="middle">Mixed Number</text>
    <text x="60" y="52" class="math" filler="#16a34a" text-anchor="middle" font-size="20" style="fill:#16a34a">1⅔</text>
    <text x="60" y="78" class="label" fill="#6b7280" text-anchor="middle" font-size="11">Whole + fraction</text>
  </g>

  <!-- Equivalent fractions -->
  <text x="30" y="300" class="heading">Equivalent fractions</text>

  <g transform="translate(30, 320)">
    <text x="0" y="0" class="label">Different fractions that represent the same value:</text>
    
    <!-- 1/2 bar -->
    <text x="0" y="26" class="math" fill="#2563eb">1/2</text>
    <rect x="35" y="16" width="200" height="16" rx="3" class="bar-bg"/>
    <rect x="35" y="16" width="100" height="16" rx="3" class="bar-fill"/>

    <!-- 2/4 bar -->
    <text x="0" y="52" class="math" fill="#16a34a">2/4</text>
    <rect x="35" y="42" width="200" height="16" rx="3" class="bar-bg"/>
    <rect x="35" y="42" width="100" height="16" rx="3" class="bar-fill2"/>
    <line x1="85" y1="42" x2="85" y2="58" stroke="#fff" stroke-width="1"/>
    <line x1="135" y1="42" x2="135" y2="58" stroke="#fff" stroke-width="1"/>

    <!-- 4/8 bar -->
    <text x="0" y="78" class="math" fill="#d97706">4/8</text>
    <rect x="35" y="68" width="200" height="16" rx="3" class="bar-bg"/>
    <rect x="35" y="68" width="100" height="16" rx="3" class="bar-fill3"/>
    <line x1="60" y1="68" x2="60" y2="84" stroke="#fff" stroke-width="1"/>
    <line x1="85" y1="68" x2="85" y2="84" stroke="#fff" stroke-width="1"/>
    <line x1="110" y1="68" x2="110" y2="84" stroke="#fff" stroke-width="1"/>

    <!-- Equals signs -->
    <text x="250" y="28" font-size="16" fill="#6b7280">=</text>
    <text x="250" y="54" font-size="16" fill="#6b7280">=</text>

    <text x="260" y="24" class="label">Multiply/divide both numerator</text>
    <text x="260" y="42" class="label">and denominator by the same</text>
    <text x="260" y="60" class="label">number to find equivalents.</text>
  </g>

  <!-- SECTION 4: Operations -->
  <text x="490" y="35" class="heading">Fraction operations</text>

  <g transform="translate(490, 60)">
    <rect x="0" y="0" width="380" height="200" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    
    <g transform="translate(15, 20)">
      <text x="0" y="0" class="subhead">➕ Adding &amp; Subtracting</text>
      <text x="0" y="22" class="label">Same denominators? Just add/subtract the top:</text>
      <text x="10" y="42" class="math" fill="#2563eb">2/5 + 1/5 = 3/5</text>
      <text x="0" y="62" class="label">Different denominators? Find the LCD first:</text>
      <text x="10" y="82" class="math" fill="#2563eb">1/3 + 1/4 = 4/12 + 3/12 = 7/12</text>
      
      <text x="0" y="110" class="subhead">✖️ Multiplying</text>
      <text x="0" y="132" class="label">Multiply tops × tops, bottoms × bottoms:</text>
      <text x="10" y="152" class="math" fill="#16a34a">2/3 × 4/5 = (2×4)/(3×5) = 8/15</text>

      <text x="0" y="178" class="subhead">➗ Dividing</text>
      <text x="0" y="200" class="label">Flip the second fraction, then multiply (KFC):</text>
      <text x="10" y="220" class="math" fill="#d97706">3/4 ÷ 2/3 = 3/4 × 3/2 = 9/8 = 1⅛</text>
    </g>
  </g>

  <!-- Simplifying fractions -->
  <g transform="translate(30, 430)">
    <rect x="0" y="0" width="420" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="210" y="20" class="subhead" text-anchor="middle">Simplifying (reducing) fractions</text>
    <text x="210" y="42" class="label" text-anchor="middle">Divide numerator and denominator by their HCF → 8/12 ÷ 4/4 = 2/3</text>
  </g>
</svg>
