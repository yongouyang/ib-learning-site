<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Types of angles and parallel line angle pairs</title>
  <desc id="desc">Visual reference showing acute, right, obtuse, straight and reflex angles; vertically opposite equal angles from intersecting lines; and corresponding, alternate, and co-interior angles formed by a transversal crossing parallel lines.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 15px; fill: #111827; font-weight: 600; }
    .ray { stroke: #1f2937; stroke-width: 2; }
    .angle-arc { fill: none; stroke-width: 2.5; }
    .phase { stroke: #6b7280; stroke-width: 1.2; }
    .parallel { stroke: #374151; stroke-width: 2; }
    .transversal { stroke: #dc2626; stroke-width: 2; }
  </style>

  <rect width="900" height="700" fill="#f8fafc" rx="12"/>

  <!-- SECTION 1: Angle Types -->
  <text x="30" y="35" class="heading">Angle types</text>

  <g transform="translate(10, 55)">
    <line x1="0" y1="55" x2="130" y2="55" class="ray"/>
    <line x1="0" y1="55" x2="100" y2="5" class="ray"/>
    <path d="M 50 55 A 45 45 0 0 1 70 25" stroke="#2563eb" fill="#dbeafe" fill-opacity="0.3" stroke-width="2.5"/>
    <rect x="15" y="62" width="100" height="20" rx="4" fill="#f9fafb"/>
    <text x="65" y="76" class="label" text-anchor="middle">Acute &lt; 90°</text>
  </g>

  <g transform="translate(150, 55)">
    <line x1="0" y1="55" x2="130" y2="55" class="ray"/>
    <line x1="0" y1="55" x2="0" y2="5" class="ray"/>
    <rect x="4" y="7" width="16" height="16" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <rect x="15" y="62" width="100" height="20" rx="4" fill="#f9fafb"/>
    <text x="65" y="76" class="label" text-anchor="middle">Right = 90°</text>
  </g>

  <g transform="translate(290, 55)">
    <line x1="0" y1="55" x2="130" y2="55" class="ray"/>
    <line x1="0" y1="55" x2="30" y2="5" class="ray"/>
    <path d="M 50 55 A 45 45 0 0 0 18 20" stroke="#d97706" fill="#fef3c7" fill-opacity="0.3" stroke-width="2.5"/>
    <rect x="5" y="62" width="130" height="20" rx="4" fill="#f9fafb"/>
    <text x="70" y="76" class="label" text-anchor="middle">Obtuse 90°–180°</text>
  </g>

  <g transform="translate(450, 55)">
    <line x1="0" y1="55" x2="130" y2="55" class="ray"/>
    <line x1="130" y1="55" x2="0" y2="55" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M 65 55 A 8 8 0 0 1 65 39" stroke="#16a34a" fill="none" stroke-width="2"/>
    <rect x="10" y="62" width="120" height="20" rx="4" fill="#f9fafb"/>
    <text x="70" y="76" class="label" text-anchor="middle">Straight = 180°</text>
  </g>

  <g transform="translate(600, 55)">
    <line x1="0" y1="55" x2="130" y2="55" class="ray"/>
    <line x1="0" y1="55" x2="100" y2="5" class="ray"/>
    <path d="M 70 55 A 50 50 0 0 0 30 15" stroke="#7c3aed" fill="none" stroke-width="2.5"/>
    <text x="100" y="50" font-size="13" font-family="system-ui, sans-serif" fill="#7c3aed">225°</text>
    <rect x="10" y="62" width="120" height="20" rx="4" fill="#f9fafb"/>
    <text x="70" y="76" class="label" text-anchor="middle">Reflex &gt; 180°</text>
  </g>

  <!-- SECTION 2: Vertically Opposite -->
  <text x="30" y="162" class="heading">Vertically opposite angles</text>

  <g transform="translate(30, 168)">
    <line x1="20" y1="5" x2="180" y2="105" stroke="#1f2937" stroke-width="2"/>
    <line x1="180" y1="5" x2="20" y2="105" stroke="#1f2937" stroke-width="2"/>
    <path d="M 100 55 A 25 25 0 0 1 125 48" stroke="#2563eb" fill="#dbeafe" fill-opacity="0.3" stroke-width="2.5"/>
    <text x="122" y="42" class="math" fill="#2563eb">a</text>
    <path d="M 100 55 A 25 25 0 0 1 75 62" stroke="#2563eb" fill="#dbeafe" fill-opacity="0.3" stroke-width="2.5"/>
    <text x="70" y="78" class="math" fill="#2563eb">a</text>
    <rect x="15" y="115" width="170" height="20" rx="4" fill="#f9fafb"/>
    <text x="100" y="129" class="label" text-anchor="middle">Opposite angles are equal</text>
  </g>

  <!-- SECTION 3: Parallel Lines -->
  <text x="30" y="322" class="heading">Parallel lines with a transversal</text>

  <g transform="translate(30, 342)">
    <line x1="0" y1="15" x2="420" y2="15" class="parallel"/>
    <line x1="0" y1="85" x2="420" y2="85" class="parallel"/>
    <line x1="315" y1="0" x2="105" y2="105" class="transversal"/>
    <polygon points="415,11 422,15 415,19" fill="#374151"/>
    <polygon points="415,81 422,85 415,89" fill="#374151"/>

    <path d="M 210 15 A 22 22 0 0 1 225 0" stroke="#2563eb" fill="#dbeafe" fill-opacity="0.3" stroke-width="2.5"/>
    <text x="229" y="12" class="math" fill="#2563eb">1</text>
    <path d="M 210 15 A 25 25 0 0 0 185 30" stroke="#dc2626" fill="#fee2e2" fill-opacity="0.3" stroke-width="2.5"/>
    <text x="184" y="38" class="math" fill="#dc2626">2</text>
    <path d="M 210 85 A 22 22 0 0 1 225 70" stroke="#2563eb" fill="#dbeafe" fill-opacity="0.3" stroke-width="2.5"/>
    <text x="229" y="82" class="math" fill="#2563eb">3</text>
    <path d="M 210 85 A 25 25 0 0 0 185 100" stroke="#dc2626" fill="#fee2e2" fill-opacity="0.3" stroke-width="2.5"/>
    <text x="184" y="108" class="math" fill="#dc2626">4</text>

    <text x="350" y="12" class="label">parallel</text>
    <text x="318" y="48" class="label" fill="#dc2626">transversal</text>
  </g>

  <!-- Angle pair summary box -->
  <g transform="translate(480, 342)">
    <rect x="0" y="0" width="390" height="200" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="195" y="25" class="subhead" text-anchor="middle">Angle pairs on parallel lines</text>
    <g transform="translate(15, 45)">
      <text x="0" y="0" class="math" fill="#2563eb">Corresponding (F-shape):</text>
      <text x="0" y="18" class="label">∠1 = ∠3 — in the same position</text>
      <text x="0" y="40" class="math" fill="#dc2626">Alternate (Z-shape):</text>
      <text x="0" y="58" class="label">∠1 = ∠4 — inside, opposite sides</text>
      <text x="0" y="80" class="math" fill="#d97706">Co-interior (C-shape):</text>
      <text x="0" y="98" class="label">∠2 + ∠3 = 180° — inside, same side</text>
      <text x="0" y="122" class="math" fill="#7c3aed">Vertically opposite:</text>
      <text x="0" y="140" class="label">∠1 = opposite ∠1; ∠2 = opposite ∠2</text>
    </g>
  </g>

  <!-- SECTION 4: Polygon Angles -->
  <text x="30" y="560" class="heading">Polygon angle facts</text>

  <g transform="translate(30, 580)">
    <polygon points="0,30 120,10 140,80 30,90" fill="#fef3c7" fill-opacity="0.3" stroke="#d97706" stroke-width="2"/>
    <text x="70" y="110" class="label" text-anchor="middle">Quadrilateral sum = 360°</text>
  </g>

  <g transform="translate(250, 580)">
    <polygon points="0,80 100,10 200,80" fill="#dbeafe" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
    <path d="M 20 73 A 16 16 0 0 1 35 60" stroke="#2563eb" fill="#dbeafe" fill-opacity="0.2" stroke-width="2"/>
    <text x="18" y="50" class="math" fill="#2563eb">a</text>
    <path d="M 180 73 A 16 16 0 0 0 165 60" stroke="#dc2626" fill="#fee2e2" fill-opacity="0.2" stroke-width="2"/>
    <text x="175" y="50" class="math" fill="#dc2626">b</text>
    <path d="M 100 15 A 20 20 0 0 1 118 28" stroke="#d97706" fill="#fef3c7" fill-opacity="0.2" stroke-width="2"/>
    <text x="118" y="38" class="math" fill="#d97706">c</text>
    <text x="100" y="105" class="label" text-anchor="middle">a + b + c = 180°</text>
  </g>

  <g transform="translate(560, 580)">
    <polygon points="0,80 80,15 160,80" fill="#dcfce7" fill-opacity="0.3" stroke="#16a34a" stroke-width="2"/>
    <line x1="160" y1="80" x2="220" y2="80" stroke="#374151" stroke-width="2"/>
    <path d="M 155 75 A 18 18 0 0 0 148 82" stroke="#16a34a" fill="#dcfce7" fill-opacity="0.4" stroke-width="2"/>
    <text x="152" y="63" class="math" fill="#16a34a">e</text>
    <text x="80" y="105" class="label" text-anchor="middle">Exterior = sum of two interiors</text>
  </g>
</svg>
