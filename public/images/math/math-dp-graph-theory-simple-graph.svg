<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">A simple undirected graph</title>
  <desc id="desc">Five labelled vertices connected by edges, illustrating order, size and adjacency in graph theory.</desc>
  <line x1="80" y1="80" x2="200" y2="80" stroke="#6b7280" stroke-width="2"/>
  <line x1="200" y1="80" x2="320" y2="80" stroke="#6b7280" stroke-width="2"/>
  <line x1="80" y1="80" x2="140" y2="200" stroke="#6b7280" stroke-width="2"/>
  <line x1="200" y1="80" x2="140" y2="200" stroke="#6b7280" stroke-width="2"/>
  <line x1="200" y1="80" x2="260" y2="200" stroke="#6b7280" stroke-width="2"/>
  <line x1="320" y1="80" x2="260" y2="200" stroke="#6b7280" stroke-width="2"/>
  <line x1="140" y1="200" x2="260" y2="200" stroke="#6b7280" stroke-width="2"/>
  <circle cx="80" cy="80" r="24" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="200" cy="80" r="24" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="320" cy="80" r="24" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="140" cy="200" r="24" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="260" cy="200" r="24" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="80" y="87" text-anchor="middle" font-family="system-ui" font-size="16" fill="white" font-weight="bold">A</text>
  <text x="200" y="87" text-anchor="middle" font-family="system-ui" font-size="16" fill="white" font-weight="bold">B</text>
  <text x="320" y="87" text-anchor="middle" font-family="system-ui" font-size="16" fill="white" font-weight="bold">C</text>
  <text x="140" y="207" text-anchor="middle" font-family="system-ui" font-size="16" fill="white" font-weight="bold">D</text>
  <text x="260" y="207" text-anchor="middle" font-family="system-ui" font-size="16" fill="white" font-weight="bold">E</text>
  <text x="200" y="300" text-anchor="middle" font-family="system-ui" font-size="14" fill="#374151">Order = 5 vertices, Size = 7 edges</text>
</svg>