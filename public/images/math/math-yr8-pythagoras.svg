<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Pythagoras' theorem and coordinate distance</title>
  <desc id="desc">A right-angled triangle with squares drawn on each side to show a squared plus b squared equals c squared, plus a coordinate grid example of the distance between two points.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .label { font-size: 14px; fill: #374151; }
    .math { font-size: 16px; fill: #111827; font-weight: 600; }
    .caption { font-size: 13px; fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #374151; stroke-width: 2; }
    .triangle { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
    .square-a { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .square-b { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .square-c { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
    .right-angle { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
    .distance-line { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 6,4; }
    .dashed { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5,5; fill: none; }
    .point { fill: #2563eb; }
  </style>

  <!-- Pythagorean triangle with squares -->
  <g transform="translate(80, 60)">
    <!-- Triangle -->
    <polygon points="50,250 250,250 50,70" class="triangle"/>

    <!-- Right angle marker -->
    <polyline points="80,250 80,220 50,220" class="right-angle" fill="none"/>

    <!-- Square on side a (vertical leg) -->
    <polygon points="50,70 20,70 20,250 50,250" class="square-a"/>

    <!-- Square on side b (horizontal leg) -->
    <polygon points="50,250 250,250 250,280 50,280" class="square-b"/>

    <!-- Square on side c (hypotenuse) -->
    <!-- Hypotenuse from (50,70) to (250,250). Vector = (200, 180). Perpendicular = (-180, 200) scaled to same length as side -->
    <!-- Use a simpler offset square by rotating a unit perpendicular -->
    <polygon points="50,70 250,250 358,158 158,-22" class="square-c"/>

    <!-- Labels -->
    <text x="25" y="165" class="math" fill="#d97706">a</text>
    <text x="145" y="270" class="math" fill="#16a34a">b</text>
    <text x="210" y="120" class="math" fill="#dc2626">c</text>

    <!-- Right angle square -->
    <rect x="55" y="225" width="20" height="20" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

    <text x="170" y="330" text-anchor="middle" class="caption">a² + b² = c²</text>
  </g>

  <!-- Coordinate grid distance example -->
  <g transform="translate(520, 60)">
    <!-- Grid -->
    <g>
      <line x1="0" y1="0" x2="320" y2="0" class="axis"/>
      <line x1="0" y1="0" x2="0" y2="320" class="axis"/>

      <!-- Vertical grid lines -->
      <line x1="40" y1="0" x2="40" y2="320" class="grid"/>
      <line x1="80" y1="0" x2="80" y2="320" class="grid"/>
      <line x1="120" y1="0" x2="120" y2="320" class="grid"/>
      <line x1="160" y1="0" x2="160" y2="320" class="grid"/>
      <line x1="200" y1="0" x2="200" y2="320" class="grid"/>
      <line x1="240" y1="0" x2="240" y2="320" class="grid"/>
      <line x1="280" y1="0" x2="280" y2="320" class="grid"/>

      <!-- Horizontal grid lines -->
      <line x1="0" y1="40" x2="320" y2="40" class="grid"/>
      <line x1="0" y1="80" x2="320" y2="80" class="grid"/>
      <line x1="0" y1="120" x2="320" y2="120" class="grid"/>
      <line x1="0" y1="160" x2="320" y2="160" class="grid"/>
      <line x1="0" y1="200" x2="320" y2="200" class="grid"/>
      <line x1="0" y1="240" x2="320" y2="240" class="grid"/>
      <line x1="0" y1="280" x2="320" y2="280" class="grid"/>

      <!-- Axis labels -->
      <text x="325" y="12" class="label">x</text>
      <text x="-12" y="10" class="label">y</text>
      <text x="-15" y="165" class="label">2</text>
      <text x="-15" y="85" class="label">4</text>
      <text x="-15" y="245" class="label">0</text>
      <text x="75" y="-8" class="label">1</text>
      <text x="155" y="-8" class="label">2</text>
      <text x="235" y="-8" class="label">3</text>
      <text x="315" y="-8" class="label">4</text>
    </g>

    <!-- Points A(1,2) and B(4,5) -->
    <circle cx="80" cy="160" r="5" class="point"/>
    <circle cx="320" cy="40" r="5" class="point"/>

    <!-- Dashed right triangle legs -->
    <line x1="80" y1="160" x2="320" y2="160" class="dashed"/>
    <line x1="320" y1="160" x2="320" y2="40" class="dashed"/>

    <!-- Distance line -->
    <line x1="80" y1="160" x2="320" y2="40" class="distance-line"/>

    <!-- Labels -->
    <text x="70" y="155" class="math" fill="#2563eb">A</text>
    <text x="330" y="45" class="math" fill="#2563eb">B</text>
    <text x="190" y="180" class="caption">run = 3</text>
    <text x="330" y="105" class="caption">rise = 3</text>
    <text x="170" y="80" class="math" fill="#dc2626">d = 5</text>

    <text x="160" y="355" text-anchor="middle" class="caption">Distance on a coordinate grid</text>
  </g>
</svg>