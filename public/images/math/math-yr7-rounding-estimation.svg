<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Rounding rules and estimation</title>
  <desc id="desc">Rules for rounding to the nearest 10, 100 and decimal places shown on number lines with the round-half-up convention; estimation by rounding before calculating; and significant figures explained with examples.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 15px; fill: #111827; font-weight: 600; }
    .nl-line { stroke: #1f2937; stroke-width: 2; }
    .nl-tick { stroke: #374151; stroke-width: 1.5; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>

  <text x="30" y="35" class="heading">Rounding numbers</text>

  <!-- Rounding to nearest 10: 76 -->
  <g transform="translate(30, 55)">
    <text x="0" y="0" class="subhead">Round 76 to the nearest 10</text>
    <line x1="0" y1="25" x2="220" y2="25" class="nl-line"/>
    <line x1="10" y1="18" x2="10" y2="32" class="nl-tick"/>
    <text x="10" y="48" class="math" text-anchor="middle">70</text>
    <line x1="115" y1="18" x2="115" y2="32" class="nl-tick" stroke="#dc2626"/>
    <text x="115" y="48" class="math" text-anchor="middle" fill="#dc2626">76</text>
    <line x1="210" y1="18" x2="210" y2="32" class="nl-tick"/>
    <text x="210" y="48" class="math" text-anchor="middle">80</text>
    <line x1="110" y1="22" x2="110" y2="28" stroke="#6b7280" stroke-width="1"/>
    <text x="110" y="17" class="label" text-anchor="middle" fill="#6b7280">75</text>
    <polygon points="115,12 120,7 123,12" fill="#dc2626"/>
    <text x="115" y="68" class="label" fill="#dc2626" text-anchor="middle">76 is ≥ 75 → round up to 80</text>
  </g>

  <!-- Rounding to nearest 100: 342 -->
  <g transform="translate(300, 55)">
    <text x="0" y="0" class="subhead">Round 342 to the nearest 100</text>
    <line x1="0" y1="25" x2="280" y2="25" class="nl-line"/>
    <line x1="10" y1="18" x2="10" y2="32" class="nl-tick"/>
    <text x="10" y="48" class="math" text-anchor="middle">300</text>
    <line x1="150" y1="18" x2="150" y2="32" class="nl-tick" stroke="#dc2626"/>
    <text x="150" y="48" class="math" text-anchor="middle" fill="#dc2626">342</text>
    <line x1="270" y1="18" x2="270" y2="32" class="nl-tick"/>
    <text x="270" y="48" class="math" text-anchor="middle">400</text>
    <line x1="145" y1="22" x2="145" y2="28" stroke="#6b7280" stroke-width="1"/>
    <text x="145" y="17" class="label" text-anchor="middle" fill="#6b7280">350</text>
    <polygon points="150,12 155,7 158,12" fill="#dc2626"/>
    <text x="150" y="62" class="label" fill="#dc2626" text-anchor="middle">342 &lt; 350 → round down to 300</text>
  </g>

  <!-- Rounding rules -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="850" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="425" y="22" class="subhead" text-anchor="middle">The golden rule: 5 or more → round up. 4 or less → round down.</text>
    <text x="425" y="46" class="label" text-anchor="middle">Look at the digit one place to the right of the place you are rounding to.</text>
  </g>

  <!-- Decimal places -->
  <text x="30" y="235" class="heading">Rounding to decimal places (d.p.)</text>
  <g transform="translate(30, 258)">
    <text x="0" y="0" class="math">7.386 → 1 d.p.: look at 8 (hundredths/hundredths). 8 ≥ 5 → round up → 7.4</text>
    <text x="0" y="24" class="math">7.386 → 2 d.p.: look at 6 (thousandths). 6 ≥ 5 → round up → 7.39</text>
  </g>

  <!-- Estimation -->
  <text x="30" y="325" class="heading">Estimation</text>
  <g transform="translate(30, 348)">
    <text x="0" y="0" class="label">Round each number to 1 significant figure, then calculate:</text>
    <text x="0" y="24" class="math" fill="#2563eb">Estimate: 478 × 0.23 ≈ 500 × 0.2 = 100</text>
    <text x="0" y="48" class="math" fill="#16a34a">Actual: 478 × 0.23 = 109.94 ✓ (close!)</text>
  </g>

  <!-- Significant figures -->
  <g transform="translate(420, 325)">
    <rect x="0" y="0" width="450" height="95" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="225" y="20" class="subhead" text-anchor="middle">Significant figures (s.f.)</text>
   <text x="15" y="42" class="label">1st non-zero digit is the 1st significant figure.</text>
   <text x="15" y="58" class="label">Zeros between non-zero digits count.</text>
   <text x="15" y="80" class="math" fill="#d97706">0.0305 → 2 s.f. = 0.031  |  50800 → 3 s.f. = 5.08×10⁴</text>
  </g>
</svg>
