  <text x="338" y="138" class="small" fill="#7c3aed">line of symmetry x = 2</text>
  <rect x="570" y="55" width="300" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="720.0" y="77" class="subhead" text-anchor="middle">Reading the graph</text>
  <text x="592" y="120" class="label">Roots — where y = 0, the</text>
  <text x="592" y="143" class="label">x-intercepts.</text>
  <text x="592" y="166" class="label"></text>
  <text x="592" y="189" class="label">y-intercept — set x = 0.</text>
  <text x="592" y="212" class="label"></text>
  <text x="592" y="235" class="label">Vertex — the turning point; a</text>
  <text x="592" y="258" class="label">minimum here.</text>
  <text x="592" y="281" class="label"></text>
  <text x="592" y="304" class="label">The parabola is symmetric about</text>
  <text x="592" y="327" class="label">the vertical line through the</text>
  <text x="592" y="350" class="label">vertex.</text>
  <text x="592" y="373" class="label"></text>
  <text x="592" y="396" class="label">Solve graphically by reading off</text>
  <text x="592" y="419" class="label">where the curve crosses a line.</text>
</svg>
