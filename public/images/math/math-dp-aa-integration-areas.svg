  <text x="770.0" y="342.0" class="math" text-anchor="middle">∫₋₁¹ x³ dx = 0, area = 1/2</text>
  <text x="770.0" y="362.0" class="small" text-anchor="middle">the two signed halves cancel</text>
  <text x="30.0" y="404.0" class="small" text-anchor="start">Find the limits first: either they are given, or they are the roots of the curve, or they are where the two curves intersect.</text>
  <text x="30.0" y="426.0" class="small" text-anchor="start">Split the integral wherever the curve crosses the axis, then add the absolute values of the pieces.</text>
  <text x="30.0" y="448.0" class="small" text-anchor="start">Indefinite integrals need + C; definite integrals do not, because the constant cancels in F(b) − F(a).</text>
