<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
  <title id="title">Areas by integration</title>
  <desc id="desc">Three panels: the area under y equals x squared plus one from zero to one, the area enclosed between y equals x and y equals x squared, and the curve y equals x cubed from minus one to one where the signed integral is zero but the geometric area is one half.</desc>
