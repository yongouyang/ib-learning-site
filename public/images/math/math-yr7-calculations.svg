<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">Written calculation methods: column addition, subtraction, multiplication and division</title>
  <desc id="desc">Step-by-step visual demonstrations of column addition with carrying, column subtraction with borrowing, the grid method for multiplication, and long division layout, all showing place value alignment.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
    .col-num { font-size: 20px; fill: #111827; font-weight: 600; font-family: 'Courier New', monospace; }
    .col-carry { font-size: 16px; fill: #dc2626; font-weight: 700; font-family: 'Courier New', monospace; }
    .col-borrow { font-size: 16px; fill: #2563eb; font-weight: 700; font-family: 'Courier New', monospace; }
    .grid-box { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .grid-text { font-size: 14px; fill: #1e40af; font-weight: 600; font-family: system-ui, sans-serif; }
    .line { stroke: #374151; stroke-width: 2; }
    .line-thin { stroke: #374151; stroke-width: 1; }
  </style>

  <rect width="900" height="590" fill="#f8fafc" rx="12"/>

  <text x="30" y="35" class="heading">Written calculation methods</text>

  <!-- SECTION 1: Column Addition -->
  <text x="30" y="65" class="subhead">Column addition with carrying</text>

  <g transform="translate(30, 80)">
    <!-- Place value headers -->
    <rect x="80" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="107" y="15" class="label" text-anchor="middle">Th</text>
    <rect x="135" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="162" y="15" class="label" text-anchor="middle">H</text>
    <rect x="190" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="217" y="15" class="label" text-anchor="middle">T</text>
    <rect x="245" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="272" y="15" class="label" text-anchor="middle">O</text>

    <!-- Carry row -->
    <text x="135" y="42" class="col-carry">¹</text>
    <text x="190" y="42" class="col-carry">¹</text>

    <!-- Number 1: 2,476 -->
    <text x="107" y="64" class="col-num" text-anchor="middle">2</text>
    <text x="162" y="64" class="col-num" text-anchor="middle">4</text>
    <text x="217" y="64" class="col-num" text-anchor="middle">7</text>
    <text x="272" y="64" class="col-num" text-anchor="middle">6</text>

    <!-- + sign -->
    <text x="245" y="64" class="col-num" fill="#16a34a" font-weight="bold">+</text>

    <!-- Number 2: 1,587 -->
    <text x="107" y="92" class="col-num" text-anchor="middle">1</text>
    <text x="162" y="92" class="col-num" text-anchor="middle">5</text>
    <text x="217" y="92" class="col-num" text-anchor="middle">8</text>
    <text x="272" y="92" class="col-num" text-anchor="middle">7</text>

    <!-- Answer line -->
    <line x1="55" y1="104" x2="305" y2="104" class="line"/>

    <!-- Answer: 4,063 -->
    <text x="107" y="124" class="col-num" text-anchor="middle" fill="#2563eb">4</text>
    <text x="162" y="124" class="col-num" text-anchor="middle" fill="#2563eb">0</text>
    <text x="217" y="124" class="col-num" text-anchor="middle" fill="#2563eb">6</text>
    <text x="272" y="124" class="col-num" text-anchor="middle" fill="#2563eb">3</text>

    <!-- Explanation -->
    <text x="55" y="150" class="label">6+7=13 → write 3, carry 1.  7+8+1=16 → write 6, carry 1.  4+5+1=10 → write 0, carry 1.  2+1+1=4 → write 4.</text>
  </g>

  <!-- SECTION 2: Column Subtraction -->
  <text x="380" y="65" class="subhead">Column subtraction with borrowing</text>

  <g transform="translate(380, 80)">
    <rect x="80" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="107" y="15" class="label" text-anchor="middle">Th</text>
    <rect x="135" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="162" y="15" class="label" text-anchor="middle">H</text>
    <rect x="190" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="217" y="15" class="label" text-anchor="middle">T</text>
    <rect x="245" y="0" width="55" height="22" fill="#f1f5f9" rx="3"/><text x="272" y="15" class="label" text-anchor="middle">O</text>

    <!-- Borrow markings -->
    <text x="135" y="42" class="col-borrow">³</text>
    <text x="178" y="42" class="col-borrow">¹²</text>

    <!-- 5,312 modified -->
    <text x="107" y="64" class="col-num" text-anchor="middle">4</text>
    <text x="162" y="64" class="col-num" text-anchor="middle">2</text>
    <text x="217" y="64" class="col-num" text-anchor="middle">¹¹</text>
    <text x="272" y="64" class="col-num" text-anchor="middle">²</text>

    <text x="245" y="64" class="col-num" fill="#dc2626" font-weight="bold">−</text>

    <!-- 2,847 -->
    <text x="107" y="92" class="col-num" text-anchor="middle">2</text>
    <text x="162" y="92" class="col-num" text-anchor="middle">8</text>
    <text x="217" y="92" class="col-num" text-anchor="middle">4</text>
    <text x="272" y="92" class="col-num" text-anchor="middle">7</text>

    <line x1="55" y1="104" x2="305" y2="104" class="line"/>

    <!-- 2,465 -->
    <text x="107" y="124" class="col-num" text-anchor="middle" fill="#2563eb">2</text>
    <text x="162" y="124" class="col-num" text-anchor="middle" fill="#2563eb">4</text>
    <text x="217" y="124" class="col-num" text-anchor="middle" fill="#2563eb">6</text>
    <text x="272" y="124" class="col-num" text-anchor="middle" fill="#2563eb">5</text>

    <text x="55" y="150" class="label">2−7: borrow →12−7=5.  1−4: borrow →11−4=7.  2−8: borrow →12−8=4.</text>
  </g>

  <!-- SECTION 3: Grid Multiplication -->
  <text x="30" y="250" class="subhead">Grid method multiplication: 34 × 27</text>

  <g transform="translate(30, 282)">
    <!-- Grid -->
    <g transform="translate(0, 15)">
      <rect x="55" y="0" width="65" height="30" class="grid-box"/><text x="87" y="20" class="grid-text" text-anchor="middle">30</text>
      <rect x="120" y="0" width="65" height="30" class="grid-box"/><text x="152" y="20" class="grid-text" text-anchor="middle">4</text>

      <rect x="0" y="30" width="55" height="30" class="grid-box"/><text x="27" y="50" class="grid-text" text-anchor="middle">20</text>
      <rect x="55" y="30" width="65" height="40" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="87" y="55" class="grid-text" text-anchor="middle" fill="#dc2626">600</text>
      <rect x="120" y="30" width="65" height="40" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="152" y="55" class="grid-text" text-anchor="middle" fill="#dc2626">80</text>

      <rect x="0" y="70" width="55" height="30" class="grid-box"/><text x="27" y="90" class="grid-text" text-anchor="middle">7</text>
      <rect x="55" y="70" width="65" height="40" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="87" y="95" class="grid-text" text-anchor="middle" fill="#dc2626">210</text>
      <rect x="120" y="70" width="65" height="40" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="152" y="95" class="grid-text" text-anchor="middle" fill="#dc2626">28</text>
    </g>

    <text x="0" y="128" class="label">Split 34 = 30 + 4 and 27 = 20 + 7. Multiply each pair, then add:</text>
    <text x="87" y="148" class="math" fill="#2563eb">600 + 80 + 210 + 28 = 918 ✓</text>
  </g>

  <!-- SECTION 4: Long Division -->
  <text x="390" y="250" class="subhead">Long division: 864 ÷ 6</text>

  <g transform="translate(390, 282)">
    <!-- Layout:   __144__  -->
    <!--         6 ) 864   -->

    <line x1="32" y1="0" x2="32" y2="48" stroke="#1f2937" stroke-width="2"/>
    <line x1="32" y1="0" x2="0" y2="0" stroke="#1f2937" stroke-width="2"/>
    <line x1="0" y1="48" x2="90" y2="48" stroke="#1f2937" stroke-width="2"/>

    <text x="12" y="32" class="col-num" text-anchor="middle">6</text>
    <text x="58" y="32" class="col-num" text-anchor="middle">864</text>

    <!-- Quotient on top -->
    <text x="58" y="-12" class="col-num" fill="#2563eb" text-anchor="middle">144</text>

    <!-- Steps -->
    <text x="30" y="118" class="label">Step 1: 8÷6 = 1 rem 2. Write 1, bring down 6.</text>
    <text x="30" y="136" class="label">Step 2: 26÷6 = 4 rem 2. Write 4, bring down 4.</text>
    <text x="30" y="154" class="label">Step 3: 24÷6 = 4. Write 4. No remainder. Done!</text>
  </g>

  <!-- SECTION 5: Order of Operations -->
  <text x="30" y="460" class="heading">Order of operations (BIDMAS / BODMAS)</text>

  <g transform="translate(30, 482)">
    <rect x="0" y="0" width="840" height="100" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(30, 15)">
      <text x="0" y="0" class="subhead">B</text><text x="20" y="0" class="label">rackets</text>
      <text x="100" y="0" class="subhead">I/O</text><text x="145" y="0" class="label">Indices/Orders (powers, roots)</text>
      <text x="360" y="0" class="subhead">D</text><text x="380" y="0" class="label">ivision</text>
      <text x="430" y="0" class="subhead">M</text><text x="450" y="0" class="label">ultiplication</text>
      <text x="560" y="0" class="subhead">A</text><text x="580" y="0" class="label">ddition</text>
      <text x="640" y="0" class="subhead">S</text><text x="660" y="0" class="label">ubtraction</text>

      <text x="0" y="30" class="label">Work left to right. Division and multiplication have equal priority. Addition and subtraction have equal priority.</text>

      <text x="0" y="58" class="math" fill="#2563eb">Example: 3 + 4 × 2 = 3 + 8 = 11 (not 7 × 2 = 14!)</text>
      <text x="0" y="80" class="math" fill="#dc2626">With brackets: (3 + 4) × 2 = 7 × 2 = 14</text>
    </g>
  </g>
</svg>
