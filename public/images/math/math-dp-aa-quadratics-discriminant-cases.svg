<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">The three cases of the discriminant</title>
  <desc id="desc">Three panels showing a parabola drawn against the x-axis: x squared minus four crossing at plus and minus two with Delta greater than zero, x squared touching at the origin with Delta equal to zero, and x squared plus four floating clear of the axis with Delta less than zero.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 13px; fill: #111827; }
    .small { font-size: 11px; fill: #64748b; }
  </style>
  <rect width="900" height="470" fill="#f8fafc" rx="12"/>
  <text x="30" y="34" class="heading">The discriminant decides how many real roots there are</text>
  <text x="30" y="54" class="small">For y = ax² + bx + c with a = 1, the sign of Δ = b² − 4ac fixes the number of real roots.</text>
