  <text x="750.0" y="330.0" class="label" text-anchor="middle">x² + 4 = 0</text>
  <text x="750.0" y="349.0" class="math" text-anchor="middle">Δ = −16 &lt; 0</text>
  <text x="750.0" y="366.0" class="small" text-anchor="middle">no real roots</text>
  <text x="30.0" y="410.0" class="label" text-anchor="start">The vertex sits below, on or above the x-axis — that is the geometry behind the sign of Δ.</text>
  <text x="30.0" y="432.0" class="small" text-anchor="start">Δ &gt; 0 crosses twice, Δ = 0 touches once, Δ &lt; 0 never touches at all.</text>
  <text x="30.0" y="452.0" class="small" text-anchor="start">A curve that just touches still has two equal roots: count them with multiplicity.</text>
