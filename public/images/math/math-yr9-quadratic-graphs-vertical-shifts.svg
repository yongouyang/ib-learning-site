<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Vertical shifts of y equals x squared</title>
  <desc id="desc">Three congruent parabolas show y equals x squared plus 2 with vertex (0, 2), y equals x squared with vertex (0, 0), and y equals x squared minus 2 with vertex (0, −2). The vertical separation between corresponding points is 2 units.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 14px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <defs>
    <marker id="shift-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <polygon points="0 0, 8 4, 0 8" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">Changing c moves the whole parabola vertically</text>
  <rect x="35" y="60" width="590" height="450" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M97.5 80 V495 M162.5 80 V495 M227.5 80 V495 M292.5 80 V495 M357.5 80 V495 M422.5 80 V495 M487.5 80 V495 M552.5 80 V495 M55 120 H605 M55 160 H605 M55 200 H605 M55 240 H605 M55 280 H605 M55 320 H605 M55 360 H605 M55 440 H605 M55 480 H605" class="grid"/>
  <line x1="55" y1="400" x2="605" y2="400" stroke="#334155" stroke-width="1.8"/>
  <line x1="450" y1="80" x2="450" y2="495" stroke="#334155" stroke-width="1.8"/>
  <text x="593" y="390" class="small">x</text>
  <text x="461" y="96" class="small">y</text>
  <text x="438" y="365" class="small" text-anchor="end">1</text>
  <text x="438" y="325" class="small" text-anchor="end">2</text>
  <text x="438" y="405" class="small" text-anchor="end">0</text>
  <text x="438" y="485" class="small" text-anchor="end">−2</text>
  <path d="M287.5 70 Q368.75 320 450 320 Q531.25 320 612.5 70" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <path d="M287.5 150 Q368.75 400 450 400 Q531.25 400 612.5 150" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <path d="M287.5 230 Q368.75 480 450 480 Q531.25 480 612.5 230" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <circle cx="450" cy="320" r="5" fill="#16a34a"/>
  <circle cx="450" cy="400" r="5" fill="#2563eb"/>
  <circle cx="450" cy="480" r="5" fill="#d97706"/>
  <line x1="470" y1="325" x2="470" y2="395" stroke="#7c3aed" stroke-width="1.8" marker-start="url(#shift-arrow)" marker-end="url(#shift-arrow)"/>
  <line x1="470" y1="405" x2="470" y2="475" stroke="#7c3aed" stroke-width="1.8" marker-start="url(#shift-arrow)" marker-end="url(#shift-arrow)"/>
  <rect x="535" y="345" width="64" height="28" rx="5" fill="#f8fafc"/>
  <text x="567" y="365" class="label" text-anchor="middle">2 units</text>
  <rect x="535" y="425" width="64" height="28" rx="5" fill="#f8fafc"/>
  <text x="567" y="445" class="label" text-anchor="middle">2 units</text>
  <rect x="655" y="60" width="215" height="450" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="680" y="101" class="math" fill="#16a34a">y = x² + 2</text>
  <text x="680" y="131" class="label">vertex (0, 2)</text>
  <text x="680" y="196" class="math" fill="#2563eb">y = x²</text>
  <text x="680" y="226" class="label">vertex (0, 0)</text>
  <text x="680" y="291" class="math" fill="#d97706">y = x² − 2</text>
  <text x="680" y="321" class="label">vertex (0, −2)</text>
  <line x1="680" y1="355" x2="845" y2="355" stroke="#e2e8f0"/>
  <text x="680" y="394" class="label">Same shape and same</text>
  <text x="680" y="420" class="label">line of symmetry: x = 0.</text>
  <text x="680" y="462" class="label">Only the height changes.</text>
</svg>
