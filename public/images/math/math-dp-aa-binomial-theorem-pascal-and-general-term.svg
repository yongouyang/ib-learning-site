<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Pascal’s triangle and the binomial theorem</title>
  <desc id="desc">Pascal’s triangle with each row labelled by its n and giving the coefficients of that expansion, beside the binomial theorem, the general term formula and worked examples of a particular term and a constant term.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Pascal’s triangle and the binomial theorem</text>
  <rect x="30" y="55" width="380" height="320" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="220.0" y="77" class="subhead" text-anchor="middle">Pascal’s triangle</text>
  <rect x="183" y="92" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="200" y="113" class="math" text-anchor="middle">1</text>
  <text x="372" y="113" class="small">n = 0</text>
  <rect x="162" y="134" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="179" y="155" class="math" text-anchor="middle">1</text>
  <rect x="204" y="134" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="221" y="155" class="math" text-anchor="middle">1</text>
  <text x="372" y="155" class="small">n = 1</text>
  <rect x="141" y="176" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="158" y="197" class="math" text-anchor="middle">1</text>
  <rect x="183" y="176" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="200" y="197" class="math" text-anchor="middle">2</text>
  <rect x="225" y="176" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="242" y="197" class="math" text-anchor="middle">1</text>
  <text x="372" y="197" class="small">n = 2</text>
  <rect x="120" y="218" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="137" y="239" class="math" text-anchor="middle">1</text>
  <rect x="162" y="218" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="179" y="239" class="math" text-anchor="middle">3</text>
  <rect x="204" y="218" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="221" y="239" class="math" text-anchor="middle">3</text>
  <rect x="246" y="218" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="263" y="239" class="math" text-anchor="middle">1</text>
  <text x="372" y="239" class="small">n = 3</text>
  <rect x="99" y="260" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="116" y="281" class="math" text-anchor="middle">1</text>
  <rect x="141" y="260" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="158" y="281" class="math" text-anchor="middle">4</text>
  <rect x="183" y="260" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="200" y="281" class="math" text-anchor="middle">6</text>
  <rect x="225" y="260" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="242" y="281" class="math" text-anchor="middle">4</text>
  <rect x="267" y="260" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="284" y="281" class="math" text-anchor="middle">1</text>
  <text x="372" y="281" class="small">n = 4</text>
  <rect x="78" y="302" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="95" y="323" class="math" text-anchor="middle">1</text>
  <rect x="120" y="302" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="137" y="323" class="math" text-anchor="middle">5</text>
  <rect x="162" y="302" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="179" y="323" class="math" text-anchor="middle">10</text>
  <rect x="204" y="302" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="221" y="323" class="math" text-anchor="middle">10</text>
  <rect x="246" y="302" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="263" y="323" class="math" text-anchor="middle">5</text>
  <rect x="288" y="302" width="34" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="305" y="323" class="math" text-anchor="middle">1</text>
  <text x="372" y="323" class="small">n = 5</text>
  <text x="220" y="360" class="small" text-anchor="middle">each entry is the sum of the two above it</text>
  <rect x="430" y="55" width="440" height="320" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="650.0" y="77" class="subhead" text-anchor="middle">The theorem and the general term</text>
  <text x="460" y="100" class="math">(a + b)ⁿ = Σ C(n,r) aⁿ⁻ʳ bʳ</text>
  <text x="460" y="126" class="small">for r from 0 to n</text>
  <text x="460" y="152" class="math">Tᵣ₊₁ = C(n,r) aⁿ⁻ʳ bʳ</text>
  <text x="460" y="186" class="label">Term in x⁵ of (x + 2)⁸:</text>
  <text x="460" y="212" class="math">x⁸⁻ʳ = x⁵, so r = 3</text>
  <text x="460" y="242" class="math">T₄ = C(8,3) × x⁵ × 2³ = 448x⁵</text>
  <text x="460" y="276" class="label">Constant term of (x + 2/x)⁶:</text>
  <text x="460" y="302" class="math">6 − 2r = 0, so r = 3</text>
  <text x="460" y="328" class="math">C(6,3) × 2³ = 160</text>
  <text x="440" y="398" class="small" text-anchor="middle">Powers of a count down while powers of b count up, and every pair of powers adds to n.</text>
  <text x="440" y="422" class="small" text-anchor="middle">The number of terms is n + 1, so (a + b)⁷ expands to eight terms.</text>
</svg>
