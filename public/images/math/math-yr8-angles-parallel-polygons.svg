<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Angles in parallel lines and polygons</title>
  <desc id="desc">Diagram showing two parallel horizontal lines crossed by a transversal, with corresponding, alternate and co-interior angles marked, and a regular hexagon showing one interior and one exterior angle.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow-review" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .label { font-size: 14px; fill: #374151; }
    .math { font-size: 16px; fill: #111827; font-weight: 600; }
    .caption { font-size: 13px; fill: #4b5563; }
  </style>

  <!-- Parallel lines diagram -->
  <g>
    <!-- Parallel lines with arrowheads -->
    <line x1="60" y1="120" x2="440" y2="120" stroke="#374151" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <line x1="60" y1="300" x2="440" y2="300" stroke="#374151" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

    <!-- Parallel-line arrow marks -->
    <path d="M120,112 L150,112 M135,105 L150,112 L135,119" fill="none" stroke="#374151" stroke-width="1.5"/>
    <path d="M120,292 L150,292 M135,285 L150,292 L135,299" fill="none" stroke="#374151" stroke-width="1.5"/>
    <path d="M350,112 L380,112 M365,105 L380,112 L365,119" fill="none" stroke="#374151" stroke-width="1.5"/>
    <path d="M350,292 L380,292 M365,285 L380,292 L365,299" fill="none" stroke="#374151" stroke-width="1.5"/>

    <!-- Transversal -->
    <line x1="180" y1="60" x2="320" y2="360" stroke="#374151" stroke-width="2"/>

    <!-- Corresponding angles (blue) -->
    <path d="M 238 120 A 32 32 0 0 1 220 148" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M 322 300 A 32 32 0 0 1 304 328" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="242" y="105" class="math" fill="#2563eb">a</text>
    <text x="326" y="285" class="math" fill="#2563eb">a</text>

    <!-- Alternate angles (green) -->
    <path d="M 178 120 A 32 32 0 0 0 195 147" fill="none" stroke="#16a34a" stroke-width="3"/>
    <path d="M 304 328 A 32 32 0 0 1 322 300" fill="none" stroke="#16a34a" stroke-width="3"/>
    <text x="148" y="145" class="math" fill="#16a34a">b</text>
    <text x="332" y="340" class="math" fill="#16a34a">b</text>

    <!-- Co-interior angles (orange) -->
    <path d="M 238 120 A 32 32 0 0 0 221 93" fill="none" stroke="#ea580c" stroke-width="3"/>
    <path d="M 262 300 A 32 32 0 0 1 279 327" fill="none" stroke="#ea580c" stroke-width="3"/>
    <text x="242" y="85" class="math" fill="#ea580c">c</text>
    <text x="262" y="355" class="math" fill="#ea580c">c</text>

    <text x="250" y="405" text-anchor="middle" class="caption">Corresponding, alternate and co-interior angles</text>
  </g>

  <!-- Hexagon diagram -->
  <g transform="translate(560, 80)">
    <!-- Regular hexagon -->
    <polygon points="150,20 236,70 236,150 150,200 64,150 64,70" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>

    <!-- Interior angle arc at bottom-right vertex (236,150) -->
    <path d="M 236 122 A 28 28 0 0 0 211.8 164" fill="none" stroke="#ea580c" stroke-width="3"/>
    <text x="188" y="135" class="math" fill="#ea580c">x</text>

    <!-- Extended side for exterior angle: continues the side from (150,200) through (236,150) -->
    <line x1="236" y1="150" x2="274" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#arrow-review)"/>
    <!-- Exterior angle arc, outside the polygon between the extension and the adjacent side -->
    <path d="M 260.2 135.9 A 28 28 0 0 0 236 122" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="254" y="110" class="math" fill="#2563eb">y</text>

    <text x="150" y="245" text-anchor="middle" class="caption">Interior and exterior angles of a polygon</text>
  </g>
</svg>
