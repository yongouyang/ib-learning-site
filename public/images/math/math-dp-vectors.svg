<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Vectors: operations, dot product and geometry</title>
  <desc id="desc">Vector notation in component and unit vector forms; addition and scalar multiplication shown geometrically; the dot product formula and its use for finding angles; and vector equations of lines in 2D and 3D.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="420" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Vectors</text>

  <!-- Notation -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="350" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="175" y="22" class="subhead" text-anchor="middle">Vector notation</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#2563eb">Column: v = (x, y) or [x; y]</text>
      <text x="0" y="22" class="math" fill="#2563eb">Unit vectors: v = xi + yj</text>
      <text x="0" y="44" class="label">Magnitude: |v| = √(x²+y²)</text>
    </g>
  </g>

  <!-- Operations -->
  <g transform="translate(400, 55)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="235" y="20" class="subhead" text-anchor="middle">Vector operations</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#2563eb">Addition: (a,b) + (c,d) = (a+c, b+d)</text>
      <text x="0" y="22" class="math" fill="#16a34a">Scalar: k(a,b) = (ka, kb) — stretches vector</text>
      <text x="0" y="48" class="math" fill="#dc2626">Dot product: v·w = ac+bd = |v||w|cosθ</text>
      <text x="0" y="72" class="label">v·w = 0 ⇔ vectors are perpendicular (orthogonal)</text>
      <text x="0" y="96" class="label">cosθ = (v·w)/(|v||w|) → find angle between vectors</text>
      <text x="0" y="120" class="label">Parallel: v = kw for some scalar k</text>
      <text x="0" y="142" class="label">Unit vector in direction of v: v̂ = v/|v|</text>
    </g>
  </g>

  <!-- Vector line -->
  <g transform="translate(30, 245)">
    <rect x="0" y="0" width="840" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">Vector equation of a line</text>
    <g transform="translate(15, 42)">
      <text x="0" y="0" class="math" fill="#16a34a">r = a + λd</text>
      <text x="0" y="22" class="label">a = position vector of a point on line. d = direction vector. λ = scalar parameter (real number).</text>
    </g>
  </g>

  <!-- 3D and cross -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="840" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">3D vectors and cross product (HL)</text>
    <text x="420" y="44" class="label" text-anchor="middle">v×w = (b₁c₂−b₂c₁)i − (a₁c₂−a₂c₁)j + (a₁b₂−a₂b₁)k (perpendicular to both). |v×w| = |v||w|sinθ = area of parallelogram.</text>
  </g>
</svg>
