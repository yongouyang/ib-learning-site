<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Functions: domain, range and transformations</title>
  <desc id="desc">Function notation and mapping diagrams; domain and range definitions with examples for common functions; function composition f(g(x)); inverse functions as reflection in y=x; and graph transformations with horizontal and vertical shifts.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="430" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Functions</text>

  <!-- What is a function -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="150" y="20" class="subhead" text-anchor="middle">f: x → f(x)</text>
    <text x="150" y="44" class="label" text-anchor="middle">Domain → function → Range</text>
    <text x="150" y="64" class="label" text-anchor="middle">Each input maps to exactly one output</text>
  </g>
  <g transform="translate(350, 55)">
    <rect x="0" y="0" width="250" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="125" y="20" class="subhead" text-anchor="middle">Vertical line test</text>
    <text x="125" y="42" class="label" text-anchor="middle">A graph is a function if any vertical</text>
    <text x="125" y="60" class="label" text-anchor="middle">line crosses it at most once.</text>
  </g>
  <g transform="translate(620, 55)">
    <rect x="0" y="0" width="250" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="125" y="20" class="subhead" text-anchor="middle">1-to-1 function</text>
    <text x="125" y="42" class="label" text-anchor="middle">Horizontal line test:</text>
    <text x="125" y="60" class="label" text-anchor="middle">has an inverse function.</text>
  </g>

  <!-- Composition and inverses -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="420" height="120" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="210" y="20" class="subhead" text-anchor="middle">Composition and inverses</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#2563eb">(f∘g)(x) = f(g(x)) — apply g then f</text>
      <text x="0" y="24" class="label">Domain of f∘g: x in domain of g such that g(x) in domain of f</text>
      <text x="0" y="52" class="math" fill="#dc2626">Inverse: f⁻¹(f(x)) = x = f(f⁻¹(x))</text>
      <text x="0" y="76" class="label">Graph of f⁻¹ is reflection of f in y=x</text>
      <text x="0" y="100" class="label">Domain of f⁻¹ = range of f ; range of f⁻¹ = domain of f</text>
    </g>
  </g>

  <!-- Transformations -->
  <g transform="translate(470, 160)">
    <rect x="0" y="0" width="400" height="145" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="200" y="20" class="subhead" text-anchor="middle">Graph transformations</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math">f(x)+k: vertical shift (up if k&gt;0)</text>
      <text x="0" y="20" class="math">f(x+k): horizontal shift (left if k&gt;0)</text>
      <text x="0" y="40" class="math">k·f(x): vertical stretch (|k|&gt;1)</text>
      <text x="0" y="60" class="math">f(kx): horizontal stretch (|k|&lt;1)</text>
      <text x="0" y="80" class="math">−f(x): reflection in x-axis</text>
      <text x="0" y="100" class="math">f(−x): reflection in y-axis</text>
    </g>
  </g>

  <!-- Domain/Range -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="840" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="420" y="20" class="subhead" text-anchor="middle">Common domains and ranges</text>
    <text x="420" y="44" class="label" text-anchor="middle">f(x)=x²: D=ℝ, R=[0,∞) | f(x)=√x: D=[0,∞), R=[0,∞) | f(x)=1/x: D=ℝ\{0}, R=ℝ\{0} | f(x)=eˣ: D=ℝ, R=(0,∞)</text>
  </g>
</svg>
