<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Decimal place value and operations</title>
  <desc id="desc">Place value chart showing tens, ones, tenths, hundredths and thousandths; decimal number line with key benchmarks; and visual demonstrations of adding, subtracting, multiplying and dividing decimals.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
    .pv-header { fill: #2563eb; font-size: 13px; font-weight: 600; }
    .pv-cell { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .pv-text { fill: #1e293b; font-size: 16px; font-weight: 600; font-family: system-ui, sans-serif; }
    .pv-point { fill: #dc2626; font-size: 20px; font-weight: 700; font-family: system-ui, sans-serif; }
  </style>

  <rect width="900" height="500" fill="#f8fafc" rx="12"/>

  <!-- SECTION 1: Place Value -->
  <text x="30" y="35" class="heading">Decimal place value</text>

  <g transform="translate(30, 55)">
    <text x="0" y="0" class="label">Each column is 10× smaller moving right:</text>

    <!-- Place value chart -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="100" height="32" class="pv-cell"/>
      <text x="50" y="20" class="pv-header" text-anchor="middle">Tens</text>
      <rect x="100" y="0" width="100" height="32" class="pv-cell"/>
      <text x="150" y="20" class="pv-header" text-anchor="middle">Ones</text>
      <rect x="200" y="0" width="16" height="32" fill="#dc2626"/>
      <text x="208" y="20" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">.</text>
      <rect x="216" y="0" width="100" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="266" y="20" class="pv-header" text-anchor="middle">Tenths</text>
      <rect x="316" y="0" width="100" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="366" y="20" class="pv-header" text-anchor="middle">Hundredths</text>
      <rect x="416" y="0" width="100" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="466" y="20" class="pv-header" text-anchor="middle">Thousandths</text>

      <!-- Example number row: 23.456 -->
      <rect x="0" y="38" width="100" height="36" class="pv-cell"/>
      <text x="50" y="62" class="pv-text" text-anchor="middle">2</text>
      <rect x="100" y="38" width="100" height="36" class="pv-cell"/>
      <text x="150" y="62" class="pv-text" text-anchor="middle">3</text>
      <rect x="216" y="38" width="100" height="36" class="pv-cell"/>
      <text x="266" y="62" class="pv-text" text-anchor="middle" fill="#2563eb">4</text>
      <rect x="316" y="38" width="100" height="36" class="pv-cell"/>
      <text x="366" y="62" class="pv-text" text-anchor="middle" fill="#2563eb">5</text>
      <rect x="416" y="38" width="100" height="36" class="pv-cell"/>
      <text x="466" y="62" class="pv-text" text-anchor="middle" fill="#2563eb">6</text>

      <!-- Value labels -->
      <text x="50" y="92" class="label" text-anchor="middle">20</text>
      <text x="150" y="92" class="label" text-anchor="middle">3</text>
      <text x="266" y="92" class="label" text-anchor="middle" fill="#2563eb">⁴/₁₀</text>
      <text x="366" y="92" class="label" text-anchor="middle" fill="#2563eb">⁵/₁₀₀</text>
      <text x="466" y="92" class="label" text-anchor="middle" fill="#2563eb">⁶/₁₀₀₀</text>
    </g>
  </g>

  <!-- SECTION 2: Number line -->
  <text x="30" y="205" class="heading">Decimals on a number line</text>

  <g transform="translate(30, 230)">
    <line x1="0" y1="16" x2="520" y2="16" stroke="#1f2937" stroke-width="2"/>
    <polygon points="520,16 510,11 510,21" fill="#1f2937"/>

    <!-- Tick marks and labels -->
    <line x1="0" y1="10" x2="0" y2="22" stroke="#1f2937" stroke-width="2"/>
    <text x="0" y="36" class="math" text-anchor="middle">0</text>

    <line x1="52" y1="12" x2="52" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="52" y="36" class="label" text-anchor="middle">0.1</text>

    <line x1="104" y1="12" x2="104" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="104" y="36" class="label" text-anchor="middle">0.2</text>

    <line x1="156" y1="12" x2="156" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="156" y="36" class="label" text-anchor="middle">0.3</text>

    <line x1="208" y1="12" x2="208" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="208" y="36" class="label" text-anchor="middle">0.4</text>

    <line x1="260" y1="10" x2="260" y2="22" stroke="#2563eb" stroke-width="2"/>
    <text x="260" y="36" class="math" text-anchor="middle" fill="#2563eb">0.5</text>

    <line x1="312" y1="12" x2="312" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="312" y="36" class="label" text-anchor="middle">0.6</text>

    <line x1="364" y1="12" x2="364" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="364" y="36" class="label" text-anchor="middle">0.7</text>

    <line x1="416" y1="12" x2="416" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="416" y="36" class="label" text-anchor="middle">0.8</text>

    <line x1="468" y1="12" x2="468" y2="20" stroke="#6b7280" stroke-width="1"/>
    <text x="468" y="36" class="label" text-anchor="middle">0.9</text>

    <line x1="520" y1="10" x2="520" y2="22" stroke="#1f2937" stroke-width="2"/>
    <text x="520" y="36" class="math" text-anchor="middle">1</text>

    <!-- Mark 0.35 -->
    <polygon points="182,2 188,8 176,8" fill="#dc2626"/>
    <text x="182" y="-4" class="label" fill="#dc2626" text-anchor="middle">0.35</text>
  </g>

  <!-- SECTION 3: Operations with decimals -->
  <text x="30" y="295" class="heading">Operations with decimals</text>

  <!-- Adding/subtracting -->
  <g transform="translate(30, 318)">
    <rect x="0" y="0" width="260" height="95" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="130" y="20" class="subhead" text-anchor="middle">Adding &amp; Subtracting</text>
    <text x="15" y="42" class="label">1. Line up the decimal points</text>
    <text x="15" y="60" class="math" fill="#2563eb">  12.50 + 3.75 = 16.25</text>
    <text x="15" y="82" class="label">Add zeros to fill empty places</text>
  </g>

  <!-- Multiplying -->
  <g transform="translate(310, 318)">
    <rect x="0" y="0" width="270" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="135" y="20" class="subhead" text-anchor="middle">Multiplying</text>
    <text x="15" y="42" class="label">1. Multiply as whole numbers</text>
    <text x="15" y="60" class="math" fill="#16a34a">4.2 × 0.3 → 42 × 3 = 126</text>
    <text x="15" y="82" class="label">2. Count decimal places: 1+1 = 2 → 1.26</text>
  </g>

  <!-- Dividing -->
  <g transform="translate(600, 318)">
    <rect x="0" y="0" width="270" height="95" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="135" y="20" class="subhead" text-anchor="middle">Dividing</text>
    <text x="15" y="42" class="label">1. Make divisor a whole number</text>
    <text x="15" y="60" class="math" fill="#d97706">6.4 ÷ 0.2 → 64 ÷ 2 = 32</text>
    <text x="15" y="82" class="label">Multiply both by same power of 10</text>
  </g>

  <!-- Conversions -->
  <g transform="translate(30, 430)">
    <rect x="0" y="0" width="840" height="55" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">Converting common fractions to decimals (memorise these!)</text>
    <text x="420" y="44" class="label" text-anchor="middle">½ = 0.5  |  ¼ = 0.25  |  ¾ = 0.75  |  ⅓ = 0.333…  |  ⅕ = 0.2  |  ⅛ = 0.125  |  ¹/₁₀ = 0.1  |  ¹/₁₀₀ = 0.01</text>
  </g>
</svg>
