<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Trigonometry: identities, equations and graphs</title>
  <desc id="desc">Sine and cosine graphs with amplitude and period; the unit circle connecting trig ratios to coordinates; key identities including sin²θ+cos²θ=1 and double-angle formulas; and the sine and cosine rules for non-right-angle triangles.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Trigonometry</text>

  <!-- Unit circle -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="250" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="125" y="15" class="subhead" text-anchor="middle">Unit circle</text>
    <g transform="translate(125, 105)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <line x1="-75" y1="0" x2="75" y2="0" stroke="#e2e8f0" stroke-width="0.5"/>
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#e2e8f0" stroke-width="0.5"/>
      <!-- Ray at 45 degrees -->
      <line x1="0" y1="0" x2="49" y2="-49" stroke="#2563eb" stroke-width="2"/>
      <path d="M 20 0 A 20 20 0 0 1 14 -14" fill="none" stroke="#dc2626" stroke-width="1.5"/>
      <text x="24" y="-8" class="label" font-size="11" fill="#dc2626">θ</text>
      <circle cx="49" cy="-49" r="3" fill="#2563eb"/>
      <text x="55" y="-55" class="label" font-size="11" fill="#2563eb">(cosθ, sinθ)</text>
    </g>
  </g>

  <!-- Key identities -->
  <g transform="translate(300, 55)">
    <rect x="0" y="0" width="570" height="215" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="285" y="20" class="subhead" text-anchor="middle">Key trigonometric identities</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#dc2626">Pythagorean: sin²θ + cos²θ = 1</text>
      <text x="0" y="22" class="math">→ 1 + tan²θ = sec²θ  | 1 + cot²θ = cosec²θ</text>
      <text x="0" y="50" class="math" fill="#2563eb">Double angle:</text>
      <text x="0" y="70" class="label">sin2θ = 2sinθcosθ</text>
      <text x="0" y="88" class="label">cos2θ = cos²θ−sin²θ = 2cos²θ−1 = 1−2sin²θ</text>
      <text x="0" y="116" class="math" fill="#d97706">Sine rule: a/sinA = b/sinB = c/sinC</text>
      <text x="0" y="140" class="math" fill="#16a34a">Cosine rule: a² = b² + c² − 2bc·cosA</text>
      <text x="0" y="164" class="label">Area = ½ab·sinC</text>
    </g>
  </g>

  <!-- Graphs -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="840" height="85" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">Trig graphs: y = asin(bx+c) + d</text>
    <g transform="translate(15, 42)">
      <text x="0" y="0" class="label">Amplitude = |a| (vertical stretch). Period = 2π/b (for sin/cos). Phase shift = −c/b (horizontal shift).</text>
      <text x="0" y="22" class="label">Vertical shift = d (moves midline up/down). sinx and cosx have period 2π. tanx has period π.</text>
    </g>
  </g>

  <!-- Solving -->
  <g transform="translate(30, 385)">
    <rect x="0" y="0" width="840" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="420" y="25" class="math" text-anchor="middle" fill="#7c3aed">When solving sinx=k: general solution x = sin⁻¹(k)+2πn or x = π−sin⁻¹(k)+2πn. Use CAST diagram!</text>
  </g>
</svg>
