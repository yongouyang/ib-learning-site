<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Multiplying fractions with an area model</title>
  <desc id="desc">A rectangle split into four columns and three rows shows two thirds multiplied by three quarters: the overlap is six twelfths, which cancels to one half. Dividing fractions becomes multiplying by the reciprocal.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Multiplying fractions with an area model</text>
  <rect x="30" y="55" width="440" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="250.0" y="77" class="subhead" text-anchor="middle">2/3 × 3/4 as an area</text>
  <rect x="90" y="120" width="300" height="180" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="165" y1="120" x2="165" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="240" y1="120" x2="240" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="315" y1="120" x2="315" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="180" x2="390" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="240" x2="390" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="90" y="120" width="225" height="180" fill="#bfdbfe" opacity="0.45"/>
  <rect x="90" y="120" width="300" height="120" fill="#a5b4fc" opacity="0.45"/>
  <rect x="90" y="120" width="75" height="60" fill="#2563eb" opacity="0.35"/>
  <rect x="165" y="120" width="75" height="60" fill="#2563eb" opacity="0.35"/>
  <rect x="240" y="120" width="75" height="60" fill="#2563eb" opacity="0.35"/>
  <rect x="90" y="180" width="75" height="60" fill="#2563eb" opacity="0.35"/>
  <rect x="165" y="180" width="75" height="60" fill="#2563eb" opacity="0.35"/>
  <rect x="240" y="180" width="75" height="60" fill="#2563eb" opacity="0.35"/>
  <text x="240" y="340" class="label" text-anchor="middle">the overlap is 6 of the 12 parts</text>
  <text x="240" y="372" class="math" text-anchor="middle" fill="#2563eb">6/12 = 1/2</text>
  <rect x="490" y="55" width="380" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="680.0" y="77" class="subhead" text-anchor="middle">The rules</text>
  <text x="520" y="124" class="label">Multiply: tops times tops,</text>
  <text x="520" y="154" class="label">bottoms times bottoms</text>
  <text x="520" y="184" class="math" fill="#2563eb">2/3 × 3/4 = 6/12 = 1/2</text>
  <text x="520" y="214" class="label"></text>
  <text x="520" y="244" class="label">Divide: flip the second fraction</text>
  <text x="520" y="274" class="label">and multiply</text>
  <text x="520" y="304" class="math" fill="#2563eb">2/3 ÷ 3/4 = 2/3 × 4/3 = 8/9</text>
  <text x="520" y="334" class="label"></text>
  <text x="520" y="364" class="small">Cancel before multiplying when you</text>
  <text x="520" y="394" class="small">can — it keeps numbers small.</text>
</svg>
