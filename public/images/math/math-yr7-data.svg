<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Data types, charts, and averages</title>
  <desc id="desc">Visual comparison of qualitative vs quantitative data; a bar chart, pie chart, and line graph example; and a worked example calculating mean, median, mode and range from a small dataset.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
    .bar-blue { fill: #2563eb; }
    .bar-red { fill: #dc2626; }
    .bar-green { fill: #16a34a; }
    .bar-amber { fill: #d97706; }
    .chart-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
  </style>
  <rect width="900" height="480" fill="#f8fafc" rx="12"/>

  <text x="30" y="35" class="heading">Data types and charts</text>

  <!-- Data types -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="200" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="100" y="20" class="subhead" text-anchor="middle">Qualitative</text>
    <text x="100" y="44" class="label" text-anchor="middle">Categories / words</text>
  </g>
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="200" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="100" y="20" class="subhead" text-anchor="middle">Quantitative</text>
    <text x="100" y="44" class="label" text-anchor="middle">Numbers / measurements</text>
  </g>
  <g transform="translate(470, 55)">
    <rect x="0" y="0" width="400" height="55" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="200" y="22" class="subhead" text-anchor="middle">Discrete vs Continuous</text>
    <text x="200" y="44" class="label" text-anchor="middle">Discrete: counted (e.g. goals) | Continuous: measured (e.g. height)</text>
  </g>

  <!-- Bar chart -->
  <text x="30" y="145" class="subhead">Bar chart: Favourite fruits (qualitative)</text>
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="260" height="120" class="chart-bg" rx="4"/>
    <line x1="40" y1="20" x2="40" y2="100" stroke="#374151" stroke-width="1.5"/>
    <line x1="35" y1="100" x2="250" y2="100" stroke="#374151" stroke-width="1.5"/>
    <rect x="55" y="55" width="30" height="45" class="bar-blue" rx="1"/>
    <text x="70" y="115" class="label" text-anchor="middle" font-size="10">Apples</text>
    <rect x="100" y="25" width="30" height="75" class="bar-red" rx="1"/>
    <text x="115" y="115" class="label" text-anchor="middle" font-size="10">Bananas</text>
    <rect x="145" y="40" width="30" height="60" class="bar-green" rx="1"/>
    <text x="160" y="115" class="label" text-anchor="middle" font-size="10">Oranges</text>
  </g>

  <!-- Pie chart -->
  <text x="320" y="145" class="subhead">Pie chart</text>
  <g transform="translate(340, 160)">
    <circle cx="65" cy="55" r="45" fill="none" stroke="#374151" stroke-width="1.5"/>
    <path d="M65,55 L65,10 A45,45 0 0,1 107,35 Z" fill="#2563eb" fill-opacity="0.6"/>
    <path d="M65,55 L107,35 A45,45 0 0,1 85,98 Z" fill="#dc2626" fill-opacity="0.6"/>
    <path d="M65,55 L85,98 A45,45 0 0,1 35,75 Z" fill="#16a34a" fill-opacity="0.6"/>
    <path d="M65,55 L35,75 A45,45 0 0,1 65,10 Z" fill="#d97706" fill-opacity="0.6"/>
    <rect x="140" y="15" width="10" height="10" fill="#2563eb" fill-opacity="0.6"/><text x="155" y="24" class="label" font-size="10">A</text>
    <rect x="140" y="32" width="10" height="10" fill="#dc2626" fill-opacity="0.6"/><text x="155" y="41" class="label" font-size="10">B</text>
    <rect x="140" y="49" width="10" height="10" fill="#16a34a" fill-opacity="0.6"/><text x="155" y="58" class="label" font-size="10">C</text>
    <rect x="140" y="66" width="10" height="10" fill="#d97706" fill-opacity="0.6"/><text x="155" y="75" class="label" font-size="10">D</text>
  </g>

  <!-- Line graph -->
  <text x="320" y="310" class="subhead">Line graph (quantitative)</text>
  <g transform="translate(320, 325)">
    <rect x="0" y="0" width="260" height="100" class="chart-bg" rx="4"/>
    <line x1="30" y1="15" x2="30" y2="85" stroke="#374151" stroke-width="1"/>
    <line x1="25" y1="85" x2="240" y2="85" stroke="#374151" stroke-width="1"/>
    <polyline points="40,75 80,55 120,65 160,35 200,45 230,15" stroke="#2563eb" stroke-width="2" fill="none"/>
    <circle cx="40" cy="75" r="3" fill="#2563eb"/>
    <circle cx="80" cy="55" r="3" fill="#2563eb"/>
    <circle cx="120" cy="65" r="3" fill="#2563eb"/>
    <circle cx="160" cy="35" r="3" fill="#2563eb"/>
    <circle cx="200" cy="45" r="3" fill="#2563eb"/>
    <circle cx="230" cy="15" r="3" fill="#2563eb"/>
    <text x="30" y="98" class="label" text-anchor="middle" font-size="9">Jan</text>
    <text x="80" y="98" class="label" text-anchor="middle" font-size="9">Feb</text>
    <text x="120" y="98" class="label" text-anchor="middle" font-size="9">Mar</text>
    <text x="160" y="98" class="label" text-anchor="middle" font-size="9">Apr</text>
    <text x="200" y="98" class="label" text-anchor="middle" font-size="9">May</text>
    <text x="230" y="98" class="label" text-anchor="middle" font-size="9">Jun</text>
  </g>

  <!-- Averages -->
  <text x="30" y="310" class="heading">Averages and range</text>
  <g transform="translate(30, 335)">
    <rect x="0" y="0" width="270" height="130" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="135" y="20" class="subhead" text-anchor="middle">Data: 3, 7, 7, 8, 10</text>
    <g transform="translate(15, 38)">
      <text x="0" y="0" class="math">Mean: (3+7+7+8+10)÷5 = 35÷5 = 7</text>
      <text x="0" y="22" class="math">Median: middle value = 7</text>
      <text x="0" y="44" class="math">Mode: most frequent = 7</text>
      <text x="0" y="66" class="math">Range: 10−3 = 7</text>
    </g>
  </g>
</svg>
