<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">A sample space for two dice</title>
  <desc id="desc">A six by six grid of every equally likely outcome for two dice, with the sums shown in each cell, the event total 7 highlighted, and the probability worked out from the count.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">A sample space for two dice</text>
  <rect x="30" y="55" width="520" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="290.0" y="77" class="subhead" text-anchor="middle">Two dice: 36 equally likely outcomes</text>
  <rect x="90" y="110" width="264" height="264" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="90" y1="110" x2="90" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="110" x2="354" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="134" y1="110" x2="134" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="154" x2="354" y2="154" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="178" y1="110" x2="178" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="198" x2="354" y2="198" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="222" y1="110" x2="222" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="242" x2="354" y2="242" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="266" y1="110" x2="266" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="286" x2="354" y2="286" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="310" y1="110" x2="310" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="330" x2="354" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="354" y1="110" x2="354" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="374" x2="354" y2="374" stroke="#e2e8f0" stroke-width="1"/>
  <text x="112.0" y="137.0" class="math" text-anchor="middle" fill="#475569">2</text>
  <text x="156.0" y="137.0" class="math" text-anchor="middle" fill="#475569">3</text>
  <text x="200.0" y="137.0" class="math" text-anchor="middle" fill="#475569">4</text>
  <text x="244.0" y="137.0" class="math" text-anchor="middle" fill="#475569">5</text>
  <text x="288.0" y="137.0" class="math" text-anchor="middle" fill="#475569">6</text>
  <text x="332.0" y="137.0" class="math" text-anchor="middle" fill="#dc2626">7</text>
  <text x="112.0" y="181.0" class="math" text-anchor="middle" fill="#475569">3</text>
  <text x="156.0" y="181.0" class="math" text-anchor="middle" fill="#475569">4</text>
  <text x="200.0" y="181.0" class="math" text-anchor="middle" fill="#475569">5</text>
  <text x="244.0" y="181.0" class="math" text-anchor="middle" fill="#475569">6</text>
  <text x="288.0" y="181.0" class="math" text-anchor="middle" fill="#dc2626">7</text>
  <text x="332.0" y="181.0" class="math" text-anchor="middle" fill="#475569">8</text>
  <text x="112.0" y="225.0" class="math" text-anchor="middle" fill="#475569">4</text>
  <text x="156.0" y="225.0" class="math" text-anchor="middle" fill="#475569">5</text>
  <text x="200.0" y="225.0" class="math" text-anchor="middle" fill="#475569">6</text>
  <text x="244.0" y="225.0" class="math" text-anchor="middle" fill="#dc2626">7</text>
  <text x="288.0" y="225.0" class="math" text-anchor="middle" fill="#475569">8</text>
  <text x="332.0" y="225.0" class="math" text-anchor="middle" fill="#475569">9</text>
  <text x="112.0" y="269.0" class="math" text-anchor="middle" fill="#475569">5</text>
  <text x="156.0" y="269.0" class="math" text-anchor="middle" fill="#475569">6</text>
  <text x="200.0" y="269.0" class="math" text-anchor="middle" fill="#dc2626">7</text>
  <text x="244.0" y="269.0" class="math" text-anchor="middle" fill="#475569">8</text>
  <text x="288.0" y="269.0" class="math" text-anchor="middle" fill="#475569">9</text>
  <text x="332.0" y="269.0" class="math" text-anchor="middle" fill="#475569">10</text>
  <text x="112.0" y="313.0" class="math" text-anchor="middle" fill="#475569">6</text>
  <text x="156.0" y="313.0" class="math" text-anchor="middle" fill="#dc2626">7</text>
  <text x="200.0" y="313.0" class="math" text-anchor="middle" fill="#475569">8</text>
  <text x="244.0" y="313.0" class="math" text-anchor="middle" fill="#475569">9</text>
  <text x="288.0" y="313.0" class="math" text-anchor="middle" fill="#475569">10</text>
  <text x="332.0" y="313.0" class="math" text-anchor="middle" fill="#475569">11</text>
  <text x="112.0" y="357.0" class="math" text-anchor="middle" fill="#dc2626">7</text>
  <text x="156.0" y="357.0" class="math" text-anchor="middle" fill="#475569">8</text>
  <text x="200.0" y="357.0" class="math" text-anchor="middle" fill="#475569">9</text>
  <text x="244.0" y="357.0" class="math" text-anchor="middle" fill="#475569">10</text>
  <text x="288.0" y="357.0" class="math" text-anchor="middle" fill="#475569">11</text>
  <text x="332.0" y="357.0" class="math" text-anchor="middle" fill="#475569">12</text>
  <text x="368" y="126" class="small">die 1</text>
  <text x="60" y="404" class="small">die 2</text>
  <text x="290" y="392" class="math" text-anchor="middle" fill="#dc2626">6 of the 36 outcomes total 7, so P(7) = 6/36 = 1/6</text>
  <rect x="570" y="55" width="300" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="720.0" y="77" class="subhead" text-anchor="middle">Writing probabilities</text>
  <text x="592" y="116" class="label">P(event) = favourable ÷ total</text>
  <text x="592" y="138" class="small"></text>
  <text x="592" y="160" class="small">Always between 0 and 1:</text>
  <text x="592" y="182" class="label">  0 = impossible</text>
  <text x="592" y="204" class="small">  1 = certain</text>
  <text x="592" y="226" class="small"></text>
  <text x="592" y="248" class="label">Complementary:</text>
  <text x="592" y="270" class="small">  P(not A) = 1 − P(A)</text>
  <text x="592" y="292" class="small"></text>
  <text x="592" y="314" class="label">For two dice P(7) = 1/6, so</text>
  <text x="592" y="336" class="small">P(not 7) = 5/6.</text>
  <text x="592" y="358" class="small"></text>
  <text x="592" y="380" class="label">List the space systematically —</text>
  <text x="592" y="402" class="small">missing outcomes is the commonest</text>
  <text x="592" y="424" class="small">error.</text>
</svg>
