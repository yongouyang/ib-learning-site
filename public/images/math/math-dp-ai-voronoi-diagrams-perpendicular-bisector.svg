<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Constructing the perpendicular bisector of AB</title>
  <desc id="desc">For sites A(1, 2) and B(5, 4), the midpoint is M(3, 3). Segment AB has gradient one half, so its perpendicular bisector has gradient −2 and equation y equals −2x plus 9. The bisector passes through M at a right angle.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 14px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 16px; font-weight: 600; fill: #1d4ed8; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <rect width="900" height="560" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">Voronoi edge: the perpendicular bisector of two sites</text>
  <rect x="35" y="65" width="520" height="460" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M90 85 V510 M150 85 V510 M210 85 V510 M270 85 V510 M330 85 V510 M390 85 V510 M450 85 V510 M510 85 V510 M55 120 H540 M55 180 H540 M55 240 H540 M55 300 H540 M55 360 H540 M55 420 H540" class="grid"/>
  <line x1="55" y1="480" x2="540" y2="480" stroke="#334155" stroke-width="1.8"/>
  <line x1="150" y1="85" x2="150" y2="510" stroke="#334155" stroke-width="1.8"/>
  <text x="528" y="470" class="small">x</text>
  <text x="161" y="101" class="small">y</text>
  <text x="132" y="498" class="small">O</text>
  <text x="210" y="500" class="small" text-anchor="middle">1</text>
  <text x="450" y="500" class="small" text-anchor="middle">5</text>
  <text x="138" y="365" class="small" text-anchor="end">2</text>
  <text x="138" y="305" class="small" text-anchor="end">3</text>
  <text x="138" y="245" class="small" text-anchor="end">4</text>
  <line x1="210" y1="360" x2="450" y2="240" stroke="#2563eb" stroke-width="3"/>
  <line x1="240" y1="120" x2="420" y2="480" stroke="#7c3aed" stroke-width="2.8"/>
  <path d="M346.1 291.9 L354.1 308 L338 316.1" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <circle cx="210" cy="360" r="6" fill="#2563eb"/>
  <circle cx="450" cy="240" r="6" fill="#2563eb"/>
  <circle cx="330" cy="300" r="6" fill="#d97706"/>
  <rect x="173" y="367" width="90" height="32" rx="5" fill="#f8fafc"/>
  <text x="218" y="389" class="label" text-anchor="middle">A (1, 2)</text>
  <rect x="418" y="202" width="90" height="32" rx="5" fill="#f8fafc"/>
  <text x="463" y="224" class="label" text-anchor="middle">B (5, 4)</text>
  <rect x="338" y="307" width="96" height="32" rx="5" fill="#f8fafc"/>
  <text x="386" y="329" class="label" text-anchor="middle">M (3, 3)</text>
  <rect x="339" y="148" width="135" height="32" rx="5" fill="#f8fafc"/>
  <text x="406.5" y="170" class="label" text-anchor="middle" fill="#7c3aed">bisector: gradient −2</text>
  <rect x="585" y="65" width="280" height="460" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="610" y="105" class="subhead">1. Midpoint</text>
  <text x="610" y="143" class="math">M = ((1 + 5)/2, (2 + 4)/2)</text>
  <text x="610" y="176" class="math">M = (3, 3)</text>
  <text x="610" y="229" class="subhead">2. Gradients</text>
  <text x="610" y="267" class="math">m(AB) = (4 − 2)/(5 − 1) = 1/2</text>
  <text x="610" y="305" class="math">m(perpendicular) = −2</text>
  <text x="610" y="358" class="subhead">3. Equation through M</text>
  <text x="610" y="396" class="math">y − 3 = −2(x − 3)</text>
  <rect x="610" y="425" width="220" height="56" rx="7" fill="#f5f3ff"/>
  <text x="720" y="462" class="math" text-anchor="middle">y = −2x + 9</text>
</svg>
