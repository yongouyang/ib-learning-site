<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Formula triangles for speed, density and pressure</title>
  <desc id="desc">Three labelled triangles show how compound measures relate to their components. In each triangle the top value equals the bottom-left value divided by the bottom-right value.</desc>
  <style>
    .triangle { fill: none; stroke-width: 3; }
    .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; fill: #374151; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #111827; }
    .backing { fill: #ffffff; opacity: 0.9; }
    .speed { stroke: #2563eb; fill: #eff6ff; }
    .density { stroke: #16a34a; fill: #f0fdf4; }
    .pressure { stroke: #ea580c; fill: #fff7ed; }
    .divider { stroke: #9ca3af; stroke-width: 1.5; }
  </style>

  <!-- Speed triangle -->
  <g transform="translate(60, 40)">
    <rect x="-10" y="-30" width="240" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="110" y="0" class="title">Speed</text>
    <polygon points="110,60 30,230 190,230" class="triangle speed"/>
    <line x1="30" y1="230" x2="190" y2="230" class="divider"/>
    <line x1="110" y1="60" x2="110" y2="230" class="divider"/>
    <rect x="80" y="40" width="60" height="40" rx="6" class="backing"/>
    <text x="110" y="62" class="label">s</text>
    <rect x="45" y="235" width="60" height="40" rx="6" class="backing"/>
    <text x="75" y="257" class="label">d</text>
    <rect x="125" y="235" width="60" height="40" rx="6" class="backing"/>
    <text x="155" y="257" class="label">t</text>
    <text x="110" y="300" class="sublabel">s = d / t</text>
  </g>

  <!-- Density triangle -->
  <g transform="translate(300, 40)">
    <rect x="-10" y="-30" width="240" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="110" y="0" class="title">Density</text>
    <polygon points="110,60 30,230 190,230" class="triangle density"/>
    <line x1="30" y1="230" x2="190" y2="230" class="divider"/>
    <line x1="110" y1="60" x2="110" y2="230" class="divider"/>
    <rect x="80" y="40" width="60" height="40" rx="6" class="backing"/>
    <text x="110" y="62" class="label">ρ</text>
    <rect x="45" y="235" width="60" height="40" rx="6" class="backing"/>
    <text x="75" y="257" class="label">m</text>
    <rect x="125" y="235" width="60" height="40" rx="6" class="backing"/>
    <text x="155" y="257" class="label">V</text>
    <text x="110" y="300" class="sublabel">ρ = m / V</text>
  </g>

  <!-- Pressure triangle -->
  <g transform="translate(540, 40)">
    <rect x="-10" y="-30" width="240" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="110" y="0" class="title">Pressure</text>
    <polygon points="110,60 30,230 190,230" class="triangle pressure"/>
    <line x1="30" y1="230" x2="190" y2="230" class="divider"/>
    <line x1="110" y1="60" x2="110" y2="230" class="divider"/>
    <rect x="80" y="40" width="60" height="40" rx="6" class="backing"/>
    <text x="110" y="62" class="label">P</text>
    <rect x="45" y="235" width="60" height="40" rx="6" class="backing"/>
    <text x="75" y="257" class="label">F</text>
    <rect x="125" y="235" width="60" height="40" rx="6" class="backing"/>
    <text x="155" y="257" class="label">A</text>
    <text x="110" y="300" class="sublabel">P = F / A</text>
  </g>
</svg>
