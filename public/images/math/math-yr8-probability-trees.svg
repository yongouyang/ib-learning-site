<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Tree diagram for two picks from a bag</title>
  <desc id="desc">A tree diagram showing two trials of picking a counter from a bag containing red and blue counters. The first branches show the probability of red or blue on the first pick, and the second branches show the same probabilities because the counter is replaced.</desc>
  <style>
    .branch { fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .red { stroke: #dc2626; }
    .blue { stroke: #2563eb; }
    .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .prob { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; fill: #374151; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #111827; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; fill: #4b5563; }
    .node { stroke-width: 2; }
    .backing { fill: #ffffff; opacity: 0.92; }
  </style>

  <!-- Title -->
  <rect x="190" y="12" width="500" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="440" y="35" class="title">Tree Diagram: Picking with Replacement</text>

  <!-- Bag -->
  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="110" height="90" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="55" y="35" class="label" fill="#9a3412">Bag</text>
    <text x="55" y="60" class="subtitle">2 red, 3 blue</text>
  </g>

  <!-- Stage 1 node -->
  <circle cx="240" cy="215" r="6" fill="#ffffff" stroke="#374151" stroke-width="2.5" class="node"/>

  <!-- Stage 1 branches -->
  <line x1="240" y1="215" x2="380" y2="120" class="branch red"/>
  <line x1="240" y1="215" x2="380" y2="310" class="branch blue"/>

  <!-- Stage 1 labels -->
  <rect x="275" y="110" width="50" height="28" rx="5" class="backing"/>
  <text x="300" y="126" class="prob">2/5</text>
  <rect x="275" y="290" width="50" height="28" rx="5" class="backing"/>
  <text x="300" y="306" class="prob">3/5</text>

  <!-- Stage 2 nodes -->
  <circle cx="380" cy="120" r="6" fill="#ffffff" stroke="#374151" stroke-width="2.5" class="node"/>
  <circle cx="380" cy="310" r="6" fill="#ffffff" stroke="#374151" stroke-width="2.5" class="node"/>

  <!-- Stage 2 branches from upper node (red first) -->
  <line x1="380" y1="120" x2="560" y2="55" class="branch red"/>
  <line x1="380" y1="120" x2="560" y2="185" class="branch blue"/>

  <!-- Stage 2 branches from lower node (blue first) -->
  <line x1="380" y1="310" x2="560" y2="245" class="branch red"/>
  <line x1="380" y1="310" x2="560" y2="375" class="branch blue"/>

  <!-- Stage 2 labels -->
  <rect x="435" y="48" width="50" height="28" rx="5" class="backing"/>
  <text x="460" y="64" class="prob">2/5</text>
  <rect x="435" y="160" width="50" height="28" rx="5" class="backing"/>
  <text x="460" y="176" class="prob">3/5</text>
  <rect x="435" y="238" width="50" height="28" rx="5" class="backing"/>
  <text x="460" y="254" class="prob">2/5</text>
  <rect x="435" y="350" width="50" height="28" rx="5" class="backing"/>
  <text x="460" y="366" class="prob">3/5</text>

  <!-- Outcome labels -->
  <rect x="575" y="38" width="110" height="34" rx="6" class="backing"/>
  <text x="630" y="58" class="label" fill="#dc2626">red, red</text>
  <rect x="575" y="168" width="110" height="34" rx="6" class="backing"/>
  <text x="630" y="188" class="label" fill="#7c3aed">red, blue</text>
  <rect x="575" y="228" width="110" height="34" rx="6" class="backing"/>
  <text x="630" y="248" class="label" fill="#7c3aed">blue, red</text>
  <rect x="575" y="358" width="110" height="34" rx="6" class="backing"/>
  <text x="630" y="378" class="label" fill="#2563eb">blue, blue</text>

  <!-- Path probabilities -->
  <rect x="710" y="42" width="120" height="28" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="770" y="59" class="prob" fill="#991b1b">2/5 × 2/5</text>
  <rect x="710" y="172" width="120" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="770" y="189" class="prob" fill="#1e40af">2/5 × 3/5</text>
  <rect x="710" y="232" width="120" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="770" y="249" class="prob" fill="#1e40af">3/5 × 2/5</text>
  <rect x="710" y="362" width="120" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="770" y="379" class="prob" fill="#1e40af">3/5 × 3/5</text>

  <!-- Legend -->
  <g transform="translate(60, 370)">
    <line x1="0" y1="8" x2="30" y2="8" class="branch red"/>
    <text x="40" y="9" class="prob" text-anchor="start">Red branch</text>
    <line x1="140" y1="8" x2="170" y2="8" class="branch blue"/>
    <text x="180" y="9" class="prob" text-anchor="start">Blue branch</text>
  </g>
</svg>
