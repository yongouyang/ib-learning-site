<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Frequency table and stem-and-leaf diagram</title>
  <desc id="desc">A frequency table and a stem-and-leaf diagram are shown side by side. The frequency table lists scores with tally marks and frequencies. The stem-and-leaf diagram orders data and includes a key.</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 20px; font-weight: 700; text-anchor: middle; fill: #111827; }
    .subtitle { font-size: 16px; font-weight: 600; fill: #374151; }
    .cell { font-size: 15px; fill: #1f2937; }
    .header { font-weight: 600; fill: #1e40af; }
    .box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; }
    .stem { font-weight: 700; fill: #2563eb; }
    .leaf { fill: #059669; }
    .keybox { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Frequency table -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="360" height="300" rx="12" class="box"/>
    <text x="180" y="35" class="title">Frequency Table</text>
    <text x="50" y="75" class="subtitle header">Score</text>
    <text x="150" y="75" class="subtitle header">Tally</text>
    <text x="270" y="75" class="subtitle header">Frequency</text>
    <line x1="20" y1="85" x2="340" y2="85" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="115" class="cell">3</text><text x="150" y="115" class="cell">||</text><text x="280" y="115" class="cell">2</text>
    <text x="50" y="150" class="cell">4</text><text x="150" y="150" class="cell">||||</text><text x="280" y="150" class="cell">4</text>
    <text x="50" y="185" class="cell">5</text><text x="150" y="185" class="cell">|||</text><text x="280" y="185" class="cell">3</text>
    <text x="50" y="220" class="cell">6</text><text x="150" y="220" class="cell">|</text><text x="280" y="220" class="cell">1</text>
    <line x1="20" y1="245" x2="340" y2="245" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="270" class="cell header">Total</text><text x="280" y="270" class="cell header">10</text>
  </g>

  <!-- Stem-and-leaf diagram -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="360" height="300" rx="12" class="box"/>
    <text x="180" y="35" class="title">Stem-and-Leaf</text>
    <text x="70" y="85" class="subtitle stem">Stem</text>
    <text x="210" y="85" class="subtitle leaf">Leaf</text>
    <text x="70" y="125" class="cell stem">1</text><text x="210" y="125" class="cell leaf">2 3 5</text>
    <text x="70" y="165" class="cell stem">2</text><text x="210" y="165" class="cell leaf">0 4 6 8</text>
    <text x="70" y="205" class="cell stem">3</text><text x="210" y="205" class="cell leaf">1 3 7</text>
    <rect x="70" y="240" width="220" height="36" rx="6" class="keybox"/>
    <text x="180" y="265" class="cell header">Key: 2 | 4 = 24</text>
  </g>
</svg>