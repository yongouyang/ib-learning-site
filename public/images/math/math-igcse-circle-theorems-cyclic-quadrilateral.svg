<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Opposite angles in a cyclic quadrilateral</title>
  <desc id="desc">Cyclic quadrilateral ABCD has all four vertices on a circle. Opposite vertices A and C are highlighted in blue, and B and D in green, to show that A plus C equals 180 degrees and B plus D equals 180 degrees.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 14px; fill: #374151; }
    .math { font-size: 17px; font-weight: 600; fill: #1d4ed8; }
  </style>
  <rect width="900" height="560" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">Cyclic quadrilateral: opposite angles are supplementary</text>
  <circle cx="300" cy="285" r="180" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="122.7,253.8 331.3,107.7 469.1,346.6 238.5,454.1" fill="#eff6ff" fill-opacity="0.55" stroke="#334155" stroke-width="2.5"/>
  <circle cx="122.7" cy="253.8" r="7" fill="#2563eb"/>
  <circle cx="331.3" cy="107.7" r="7" fill="#16a34a"/>
  <circle cx="469.1" cy="346.6" r="7" fill="#2563eb"/>
  <circle cx="238.5" cy="454.1" r="7" fill="#16a34a"/>
  <text x="99" y="255" class="subhead" fill="#2563eb">A</text>
  <text x="329" y="88" class="subhead" fill="#16a34a">B</text>
  <text x="488" y="354" class="subhead" fill="#2563eb">C</text>
  <text x="229" y="485" class="subhead" fill="#16a34a">D</text>
  <path d="M151 254 A28 28 0 0 1 145 236" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M320 132 A28 28 0 0 1 306 122" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M441 340 A28 28 0 0 1 446 360" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M250 437 A28 28 0 0 1 267 448" fill="none" stroke="#16a34a" stroke-width="2"/>
  <rect x="540" y="70" width="325" height="440" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="565" y="108" class="subhead">Opposite pairs</text>
  <rect x="565" y="132" width="275" height="55" rx="7" fill="#eff6ff"/>
  <text x="702.5" y="168" class="math" text-anchor="middle">A + C = 180°</text>
  <rect x="565" y="205" width="275" height="55" rx="7" fill="#f0fdf4"/>
  <text x="702.5" y="241" class="math" text-anchor="middle" fill="#15803d">B + D = 180°</text>
  <text x="565" y="307" class="subhead">Worked example</text>
  <text x="565" y="343" class="label">A = (x + 10)°</text>
  <text x="565" y="371" class="label">C = (2x − 40)°</text>
  <text x="565" y="410" class="math">3x − 30 = 180</text>
  <text x="565" y="442" class="math">3x = 210, so x = 70</text>
  <text x="565" y="481" class="label">All four vertices lie on the circle.</text>
</svg>
