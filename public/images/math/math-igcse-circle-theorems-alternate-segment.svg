<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">The alternate segment theorem with 58-degree angles</title>
  <desc id="desc">A tangent at A makes a 58-degree angle with chord AB. Point C lies on the major arc AB, and angle ACB in the alternate segment is also 58 degrees.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 14px; fill: #374151; }
    .math { font-size: 17px; font-weight: 600; fill: #1d4ed8; }
  </style>
  <rect width="900" height="580" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">Tangent–chord angle = angle in the alternate segment</text>
  <circle cx="320" cy="290" r="190" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <line x1="130" y1="70" x2="130" y2="525" stroke="#7c3aed" stroke-width="3"/>
  <line x1="130" y1="290" x2="403.2" y2="460.9" stroke="#2563eb" stroke-width="3"/>
  <line x1="415" y1="125.4" x2="130" y2="290" stroke="#d97706" stroke-width="2.3"/>
  <line x1="415" y1="125.4" x2="403.2" y2="460.9" stroke="#d97706" stroke-width="2.3"/>
  <path d="M130 340 A50 50 0 0 0 172.5 316.5" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <path d="M384.7 142.9 A35 35 0 0 0 413.8 160.3" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <circle cx="130" cy="290" r="6" fill="#2563eb"/>
  <circle cx="403.2" cy="460.9" r="6" fill="#2563eb"/>
  <circle cx="415" cy="125.4" r="6" fill="#d97706"/>
  <text x="108" y="298" class="subhead">A</text>
  <text x="408" y="488" class="subhead">B</text>
  <text x="420" y="116" class="subhead">C</text>
  <text x="105" y="84" class="label" text-anchor="end" fill="#7c3aed">tangent</text>
  <text x="260" y="403" class="label" text-anchor="middle" fill="#2563eb">chord AB</text>
  <rect x="176" y="321" width="60" height="32" rx="5" fill="#f8fafc"/>
  <text x="206" y="343" class="math" text-anchor="middle" fill="#7c3aed">58°</text>
  <rect x="355" y="151" width="60" height="32" rx="5" fill="#f8fafc"/>
  <text x="385" y="173" class="math" text-anchor="middle" fill="#d97706">58°</text>
  <rect x="555" y="75" width="310" height="450" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="114" class="subhead">Alternate segment theorem</text>
  <text x="580" y="157" class="label">The angle between the tangent</text>
  <text x="580" y="184" class="label">and chord at A equals the angle</text>
  <text x="580" y="211" class="label">subtended by AB at C.</text>
  <rect x="580" y="244" width="260" height="60" rx="7" fill="#eff6ff"/>
  <text x="710" y="283" class="math" text-anchor="middle">∠ACB = 58°</text>
  <text x="580" y="350" class="label">Use the segment on the opposite</text>
  <text x="580" y="377" class="label">side of chord AB from the marked</text>
  <text x="580" y="404" class="label">tangent–chord angle.</text>
  <text x="580" y="463" class="label">C is on the major arc AB.</text>
</svg>
