<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Congruent and similar triangles</title>
  <desc id="desc">Diagram showing two congruent triangles that are identical in size and shape, and two similar triangles that have the same shape but different sizes.</desc>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>

  <!-- Section labels -->
  <text x="220" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e293b" text-anchor="middle">Congruent</text>
  <text x="220" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">same size, same shape</text>

  <text x="580" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e293b" text-anchor="middle">Similar</text>
  <text x="580" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">same shape, different size</text>

  <!-- Congruent triangle A -->
  <polygon points="120,130 280,130 120,270" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="120" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">A</text>
  <text x="195" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">5 cm</text>
  <text x="110" y="205" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="end">4 cm</text>
  <text x="212" y="217" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="start" transform="rotate(-45,212,217)">6.4 cm</text>

  <!-- Congruent triangle B (reflected/rotated) -->
  <polygon points="360,270 360,130 200,270" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="360" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">B</text>
  <text x="280" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">5 cm</text>
  <text x="370" y="205" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="start">4 cm</text>
  <text x="277" y="217" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="start" transform="rotate(-45,277,217)">6.4 cm</text>

  <!-- Congruent label -->
  <rect x="165" y="300" width="150" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="240" y="321" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8" text-anchor="middle">Triangle A ≅ Triangle B</text>

  <!-- Similar triangle C (larger) -->
  <polygon points="500,130 740,130 500,310" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">C</text>
  <text x="620" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">6 cm</text>
  <text x="490" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="end">8 cm</text>
  <text x="630" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="start" transform="rotate(-38,630,235)">10 cm</text>

  <!-- Similar triangle D (smaller) -->
  <polygon points="640,390 640,290 540,390" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="640" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">D</text>
  <text x="595" y="285" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">3 cm</text>
  <text x="650" y="345" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="start">4 cm</text>
  <text x="585" y="350" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="start" transform="rotate(38,585,350)">5 cm</text>

  <!-- Similar label -->
  <rect x="545" y="420" width="150" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="620" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle">Triangle C ~ Triangle D</text>

  <!-- Scale factor label -->
  <rect x="655" y="355" width="120" height="28" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="715" y="373" font-family="system-ui, sans-serif" font-size="13" fill="#166534" text-anchor="middle">scale factor = 2</text>

  <!-- Key points box -->
  <rect x="50" y="360" width="340" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="385" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Key points</text>
  <text x="70" y="410" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Congruent: equal sides, equal angles</text>
  <text x="70" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Similar: equal angles, sides in ratio</text>
  <text x="70" y="460" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Area scale factor = (length scale factor)²</text>
</svg>