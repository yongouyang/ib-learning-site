<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">The tallest histogram bar need not have the largest frequency</title>
  <desc id="desc">A narrow bar from 0 to 10 has height 5 and area 50. A wider, shorter bar from 10 to 40 has height 2 and area 60. The shorter bar therefore represents more data values.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 14px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 17px; font-weight: 600; fill: #1d4ed8; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <rect width="900" height="540" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">The tallest-bar trap: compare areas, not heights</text>
  <rect x="35" y="65" width="550" height="440" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="90" y1="160" x2="550" y2="160" class="grid"/>
  <line x1="90" y1="280" x2="550" y2="280" class="grid"/>
  <line x1="90" y1="360" x2="550" y2="360" stroke="#334155" stroke-width="1.8"/>
  <line x1="90" y1="105" x2="90" y2="360" stroke="#334155" stroke-width="1.8"/>
  <text x="52" y="113" class="small">frequency</text>
  <text x="52" y="130" class="small">density</text>
  <text x="80" y="165" class="small" text-anchor="end">5</text>
  <text x="80" y="285" class="small" text-anchor="end">2</text>
  <rect x="130" y="160" width="100" height="200" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="230" y="280" width="300" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="180" y="146" class="label" text-anchor="middle">height 5</text>
  <text x="380" y="266" class="label" text-anchor="middle">height 2</text>
  <rect x="139" y="235" width="82" height="44" rx="6" fill="#f8fafc"/>
  <text x="180" y="265" class="math" text-anchor="middle">area 50</text>
  <rect x="339" y="297" width="82" height="44" rx="6" fill="#f8fafc"/>
  <text x="380" y="327" class="math" text-anchor="middle">area 60</text>
  <text x="180" y="388" class="label" text-anchor="middle">0 &lt; t ≤ 10</text>
  <text x="380" y="388" class="label" text-anchor="middle">10 &lt; t ≤ 40</text>
  <text x="180" y="417" class="small" text-anchor="middle">width 10</text>
  <text x="380" y="417" class="small" text-anchor="middle">width 30</text>
  <text x="310" y="466" class="math" text-anchor="middle">60 &gt; 50: the shorter bar has more data</text>
  <rect x="615" y="65" width="250" height="440" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="105" class="subhead">Narrow, tall bar</text>
  <text x="640" y="147" class="math">10 × 5 = 50</text>
  <text x="640" y="207" class="subhead">Wide, short bar</text>
  <text x="640" y="249" class="math" fill="#15803d">30 × 2 = 60</text>
  <line x1="640" y1="282" x2="840" y2="282" stroke="#e2e8f0"/>
  <text x="640" y="324" class="label">Height ranks density.</text>
  <text x="640" y="361" class="label">Area ranks frequency.</text>
  <rect x="640" y="394" width="200" height="66" rx="7" fill="#f0fdf4"/>
  <text x="740" y="422" class="label" text-anchor="middle">Unequal widths?</text>
  <text x="740" y="447" class="label" text-anchor="middle">Always use area.</text>
</svg>
