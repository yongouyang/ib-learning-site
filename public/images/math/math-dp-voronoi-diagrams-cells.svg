<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Voronoi diagram for three sites</title>
  <desc id="desc">A rectangular region split into three Voronoi cells around sites A, B and C, with perpendicular bisectors forming the cell boundaries.</desc>
  <rect x="40" y="40" width="320" height="240" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <polygon points="40,40 220,40 140,200 40,280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="220,40 360,40 360,160 140,200" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="40,280 140,200 360,160 360,280" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <line x1="140" y1="200" x2="360" y2="160" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="140" y1="200" x2="220" y2="40" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="130" cy="100" r="7" fill="#2563eb"/>
  <circle cx="290" cy="90" r="7" fill="#16a34a"/>
  <circle cx="200" cy="240" r="7" fill="#d97706"/>
  <text x="130" y="90" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#1e3a8a">A</text>
  <text x="290" y="80" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#14532d">B</text>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#92400e">C</text>
  <text x="200" y="310" text-anchor="middle" font-family="system-ui" font-size="14" fill="#374151">Each cell contains all points closest to one site.</text>
</svg>