<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Reflection of a triangle on a coordinate grid</title>
  <desc id="desc">A coordinate grid showing a triangle in the first quadrant and its mirror image after reflection in the y-axis, demonstrating a congruent reflection.</desc>
  <rect width="800" height="360" fill="#f8fafc"/>

  <g transform="translate(120, 60)">
    <text x="280" y="-25" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#1e293b">Reflection in the y-axis</text>

    <line x1="200" y1="0" x2="200" y2="260" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="200" x2="560" y2="200" stroke="#334155" stroke-width="2"/>

    <polygon points="420,210 440,210 430,180" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="430" y="240" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#1e3a8a">Original</text>

    <polygon points="20,210 0,210 10,180" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
    <text x="10" y="240" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#14532d">Image</text>

    <line x1="200" y1="0" x2="200" y2="260" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="210" y="250" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#ef4444">Mirror line (y-axis)</text>

    <text x="205" y="15" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#475569">y</text>
    <text x="545" y="195" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#475569">x</text>
    <text x="205" y="205" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#475569">O</text>

    <g>
      <defs>
        <marker id="arrowhead-ref" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
      </defs>
      <line x1="380" y1="195" x2="70" y2="195" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead-ref)"/>
      <text x="225" y="185" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#475569">Same distance from mirror</text>
    </g>
  </g>

  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#475569">Reflection creates a congruent mirror image across the mirror line.</text>
</svg>
