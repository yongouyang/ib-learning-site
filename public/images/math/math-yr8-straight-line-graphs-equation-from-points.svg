<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Finding a line equation from two points</title>
  <desc id="desc">The line y equals 3x plus 1 passes through (1, 4) and (3, 10), with y-intercept (0, 1). A gradient triangle between the two given points has run 2 and rise 6, so the gradient is 3.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 14px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 16px; font-weight: 600; fill: #1d4ed8; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <rect width="900" height="540" fill="#f8fafc" rx="12"/>
  <text x="30" y="38" class="heading">Two points determine gradient and intercept</text>
  <rect x="35" y="65" width="350" height="440" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M185 85 V485 M220 85 V485 M255 85 V485 M290 85 V485 M325 85 V485 M55 420 H365 M55 390 H365 M55 360 H365 M55 330 H365 M55 300 H365 M55 270 H365 M55 240 H365 M55 210 H365 M55 180 H365 M55 150 H365 M55 120 H365" class="grid"/>
  <line x1="55" y1="450" x2="365" y2="450" stroke="#334155" stroke-width="1.8"/>
  <line x1="150" y1="85" x2="150" y2="485" stroke="#334155" stroke-width="1.8"/>
  <text x="353" y="440" class="small">x</text>
  <text x="160" y="100" class="small">y</text>
  <text x="132" y="468" class="small">0</text>
  <text x="185" y="468" class="small" text-anchor="middle">1</text>
  <text x="255" y="468" class="small" text-anchor="middle">3</text>
  <text x="138" y="335" class="small" text-anchor="end">4</text>
  <text x="138" y="155" class="small" text-anchor="end">10</text>
  <line x1="138.3" y1="450" x2="272.5" y2="105" stroke="#2563eb" stroke-width="3"/>
  <line x1="185" y1="330" x2="255" y2="330" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="255" y1="330" x2="255" y2="150" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="150" cy="420" r="5" fill="#16a34a"/>
  <circle cx="185" cy="330" r="5" fill="#2563eb"/>
  <circle cx="255" cy="150" r="5" fill="#2563eb"/>
  <text x="163" y="442" class="label">(0, 1)</text>
  <text x="165" y="318" class="label" text-anchor="end">(1, 4)</text>
  <text x="266" y="145" class="label">(3, 10)</text>
  <text x="220" y="353" class="label" text-anchor="middle" fill="#7c3aed">run = 2</text>
  <rect x="268" y="222" width="72" height="30" rx="5" fill="#f8fafc"/>
  <text x="304" y="243" class="label" text-anchor="middle" fill="#7c3aed">rise = 6</text>
  <rect x="420" y="65" width="445" height="440" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="445" y="103" class="subhead">1. Find the gradient</text>
  <text x="445" y="143" class="math">m = (10 − 4) ÷ (3 − 1) = 6 ÷ 2 = 3</text>
  <text x="445" y="192" class="subhead">2. Substitute (1, 4) into y = 3x + c</text>
  <text x="445" y="232" class="math">4 = 3(1) + c, so c = 1</text>
  <text x="445" y="281" class="subhead">3. Write the equation</text>
  <rect x="445" y="305" width="235" height="54" rx="7" fill="#eff6ff"/>
  <text x="562.5" y="341" class="math" text-anchor="middle">y = 3x + 1</text>
  <text x="445" y="403" class="label">Check the other point:</text>
  <text x="445" y="435" class="math">3(3) + 1 = 10 ✓</text>
</svg>
