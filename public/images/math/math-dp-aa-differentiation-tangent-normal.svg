<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Tangent and normal at a point on a curve</title>
  <desc id="desc">The curve y equals x squared minus three x with the point (2, minus 2) marked, the tangent of gradient one and the normal of gradient minus one drawn through it, beside a panel listing the standard derivatives and the chain, product and quotient rules.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 13px; fill: #111827; }
    .small { font-size: 11px; fill: #64748b; }
  </style>
  <rect width="900" height="480" fill="#f8fafc" rx="12"/>
  <text x="30" y="34" class="heading">Tangents, normals and the rules of differentiation</text>
  <text x="30" y="54" class="small">The tangent has gradient f'(a); the normal is perpendicular to it, so its gradient is −1 / f'(a).</text>
  <rect x="30" y="74" width="420" height="350" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <rect x="31" y="394" width="418" height="29" fill="#ffffff" stroke="none" rx="6"/>
  <line x1="31" y1="394" x2="449" y2="394" stroke="#e2e8f0" stroke-width="1"/>
  <clipPath id="clip1"><rect x="32" y="76" width="416" height="316" rx="5"/></clipPath>
  <line x1="60" y1="220" x2="440" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="190" y1="96" x2="190" y2="396" stroke="#94a3b8" stroke-width="1"/>
  <text x="434.0" y="236.0" class="small" text-anchor="end">x</text>
  <text x="198.0" y="110.0" class="small">y</text>
