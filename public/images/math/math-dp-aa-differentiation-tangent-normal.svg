  <line x1="211.7" y1="373.3" x2="413.2" y2="236.8" stroke="#ea580c" stroke-width="2" clip-path="url(#clip1)"/>
  <line x1="97.0" y1="157.0" x2="400.8" y2="362.8" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" clip-path="url(#clip1)"/>
  <circle cx="314.0" cy="304.0" r="5" fill="#111827"/>
  <text x="324.0" y="310.0" class="math" text-anchor="start">(2, −2)</text>
  <line x1="300" y1="118" x2="330" y2="118" stroke="#ea580c" stroke-width="2"/>>
  <text x="338.0" y="122.0" class="math" text-anchor="start">tangent: gradient 1</text>
  <line x1="300" y1="146" x2="330" y2="146" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4"/>>
  <text x="338.0" y="150.0" class="math" text-anchor="start">normal: gradient −1</text>
  <text x="30.0" y="440.0" class="small" text-anchor="start">The normal meets the tangent at right angles, so the two gradients multiply to −1.</text>
  <text x="30.0" y="462.0" class="small" text-anchor="start">The y-coordinate comes from the original equation; only the gradient comes from the derivative.</text>
  <rect x="470" y="74" width="400" height="350" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="492.0" y="102.0" class="subhead" text-anchor="start">Standard derivatives</text>
  <text x="492.0" y="130.0" class="math" text-anchor="start">xⁿ  →  n xⁿ⁻¹</text>
  <text x="492.0" y="153.0" class="math" text-anchor="start">sin x  →  cos x</text>
  <text x="492.0" y="176.0" class="math" text-anchor="start">cos x  →  −sin x</text>
  <text x="492.0" y="199.0" class="math" text-anchor="start">eˣ  →  eˣ</text>
  <text x="492.0" y="222.0" class="math" text-anchor="start">ln x  →  1/x</text>
  <text x="492.0" y="268.0" class="subhead" text-anchor="start">Rules</text>
  <text x="492.0" y="294.0" class="math" text-anchor="start">chain:      dy/dx = (dy/du)(du/dx)</text>
  <text x="492.0" y="317.0" class="math" text-anchor="start">product:    (uv)' = u'v + uv'</text>
  <text x="492.0" y="340.0" class="math" text-anchor="start">quotient:   (u/v)' = (u'v − uv')/v²</text>
  <text x="492.0" y="386.0" class="math" text-anchor="start">stationary point: f'(x) = 0</text>
  <text x="492.0" y="409.0" class="math" text-anchor="start">f'' &lt; 0 maximum, f'' &gt; 0 minimum</text>
</svg>
