<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">A straight line showing gradient and y-intercept</title>
  <desc id="desc">A coordinate grid with a straight line crossing the y-axis at the y-intercept, with a dashed gradient triangle showing rise over run and the equation y equals mx plus c labelled.</desc>
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- axes -->
  <line x1="80" y1="420" x2="720" y2="420" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="460" x2="160" y2="60" stroke="#334155" stroke-width="2"/>
  <polygon points="720,420 710,415 710,425" fill="#334155"/>
  <polygon points="160,60 155,70 165,70" fill="#334155"/>
  <text x="735" y="425" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#334155">x</text>
  <text x="150" y="45" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#334155">y</text>

  <!-- tick marks -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="240" y1="415" x2="240" y2="425"/>
    <line x1="320" y1="415" x2="320" y2="425"/>
    <line x1="400" y1="415" x2="400" y2="425"/>
    <line x1="480" y1="415" x2="480" y2="425"/>
    <line x1="560" y1="415" x2="560" y2="425"/>
    <line x1="640" y1="415" x2="640" y2="425"/>
    <line x1="155" y1="340" x2="165" y2="340"/>
    <line x1="155" y1="260" x2="165" y2="260"/>
    <line x1="155" y1="180" x2="165" y2="180"/>
    <line x1="155" y1="100" x2="165" y2="100"/>
  </g>

  <!-- line y = 0.5x + 140 in svg coords (x px, y px) -->
  <!-- mapping: svg (160,420) is origin; 1 unit = 80 px x, 40 px y -->
  <!-- line through (160,260) when x=0 y=4, (400,180) when x=3 y=5.5, (640,100) when x=6 y=7 -->
  <line x1="120" y1="300" x2="680" y2="120" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- gradient triangle -->
  <line x1="320" y1="220" x2="480" y2="220" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="480" y1="220" x2="480" y2="160" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="320" y1="220" x2="480" y2="160" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" opacity="0"/>
  <!-- small right-angle marker -->
  <polyline points="480,200 460,200 460,220" fill="none" stroke="#22c55e" stroke-width="2"/>

  <!-- labels with backing rects -->
  <g transform="translate(500, 90)">
    <rect x="-8" y="-22" width="170" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="77" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#1e293b">y = mx + c</text>
  </g>

  <g transform="translate(400, 250)">
    <rect x="-13" y="-22" width="140" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="57" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#14532d">gradient = rise/run</text>
  </g>

  <g transform="translate(95, 250)">
    <rect x="-8" y="-22" width="120" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="52" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">y-intercept c</text>
  </g>

  <!-- leader dots -->
  <circle cx="160" cy="260" r="5" fill="#3b82f6"/>
</svg>
