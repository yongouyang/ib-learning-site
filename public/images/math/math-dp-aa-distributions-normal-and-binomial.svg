<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The normal curve, standardising and the binomial model</title>
  <desc id="desc">A normal curve with its mean marked, the region beyond one standard deviation above the mean shaded, an arrow showing the standardising transformation to z equals one, and a panel giving the binomial probability formula with its mean and variance.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 13px; fill: #111827; }
    .small { font-size: 11px; fill: #64748b; }
  </style>
  <rect width="900" height="520" fill="#f8fafc" rx="12"/>
  <text x="30" y="34" class="heading">The normal curve and the binomial model</text>
  <text x="30" y="54" class="small">Areas under the normal curve are probabilities; the standardising transformation converts any normal variable to N(0, 1).</text>
  <rect x="30" y="74" width="500" height="380" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <rect x="31" y="424" width="498" height="29" fill="#ffffff" stroke="none" rx="6"/>
  <line x1="31" y1="424" x2="529" y2="424" stroke="#e2e8f0" stroke-width="1"/>
  <clipPath id="clip1"><rect x="32" y="76" width="496" height="346" rx="5"/></clipPath>
