  <line x1="280.0" y1="354" x2="280.0" y2="366" stroke="#475569" stroke-width="1.2"/>
  <text x="280.0" y="384.0" class="label" text-anchor="middle">μ</text>
  <line x1="342.0" y1="354" x2="342.0" y2="366" stroke="#475569" stroke-width="1.2"/>
  <text x="342.0" y="384.0" class="label" text-anchor="middle">μ + σ</text>
  <line x1="218.0" y1="354" x2="218.0" y2="366" stroke="#475569" stroke-width="1.2"/>
  <text x="218.0" y="384.0" class="label" text-anchor="middle">μ − σ</text>
  <text x="385.0" y="286.0" class="math" text-anchor="start">P(X &gt; μ + σ) ≈ 0.159</text>
  <text x="340.0" y="130.0" class="math" text-anchor="middle">standardise:  z = (x − μ) / σ</text>
  <text x="340.0" y="156.0" class="math" text-anchor="middle">x = μ + σ  →  z = 1</text>
  <text x="30.0" y="452.0" class="small" text-anchor="start">The curve is symmetric about μ and the total area beneath it is 1, so P(X &lt; μ) = P(X &gt; μ) = 0.5.</text>
  <text x="30.0" y="474.0" class="small" text-anchor="start">About 68% of the area lies within one standard deviation of the mean and about 95% within two.</text>
  <text x="30.0" y="496.0" class="small" text-anchor="start">Use the inverse normal when a probability is given and the value x is wanted: x = μ + zσ.</text>
  <rect x="550" y="74" width="320" height="380" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="572.0" y="102.0" class="subhead" text-anchor="start">The binomial model</text>
  <text x="572.0" y="140.0" class="math" text-anchor="start">X ~ B(n, p)</text>
  <text x="572.0" y="163.0" class="math" text-anchor="start">P(X = r) = ⁿCᵣ pʳ (1 − p)ⁿ⁻ʳ</text>
  <text x="572.0" y="209.0" class="math" text-anchor="start">conditions:</text>
  <text x="572.0" y="232.0" class="math" text-anchor="start">· fixed number of trials n</text>
  <text x="572.0" y="255.0" class="math" text-anchor="start">· two outcomes only</text>
  <text x="572.0" y="278.0" class="math" text-anchor="start">· constant probability p</text>
  <text x="572.0" y="301.0" class="math" text-anchor="start">· trials independent</text>
  <text x="572.0" y="347.0" class="math" text-anchor="start">E(X) = np</text>
  <text x="572.0" y="370.0" class="math" text-anchor="start">Var(X) = np(1 − p)</text>
  <text x="572.0" y="416.0" class="math" text-anchor="start">Example: X ~ B(4, 0.5)</text>
  <text x="572.0" y="439.0" class="math" text-anchor="start">P(X = 2) = 6(0.5)²(0.5)² = 0.375</text>
</svg>
