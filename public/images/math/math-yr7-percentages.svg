<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Percentages as fractions of 100 with bar models</title>
  <desc id="desc">Visual explanation showing the equivalence between percentages, fractions and decimals; a bar model demonstrating 100% as one whole split into hundredths; and examples of percentage increase, decrease, and finding a percentage of an amount.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
    .bar-bg { fill: #e2e8f0; }
    .bar-fill { fill: #2563eb; fill-opacity: 0.7; }
    .bar-fill-g { fill: #16a34a; fill-opacity: 0.7; }
    .bar-fill-r { fill: #dc2626; fill-opacity: 0.7; }
    .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="900" height="500" fill="#f8fafc" rx="12"/>

  <!-- SECTION 1: Equivalence -->
  <text x="30" y="35" class="heading">Percentages, fractions, and decimals</text>
  <text x="30" y="54" class="label">Percent means "out of 100" — these are all the same value:</text>

  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="45" class="math" text-anchor="middle" fill="#2563eb" font-size="28">50%</text>
    <text x="50" y="80" class="label" text-anchor="middle">Percentage</text>
  </g>

  <text x="145" y="130" font-size="24" fill="#6b7280" text-anchor="middle">=</text>

  <g transform="translate(165, 75)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="38" class="math" text-anchor="middle" fill="#16a34a">1</text>
    <line x1="15" y1="48" x2="85" y2="48" stroke="#16a34a" stroke-width="1.5"/>
    <text x="50" y="62" class="math" text-anchor="middle" fill="#16a34a">2</text>
    <text x="50" y="88" class="label" text-anchor="middle">Fraction</text>
  </g>

  <text x="280" y="130" font-size="24" fill="#6b7280" text-anchor="middle">=</text>

  <g transform="translate(300, 75)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="48" class="math" text-anchor="middle" fill="#d97706" font-size="28">0.5</text>
    <text x="50" y="88" class="label" text-anchor="middle">Decimal</text>
  </g>

  <text x="415" y="130" font-size="24" fill="#6b7280" text-anchor="middle">=</text>

  <g transform="translate(435, 75)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="10" y="10" width="80" height="80" rx="4" class="bar-bg"/>
    <rect x="10" y="10" width="40" height="80" rx="4" class="bar-fill"/>
    <text x="50" y="105" class="label" text-anchor="middle">Out of 100</text>
  </g>

  <!-- Conversion formulas -->
  <g transform="translate(570, 75)">
    <rect x="0" y="0" width="300" height="100" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="150" y="22" class="subhead" text-anchor="middle">How to convert</text>
    <text x="15" y="48" class="label">% to decimal: ÷ 100</text>
    <text x="15" y="68" class="label">Decimal to %: × 100</text>
    <text x="15" y="88" class="label">% to fraction: write as /100, then simplify</text>
  </g>

  <!-- SECTION 2: Finding a percentage -->
  <text x="30" y="215" class="heading">Finding a percentage of an amount</text>

  <g transform="translate(30, 242)">
    <!-- 10% bar -->
    <text x="0" y="0" class="subhead">Finding 10% of 80</text>
    <rect x="0" y="12" width="240" height="24" rx="4" class="bar-bg"/>
    <rect x="0" y="12" width="24" height="24" rx="4" class="bar-fill"/>
    <text x="250" y="30" class="math">= 8</text>
    <text x="120" y="56" class="label" text-anchor="middle">10% is one-tenth → 80 ÷ 10</text>
  </g>

  <g transform="translate(30, 318)">
    <!-- 30% bar -->
    <text x="0" y="0" class="subhead">Finding 30% of 80</text>
    <rect x="0" y="12" width="240" height="24" rx="4" class="bar-bg"/>
    <rect x="0" y="12" width="72" height="24" rx="4" class="bar-fill"/>
    <text x="250" y="30" class="math">= 24</text>
    <text x="120" y="56" class="label" text-anchor="middle">30% = 3 × 10% → 3 × 8 = 24</text>
  </g>

  <!-- Multiplier method -->
  <g transform="translate(370, 235)">
    <rect x="0" y="0" width="240" height="140" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="120" y="22" class="subhead" text-anchor="middle">Multiplier method</text>
    <text x="15" y="48" class="label">To find p% of x:</text>
    <text x="15" y="70" class="math" fill="#2563eb">multiplier = p ÷ 100</text>
    <text x="15" y="95" class="label">Then: multiplier × original = result</text>
    <text x="15" y="120" class="label" fill="#6b7280">Example: 30% of 80</text>
    <text x="15" y="134" class="label" fill="#2563eb">0.30 × 80 = 24</text>
  </g>

  <!-- SECTION 3: Percentage change -->
  <text x="30" y="405" class="heading">Percentage increase and decrease</text>

  <g transform="translate(30, 433)">
    <!-- Increase -->
    <text x="0" y="0" class="subhead">Increase £200 by 15%</text>
    <rect x="0" y="12" width="200" height="24" rx="4" class="bar-bg"/>
    <rect x="0" y="12" width="200" height="24" rx="4" class="bar-fill"/>
    <text x="100" y="29" class="label" text-anchor="middle" fill="#fff">Original: £200 (100%)</text>
    <rect x="200" y="12" width="30" height="24" rx="4" class="bar-fill-g"/>
    <text x="240" y="20" class="label" fill="#16a34a">+15%</text>
    <text x="260" y="29" class="math">= £230</text>
    <text x="0" y="56" class="label" fill="#2563eb">Method: 1.15 × 200 = 230</text>
  </g>

  <g transform="translate(430, 433)">
    <!-- Decrease -->
    <text x="0" y="0" class="subhead">Decrease £80 by 25%</text>
    <rect x="0" y="12" width="160" height="24" rx="4" class="bar-bg"/>
    <rect x="0" y="12" width="120" height="24" rx="4" class="bar-fill"/>
    <text x="60" y="29" class="label" text-anchor="middle" fill="#fff">£80</text>
    <rect x="120" y="12" width="40" height="24" rx="4" class="bar-fill-r"/>
    <text x="170" y="20" class="label" fill="#dc2626">−25%</text>
    <text x="210" y="29" class="math">= £60</text>
    <text x="0" y="56" class="label" fill="#dc2626">Method: 0.75 × 80 = 60</text>
  </g>
</svg>
