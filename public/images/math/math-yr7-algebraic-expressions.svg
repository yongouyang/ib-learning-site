<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Collecting like terms and expanding brackets</title>
  <desc id="desc">A visual explanation showing like terms grouped together, a bracket being multiplied by a single term, and the simplified result of an algebraic expression.</desc>

  <rect width="800" height="500" fill="#f8fafc" rx="12"/>

  <!-- Like-terms area -->
  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e293b">Collecting like terms</text>

  <rect x="70" y="75" width="90" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="107" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e40af" text-anchor="middle">3x</text>

  <rect x="180" y="75" width="90" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="107" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e40af" text-anchor="middle">+2x</text>

  <rect x="290" y="75" width="90" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="335" y="107" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#166534" text-anchor="middle">5y</text>

  <rect x="400" y="75" width="90" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="107" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#166534" text-anchor="middle">-y</text>

  <!-- Grouping arrows -->
  <path d="M115 135 L115 165 L225 165 L225 135" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="185" font-family="system-ui, sans-serif" font-size="16" fill="#1e40af" text-anchor="middle">same variable part: x</text>
  <path d="M115 190 L115 200 L225 200 L225 190" fill="none" stroke="#2563eb" stroke-width="2"/>

  <path d="M335 135 L335 165 L445 165 L445 135" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="185" font-family="system-ui, sans-serif" font-size="16" fill="#166534" text-anchor="middle">same variable part: y</text>
  <path d="M335 190 L335 200 L445 200 L445 190" fill="none" stroke="#16a34a" stroke-width="2"/>

  <text x="90" y="245" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e293b">3x + 2x = 5x</text>
  <text x="310" y="245" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e293b">5y - y = 4y</text>

  <!-- Expanding brackets area -->
  <text x="60" y="310" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1e293b">Expanding a bracket</text>

  <text x="70" y="360" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#4f46e5">3</text>
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1e293b">(</text>
  <text x="120" y="360" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1e293b">x + 4</text>
  <text x="225" y="360" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1e293b">)</text>

  <!-- Arrows showing distribution -->
  <path d="M88 375 C88 400 135 400 135 420" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <text x="75" y="445" font-family="system-ui, sans-serif" font-size="16" fill="#4f46e5">3 times x</text>

  <path d="M88 375 C88 420 185 420 185 440" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <text x="165" y="465" font-family="system-ui, sans-serif" font-size="16" fill="#4f46e5">3 times 4</text>

  <!-- Result of expansion -->
  <text x="70" y="430" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1e293b" opacity="0">spacer</text>
  <text x="90" y="460" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#0f172a">= 3x + 12</text>

  <!-- Summary box -->
  <rect x="520" y="300" width="250" height="160" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="545" y="335" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#334155">Key idea</text>
  <text x="545" y="365" font-family="system-ui, sans-serif" font-size="15" fill="#475569">Multiply every term</text>
  <text x="545" y="388" font-family="system-ui, sans-serif" font-size="15" fill="#475569">inside the bracket by</text>
  <text x="545" y="411" font-family="system-ui, sans-serif" font-size="15" fill="#475657">the term outside.</text>
</svg>
