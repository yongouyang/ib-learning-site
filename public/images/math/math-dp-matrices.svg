<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Matrices: operations, determinants and inverses</title>
  <desc id="desc">Matrix notation with rows and columns labelled; addition, scalar multiplication and matrix multiplication with dimensions check; the 2×2 determinant and inverse; and solving systems of equations using matrices.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="430" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Matrices</text>

  <!-- Notation -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="150" y="20" class="subhead" text-anchor="middle">aᵢⱼ = row i, column j</text>
    <text x="150" y="44" class="label" text-anchor="middle">[a b ; c d] has 2 rows, 2 columns</text>
    <text x="150" y="64" class="label" text-anchor="middle">Order: m×n means m rows, n columns</text>
  </g>

  <!-- Operations -->
  <g transform="translate(350, 55)">
    <rect x="0" y="0" width="520" height="155" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="260" y="20" class="subhead" text-anchor="middle">Matrix operations</text>
    <g transform="translate(15, 38)">
      <text x="0" y="0" class="math" fill="#2563eb">Addition: add corresponding entries (same order required)</text>
      <text x="0" y="22" class="label">[a b;c d] + [e f;g h] = [a+e b+f; c+g d+h]</text>
      <text x="0" y="48" class="math" fill="#16a34a">Scalar multiplication: k[a b;c d] = [ka kb;kc kd]</text>
      <text x="0" y="74" class="math" fill="#dc2626">Matrix multiplication: (m×n) × (n×p) = m×p</text>
      <text x="0" y="96" class="label">Row i × Column j: [a b;c d][e f;g h] = [ae+bg af+bh; ce+dg cf+dh]</text>
      <text x="0" y="120" class="label" fill="#dc2626">⚠️ AB ≠ BA in general (not commutative)</text>
    </g>
  </g>

  <!-- Determinant and inverse -->
  <g transform="translate(30, 235)">
    <rect x="0" y="0" width="430" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="215" y="20" class="subhead" text-anchor="middle">2×2 Determinant and inverse</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#16a34a">det(A) = |a b;c d| = ad − bc</text>
      <text x="0" y="24" class="label">If det=0: singular (no inverse). If det≠0: nonsingular.</text>
      <text x="0" y="52" class="math" fill="#d97706">A⁻¹ = 1/det(A) [d −b; −c a]</text>
      <text x="0" y="76" class="label">AA⁻¹ = I (identity matrix). Check with calculator on exams!</text>
    </g>
  </g>

  <!-- Solving -->
  <g transform="translate(480, 235)">
    <rect x="0" y="0" width="390" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="195" y="20" class="subhead" text-anchor="middle">Solving AX = B</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="label">Represent: AX = B where X = [x;y]</text>
      <text x="0" y="24" class="math" fill="#d97706">X = A⁻¹B (if det≠0)</text>
      <text x="0" y="50" class="label">For 3×3: use GDC RREF function.</text>
      <text x="0" y="70" class="label">Solutions: unique (det≠0), none or infinite (det=0).</text>
    </g>
  </g>

  <!-- Identity -->
  <g transform="translate(30, 365)">
    <rect x="0" y="0" width="840" height="35" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="420" y="23" class="math" text-anchor="middle" fill="#7c3aed">I = [1 0;0 1] (identity) | AI = A = IA | Eigenvalue λ: det(A−λI)=0 | Eigenvector: (A−λI)v = 0</text>
  </g>
</svg>
