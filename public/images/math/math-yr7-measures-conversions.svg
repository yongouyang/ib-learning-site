<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Units of measurement and conversions</title>
  <desc id="desc">Metric unit prefixes from kilo to milli with conversion factors; length, mass and capacity reference charts; and visual examples of converting between units using multiplication and division by powers of 10.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Units, measures and conversions</text>

  <!-- Metric prefixes -->
  <g transform="translate(30, 55)">
    <text x="0" y="0" class="subhead">Metric prefixes</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="90" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="45" y="21" class="math" text-anchor="middle" fill="#166534">kilo (k)</text>
      <text x="100" y="21" class="math">→ ×1000 →</text>
      <rect x="180" y="0" width="90" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="225" y="21" class="math" text-anchor="middle" fill="#1e40af">base unit</text>
      <text x="280" y="21" class="math">→ ÷100 →</text>
      <rect x="340" y="0" width="100" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="390" y="21" class="math" text-anchor="middle" fill="#92400e">centi (c)</text>
      <text x="450" y="21" class="math">→ ÷10 →</text>
      <rect x="500" y="0" width="100" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="550" y="21" class="math" text-anchor="middle" fill="#991b1b">milli (m)</text>
    </g>
    <text x="0" y="68" class="label">×1000 for each step left. ÷1000 for each step right.</text>
  </g>

  <!-- Reference tables -->
  <g transform="translate(30, 130)">
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="135" y="20" class="subhead" text-anchor="middle">Length</text>
    <g transform="translate(15, 42)">
      <text x="0" y="0" class="math">1 km = 1000 m</text>
      <text x="0" y="20" class="math">1 m = 100 cm</text>
      <text x="0" y="40" class="math">1 cm = 10 mm</text>
      <text x="0" y="60" class="math" fill="#2563eb">1 mile ≈ 1.6 km</text>
      <text x="0" y="80" class="math" fill="#2563eb">1 foot ≈ 30 cm</text>
      <text x="0" y="100" class="math" fill="#2563eb">1 inch ≈ 2.5 cm</text>
    </g>
  </g>

  <g transform="translate(315, 130)">
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="135" y="20" class="subhead" text-anchor="middle">Mass</text>
    <g transform="translate(15, 42)">
      <text x="0" y="0" class="math">1 tonne = 1000 kg</text>
      <text x="0" y="20" class="math">1 kg = 1000 g</text>
      <text x="0" y="40" class="math">1 g = 1000 mg</text>
      <text x="0" y="60" class="math" fill="#d97706">1 kg ≈ 2.2 pounds</text>
      <text x="0" y="80" class="math" fill="#d97706">1 pound ≈ 450 g</text>
    </g>
  </g>

  <g transform="translate(600, 130)">
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="135" y="20" class="subhead" text-anchor="middle">Capacity</text>
    <g transform="translate(15, 42)">
      <text x="0" y="0" class="math">1 L = 1000 mL</text>
      <text x="0" y="20" class="math">1 mL = 1 cm³</text>
      <text x="0" y="40" class="math">1 m³ = 1000 L</text>
      <text x="0" y="60" class="math" fill="#16a34a">1 pint ≈ 568 mL</text>
      <text x="0" y="80" class="math" fill="#16a34a">1 gallon ≈ 4.5 L</text>
    </g>
  </g>

  <!-- Conversion methods -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="420" height="75" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="210" y="20" class="subhead" text-anchor="middle">Converting larger to smaller: multiply</text>
    <text x="15" y="46" class="math" fill="#2563eb">5.2 km → m: 5.2 × 1000 = 5200 m</text>
    <text x="15" y="60" class="math" fill="#2563eb">3 L → mL: 3 × 1000 = 3000 mL</text>
  </g>
  <g transform="translate(460, 300)">
    <rect x="0" y="0" width="410" height="75" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="205" y="20" class="subhead" text-anchor="middle">Converting smaller to larger: divide</text>
    <text x="15" y="46" class="math" fill="#dc2626">750 g → kg: 750 ÷ 1000 = 0.75 kg</text>
    <text x="15" y="60" class="math" fill="#dc2626">45 cm → m: 45 ÷ 100 = 0.45 m</text>
  </g>

  <!-- Time -->
  <g transform="translate(30, 395)">
    <rect x="0" y="0" width="840" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="420" y="24" class="math" text-anchor="middle" fill="#7c3aed">Time: 1 min = 60 s | 1 h = 60 min = 3600 s | 1 day = 24 h | 1 year = 365 days (366 leap)</text>
  </g>
</svg>
