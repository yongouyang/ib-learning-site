<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">The parts of a quadratic expression</title>
  <desc id="desc">The general form a x squared plus b x plus c with each part named, the shape when a is positive and negative, and a note that a cannot be zero.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .small { font-size: 11px; fill: #64748b; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">The parts of a quadratic expression</text>
  <rect x="30" y="55" width="420" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="240.0" y="77" class="subhead" text-anchor="middle">Naming the parts</text>
  <text x="240" y="140" class="math" text-anchor="middle" font-size="26">a x² + b x + c</text>
  <text x="150" y="180" class="label" text-anchor="middle">quadratic term</text>
  <text x="240" y="180" class="label" text-anchor="middle">linear term</text>
  <text x="320" y="180" class="label" text-anchor="middle">constant</text>
  <line x1="150" y1="190" x2="150" y2="130" stroke="#94a3b8" stroke-width="1"/>
  <line x1="240" y1="190" x2="240" y2="130" stroke="#94a3b8" stroke-width="1"/>
  <line x1="320" y1="190" x2="320" y2="130" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="246" class="label">a is the coefficient of x²,</text>
  <text x="70" y="270" class="label">b the coefficient of x, and c the</text>
  <text x="70" y="294" class="label">constant term.</text>
  <text x="70" y="318" class="label"></text>
  <text x="70" y="342" class="label">If a = 0 the x² term vanishes and it</text>
  <text x="70" y="366" class="label">is no longer quadratic.</text>
  <text x="70" y="390" class="label"></text>
  <text x="70" y="414" class="label">The degree is the highest power,</text>
  <text x="70" y="438" class="label">which is 2.</text>
  <rect x="470" y="55" width="400" height="355" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="670.0" y="77" class="subhead" text-anchor="middle">The shape depends on a</text>
  <line x1="510" y1="210" x2="820" y2="210" stroke="#cbd5e1" stroke-width="1"/>
