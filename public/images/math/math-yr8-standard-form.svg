<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Standard form notation</title>
  <desc id="desc">Diagram showing a number written in standard form as 3.4 times 10 to the power 5, with the coefficient 3.4, the base 10, and the exponent 5 labelled.</desc>
  <rect width="800" height="500" fill="#f8fafc"/>
  <rect x="50" y="50" width="700" height="400" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Main expression -->
  <g transform="translate(400, 220)">
    <text x="-230" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="600" fill="#1e293b" text-anchor="middle">3.4</text>
    <text x="-120" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="600" fill="#1e293b" text-anchor="middle">×</text>
    <text x="0" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="96" font-weight="700" fill="#2563eb" text-anchor="middle">10</text>
    <text x="60" y="-30" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="700" fill="#2563eb" text-anchor="middle">5</text>
  </g>
  
  <!-- Labels -->
  <line x1="230" y1="280" x2="230" y2="330" stroke="#6b7280" stroke-width="2"/>
  <rect x="160" y="335" width="140" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="230" y="365" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" fill="#1e40af" text-anchor="middle">Coefficient</text>
  
  <line x1="410" y1="280" x2="410" y2="330" stroke="#6b7280" stroke-width="2"/>
  <rect x="360" y="335" width="100" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="410" y="365" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" fill="#1e40af" text-anchor="middle">Base</text>
  
  <line x1="470" y1="150" x2="510" y2="120" stroke="#6b7280" stroke-width="2"/>
  <rect x="520" y="95" width="120" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="580" y="125" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" fill="#1e40af" text-anchor="middle">Exponent</text>
  
  <!-- Ordinary form example -->
  <rect x="180" y="410" width="440" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="444" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="middle">3.4 × 10^5 = 340 000</text>
</svg>