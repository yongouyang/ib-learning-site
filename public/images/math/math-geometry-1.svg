<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Geometry: angle rules, triangles and circle theorems</title>
  <desc id="desc">Comprehensive visual reference for geometry including angle rules on lines and around points; triangle types and their properties; circle parts and basic circle theorems; and polygon interior/exterior angle formulas.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="500" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Geometry: angle rules and shapes</text>

  <!-- Angle rules quick ref -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="840" height="85" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="20" class="subhead" text-anchor="middle">Quick angle rules</text>
    <g transform="translate(15, 38)">
      <text x="0" y="0" class="math">Straight line: 180°</text>
      <text x="200" y="0" class="math">Around a point: 360°</text>
      <text x="400" y="0" class="math">Vertically opposite: equal</text>
      <text x="650" y="0" class="math">Triangle: 180°</text>
      <text x="0" y="22" class="math">Quadrilateral: 360°</text>
      <text x="200" y="22" class="math">Pentagon: 540°</text>
      <text x="400" y="22" class="math">Hexagon: 720°</text>
      <text x="650" y="22" class="math">n-gon: (n-2)×180°</text>
    </g>
  </g>

  <!-- Triangles -->
  <text x="30" y="175" class="subhead">Types of triangles</text>
  <g transform="translate(30, 195)">
    <polygon points="0,50 60,0 120,50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" fill-opacity="0.4"/>
    <text x="60" y="70" class="label" text-anchor="middle">Equilateral</text>
    <text x="60" y="84" class="label" text-anchor="middle" font-size="10">3 equal sides</text>
  </g>
  <g transform="translate(170, 195)">
    <polygon points="0,50 60,0 120,50" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" fill-opacity="0.4"/>
    <line x1="20" y1="42" x2="40" y2="22" stroke="#16a34a" stroke-width="1"/>
    <line x1="100" y1="42" x2="80" y2="22" stroke="#16a34a" stroke-width="1"/>
    <text x="60" y="70" class="label" text-anchor="middle">Isosceles</text>
    <text x="60" y="84" class="label" text-anchor="middle" font-size="10">2 equal sides</text>
  </g>
  <g transform="translate(310, 195)">
    <polygon points="0,50 70,0 130,50" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" fill-opacity="0.4"/>
    <text x="65" y="70" class="label" text-anchor="middle">Scalene</text>
    <text x="65" y="84" class="label" text-anchor="middle" font-size="10">No equal sides</text>
  </g>
  <g transform="translate(460, 195)">
    <polygon points="0,50 60,0 60,50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" fill-opacity="0.4"/>
    <rect x="52" y="32" width="10" height="10" fill="none" stroke="#d97706" stroke-width="1"/>
    <text x="30" y="70" class="label" text-anchor="middle">Right-angled</text>
    <text x="30" y="84" class="label" text-anchor="middle" font-size="10">One 90°</text>
  </g>
  <g transform="translate(590, 195)">
    <polygon points="0,50 60,10 120,50" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" fill-opacity="0.4"/>
    <text x="60" y="70" class="label" text-anchor="middle">Obtuse</text>
    <text x="60" y="84" class="label" text-anchor="middle" font-size="10">One > 90°</text>
  </g>

  <!-- Circle parts -->
  <text x="30" y="310" class="heading">Circle geometry</text>
  <g transform="translate(250, 315)">
    <circle cx="150" cy="65" r="55" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- centre point -->
    <circle cx="150" cy="65" r="3" fill="#dc2626"/>
    <!-- radius -->
    <line x1="150" y1="65" x2="150" y2="10" stroke="#dc2626" stroke-width="1.5"/>
    <!-- diameter -->
    <line x1="95" y1="65" x2="205" y2="65" stroke="#16a34a" stroke-width="2"/>
    <!-- arc indicator (just outside the right edge) -->
    <path d="M 200 35 A 55 55 0 0 1 200 95" fill="none" stroke="#d97706" stroke-width="2"/>
    <!-- chord (both endpoints on the circle) -->
    <line x1="95" y1="65" x2="192" y2="100" stroke="#7c3aed" stroke-width="1.5"/>

    <!-- Labels outside the circle, each with a coloured leader line -->
    <line x1="147" y1="62" x2="91" y2="27" stroke="#dc2626" stroke-width="1.5"/>
    <text x="88" y="25" class="label" font-size="11" fill="#dc2626" text-anchor="end">centre</text>

    <line x1="150" y1="30" x2="182" y2="17" stroke="#dc2626" stroke-width="1.5"/>
    <text x="185" y="18" class="label" font-size="11" fill="#dc2626">radius</text>

    <line x1="95" y1="65" x2="87" y2="67" stroke="#16a34a" stroke-width="1.5"/>
    <text x="84" y="70" class="label" font-size="11" fill="#16a34a" text-anchor="end">diameter</text>

    <line x1="208" y1="63" x2="222" y2="61" stroke="#d97706" stroke-width="1.5"/>
    <text x="225" y="64" class="label" font-size="11" fill="#d97706">arc</text>

    <line x1="192" y1="100" x2="222" y2="104" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="226" y="108" class="label" font-size="11" fill="#7c3aed">chord</text>
  </g>

  <!-- Polygon formula -->
  <g transform="translate(30, 455)">
    <rect x="0" y="0" width="840" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="420" y="19" class="math" text-anchor="middle" fill="#1e40af">Interior angle sum = (n−2)×180°  |  Exterior angle sum (any polygon) = 360°  |  Interior + Exterior = 180°</text>
  </g>
</svg>
