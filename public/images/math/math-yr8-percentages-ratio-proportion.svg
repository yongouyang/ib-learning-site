<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">Percentages, ratio and proportion summary</title>
  <desc id="desc">A summary diagram showing compound interest growth over years, a direct proportion line through the origin, an inverse proportion curve, and a unit-price comparison for best buys.</desc>
  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #111827; }
    .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #1f2937; }
    .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; fill: #374151; }
    .axis { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; fill: #6b7280; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; }
    .bar1 { fill: #dbeafe; }
    .bar2 { fill: #93c5fd; }
    .bar3 { fill: #3b82f6; }
    .axis-line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .direct-line { stroke: #16a34a; stroke-width: 3; fill: none; }
    .inverse-curve { stroke: #ea580c; stroke-width: 3; fill: none; }
    .tag { stroke: #9333ea; stroke-width: 2; }
    .tag-fill { fill: #f3e8ff; }
    .divider { stroke: #d1d5db; stroke-width: 1; }
  </style>

  <!-- Main title -->
  <text x="420" y="32" class="title">Percentages, Ratio &amp; Proportion</text>

  <!-- Compound interest panel -->
  <g transform="translate(40, 64)">
    <rect x="0" y="0" width="370" height="190" rx="12" class="panel"/>
    <text x="185" y="28" class="panel-title">Compound Interest Growth</text>

    <!-- Axes -->
    <line x1="50" y1="150" x2="330" y2="150" class="axis-line"/>
    <line x1="50" y1="150" x2="50" y2="60" class="axis-line"/>

    <!-- Bars -->
    <rect x="70" y="102" width="50" height="48" rx="4" class="bar1"/>
    <rect x="150" y="78" width="50" height="72" rx="4" class="bar2"/>
    <rect x="230" y="54" width="50" height="96" rx="4" class="bar3"/>

    <!-- Bar labels -->
    <text x="95" y="160" class="axis">Year 0</text>
    <text x="175" y="160" class="axis">Year 1</text>
    <text x="255" y="160" class="axis">Year 2</text>
    <text x="95" y="92" class="label">£500</text>
    <text x="175" y="68" class="label">£520</text>
    <text x="255" y="70" class="label" fill="#ffffff">£541</text>
  </g>

  <!-- Direct and inverse proportion panel -->
  <g transform="translate(430, 64)">
    <rect x="0" y="0" width="370" height="190" rx="12" class="panel"/>
    <text x="185" y="28" class="panel-title">Direct &amp; Inverse Proportion</text>

    <!-- Axes -->
    <line x1="50" y1="150" x2="330" y2="150" class="axis-line"/>
    <line x1="50" y1="150" x2="50" y2="60" class="axis-line"/>
    <text x="185" y="170" class="axis">x</text>
    <text x="35" y="100" class="axis">y</text>

    <!-- Direct line -->
    <line x1="50" y1="150" x2="300" y2="70" class="direct-line"/>
    <text x="260" y="60" class="label" fill="#16a34a">Direct: y = kx</text>

    <!-- Inverse curve -->
    <path d="M 80,80 C 120,110 180,135 300,145" class="inverse-curve"/>
    <text x="270" y="128" class="label" fill="#ea580c">Inverse: y = k/x</text>
  </g>

  <!-- Reverse percentages panel -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="370" height="190" rx="12" class="panel"/>
    <text x="185" y="28" class="panel-title">Reverse Percentage</text>

    <!-- Tag -->
    <polygon points="50,80 220,80 250,110 220,140 50,140" class="tag-fill tag"/>
    <text x="140" y="118" class="label">Sale price: £66</text>

    <!-- Arrow and original -->
    <line x1="260" y1="110" x2="310" y2="110" class="axis-line" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
      </marker>
    </defs>
    <text x="330" y="105" class="label">Original</text>
    <text x="330" y="122" class="label">£60</text>
    <text x="185" y="168" class="axis">Divide by the multiplier (1.10)</text>
  </g>

  <!-- Best buy panel -->
  <g transform="translate(430, 270)">
    <rect x="0" y="0" width="370" height="190" rx="12" class="panel"/>
    <text x="185" y="28" class="panel-title">Best Buy Comparison</text>

    <!-- Product A -->
    <rect x="45" y="55" width="130" height="50" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="110" y="78" class="label">500 g</text>
    <text x="110" y="94" class="label">£1.80</text>

    <!-- Product B -->
    <rect x="195" y="55" width="130" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="260" y="78" class="label">750 g</text>
    <text x="260" y="94" class="label">£2.55</text>

    <!-- Unit prices -->
    <text x="110" y="142" class="axis">£0.0036 per g</text>
    <text x="260" y="142" class="axis">£0.0034 per g</text>

    <!-- Winner badge -->
    <rect x="205" y="155" width="110" height="26" rx="6" fill="#22c55e"/>
    <text x="260" y="172" class="label" fill="#ffffff">Better value</text>
  </g>
</svg>