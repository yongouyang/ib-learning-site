<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Poisson distribution: models and properties</title>
  <desc id="desc">The Poisson probability formula P(X=k)=λᵏe^(−λ)/k!; key properties including mean=variance=λ; conditions for a Poisson model; and the additive property for sums of independent Poisson variables.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .heading { font-size: 20px; font-weight: 600; fill: #1e293b; }
    .subhead { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 13px; fill: #374151; }
    .math { font-size: 14px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="900" height="400" fill="#f8fafc" rx="12"/>
  <text x="30" y="35" class="heading">Poisson distribution</text>

  <!-- Formula -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="840" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">Pois(λ): X ~ Po(λ)</text>
    <text x="420" y="48" class="math" text-anchor="middle" fill="#2563eb" font-size="16">P(X=k) = λᵏ e^(−λ) / k!    for k = 0, 1, 2, ...</text>
  </g>

  <!-- Conditions -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="430" height="145" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="215" y="20" class="subhead" text-anchor="middle">When to use Poisson</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="label">1. Events occur independently and randomly</text>
      <text x="0" y="22" class="label">2. Events occur at a constant average rate λ</text>
      <text x="0" y="44" class="label">3. Events occur one at a time (no simultaneous)</text>
      <text x="0" y="66" class="label">4. Rate is proportional to interval length</text>
      <text x="0" y="90" class="label">Examples: calls to a call centre, defects per metre</text>
    </g>
  </g>

  <!-- Properties -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="390" height="145" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="195" y="20" class="subhead" text-anchor="middle">Key properties</text>
    <g transform="translate(15, 40)">
      <text x="0" y="0" class="math" fill="#d97706">E(X) = λ</text>
      <text x="0" y="22" class="math" fill="#d97706">Var(X) = λ</text>
      <text x="0" y="48" class="label">Mean = Variance = λ (unique to Poisson!)</text>
      <text x="0" y="74" class="math" fill="#2563eb">Additive: X~Po(λ₁), Y~Po(λ₂) → X+Y ~ Po(λ₁+λ₂)</text>
      <text x="0" y="100" class="label">For large λ (λ&gt;10), Poisson ≈ Normal(λ, √λ).</text>
    </g>
  </g>

  <!-- Scaling and approximation -->
  <g transform="translate(30, 302)">
    <rect x="0" y="0" width="840" height="65" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="22" class="subhead" text-anchor="middle">Scaling and approximation</text>
    <text x="420" y="48" class="label" text-anchor="middle">Rate scaling: if λ per hour, 2 hours → Po(2λ). | Poisson as limit of Binomial: Bin(n,p) ≈ Po(np) if n large, p small.</text>
  </g>
</svg>
