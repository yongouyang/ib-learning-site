<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Metal Recycling and Sustainability</title>
  <desc id="desc">A recycling loop for metals showing collection, sorting, melting, and reuse, with an energy comparison showing recycled aluminium uses far less energy than extraction from ore.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#f9fafb" rx="12"/>
  <text x="380" y="38" text-anchor="middle" class="title">Metal Recycling and Sustainability</text>

  <!-- Recycling loop -->
  <g transform="translate(60, 75)">
    <!-- Cycle arrows -->
    <path d="M120 60 Q220 10 320 60" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-head)"/>
    <path d="M340 90 Q380 190 320 250" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-head)"/>
    <path d="M180 270 Q80 220 80 120" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-head)"/>

    <!-- Step 1: Collect -->
    <g transform="translate(80, 30)">
      <rect x="0" y="0" width="80" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="40" y="24" text-anchor="middle" class="label" fill="#166534">Collect</text>
      <text x="40" y="42" text-anchor="middle" class="sublabel">scrap metal</text>
    </g>

    <!-- Step 2: Sort -->
    <g transform="translate(260, 30)">
      <rect x="0" y="0" width="80" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="40" y="24" text-anchor="middle" class="label" fill="#166534">Sort</text>
      <text x="40" y="42" text-anchor="middle" class="sublabel">by type</text>
    </g>

    <!-- Step 3: Melt -->
    <g transform="translate(300, 170)">
      <rect x="0" y="0" width="80" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="40" y="24" text-anchor="middle" class="label" fill="#166534">Melt</text>
      <text x="40" y="42" text-anchor="middle" class="sublabel">and refine</text>
    </g>

    <!-- Step 4: Reuse -->
    <g transform="translate(120, 200)">
      <rect x="0" y="0" width="80" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="40" y="24" text-anchor="middle" class="label" fill="#166534">Reuse</text>
      <text x="40" y="42" text-anchor="middle" class="sublabel">new products</text>
    </g>
  </g>

  <!-- Energy comparison -->
  <g transform="translate(460, 90)">
    <rect x="0" y="0" width="240" height="220" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" class="label">Energy: aluminium</text>

    <!-- Primary extraction bar -->
    <rect x="30" y="70" width="180" height="35" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    <text x="120" y="93" text-anchor="middle" class="label" fill="#991b1b">Primary extraction</text>
    <text x="120" y="108" text-anchor="middle" class="sublabel" fill="#991b1b">100% energy</text>

    <!-- Recycling bar -->
    <rect x="30" y="135" width="18" height="35" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="115" y="158" text-anchor="middle" class="label" fill="#166534">Recycling</text>
    <text x="115" y="173" text-anchor="middle" class="sublabel" fill="#166534">~5% energy</text>
  </g>

  <!-- Benefits list -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="640" height="130" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="320" y="25" text-anchor="middle" class="label">Why recycle metals?</text>

    <g transform="translate(40, 50)">
      <circle cx="10" cy="10" r="10" fill="#f97316" opacity="0.2"/>
      <text x="8" y="14" class="label" fill="#c2410c">1</text>
      <text x="28" y="14" class="sublabel">Saves energy (up to 95% for Al)</text>
    </g>

    <g transform="translate(40, 85)">
      <circle cx="10" cy="10" r="10" fill="#f97316" opacity="0.2"/>
      <text x="8" y="14" class="label" fill="#c2410c">2</text>
      <text x="28" y="14" class="sublabel">Conserves finite metal ores</text>
    </g>

    <g transform="translate(340, 50)">
      <circle cx="10" cy="10" r="10" fill="#f97316" opacity="0.2"/>
      <text x="8" y="14" class="label" fill="#c2410c">3</text>
      <text x="28" y="14" class="sublabel">Reduces landfill and mining damage</text>
    </g>

    <g transform="translate(340, 85)">
      <circle cx="10" cy="10" r="10" fill="#f97316" opacity="0.2"/>
      <text x="8" y="14" class="label" fill="#c2410c">4</text>
      <text x="28" y="14" class="sublabel">Lower overall environmental impact (LCA)</text>
    </g>
  </g>
</svg>