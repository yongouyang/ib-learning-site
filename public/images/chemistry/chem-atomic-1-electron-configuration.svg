<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Electron Configuration and Shells</title>
  <desc id="desc">Bohr-model diagram of a sodium atom showing electron shells filled 2, 8, 1, with labels linking the occupied shells to period and the outer-shell electrons to group.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .shell { fill: none; stroke-width: 2; }
      .nucleus { fill: #f97316; }
      .electron { fill: #3b82f6; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Electron Configuration and Shells</text>

  <!-- Sodium atom -->
  <g transform="translate(300, 270)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="28" class="nucleus"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">Na</text>
    <text x="0" y="20" text-anchor="middle" class="sublabel" fill="white">11+</text>

    <!-- Shells -->
    <circle cx="0" cy="0" r="65" class="shell" stroke="#93c5fd"/>
    <circle cx="0" cy="0" r="120" class="shell" stroke="#60a5fa"/>
    <circle cx="0" cy="0" r="175" class="shell" stroke="#2563eb"/>

    <!-- Electrons -->
    <g class="electron">
      <!-- 1st shell: 2 electrons -->
      <circle cx="65" cy="0" r="8"/>
      <circle cx="-65" cy="0" r="8"/>

      <!-- 2nd shell: 8 electrons -->
      <circle cx="120" cy="0" r="8"/>
      <circle cx="-120" cy="0" r="8"/>
      <circle cx="0" cy="120" r="8"/>
      <circle cx="0" cy="-120" r="8"/>
      <circle cx="85" cy="85" r="8"/>
      <circle cx="-85" cy="-85" r="8"/>
      <circle cx="85" cy="-85" r="8"/>
      <circle cx="-85" cy="85" r="8"/>

      <!-- 3rd shell: 1 electron -->
      <circle cx="0" cy="175" r="8"/>
    </g>

    <!-- Shell labels -->
    <rect x="-20" y="-86" width="40" height="18" rx="4" class="label-bg"/>
    <text x="0" y="-73" text-anchor="middle" class="sublabel">1st: 2</text>

    <rect x="78" y="-132" width="40" height="18" rx="4" class="label-bg"/>
    <text x="98" y="-119" text-anchor="middle" class="sublabel">2nd: 8</text>

    <rect x="132" y="-187" width="40" height="18" rx="4" class="label-bg"/>
    <text x="152" y="-174" text-anchor="middle" class="sublabel">3rd: 1</text>
  </g>

  <!-- Configuration text -->
  <rect x="520" y="110" width="300" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="670" y="140" text-anchor="middle" class="label">Sodium (Na)</text>
  <text x="670" y="165" text-anchor="middle" class="label" style="font-size:18px">2, 8, 1</text>

  <!-- Period label -->
  <line x1="520" y1="210" x2="620" y2="210" class="line"/>
  <rect x="525" y="196" width="90" height="28" rx="4" class="label-bg"/>
  <text x="570" y="214" text-anchor="middle" class="label">Period 3</text>
  <text x="670" y="214" text-anchor="middle" class="sublabel">= 3 occupied shells</text>

  <!-- Group label -->
  <line x1="520" y1="250" x2="620" y2="250" class="line"/>
  <rect x="525" y="236" width="90" height="28" rx="4" class="label-bg"/>
  <text x="570" y="254" text-anchor="middle" class="label">Group 1</text>
  <text x="670" y="254" text-anchor="middle" class="sublabel">= 1 outer electron</text>

  <!-- Shell capacity table -->
  <g transform="translate(520, 290)">
    <rect x="0" y="0" width="300" height="130" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="150" y="28" text-anchor="middle" class="label">Maximum electrons per shell</text>
    <text x="60" y="60" text-anchor="middle" class="label">1st shell</text>
    <text x="150" y="60" text-anchor="middle" class="label">2nd shell</text>
    <text x="240" y="60" text-anchor="middle" class="label">3rd shell</text>
    <text x="60" y="90" text-anchor="middle" class="label" style="font-size:18px">2</text>
    <text x="150" y="90" text-anchor="middle" class="label" style="font-size:18px">8</text>
    <text x="240" y="90" text-anchor="middle" class="label" style="font-size:18px">8</text>
    <text x="150" y="116" text-anchor="middle" class="sublabel">(MYP/GCSE model)</text>
  </g>

  <!-- Octet rule reminder -->
  <rect x="180" y="450" width="540" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="450" y="475" text-anchor="middle" class="sublabel">Atoms react to gain a full outer shell — the octet rule (or 2 for the first shell).</text>
</svg>