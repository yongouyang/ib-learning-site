<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="title desc">
  <title id="title">Preparing a pure soluble salt</title>
  <desc id="desc">Five-step flow diagram for the excess-solid method: warm the dilute acid, add excess insoluble base until some remains undissolved, filter off the unreacted solid, evaporate the filtrate to saturation, then cool to crystallise and dry the pure salt crystals.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .stepnum { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; }
      .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="310" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Preparing a Pure Soluble Salt: the Excess-Solid Method</text>

  <!-- Step 1 -->
  <rect x="20" y="58" width="140" height="152" rx="10" class="panel"/>
  <circle cx="42" cy="80" r="12" fill="#2563eb"/>
  <text x="42" y="85" text-anchor="middle" class="stepnum">1</text>
  <text x="34" y="116" class="label">Warm the acid</text>
  <text x="34" y="140" class="sublabel">gentle warming</text>
  <text x="34" y="156" class="sublabel">speeds up the</text>
  <text x="34" y="172" class="sublabel">reaction</text>
  <line x1="162" y1="134" x2="180" y2="134" class="arrow"/>

  <!-- Step 2 -->
  <rect x="182" y="58" width="140" height="152" rx="10" class="panel"/>
  <circle cx="204" cy="80" r="12" fill="#2563eb"/>
  <text x="204" y="85" text-anchor="middle" class="stepnum">2</text>
  <text x="196" y="116" class="label">Add excess base</text>
  <text x="196" y="140" class="sublabel">until solid stays</text>
  <text x="196" y="156" class="sublabel">undissolved — all</text>
  <text x="196" y="172" class="sublabel">the acid reacted</text>
  <line x1="324" y1="134" x2="342" y2="134" class="arrow"/>

  <!-- Step 3 -->
  <rect x="344" y="58" width="140" height="152" rx="10" class="panel"/>
  <circle cx="366" cy="80" r="12" fill="#2563eb"/>
  <text x="366" y="85" text-anchor="middle" class="stepnum">3</text>
  <text x="358" y="116" class="label">Filter</text>
  <text x="358" y="140" class="sublabel">removes the</text>
  <text x="358" y="156" class="sublabel">unreacted excess</text>
  <text x="358" y="172" class="sublabel">solid</text>
  <line x1="486" y1="134" x2="504" y2="134" class="arrow"/>

  <!-- Step 4 -->
  <rect x="506" y="58" width="140" height="152" rx="10" class="panel"/>
  <circle cx="528" cy="80" r="12" fill="#2563eb"/>
  <text x="528" y="85" text-anchor="middle" class="stepnum">4</text>
  <text x="520" y="116" class="label">Evaporate</text>
  <text x="520" y="140" class="sublabel">heat the filtrate</text>
  <text x="520" y="156" class="sublabel">until saturated —</text>
  <text x="520" y="172" class="sublabel">NOT to dryness</text>
  <line x1="648" y1="134" x2="666" y2="134" class="arrow"/>

  <!-- Step 5 -->
  <rect x="668" y="58" width="112" height="152" rx="10" class="panel"/>
  <circle cx="690" cy="80" r="12" fill="#2563eb"/>
  <text x="690" y="85" text-anchor="middle" class="stepnum">5</text>
  <text x="682" y="116" class="label">Crystallise</text>
  <text x="682" y="140" class="sublabel">cool slowly for</text>
  <text x="682" y="156" class="sublabel">pure crystals;</text>
  <text x="682" y="172" class="sublabel">filter and dry</text>

  <!-- Bottom example strip -->
  <rect x="20" y="230" width="760" height="58" rx="8" class="panel"/>
  <text x="400" y="253" text-anchor="middle" class="label">Example: CuO + H₂SO₄ → CuSO₄ + H₂O, giving blue copper(II) sulfate crystals</text>
  <text x="400" y="275" text-anchor="middle" class="sublabel">Works for any insoluble base or carbonate whose salt product is soluble.</text>
</svg>
