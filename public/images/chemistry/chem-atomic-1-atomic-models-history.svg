<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">History of Atomic Models</title>
  <desc id="desc">Timeline showing the development of atomic models from Dalton's solid sphere through Thomson's plum pudding, Rutherford's nuclear model, Bohr's shells, Chadwick's neutron, and the modern quantum model.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .timeline { stroke: #374151; stroke-width: 3; fill: none; }
      .model-box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">History of Atomic Models</text>

  <!-- Timeline base -->
  <line x1="80" y1="270" x2="820" y2="270" class="timeline"/>
  <polygon points="820,270 810,264 810,276" fill="#374151"/>

  <!-- Dalton 1803 -->
  <g transform="translate(130, 160)">
    <line x1="0" y1="110" x2="0" y2="145" class="line"/>
    <circle cx="0" cy="145" r="5" fill="#f97316"/>
    <circle cx="0" cy="55" r="40" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" class="label">Dalton</text>
    <text x="0" y="2" text-anchor="middle" class="sublabel">1803</text>
    <text x="0" y="60" text-anchor="middle" class="sublabel">Solid sphere</text>
    <text x="0" y="76" text-anchor="middle" class="sublabel">indivisible</text>
  </g>

  <!-- Thomson 1897 -->
  <g transform="translate(270, 160)">
    <line x1="0" y1="110" x2="0" y2="145" class="line"/>
    <circle cx="0" cy="145" r="5" fill="#f97316"/>
    <circle cx="0" cy="55" r="40" fill="#fde047" stroke="#d97706" stroke-width="2"/>
    <circle cx="-12" cy="50" r="6" fill="#3b82f6"/>
    <circle cx="15" cy="45" r="6" fill="#3b82f6"/>
    <circle cx="5" cy="70" r="6" fill="#3b82f6"/>
    <circle cx="-8" cy="65" r="6" fill="#3b82f6"/>
    <text x="0" y="-15" text-anchor="middle" class="label">Thomson</text>
    <text x="0" y="2" text-anchor="middle" class="sublabel">1897</text>
    <text x="0" y="60" text-anchor="middle" class="sublabel">Plum pudding</text>
  </g>

  <!-- Rutherford 1911 -->
  <g transform="translate(410, 160)">
    <line x1="0" y1="110" x2="0" y2="145" class="line"/>
    <circle cx="0" cy="145" r="5" fill="#f97316"/>
    <circle cx="0" cy="55" r="40" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="55" r="10" fill="#f97316"/>
    <circle cx="25" cy="45" r="4" fill="#3b82f6"/>
    <circle cx="-20" cy="70" r="4" fill="#3b82f6"/>
    <circle cx="15" cy="75" r="4" fill="#3b82f6"/>
    <text x="0" y="-15" text-anchor="middle" class="label">Rutherford</text>
    <text x="0" y="2" text-anchor="middle" class="sublabel">1911</text>
    <text x="0" y="60" text-anchor="middle" class="sublabel">Nucleus</text>
  </g>

  <!-- Bohr 1913 -->
  <g transform="translate(550, 160)">
    <line x1="0" y1="110" x2="0" y2="145" class="line"/>
    <circle cx="0" cy="145" r="5" fill="#f97316"/>
    <circle cx="0" cy="55" r="40" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="55" r="12" fill="#f97316"/>
    <circle cx="0" cy="55" r="28" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="28" cy="55" r="4" fill="#3b82f6"/>
    <circle cx="-28" cy="55" r="4" fill="#3b82f6"/>
    <circle cx="0" cy="83" r="4" fill="#3b82f6"/>
    <circle cx="0" cy="27" r="4" fill="#3b82f6"/>
    <text x="0" y="-15" text-anchor="middle" class="label">Bohr</text>
    <text x="0" y="2" text-anchor="middle" class="sublabel">1913</text>
    <text x="0" y="60" text-anchor="middle" class="sublabel">Electron shells</text>
  </g>

  <!-- Chadwick 1932 -->
  <g transform="translate(690, 160)">
    <line x1="0" y1="110" x2="0" y2="145" class="line"/>
    <circle cx="0" cy="145" r="5" fill="#f97316"/>
    <circle cx="0" cy="55" r="40" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="-8" cy="20" r="9" fill="#f97316"/>
    <text x="-8" y="24" text-anchor="middle" class="sublabel" fill="white">p</text>
    <circle cx="8" cy="20" r="9" fill="#64748b"/>
    <text x="8" y="24" text-anchor="middle" class="sublabel" fill="white">n</text>
    <circle cx="0" cy="40" r="9" fill="#64748b"/>
    <text x="0" y="44" text-anchor="middle" class="sublabel" fill="white">n</text>
    <circle cx="0" cy="55" r="28" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="28" cy="55" r="4" fill="#3b82f6"/>
    <text x="0" y="-15" text-anchor="middle" class="label">Chadwick</text>
    <text x="0" y="2" text-anchor="middle" class="sublabel">1932</text>
    <text x="0" y="60" text-anchor="middle" class="sublabel">Neutron discovered</text>
  </g>

  <!-- Modern quantum -->
  <g transform="translate(790, 160)">
    <line x1="0" y1="110" x2="0" y2="145" class="line"/>
    <circle cx="0" cy="145" r="5" fill="#f97316"/>
    <circle cx="0" cy="55" r="40" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="55" r="10" fill="#f97316"/>
    <ellipse cx="0" cy="55" rx="35" ry="15" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="55" rx="15" ry="35" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="55" rx="30" ry="30" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" transform="rotate(45 0 55)"/>
    <text x="0" y="-15" text-anchor="middle" class="label">Modern</text>
    <text x="0" y="2" text-anchor="middle" class="sublabel">quantum</text>
    <text x="0" y="60" text-anchor="middle" class="sublabel">Orbitals /</text>
    <text x="0" y="76" text-anchor="middle" class="sublabel">probability clouds</text>
  </g>

  <!-- Rutherford experiment note -->
  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="700" height="130" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="350" y="30" text-anchor="middle" class="label">Rutherford's gold foil experiment</text>
    <text x="350" y="58" text-anchor="middle" class="sublabel">Alpha particles fired at thin gold foil: most passed through, a few bounced back.</text>
    <text x="350" y="82" text-anchor="middle" class="sublabel">Conclusion: the atom is mostly empty space with a tiny, dense, positive nucleus.</text>
    <text x="350" y="108" text-anchor="middle" class="sublabel">Scientific models change as new evidence emerges.</text>
  </g>
</svg>