<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">pH Practical Skills and Titration</title>
  <desc id="desc">How to measure pH safely with indicator paper and a pH meter, and a labelled titration setup with burette and conical flask.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .beaker { fill: #e0f2fe; stroke: #475569; stroke-width: 2.5; }
      .liquid { fill: #bae6fd; opacity: 0.7; }
      .burette { fill: #e5e7eb; stroke: #475569; stroke-width: 2.5; }
      .flask { fill: #e0f2fe; stroke: #475569; stroke-width: 2.5; }
      .pink { fill: #ec4899; }
      .paper { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">pH Practical Skills and Titration</text>

  <!-- Left panel: measuring pH -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="340" height="420" rx="10" class="box"/>
    <text x="170" y="28" text-anchor="middle" class="label">Measuring pH</text>

    <!-- test tube -->
    <path d="M60,80 L60,180 Q60,200 80,200 L100,200 Q120,200 120,180 L120,80" class="beaker"/>
    <rect x="65" y="120" width="50" height="75" rx="18" class="liquid"/>
    <text x="90" y="150" text-anchor="middle" class="sublabel" fill="#1f2937">solution</text>

    <!-- glass rod -->
    <line x1="150" y1="80" x2="110" y2="150" class="line" stroke="#94a3b8" stroke-width="3"/>
    <text x="170" y="100" class="sublabel">Use a clean glass rod</text>
    <text x="170" y="116" class="sublabel">to transfer a drop</text>

    <!-- indicator paper and chart -->
    <rect x="60" y="240" width="220" height="55" rx="6" class="paper"/>
    <rect x="70" y="250" width="30" height="35" fill="#ef4444"/>
    <rect x="100" y="250" width="30" height="35" fill="#f97316"/>
    <rect x="130" y="250" width="30" height="35" fill="#facc15"/>
    <rect x="160" y="250" width="30" height="35" fill="#22c55e"/>
    <rect x="190" y="250" width="30" height="35" fill="#3b82f6"/>
    <rect x="220" y="250" width="30" height="35" fill="#8b5cf6"/>
    <text x="90" y="300" text-anchor="middle" class="sublabel">0</text>
    <text x="175" y="300" text-anchor="middle" class="sublabel">7</text>
    <text x="235" y="300" text-anchor="middle" class="sublabel">14</text>
    <text x="170" y="325" text-anchor="middle" class="sublabel">Compare colour to chart immediately</text>

    <!-- pH meter -->
    <g transform="translate(80, 355)">
      <rect x="0" y="0" width="70" height="45" rx="5" fill="#374151"/>
      <rect x="8" y="8" width="54" height="20" fill="#22c55e"/>
      <text x="35" y="22" text-anchor="middle" class="sublabel" fill="#1f2937">pH 7.0</text>
      <line x1="35" y1="45" x2="35" y2="90" class="line" stroke="#475569" stroke-width="3"/>
      <circle cx="35" cy="95" r="8" fill="#3b82f6"/>
    </g>
    <text x="200" y="390" class="sublabel">pH meter / data logger</text>
    <text x="200" y="406" class="sublabel">gives precise values</text>

    <text x="170" y="228" text-anchor="middle" class="sublabel">Do NOT dip paper into the test tube</text>
  </g>

  <!-- Right panel: titration -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="340" height="420" rx="10" class="box"/>
    <text x="170" y="28" text-anchor="middle" class="label">Titration setup</text>

    <!-- retort stand -->
    <rect x="30" y="60" width="8" height="340" fill="#374151"/>
    <rect x="30" y="60" width="120" height="8" fill="#374151"/>
    <rect x="140" y="60" width="8" height="40" fill="#374151"/>

    <!-- burette -->
    <rect x="136" y="100" width="16" height="200" rx="2" class="burette"/>
    <line x1="140" y1="110" x2="148" y2="110" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="130" x2="148" y2="130" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="150" x2="148" y2="150" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="170" x2="148" y2="170" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="190" x2="148" y2="190" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="210" x2="148" y2="210" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="230" x2="148" y2="230" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="250" x2="148" y2="250" stroke="#6b7280" stroke-width="1"/>
    <line x1="140" y1="270" x2="148" y2="270" stroke="#6b7280" stroke-width="1"/>
    <rect x="138" y="300" width="12" height="8" fill="#475569"/>
    <line x1="144" y1="308" x2="144" y2="320" stroke="#475569" stroke-width="2"/>

    <text x="180" y="130" class="label">Burette</text>
    <line x1="175" y1="135" x2="155" y2="180" class="line"/>
    <text x="180" y="155" class="sublabel">acid of known</text>
    <text x="180" y="171" class="sublabel">concentration</text>

    <!-- conical flask -->
    <path d="M100,320 L130,380 L210,380 L240,320" class="flask"/>
    <polygon points="130,380 210,380 190,340 150,340" class="pink" opacity="0.5"/>
    <text x="170" y="365" text-anchor="middle" class="sublabel" fill="#1f2937">alkali + indicator</text>

    <!-- white tile -->
    <rect x="90" y="385" width="160" height="12" rx="2" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="170" y="415" text-anchor="middle" class="sublabel">White tile helps see colour change</text>

    <!-- drop from burette -->
    <path d="M144,320 Q144,330 139,335 Q134,330 144,320" fill="#f97316"/>
    <text x="220" y="260" class="sublabel">Add drop by drop</text>
    <text x="220" y="276" class="sublabel">near the endpoint</text>

    <!-- indicator bottle -->
    <rect x="260" y="310" width="30" height="40" rx="4" fill="#f97316"/>
    <rect x="270" y="300" width="10" height="12" fill="#f97316"/>
    <line x1="250" y1="320" x2="260" y2="330" class="line"/>
    <text x="270" y="370" text-anchor="middle" class="sublabel">Indicator</text>
  </g>
</svg>
