<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
  <title id="title">Making Salts</title>
  <desc id="desc">How the parent acid determines the salt name, and the main methods for preparing soluble and insoluble salts.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .beaker { fill: #e0f2fe; stroke: #475569; stroke-width: 2.5; }
      .liquid { fill: #bae6fd; opacity: 0.7; }
      .solid { fill: #9ca3af; }
      .acid { fill: #f97316; }
    </style>
  </defs>

  <rect width="800" height="580" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">Making Salts</text>

  <!-- Acid → salt family -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="180" height="60" rx="8" class="box"/>
    <text x="90" y="22" text-anchor="middle" class="label">HCl</text>
    <text x="90" y="42" text-anchor="middle" class="sublabel">→ chloride salts</text>

    <rect x="220" y="0" width="180" height="60" rx="8" class="box"/>
    <text x="310" y="22" text-anchor="middle" class="label">H₂SO₄</text>
    <text x="310" y="42" text-anchor="middle" class="sublabel">→ sulfate salts</text>

    <rect x="440" y="0" width="180" height="60" rx="8" class="box"/>
    <text x="530" y="22" text-anchor="middle" class="label">HNO₃</text>
    <text x="530" y="42" text-anchor="middle" class="sublabel">→ nitrate salts</text>
  </g>

  <!-- Method 1: insoluble base -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="330" height="180" rx="10" class="box"/>
    <text x="165" y="25" text-anchor="middle" class="label">Acid + insoluble base</text>

    <path d="M40,50 L40,130 Q40,150 60,150 L110,150 Q130,150 130,130 L130,50" class="beaker"/>
    <rect x="45" y="85" width="80" height="60" rx="25" class="liquid"/>
    <circle cx="75" cy="110" r="8" class="solid"/>
    <text x="75" y="113" text-anchor="middle" class="sublabel" fill="white">CuO</text>

    <path d="M170,70 L170,110 L150,140" class="line"/>
    <polygon points="145,135 150,150 160,138" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>

    <rect x="190" y="55" width="120" height="110" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="205" y="140" width="90" height="10" rx="5" class="liquid"/>
    <text x="250" y="90" text-anchor="middle" class="sublabel">filter off excess</text>
    <text x="250" y="108" text-anchor="middle" class="sublabel">solid, then</text>
    <text x="250" y="126" text-anchor="middle" class="sublabel">evaporate &amp;</text>
    <text x="250" y="144" text-anchor="middle" class="sublabel">crystallise</text>

    <text x="165" y="170" text-anchor="middle" class="sublabel">CuO + H₂SO₄ → CuSO₄ + H₂O</text>
  </g>

  <!-- Method 2: titration -->
  <g transform="translate(420, 150)">
    <rect x="0" y="0" width="330" height="180" rx="10" class="box"/>
    <text x="165" y="25" text-anchor="middle" class="label">Acid + alkali (titration)</text>

    <line x1="110" y1="50" x2="110" y2="140" stroke="#475569" stroke-width="4"/>
    <line x1="105" y1="50" x2="115" y2="50" stroke="#475569" stroke-width="4"/>
    <line x1="95" y1="60" x2="125" y2="60" stroke="#9ca3af" stroke-width="1"/>
    <line x1="95" y1="90" x2="125" y2="90" stroke="#9ca3af" stroke-width="1"/>
    <line x1="95" y1="120" x2="125" y2="120" stroke="#9ca3af" stroke-width="1"/>

    <path d="M70,140 L70,190 Q70,210 95,210 L125,210 Q150,210 150,190 L150,140" class="beaker"/>
    <rect x="75" y="165" width="70" height="40" rx="18" class="liquid"/>

    <circle cx="230" cy="90" r="14" class="acid"/>
    <text x="230" y="94" text-anchor="middle" class="sublabel" fill="white">indicator</text>
    <line x1="220" y1="104" x2="150" y2="160" class="line"/>

    <text x="165" y="170" text-anchor="middle" class="sublabel">Add acid dropwise until</text>
    <text x="165" y="188" text-anchor="middle" class="sublabel">the indicator changes colour</text>
  </g>

  <!-- Method 3: acid + metal -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="330" height="180" rx="10" class="box"/>
    <text x="165" y="25" text-anchor="middle" class="label">Acid + reactive metal</text>

    <path d="M70,50 L70,130 Q70,150 90,150 L140,150 Q160,150 160,130 L160,50" class="beaker"/>
    <rect x="75" y="85" width="80" height="60" rx="25" class="liquid"/>
    <rect x="95" y="55" width="40" height="35" rx="4" fill="#64748b"/>
    <text x="115" y="76" text-anchor="middle" class="sublabel" fill="white">Mg</text>

    <!-- H2 bubbles -->
    <circle cx="105" cy="45" r="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
    <circle cx="125" cy="35" r="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
    <circle cx="140" cy="48" r="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
    <text x="165" y="45" class="sublabel">H₂ gas</text>

    <text x="165" y="170" text-anchor="middle" class="sublabel">Mg + 2HCl → MgCl₂ + H₂↑</text>
  </g>

  <!-- Method 4: precipitation -->
  <g transform="translate(420, 360)">
    <rect x="0" y="0" width="330" height="180" rx="10" class="box"/>
    <text x="165" y="25" text-anchor="middle" class="label">Precipitation (insoluble salt)</text>

    <path d="M50,50 L50,130 Q50,150 70,150 L120,150 Q140,150 140,130 L140,50" class="beaker"/>
    <rect x="55" y="85" width="80" height="60" rx="25" class="liquid"/>
    <text x="95" y="110" text-anchor="middle" class="sublabel">BaCl₂(aq)</text>

    <path d="M180,50 L180,130 Q180,150 200,150 L250,150 Q270,150 270,130 L270,50" class="beaker"/>
    <rect x="185" y="85" width="80" height="60" rx="25" class="liquid"/>
    <text x="225" y="110" text-anchor="middle" class="sublabel">Na₂SO₄(aq)</text>

    <line x1="150" y1="90" x2="170" y2="90" class="line" marker-end="url(#arrow-grey)"/>

    <circle cx="210" cy="45" r="8" class="solid"/>
    <text x="210" y="48" text-anchor="middle" class="sublabel" fill="white">BaSO₄</text>
    <text x="250" y="45" class="sublabel">precipitate</text>

    <text x="165" y="170" text-anchor="middle" class="sublabel">BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl</text>
  </g>

  <defs>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
