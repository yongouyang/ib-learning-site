<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Pure Metal Lattice Versus Alloy Lattice</title>
  <desc id="desc">A side-by-side comparison showing how a pure metal's regular layers slide easily, while an alloy's different-sized atoms disrupt the layers and stop sliding.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#f9fafb" rx="12"/>
  <text x="380" y="38" text-anchor="middle" class="title">Alloys are Harder than Pure Metals</text>

  <!-- Pure metal panel -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="150" y="30" text-anchor="middle" class="label">Pure metal</text>

    <!-- Layers of identical atoms -->
    <g fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5">
      <circle cx="50" cy="80" r="18"/>
      <circle cx="100" cy="80" r="18"/>
      <circle cx="150" cy="80" r="18"/>
      <circle cx="200" cy="80" r="18"/>
      <circle cx="250" cy="80" r="18"/>

      <circle cx="50" cy="140" r="18"/>
      <circle cx="100" cy="140" r="18"/>
      <circle cx="150" cy="140" r="18"/>
      <circle cx="200" cy="140" r="18"/>
      <circle cx="250" cy="140" r="18"/>

      <circle cx="50" cy="200" r="18"/>
      <circle cx="100" cy="200" r="18"/>
      <circle cx="150" cy="200" r="18"/>
      <circle cx="200" cy="200" r="18"/>
      <circle cx="250" cy="200" r="18"/>
    </g>

    <!-- Sliding arrow -->
    <line x1="40" y1="240" x2="260" y2="240" class="arrow" stroke="#6b7280" marker-end="url(#arrow-head)"/>
    <text x="150" y="265" text-anchor="middle" class="sublabel">Layers slide easily → soft</text>
  </g>

  <!-- Alloy panel -->
  <g transform="translate(400, 70)">
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="150" y="30" text-anchor="middle" class="label">Alloy</text>

    <!-- Layers with different-sized atoms -->
    <g stroke-width="1.5">
      <circle cx="50" cy="80" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="100" cy="80" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="150" cy="80" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="200" cy="80" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="250" cy="80" r="18" fill="#93c5fd" stroke="#3b82f6"/>

      <circle cx="75" cy="140" r="22" fill="#f97316" stroke="#c2410c"/>
      <circle cx="125" cy="140" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="175" cy="140" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="225" cy="140" r="18" fill="#93c5fd" stroke="#3b82f6"/>

      <circle cx="50" cy="200" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="100" cy="200" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="150" cy="200" r="22" fill="#f97316" stroke="#c2410c"/>
      <circle cx="200" cy="200" r="18" fill="#93c5fd" stroke="#3b82f6"/>
      <circle cx="250" cy="200" r="18" fill="#93c5fd" stroke="#3b82f6"/>
    </g>

    <!-- Blocked arrow -->
    <line x1="40" y1="240" x2="120" y2="240" class="arrow" stroke="#dc2626" marker-end="url(#arrow-head)"/>
    <line x1="130" y1="240" x2="150" y2="240" stroke="#dc2626" stroke-width="3"/>
    <text x="150" y="265" text-anchor="middle" class="sublabel">Layers blocked → hard</text>
  </g>

  <!-- Key -->
  <g transform="translate(260, 380)">
    <circle cx="0" cy="0" r="10" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="18" y="4" class="sublabel">Metal atoms (e.g. Fe or Cu)</text>

    <circle cx="200" cy="0" r="10" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <text x="218" y="4" class="sublabel">Different-sized atoms (e.g. C, Zn, Sn)</text>
  </g>

  <!-- Examples -->
  <rect x="130" y="415" width="500" height="30" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="380" y="434" text-anchor="middle" class="sublabel">Examples: steel (Fe + C), brass (Cu + Zn), bronze (Cu + Sn)</text>
</svg>