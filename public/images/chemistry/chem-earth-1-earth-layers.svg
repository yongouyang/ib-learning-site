<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
  <title id="title">Earth's Internal Structure</title>
  <desc id="desc">A cross-section of Earth showing the crust, mantle, outer core, and inner core, with labels for the lithosphere and asthenosphere.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="840" height="560" fill="#f9fafb" rx="12"/>
  <text x="420" y="38" text-anchor="middle" class="title">Earth's Internal Structure</text>

  <!-- Cross-section circle representing Earth -->
  <g transform="translate(320, 280)">
    <!-- Outer boundary / crust -->
    <circle cx="0" cy="0" r="220" fill="#fed7aa" stroke="#f97316" stroke-width="3"/>
    <!-- Mantle -->
    <circle cx="0" cy="0" r="195" fill="#fdba74" stroke="#f97316" stroke-width="2"/>
    <!-- Outer core -->
    <circle cx="0" cy="0" r="115" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <!-- Inner core -->
    <circle cx="0" cy="0" r="50" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>

    <!-- Cutaway effect (right side darkened overlay) -->
    <path d="M0,-220 A220,220 0 1,1 0,220 L0,195 A195,195 0 1,0 0,-195 Z" fill="#fff7ed" opacity="0.35"/>
  </g>

  <!-- Lithosphere label -->
  <line x1="520" y1="120" x2="600" y2="90" class="line"/>
  <rect x="606" y="76" width="100" height="30" rx="4" class="label-bg"/>
  <text x="610" y="92" class="label">Lithosphere</text>
  <text x="610" y="108" class="sublabel">crust + rigid upper mantle</text>

  <!-- Asthenosphere label -->
  <line x1="505" y1="180" x2="600" y2="210" class="line"/>
  <rect x="606" y="196" width="110" height="30" rx="4" class="label-bg"/>
  <text x="610" y="212" class="label">Asthenosphere</text>
  <text x="610" y="228" class="sublabel">semi-molten, flows slowly</text>

  <!-- Crust label -->
  <line x1="330" y1="70" x2="330" y2="40" class="line"/>
  <rect x="300" y="20" width="60" height="18" rx="4" class="label-bg"/>
  <text x="304" y="33" class="label">Crust</text>

  <!-- Mantle label -->
  <line x1="130" y1="220" x2="60" y2="220" class="line"/>
  <rect x="10" y="206" width="80" height="18" rx="4" class="label-bg"/>
  <text x="14" y="219" class="label">Mantle</text>

  <!-- Outer core label -->
  <line x1="130" y1="350" x2="60" y2="390" class="line"/>
  <rect x="10" y="376" width="90" height="30" rx="4" class="label-bg"/>
  <text x="14" y="392" class="label">Outer core</text>
  <text x="14" y="408" class="sublabel">liquid iron &amp; nickel</text>

  <!-- Inner core label -->
  <line x1="320" y1="410" x2="320" y2="450" class="line"/>
  <rect x="280" y="452" width="90" height="30" rx="4" class="label-bg"/>
  <text x="284" y="468" class="label">Inner core</text>
  <text x="284" y="484" class="sublabel">solid iron &amp; nickel</text>

  <!-- Key facts panel -->
  <rect x="620" y="320" width="190" height="200" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="715" y="350" text-anchor="middle" class="label">Key facts</text>
  <text x="635" y="380" class="sublabel">• Mantle: ~2 900 km thick</text>
  <text x="635" y="405" class="sublabel">• Outer core: ~2 200 km thick</text>
  <text x="635" y="430" class="sublabel">• Inner core: ~1 200 km radius</text>
  <text x="635" y="455" class="sublabel">• Inner core ~5 500 °C</text>
  <text x="635" y="480" class="sublabel">• Convection drives</text>
  <text x="635" y="500" class="sublabel">  plate tectonics</text>
</svg>
