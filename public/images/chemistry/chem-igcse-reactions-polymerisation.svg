<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Addition Polymerisation of Ethene</title>
  <desc id="desc">Three ethene monomer molecules, each with a carbon-carbon double bond, joining by addition polymerisation to form a section of a poly(ethene) chain whose repeat unit is shown in brackets with a subscript n.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .mol { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .big { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 34px; font-weight: 400; fill: #374151; }
      .chip { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
      .arrow { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; }
    </style>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 L2,4.5 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="#f9fafb" rx="12"/>
  <text x="500" y="34" text-anchor="middle" class="title">Addition Polymerisation: ethene to poly(ethene)</text>

  <!-- Monomer panel -->
  <rect x="30" y="70" width="400" height="240" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="230" y="96" text-anchor="middle" class="label">Monomers: ethene, CH₂=CH₂</text>

  <!-- Three monomer chips -->
  <rect x="60" y="150" width="90" height="44" rx="6" class="chip"/>
  <text x="105" y="178" text-anchor="middle" class="mol">CH₂=CH₂</text>
  <text x="210" y="184" text-anchor="middle" class="big">+</text>
  <rect x="250" y="150" width="90" height="44" rx="6" class="chip"/>
  <text x="295" y="178" text-anchor="middle" class="mol">CH₂=CH₂</text>
  <text x="368" y="184" text-anchor="middle" class="big">+</text>
  <rect x="120" y="240" width="90" height="44" rx="6" class="chip"/>
  <text x="165" y="268" text-anchor="middle" class="mol">CH₂=CH₂</text>
  <text x="250" y="272" text-anchor="middle" class="sublabel">+ many more (n)</text>

  <!-- C=C annotation -->
  <rect x="52" y="118" width="180" height="20" rx="4" class="chip"/>
  <text x="58" y="132" class="sublabel">each has a C=C double bond</text>
  <line x1="142" y1="138" x2="110" y2="150" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Reaction arrow -->
  <line x1="445" y1="190" x2="545" y2="190" class="arrow" marker-end="url(#arrow-blue)"/>
  <text x="495" y="170" text-anchor="middle" class="sublabel">double bonds open</text>
  <text x="495" y="216" text-anchor="middle" class="sublabel">monomers link up</text>

  <!-- Polymer panel -->
  <rect x="560" y="70" width="410" height="240" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="765" y="96" text-anchor="middle" class="label">Polymer: poly(ethene)</text>

  <!-- Repeat unit with brackets -->
  <text x="600" y="196" class="big">[</text>
  <rect x="628" y="150" width="200" height="52" rx="6" class="chip"/>
  <text x="728" y="183" text-anchor="middle" class="mol">–CH₂–CH₂–</text>
  <text x="846" y="196" class="big">]</text>
  <text x="862" y="206" class="mol">n</text>

  <text x="765" y="240" text-anchor="middle" class="sublabel">the –CH₂–CH₂– repeat unit is repeated n times</text>
  <text x="765" y="262" text-anchor="middle" class="sublabel">no double bonds remain in the chain</text>
  <text x="765" y="284" text-anchor="middle" class="sublabel">only ONE product forms — that is why it is called addition</text>

  <!-- Footnote -->
  <text x="500" y="356" text-anchor="middle" class="sublabel">Thousands of ethene molecules join into one long saturated chain — used for plastic bags, bottles and cable insulation.</text>
</svg>
