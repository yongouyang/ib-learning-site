<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Limitations of the Particle Model</title>
  <desc id="desc">A diagram contrasting the simplified particle model of identical spheres with the reality of different particle sizes, shapes, and attractive forces between them.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .arrow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow-force" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Limitations of the Particle Model</text>

  <!-- Simplified model panel -->
  <rect x="50" y="55" width="390" height="400" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="245" y="82" text-anchor="middle" class="panel-title">Simplified Particle Model</text>

  <g fill="#3b82f6">
    <circle cx="120" cy="150" r="14"/><circle cx="170" cy="150" r="14"/><circle cx="220" cy="150" r="14"/><circle cx="270" cy="150" r="14"/><circle cx="320" cy="150" r="14"/>
    <circle cx="120" cy="210" r="14"/><circle cx="170" cy="210" r="14"/><circle cx="220" cy="210" r="14"/><circle cx="270" cy="210" r="14"/><circle cx="320" cy="210" r="14"/>
    <circle cx="120" cy="270" r="14"/><circle cx="170" cy="270" r="14"/><circle cx="220" cy="270" r="14"/><circle cx="270" cy="270" r="14"/><circle cx="320" cy="270" r="14"/>
    <circle cx="120" cy="330" r="14"/><circle cx="170" cy="330" r="14"/><circle cx="220" cy="330" r="14"/><circle cx="270" cy="330" r="14"/><circle cx="320" cy="330" r="14"/>
  </g>

  <rect x="100" y="370" width="250" height="18" rx="4" class="label-bg"/>
  <text x="105" y="382" class="label">Identical solid spheres, evenly spaced</text>

  <line x1="120" y1="136" x2="120" y2="110" class="line"/>
  <rect x="85" y="92" width="70" height="18" rx="4" class="label-bg"/>
  <text x="90" y="104" class="label">Same size</text>

  <!-- Reality panel -->
  <rect x="460" y="55" width="390" height="400" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="655" y="82" text-anchor="middle" class="panel-title">Reality</text>

  <!-- Different shapes and sizes -->
  <circle cx="520" cy="150" r="18" fill="#3b82f6"/>
  <ellipse cx="585" cy="150" rx="22" ry="14" fill="#10b981"/>
  <rect x="620" y="135" width="30" height="30" rx="4" fill="#f97316"/>
  <circle cx="700" cy="150" r="12" fill="#8b5cf6"/>
  <ellipse cx="770" cy="150" rx="14" ry="22" fill="#ef4444"/>

  <circle cx="530" cy="220" r="14" fill="#3b82f6"/>
  <ellipse cx="600" cy="225" rx="18" ry="12" fill="#10b981"/>
  <rect x="650" y="210" width="24" height="30" rx="3" fill="#f97316"/>
  <circle cx="720" cy="220" r="16" fill="#8b5cf6"/>
  <ellipse cx="780" cy="225" rx="12" ry="18" fill="#ef4444"/>

  <circle cx="520" cy="300" r="16" fill="#3b82f6"/>
  <ellipse cx="590" cy="300" rx="20" ry="14" fill="#10b981"/>
  <rect x="640" y="285" width="28" height="28" rx="3" fill="#f97316"/>
  <circle cx="720" cy="300" r="14" fill="#8b5cf6"/>

  <!-- Intermolecular force arrows -->
  <line x1="538" y1="150" x2="563" y2="150" class="arrow" stroke="#f97316" marker-end="url(#arrow-force)" marker-start="url(#arrow-force)"/>
  <line x1="650" y1="165" x2="688" y2="158" class="arrow" stroke="#f97316" marker-end="url(#arrow-force)" marker-start="url(#arrow-force)"/>
  <line x1="544" y1="220" x2="582" y2="220" class="arrow" stroke="#f97316" marker-end="url(#arrow-force)" marker-start="url(#arrow-force)"/>
  <line x1="674" y1="225" x2="704" y2="222" class="arrow" stroke="#f97316" marker-end="url(#arrow-force)" marker-start="url(#arrow-force)"/>
  <line x1="536" y1="300" x2="570" y2="300" class="arrow" stroke="#f97316" marker-end="url(#arrow-force)" marker-start="url(#arrow-force)"/>

  <rect x="540" y="370" width="295" height="18" rx="4" class="label-bg"/>
  <text x="545" y="382" class="label">Different sizes, shapes, and attractive forces</text>

  <line x1="655" y1="120" x2="655" y2="105" class="line"/>
  <rect x="600" y="87" width="165" height="18" rx="4" class="label-bg"/>
  <text x="605" y="99" class="label">Different shapes &amp; sizes</text>

  <line x1="620" y1="250" x2="580" y2="280" class="line"/>
  <rect x="500" y="285" width="146" height="18" rx="4" class="label-bg"/>
  <text x="505" y="297" class="label">Intermolecular forces</text>

  <!-- Arrow between panels -->
  <line x1="440" y1="255" x2="460" y2="255" class="arrow" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-force)"/>
  <text x="450" y="280" text-anchor="middle" class="sublabel">Oversimplifies</text>

  <!-- Bottom note -->
  <rect x="200" y="470" width="500" height="30" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="450" y="489" text-anchor="middle" class="sublabel">The particle model is useful, but it ignores real particle size, shape, and intermolecular forces.</text>
</svg>