<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Octet Rule and Why Atoms Bond</title>
  <desc id="desc">A diagram showing an atom with an incomplete outer shell, a noble gas with a full outer shell, and the three main bonding types: ionic, covalent, and metallic.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .electron { fill: #3b82f6; }
      .nucleus { fill: #f97316; }
      .shell { fill: none; stroke: #9ca3af; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .bond-icon { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Why Do Atoms Bond? The Octet Rule</text>

  <!-- Sodium-like atom with incomplete outer shell -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="30" class="nucleus"/>
    <text x="0" y="5" text-anchor="middle" class="sublabel" fill="white" font-weight="600">Na</text>
    <circle cx="0" cy="0" r="55" class="shell"/>
    <circle cx="0" cy="0" r="90" class="shell"/>
    <circle cx="0" cy="0" r="125" class="shell"/>
    <!-- electrons -->
    <circle cx="55" cy="0" r="6" class="electron"/>
    <circle cx="-55" cy="0" r="6" class="electron"/>
    <circle cx="0" cy="55" r="6" class="electron"/>
    <circle cx="0" cy="-55" r="6" class="electron"/>
    <circle cx="40" cy="-38" r="6" class="electron"/>
    <circle cx="-40" cy="38" r="6" class="electron"/>
    <circle cx="40" cy="38" r="6" class="electron"/>
    <circle cx="-40" cy="-38" r="6" class="electron"/>
    <circle cx="90" cy="0" r="6" class="electron"/>
    <circle cx="-90" cy="0" r="6" class="electron"/>
    <circle cx="0" cy="90" r="6" class="electron"/>
    <circle cx="0" cy="-90" r="6" class="electron"/>
    <circle cx="64" cy="-64" r="6" class="electron"/>
    <circle cx="-64" cy="64" r="6" class="electron"/>
    <circle cx="64" cy="64" r="6" class="electron"/>
    <circle cx="-64" cy="-64" r="6" class="electron"/>
    <circle cx="125" cy="0" r="6" class="electron"/>
    <text x="140" y="5" text-anchor="start" class="sublabel" fill="#dc2626" font-weight="600">1 outer electron</text>
  </g>
  <text x="180" y="340" text-anchor="middle" class="label">Sodium (Na): 2,8,1</text>
  <text x="180" y="358" text-anchor="middle" class="sublabel">Unstable — tends to lose 1 electron</text>

  <!-- Arrow to noble gas -->
  <line x1="330" y1="250" x2="400" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="365" y="240" text-anchor="middle" class="sublabel">gain, lose or share</text>
  <text x="365" y="270" text-anchor="middle" class="sublabel">to become stable</text>

  <!-- Neon-like atom with full outer shell -->
  <g transform="translate(550, 180)">
    <circle cx="0" cy="0" r="30" class="nucleus" fill="#10b981"/>
    <text x="0" y="5" text-anchor="middle" class="sublabel" fill="white" font-weight="600">Ne</text>
    <circle cx="0" cy="0" r="55" class="shell"/>
    <circle cx="0" cy="0" r="90" class="shell"/>
    <circle cx="55" cy="0" r="6" class="electron"/>
    <circle cx="-55" cy="0" r="6" class="electron"/>
    <circle cx="0" cy="55" r="6" class="electron"/>
    <circle cx="0" cy="-55" r="6" class="electron"/>
    <circle cx="40" cy="-38" r="6" class="electron"/>
    <circle cx="-40" cy="38" r="6" class="electron"/>
    <circle cx="40" cy="38" r="6" class="electron"/>
    <circle cx="-40" cy="-38" r="6" class="electron"/>
    <circle cx="90" cy="0" r="6" class="electron"/>
    <circle cx="-90" cy="0" r="6" class="electron"/>
    <circle cx="0" cy="90" r="6" class="electron"/>
    <circle cx="0" cy="-90" r="6" class="electron"/>
    <circle cx="64" cy="-64" r="6" class="electron"/>
    <circle cx="-64" cy="64" r="6" class="electron"/>
    <circle cx="64" cy="64" r="6" class="electron"/>
    <circle cx="-64" cy="-64" r="6" class="electron"/>
  </g>
  <text x="550" y="340" text-anchor="middle" class="label">Neon (Ne): 2,8</text>
  <text x="550" y="358" text-anchor="middle" class="sublabel">Full outer shell — stable noble gas</text>

  <!-- Three bonding type panels -->
  <rect x="100" y="400" width="210" height="90" rx="10" class="box"/>
  <text x="205" y="425" text-anchor="middle" class="label" fill="#1d4ed8">Ionic</text>
  <text x="205" y="445" text-anchor="middle" class="sublabel">Metal + non-metal</text>
  <text x="205" y="462" text-anchor="middle" class="sublabel">Electrons transferred</text>
  <text x="205" y="479" text-anchor="middle" class="sublabel">e.g. NaCl</text>

  <rect x="345" y="400" width="210" height="90" rx="10" class="box"/>
  <text x="450" y="425" text-anchor="middle" class="label" fill="#047857">Covalent</text>
  <text x="450" y="445" text-anchor="middle" class="sublabel">Non-metal + non-metal</text>
  <text x="450" y="462" text-anchor="middle" class="sublabel">Electrons shared</text>
  <text x="450" y="479" text-anchor="middle" class="sublabel">e.g. H₂O, CO₂</text>

  <rect x="590" y="400" width="210" height="90" rx="10" class="box"/>
  <text x="695" y="425" text-anchor="middle" class="label" fill="#b45309">Metallic</text>
  <text x="695" y="445" text-anchor="middle" class="sublabel">Metal + metal</text>
  <text x="695" y="462" text-anchor="middle" class="sublabel">Electrons delocalised</text>
  <text x="695" y="479" text-anchor="middle" class="sublabel">e.g. Cu, Fe</text>

  <defs>
    <marker id="arrow-neutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
