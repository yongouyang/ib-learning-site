<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">The Two Isomers of C4H10</title>
  <desc id="desc">Displayed formulae of butane, a straight chain of four carbons, and methylpropane, a three-carbon chain with a methyl branch on the middle carbon. Both have the molecular formula C4H10.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .atom { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .bond { stroke: #374151; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="620" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Isomers of C₄H₁₀ — same formula, different structure</text>

  <!-- Butane panel -->
  <rect x="60" y="60" width="680" height="230" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="90" y="88" class="label">Butane — straight chain, C₄H₁₀</text>

  <!-- butane bonds -->
  <line x1="210" y1="200" x2="310" y2="200" class="bond"/>
  <line x1="330" y1="200" x2="430" y2="200" class="bond"/>
  <line x1="450" y1="200" x2="550" y2="200" class="bond"/>
  <line x1="188" y1="200" x2="172" y2="200" class="bond"/>
  <line x1="552" y1="200" x2="588" y2="200" class="bond"/>
  <line x1="200" y1="186" x2="200" y2="150" class="bond"/>
  <line x1="320" y1="186" x2="320" y2="150" class="bond"/>
  <line x1="440" y1="186" x2="440" y2="150" class="bond"/>
  <line x1="560" y1="186" x2="560" y2="150" class="bond"/>
  <line x1="200" y1="214" x2="200" y2="250" class="bond"/>
  <line x1="320" y1="214" x2="320" y2="250" class="bond"/>
  <line x1="440" y1="214" x2="440" y2="250" class="bond"/>
  <line x1="560" y1="214" x2="560" y2="250" class="bond"/>

  <!-- butane atoms -->
  <text x="200" y="207" text-anchor="middle" class="atom">C</text>
  <text x="320" y="207" text-anchor="middle" class="atom">C</text>
  <text x="440" y="207" text-anchor="middle" class="atom">C</text>
  <text x="560" y="207" text-anchor="middle" class="atom">C</text>
  <text x="200" y="147" text-anchor="middle" class="atom">H</text>
  <text x="320" y="147" text-anchor="middle" class="atom">H</text>
  <text x="440" y="147" text-anchor="middle" class="atom">H</text>
  <text x="560" y="147" text-anchor="middle" class="atom">H</text>
  <text x="200" y="269" text-anchor="middle" class="atom">H</text>
  <text x="320" y="269" text-anchor="middle" class="atom">H</text>
  <text x="440" y="269" text-anchor="middle" class="atom">H</text>
  <text x="560" y="269" text-anchor="middle" class="atom">H</text>
  <text x="160" y="207" text-anchor="middle" class="atom">H</text>
  <text x="600" y="207" text-anchor="middle" class="atom">H</text>

  <!-- Methylpropane panel -->
  <rect x="60" y="310" width="680" height="270" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="90" y="336" class="label">Methylpropane — branched, C₄H₁₀</text>

  <!-- methylpropane bonds -->
  <line x1="292" y1="500" x2="388" y2="500" class="bond"/>
  <line x1="412" y1="500" x2="508" y2="500" class="bond"/>
  <line x1="400" y1="468" x2="400" y2="394" class="bond"/>
  <line x1="400" y1="366" x2="400" y2="340" class="bond"/>
  <line x1="388" y1="380" x2="374" y2="380" class="bond"/>
  <line x1="412" y1="380" x2="426" y2="380" class="bond"/>
  <line x1="280" y1="486" x2="280" y2="450" class="bond"/>
  <line x1="280" y1="514" x2="280" y2="530" class="bond"/>
  <line x1="268" y1="500" x2="254" y2="500" class="bond"/>
  <line x1="400" y1="514" x2="400" y2="530" class="bond"/>
  <line x1="520" y1="486" x2="520" y2="450" class="bond"/>
  <line x1="520" y1="514" x2="520" y2="530" class="bond"/>
  <line x1="532" y1="500" x2="546" y2="500" class="bond"/>

  <!-- methylpropane atoms -->
  <text x="280" y="507" text-anchor="middle" class="atom">C</text>
  <text x="400" y="507" text-anchor="middle" class="atom">C</text>
  <text x="520" y="507" text-anchor="middle" class="atom">C</text>
  <text x="400" y="387" text-anchor="middle" class="atom">C</text>
  <text x="400" y="337" text-anchor="middle" class="atom">H</text>
  <text x="362" y="387" text-anchor="middle" class="atom">H</text>
  <text x="440" y="387" text-anchor="middle" class="atom">H</text>
  <text x="280" y="447" text-anchor="middle" class="atom">H</text>
  <text x="280" y="549" text-anchor="middle" class="atom">H</text>
  <text x="242" y="507" text-anchor="middle" class="atom">H</text>
  <text x="400" y="549" text-anchor="middle" class="atom">H</text>
  <text x="520" y="447" text-anchor="middle" class="atom">H</text>
  <text x="520" y="549" text-anchor="middle" class="atom">H</text>
  <text x="558" y="507" text-anchor="middle" class="atom">H</text>
</svg>
