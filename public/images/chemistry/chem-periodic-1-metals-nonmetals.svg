<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Metals, Non-Metals and Metalloids</title>
  <desc id="desc">A simplified periodic table showing where metals, non-metals, and metalloids are found, plus a comparison of their typical properties.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .metal { fill: #bfdbfe; stroke: #3b82f6; stroke-width: 2; }
      .nonmetal { fill: #fed7aa; stroke: #f97316; stroke-width: 2; }
      .metalloid { fill: #e9d5ff; stroke: #a855f7; stroke-width: 2; }
      .check { fill: #22c55e; }
      .cross { fill: #ef4444; }
    </style>
  </defs>

  <rect width="900" height="480" fill="#f9fafb" rx="12"/>
  <text x="450" y="36" text-anchor="middle" class="title">Metals, Non-Metals and Metalloids</text>

  <!-- Left panel: periodic table regions -->
  <rect x="25" y="55" width="430" height="290" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="240" y="82" text-anchor="middle" class="panel-title">Where they are found in the periodic table</text>

  <g transform="translate(80, 110)">
    <!-- Metals block -->
    <rect x="0" y="0" width="120" height="160" rx="6" class="metal"/>
    <text x="60" y="85" text-anchor="middle" class="label">Metals</text>
    <text x="60" y="105" text-anchor="middle" class="sublabel">~80% of elements</text>

    <!-- Metalloid zigzag -->
    <polyline points="140,20 180,60 220,60 260,100 300,140" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="20" r="8" class="metalloid"/>
    <circle cx="180" cy="60" r="8" class="metalloid"/>
    <circle cx="220" cy="60" r="8" class="metalloid"/>
    <circle cx="260" cy="100" r="8" class="metalloid"/>
    <circle cx="300" cy="140" r="8" class="metalloid"/>
    <text x="160" y="15" class="label">Metalloids</text>
    <text x="160" y="30" class="sublabel">(B, Si, Ge, As, Sb, Te)</text>

    <!-- Non-metals block -->
    <rect x="330" y="0" width="80" height="160" rx="6" class="nonmetal"/>
    <text x="370" y="85" text-anchor="middle" class="label">Non-metals</text>
  </g>

  <!-- Zigzag label -->
  <line x1="380" y1="250" x2="380" y2="272" class="line"/>
  <rect x="290" y="272" width="180" height="36" rx="4" class="label-bg"/>
  <text x="380" y="288" text-anchor="middle" class="label">Zigzag boundary</text>
  <text x="380" y="302" text-anchor="middle" class="sublabel">separates metals / non-metals</text>

  <!-- Right panel: property comparison -->
  <rect x="475" y="55" width="400" height="290" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="675" y="82" text-anchor="middle" class="panel-title">Typical properties</text>

  <g transform="translate(500, 110)">
    <!-- Table header -->
    <rect x="0" y="0" width="120" height="30" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" class="label">Property</text>
    <rect x="120" y="0" width="80" height="30" class="metal"/>
    <text x="160" y="20" text-anchor="middle" class="label">Metal</text>
    <rect x="200" y="0" width="80" height="30" class="nonmetal"/>
    <text x="240" y="20" text-anchor="middle" class="label">Non-metal</text>

    <!-- Rows -->
    <rect x="0" y="30" width="120" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="48" class="sublabel">Appearance</text>
    <rect x="120" y="30" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="160" y="48" text-anchor="middle" class="sublabel">shiny</text>
    <rect x="200" y="30" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="48" text-anchor="middle" class="sublabel">dull</text>

    <rect x="0" y="58" width="120" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="76" class="sublabel">Conductivity</text>
    <rect x="120" y="58" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="160" y="76" text-anchor="middle" class="sublabel">good</text>
    <rect x="200" y="58" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="76" text-anchor="middle" class="sublabel">poor</text>

    <rect x="0" y="86" width="120" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="104" class="sublabel">Malleable / ductile</text>
    <rect x="120" y="86" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="160" y="104" text-anchor="middle" class="check">✓</text>
    <rect x="200" y="86" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="104" text-anchor="middle" class="cross">✗</text>

    <rect x="0" y="114" width="120" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="132" class="sublabel">Ion formed</text>
    <rect x="120" y="114" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="160" y="132" text-anchor="middle" class="sublabel">positive</text>
    <rect x="200" y="114" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="132" text-anchor="middle" class="sublabel">negative</text>

    <rect x="0" y="142" width="120" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="160" class="sublabel">Oxides</text>
    <rect x="120" y="142" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="160" y="160" text-anchor="middle" class="sublabel">basic</text>
    <rect x="200" y="142" width="80" height="28" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="160" text-anchor="middle" class="sublabel">acidic</text>
  </g>

  <!-- Bottom panel: metalloid highlight -->
  <rect x="25" y="360" width="850" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="8"/>
  <text x="450" y="385" text-anchor="middle" class="label">Metalloids: intermediate properties</text>
  <text x="450" y="405" text-anchor="middle" class="sublabel">Silicon (Si) is a semiconductor — it only conducts electricity under certain conditions.</text>
  <text x="450" y="422" text-anchor="middle" class="sublabel">Doped silicon is the foundation of transistors and computer chips.</text>
  <text x="450" y="440" text-anchor="middle" class="sublabel">Example equations: Na₂O + H₂O → 2NaOH (basic) · SO₂ + H₂O → H₂SO₃ (acidic)</text>
</svg>