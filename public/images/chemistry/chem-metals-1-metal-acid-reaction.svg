<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Metal Reacting with Acid</title>
  <desc id="desc">A conical flask containing a metal strip reacting with acid, producing hydrogen bubbles that are collected in an inverted measuring cylinder over water.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="760" height="480" fill="#f9fafb" rx="12"/>
  <text x="380" y="38" text-anchor="middle" class="title">Metal Reacting with Acid</text>

  <!-- Conical flask -->
  <g transform="translate(180, 140)">
    <!-- Liquid -->
    <path d="M50 120 L110 120 L95 210 L65 210 Z" fill="#dbeafe" opacity="0.7"/>
    <!-- Flask outline -->
    <path d="M40 40 L120 40 L100 110 L130 220 L30 220 L60 110 Z" fill="none" stroke="#64748b" stroke-width="3"/>
    <line x1="30" y1="220" x2="130" y2="220" stroke="#64748b" stroke-width="3"/>
    <!-- Metal strip -->
    <rect x="75" y="75" width="10" height="85" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
    <text x="80" y="70" text-anchor="middle" class="sublabel">Mg / Zn</text>

    <!-- Bubbles -->
    <g fill="none" stroke="#60a5fa" stroke-width="1.5">
      <circle cx="72" cy="150" r="4"/>
      <circle cx="88" cy="170" r="3"/>
      <circle cx="68" cy="185" r="5"/>
      <circle cx="95" cy="145" r="3"/>
      <circle cx="80" cy="195" r="4"/>
    </g>

    <!-- Delivery tube -->
    <line x1="80" y1="40" x2="80" y2="10" stroke="#64748b" stroke-width="4"/>
    <path d="M80 10 L260 10 L260 90" fill="none" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- Water trough -->
  <g transform="translate(380, 280)">
    <rect x="0" y="0" width="180" height="90" rx="4" fill="none" stroke="#64748b" stroke-width="3"/>
    <rect x="0" y="45" width="180" height="45" fill="#bfdbfe" opacity="0.5"/>
    <line x1="0" y1="45" x2="180" y2="45" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="80" text-anchor="middle" class="sublabel">Water trough</text>
  </g>

  <!-- Measuring cylinder -->
  <g transform="translate(420, 140)">
    <rect x="0" y="0" width="70" height="160" fill="#e0f2fe" opacity="0.3" stroke="#64748b" stroke-width="2"/>
    <!-- Water level inside cylinder -->
    <rect x="2" y="100" width="66" height="58" fill="#bfdbfe" opacity="0.6"/>
    <!-- Gas collected -->
    <rect x="2" y="5" width="66" height="95" fill="#fef3c7" opacity="0.5"/>
    <!-- Scale marks -->
    <g stroke="#64748b" stroke-width="1">
      <line x1="10" y1="20" x2="20" y2="20"/>
      <line x1="10" y1="50" x2="20" y2="50"/>
      <line x1="10" y1="80" x2="20" y2="80"/>
      <line x1="10" y1="110" x2="20" y2="110"/>
      <line x1="10" y1="140" x2="20" y2="140"/>
    </g>
  </g>

  <!-- Labels -->
  <line x1="170" y1="180" x2="80" y2="160" class="line"/>
  <rect x="20" y="145" width="78" height="32" rx="4" class="label-bg"/>
  <text x="24" y="162" class="label">Metal strip</text>
  <text x="24" y="174" class="sublabel">in acid</text>

  <line x1="300" y1="250" x2="360" y2="250" class="line"/>
  <rect x="362" y="241" width="96" height="18" rx="4" class="label-bg"/>
  <text x="366" y="254" class="label">Bubbles of H₂</text>

  <line x1="490" y1="140" x2="540" y2="120" class="line"/>
  <rect x="542" y="108" width="118" height="34" rx="4" class="label-bg"/>
  <text x="546" y="125" class="label">Hydrogen gas</text>
  <text x="546" y="139" class="sublabel">collected over water</text>

  <line x1="520" y1="280" x2="600" y2="300" class="line"/>
  <rect x="602" y="288" width="92" height="18" rx="4" class="label-bg"/>
  <text x="606" y="301" class="label">Water trough</text>

  <!-- Equation -->
  <rect x="130" y="405" width="500" height="50" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="380" y="428" text-anchor="middle" class="label">Metal + Acid → Salt + Hydrogen</text>
  <text x="380" y="446" text-anchor="middle" class="sublabel">Mg + 2HCl → MgCl₂ + H₂ (fast fizzing = more reactive)</text>
</svg>