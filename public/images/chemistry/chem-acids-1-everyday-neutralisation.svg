<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Everyday Acids, Bases and Neutralisation</title>
  <desc id="desc">Practical uses of neutralisation in agriculture, medicine, industry, personal care, food and dental health.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .beaker { fill: #e0f2fe; stroke: #475569; stroke-width: 2.5; }
      .liquid { fill: #bae6fd; opacity: 0.7; }
      .acid { fill: #ef4444; }
      .base { fill: #3b82f6; }
      .lime { fill: #a8a29e; }
      .tooth { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 2; }
    </style>
  </defs>

  <rect width="800" height="560" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">Everyday Acids, Bases and Neutralisation</text>

  <!-- Central equation -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="300" height="55" rx="8" class="box"/>
    <circle cx="45" cy="28" r="18" class="acid"/>
    <text x="45" y="32" text-anchor="middle" class="label" fill="white">Acid</text>
    <text x="90" y="32" text-anchor="middle" class="label">+</text>
    <circle cx="135" cy="28" r="18" class="base"/>
    <text x="135" y="32" text-anchor="middle" class="label" fill="white">Base</text>
    <text x="180" y="32" text-anchor="middle" class="label">→</text>
    <rect x="205" y="12" width="75" height="32" rx="6" fill="#22c55e"/>
    <text x="242" y="32" text-anchor="middle" class="label" fill="white">Salt + H₂O</text>
  </g>

  <!-- Agriculture -->
  <g transform="translate(70, 150)">
    <rect x="0" y="0" width="200" height="130" rx="10" class="box"/>
    <text x="100" y="22" text-anchor="middle" class="label">Agriculture</text>
    <path d="M40,100 L40,70 Q40,55 55,55 L75,55 L75,45 L85,55 L95,55 L95,70 L95,100 Z" fill="#22c55e" opacity="0.8"/>
    <rect x="110" y="60" width="50" height="40" rx="4" class="lime"/>
    <text x="135" y="84" text-anchor="middle" class="sublabel" fill="white">lime</text>
    <text x="100" y="120" text-anchor="middle" class="sublabel">Raise acidic soil pH to ~6–7</text>
  </g>

  <!-- Medicine -->
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="130" rx="10" class="box"/>
    <text x="100" y="22" text-anchor="middle" class="label">Medicine</text>
    <rect x="50" y="50" width="40" height="25" rx="6" fill="#f97316"/>
    <text x="70" y="66" text-anchor="middle" class="sublabel" fill="white">antacid</text>
    <text x="110" y="60" class="sublabel">neutralises</text>
    <text x="110" y="74" class="sublabel">stomach HCl</text>
    <text x="100" y="100" text-anchor="middle" class="sublabel">Mg(OH)₂ + 2HCl</text>
    <text x="100" y="116" text-anchor="middle" class="sublabel">→ MgCl₂ + 2H₂O</text>
  </g>

  <!-- Industry -->
  <g transform="translate(530, 150)">
    <rect x="0" y="0" width="200" height="130" rx="10" class="box"/>
    <text x="100" y="22" text-anchor="middle" class="label">Industry</text>
    <rect x="50" y="50" width="60" height="45" rx="4" fill="#64748b"/>
    <rect x="60" y="38" width="40" height="15" rx="2" fill="#94a3b8"/>
    <text x="125" y="56" class="sublabel">Treat acidic</text>
    <text x="125" y="70" class="sublabel">waste</text>
    <text x="100" y="110" text-anchor="middle" class="sublabel">Flue-gas desulfurisation</text>
  </g>

  <!-- Personal care -->
  <g transform="translate(70, 310)">
    <rect x="0" y="0" width="200" height="130" rx="10" class="box"/>
    <text x="100" y="22" text-anchor="middle" class="label">Personal care</text>
    <circle cx="55" cy="65" r="16" class="acid"/>
    <text x="55" y="69" text-anchor="middle" class="sublabel" fill="white">bee</text>
    <text x="90" y="58" class="sublabel">acidic sting</text>
    <text x="90" y="74" class="sublabel">→ baking soda</text>

    <circle cx="55" cy="105" r="16" class="base"/>
    <text x="55" y="109" text-anchor="middle" class="sublabel" fill="white">wasp</text>
    <text x="90" y="98" class="sublabel">alkaline sting</text>
    <text x="90" y="114" class="sublabel">→ vinegar</text>
  </g>

  <!-- Food -->
  <g transform="translate(300, 310)">
    <rect x="0" y="0" width="200" height="130" rx="10" class="box"/>
    <text x="100" y="22" text-anchor="middle" class="label">Food</text>
    <path d="M60,100 Q60,55 100,55 Q140,55 140,100 Z" fill="#fde047" stroke="#eab308" stroke-width="2"/>
    <rect x="115" y="60" width="45" height="25" rx="4" fill="#f97316"/>
    <text x="137" y="76" text-anchor="middle" class="sublabel" fill="white">NaHCO₃</text>
    <text x="100" y="120" text-anchor="middle" class="sublabel">Heating releases CO₂ → cakes rise</text>
  </g>

  <!-- Tooth decay -->
  <g transform="translate(530, 310)">
    <rect x="0" y="0" width="200" height="130" rx="10" class="box"/>
    <text x="100" y="22" text-anchor="middle" class="label">Dental health</text>
    <path d="M80,55 Q65,55 65,75 L65,100 Q65,115 80,110 Q95,115 95,100 L95,75 Q95,55 80,55 Z" class="tooth"/>
    <circle cx="75" cy="80" r="6" class="acid"/>
    <text x="98" y="70" class="sublabel">Bacteria make acid</text>
    <text x="98" y="86" class="sublabel">from sugar →</text>
    <text x="98" y="102" class="sublabel">dissolves enamel</text>
  </g>
</svg>
