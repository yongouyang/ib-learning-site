<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Potable Water Treatment</title>
  <desc id="desc">A diagram showing the stages of treating fresh water to make it potable, including screening, sedimentation, filtration, and sterilisation.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#f9fafb" rx="12"/>
  <text x="460" y="38" text-anchor="middle" class="title">Producing Potable Water</text>

  <!-- Source -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" class="label">Source</text>
    <text x="50" y="55" text-anchor="middle" class="sublabel">river /</text>
    <text x="50" y="75" text-anchor="middle" class="sublabel">reservoir /</text>
    <text x="50" y="95" text-anchor="middle" class="sublabel">groundwater</text>
  </g>

  <!-- Screening -->
  <g transform="translate(200, 160)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" class="label">Screening</text>
    <line x1="15" y1="55" x2="85" y2="55" stroke="#6b7280" stroke-width="2"/>
    <line x1="15" y1="75" x2="85" y2="75" stroke="#6b7280" stroke-width="2"/>
    <line x1="15" y1="95" x2="85" y2="95" stroke="#6b7280" stroke-width="2"/>
    <text x="50" y="115" text-anchor="middle" class="sublabel">remove debris</text>
  </g>

  <!-- Sedimentation -->
  <g transform="translate(340, 160)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" class="label">Sedimentation</text>
    <rect x="10" y="80" width="80" height="20" fill="#d1d5db"/>
    <text x="50" y="115" text-anchor="middle" class="sublabel">particles settle</text>
  </g>

  <!-- Filtration -->
  <g transform="translate(480, 160)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" class="label">Filtration</text>
    <rect x="10" y="50" width="80" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="85" y2="60" stroke="#d97706" stroke-width="1"/>
    <line x1="15" y1="70" x2="85" y2="70" stroke="#d97706" stroke-width="1"/>
    <line x1="15" y1="80" x2="85" y2="80" stroke="#d97706" stroke-width="1"/>
    <text x="50" y="115" text-anchor="middle" class="sublabel">sand &amp; gravel</text>
  </g>

  <!-- Sterilisation -->
  <g transform="translate(620, 160)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" class="label">Sterilisation</text>
    <text x="50" y="60" text-anchor="middle" class="sublabel">Cl₂ / O₃ / UV</text>
    <text x="50" y="80" text-anchor="middle" class="sublabel">kills microbes</text>
    <text x="50" y="115" text-anchor="middle" class="sublabel">safe to drink</text>
  </g>

  <!-- Potable water output -->
  <g transform="translate(760, 160)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" class="label">Potable</text>
    <text x="50" y="55" text-anchor="middle" class="sublabel">water safe</text>
    <text x="50" y="75" text-anchor="middle" class="sublabel">to drink</text>
    <text x="50" y="100" text-anchor="middle" class="sublabel">NOT pure H₂O</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="160" y1="220" x2="200" y2="220" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="220" x2="340" y2="220" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="440" y1="220" x2="480" y2="220" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="580" y1="220" x2="620" y2="220" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="720" y1="220" x2="760" y2="220" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>

  <!-- Desalination panel -->
  <rect x="60" y="330" width="380" height="180" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="250" y="365" text-anchor="middle" class="label" fill="#c2410c">Desalination (seawater)</text>
  <text x="80" y="400" class="sublabel">• Distillation — boil seawater and condense vapour</text>
  <text x="80" y="425" class="sublabel">• Reverse osmosis — force water through a</text>
  <text x="80" y="445" class="sublabel">  semipermeable membrane, leaving salt behind</text>
  <text x="80" y="475" class="sublabel">Energy-intensive and expensive; used in arid regions</text>

  <!-- Waste water panel -->
  <rect x="480" y="330" width="380" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="365" text-anchor="middle" class="label" fill="#1e40af">Waste water treatment</text>
  <text x="500" y="400" class="sublabel">1. Screening&#160;2. Primary sedimentation</text>
  <text x="500" y="425" class="sublabel">3. Biological treatment (aerobic bacteria)</text>
  <text x="500" y="450" class="sublabel">4. Final sedimentation&#160;5. Sterilisation</text>
  <text x="500" y="480" class="sublabel">Treated water can be safely released to rivers</text>
</svg>
