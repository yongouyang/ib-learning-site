<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Filtration and Evaporation</title>
  <desc id="desc">Two laboratory setups: filtration with a funnel and filter paper separating an insoluble solid from a liquid, and evaporation heating a solution in an evaporating dish.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .glass { fill: #e0f2fe; stroke: #60a5fa; stroke-width: 2; opacity: 0.6; }
      .beaker-rim { fill: none; stroke: #60a5fa; stroke-width: 2; }
    </style>
  </defs>

  <rect width="880" height="420" fill="#f9fafb" rx="12"/>
  <text x="440" y="34" text-anchor="middle" class="title">Filtration and Evaporation</text>

  <!-- Filtration panel -->
  <rect x="25" y="55" width="405" height="350" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="227" y="82" text-anchor="middle" class="panel-title">Filtration</text>

  <!-- Retort stand -->
  <line x1="80" y1="120" x2="80" y2="360" stroke="#4b5563" stroke-width="4"/>
  <line x1="80" y1="140" x2="180" y2="140" stroke="#4b5563" stroke-width="4"/>
  <line x1="180" y1="140" x2="180" y2="175" stroke="#4b5563" stroke-width="3"/>
  <ellipse cx="180" cy="178" rx="18" ry="5" fill="none" stroke="#4b5563" stroke-width="2"/>

  <!-- Funnel -->
  <path d="M160,175 L200,175 L185,240 L175,240 Z" fill="#e0f2fe" stroke="#60a5fa" stroke-width="2"/>
  <!-- Filter paper -->
  <path d="M164,178 L196,178 L186,235 L174,235 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Solid particles on paper -->
  <g fill="#9ca3af">
    <circle cx="175" cy="205" r="4"/>
    <circle cx="185" cy="210" r="4"/>
    <circle cx="180" cy="198" r="4"/>
    <circle cx="170" cy="215" r="4"/>
    <circle cx="190" cy="200" r="4"/>
  </g>

  <!-- Beaker below -->
  <path d="M145,250 L145,330 L225,330 L225,250" class="glass"/>
  <path d="M142,250 L228,250" class="beaker-rim"/>
  <path d="M145,285 L225,285" fill="#bae6fd" stroke="none" opacity="0.7"/>
  <text x="185" y="310" text-anchor="middle" class="sublabel" fill="#1e3a8a">Filtrate</text>

  <!-- Labels -->
  <line x1="205" y1="200" x2="280" y2="180" class="line"/>
  <rect x="282" y="171" width="120" height="18" rx="4" class="label-bg"/>
  <text x="286" y="183" class="label">Residue (solid)</text>

  <line x1="215" y1="305" x2="300" y2="325" class="line"/>
  <rect x="302" y="316" width="110" height="18" rx="4" class="label-bg"/>
  <text x="306" y="328" class="label">Filtrate (liquid)</text>

  <!-- Evaporation panel -->
  <rect x="450" y="55" width="405" height="350" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="652" y="82" text-anchor="middle" class="panel-title">Evaporation</text>

  <!-- Bunsen burner -->
  <rect x="610" y="310" width="16" height="40" fill="#4b5563"/>
  <rect x="600" y="295" width="36" height="15" fill="#6b7280" rx="3"/>
  <path d="M610,295 Q618,275 626,295" fill="#f97316" opacity="0.8"/>
  <path d="M614,290 Q618,270 622,290" fill="#f97316" opacity="0.8"/>
  <text x="618" y="375" text-anchor="middle" class="sublabel">Heat</text>

  <!-- Tripod -->
  <line x1="560" y1="350" x2="595" y2="300" stroke="#4b5563" stroke-width="3"/>
  <line x1="676" y1="350" x2="641" y2="300" stroke="#4b5563" stroke-width="3"/>
  <line x1="560" y1="350" x2="676" y2="350" stroke="#4b5563" stroke-width="3"/>
  <line x1="570" y1="330" x2="666" y2="330" stroke="#9ca3af" stroke-width="2"/>

  <!-- Evaporating dish -->
  <ellipse cx="618" cy="295" rx="70" ry="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <path d="M548,295 L548,305 Q618,335 688,305 L688,295" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <!-- Solution level -->
  <ellipse cx="618" cy="300" rx="60" ry="14" fill="#bae6fd" opacity="0.7"/>
  <!-- Salt crystals forming -->
  <g fill="#e5e7eb">
    <circle cx="590" cy="300" r="3"/>
    <circle cx="610" cy="305" r="3"/>
    <circle cx="630" cy="298" r="3"/>
    <circle cx="645" cy="304" r="3"/>
  </g>

  <!-- Labels -->
  <line x1="540" y1="290" x2="470" y2="260" class="line"/>
  <rect x="350" y="251" width="110" height="18" rx="4" class="label-bg"/>
  <text x="354" y="263" class="label">Evaporating dish</text>

  <line x1="688" y1="300" x2="740" y2="280" class="line"/>
  <rect x="742" y="271" width="100" height="18" rx="4" class="label-bg"/>
  <text x="746" y="283" class="label">Solute remains</text>

  <text x="652" y="160" text-anchor="middle" class="sublabel">Solvent evaporates, leaving</text>
  <text x="652" y="178" text-anchor="middle" class="sublabel">the solid solute behind.</text>
</svg>