<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Isotopes of Carbon and Relative Atomic Mass</title>
  <desc id="desc">Diagram showing carbon-12, carbon-13 and carbon-14 as isotopes with the same number of protons but different numbers of neutrons, plus the chlorine relative atomic mass calculation.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .proton { fill: #f97316; }
      .neutron { fill: #64748b; }
      .nucleus-outline { fill: none; stroke: #374151; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Isotopes and Relative Atomic Mass</text>

  <!-- Key: colour-coded particles -->
  <g transform="translate(700, 52)">
    <rect x="0" y="0" width="170" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="8" class="proton"/>
    <text x="36" y="22" class="label">proton</text>
    <circle cx="20" cy="42" r="8" class="neutron"/>
    <text x="36" y="46" class="label">neutron</text>
  </g>

  <!-- Carbon-12 -->
  <g transform="translate(160, 180)">
    <circle cx="0" cy="0" r="55" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
    <circle cx="-8" cy="-8" r="8" class="proton"/>
    <circle cx="8" cy="-8" r="8" class="proton"/>
    <circle cx="-8" cy="8" r="8" class="proton"/>
    <circle cx="8" cy="8" r="8" class="proton"/>
    <circle cx="-18" cy="0" r="8" class="proton"/>
    <circle cx="18" cy="0" r="8" class="proton"/>
    <circle cx="0" cy="-20" r="8" class="neutron"/>
    <circle cx="0" cy="20" r="8" class="neutron"/>
    <circle cx="-16" cy="-16" r="8" class="neutron"/>
    <circle cx="16" cy="16" r="8" class="neutron"/>
    <circle cx="-16" cy="16" r="8" class="neutron"/>
    <circle cx="16" cy="-16" r="8" class="neutron"/>
    <text x="0" y="90" text-anchor="middle" class="label">Carbon-12</text>
    <text x="0" y="106" text-anchor="middle" class="sublabel">6p + 6n</text>
  </g>

  <!-- Carbon-13 -->
  <g transform="translate(450, 180)">
    <circle cx="0" cy="0" r="55" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
    <circle cx="-8" cy="-8" r="8" class="proton"/>
    <circle cx="8" cy="-8" r="8" class="proton"/>
    <circle cx="-8" cy="8" r="8" class="proton"/>
    <circle cx="8" cy="8" r="8" class="proton"/>
    <circle cx="-18" cy="0" r="8" class="proton"/>
    <circle cx="18" cy="0" r="8" class="proton"/>
    <circle cx="0" cy="-20" r="8" class="neutron"/>
    <circle cx="0" cy="20" r="8" class="neutron"/>
    <circle cx="-16" cy="-16" r="8" class="neutron"/>
    <circle cx="16" cy="16" r="8" class="neutron"/>
    <circle cx="-16" cy="16" r="8" class="neutron"/>
    <circle cx="16" cy="-16" r="8" class="neutron"/>
    <circle cx="22" cy="-6" r="8" class="neutron"/>
    <text x="0" y="90" text-anchor="middle" class="label">Carbon-13</text>
    <text x="0" y="106" text-anchor="middle" class="sublabel">6p + 7n</text>
  </g>

  <!-- Carbon-14 -->
  <g transform="translate(740, 180)">
    <circle cx="0" cy="0" r="55" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
    <circle cx="-8" cy="-8" r="8" class="proton"/>
    <circle cx="8" cy="-8" r="8" class="proton"/>
    <circle cx="-8" cy="8" r="8" class="proton"/>
    <circle cx="8" cy="8" r="8" class="proton"/>
    <circle cx="-18" cy="0" r="8" class="proton"/>
    <circle cx="18" cy="0" r="8" class="proton"/>
    <circle cx="0" cy="-20" r="8" class="neutron"/>
    <circle cx="0" cy="20" r="8" class="neutron"/>
    <circle cx="-16" cy="-16" r="8" class="neutron"/>
    <circle cx="16" cy="16" r="8" class="neutron"/>
    <circle cx="-16" cy="16" r="8" class="neutron"/>
    <circle cx="16" cy="-16" r="8" class="neutron"/>
    <circle cx="22" cy="-6" r="8" class="neutron"/>
    <circle cx="-22" cy="6" r="8" class="neutron"/>
    <text x="0" y="90" text-anchor="middle" class="label">Carbon-14</text>
    <text x="0" y="106" text-anchor="middle" class="sublabel">6p + 8n (radioactive)</text>
  </g>

  <!-- Key point: same protons -->
  <rect x="230" y="60" width="440" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="450" y="82" text-anchor="middle" class="sublabel">All isotopes of carbon have 6 protons — the atomic number never changes.</text>

  <!-- Chlorine calculation -->
  <g transform="translate(180, 360)">
    <rect x="0" y="0" width="540" height="130" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="270" y="30" text-anchor="middle" class="label">Relative Atomic Mass of Chlorine</text>
    <text x="270" y="58" text-anchor="middle" class="sublabel">75% ³⁵Cl and 25% ³⁷Cl</text>
    <text x="270" y="88" text-anchor="middle" class="label">Aᵣ = (75 × 35 + 25 × 37) ÷ 100 = 35.5</text>
    <text x="270" y="112" text-anchor="middle" class="sublabel">A ratio with no units, compared to 1/12 the mass of carbon-12.</text>
  </g>
</svg>