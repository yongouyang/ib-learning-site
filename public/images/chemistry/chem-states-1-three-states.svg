<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">The Three States of Matter</title>
  <desc id="desc">A diagram comparing the arrangement and motion of particles in solids, liquids, and gases using the particle model.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .container { fill: none; stroke: #6b7280; stroke-width: 2; }
      .arrow { fill: none; stroke: #f97316; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="motion-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="920" height="420" fill="#f9fafb" rx="12"/>
  <text x="460" y="38" text-anchor="middle" class="title">The Three States of Matter</text>

  <!-- Solid panel -->
  <rect x="40" y="55" width="270" height="330" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="175" y="82" text-anchor="middle" class="panel-title">Solid</text>

  <rect x="70" y="105" width="210" height="210" class="container" rx="4"/>
  <g fill="#3b82f6">
    <circle cx="95" cy="130" r="11"/><circle cx="130" cy="130" r="11"/><circle cx="165" cy="130" r="11"/><circle cx="200" cy="130" r="11"/><circle cx="235" cy="130" r="11"/>
    <circle cx="95" cy="165" r="11"/><circle cx="130" cy="165" r="11"/><circle cx="165" cy="165" r="11"/><circle cx="200" cy="165" r="11"/><circle cx="235" cy="165" r="11"/>
    <circle cx="95" cy="200" r="11"/><circle cx="130" cy="200" r="11"/><circle cx="165" cy="200" r="11"/><circle cx="200" cy="200" r="11"/><circle cx="235" cy="200" r="11"/>
    <circle cx="95" cy="235" r="11"/><circle cx="130" cy="235" r="11"/><circle cx="165" cy="235" r="11"/><circle cx="200" cy="235" r="11"/><circle cx="235" cy="235" r="11"/>
    <circle cx="95" cy="270" r="11"/><circle cx="130" cy="270" r="11"/><circle cx="165" cy="270" r="11"/><circle cx="200" cy="270" r="11"/><circle cx="235" cy="270" r="11"/>
  </g>
  <!-- Vibration arrows -->
  <line x1="95" y1="115" x2="95" y2="105" class="arrow" marker-end="url(#motion-arrow)"/>
  <line x1="130" y1="115" x2="130" y2="105" class="arrow" marker-end="url(#motion-arrow)"/>
  <line x1="165" y1="115" x2="165" y2="105" class="arrow" marker-end="url(#motion-arrow)"/>

  <text x="175" y="345" text-anchor="middle" class="sublabel">Tightly packed in regular rows</text>
  <text x="175" y="362" text-anchor="middle" class="sublabel">Vibrate in fixed positions</text>

  <text x="175" y="400" text-anchor="middle" class="label">Fixed shape &amp; volume</text>

  <!-- Liquid panel -->
  <rect x="325" y="55" width="270" height="330" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="460" y="82" text-anchor="middle" class="panel-title">Liquid</text>

  <rect x="355" y="105" width="210" height="210" class="container" rx="4"/>
  <path d="M355 175 Q380 170 405 175 T455 172 T505 176 T555 173 T565 175" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <g fill="#3b82f6">
    <circle cx="385" cy="200" r="11"/><circle cx="425" cy="190" r="11"/><circle cx="465" cy="210" r="11"/><circle cx="505" cy="185" r="11"/>
    <circle cx="405" cy="235" r="11"/><circle cx="445" cy="255" r="11"/><circle cx="485" cy="240" r="11"/><circle cx="525" cy="260" r="11"/>
    <circle cx="375" cy="260" r="11"/><circle cx="415" cy="280" r="11"/><circle cx="465" cy="285" r="11"/><circle cx="515" cy="290" r="11"/>
    <circle cx="395" cy="300" r="11"/><circle cx="445" cy="305" r="11"/><circle cx="495" cy="300" r="11"/>
  </g>
  <!-- Flow arrows -->
  <path d="M405 150 Q425 140 445 150" class="arrow" fill="none" marker-end="url(#motion-arrow)"/>
  <path d="M485 150 Q505 160 525 150" class="arrow" fill="none" marker-end="url(#motion-arrow)"/>

  <text x="460" y="345" text-anchor="middle" class="sublabel">Close together but random</text>
  <text x="460" y="362" text-anchor="middle" class="sublabel">Slide past each other</text>

  <text x="460" y="400" text-anchor="middle" class="label">Fixed volume, no fixed shape</text>

  <!-- Gas panel -->
  <rect x="610" y="55" width="270" height="330" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="745" y="82" text-anchor="middle" class="panel-title">Gas</text>

  <rect x="640" y="105" width="210" height="210" class="container" rx="4"/>
  <g fill="#f97316">
    <circle cx="670" cy="140" r="10"/><circle cx="735" cy="125" r="10"/><circle cx="805" cy="150" r="10"/><circle cx="690" cy="190" r="10"/>
    <circle cx="760" cy="200" r="10"/><circle cx="825" cy="185" r="10"/><circle cx="715" cy="250" r="10"/><circle cx="790" cy="265" r="10"/>
    <circle cx="660" cy="285" r="10"/><circle cx="830" cy="290" r="10"/><circle cx="745" cy="295" r="10"/>
  </g>
  <!-- Motion arrows -->
  <line x1="670" y1="140" x2="645" y2="125" class="arrow" marker-end="url(#motion-arrow)"/>
  <line x1="735" y1="125" x2="760" y2="100" class="arrow" marker-end="url(#motion-arrow)"/>
  <line x1="805" y1="150" x2="835" y2="135" class="arrow" marker-end="url(#motion-arrow)"/>
  <line x1="690" y1="190" x2="670" y2="170" class="arrow" marker-end="url(#motion-arrow)"/>
  <line x1="760" y1="200" x2="785" y2="220" class="arrow" marker-end="url(#motion-arrow)"/>

  <text x="745" y="345" text-anchor="middle" class="sublabel">Far apart, move rapidly</text>
  <text x="745" y="362" text-anchor="middle" class="sublabel">Random motion in all directions</text>

  <text x="745" y="400" text-anchor="middle" class="label">No fixed shape or volume</text>
</svg>