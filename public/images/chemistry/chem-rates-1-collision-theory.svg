<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Collision theory requirements</title>
  <desc id="desc">Diagram showing that a reaction only happens when particles collide with enough energy and the correct orientation.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .arrow { fill: none; stroke: #6b7280; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .particle-a { fill: #3b82f6; }
      .particle-b { fill: #f97316; }
      .particle-grey { fill: #9ca3af; }
      .bg { fill: #f9fafb; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L1.5,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="880" height="520" class="bg" rx="12"/>
  <text x="440" y="38" text-anchor="middle" class="title">Collision Theory: Requirements for a Reaction</text>

  <!-- Unsuccessful collision panel -->
  <rect x="60" y="70" width="360" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="240" y="105" text-anchor="middle" class="label">Unsuccessful collision</text>
  <text x="240" y="125" text-anchor="middle" class="sublabel">low energy or wrong orientation</text>

  <circle cx="160" cy="240" r="36" class="particle-grey"/>
  <circle cx="300" cy="240" r="36" class="particle-grey"/>

  <line x1="110" y1="240" x2="124" y2="240" class="arrow" stroke-dasharray="5,4" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="240" x2="336" y2="240" class="arrow" stroke-dasharray="5,4" marker-end="url(#arrowhead)"/>

  <path d="M160 285 Q140 340 100 330" class="arrow" stroke-dasharray="5,4" marker-end="url(#arrowhead)"/>
  <path d="M300 285 Q320 340 360 330" class="arrow" stroke-dasharray="5,4" marker-end="url(#arrowhead)"/>

  <line x1="160" y1="285" x2="120" y2="380" class="line"/>
  <rect x="60" y="385" width="110" height="20" rx="4" fill="#f9fafb"/>
  <text x="115" y="399" text-anchor="middle" class="sublabel">No reaction</text>

  <line x1="300" y1="285" x2="360" y2="380" class="line"/>
  <rect x="305" y="385" width="110" height="20" rx="4" fill="#f9fafb"/>
  <text x="360" y="399" text-anchor="middle" class="sublabel">Bounce apart</text>

  <line x1="240" y1="150" x2="240" y2="190" class="line"/>
  <rect x="170" y="130" width="140" height="18" rx="4" fill="#f9fafb"/>
  <text x="240" y="143" text-anchor="middle" class="sublabel">Requirements not met</text>

  <!-- Successful collision panel -->
  <rect x="460" y="70" width="360" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="640" y="105" text-anchor="middle" class="label">Successful collision</text>
  <text x="640" y="125" text-anchor="middle" class="sublabel">enough energy + correct orientation</text>

  <line x1="520" y1="240" x2="594" y2="240" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="760" y1="240" x2="686" y2="240" class="arrow" marker-end="url(#arrowhead)"/>

  <circle cx="620" cy="240" r="36" class="particle-a"/>
  <circle cx="660" cy="240" r="36" class="particle-b"/>

  <g transform="translate(640,320)">
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="-24" cy="0" r="20" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="24" cy="0" r="20" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="52" text-anchor="middle" class="label" fill="#92400e">Product</text>
  </g>

  <line x1="640" y1="388" x2="640" y2="410" class="line"/>
  <rect x="580" y="415" width="120" height="20" rx="4" fill="#f9fafb"/>
  <text x="640" y="429" text-anchor="middle" class="sublabel">New substance formed</text>

  <line x1="640" y1="150" x2="640" y2="190" class="line"/>
  <rect x="575" y="130" width="130" height="18" rx="4" fill="#f9fafb"/>
  <text x="640" y="143" text-anchor="middle" class="sublabel">All three conditions met</text>
</svg>