<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Exothermic and Endothermic Energy Profiles</title>
  <desc id="desc">Two energy profile diagrams side by side: an exothermic reaction releasing energy and an endothermic reaction absorbing energy.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .axis { stroke: #4b5563; stroke-width: 2; fill: none; }
      .curve { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Exothermic and Endothermic Reactions</text>

  <!-- Exothermic panel -->
  <rect x="40" y="55" width="355" height="420" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="217" y="82" text-anchor="middle" class="panel-title">Exothermic</text>

  <!-- Axes -->
  <line x1="90" y1="390" x2="330" y2="390" class="axis"/>
  <line x1="90" y1="390" x2="90" y2="110" class="axis"/>
  <text x="70" y="110" class="label">Energy</text>
  <text x="330" y="415" class="label">Progress</text>

  <!-- Reactants / products levels -->
  <line x1="110" y1="180" x2="160" y2="180" class="line"/>
  <line x1="260" y1="280" x2="310" y2="280" class="line"/>

  <!-- Curve -->
  <path d="M120,180 Q170,100 210,230 T300,280" class="curve" stroke="#ef4444"/>

  <!-- Labels -->
  <rect x="75" y="165" width="78" height="18" rx="4" class="label-bg"/>
  <text x="79" y="178" class="label" fill="#991b1b">Reactants</text>

  <rect x="255" y="290" width="74" height="18" rx="4" class="label-bg"/>
  <text x="259" y="303" class="label" fill="#7f1d1d">Products</text>

  <!-- Activation energy -->
  <line x1="90" y1="120" x2="210" y2="120" class="line"/>
  <rect x="130" y="95" width="120" height="18" rx="4" class="label-bg"/>
  <text x="134" y="108" class="sublabel" fill="#4b5563">Activation energy</text>

  <!-- Delta H arrow -->
  <line x1="150" y1="230" x2="150" y2="280" class="arrow" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <rect x="155" y="245" width="70" height="18" rx="4" class="label-bg"/>
  <text x="159" y="258" class="label" fill="#b91c1c">Energy out</text>

  <text x="217" y="360" text-anchor="middle" class="sublabel">Temperature of surroundings rises.</text>

  <!-- Endothermic panel -->
  <rect x="405" y="55" width="355" height="420" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="582" y="82" text-anchor="middle" class="panel-title">Endothermic</text>

  <!-- Axes -->
  <line x1="455" y1="390" x2="695" y2="390" class="axis"/>
  <line x1="455" y1="390" x2="455" y2="110" class="axis"/>
  <text x="435" y="110" class="label">Energy</text>
  <text x="695" y="415" class="label">Progress</text>

  <!-- Reactants / products levels -->
  <line x1="475" y1="280" x2="525" y2="280" class="line"/>
  <line x1="625" y1="180" x2="675" y2="180" class="line"/>

  <!-- Curve -->
  <path d="M485,280 Q535,100 575,230 T665,180" class="curve" stroke="#3b82f6"/>

  <!-- Labels -->
  <rect x="470" y="290" width="78" height="18" rx="4" class="label-bg"/>
  <text x="474" y="303" class="label" fill="#1e3a8a">Reactants</text>

  <rect x="620" y="165" width="74" height="18" rx="4" class="label-bg"/>
  <text x="624" y="178" class="label" fill="#1e3a8a">Products</text>

  <!-- Activation energy -->
  <line x1="455" y1="120" x2="575" y2="120" class="line"/>
  <rect x="500" y="95" width="120" height="18" rx="4" class="label-bg"/>
  <text x="504" y="108" class="sublabel" fill="#4b5563">Activation energy</text>

  <!-- Delta H arrow -->
  <line x1="515" y1="280" x2="515" y2="230" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <rect x="520" y="245" width="70" height="18" rx="4" class="label-bg"/>
  <text x="524" y="258" class="label" fill="#1d4ed8">Energy in</text>

  <text x="582" y="360" text-anchor="middle" class="sublabel">Temperature of surroundings falls.</text>

  <!-- Bottom summary -->
  <rect x="120" y="450" width="560" height="34" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="6"/>
  <text x="400" y="471" text-anchor="middle" class="sublabel" fill="#7c2d12">Bond breaking needs energy; bond making releases energy. The difference decides the overall change.</text>
</svg>
