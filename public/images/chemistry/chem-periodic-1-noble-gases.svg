<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Group 18 Noble Gases</title>
  <desc id="desc">Electron shell diagrams of helium, neon, and argon showing full outer shells, plus common uses of noble gases.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .nucleus { fill: #f59e0b; stroke: #d97706; stroke-width: 2; }
      .shell { fill: none; stroke: #9ca3af; stroke-width: 2; }
      .electron { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 1; }
      .full-shell { fill: none; stroke: #22c55e; stroke-width: 3; }
      .balloon { fill: #bfdbfe; stroke: #3b82f6; stroke-width: 2; fill-opacity: 0.5; }
      .bulb { fill: #fde68a; stroke: #f59e0b; stroke-width: 2; }
      .sign { fill: #fca5a5; stroke: #ef4444; stroke-width: 2; }
    </style>
  </defs>

  <rect width="900" height="460" fill="#f9fafb" rx="12"/>
  <text x="450" y="36" text-anchor="middle" class="title">Group 18: The Noble Gases</text>

  <!-- Left panel: electron shells -->
  <rect x="25" y="55" width="430" height="290" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="240" y="82" text-anchor="middle" class="panel-title">Full outer electron shells</text>

  <!-- Helium -->
  <g transform="translate(110, 200)">
    <circle cx="0" cy="0" r="28" class="full-shell"/>
    <circle cx="0" cy="0" r="12" class="nucleus"/>
    <text x="0" y="4" text-anchor="middle" class="sublabel" fill="white">He</text>
    <circle cx="0" cy="-16" r="5" class="electron"/>
    <circle cx="0" cy="16" r="5" class="electron"/>
  </g>
  <text x="110" y="270" text-anchor="middle" class="label">Helium</text>
  <text x="110" y="284" text-anchor="middle" class="sublabel">2 electrons</text>

  <!-- Neon -->
  <g transform="translate(240, 200)">
    <circle cx="0" cy="0" r="45" class="full-shell"/>
    <circle cx="0" cy="0" r="22" class="shell"/>
    <circle cx="0" cy="0" r="10" class="nucleus"/>
    <text x="0" y="4" text-anchor="middle" class="sublabel" fill="white">Ne</text>
    <!-- inner -->
    <circle cx="0" cy="-12" r="4" class="electron"/>
    <circle cx="0" cy="12" r="4" class="electron"/>
    <!-- outer -->
    <circle cx="0" cy="-32" r="5" class="electron"/>
    <circle cx="22" cy="-22" r="5" class="electron"/>
    <circle cx="32" cy="0" r="5" class="electron"/>
    <circle cx="22" cy="22" r="5" class="electron"/>
    <circle cx="0" cy="32" r="5" class="electron"/>
    <circle cx="-22" cy="22" r="5" class="electron"/>
    <circle cx="-32" cy="0" r="5" class="electron"/>
    <circle cx="-22" cy="-22" r="5" class="electron"/>
  </g>
  <text x="240" y="285" text-anchor="middle" class="label">Neon</text>
  <text x="240" y="299" text-anchor="middle" class="sublabel">2,8</text>

  <!-- Argon -->
  <g transform="translate(370, 200)">
    <circle cx="0" cy="0" r="60" class="full-shell"/>
    <circle cx="0" cy="0" r="38" class="shell"/>
    <circle cx="0" cy="0" r="18" class="shell"/>
    <circle cx="0" cy="0" r="10" class="nucleus"/>
    <text x="0" y="4" text-anchor="middle" class="sublabel" fill="white">Ar</text>
    <!-- outer electron only -->
    <circle cx="0" cy="-48" r="5" class="electron"/>
    <circle cx="34" cy="-34" r="5" class="electron"/>
    <circle cx="48" cy="0" r="5" class="electron"/>
    <circle cx="34" cy="34" r="5" class="electron"/>
    <circle cx="0" cy="48" r="5" class="electron"/>
    <circle cx="-34" cy="34" r="5" class="electron"/>
    <circle cx="-48" cy="0" r="5" class="electron"/>
    <circle cx="-34" cy="-34" r="5" class="electron"/>
  </g>
  <text x="370" y="300" text-anchor="middle" class="label">Argon</text>
  <text x="370" y="314" text-anchor="middle" class="sublabel">2,8,8</text>

  <!-- Right panel: uses -->
  <rect x="475" y="55" width="400" height="290" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="675" y="82" text-anchor="middle" class="panel-title">Uses of noble gases</text>

  <!-- Helium balloon -->
  <g transform="translate(575, 170)">
    <ellipse cx="0" cy="0" rx="45" ry="55" class="balloon"/>
    <path d="M0,55 L0,85" stroke="#6b7280" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" class="label">He</text>
    <text x="0" y="10" text-anchor="middle" class="sublabel">balloons</text>
  </g>
  <line x1="575" y1="230" x2="575" y2="260" class="line"/>
  <rect x="520" y="260" width="110" height="36" rx="4" class="label-bg"/>
  <text x="575" y="278" text-anchor="middle" class="label">Helium</text>
  <text x="575" y="290" text-anchor="middle" class="sublabel">non-flammable</text>

  <!-- Argon bulb -->
  <g transform="translate(675, 170)">
    <circle cx="0" cy="0" r="32" class="bulb"/>
    <rect x="-10" y="32" width="20" height="12" rx="2" fill="#9ca3af"/>
    <line x1="-18" y1="-8" x2="18" y2="8" stroke="#d97706" stroke-width="2"/>
    <line x1="-18" y1="8" x2="18" y2="-8" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-40" text-anchor="middle" class="label">Ar</text>
  </g>
  <line x1="675" y1="210" x2="675" y2="260" class="line"/>
  <rect x="635" y="260" width="80" height="36" rx="4" class="label-bg"/>
  <text x="675" y="278" text-anchor="middle" class="label">Argon</text>
  <text x="675" y="290" text-anchor="middle" class="sublabel">light bulbs</text>

  <!-- Neon sign -->
  <g transform="translate(775, 170)">
    <rect x="-35" y="-25" width="70" height="50" rx="6" class="sign"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">Ne</text>
  </g>
  <line x1="775" y1="200" x2="775" y2="260" class="line"/>
  <rect x="740" y="260" width="70" height="36" rx="4" class="label-bg"/>
  <text x="775" y="278" text-anchor="middle" class="label">Neon</text>
  <text x="775" y="290" text-anchor="middle" class="sublabel">signs</text>

  <!-- Key idea -->
  <rect x="25" y="360" width="850" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="8"/>
  <text x="450" y="385" text-anchor="middle" class="label">Why are noble gases unreactive?</text>
  <text x="450" y="405" text-anchor="middle" class="sublabel">Full outer shells mean they have no tendency to gain, lose, or share electrons.</text>
  <text x="450" y="422" text-anchor="middle" class="sublabel">They are already at maximum stability.</text>
</svg>