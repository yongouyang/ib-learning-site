<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <title id="title">Heating Curve</title>
  <desc id="desc">A heating curve graph showing temperature against time, with labelled warming slopes and melting and boiling plateaus.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .axis { stroke: #374151; stroke-width: 2; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .curve { fill: none; stroke: #f97316; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .plateau { fill: none; stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6,4; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="840" height="520" fill="#f9fafb" rx="12"/>
  <text x="420" y="38" text-anchor="middle" class="title">Heating Curve: Temperature vs Time</text>

  <!-- Grid -->
  <g opacity="0.6">
    <line x1="100" y1="90" x2="760" y2="90" class="grid"/>
    <line x1="100" y1="150" x2="760" y2="150" class="grid"/>
    <line x1="100" y1="210" x2="760" y2="210" class="grid"/>
    <line x1="100" y1="270" x2="760" y2="270" class="grid"/>
    <line x1="100" y1="330" x2="760" y2="330" class="grid"/>
    <line x1="100" y1="390" x2="760" y2="390" class="grid"/>
    <line x1="180" y1="80" x2="180" y2="430" class="grid"/>
    <line x1="280" y1="80" x2="280" y2="430" class="grid"/>
    <line x1="380" y1="80" x2="380" y2="430" class="grid"/>
    <line x1="480" y1="80" x2="480" y2="430" class="grid"/>
    <line x1="580" y1="80" x2="580" y2="430" class="grid"/>
    <line x1="680" y1="80" x2="680" y2="430" class="grid"/>
  </g>

  <!-- Axes -->
  <line x1="100" y1="430" x2="760" y2="430" class="axis" marker-end="url(#arrow-axis)"/>
  <line x1="100" y1="430" x2="100" y2="70" class="axis" marker-end="url(#arrow-axis)"/>

  <text x="430" y="470" text-anchor="middle" class="label">Time →</text>
  <text x="60" y="250" text-anchor="middle" class="label" transform="rotate(-90 60 250)">Temperature →</text>

  <!-- Y-axis labels -->
  <text x="90" y="435" text-anchor="end" class="sublabel">0</text>
  <text x="90" y="375" text-anchor="end" class="sublabel">25</text>
  <text x="90" y="315" text-anchor="end" class="sublabel">50</text>
  <text x="90" y="255" text-anchor="end" class="sublabel">75</text>
  <text x="90" y="195" text-anchor="end" class="sublabel">100</text>
  <text x="90" y="135" text-anchor="end" class="sublabel">125</text>
  <text x="90" y="75" text-anchor="end" class="sublabel">150</text>

  <!-- Curve -->
  <polyline points="100,390 180,330 260,270 340,270 420,210 500,150 580,150 660,90 760,70" class="curve"/>

  <!-- Plateau highlights -->
  <line x1="260" y1="270" x2="340" y2="270" class="plateau"/>
  <line x1="500" y1="150" x2="580" y2="150" class="plateau"/>

  <!-- Labels -->
  <rect x="110" y="345" width="90" height="18" rx="4" class="label-bg"/>
  <text x="116" y="357" class="label">Solid warms</text>

  <rect x="255" y="220" width="90" height="34" rx="4" class="label-bg"/>
  <text x="260" y="235" class="label">Melting</text>
  <text x="260" y="249" class="sublabel">(latent heat)</text>

  <rect x="360" y="200" width="90" height="18" rx="4" class="label-bg"/>
  <text x="366" y="212" class="label">Liquid warms</text>

  <rect x="495" y="100" width="90" height="34" rx="4" class="label-bg"/>
  <text x="500" y="115" class="label">Boiling</text>
  <text x="500" y="129" class="sublabel">(latent heat)</text>

  <rect x="640" y="80" width="85" height="18" rx="4" class="label-bg"/>
  <text x="646" y="92" class="label">Gas warms</text>

  <!-- Leader lines -->
  <line x1="200" y1="340" x2="200" y2="360" class="line"/>
  <line x1="300" y1="270" x2="300" y2="250" class="line"/>
  <line x1="400" y1="230" x2="400" y2="210" class="line"/>
  <line x1="540" y1="150" x2="540" y2="130" class="line"/>
  <line x1="680" y1="90" x2="680" y2="85" class="line"/>

  <!-- State labels -->
  <text x="160" y="410" text-anchor="middle" class="sublabel">Solid</text>
  <text x="300" y="410" text-anchor="middle" class="sublabel">Solid + Liquid</text>
  <text x="420" y="410" text-anchor="middle" class="sublabel">Liquid</text>
  <text x="540" y="410" text-anchor="middle" class="sublabel">Liquid + Gas</text>
  <text x="680" y="410" text-anchor="middle" class="sublabel">Gas</text>
</svg>