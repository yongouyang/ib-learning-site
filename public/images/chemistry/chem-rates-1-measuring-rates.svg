<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Methods for measuring reaction rate</title>
  <desc id="desc">Four common ways to measure reaction rate: gas volume, mass loss, cross disappearance and pH or temperature change.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .glass { fill: #e0f2fe; stroke: #3b82f6; stroke-width: 2; }
      .liquid { fill: #93c5fd; fill-opacity: 0.5; }
      .bubble { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="420" fill="#f9fafb" rx="12"/>
  <text x="480" y="38" text-anchor="middle" class="title">Measuring Reaction Rates</text>

  <!-- Gas volume panel -->
  <rect x="40" y="60" width="200" height="320" rx="12" class="panel"/>
  <text x="140" y="90" text-anchor="middle" class="label">Gas volume</text>

  <!-- conical flask -->
  <path d="M95 140 L85 220 L165 220 L155 140 Z" class="glass"/>
  <path d="M95 190 L155 190 L150 215 L100 215 Z" class="liquid"/>
  <circle cx="115" cy="200" r="4" class="bubble"/>
  <circle cx="135" cy="195" r="5" class="bubble"/>
  <circle cx="125" cy="208" r="3" class="bubble"/>

  <!-- delivery tube -->
  <path d="M140 165 L180 165 L180 140" fill="none" stroke="#6b7280" stroke-width="3"/>
  <!-- gas syringe -->
  <rect x="160" y="110" width="70" height="22" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <rect x="185" y="114" width="35" height="14" fill="#f97316"/>
  <text x="195" y="135" text-anchor="middle" class="sublabel">Gas syringe</text>

  <rect x="70" y="300" width="140" height="20" rx="4" fill="#f9fafb"/>
  <text x="140" y="314" text-anchor="middle" class="sublabel">Volume / time</text>

  <!-- Mass loss panel -->
  <rect x="270" y="60" width="200" height="320" rx="12" class="panel"/>
  <text x="370" y="90" text-anchor="middle" class="label">Mass loss</text>

  <!-- balance -->
  <rect x="310" y="250" width="120" height="16" rx="2" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
  <rect x="355" y="220" width="30" height="30" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="370" y="240" text-anchor="middle" class="sublabel" font-size="10">g</text>

  <!-- flask on balance -->
  <path d="M335 170 L330 220 L390 220 L385 170 Z" class="glass"/>
  <path d="M335 200 L385 200 L382 217 L338 217 Z" class="liquid"/>
  <circle cx="350" cy="210" r="4" class="bubble"/>
  <circle cx="370" cy="205" r="5" class="bubble"/>

  <!-- escaping gas -->
  <path d="M360 165 Q360 150 375 145" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M375 145 L380 140 M375 145 L385 145 M375 145 L380 150" stroke="#6b7280" stroke-width="2"/>

  <rect x="281" y="300" width="178" height="20" rx="4" fill="#f9fafb"/>
  <text x="370" y="314" text-anchor="middle" class="sublabel">Mass decreases as gas escapes</text>

  <!-- Cross disappearance panel -->
  <rect x="500" y="60" width="200" height="320" rx="12" class="panel"/>
  <text x="600" y="90" text-anchor="middle" class="label">Turbidity / cross</text>

  <!-- cross -->
  <line x1="560" y1="260" x2="640" y2="260" stroke="#111827" stroke-width="4"/>
  <line x1="600" y1="220" x2="600" y2="300" stroke="#111827" stroke-width="4"/>

  <!-- flask -->
  <path d="M565 140 L555 220 L645 220 L635 140 Z" class="glass" fill-opacity="0.4"/>
  <path d="M565 190 L635 190 L630 215 L570 215 Z" class="liquid" fill-opacity="0.6"/>
  <!-- sulfur cloud -->
  <circle cx="590" cy="200" r="18" fill="#fde047" fill-opacity="0.5"/>
  <circle cx="610" cy="205" r="14" fill="#fde047" fill-opacity="0.5"/>
  <circle cx="600" cy="188" r="12" fill="#fde047" fill-opacity="0.5"/>

  <rect x="530" y="300" width="140" height="20" rx="4" fill="#f9fafb"/>
  <text x="600" y="314" text-anchor="middle" class="sublabel">Time until cross disappears</text>

  <!-- pH / temperature panel -->
  <rect x="730" y="60" width="200" height="320" rx="12" class="panel"/>
  <text x="830" y="90" text-anchor="middle" class="label">pH / temperature</text>

  <!-- beaker -->
  <path d="M770 140 L770 220 L870 220 L870 140" class="glass"/>
  <path d="M770 190 L870 190 L870 215 L770 215 Z" class="liquid"/>

  <!-- pH probe -->
  <line x1="850" y1="120" x2="850" y2="190" stroke="#374151" stroke-width="3"/>
  <rect x="835" y="100" width="30" height="20" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="850" y="114" text-anchor="middle" class="sublabel" font-size="9">pH</text>

  <!-- thermometer -->
  <line x1="795" y1="110" x2="795" y2="180" stroke="#ef4444" stroke-width="3"/>
  <circle cx="795" cy="190" r="7" fill="#ef4444"/>
  <line x1="785" y1="120" x2="790" y2="120" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="785" y1="140" x2="790" y2="140" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="785" y1="160" x2="790" y2="160" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="741" y="300" width="178" height="20" rx="4" fill="#f9fafb"/>
  <text x="830" y="314" text-anchor="middle" class="sublabel">Probe records change over time</text>
</svg>