<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">From Atom to Ion: Electronic Configurations</title>
  <desc id="desc">Shell diagrams showing a sodium atom (2,8,1) losing its whole outer shell to become a sodium ion (2,8), and a chlorine atom (2,8,7) gaining one electron to become a chloride ion (2,8,8), with a panel of exam traps.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .shell { fill: none; stroke-width: 2; }
      .nucleus { fill: #f97316; }
      .electron { fill: #3b82f6; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">From Atom to Ion: Electronic Configurations</text>

  <!-- Sodium atom 2,8,1 -->
  <g>
    <rect x="55" y="54" width="170" height="28" rx="4" class="label-bg"/>
    <text x="140" y="72" text-anchor="middle" class="label">Na atom — 2,8,1</text>
    <circle cx="140" cy="200" r="118" class="shell" stroke="#2563eb"/>
    <circle cx="140" cy="200" r="84" class="shell" stroke="#60a5fa"/>
    <circle cx="140" cy="200" r="48" class="shell" stroke="#93c5fd"/>
    <circle cx="140" cy="200" r="20" class="nucleus"/>
    <text x="140" y="205" text-anchor="middle" class="label" fill="#ffffff">Na</text>
    <!-- shell count labels on the left, mid-annulus -->
    <rect x="96" y="192" width="20" height="16" rx="4" class="label-bg"/>
    <text x="106" y="204" text-anchor="middle" class="sublabel">2</text>
    <rect x="64" y="192" width="20" height="16" rx="4" class="label-bg"/>
    <text x="74" y="204" text-anchor="middle" class="sublabel">8</text>
    <rect x="29" y="192" width="20" height="16" rx="4" class="label-bg"/>
    <text x="39" y="204" text-anchor="middle" class="sublabel">1</text>
    <!-- shell 1: 2 electrons top/bottom -->
    <circle cx="140" cy="152" r="7" class="electron"/>
    <circle cx="140" cy="248" r="7" class="electron"/>
    <!-- shell 2: 8 electrons rotated 22.5 degrees -->
    <circle cx="217.6" cy="167.9" r="7" class="electron"/>
    <circle cx="217.6" cy="232.1" r="7" class="electron"/>
    <circle cx="62.4" cy="167.9" r="7" class="electron"/>
    <circle cx="62.4" cy="232.1" r="7" class="electron"/>
    <circle cx="172.1" cy="122.4" r="7" class="electron"/>
    <circle cx="172.1" cy="277.6" r="7" class="electron"/>
    <circle cx="107.9" cy="122.4" r="7" class="electron"/>
    <circle cx="107.9" cy="277.6" r="7" class="electron"/>
    <!-- shell 3: single outer electron, right side -->
    <circle cx="258" cy="200" r="7" class="electron"/>
  </g>

  <!-- Row 1 arrow: loses 1 electron -->
  <rect x="257" y="156" width="160" height="26" rx="4" class="label-bg"/>
  <text x="337" y="173" text-anchor="middle" class="sublabel">loses 1 electron</text>
  <line x1="270" y1="200" x2="404" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sodium ion 2,8 -->
  <g>
    <rect x="415" y="88" width="170" height="28" rx="4" class="label-bg"/>
    <text x="500" y="106" text-anchor="middle" class="label">Na⁺ ion — 2,8</text>
    <circle cx="500" cy="200" r="84" class="shell" stroke="#60a5fa"/>
    <circle cx="500" cy="200" r="48" class="shell" stroke="#93c5fd"/>
    <circle cx="500" cy="200" r="20" class="nucleus"/>
    <text x="500" y="205" text-anchor="middle" class="label" fill="#ffffff">Na</text>
    <rect x="456" y="192" width="20" height="16" rx="4" class="label-bg"/>
    <text x="466" y="204" text-anchor="middle" class="sublabel">2</text>
    <rect x="424" y="192" width="20" height="16" rx="4" class="label-bg"/>
    <text x="434" y="204" text-anchor="middle" class="sublabel">8</text>
    <circle cx="500" cy="152" r="7" class="electron"/>
    <circle cx="500" cy="248" r="7" class="electron"/>
    <circle cx="577.6" cy="167.9" r="7" class="electron"/>
    <circle cx="577.6" cy="232.1" r="7" class="electron"/>
    <circle cx="422.4" cy="167.9" r="7" class="electron"/>
    <circle cx="422.4" cy="232.1" r="7" class="electron"/>
    <circle cx="532.1" cy="122.4" r="7" class="electron"/>
    <circle cx="532.1" cy="277.6" r="7" class="electron"/>
    <circle cx="467.9" cy="122.4" r="7" class="electron"/>
    <circle cx="467.9" cy="277.6" r="7" class="electron"/>
  </g>

  <!-- Chlorine atom 2,8,7 -->
  <g>
    <rect x="55" y="324" width="170" height="28" rx="4" class="label-bg"/>
    <text x="140" y="342" text-anchor="middle" class="label">Cl atom — 2,8,7</text>
    <circle cx="140" cy="470" r="118" class="shell" stroke="#2563eb"/>
    <circle cx="140" cy="470" r="84" class="shell" stroke="#60a5fa"/>
    <circle cx="140" cy="470" r="48" class="shell" stroke="#93c5fd"/>
    <circle cx="140" cy="470" r="20" class="nucleus"/>
    <text x="140" y="475" text-anchor="middle" class="label" fill="#ffffff">Cl</text>
    <rect x="96" y="462" width="20" height="16" rx="4" class="label-bg"/>
    <text x="106" y="474" text-anchor="middle" class="sublabel">2</text>
    <rect x="64" y="462" width="20" height="16" rx="4" class="label-bg"/>
    <text x="74" y="474" text-anchor="middle" class="sublabel">8</text>
    <rect x="29" y="462" width="20" height="16" rx="4" class="label-bg"/>
    <text x="39" y="474" text-anchor="middle" class="sublabel">7</text>
    <circle cx="140" cy="422" r="7" class="electron"/>
    <circle cx="140" cy="518" r="7" class="electron"/>
    <circle cx="217.6" cy="437.9" r="7" class="electron"/>
    <circle cx="217.6" cy="502.1" r="7" class="electron"/>
    <circle cx="62.4" cy="437.9" r="7" class="electron"/>
    <circle cx="62.4" cy="502.1" r="7" class="electron"/>
    <circle cx="172.1" cy="392.4" r="7" class="electron"/>
    <circle cx="172.1" cy="547.6" r="7" class="electron"/>
    <circle cx="107.9" cy="392.4" r="7" class="electron"/>
    <circle cx="107.9" cy="547.6" r="7" class="electron"/>
    <!-- shell 3: 7 crosses, empty slot on the right -->
    <path d="M 218.4 548.4 L 228.4 558.4 M 218.4 558.4 L 228.4 548.4" stroke="#dc2626" stroke-width="2"/>
    <path d="M 135 583 L 145 593 M 135 593 L 145 583" stroke="#dc2626" stroke-width="2"/>
    <path d="M 51.6 548.4 L 61.6 558.4 M 51.6 558.4 L 61.6 548.4" stroke="#dc2626" stroke-width="2"/>
    <path d="M 17 465 L 27 475 M 17 475 L 27 465" stroke="#dc2626" stroke-width="2"/>
    <path d="M 51.6 381.6 L 61.6 391.6 M 51.6 391.6 L 61.6 381.6" stroke="#dc2626" stroke-width="2"/>
    <path d="M 135 347 L 145 357 M 135 357 L 145 347" stroke="#dc2626" stroke-width="2"/>
    <path d="M 218.4 381.6 L 228.4 391.6 M 218.4 391.6 L 228.4 381.6" stroke="#dc2626" stroke-width="2"/>
    <circle cx="258" cy="470" r="7" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Row 2 arrow: gains 1 electron -->
  <rect x="251" y="424" width="160" height="26" rx="4" class="label-bg"/>
  <text x="331" y="441" text-anchor="middle" class="sublabel">gains 1 electron</text>
  <line x1="270" y1="470" x2="372" y2="470" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Chloride ion 2,8,8 -->
  <g>
    <rect x="415" y="324" width="170" height="28" rx="4" class="label-bg"/>
    <text x="500" y="342" text-anchor="middle" class="label">Cl⁻ ion — 2,8,8</text>
    <circle cx="500" cy="470" r="118" class="shell" stroke="#2563eb"/>
    <circle cx="500" cy="470" r="84" class="shell" stroke="#60a5fa"/>
    <circle cx="500" cy="470" r="48" class="shell" stroke="#93c5fd"/>
    <circle cx="500" cy="470" r="20" class="nucleus"/>
    <text x="500" y="475" text-anchor="middle" class="label" fill="#ffffff">Cl</text>
    <rect x="456" y="462" width="20" height="16" rx="4" class="label-bg"/>
    <text x="466" y="474" text-anchor="middle" class="sublabel">2</text>
    <rect x="424" y="462" width="20" height="16" rx="4" class="label-bg"/>
    <text x="434" y="474" text-anchor="middle" class="sublabel">8</text>
    <rect x="389" y="462" width="20" height="16" rx="4" class="label-bg"/>
    <text x="399" y="474" text-anchor="middle" class="sublabel">8</text>
    <circle cx="500" cy="422" r="7" class="electron"/>
    <circle cx="500" cy="518" r="7" class="electron"/>
    <circle cx="577.6" cy="437.9" r="7" class="electron"/>
    <circle cx="577.6" cy="502.1" r="7" class="electron"/>
    <circle cx="422.4" cy="437.9" r="7" class="electron"/>
    <circle cx="422.4" cy="502.1" r="7" class="electron"/>
    <circle cx="532.1" cy="392.4" r="7" class="electron"/>
    <circle cx="532.1" cy="547.6" r="7" class="electron"/>
    <circle cx="467.9" cy="392.4" r="7" class="electron"/>
    <circle cx="467.9" cy="547.6" r="7" class="electron"/>
    <!-- shell 3: 7 crosses plus the gained blue electron on the left -->
    <path d="M 613 465 L 623 475 M 613 475 L 623 465" stroke="#dc2626" stroke-width="2"/>
    <path d="M 578.4 548.4 L 588.4 558.4 M 578.4 558.4 L 588.4 548.4" stroke="#dc2626" stroke-width="2"/>
    <path d="M 495 583 L 505 593 M 495 593 L 505 583" stroke="#dc2626" stroke-width="2"/>
    <path d="M 411.6 548.4 L 421.6 558.4 M 411.6 558.4 L 421.6 548.4" stroke="#dc2626" stroke-width="2"/>
    <path d="M 411.6 381.6 L 421.6 391.6 M 411.6 391.6 L 421.6 381.6" stroke="#dc2626" stroke-width="2"/>
    <path d="M 495 347 L 505 357 M 495 357 L 505 347" stroke="#dc2626" stroke-width="2"/>
    <path d="M 578.4 381.6 L 588.4 391.6 M 578.4 391.6 L 588.4 381.6" stroke="#dc2626" stroke-width="2"/>
    <circle cx="382" cy="470" r="7" class="electron"/>
  </g>

  <!-- Exam traps panel -->
  <rect x="650" y="80" width="230" height="480" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="765" y="112" text-anchor="middle" class="label">Exam traps</text>
  <rect x="665" y="140" width="200" height="48" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="765" y="162" text-anchor="middle" class="sublabel">Na⁺ is 2,8 —</text>
  <text x="765" y="180" text-anchor="middle" class="sublabel">never 2,8,1</text>
  <rect x="665" y="240" width="200" height="48" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="765" y="262" text-anchor="middle" class="sublabel">Metals lose the whole</text>
  <text x="765" y="280" text-anchor="middle" class="sublabel">outer shell</text>
  <rect x="665" y="340" width="200" height="48" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="765" y="362" text-anchor="middle" class="sublabel">Cl⁻ gains 1 electron:</text>
  <text x="765" y="380" text-anchor="middle" class="sublabel">2,8,8 — same as argon</text>
  <rect x="665" y="440" width="200" height="48" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="765" y="462" text-anchor="middle" class="sublabel">Only electrons change —</text>
  <text x="765" y="480" text-anchor="middle" class="sublabel">the protons stay the same</text>
</svg>
