<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Carbon Bonding and Simple Organic Molecules</title>
  <desc id="desc">A diagram showing a carbon atom forming four bonds, the alkane methane, the alkene ethene, and examples of alcohol and carboxylic acid functional groups.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .bond { stroke: #6b7280; stroke-width: 3; }
      .double-bond { stroke: #6b7280; stroke-width: 3; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .atom-c { fill: #374151; }
      .atom-h { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 2; }
      .atom-o { fill: #ef4444; }
      .atom-cl { fill: #22c55e; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Carbon Bonding and Simple Organic Molecules</text>

  <!-- Carbon tetravalency panel -->
  <rect x="60" y="60" width="240" height="220" rx="10" class="box"/>
  <text x="180" y="85" text-anchor="middle" class="label">Carbon forms 4 bonds</text>
  <g transform="translate(180, 170)">
    <circle cx="0" cy="0" r="34" class="atom-c"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <circle cx="0" cy="-70" r="22" class="atom-h"/>
    <text x="0" y="-65" text-anchor="middle" class="label">H</text>
    <circle cx="70" cy="0" r="22" class="atom-h"/>
    <text x="70" y="5" text-anchor="middle" class="label">H</text>
    <circle cx="0" cy="70" r="22" class="atom-h"/>
    <text x="0" y="75" text-anchor="middle" class="label">H</text>
    <circle cx="-70" cy="0" r="22" class="atom-h"/>
    <text x="-70" y="5" text-anchor="middle" class="label">H</text>
    <line x1="0" y1="-34" x2="0" y2="-48" class="bond"/>
    <line x1="34" y1="0" x2="48" y2="0" class="bond"/>
    <line x1="0" y1="34" x2="0" y2="48" class="bond"/>
    <line x1="-34" y1="0" x2="-48" y2="0" class="bond"/>
  </g>
  <text x="180" y="275" text-anchor="middle" class="sublabel">Methane (CH₄)</text>

  <!-- Alkane vs alkene panel -->
  <rect x="330" y="60" width="510" height="220" rx="10" class="box"/>
  <text x="585" y="85" text-anchor="middle" class="label">Saturated vs unsaturated</text>

  <!-- Ethane -->
  <g transform="translate(460, 170)">
    <circle cx="-40" cy="0" r="28" class="atom-c"/>
    <text x="-40" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <circle cx="40" cy="0" r="28" class="atom-c"/>
    <text x="40" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <line x1="-12" y1="0" x2="12" y2="0" class="bond"/>
    <circle cx="-40" cy="-55" r="20" class="atom-h"/>
    <text x="-40" y="-50" text-anchor="middle" class="label">H</text>
    <line x1="-40" y1="-28" x2="-40" y2="-35" class="bond"/>
    <circle cx="-75" cy="25" r="20" class="atom-h"/>
    <text x="-75" y="30" text-anchor="middle" class="label">H</text>
    <line x1="-63" y1="10" x2="-68" y2="18" class="bond"/>
    <circle cx="-20" cy="48" r="20" class="atom-h"/>
    <text x="-20" y="53" text-anchor="middle" class="label">H</text>
    <line x1="-32" y1="22" x2="-25" y2="36" class="bond"/>
    <circle cx="40" cy="-55" r="20" class="atom-h"/>
    <text x="40" y="-50" text-anchor="middle" class="label">H</text>
    <line x1="40" y1="-28" x2="40" y2="-35" class="bond"/>
    <circle cx="75" cy="25" r="20" class="atom-h"/>
    <text x="75" y="30" text-anchor="middle" class="label">H</text>
    <line x1="63" y1="10" x2="68" y2="18" class="bond"/>
    <circle cx="20" cy="48" r="20" class="atom-h"/>
    <text x="20" y="53" text-anchor="middle" class="label">H</text>
    <line x1="32" y1="22" x2="25" y2="36" class="bond"/>
  </g>
  <text x="460" y="250" text-anchor="middle" class="sublabel">Ethane C₂H₆ — saturated (single bonds)</text>

  <!-- Ethene -->
  <g transform="translate(700, 170)">
    <circle cx="-28" cy="0" r="28" class="atom-c"/>
    <text x="-28" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <circle cx="28" cy="0" r="28" class="atom-c"/>
    <text x="28" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <line x1="-6" y1="-6" x2="6" y2="-6" class="double-bond"/>
    <line x1="-6" y1="6" x2="6" y2="6" class="double-bond"/>
    <circle cx="-28" cy="-60" r="20" class="atom-h"/>
    <text x="-28" y="-55" text-anchor="middle" class="label">H</text>
    <line x1="-28" y1="-28" x2="-28" y2="-40" class="bond"/>
    <circle cx="-60" cy="30" r="20" class="atom-h"/>
    <text x="-60" y="35" text-anchor="middle" class="label">H</text>
    <line x1="-48" y1="16" x2="-54" y2="24" class="bond"/>
    <circle cx="28" cy="-60" r="20" class="atom-h"/>
    <text x="28" y="-55" text-anchor="middle" class="label">H</text>
    <line x1="28" y1="-28" x2="28" y2="-40" class="bond"/>
    <circle cx="60" cy="30" r="20" class="atom-h"/>
    <text x="60" y="35" text-anchor="middle" class="label">H</text>
    <line x1="48" y1="16" x2="54" y2="24" class="bond"/>
  </g>
  <text x="700" y="250" text-anchor="middle" class="sublabel">Ethene C₂H₄ — unsaturated (C=C)</text>

  <!-- Functional groups panel -->
  <rect x="60" y="310" width="780" height="160" rx="10" class="box"/>
  <text x="450" y="338" text-anchor="middle" class="label">Common functional groups</text>

  <!-- Alcohol -->
  <g transform="translate(230, 390)">
    <circle cx="-50" cy="0" r="28" class="atom-c"/>
    <text x="-50" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <circle cx="50" cy="0" r="28" class="atom-c"/>
    <text x="50" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <line x1="-22" y1="0" x2="22" y2="0" class="bond"/>
    <circle cx="-50" cy="-55" r="20" class="atom-h"/>
    <text x="-50" y="-50" text-anchor="middle" class="label">H</text>
    <line x1="-50" y1="-28" x2="-50" y2="-35" class="bond"/>
    <circle cx="-85" cy="25" r="20" class="atom-h"/>
    <text x="-85" y="30" text-anchor="middle" class="label">H</text>
    <line x1="-73" y1="10" x2="-78" y2="18" class="bond"/>
    <circle cx="-15" cy="25" r="20" class="atom-h"/>
    <text x="-15" y="30" text-anchor="middle" class="label">H</text>
    <line x1="-27" y1="10" x2="-22" y2="18" class="bond"/>
    <circle cx="50" cy="-55" r="20" class="atom-h"/>
    <text x="50" y="-50" text-anchor="middle" class="label">H</text>
    <line x1="50" y1="-28" x2="50" y2="-35" class="bond"/>
    <circle cx="85" cy="-25" r="20" class="atom-h"/>
    <text x="85" y="-20" text-anchor="middle" class="label">H</text>
    <line x1="73" y1="-10" x2="78" y2="-18" class="bond"/>
    <circle cx="50" cy="55" r="22" class="atom-o"/>
    <text x="50" y="60" text-anchor="middle" class="label" fill="white">O</text>
    <line x1="50" y1="28" x2="50" y2="33" class="bond"/>
    <circle cx="90" cy="75" r="18" class="atom-h"/>
    <text x="90" y="79" text-anchor="middle" class="label">H</text>
    <line x1="68" y1="68" x2="78" y2="73" class="bond"/>
  </g>
  <text x="230" y="470" text-anchor="middle" class="sublabel">Alcohol — ethanol C₂H₅OH</text>

  <!-- Carboxylic acid -->
  <g transform="translate(520, 390)">
    <circle cx="-40" cy="0" r="28" class="atom-c"/>
    <text x="-40" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <circle cx="40" cy="0" r="28" class="atom-c"/>
    <text x="40" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <line x1="-12" y1="0" x2="12" y2="0" class="bond"/>
    <circle cx="-85" cy="0" r="20" class="atom-h"/>
    <text x="-85" y="5" text-anchor="middle" class="label">H</text>
    <line x1="-57" y1="0" x2="-68" y2="0" class="bond"/>
    <circle cx="-40" cy="-55" r="20" class="atom-h"/>
    <text x="-40" y="-50" text-anchor="middle" class="label">H</text>
    <line x1="-40" y1="-28" x2="-40" y2="-35" class="bond"/>
    <circle cx="-5" cy="30" r="20" class="atom-h"/>
    <text x="-5" y="35" text-anchor="middle" class="label">H</text>
    <line x1="-17" y1="16" x2="-12" y2="22" class="bond"/>
    <circle cx="40" cy="55" r="22" class="atom-o"/>
    <text x="40" y="60" text-anchor="middle" class="label" fill="white">O</text>
    <line x1="40" y1="28" x2="40" y2="33" class="bond"/>
    <circle cx="40" cy="-55" r="22" class="atom-o"/>
    <text x="40" y="-50" text-anchor="middle" class="label" fill="white">O</text>
    <line x1="40" y1="-28" x2="40" y2="-33" class="bond"/>
    <circle cx="80" cy="-75" r="18" class="atom-h"/>
    <text x="80" y="-71" text-anchor="middle" class="label">H</text>
    <line x1="58" y1="-62" x2="70" y2="-70" class="bond"/>
  </g>
  <text x="520" y="470" text-anchor="middle" class="sublabel">Carboxylic acid — ethanoic acid CH₃COOH</text>

  <!-- Halogenoalkane -->
  <g transform="translate(740, 390)">
    <circle cx="-30" cy="0" r="28" class="atom-c"/>
    <text x="-30" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <circle cx="30" cy="0" r="22" class="atom-cl"/>
    <text x="30" y="5" text-anchor="middle" class="label" fill="white">Cl</text>
    <line x1="-2" y1="0" x2="8" y2="0" class="bond"/>
    <circle cx="-30" cy="-50" r="18" class="atom-h"/>
    <text x="-30" y="-46" text-anchor="middle" class="label">H</text>
    <line x1="-30" y1="-28" x2="-30" y2="-32" class="bond"/>
    <circle cx="-60" cy="20" r="18" class="atom-h"/>
    <text x="-60" y="24" text-anchor="middle" class="label">H</text>
    <line x1="-52" y1="8" x2="-56" y2="14" class="bond"/>
    <circle cx="0" cy="20" r="18" class="atom-h"/>
    <text x="0" y="24" text-anchor="middle" class="label">H</text>
    <line x1="-8" y1="8" x2="-4" y2="14" class="bond"/>
  </g>
  <text x="740" y="470" text-anchor="middle" class="sublabel">Halogenoalkane — CH₃Cl</text>
</svg>
