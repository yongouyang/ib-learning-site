<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Covalent Bonding in Simple Molecules</title>
  <desc id="desc">Dot-and-cross diagrams showing covalent bonding in water (H₂O) and methane (CH₄), with labels for shared electron pairs and intermolecular forces between molecules.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .atom-o { fill: #ef4444; }
      .atom-h { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 2; }
      .atom-c { fill: #374151; }
      .dot { fill: #3b82f6; }
      .cross { fill: #f97316; }
      .bond { stroke: #6b7280; stroke-width: 3; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Covalent Bonding — Simple Molecules</text>

  <!-- Water molecule dot-and-cross -->
  <rect x="60" y="70" width="380" height="310" rx="10" class="box"/>
  <text x="250" y="95" text-anchor="middle" class="label">Water (H₂O) — shared electron pairs</text>

  <g transform="translate(250, 230)">
    <!-- Oxygen -->
    <circle cx="0" cy="0" r="36" class="atom-o"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">O</text>
    <!-- Hydrogens -->
    <circle cx="-60" cy="55" r="22" class="atom-h"/>
    <text x="-60" y="60" text-anchor="middle" class="label">H</text>
    <circle cx="60" cy="55" r="22" class="atom-h"/>
    <text x="60" y="60" text-anchor="middle" class="label">H</text>
    <!-- Bond lines -->
    <line x1="-22" y1="22" x2="-46" y2="43" class="bond"/>
    <line x1="22" y1="22" x2="46" y2="43" class="bond"/>
    <!-- Shared electrons -->
    <circle cx="-34" cy="32" r="5" class="dot"/>
    <circle cx="-38" cy="40" r="5" class="cross"/>
    <circle cx="34" cy="32" r="5" class="dot"/>
    <circle cx="38" cy="40" r="5" class="cross"/>
    <!-- Lone pairs on oxygen -->
    <circle cx="-18" cy="-26" r="5" class="dot"/>
    <circle cx="-26" cy="-18" r="5" class="dot"/>
    <circle cx="18" cy="-26" r="5" class="dot"/>
    <circle cx="26" cy="-18" r="5" class="dot"/>
  </g>

  <line x1="250" y1="285" x2="250" y2="330" class="line"/>
  <rect x="155" y="331" width="205" height="18" rx="4" class="label-bg"/>
  <text x="160" y="343" class="label">Each O–H bond = 1 shared pair</text>

  <!-- Methane molecule -->
  <rect x="470" y="70" width="370" height="310" rx="10" class="box"/>
  <text x="655" y="95" text-anchor="middle" class="label">Methane (CH₄) — 4 single bonds</text>

  <g transform="translate(655, 240)">
    <!-- Carbon -->
    <circle cx="0" cy="0" r="34" class="atom-c"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">C</text>
    <!-- Hydrogens -->
    <circle cx="0" cy="-70" r="22" class="atom-h"/>
    <text x="0" y="-65" text-anchor="middle" class="label">H</text>
    <circle cx="66" cy="24" r="22" class="atom-h"/>
    <text x="66" y="29" text-anchor="middle" class="label">H</text>
    <circle cx="-66" cy="24" r="22" class="atom-h"/>
    <text x="-66" y="29" text-anchor="middle" class="label">H</text>
    <circle cx="0" cy="70" r="22" class="atom-h"/>
    <text x="0" y="75" text-anchor="middle" class="label">H</text>
    <!-- Bonds -->
    <line x1="0" y1="-34" x2="0" y2="-48" class="bond"/>
    <line x1="26" y1="12" x2="48" y2="22" class="bond"/>
    <line x1="-26" y1="12" x2="-48" y2="22" class="bond"/>
    <line x1="0" y1="34" x2="0" y2="48" class="bond"/>
    <!-- Shared pairs -->
    <circle cx="0" cy="-42" r="5" class="dot"/>
    <circle cx="6" cy="-42" r="5" class="cross"/>
    <circle cx="42" cy="20" r="5" class="dot"/>
    <circle cx="48" cy="18" r="5" class="cross"/>
    <circle cx="-42" cy="20" r="5" class="dot"/>
    <circle cx="-48" cy="18" r="5" class="cross"/>
    <circle cx="0" cy="42" r="5" class="dot"/>
    <circle cx="6" cy="42" r="5" class="cross"/>
  </g>

  <line x1="655" y1="295" x2="655" y2="330" class="line"/>
  <rect x="570" y="331" width="200" height="18" rx="4" class="label-bg"/>
  <text x="575" y="343" class="label">Carbon shares with 4 H atoms</text>

  <!-- Intermolecular forces note -->
  <rect x="60" y="400" width="780" height="90" rx="10" class="box"/>
  <text x="450" y="428" text-anchor="middle" class="label">Simple molecular substances have weak forces between molecules</text>
  <g transform="translate(250, 470)">
    <circle cx="0" cy="0" r="22" class="atom-o"/>
    <text x="0" y="5" text-anchor="middle" class="sublabel" fill="white">H₂O</text>
  </g>
  <g transform="translate(350, 470)">
    <circle cx="0" cy="0" r="22" class="atom-o"/>
    <text x="0" y="5" text-anchor="middle" class="sublabel" fill="white">H₂O</text>
  </g>
  <g transform="translate(450, 470)">
    <circle cx="0" cy="0" r="25" class="atom-c"/>
    <text x="0" y="5" text-anchor="middle" class="sublabel" fill="white">CH₄</text>
  </g>
  <g transform="translate(550, 470)">
    <circle cx="0" cy="0" r="25" class="atom-c"/>
    <text x="0" y="5" text-anchor="middle" class="sublabel" fill="white">CH₄</text>
  </g>
  <line x1="280" y1="470" x2="320" y2="470" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="470" x2="520" y2="470" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="495" text-anchor="middle" class="sublabel">Weak intermolecular forces (dashed) are easily overcome → low melting/boiling points</text>
</svg>
