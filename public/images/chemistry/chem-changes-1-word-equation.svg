<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Writing Word Equations</title>
  <desc id="desc">A diagram showing the layout of a word equation with reactants on the left, an arrow pointing right, and products on the right, including state symbols.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .reactant { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .product { fill: #ffedd5; stroke: #f97316; stroke-width: 2; }
      .arrow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 L2,4.5 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#f9fafb" rx="12"/>
  <text x="380" y="34" text-anchor="middle" class="title">Writing Word Equations</text>

  <!-- General format -->
  <rect x="50" y="60" width="660" height="110" class="box" rx="10"/>
  <text x="380" y="85" text-anchor="middle" class="sublabel">General format</text>

  <rect x="80" y="110" width="160" height="40" rx="6" class="reactant"/>
  <text x="160" y="135" text-anchor="middle" class="label" fill="#1e3a8a">Reactant(s)</text>

  <text x="280" y="137" class="label">+</text>

  <rect x="320" y="110" width="160" height="40" rx="6" class="reactant"/>
  <text x="400" y="135" text-anchor="middle" class="label" fill="#1e3a8a">Reactant(s)</text>

  <line x1="510" y1="130" x2="610" y2="130" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <text x="560" y="122" text-anchor="middle" class="sublabel">reacts to form</text>

  <rect x="620" y="110" width="80" height="40" rx="6" class="product"/>
  <text x="660" y="135" text-anchor="middle" class="label" fill="#7c2d12">Product(s)</text>

  <!-- Example 1 -->
  <rect x="50" y="190" width="660" height="100" class="box" rx="10"/>
  <text x="380" y="215" text-anchor="middle" class="sublabel">Example: magnesium burning in oxygen</text>

  <rect x="80" y="240" width="160" height="40" rx="6" class="reactant"/>
  <text x="160" y="265" text-anchor="middle" class="label" fill="#1e3a8a">Magnesium</text>

  <text x="275" y="267" class="label">+</text>

  <rect x="305" y="240" width="120" height="40" rx="6" class="reactant"/>
  <text x="365" y="265" text-anchor="middle" class="label" fill="#1e3a8a">Oxygen</text>

  <line x1="440" y1="260" x2="500" y2="260" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <rect x="515" y="240" width="165" height="40" rx="6" class="product"/>
  <text x="597" y="265" text-anchor="middle" class="label" fill="#7c2d12">Magnesium oxide</text>

  <!-- State symbols -->
  <rect x="50" y="310" width="660" height="90" class="box" rx="10"/>
  <text x="380" y="335" text-anchor="middle" class="sublabel">Common state symbols</text>

  <g transform="translate(90, 360)">
    <rect x="0" y="0" width="120" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" class="label">(s) solid</text>
  </g>
  <g transform="translate(230, 360)">
    <rect x="0" y="0" width="120" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" class="label">(l) liquid</text>
  </g>
  <g transform="translate(370, 360)">
    <rect x="0" y="0" width="120" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" class="label">(g) gas</text>
  </g>
  <g transform="translate(510, 360)">
    <rect x="0" y="0" width="160" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" class="label">(aq) aqueous</text>
  </g>
</svg>
