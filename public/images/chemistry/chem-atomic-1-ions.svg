<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Formation of Ions</title>
  <desc id="desc">Diagram showing a sodium atom losing one electron to become a sodium ion and a chlorine atom gaining one electron to become a chloride ion, illustrating cation and anion formation.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .shell { fill: none; stroke-width: 2; }
      .nucleus { fill: #f97316; }
      .electron { fill: #3b82f6; }
      .lost-electron { fill: #ef4444; }
      .gained-electron { fill: #22c55e; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Ions: When Atoms Gain or Lose Electrons</text>

  <!-- Sodium before -->
  <g transform="translate(160, 180)">
    <text x="0" y="-118" text-anchor="middle" class="label">Sodium atom</text>
    <text x="0" y="-78" text-anchor="middle" class="sublabel">2, 8, 1</text>
    <circle cx="0" cy="0" r="28" class="nucleus"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">Na</text>
    <text x="0" y="20" text-anchor="middle" class="sublabel" fill="white">11+</text>
    <circle cx="0" cy="0" r="55" class="shell" stroke="#93c5fd"/>
    <circle cx="0" cy="0" r="95" class="shell" stroke="#60a5fa"/>
    <circle cx="0" cy="0" r="110" class="shell" stroke="#2563eb"/>
    <g class="electron">
      <circle cx="55" cy="0" r="7"/><circle cx="-55" cy="0" r="7"/>
      <circle cx="95" cy="0" r="7"/><circle cx="-95" cy="0" r="7"/>
      <circle cx="0" cy="95" r="7"/><circle cx="0" cy="-95" r="7"/>
      <circle cx="67" cy="67" r="7"/><circle cx="-67" cy="-67" r="7"/>
      <circle cx="67" cy="-67" r="7"/><circle cx="-67" cy="67" r="7"/>
      <circle cx="0" cy="110" r="7" class="lost-electron"/>
    </g>
  </g>

  <!-- Arrow showing electron loss -->
  <line x1="274" y1="180" x2="320" y2="180" class="arrow" stroke="#6b7280" marker-end="url(#arrowhead)"/>
  <text x="297" y="170" text-anchor="middle" class="sublabel">loses e⁻</text>

  <!-- Sodium after -->
  <g transform="translate(420, 180)">
    <text x="0" y="-108" text-anchor="middle" class="label">Sodium ion</text>
    <text x="0" y="-78" text-anchor="middle" class="sublabel">Na⁺  2, 8</text>
    <circle cx="0" cy="0" r="28" class="nucleus"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">Na</text>
    <text x="0" y="20" text-anchor="middle" class="sublabel" fill="white">11+</text>
    <circle cx="0" cy="0" r="55" class="shell" stroke="#93c5fd"/>
    <circle cx="0" cy="0" r="95" class="shell" stroke="#60a5fa"/>
    <g class="electron">
      <circle cx="55" cy="0" r="7"/><circle cx="-55" cy="0" r="7"/>
      <circle cx="95" cy="0" r="7"/><circle cx="-95" cy="0" r="7"/>
      <circle cx="0" cy="95" r="7"/><circle cx="0" cy="-95" r="7"/>
      <circle cx="67" cy="67" r="7"/><circle cx="-67" cy="-67" r="7"/>
    </g>
    <text x="0" y="118" text-anchor="middle" class="label" fill="#dc2626">+1 charge</text>
    <text x="0" y="134" text-anchor="middle" class="sublabel">11 protons − 10 electrons</text>
  </g>

  <!-- Chlorine before -->
  <g transform="translate(160, 415)">
    <text x="0" y="128" text-anchor="middle" class="label">Chlorine atom</text>
    <text x="0" y="-68" text-anchor="middle" class="sublabel">2, 8, 7</text>
    <circle cx="0" cy="0" r="28" class="nucleus"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">Cl</text>
    <text x="0" y="20" text-anchor="middle" class="sublabel" fill="white">17+</text>
    <circle cx="0" cy="0" r="55" class="shell" stroke="#93c5fd"/>
    <circle cx="0" cy="0" r="95" class="shell" stroke="#60a5fa"/>
    <circle cx="0" cy="0" r="110" class="shell" stroke="#2563eb"/>
    <g class="electron">
      <circle cx="55" cy="0" r="7"/><circle cx="-55" cy="0" r="7"/>
      <circle cx="95" cy="0" r="7"/><circle cx="-95" cy="0" r="7"/>
      <circle cx="0" cy="95" r="7"/><circle cx="0" cy="-95" r="7"/>
      <circle cx="67" cy="67" r="7"/><circle cx="-67" cy="-67" r="7"/>
      <circle cx="67" cy="-67" r="7"/><circle cx="-67" cy="67" r="7"/>
      <circle cx="0" cy="110" r="7"/>
      <circle cx="95" cy="0" r="7" class="gained-electron"/>
    </g>
  </g>

  <!-- Arrow showing electron gain -->
  <line x1="274" y1="415" x2="304" y2="415" class="arrow" stroke="#6b7280" marker-end="url(#arrowhead)"/>
  <text x="289" y="405" text-anchor="middle" class="sublabel">gains e⁻</text>

  <!-- Chlorine after -->
  <g transform="translate(420, 415)">
    <text x="0" y="128" text-anchor="middle" class="label">Chloride ion</text>
    <text x="0" y="-68" text-anchor="middle" class="sublabel">Cl⁻  2, 8, 8</text>
    <circle cx="0" cy="0" r="28" class="nucleus"/>
    <text x="0" y="5" text-anchor="middle" class="label" fill="white">Cl</text>
    <text x="0" y="20" text-anchor="middle" class="sublabel" fill="white">17+</text>
    <circle cx="0" cy="0" r="55" class="shell" stroke="#93c5fd"/>
    <circle cx="0" cy="0" r="95" class="shell" stroke="#60a5fa"/>
    <circle cx="0" cy="0" r="110" class="shell" stroke="#2563eb"/>
    <g class="electron">
      <circle cx="55" cy="0" r="7"/><circle cx="-55" cy="0" r="7"/>
      <circle cx="95" cy="0" r="7"/><circle cx="-95" cy="0" r="7"/>
      <circle cx="0" cy="95" r="7"/><circle cx="0" cy="-95" r="7"/>
      <circle cx="67" cy="67" r="7"/><circle cx="-67" cy="-67" r="7"/>
      <circle cx="67" cy="-67" r="7"/><circle cx="-67" cy="67" r="7"/>
      <circle cx="0" cy="110" r="7"/><circle cx="95" cy="0" r="7" class="gained-electron"/>
    </g>
    <text x="0" y="158" text-anchor="middle" class="label" fill="#2563eb">−1 charge</text>
    <text x="0" y="174" text-anchor="middle" class="sublabel">17 protons − 18 electrons</text>
  </g>

  <!-- Summary -->
  <g transform="translate(620, 180)">
    <rect x="0" y="0" width="240" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" class="label">Ion charge</text>
    <text x="120" y="58" text-anchor="middle" class="sublabel">Charge = protons − electrons</text>
    <text x="120" y="90" text-anchor="middle" class="label" fill="#dc2626">Cation = positive</text>
    <text x="120" y="112" text-anchor="middle" class="sublabel">metal loses electrons</text>
    <text x="120" y="145" text-anchor="middle" class="label" fill="#2563eb">Anion = negative</text>
    <text x="120" y="167" text-anchor="middle" class="sublabel">non-metal gains electrons</text>
  </g>
</svg>