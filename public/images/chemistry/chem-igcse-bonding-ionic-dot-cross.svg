<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Ionic Bonding: Dot-and-Cross for Sodium Chloride</title>
  <desc id="desc">A dot-and-cross diagram showing a sodium atom with one outer electron and a chlorine atom with seven outer electrons; one electron is transferred from sodium to chlorine, forming a sodium ion and a chloride ion drawn in brackets with their charges.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .shell { fill: none; stroke: #60a5fa; stroke-width: 2; }
      .nucleus { fill: #f97316; }
      .electron { fill: #3b82f6; }
      .cross { stroke: #dc2626; stroke-width: 2; }
      .bracket { stroke: #374151; stroke-width: 2; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f9fafb" rx="12"/>
  <text x="450" y="36" text-anchor="middle" class="title">Ionic Bonding: Dot-and-Cross for Sodium Chloride</text>

  <!-- Sodium atom -->
  <g>
    <circle cx="130" cy="220" r="55" class="shell"/>
    <circle cx="130" cy="220" r="24" class="nucleus"/>
    <text x="130" y="225" text-anchor="middle" class="label" fill="#ffffff">Na</text>
    <circle cx="185" cy="220" r="7" class="electron"/>
    <rect x="50" y="292" width="160" height="44" rx="6" class="label-bg" stroke="#e5e7eb"/>
    <text x="130" y="310" text-anchor="middle" class="sublabel">Na atom</text>
    <text x="130" y="328" text-anchor="middle" class="sublabel">1 outer electron</text>
  </g>

  <!-- Chlorine atom -->
  <g>
    <circle cx="360" cy="220" r="55" class="shell"/>
    <circle cx="360" cy="220" r="24" class="nucleus"/>
    <text x="360" y="225" text-anchor="middle" class="label" fill="#ffffff">Cl</text>
    <path class="cross" d="M 393.9 253.9 L 403.9 263.9 M 393.9 263.9 L 403.9 253.9"/>
    <path class="cross" d="M 355 270 L 365 280 M 355 280 L 365 270"/>
    <path class="cross" d="M 316.1 253.9 L 326.1 263.9 M 316.1 263.9 L 326.1 253.9"/>
    <path class="cross" d="M 300 215 L 310 225 M 300 225 L 310 215"/>
    <path class="cross" d="M 316.1 176.1 L 326.1 186.1 M 316.1 186.1 L 326.1 176.1"/>
    <path class="cross" d="M 355 160 L 365 170 M 355 170 L 365 160"/>
    <path class="cross" d="M 393.9 176.1 L 403.9 186.1 M 393.9 186.1 L 403.9 176.1"/>
    <circle cx="415" cy="220" r="7" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="280" y="292" width="160" height="44" rx="6" class="label-bg" stroke="#e5e7eb"/>
    <text x="360" y="310" text-anchor="middle" class="sublabel">Cl atom</text>
    <text x="360" y="328" text-anchor="middle" class="sublabel">7 outer electrons</text>
  </g>

  <!-- Electron transfer arrow -->
  <rect x="212" y="84" width="180" height="26" rx="4" class="label-bg"/>
  <text x="302" y="101" text-anchor="middle" class="sublabel">1 electron transferred</text>
  <path d="M 195 205 Q 300 105 405 205" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Separator arrow to products -->
  <line x1="468" y1="220" x2="512" y2="220" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sodium ion -->
  <g>
    <circle cx="600" cy="220" r="55" class="shell"/>
    <circle cx="600" cy="220" r="24" class="nucleus"/>
    <text x="600" y="225" text-anchor="middle" class="label" fill="#ffffff">Na</text>
    <circle cx="655" cy="220" r="7" class="electron"/>
    <circle cx="638.9" cy="258.9" r="7" class="electron"/>
    <circle cx="600" cy="275" r="7" class="electron"/>
    <circle cx="561.1" cy="258.9" r="7" class="electron"/>
    <circle cx="545" cy="220" r="7" class="electron"/>
    <circle cx="561.1" cy="181.1" r="7" class="electron"/>
    <circle cx="600" cy="165" r="7" class="electron"/>
    <circle cx="638.9" cy="181.1" r="7" class="electron"/>
    <path class="bracket" d="M 538 150 L 530 150 L 530 290 L 538 290"/>
    <path class="bracket" d="M 662 150 L 670 150 L 670 290 L 662 290"/>
    <text x="676" y="158" class="label">+</text>
    <rect x="512" y="302" width="176" height="30" rx="6" class="label-bg" stroke="#e5e7eb"/>
    <text x="600" y="321" text-anchor="middle" class="sublabel">[Na]⁺ — full shell (2,8)</text>
  </g>

  <!-- Chloride ion -->
  <g>
    <circle cx="790" cy="220" r="55" class="shell"/>
    <circle cx="790" cy="220" r="24" class="nucleus"/>
    <text x="790" y="225" text-anchor="middle" class="label" fill="#ffffff">Cl</text>
    <path class="cross" d="M 840 215 L 850 225 M 840 225 L 850 215"/>
    <path class="cross" d="M 823.9 253.9 L 833.9 263.9 M 823.9 263.9 L 833.9 253.9"/>
    <path class="cross" d="M 785 270 L 795 280 M 785 280 L 795 270"/>
    <path class="cross" d="M 746.1 253.9 L 756.1 263.9 M 746.1 263.9 L 756.1 253.9"/>
    <path class="cross" d="M 746.1 176.1 L 756.1 186.1 M 746.1 186.1 L 756.1 176.1"/>
    <path class="cross" d="M 785 160 L 795 170 M 785 170 L 795 160"/>
    <path class="cross" d="M 823.9 176.1 L 833.9 186.1 M 823.9 186.1 L 833.9 176.1"/>
    <circle cx="735" cy="220" r="7" class="electron"/>
    <path class="bracket" d="M 728 150 L 720 150 L 720 290 L 728 290"/>
    <path class="bracket" d="M 852 150 L 860 150 L 860 290 L 852 290"/>
    <text x="866" y="158" class="label">−</text>
    <rect x="700" y="302" width="180" height="30" rx="6" class="label-bg" stroke="#e5e7eb"/>
    <text x="790" y="321" text-anchor="middle" class="sublabel">[Cl]⁻ — 7 + 1 gained = 8</text>
  </g>

  <!-- Rules chips -->
  <text x="450" y="402" text-anchor="middle" class="label">Dot-and-cross rules</text>
  <rect x="90" y="420" width="230" height="46" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="205" y="447" text-anchor="middle" class="sublabel">Show outer shells only</text>
  <rect x="340" y="420" width="230" height="46" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="455" y="438" text-anchor="middle" class="sublabel">Dots for one atom,</text>
  <text x="455" y="456" text-anchor="middle" class="sublabel">crosses for the other</text>
  <rect x="590" y="420" width="240" height="46" rx="6" class="label-bg" stroke="#e5e7eb"/>
  <text x="710" y="438" text-anchor="middle" class="sublabel">Brackets and charge</text>
  <text x="710" y="456" text-anchor="middle" class="sublabel">on every ion</text>
</svg>
