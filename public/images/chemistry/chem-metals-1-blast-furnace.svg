<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Blast Furnace for Iron Extraction</title>
  <desc id="desc">A labelled schematic of a blast furnace showing iron ore, coke and limestone entering at the top, hot air blasted in near the bottom, and molten iron and slag tapped off.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">Blast Furnace: Reduction with Carbon</text>

  <!-- Furnace body -->
  <g transform="translate(300, 80)">
    <!-- Outer shell -->
    <path d="M40 0 L160 0 L180 80 L160 300 L140 380 L60 380 L40 300 L20 80 Z" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/>
    <!-- Fire / heat zone -->
    <path d="M55 260 L145 260 L135 300 L65 300 Z" fill="#fed7aa" opacity="0.8"/>
    <path d="M75 260 L95 230 L115 260 L105 220 L125 260" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

    <!-- Charge hopper -->
    <path d="M60 0 L80 -30 L120 -30 L140 0" fill="none" stroke="#4b5563" stroke-width="3"/>
    <line x1="80" y1="-30" x2="80" y2="-50" stroke="#64748b" stroke-width="2"/>
    <line x1="120" y1="-30" x2="120" y2="-50" stroke="#64748b" stroke-width="2"/>

    <!-- Air blast pipes -->
    <line x1="20" y1="320" x2="60" y2="300" stroke="#64748b" stroke-width="6"/>
    <line x1="180" y1="320" x2="140" y2="300" stroke="#64748b" stroke-width="6"/>

    <!-- Tapping holes -->
    <circle cx="45" cy="350" r="6" fill="#374151"/>
    <circle cx="155" cy="350" r="6" fill="#374151"/>

    <!-- Molten layers -->
    <ellipse cx="100" cy="360" rx="38" ry="8" fill="#1f2937"/>
    <path d="M62 360 Q100 380 138 360 L138 370 Q100 390 62 370 Z" fill="#991b1b" opacity="0.85"/>
    <path d="M62 370 Q100 390 138 370 L138 378 Q100 398 62 378 Z" fill="#d97706" opacity="0.9"/>
  </g>

  <!-- Input materials -->
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="70" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="35" y="20" text-anchor="middle" class="sublabel">Iron ore</text>
  </g>
  <g transform="translate(330, 20)">
    <rect x="0" y="0" width="50" height="30" rx="5" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <text x="25" y="20" text-anchor="middle" class="sublabel" fill="#f9fafb">Coke</text>
  </g>
  <g transform="translate(390, 20)">
    <rect x="0" y="0" width="70" height="30" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="35" y="20" text-anchor="middle" class="sublabel">Limestone</text>
  </g>

  <!-- Hot air labels -->
  <line x1="220" y1="420" x2="280" y2="385" class="line"/>
  <rect x="135" y="410" width="82" height="32" rx="4" class="label-bg"/>
  <text x="139" y="427" class="label">Hot air blast</text>
  <text x="139" y="441" class="sublabel">(~2000°C)</text>

  <line x1="580" y1="420" x2="520" y2="385" class="line"/>
  <rect x="584" y="410" width="82" height="32" rx="4" class="label-bg"/>
  <text x="588" y="427" class="label">Hot air blast</text>
  <text x="588" y="441" class="sublabel">(~2000°C)</text>

  <!-- Output labels -->
  <line x1="345" y1="440" x2="300" y2="470" class="line"/>
  <rect x="185" y="460" width="110" height="32" rx="4" class="label-bg"/>
  <text x="189" y="477" class="label">Molten iron</text>
  <text x="189" y="491" class="sublabel">(taps off bottom)</text>

  <line x1="455" y1="440" x2="500" y2="470" class="line"/>
  <rect x="505" y="460" width="95" height="32" rx="4" class="label-bg"/>
  <text x="509" y="477" class="label">Slag</text>
  <text x="509" y="491" class="sublabel">(taps above iron)</text>

  <!-- Reaction label -->
  <line x1="510" y1="180" x2="600" y2="150" class="line"/>
  <rect x="602" y="130" width="145" height="50" rx="4" class="label-bg"/>
  <text x="606" y="148" class="label">Redox reaction</text>
  <text x="606" y="164" class="sublabel">Fe₂O₃ + 3CO →</text>
  <text x="606" y="178" class="sublabel">2Fe + 3CO₂</text>

  <!-- Waste gas -->
  <line x1="400" y1="80" x2="400" y2="50" class="line"/>
  <rect x="355" y="20" width="100" height="18" rx="4" class="label-bg"/>
  <text x="405" y="33" text-anchor="middle" class="sublabel">Waste gases out</text>

  <!-- Note -->
  <rect x="130" y="515" width="540" height="32" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="400" y="535" text-anchor="middle" class="sublabel">Coke burns to CO, which reduces iron oxide; CO₂ exits at the top.</text>
</svg>