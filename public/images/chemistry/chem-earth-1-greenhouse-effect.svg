<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Greenhouse Effect</title>
  <desc id="desc">A diagram showing incoming solar radiation passing through the atmosphere, Earth re-radiating infrared heat, and greenhouse gases trapping some of that heat.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .sun-ray { fill: none; stroke-width: 3; stroke-linecap: round; }
      .heat-ray { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6,4; }
    </style>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#facc15"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">The Greenhouse Effect</text>

  <!-- Atmosphere band -->
  <rect x="80" y="80" width="500" height="360" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="330" y="110" text-anchor="middle" class="label" fill="#0369a1">Atmosphere with greenhouse gases</text>

  <!-- Earth -->
  <circle cx="330" cy="330" r="80" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <path d="M300,310 Q330,300 360,310 Q350,340 330,350 Q310,340 300,310" fill="#3b82f6" opacity="0.7"/>
  <path d="M270,350 Q300,370 330,360" fill="none" stroke="#15803d" stroke-width="2"/>

  <!-- Sun -->
  <circle cx="120" cy="160" r="35" fill="#facc15" stroke="#eab308" stroke-width="2"/>
  <text x="120" y="165" text-anchor="middle" class="label" fill="#854d0e">Sun</text>

  <!-- Incoming solar rays -->
  <line x1="160" y1="180" x2="260" y2="240" class="sun-ray" stroke="#facc15" marker-end="url(#arrow-yellow)"/>
  <line x1="155" y1="160" x2="250" y2="200" class="sun-ray" stroke="#facc15" marker-end="url(#arrow-yellow)"/>
  <line x1="160" y1="140" x2="260" y2="180" class="sun-ray" stroke="#facc15" marker-end="url(#arrow-yellow)"/>
  <rect x="100" y="215" width="80" height="18" rx="4" class="label-bg"/>
  <text x="104" y="228" class="sublabel">Solar radiation</text>

  <!-- Reflected heat rays -->
  <line x1="330" y1="250" x2="330" y2="150" class="heat-ray" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <line x1="360" y1="260" x2="430" y2="180" class="heat-ray" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <line x1="300" y1="260" x2="230" y2="180" class="heat-ray" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <rect x="355" y="175" width="82" height="18" rx="4" class="label-bg"/>
  <text x="360" y="188" class="sublabel">Heat escapes</text>

  <!-- Trapped heat rays -->
  <path d="M330,250 Q360,280 340,310" class="heat-ray" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <path d="M360,260 Q390,290 360,320" class="heat-ray" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <path d="M300,260 Q270,290 300,320" class="heat-ray" stroke="#ef4444" marker-end="url(#arrow-red)"/>

  <!-- Greenhouse gas molecules -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="10" fill="#f97316"/>
    <circle cx="14" cy="-6" r="10" fill="#9ca3af"/>
    <circle cx="14" cy="10" r="10" fill="#9ca3af"/>
    <text x="-35" y="5" class="sublabel">CO₂</text>
  </g>
  <g transform="translate(460, 150)">
    <circle cx="0" cy="0" r="10" fill="#64748b"/>
    <circle cx="16" cy="0" r="10" fill="#f97316"/>
    <text x="25" y="5" class="sublabel">CH₄</text>
  </g>
  <g transform="translate(180, 300)">
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="14" cy="6" r="8" fill="#f97316"/>
    <text x="-35" y="5" class="sublabel">H₂O</text>
  </g>

  <!-- Explanation panel -->
  <rect x="620" y="80" width="240" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="740" y="115" text-anchor="middle" class="label">Natural greenhouse effect</text>
  <text x="640" y="150" class="sublabel">1. Solar radiation passes</text>
  <text x="640" y="170" class="sublabel">   through atmosphere.</text>
  <text x="640" y="200" class="sublabel">2. Earth's surface warms.</text>
  <text x="640" y="230" class="sublabel">3. Earth re-radiates</text>
  <text x="640" y="250" class="sublabel">   infrared heat.</text>
  <text x="640" y="280" class="sublabel">4. Greenhouse gases</text>
  <text x="640" y="300" class="sublabel">   absorb and re-emit</text>
  <text x="640" y="320" class="sublabel">   heat back to Earth.</text>

  <rect x="640" y="350" width="200" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="740" y="375" text-anchor="middle" class="label" fill="#c2410c">Keeps Earth ~+15 °C</text>
  <text x="740" y="395" text-anchor="middle" class="sublabel" fill="#c2410c">Without it: ~−18 °C</text>

  <!-- Enhanced effect label -->
  <rect x="80" y="460" width="500" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="330" y="485" text-anchor="middle" class="label" fill="#991b1b">Enhanced greenhouse effect</text>
  <text x="330" y="508" text-anchor="middle" class="sublabel" fill="#991b1b">Human activities increase CO₂, CH₄ and H₂O vapour → more heat trapped → global warming</text>
</svg>
