<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Reaction pathway diagrams: exothermic and endothermic</title>
  <desc id="desc">Two energy level diagrams. Left: an exothermic reaction with products below reactants and a negative enthalpy change. Right: an endothermic reaction with products above reactants and a positive enthalpy change. Both show the activation energy hump.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .axis { stroke: #374151; stroke-width: 2; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#f9fafb" rx="12"/>
  <text x="400" y="36" text-anchor="middle" class="title">Reaction Pathway Diagrams</text>

  <!-- ============ LEFT: exothermic ============ -->
  <text x="240" y="100" text-anchor="middle" class="panel" fill="#c2410c">Exothermic</text>
  <line x1="90" y1="420" x2="90" y2="130" class="axis"/>
  <line x1="90" y1="420" x2="390" y2="420" class="axis"/>
  <text x="58" y="275" text-anchor="middle" class="label" transform="rotate(-90 58 275)">energy</text>
  <text x="240" y="450" text-anchor="middle" class="sublabel">progress of reaction</text>

  <!-- levels -->
  <line x1="100" y1="200" x2="190" y2="200" stroke="#374151" stroke-width="3"/>
  <line x1="290" y1="360" x2="360" y2="360" stroke="#374151" stroke-width="3"/>
  <text x="100" y="190" class="sublabel">reactants</text>
  <text x="288" y="350" class="sublabel">products</text>

  <!-- dashed reference lines -->
  <line x1="190" y1="200" x2="378" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="360" y1="360" x2="378" y2="360" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- curve -->
  <path d="M190 200 C225 195 240 142 270 142 C300 142 330 360 360 360" fill="none" stroke="#f97316" stroke-width="3"/>

  <!-- Ea arrow + label -->
  <line x1="270" y1="197" x2="270" y2="152" class="line" marker-end="url(#arr)"/>
  <text x="263" y="175" text-anchor="end" class="label">Eₐ</text>

  <!-- ΔH arrow + chip -->
  <line x1="380" y1="205" x2="380" y2="353" class="line" marker-end="url(#arr)"/>
  <rect x="330" y="380" width="100" height="20" rx="4" fill="#f9fafb"/>
  <text x="380" y="394" text-anchor="middle" class="sublabel">ΔH negative</text>

  <!-- ============ RIGHT: endothermic ============ -->
  <text x="635" y="100" text-anchor="middle" class="panel" fill="#1d4ed8">Endothermic</text>
  <line x1="500" y1="420" x2="500" y2="130" class="axis"/>
  <line x1="500" y1="420" x2="770" y2="420" class="axis"/>
  <text x="468" y="275" text-anchor="middle" class="label" transform="rotate(-90 468 275)">energy</text>
  <text x="635" y="450" text-anchor="middle" class="sublabel">progress of reaction</text>

  <!-- levels -->
  <line x1="510" y1="360" x2="600" y2="360" stroke="#374151" stroke-width="3"/>
  <line x1="690" y1="200" x2="760" y2="200" stroke="#374151" stroke-width="3"/>
  <text x="510" y="350" class="sublabel">reactants</text>
  <text x="755" y="192" text-anchor="end" class="sublabel">products</text>

  <!-- dashed reference lines -->
  <line x1="600" y1="360" x2="773" y2="360" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="760" y1="200" x2="773" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- curve -->
  <path d="M600 360 C630 350 635 145 655 145 C675 145 678 200 690 200" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Ea arrow + label -->
  <line x1="655" y1="355" x2="655" y2="152" class="line" marker-end="url(#arr)"/>
  <text x="663" y="205" class="label">Eₐ</text>

  <!-- ΔH arrow + chip -->
  <line x1="775" y1="355" x2="775" y2="207" class="line" marker-end="url(#arr)"/>
  <rect x="702" y="380" width="92" height="20" rx="4" fill="#f9fafb"/>
  <text x="748" y="394" text-anchor="middle" class="sublabel">ΔH positive</text>

  <!-- bottom note -->
  <text x="400" y="482" text-anchor="middle" class="sublabel">Eₐ = activation energy (reactants to peak)  ·  ΔH = overall energy change (reactants to products)</text>
</svg>
