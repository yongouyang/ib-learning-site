<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Opposite reactivity trends in Group I and Group VII</title>
  <desc id="desc">Down Group I, reactivity and density increase while melting point decreases. Down Group VII, reactivity decreases and density increases.</desc>
  <defs><style>.title{font:700 20px system-ui,sans-serif;fill:#111827}.head{font:700 17px system-ui,sans-serif;fill:#111827}.label{font:600 14px system-ui,sans-serif;fill:#1f2937}.small{font:13px system-ui,sans-serif;fill:#4b5563}.arrow{stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 9,3.5 0,7" fill="#475569"/></marker></defs>
  <rect width="800" height="480" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">Group Trends: Read the Direction Carefully</text>
  <rect x="35" y="65" width="345" height="375" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="420" y="65" width="345" height="375" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="207" y="98" text-anchor="middle" class="head">Group I — alkali metals</text>
  <text x="592" y="98" text-anchor="middle" class="head">Group VII — halogens</text>
  <g class="label"><text x="85" y="150">Li</text><text x="85" y="220">Na</text><text x="85" y="290">K</text><text x="85" y="360">Rb</text><text x="470" y="150">Cl₂</text><text x="470" y="220">Br₂</text><text x="470" y="290">I₂</text><text x="470" y="360">At₂</text></g>
  <path d="M130 140V370" class="arrow" stroke="#475569"/>
  <path d="M520 140V370" class="arrow" stroke="#475569"/>
  <g class="small"><text x="160" y="160">melting point decreases</text><text x="160" y="190">density increases</text><text x="160" y="220">reactivity increases</text><text x="550" y="160">density increases</text><text x="550" y="190">reactivity decreases</text><text x="550" y="220">appearance darkens</text></g>
  <rect x="150" y="265" width="185" height="90" rx="10" fill="#dbeafe"/><text x="242" y="300" text-anchor="middle" class="label">more reactive</text><text x="242" y="326" text-anchor="middle" class="small">down the group</text>
  <rect x="545" y="265" width="185" height="90" rx="10" fill="#ffedd5"/><text x="637" y="300" text-anchor="middle" class="label">less reactive</text><text x="637" y="326" text-anchor="middle" class="small">down the group</text>
  <text x="400" y="465" text-anchor="middle" class="small">A higher halogen displaces a lower halogen from its halide solution.</text>
</svg>