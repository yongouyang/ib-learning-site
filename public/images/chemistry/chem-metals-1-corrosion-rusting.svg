<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Rusting of Iron and Prevention Methods</title>
  <desc id="desc">A diagram showing an iron nail rusting when both oxygen and water are present, plus three common rust-prevention methods: paint barrier, galvanising, and alloying to stainless steel.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">Corrosion and Rusting of Iron</text>

  <!-- Rusting iron nail -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="260" height="180" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="130" y="25" text-anchor="middle" class="label">Rusting needs both</text>

    <!-- Water droplet -->
    <path d="M130 60 Q160 60 165 90 Q170 120 130 130 Q90 120 95 90 Q100 60 130 60" fill="#bfdbfe" opacity="0.6" stroke="#3b82f6" stroke-width="2"/>

    <!-- Iron nail -->
    <rect x="70" y="95" width="120" height="16" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
    <ellipse cx="190" cy="103" rx="8" ry="8" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>

    <!-- Rust patches -->
    <path d="M110 93 Q120 85 130 93 Q140 101 130 111 Q120 119 110 111 Q100 103 110 93" fill="#b45309" opacity="0.8"/>
    <path d="M150 95 Q158 88 166 95 Q174 102 166 110 Q158 117 150 110 Q142 103 150 95" fill="#b45309" opacity="0.8"/>

    <!-- O2 and H2O labels -->
    <circle cx="95" cy="75" r="16" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="95" y="80" text-anchor="middle" class="sublabel">O₂</text>

    <circle cx="170" cy="75" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="170" y="80" text-anchor="middle" class="sublabel">H₂O</text>

    <line x1="111" y1="75" x2="125" y2="85" class="line"/>
    <line x1="154" y1="75" x2="140" y2="85" class="line"/>

    <text x="130" y="160" text-anchor="middle" class="sublabel">4Fe + 3O₂ + 2H₂O</text>
    <text x="130" y="175" text-anchor="middle" class="sublabel">→ 2Fe₂O₃·H₂O</text>
  </g>

  <!-- Prevention methods -->
  <g transform="translate(380, 90)">
    <rect x="0" y="0" width="340" height="180" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" class="label">Rust prevention</text>

    <!-- Barrier: paint -->
    <g transform="translate(30, 55)">
      <rect x="0" y="10" width="80" height="20" rx="3" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
      <rect x="0" y="10" width="80" height="8" rx="2" fill="#f97316"/>
      <text x="40" y="55" text-anchor="middle" class="sublabel">Paint / oil /</text>
      <text x="40" y="69" text-anchor="middle" class="sublabel">plastic coating</text>
    </g>

    <!-- Galvanising -->
    <g transform="translate(130, 55)">
      <rect x="0" y="10" width="60" height="20" rx="3" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="-5" y="5" width="70" height="30" rx="5" fill="none" stroke="#f97316" stroke-width="3"/>
      <text x="30" y="55" text-anchor="middle" class="sublabel">Galvanising</text>
      <text x="30" y="69" text-anchor="middle" class="sublabel">(Zn layer)</text>
    </g>

    <!-- Alloying -->
    <g transform="translate(220, 55)">
      <rect x="0" y="10" width="80" height="20" rx="3" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="5" fill="#a855f7"/>
      <circle cx="45" cy="16" r="4" fill="#22c55e"/>
      <circle cx="65" cy="22" r="5" fill="#eab308"/>
      <text x="40" y="55" text-anchor="middle" class="sublabel">Alloying</text>
      <text x="40" y="69" text-anchor="middle" class="sublabel">(stainless steel)</text>
    </g>
  </g>

  <!-- Sacrificial protection detail -->
  <g transform="translate(80, 310)">
    <rect x="0" y="0" width="640" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="320" y="25" text-anchor="middle" class="label">Sacrificial protection: zinc corrodes instead of iron</text>

    <!-- Ship hull -->
    <path d="M100 120 L540 120 L500 80 L140 80 Z" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
    <text x="320" y="108" text-anchor="middle" class="sublabel">Steel ship hull (iron)</text>

    <!-- Zinc blocks -->
    <rect x="180" y="125" width="50" height="20" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <text x="205" y="140" text-anchor="middle" class="sublabel" fill="#f9fafb">Zn</text>

    <rect x="320" y="125" width="50" height="20" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <text x="345" y="140" text-anchor="middle" class="sublabel" fill="#f9fafb">Zn</text>

    <rect x="460" y="125" width="50" height="20" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <text x="485" y="140" text-anchor="middle" class="sublabel" fill="#f9fafb">Zn</text>

    <!-- Arrow and label -->
    <line x1="205" y1="60" x2="205" y2="80" class="arrow" stroke="#f97316" marker-end="url(#arrow-head)"/>
    <rect x="160" y="35" width="92" height="18" rx="4" class="label-bg"/>
    <text x="206" y="48" text-anchor="middle" class="sublabel" fill="#c2410c" font-weight="600">Zinc corrodes</text>

    <line x1="345" y1="60" x2="345" y2="80" class="arrow" stroke="#16a34a" marker-end="url(#arrow-head)"/>
    <rect x="305" y="35" width="82" height="18" rx="4" class="label-bg"/>
    <text x="346" y="48" text-anchor="middle" class="sublabel" fill="#15803d" font-weight="600">Iron protected</text>
  </g>
</svg>