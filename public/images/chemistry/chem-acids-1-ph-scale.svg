<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">The pH Scale and Indicators</title>
  <desc id="desc">The pH scale from 0 to 14 with colour zones for universal indicator and colour changes for litmus, phenolphthalein and methyl orange.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .bar-label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; fill: #1f2937; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">The pH Scale and Indicators</text>

  <!-- pH scale -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="45.7" height="40" fill="#ef4444"/>
    <rect x="45.7" y="0" width="45.7" height="40" fill="#ef4444"/>
    <rect x="91.4" y="0" width="45.7" height="40" fill="#ef4444"/>
    <rect x="137.1" y="0" width="45.7" height="40" fill="#ef4444"/>
    <rect x="182.9" y="0" width="45.7" height="40" fill="#f97316"/>
    <rect x="228.6" y="0" width="45.7" height="40" fill="#f97316"/>
    <rect x="274.3" y="0" width="45.7" height="40" fill="#facc15"/>
    <rect x="320.0" y="0" width="45.7" height="40" fill="#22c55e"/>
    <rect x="365.7" y="0" width="45.7" height="40" fill="#3b82f6"/>
    <rect x="411.4" y="0" width="45.7" height="40" fill="#3b82f6"/>
    <rect x="457.1" y="0" width="45.7" height="40" fill="#3b82f6"/>
    <rect x="502.9" y="0" width="45.7" height="40" fill="#8b5cf6"/>
    <rect x="548.6" y="0" width="45.7" height="40" fill="#8b5cf6"/>
    <rect x="594.3" y="0" width="45.7" height="40" fill="#8b5cf6"/>
    <rect x="640.0" y="0" width="45.7" height="40" fill="#8b5cf6"/>

    <!-- ticks -->
    <g stroke="#1f2937" stroke-width="1">
      <line x1="0" y1="40" x2="0" y2="50"/>
      <line x1="320" y1="40" x2="320" y2="50"/>
      <line x1="640" y1="40" x2="640" y2="50"/>
    </g>

    <text x="0" y="72" text-anchor="middle" class="label">0</text>
    <text x="320" y="72" text-anchor="middle" class="label">7 neutral</text>
    <text x="640" y="72" text-anchor="middle" class="label">14</text>

    <text x="110" y="100" text-anchor="middle" class="sublabel">acidic</text>
    <text x="530" y="100" text-anchor="middle" class="sublabel">alkaline</text>
  </g>

  <line x1="110" y1="75" x2="690" y2="75" class="line" marker-end="url(#arrow-grey)"/>
  <text x="400" y="68" text-anchor="middle" class="sublabel">increasing H⁺ concentration →</text>

  <!-- Indicator table -->
  <g transform="translate(80, 170)">
    <!-- Universal indicator -->
    <text x="90" y="30" text-anchor="end" class="label">Universal indicator</text>
    <rect x="110" y="14" width="90" height="24" fill="#ef4444"/>
    <rect x="200" y="14" width="60" height="24" fill="#f97316"/>
    <rect x="260" y="14" width="30" height="24" fill="#facc15"/>
    <rect x="290" y="14" width="30" height="24" fill="#22c55e"/>
    <rect x="320" y="14" width="90" height="24" fill="#3b82f6"/>
    <rect x="410" y="14" width="120" height="24" fill="#8b5cf6"/>

    <rect x="165" y="16" width="40" height="20" rx="4" class="label-bg"/>
    <text x="185" y="30" text-anchor="middle" class="bar-label">red</text>
    <rect x="205" y="16" width="50" height="20" rx="4" class="label-bg"/>
    <text x="230" y="30" text-anchor="middle" class="bar-label">orange</text>
    <rect x="350" y="16" width="40" height="20" rx="4" class="label-bg"/>
    <text x="370" y="30" text-anchor="middle" class="bar-label">green</text>
    <rect x="450" y="16" width="40" height="20" rx="4" class="label-bg"/>
    <text x="470" y="30" text-anchor="middle" class="bar-label">purple</text>

    <!-- Litmus -->
    <text x="90" y="75" text-anchor="end" class="label">Litmus</text>
    <rect x="110" y="59" width="210" height="24" fill="#ef4444"/>
    <rect x="320" y="59" width="210" height="24" fill="#3b82f6"/>
    <rect x="198" y="61" width="80" height="20" rx="4" class="label-bg"/>
    <text x="238" y="75" text-anchor="middle" class="bar-label">red in acid</text>
    <rect x="390" y="61" width="80" height="20" rx="4" class="label-bg"/>
    <text x="430" y="75" text-anchor="middle" class="bar-label">blue in alkali</text>

    <!-- Phenolphthalein -->
    <text x="90" y="120" text-anchor="end" class="label">Phenolphthalein</text>
    <rect x="110" y="104" width="246" height="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
    <rect x="356" y="104" width="174" height="24" fill="#ec4899"/>
    <rect x="198" y="106" width="80" height="20" rx="4" class="label-bg"/>
    <text x="238" y="120" text-anchor="middle" class="bar-label">colourless</text>
    <rect x="420" y="106" width="50" height="20" rx="4" class="label-bg"/>
    <text x="445" y="120" text-anchor="middle" class="bar-label">pink</text>

    <!-- Methyl orange -->
    <text x="90" y="165" text-anchor="end" class="label">Methyl orange</text>
    <rect x="110" y="149" width="93" height="24" fill="#ef4444"/>
    <rect x="203" y="149" width="33" height="24" fill="#f97316"/>
    <rect x="236" y="149" width="294" height="24" fill="#facc15"/>
    <rect x="145" y="151" width="36" height="20" rx="4" class="label-bg"/>
    <text x="163" y="165" text-anchor="middle" class="bar-label">red</text>
    <rect x="275" y="151" width="60" height="20" rx="4" class="label-bg"/>
    <text x="305" y="165" text-anchor="middle" class="bar-label">yellow</text>
  </g>

  <rect x="120" y="400" width="560" height="50" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="400" y="420" text-anchor="middle" class="sublabel">The pH scale is logarithmic: each whole step is a 10× change in H⁺ concentration.</text>
  <text x="400" y="438" text-anchor="middle" class="sublabel">pH 3 is 10× more acidic than pH 4, and 100× more acidic than pH 5.</text>

  <defs>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
