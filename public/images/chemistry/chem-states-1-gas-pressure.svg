<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Gas Pressure from Particle Collisions</title>
  <desc id="desc">A diagram showing gas particles moving randomly inside a container and colliding with the walls, creating pressure.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .container { fill: none; stroke: #4b5563; stroke-width: 3; }
      .arrow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow-orange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">Gas Pressure: Billions of Tiny Collisions</text>

  <!-- Container -->
  <rect x="200" y="90" width="400" height="300" class="container" rx="8"/>

  <!-- Particles -->
  <g fill="#3b82f6">
    <circle cx="260" cy="140" r="10"/><circle cx="330" cy="120" r="10"/><circle cx="400" cy="150" r="10"/><circle cx="480" cy="130" r="10"/><circle cx="550" cy="160" r="10"/>
    <circle cx="290" cy="200" r="10"/><circle cx="370" cy="220" r="10"/><circle cx="450" cy="200" r="10"/><circle cx="520" cy="230" r="10"/>
    <circle cx="240" cy="270" r="10"/><circle cx="320" cy="290" r="10"/><circle cx="420" cy="280" r="10"/><circle cx="500" cy="300" r="10"/><circle cx="570" cy="270" r="10"/>
    <circle cx="360" cy="340" r="10"/><circle cx="460" cy="350" r="10"/><circle cx="540" cy="340" r="10"/>
  </g>

  <!-- Motion arrows -->
  <line x1="260" y1="140" x2="235" y2="120" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>
  <line x1="400" y1="150" x2="420" y2="120" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>
  <line x1="550" y1="160" x2="575" y2="140" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>
  <line x1="290" y1="200" x2="270" y2="180" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>
  <line x1="520" y1="230" x2="545" y2="210" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>
  <line x1="420" y1="280" x2="400" y2="310" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>
  <line x1="500" y1="300" x2="525" y2="320" class="arrow" stroke="#f97316" marker-end="url(#arrow-orange)"/>

  <!-- Wall collision highlights -->
  <line x1="200" y1="135" x2="210" y2="135" stroke="#ef4444" stroke-width="3"/>
  <line x1="200" y1="260" x2="210" y2="260" stroke="#ef4444" stroke-width="3"/>
  <line x1="590" y1="190" x2="600" y2="190" stroke="#ef4444" stroke-width="3"/>
  <line x1="590" y1="310" x2="600" y2="310" stroke="#ef4444" stroke-width="3"/>
  <line x1="310" y1="90" x2="310" y2="100" stroke="#ef4444" stroke-width="3"/>
  <line x1="480" y1="390" x2="480" y2="400" stroke="#ef4444" stroke-width="3"/>

  <!-- Labels -->
  <rect x="610" y="175" width="150" height="42" rx="4" class="label-bg"/>
  <text x="615" y="192" class="label">Wall collisions</text>
  <text x="615" y="209" class="sublabel">Create force on container walls</text>
  <line x1="605" y1="196" x2="590" y2="196" class="line"/>

  <rect x="270" y="415" width="260" height="34" rx="4" class="label-bg"/>
  <text x="275" y="432" class="label">Pressure = total force from collisions per unit area</text>
  <text x="275" y="445" class="sublabel">Increases with temperature, number of particles, or reduced volume</text>
  <line x1="400" y1="413" x2="400" y2="400" class="line"/>

  <rect x="60" y="140" width="110" height="34" rx="4" class="label-bg"/>
  <text x="65" y="157" class="label">Gas particles</text>
  <text x="65" y="170" class="sublabel">Move randomly at high speed</text>
  <line x1="170" y1="157" x2="200" y2="157" class="line"/>
</svg>