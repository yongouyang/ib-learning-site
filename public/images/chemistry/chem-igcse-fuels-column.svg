<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Fractional Distillation of Petroleum</title>
  <desc id="desc">A fractionating column, hot at the bottom and cool at the top, separating heated crude oil vapour into seven fractions: refinery gas, petrol, naphtha, kerosene, diesel oil, fuel oil and bitumen, each labelled with its use.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .chip { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
    </style>
    <linearGradient id="columnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#f9fafb" rx="12"/>
  <text x="500" y="34" text-anchor="middle" class="title">Fractional Distillation of Petroleum</text>

  <!-- Fractionating column -->
  <rect x="150" y="70" width="130" height="470" rx="8" fill="url(#columnGrad)" stroke="#6b7280" stroke-width="2"/>

  <!-- Temperature arrows on the left -->
  <line x1="110" y1="150" x2="110" y2="470" class="line" marker-end="url(#arrow-grey)"/>
  <rect x="40" y="90" width="140" height="20" rx="4" class="chip"/>
  <text x="46" y="104" class="sublabel">Cooler at the top</text>
  <rect x="30" y="500" width="120" height="20" rx="4" class="chip"/>
  <text x="36" y="514" class="sublabel">Hotter, ≈400 °C</text>

  <!-- Crude oil inlet -->
  <line x1="30" y1="460" x2="148" y2="460" class="line" marker-end="url(#arrow-grey)"/>
  <rect x="24" y="424" width="126" height="32" rx="4" class="chip"/>
  <text x="30" y="437" class="label">Crude oil in</text>
  <text x="30" y="451" class="sublabel">heated to ≈400 °C</text>

  <!-- Outlet pipes and fraction chips (top to bottom) -->
  <!-- Refinery gas -->
  <line x1="280" y1="100" x2="330" y2="100" class="line"/>
  <rect x="332" y="84" width="300" height="34" rx="4" class="chip"/>
  <text x="340" y="98" class="label">Refinery gas</text>
  <text x="340" y="112" class="sublabel">bottled gas for heating and cooking</text>

  <!-- Petrol -->
  <line x1="280" y1="168" x2="330" y2="168" class="line"/>
  <rect x="332" y="152" width="300" height="34" rx="4" class="chip"/>
  <text x="340" y="166" class="label">Petrol (gasoline)</text>
  <text x="340" y="180" class="sublabel">fuel for cars</text>

  <!-- Naphtha -->
  <line x1="280" y1="236" x2="330" y2="236" class="line"/>
  <rect x="332" y="220" width="300" height="34" rx="4" class="chip"/>
  <text x="340" y="234" class="label">Naphtha</text>
  <text x="340" y="248" class="sublabel">feedstock for the chemical industry</text>

  <!-- Kerosene -->
  <line x1="280" y1="304" x2="330" y2="304" class="line"/>
  <rect x="332" y="288" width="300" height="34" rx="4" class="chip"/>
  <text x="340" y="302" class="label">Kerosene</text>
  <text x="340" y="316" class="sublabel">fuel for jet aircraft</text>

  <!-- Diesel -->
  <line x1="280" y1="372" x2="330" y2="372" class="line"/>
  <rect x="332" y="356" width="300" height="34" rx="4" class="chip"/>
  <text x="340" y="370" class="label">Diesel oil</text>
  <text x="340" y="384" class="sublabel">fuel for diesel engines</text>

  <!-- Fuel oil -->
  <line x1="280" y1="440" x2="330" y2="440" class="line"/>
  <rect x="332" y="424" width="300" height="34" rx="4" class="chip"/>
  <text x="340" y="438" class="label">Fuel oil</text>
  <text x="340" y="452" class="sublabel">fuel for ships and home heating</text>

  <!-- Bitumen (bottom drain) -->
  <line x1="215" y1="540" x2="215" y2="570" class="line" marker-end="url(#arrow-grey)"/>
  <rect x="270" y="556" width="300" height="34" rx="4" class="chip"/>
  <text x="278" y="570" class="label">Bitumen</text>
  <text x="278" y="584" class="sublabel">surfacing roads (largest molecules)</text>

  <!-- Trend note -->
  <rect x="680" y="84" width="290" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="694" y="108" class="label">Trend down the column</text>
  <text x="694" y="130" class="sublabel">Boiling point increases</text>
  <text x="694" y="150" class="sublabel">Chain length increases</text>
  <text x="694" y="170" class="sublabel">Volatility decreases</text>
  <text x="694" y="190" class="sublabel">Viscosity increases</text>
</svg>
