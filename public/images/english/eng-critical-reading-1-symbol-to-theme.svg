<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">From symbol through context and motif to theme</title>
  <desc id="desc">A concrete symbol acquires connotations from its context: red can mean stop at a traffic light, danger in a thriller or passion in a love poem. When a symbol recurs across a text it becomes a motif, and tracking that motif can support an interpretation of a theme. A warning notes that context must earn the interpretation.</desc>
  <rect width="920" height="560" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">A symbol does not carry one fixed meaning</text>

  <rect x="30" y="90" width="190" height="300" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="125" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">1 · SYMBOL</text>
  <circle cx="125" cy="204" r="48" fill="#dc2626"/>
  <text x="125" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">a concrete thing</text>
  <text x="125" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">object · place · colour</text>
  <text x="125" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">weather · event</text>
  <text x="125" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">example: red</text>

  <text x="237" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">→</text>
  <rect x="255" y="90" width="190" height="300" rx="9" fill="#fef2f2" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">2 · CONTEXT</text>
  <text x="350" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">activates connotations</text>
  <rect x="275" y="176" width="150" height="46" rx="6" fill="#ffffff"/>
  <text x="350" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">traffic light</text>
  <text x="350" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">stop</text>
  <rect x="275" y="234" width="150" height="46" rx="6" fill="#ffffff"/>
  <text x="350" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">thriller</text>
  <text x="350" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">danger</text>
  <rect x="275" y="292" width="150" height="46" rx="6" fill="#ffffff"/>
  <text x="350" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">love poem</text>
  <text x="350" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">passion</text>
  <text x="350" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">meaning depends on use</text>

  <text x="462" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">→</text>
  <rect x="480" y="90" width="190" height="300" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="575" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">3 · MOTIF</text>
  <text x="575" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">the symbol recurs</text>
  <rect x="502" y="180" width="146" height="8" rx="4" fill="#ddd6fe"/>
  <circle cx="523" cy="184" r="9" fill="#dc2626"/>
  <rect x="502" y="220" width="146" height="8" rx="4" fill="#ddd6fe"/>
  <circle cx="596" cy="224" r="9" fill="#dc2626"/>
  <rect x="502" y="260" width="146" height="8" rx="4" fill="#ddd6fe"/>
  <circle cx="550" cy="264" r="9" fill="#dc2626"/>
  <text x="575" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4c1d95">repetition ties the</text>
  <text x="575" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4c1d95">work together</text>
  <text x="575" y="367" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d28d9">track where it appears</text>

  <text x="687" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">→</text>
  <rect x="705" y="90" width="190" height="300" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="800" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">4 · THEME</text>
  <text x="800" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">an earned interpretation</text>
  <rect x="727" y="182" width="146" height="104" rx="7" fill="#ffffff"/>
  <text x="800" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">the big idea the</text>
  <text x="800" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">text explores</text>
  <text x="800" y="261" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">not the plot</text>
  <text x="800" y="321" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#14532d">repeated images +</text>
  <text x="800" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#14532d">ideas + contrasts</text>
  <text x="800" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">support the reading</text>

  <rect x="80" y="430" width="760" height="86" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">CONTEXT WARNING · DO NOT OVER-READ</text>
  <text x="460" y="491" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#78350f">The story must earn the interpretation — sometimes a tree really is just a tree.</text>
</svg>
