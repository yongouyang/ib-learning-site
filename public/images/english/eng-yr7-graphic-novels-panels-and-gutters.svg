<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">How a comic page is laid out</title>
  <desc id="desc">A comic page diagram showing tiers of panels separated by gutters, a splash panel, speech balloons, a caption box and a sound effect, with the reading order marked.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Panels, gutters and the reading path</text>
  <rect x="60" y="60" width="420" height="380" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="72" y="72" width="190" height="110" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="82" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">1</text>
  <rect x="270" y="72" width="198" height="110" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="280" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">2</text>
  <rect x="72" y="190" width="130" height="120" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="82" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">3</text>
  <rect x="210" y="190" width="120" height="120" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="220" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">4</text>
  <rect x="338" y="190" width="130" height="120" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="348" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">5</text>
  <rect x="72" y="318" width="396" height="110" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="82" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">6</text>
  <text x="150" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">SPLASH!</text>
  <rect x="200" y="96" width="120" height="40" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <text x="260" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">I am late!</text>
  <rect x="90" y="222" width="96" height="40" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.4"/>
  <text x="138" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#713f12" text-anchor="middle">Meanwhile…</text>
  <text x="370" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">THUD</text>
  <rect x="510" y="60" width="250" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="635.0" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">The parts</text>
  <text x="530" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Panel — one moment of time.</text>
  <text x="530" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Gutter — the gap between panels;</text>
  <text x="530" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">the reader fills it in.</text>
  <text x="530" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Tier — a row of panels.</text>
  <text x="530" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Splash — one panel across the</text>
  <text x="530" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">whole page, for impact.</text>
  <text x="530" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Caption — narration box.</text>
  <text x="530" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Balloon — speech.</text>
  <rect x="510" y="256" width="250" height="184" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="635.0" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Reading order</text>
  <text x="530" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Left to right, top to bottom —</text>
  <text x="530" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">the panels numbered 1 to 6 show</text>
  <text x="530" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">the path.</text>
  <text x="530" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Size controls pace: a wide panel</text>
  <text x="530" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">feels slow, a small one quick.</text>
  <text x="530" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">A borderless panel can suggest</text>
  <text x="530" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">a memory or a dream.</text>
  <text x="280" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">The gutter is where the reader does the work — the action you imagine happens there.</text>
</svg>
