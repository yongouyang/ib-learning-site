<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Stage directions and the stage plan</title>
  <desc id="desc">A plan view of a stage with the set, entrances, the audience and the blocking of two characters, showing how directions control meaning alongside the dialogue.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <defs><marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M 0 0 L 7 3 L 0 6 z" fill="#dc2626"/></marker></defs>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Stage directions: the playwright's instructions</text>
  <rect x="70" y="120" width="420" height="260" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="70" y="120" width="420" height="18" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="280" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">upstage / back of the stage</text>
  <rect x="70" y="362" width="420" height="18" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="280" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">downstage / nearest the audience</text>
  <rect x="150" y="180" width="120" height="70" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
  <text x="210" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#713f12" text-anchor="middle">set: bare room</text>
  <rect x="330" y="230" width="90" height="60" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="375" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">armchair</text>
  <circle cx="150" cy="300" r="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="150" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">A</text>
  <circle cx="450" cy="300" r="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="450" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">B</text>
  <line x1="170" y1="300" x2="436" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ae)"/>
  <text x="300" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">he turns to face her</text>
  <text x="60" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">audience</text>
  <rect x="510" y="120" width="250" height="260" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="635.0" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">What directions carry</text>
  <text x="530" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Movement: (crosses to the window)</text>
  <text x="530" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Tone: (quietly), (without looking</text>
  <text x="530" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">at her)</text>
  <text x="530" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Pace: (a long pause)</text>
  <text x="530" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Set: establishes mood and class</text>
  <text x="530" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">before anyone speaks</text>
  <text x="530" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Light and sound: mark time</text>
  <text x="530" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">passing, memory, or a shift in</text>
  <text x="530" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">power</text>
  <text x="530" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="530" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Quote directions as evidence,</text>
  <text x="530" y="441" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">exactly as you quote dialogue.</text>
  <text x="400" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">A direction like “The lights narrow to a single lamp” tells the audience he is waiting before he speaks.</text>
</svg>
