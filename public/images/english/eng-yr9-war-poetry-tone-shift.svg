<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">The tone shift in First World War poetry</title>
  <desc id="desc">A timeline from 1914 to 1918 showing the movement from patriotic idealism to protest and mourning, with the changing treatment of the same noble phrase, and the note that individual poems also shift tone internally.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">From patriotism to protest</text>
  <line x1="70" y1="200" x2="740" y2="200" stroke="#334155" stroke-width="2.4"/>
  <line x1="130" y1="190" x2="130" y2="210" stroke="#334155" stroke-width="2"/>
  <text x="130" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1914</text>
  <text x="130" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">eager and idealistic</text>
  <line x1="740" y1="190" x2="740" y2="210" stroke="#334155" stroke-width="2"/>
  <text x="740" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1918</text>
  <text x="740" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">bitter, angry, grieving</text>
  <rect x="150" y="96" width="240" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1d4ed8" text-anchor="middle">war as noble sacrifice,</text>
  <text x="270" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1d4ed8" text-anchor="middle">the soldier as hero</text>
  <rect x="420" y="96" width="300" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="middle">the trenches exposed the gap</text>
  <text x="570" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="middle">between the dream and the reality</text>
  <rect x="70" y="250" width="660" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400.0" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">The same phrase, turned against itself</text>
  <text x="94" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">“Dulce et decorum est pro patria mori” was an honoured Latin saying: it is sweet and fitting to die for one’s country.</text>
  <text x="94" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Wilfred Owen builds his poem towards it, then calls it “the old Lie”.</text>
  <text x="94" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">That is irony: quoting the noble language in order to expose it.</text>
  <text x="400" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Individual poems shift tone internally too — from calm description to horror, or from anger to tenderness.</text>
  <rect x="70" y="416" width="660" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">When comparing poems, track the tone against the date of writing: the first drafts of the myth,</text>
  <text x="90" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">then the correction.</text>
  <text x="90" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Quote the tone words themselves — bitter, grieving, ironic, tender — rather than saying “sad”.</text>
</svg>
