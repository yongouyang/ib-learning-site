<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Arteries, pulse and fever: the city-as-sick-body semantic field</title>
  <desc id="desc">Three words from a city description form one semantic field. 'Arteries' maps roads onto blood vessels, 'pulse' gives the city a bodily heartbeat, and 'fever' adds illness. Together, rather than as isolated words, they figure the city as a sick body and transfer associations of sickness onto it.</desc>
  <rect width="920" height="560" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Track the pattern, not just the separate words</text>

  <rect x="40" y="78" width="440" height="408" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="260" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">CITY DESCRIPTION · THREE CLUES</text>
  <g fill="#cbd5e1" stroke="#64748b" stroke-width="1.5">
    <rect x="80" y="240" width="70" height="140"/><rect x="165" y="184" width="84" height="196"/><rect x="264" y="220" width="62" height="160"/><rect x="341" y="152" width="88" height="228"/>
  </g>
  <g fill="#f8fafc">
    <rect x="96" y="260" width="12" height="14"/><rect x="121" y="260" width="12" height="14"/><rect x="183" y="205" width="12" height="14"/><rect x="214" y="205" width="12" height="14"/><rect x="281" y="240" width="12" height="14"/><rect x="359" y="174" width="12" height="14"/><rect x="395" y="174" width="12" height="14"/>
  </g>
  <path d="M60 380 C150 340 190 360 250 300 C310 240 360 300 450 250" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M78 430 L126 430 L143 400 L166 451 L186 410 L205 430 L252 430" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <rect x="370" y="350" width="22" height="82" rx="11" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="381" cy="428" r="17" fill="#f59e0b"/>
  <rect x="376" y="372" width="10" height="56" fill="#f59e0b"/>
  <rect x="76" y="130" width="124" height="42" rx="6" fill="#ffffff"/>
  <text x="138" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">“arteries”</text>
  <line x1="138" y1="172" x2="150" y2="340" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="212" y="118" width="104" height="42" rx="6" fill="#ffffff"/>
  <text x="264" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6d28d9">“pulse”</text>
  <line x1="264" y1="160" x2="188" y2="408" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="326" y="118" width="104" height="42" rx="6" fill="#ffffff"/>
  <text x="378" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b45309">“fever”</text>
  <line x1="378" y1="160" x2="381" y2="348" stroke="#6b7280" stroke-width="1.5"/>

  <text x="505" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#64748b">→</text>
  <rect x="540" y="78" width="340" height="408" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="710" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">ONE SEMANTIC FIELD</text>
  <rect x="574" y="144" width="272" height="66" rx="8" fill="#f5f3ff"/>
  <text x="710" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4c1d95">a cluster of words from</text>
  <text x="710" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4c1d95">one area of meaning: the body</text>
  <text x="710" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CITY = SICK BODY</text>
  <text x="710" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">the body imagery transfers</text>
  <text x="710" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">associations of illness</text>
  <text x="710" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">onto the whole city</text>
  <rect x="574" y="374" width="272" height="76" rx="8" fill="#f0fdf4"/>
  <text x="710" y="403" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#15803d">ANALYSE THE COMBINED EFFECT</text>
  <text x="710" y="429" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">the pattern carries more meaning</text>
  <text x="710" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">than one word analysed alone</text>
  <text x="460" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Name the shared field, then explain what its associations make the reader understand or feel.</text>
</svg>
