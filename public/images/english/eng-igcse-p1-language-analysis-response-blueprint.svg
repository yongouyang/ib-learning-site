<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint for a 200–250 word language-task response</title>
  <desc id="desc">A response blueprint allocates 200 to 250 words to a brief opening of one or two framing sentences naming aim and dominant effect, followed by about three developed analytical paragraphs of roughly 60 to 80 words each. Each paragraph develops one selection or pattern through the full analysis chain. There is no conclusion paragraph.</desc>
  <rect width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Design the short response before you draft it</text>

  <rect x="190" y="72" width="520" height="484" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="214" y="96" width="472" height="72" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">BRIEF FRAME · 1–2 SENTENCES</text>
  <text x="450" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1e3a8a">writer's overall aim + dominant effect</text>

  <rect x="214" y="184" width="472" height="96" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">ANALYTICAL PARAGRAPH 1 · 60–80 WORDS</text>
  <text x="450" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4c1d95">one selection or pattern → full analysis chain</text>
  <text x="450" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">word · connotation · effect · purpose</text>

  <rect x="214" y="296" width="472" height="96" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">ANALYTICAL PARAGRAPH 2 · 60–80 WORDS</text>
  <text x="450" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4c1d95">one selection or pattern → full analysis chain</text>
  <text x="450" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">every sentence carries a link</text>

  <rect x="214" y="408" width="472" height="96" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="437" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">ANALYTICAL PARAGRAPH 3 · 60–80 WORDS</text>
  <text x="450" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4c1d95">one selection or pattern → full analysis chain</text>
  <text x="450" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">developed, not a list of techniques</text>

  <rect x="300" y="520" width="300" height="22" rx="11" fill="#dcfce7"/>
  <text x="450" y="536" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">THEN STOP · NO CONCLUSION PARAGRAPH</text>

  <line x1="144" y1="72" x2="144" y2="556" stroke="#475569" stroke-width="2"/>
  <line x1="132" y1="72" x2="156" y2="72" stroke="#475569" stroke-width="2"/>
  <line x1="132" y1="556" x2="156" y2="556" stroke="#475569" stroke-width="2"/>
  <rect x="52" y="270" width="116" height="86" rx="8" fill="#0f172a"/>
  <text x="110" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">TOTAL</text>
  <text x="110" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">200–250</text>
  <text x="110" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">words</text>

  <rect x="738" y="150" width="130" height="238" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="803" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">THE CONSTRAINT</text>
  <text x="803" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">brief frame</text>
  <text x="803" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">about three</text>
  <text x="803" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">developed points</text>
  <text x="803" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">no conclusion</text>
  <text x="803" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">precision,</text>
  <text x="803" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">not an essay</text>
</svg>
