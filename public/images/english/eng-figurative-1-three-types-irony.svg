<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Verbal, situational and dramatic irony compared</title>
  <desc id="desc">Three kinds of irony are distinguished by their mismatches. Verbal irony contrasts words with meaning, situational irony contrasts an expected outcome with the actual outcome, and dramatic irony contrasts what the audience knows with what a character knows.</desc>
  <rect width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Irony is a mismatch — locate where it happens</text>

  <rect x="40" y="74" width="250" height="404" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">VERBAL</text>
  <text x="165" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1e3a8a">words ↔ intended meaning</text>
  <rect x="62" y="164" width="206" height="74" rx="7" fill="#ffffff"/>
  <text x="165" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">SAID</text>
  <text x="165" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-style="italic" fill="#0f172a">“What a beautiful day!”</text>
  <text x="165" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">↕</text>
  <rect x="62" y="288" width="206" height="88" rx="7" fill="#ffffff"/>
  <text x="165" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">MEANT</text>
  <text x="165" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">the hurricane makes</text>
  <text x="165" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">the day terrible</text>
  <text x="165" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">opposite of what</text>
  <text x="165" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">you mean</text>

  <rect x="325" y="74" width="250" height="404" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#15803d">SITUATIONAL</text>
  <text x="450" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#14532d">expectation ↔ outcome</text>
  <rect x="347" y="164" width="206" height="74" rx="7" fill="#ffffff"/>
  <text x="450" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">EXPECTED</text>
  <text x="450" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">a fire station is safe</text>
  <text x="450" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">from fire</text>
  <text x="450" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">↕</text>
  <rect x="347" y="288" width="206" height="88" rx="7" fill="#ffffff"/>
  <text x="450" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">ACTUAL</text>
  <text x="450" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">the fire station</text>
  <text x="450" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">burns down</text>
  <text x="450" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">outcome reverses</text>
  <text x="450" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">expectation</text>

  <rect x="610" y="74" width="250" height="404" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="735" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">DRAMATIC</text>
  <text x="735" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4c1d95">audience ↔ character</text>
  <rect x="632" y="164" width="206" height="74" rx="7" fill="#ffffff"/>
  <text x="735" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">AUDIENCE KNOWS</text>
  <text x="735" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">Juliet is not dead</text>
  <text x="735" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">↕</text>
  <rect x="632" y="288" width="206" height="88" rx="7" fill="#ffffff"/>
  <text x="735" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">ROMEO DOES NOT KNOW</text>
  <text x="735" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">he believes she is dead</text>
  <text x="735" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a">we cannot warn him</text>
  <text x="735" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">knowledge gap</text>
  <text x="735" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">creates tension</text>

  <text x="450" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Ask: is the mismatch in speech, events, or knowledge?</text>
</svg>
