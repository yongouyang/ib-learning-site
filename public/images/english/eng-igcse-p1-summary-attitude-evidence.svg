<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">From “much-trumpeted” to a supported statement of scepticism</title>
  <desc id="desc">The embedded quotation 'much-trumpeted' suggests that a promise has been loudly publicised rather than proved. That wording implies the writer's scepticism. The evidence and inference combine in the supported statement: the writer calls the promise 'much-trumpeted', which suggests scepticism.</desc>
  <rect width="920" height="500" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">An attitude answer needs evidence and an inference</text>

  <rect x="45" y="96" width="240" height="214" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">1 · EVIDENCE</text>
  <text x="165" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-style="italic" fill="#0f172a">“much-trumpeted”</text>
  <text x="165" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">a short quotation woven</text>
  <text x="165" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">into your own sentence</text>
  <text x="165" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb">notice the word choice</text>

  <text x="310" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#64748b">→</text>
  <rect x="340" y="96" width="240" height="214" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">2 · INFERENCE</text>
  <text x="460" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">loudly publicised</text>
  <text x="460" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">is not the same as proved</text>
  <line x1="390" y1="224" x2="530" y2="224" stroke="#fcd34d" stroke-width="2"/>
  <text x="460" y="259" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b45309">implies SCEPTICISM</text>
  <text x="460" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">the tone signals attitude</text>

  <text x="605" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#64748b">→</text>
  <rect x="635" y="96" width="240" height="214" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="755" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">3 · SUPPORTED STATEMENT</text>
  <text x="755" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">The writer calls the promise</text>
  <text x="755" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-style="italic" fill="#0f172a">“much-trumpeted”,</text>
  <text x="755" y="227" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">which suggests</text>
  <text x="755" y="253" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#15803d">scepticism.</text>

  <rect x="150" y="358" width="620" height="88" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">Quotation alone = evidence found, not necessarily understood.</text>
  <text x="460" y="421" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Always explain what the words imply about the writer's attitude.</text>
</svg>
