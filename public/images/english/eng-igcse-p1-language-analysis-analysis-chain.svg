<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">The language analysis chain: word, connotation, effect, purpose</title>
  <desc id="desc">The phrase 'the sea clawed at the hull' worked through four steps: the word 'clawed', its connotations of animal violence, the effect of making the boat feel like prey, and the writer's purpose of making the crossing feel threatening so the reader shares the crew's fear.</desc>

  <rect x="0" y="0" width="920" height="420" fill="#f8fafc"/>

  <!-- Source sentence -->
  <rect x="160" y="30" width="600" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="460" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" font-weight="400" fill="#1e293b">The sea clawed at the hull all night.</text>
  <rect x="372" y="72" width="52" height="4" rx="2" fill="#f59e0b"/>

  <text x="460" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">One original phrase worked through the four links of the analysis chain:</text>

  <!-- Box 1: WORD -->
  <rect x="30" y="140" width="185" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="31.5" y="141.5" width="182" height="32" rx="6" fill="#3b82f6"/>
  <rect x="31.5" y="161" width="182" height="12" fill="#3b82f6"/>
  <text x="122" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1 · WORD</text>
  <text x="122" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">'clawed'</text>
  <text x="122" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">quoted precisely —</text>
  <text x="122" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">two to six words</text>

  <!-- Arrow 1 -->
  <line x1="219" y1="212" x2="252" y2="212" stroke="#64748b" stroke-width="2"/>
  <polygon points="250,207 250,217 260,212" fill="#64748b"/>

  <!-- Box 2: CONNOTATION -->
  <rect x="260" y="140" width="185" height="150" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <rect x="261.5" y="141.5" width="182" height="32" rx="6" fill="#10b981"/>
  <rect x="261.5" y="161" width="182" height="12" fill="#10b981"/>
  <text x="352" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2 · CONNOTATION</text>
  <text x="352" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">animal violence —</text>
  <text x="352" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">scratching, tearing,</text>
  <text x="352" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">something alive trying</text>
  <text x="352" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">to get in</text>

  <!-- Arrow 2 -->
  <line x1="449" y1="212" x2="482" y2="212" stroke="#64748b" stroke-width="2"/>
  <polygon points="480,207 480,217 490,212" fill="#64748b"/>

  <!-- Box 3: EFFECT -->
  <rect x="490" y="140" width="185" height="150" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="491.5" y="141.5" width="182" height="32" rx="6" fill="#f59e0b"/>
  <rect x="491.5" y="161" width="182" height="12" fill="#f59e0b"/>
  <text x="582" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3 · EFFECT</text>
  <text x="582" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the boat feels like</text>
  <text x="582" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">prey; the danger</text>
  <text x="582" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">seems alive and</text>
  <text x="582" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">intentional</text>

  <!-- Arrow 3 -->
  <line x1="679" y1="212" x2="712" y2="212" stroke="#64748b" stroke-width="2"/>
  <polygon points="710,207 710,217 720,212" fill="#64748b"/>

  <!-- Box 4: PURPOSE -->
  <rect x="720" y="140" width="185" height="150" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="721.5" y="141.5" width="182" height="32" rx="6" fill="#6366f1"/>
  <rect x="721.5" y="161" width="182" height="12" fill="#6366f1"/>
  <text x="812" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4 · PURPOSE</text>
  <text x="812" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">to make the crossing</text>
  <text x="812" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">feel threatening, so</text>
  <text x="812" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the reader shares</text>
  <text x="812" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the crew's fear</text>

  <!-- Takeaway strip -->
  <rect x="180" y="330" width="560" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="363" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">Stop one link early and the marks stop with it.</text>
</svg>
