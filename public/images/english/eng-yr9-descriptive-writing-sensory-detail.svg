<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Sensory detail beyond sight</title>
  <desc id="desc">A wheel of the five senses with a prompt for each, beside examples that show the difference between telling and showing.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Sensory detail: beyond sight</text>
  <circle cx="250" cy="150" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="250.0" y="146.0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">sound</text>
  <text x="250.0" y="164.0" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">what can you hear?</text>
  <circle cx="364" cy="233" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="364.12678195541844" y="228.91796067500633" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">smell</text>
  <text x="364.12678195541844" y="246.91796067500633" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">what is in the air?</text>
  <circle cx="321" cy="367" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="320.5342302750968" y="363.08203932499373" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">touch</text>
  <text x="320.5342302750968" y="381.08203932499373" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">texture and temperature</text>
  <circle cx="179" cy="367" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="179.46576972490323" y="363.08203932499373" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">taste</text>
  <text x="179.46576972490323" y="381.08203932499373" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">what is in the mouth?</text>
  <circle cx="136" cy="233" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="135.87321804458156" y="228.91796067500633" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">sight</text>
  <text x="135.87321804458156" y="246.91796067500633" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">what is the light doing?</text>
  <rect x="430" y="80" width="330" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="595.0" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Telling</text>
  <text x="452" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">It was cold and quiet.</text>
  <text x="452" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="452" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">The room was messy.</text>
  <text x="452" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="452" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">She was nervous.</text>
  <rect x="430" y="280" width="330" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="595.0" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Showing</text>
  <text x="452" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Her breath clouded the window.</text>
  <text x="452" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155"></text>
  <text x="452" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Papers slid from the desk as she</text>
  <text x="452" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">turned.</text>
  <text x="452" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155"></text>
  <text x="452" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">She read the same line three times.</text>
  <text x="400" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Choose two senses and go deep rather than listing all five — atmosphere comes from precision, not quantity.</text>
</svg>
