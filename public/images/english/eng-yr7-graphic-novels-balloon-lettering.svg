<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">Balloon shape and lettering perform a comic voice</title>
  <desc id="desc">Four original comic examples show how visual form changes delivery: a small balloon with lowercase letters whispers 'stay close'; a jagged balloon with huge bold letters shouts 'LOOK OUT!'; a cloud-shaped thought balloon asks 'Did they hear us?'; and a rectangular caption reads 'Later that night…'.</desc>
  <rect width="900" height="580" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">You can “hear” a voice from its visual form</text>

  <rect x="35" y="76" width="195" height="420" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="132" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569">WHISPER</text>
  <ellipse cx="132" cy="224" rx="66" ry="48" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M174 260 L190 282 L165 266" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="132" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">stay close</text>
  <text x="132" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">small balloon</text>
  <text x="132" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">tiny lowercase lettering</text>
  <text x="132" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">suggests quiet or</text>
  <text x="132" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">fading strength</text>

  <rect x="255" y="76" width="195" height="420" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="352" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">SHOUT</text>
  <polygon points="352,150 370,174 399,158 401,188 431,190 414,216 434,237 404,246 409,276 379,266 364,294 346,270 320,290 315,260 283,266 294,236 268,219 293,201 281,174 313,179 322,150 340,172" fill="#fef3c7" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M391 273 L411 303 L382 281" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
  <text x="352" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">LOOK OUT!</text>
  <text x="352" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">jagged outline</text>
  <text x="352" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">huge bold capitals</text>
  <text x="352" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">make the words loud</text>

  <rect x="475" y="76" width="195" height="420" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="572" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">THOUGHT</text>
  <path d="M503 246 C482 239 486 209 508 202 C503 178 528 160 551 174 C570 147 607 156 615 182 C645 178 657 209 638 228 C648 253 620 270 599 259 C578 279 550 269 541 253 C525 263 510 257 503 246 Z" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
  <g fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8">
    <circle cx="606" cy="278" r="8"/><circle cx="620" cy="297" r="5"/>
  </g>
  <text x="572" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-style="italic" fill="#4c1d95">Did they</text>
  <text x="572" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-style="italic" fill="#4c1d95">hear us?</text>
  <text x="572" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">cloud-like outline</text>
  <text x="572" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d28d9">small trailing bubbles</text>
  <text x="572" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d28d9">mark unspoken thought</text>

  <rect x="695" y="76" width="170" height="420" rx="9" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="780" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a16207">CAPTION</text>
  <rect x="713" y="174" width="134" height="104" rx="3" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="780" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-style="italic" fill="#713f12">Later that</text>
  <text x="780" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-style="italic" fill="#713f12">night…</text>
  <text x="780" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#713f12">boxed narration</text>
  <text x="780" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#854d0e">carries the narrator's</text>
  <text x="780" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#854d0e">voice, not speech</text>

  <text x="450" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Shape tells you the kind of voice; lettering tells you how it sounds.</text>
</svg>
