<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
  <title id="title">Four checks to identify a poem's form</title>
  <desc id="desc">A flowchart showing four checks in order — count the lines and stanzas, letter the rhyme scheme, tap out the rhythm, and look at line lengths — feeding into five possible forms: sonnet, ballad, limerick, haiku, or open form.</desc>

  <rect x="0" y="0" width="800" height="580" fill="#f8fafc"/>

  <!-- Diagram heading -->
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Four checks to identify a poem's form</text>

  <!-- Check cards (left column) -->
  <g>
    <rect x="40" y="56" width="300" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="40" y="172" width="300" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="40" y="288" width="300" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="40" y="404" width="300" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Number badges -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="70" cy="82" r="13" fill="#3b82f6"/>
    <text x="70" y="87">1</text>
    <circle cx="70" cy="198" r="13" fill="#3b82f6"/>
    <text x="70" y="203">2</text>
    <circle cx="70" cy="314" r="13" fill="#3b82f6"/>
    <text x="70" y="319">3</text>
    <circle cx="70" cy="430" r="13" fill="#3b82f6"/>
    <text x="70" y="435">4</text>
  </g>

  <!-- Check card text -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="92" y="86" font-size="14" font-weight="600" fill="#1e293b">Count the lines and stanzas</text>
    <text x="92" y="108" font-size="12" fill="#475569">14 lines, one stanza → sonnet</text>
    <text x="92" y="126" font-size="12" fill="#475569">four-line quatrains → ballad</text>

    <text x="92" y="202" font-size="14" font-weight="600" fill="#1e293b">Letter the rhyme scheme</text>
    <text x="92" y="224" font-size="12" fill="#475569">mark the end words:</text>
    <text x="92" y="242" font-size="12" fill="#475569">ABAB · AABBA · ABCB</text>

    <text x="92" y="318" font-size="14" font-weight="600" fill="#1e293b">Tap out the rhythm</text>
    <text x="92" y="340" font-size="12" fill="#475569">count beats per line:</text>
    <text x="92" y="358" font-size="12" fill="#475569">ten beats = iambic pentameter</text>

    <text x="92" y="434" font-size="14" font-weight="600" fill="#1e293b">Look at line lengths</text>
    <text x="92" y="456" font-size="12" fill="#475569">regular, or deliberately</text>
    <text x="92" y="474" font-size="12" fill="#475569">jagged across the page?</text>
  </g>

  <!-- Down arrows between check cards -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="190" y1="146" x2="190" y2="168"/>
    <polyline points="183,162 190,171 197,162" fill="none"/>
    <line x1="190" y1="262" x2="190" y2="284"/>
    <polyline points="183,278 190,287 197,278" fill="none"/>
    <line x1="190" y1="378" x2="190" y2="400"/>
    <polyline points="183,394 190,403 197,394" fill="none"/>
  </g>

  <!-- Trunk and connectors to form chips -->
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="380" y1="100" x2="380" y2="492"/>
    <line x1="340" y1="100" x2="380" y2="100"/>
    <line x1="340" y1="216" x2="380" y2="216"/>
    <line x1="340" y1="332" x2="380" y2="332"/>
    <line x1="340" y1="448" x2="380" y2="448"/>
    <line x1="380" y1="100" x2="430" y2="100"/>
    <line x1="380" y1="198" x2="430" y2="198"/>
    <line x1="380" y1="296" x2="430" y2="296"/>
    <line x1="380" y1="394" x2="430" y2="394"/>
    <line x1="380" y1="492" x2="430" y2="492"/>
  </g>

  <!-- Form chips (right column) -->
  <g>
    <rect x="430" y="56" width="340" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="430" y="56" width="6" height="88" fill="#3b82f6"/>
    <rect x="430" y="154" width="340" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="430" y="154" width="6" height="88" fill="#f59e0b"/>
    <rect x="430" y="252" width="340" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="430" y="252" width="6" height="88" fill="#10b981"/>
    <rect x="430" y="350" width="340" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="430" y="350" width="6" height="88" fill="#8b5cf6"/>
    <rect x="430" y="448" width="340" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="430" y="448" width="6" height="88" fill="#64748b"/>
  </g>

  <!-- Form chip text -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="452" y="92" font-size="15" font-weight="700" fill="#1e293b">Sonnet</text>
    <text x="452" y="116" font-size="12" fill="#475569">14 lines · one stanza · iambic pentameter</text>

    <text x="452" y="190" font-size="15" font-weight="700" fill="#1e293b">Ballad</text>
    <text x="452" y="214" font-size="12" fill="#475569">quatrains · ABCB rhyme · tells a story</text>

    <text x="452" y="288" font-size="15" font-weight="700" fill="#1e293b">Limerick</text>
    <text x="452" y="312" font-size="12" fill="#475569">5 lines · AABBA · comic punchline</text>

    <text x="452" y="386" font-size="15" font-weight="700" fill="#1e293b">Haiku</text>
    <text x="452" y="410" font-size="12" fill="#475569">3 lines · 5-7-5 syllables · a moment in nature</text>

    <text x="452" y="484" font-size="15" font-weight="700" fill="#1e293b">Open form</text>
    <text x="452" y="508" font-size="12" fill="#475569">no fixed rules · the shape fits the subject</text>
  </g>
</svg>
