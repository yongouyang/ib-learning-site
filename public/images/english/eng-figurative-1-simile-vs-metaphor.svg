<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Simile versus metaphor comparison diagram</title>
  <desc id="desc">A diagram contrasting the two core comparison devices. On the left, a simile links two separate circles labelled smile and sunshine with a dashed bridge marked like or as. On the right, a metaphor merges the same two circles into one with an IS marker. Along the bottom, a chain of linked boxes (the world, a stage, players, exits) shows how an extended metaphor sustains one comparison across a passage.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <!-- Simile: two ideas kept separate, linked by 'like / as' -->
  <circle cx="130" cy="170" r="44" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="130" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">smile</text>
  <circle cx="290" cy="170" r="44" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <text x="290" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">sunshine</text>
  <line x1="176" y1="170" x2="244" y2="170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="175" y="158" width="70" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">like / as</text>

  <!-- Metaphor: two ideas merged into one identity -->
  <circle cx="540" cy="170" r="50" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="620" cy="170" r="50" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <text x="520" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">smile</text>
  <text x="642" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">sunshine</text>
  <rect x="566" y="158" width="28" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">IS</text>

  <!-- Extended metaphor: one comparison sustained across a passage -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4338ca">
    <line x1="235" y1="345" x2="255" y2="345" stroke="#6366f1" stroke-width="2"/>
    <line x1="385" y1="345" x2="405" y2="345" stroke="#6366f1" stroke-width="2"/>
    <line x1="535" y1="345" x2="555" y2="345" stroke="#6366f1" stroke-width="2"/>
    <rect x="105" y="327" width="130" height="36" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="170" y="349" text-anchor="middle">the world</text>
    <rect x="255" y="327" width="130" height="36" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="320" y="349" text-anchor="middle">a stage</text>
    <rect x="405" y="327" width="130" height="36" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="470" y="349" text-anchor="middle">players</text>
    <rect x="555" y="327" width="130" height="36" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="620" y="349" text-anchor="middle">exits</text>
  </g>

  <!-- Labels with backing rectangles and leader lines -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">
    <!-- Simile label -->
    <rect x="155" y="60" width="110" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="210" y="77" text-anchor="middle">Simile</text>
    <line x1="210" y1="84" x2="210" y2="122" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Metaphor label -->
    <rect x="535" y="60" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="580" y="77" text-anchor="middle">Metaphor</text>
    <line x1="580" y1="84" x2="580" y2="116" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Extended metaphor label -->
    <rect x="337" y="415" width="166" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="420" y="432" text-anchor="middle">Extended metaphor</text>
    <line x1="420" y1="415" x2="420" y2="367" stroke="#6b7280" stroke-width="1.5"/>
  </g>
  <text x="420" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">one comparison sustained across a whole passage</text>
</svg>
