<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">The four-step analysis method</title>
  <desc id="desc">A flow diagram of the four-step method for building an analytical paragraph — identify the technique, answer the question, explain the effect on the reader, explore the writer's intention — shown alongside a worked example using the simile 'solitary as an oyster'.</desc>

  <rect x="0" y="0" width="800" height="450" fill="#f8fafc"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="250" y="20" width="300" height="30" rx="4" fill="#f1f5f9"/>
  <text x="400" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">The four-step analysis method</text>

  <!-- Column headers -->
  <rect x="146" y="66" width="110" height="24" rx="4" fill="#f1f5f9"/>
  <text x="201" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Step</text>
  <rect x="493" y="66" width="130" height="24" rx="4" fill="#f1f5f9"/>
  <text x="558" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Worked example</text>

  <!-- Step 1 -->
  <circle cx="46" cy="138" r="16" fill="#6366f1"/>
  <text x="46" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="76" y="110" width="250" height="56" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="201" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Identify the technique</text>
  <line x1="326" y1="138" x2="356" y2="138" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="356" y="110" width="404" height="56" rx="6" fill="#f1f5f9"/>
  <text x="558" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">simile — 'solitary as an oyster'</text>

  <!-- Step 2 -->
  <circle cx="46" cy="214" r="16" fill="#6366f1"/>
  <text x="46" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="76" y="186" width="250" height="56" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="201" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Answer the question</text>
  <line x1="326" y1="214" x2="356" y2="214" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="356" y="186" width="404" height="56" rx="6" fill="#f1f5f9"/>
  <text x="558" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">presents Scrooge as shut off from other people</text>

  <!-- Step 3 -->
  <circle cx="46" cy="290" r="16" fill="#6366f1"/>
  <text x="46" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="76" y="262" width="250" height="56" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="201" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Explain the effect</text>
  <line x1="326" y1="290" x2="356" y2="290" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="356" y="262" width="404" height="56" rx="6" fill="#f1f5f9"/>
  <text x="558" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">an oyster is shut tight against people and only</text>
  <text x="558" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">emerges to feed — sociable only when it pays</text>

  <!-- Step 4 -->
  <circle cx="46" cy="366" r="16" fill="#6366f1"/>
  <text x="46" y="371" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="76" y="338" width="250" height="56" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="201" y="371" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Explore the writer's intention</text>
  <line x1="326" y1="366" x2="356" y2="366" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="356" y="338" width="404" height="56" rx="6" fill="#f1f5f9"/>
  <text x="558" y="371" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">sets up his isolation — and his need to change</text>

  <!-- Flow arrows down the step column -->
  <line x1="201" y1="168" x2="201" y2="184" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="201" y1="244" x2="201" y2="260" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="201" y1="320" x2="201" y2="336" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrowhead)"/>
</svg>
