<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Choosing between personification, pathetic fallacy, zoomorphism and anthropomorphism</title>
  <desc id="desc">A decision diagram based on what quality is transferred and to what. Human qualities given to a non-human thing indicate personification; if nature reflects human emotion, the specific device is pathetic fallacy. Animal characteristics given to humans or objects indicate zoomorphism, while human form or personality given to animals or gods indicates anthropomorphism.</desc>
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Start with the transfer — then test for emotion</text>

  <rect x="310" y="62" width="340" height="66" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3730a3">What is being attributed,</text>
  <text x="480" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3730a3">and to what?</text>

  <line x1="390" y1="128" x2="220" y2="166" stroke="#64748b" stroke-width="1.8"/>
  <line x1="480" y1="128" x2="480" y2="166" stroke="#64748b" stroke-width="1.8"/>
  <line x1="570" y1="128" x2="740" y2="166" stroke="#64748b" stroke-width="1.8"/>

  <rect x="40" y="170" width="360" height="94" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">HUMAN QUALITIES</text>
  <text x="220" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">to a non-human thing</text>
  <text x="220" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">“The wind whispered”</text>

  <rect x="430" y="170" width="100" height="94" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">ANIMAL</text>
  <text x="480" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">qualities to a</text>
  <text x="480" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">human or object</text>

  <rect x="560" y="170" width="360" height="94" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">HUMAN FORM OR PERSONALITY</text>
  <text x="740" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">to animals or gods</text>
  <text x="740" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">talking animals in fables</text>

  <line x1="220" y1="264" x2="220" y2="306" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="214,300 226,300 220,312" fill="#64748b"/>
  <rect x="40" y="314" width="360" height="86" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="220" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">DISCRIMINATOR</text>
  <text x="220" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#0f172a">Does nature reflect human emotion?</text>

  <line x1="150" y1="400" x2="135" y2="452" stroke="#64748b" stroke-width="1.8"/>
  <line x1="290" y1="400" x2="305" y2="452" stroke="#64748b" stroke-width="1.8"/>
  <rect x="30" y="454" width="190" height="130" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="125" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">YES · PATHETIC FALLACY</text>
  <text x="125" y="514" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">nature mirrors the mood</text>
  <text x="125" y="543" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">storm rages as</text>
  <text x="125" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">her anger grows</text>
  <rect x="230" y="454" width="190" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="325" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">NO · PERSONIFICATION</text>
  <text x="325" y="514" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">human quality only;</text>
  <text x="325" y="534" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">no emotion mirrored</text>
  <text x="325" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">the old car coughed</text>

  <line x1="480" y1="264" x2="480" y2="322" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="474,316 486,316 480,328" fill="#64748b"/>
  <rect x="430" y="330" width="100" height="190" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">ZOO-</text>
  <text x="480" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">MORPHISM</text>
  <text x="480" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#334155">“He wolfed</text>
  <text x="480" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#334155">down his</text>
  <text x="480" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#334155">food”</text>

  <line x1="740" y1="264" x2="740" y2="322" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="734,316 746,316 740,328" fill="#64748b"/>
  <rect x="620" y="330" width="240" height="190" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">ANTHROPOMORPHISM</text>
  <text x="740" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">animals or gods act as</text>
  <text x="740" y="423" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">human characters</text>
  <text x="740" y="463" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">a talking animal</text>
  <text x="740" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#64748b">in a fable</text>
</svg>
