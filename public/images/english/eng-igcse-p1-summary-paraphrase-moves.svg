<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Four paraphrase moves with a final meaning check</title>
  <desc id="desc">Four ways to put an idea into your own words: swap the synonym 'gruelling' for 'punishing'; change the word form in 'they were exhausted' to 'exhaustion set in'; restructure 'the storm delayed them' as 'they were delayed by the storm'; and compress a detailed image into 'a cramped room'. A meaning check warns that changing 'hostile' to 'unfriendly' softens the point.</desc>
  <rect width="900" height="610" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Change the wording — preserve the point</text>

  <rect x="45" y="74" width="810" height="94" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="45" y="74" width="180" height="94" rx="8" fill="#dbeafe"/>
  <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">1 · SYNONYM</text>
  <text x="135" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1e3a8a">swap the word</text>
  <text x="255" y="127" font-family="system-ui, sans-serif" font-size="17" fill="#334155">gruelling</text>
  <text x="430" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">→</text>
  <text x="515" y="127" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#0f172a">punishing</text>

  <rect x="45" y="184" width="810" height="94" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
  <rect x="45" y="184" width="180" height="94" rx="8" fill="#dcfce7"/>
  <text x="135" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#15803d">2 · WORD FORM</text>
  <text x="135" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">adjective → noun</text>
  <text x="255" y="237" font-family="system-ui, sans-serif" font-size="16" fill="#334155">they were exhausted</text>
  <text x="500" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">→</text>
  <text x="555" y="237" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a">exhaustion set in</text>

  <rect x="45" y="294" width="810" height="94" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="45" y="294" width="180" height="94" rx="8" fill="#ede9fe"/>
  <text x="135" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">3 · RESTRUCTURE</text>
  <text x="135" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4c1d95">flip the sentence</text>
  <text x="255" y="347" font-family="system-ui, sans-serif" font-size="16" fill="#334155">the storm delayed them</text>
  <text x="515" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">→</text>
  <text x="565" y="337" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">they were delayed</text>
  <text x="565" y="360" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">by the storm</text>

  <rect x="45" y="404" width="810" height="94" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="45" y="404" width="180" height="94" rx="8" fill="#fef3c7"/>
  <text x="135" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">4 · COMPRESSION</text>
  <text x="135" y="467" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">phrase → concise wording</text>
  <text x="255" y="447" font-family="system-ui, sans-serif" font-size="15" fill="#334155">a tiny room with no space to move</text>
  <text x="575" y="457" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">→</text>
  <text x="625" y="457" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">a cramped room</text>

  <rect x="110" y="530" width="680" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">MEANING CHECK · “hostile” is stronger than “unfriendly”</text>
  <text x="450" y="576" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">If the paraphrase softens or alters the idea, it has lost the point.</text>
</svg>
