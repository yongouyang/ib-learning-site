<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Lightbulb surrounded by six techniques for generating writing ideas</title>
  <desc id="desc">A glowing lightbulb is surrounded by labelled icons representing freewriting, prompts, asking 'what if?', observation, memory mining and constraints — the six strategies writers use to generate ideas.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <!-- Central lightbulb -->
  <g>
    <circle cx="400" cy="250" r="48" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
    <rect x="384" y="298" width="32" height="16" rx="3" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    <rect x="388" y="318" width="24" height="6" rx="3" fill="#9ca3af"/>
    <!-- Rays -->
    <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
      <line x1="400" y1="192" x2="400" y2="172"/>
      <line x1="452" y1="202" x2="466" y2="188"/>
      <line x1="348" y1="202" x2="334" y2="188"/>
      <line x1="458" y1="250" x2="480" y2="250"/>
      <line x1="342" y1="250" x2="320" y2="250"/>
    </g>
  </g>

  <!-- Prompts icon: speech bubble (top left) -->
  <g>
    <rect x="155" y="102" width="50" height="30" rx="8" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
    <path d="M 168 132 L 162 146 L 180 132 Z" fill="#6366f1"/>
    <circle cx="168" cy="117" r="3" fill="#ffffff"/>
    <circle cx="180" cy="117" r="3" fill="#ffffff"/>
    <circle cx="192" cy="117" r="3" fill="#ffffff"/>
  </g>

  <!-- Freewriting icon: pencil and flowing line (top centre) -->
  <g>
    <g transform="translate(400,110) rotate(-25)">
      <rect x="-22" y="-5" width="34" height="10" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
      <polygon points="12,-5 24,0 12,5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
    </g>
    <path d="M 368 138 Q 378 128 388 138 T 408 138 T 428 138" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- What if? icon: question mark in circle (top right) -->
  <g>
    <circle cx="620" cy="120" r="26" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="620" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff">?</text>
  </g>

  <!-- Observation icon: eye (bottom left) -->
  <g>
    <path d="M 145 380 Q 180 350 215 380 Q 180 410 145 380 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="180" cy="380" r="11" fill="#3b82f6"/>
    <circle cx="180" cy="380" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Constraints icon: dashed boundary box with star (bottom centre) -->
  <g>
    <rect x="375" y="365" width="50" height="50" rx="6" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="400,377 403.2,385.5 412.4,386 405.2,391.7 407.6,400.5 400,395.5 392.4,400.5 394.8,391.7 387.6,386 396.8,385.5" fill="#6366f1"/>
  </g>

  <!-- Memory mining icon: head with remembered ideas (bottom right) -->
  <g>
    <circle cx="614" cy="366" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <path d="M 594 402 Q 614 378 634 402 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <circle cx="634" cy="352" r="4" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="644" cy="341" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Labels with backing rectangles -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">
    <!-- Prompts label -->
    <rect x="140" y="40" width="80" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="180" y="57" text-anchor="middle">Prompts</text>
    <line x1="180" y1="64" x2="180" y2="100" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Freewriting label -->
    <rect x="345" y="40" width="110" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="400" y="57" text-anchor="middle">Freewriting</text>
    <line x1="400" y1="64" x2="400" y2="92" stroke="#6b7280" stroke-width="1.5"/>

    <!-- What if? label -->
    <rect x="580" y="40" width="80" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="620" y="57" text-anchor="middle">What if?</text>
    <line x1="620" y1="64" x2="620" y2="92" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Observation label -->
    <rect x="125" y="430" width="110" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="180" y="447" text-anchor="middle">Observation</text>
    <line x1="180" y1="412" x2="180" y2="430" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Constraints label -->
    <rect x="345" y="440" width="110" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="400" y="457" text-anchor="middle">Constraints</text>
    <line x1="400" y1="417" x2="400" y2="440" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Memory mining label -->
    <rect x="560" y="430" width="120" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="620" y="447" text-anchor="middle">Memory mining</text>
    <line x1="620" y1="404" x2="620" y2="430" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
