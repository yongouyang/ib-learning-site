<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">Active to passive: moving the experiment into focus</title>
  <desc id="desc">The active sentence 'The scientist conducted the experiment' is transformed into 'The experiment was conducted by the scientist.' The subject changes from the scientist performing the action to the experiment receiving it. The optional agent phrase 'by the scientist' can then be omitted.</desc>
  <rect width="900" height="580" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Voice changes what the sentence puts first</text>

  <rect x="40" y="70" width="820" height="176" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="88" width="130" height="34" rx="17" fill="#2563eb"/>
  <text x="125" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">ACTIVE</text>
  <text x="210" y="111" font-family="system-ui, sans-serif" font-size="13" fill="#1e3a8a">subject performs the action</text>
  <rect x="70" y="144" width="220" height="72" rx="7" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="180" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">SUBJECT · AGENT</text>
  <text x="180" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">The scientist</text>
  <text x="315" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">→</text>
  <rect x="340" y="144" width="180" height="72" rx="7" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="430" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">ACTION</text>
  <text x="430" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">conducted</text>
  <text x="545" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">→</text>
  <rect x="570" y="144" width="250" height="72" rx="7" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="695" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">OBJECT · RECEIVES ACTION</text>
  <text x="695" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">the experiment.</text>

  <line x1="450" y1="248" x2="450" y2="278" stroke="#64748b" stroke-width="2"/>
  <polygon points="442,274 458,274 450,286" fill="#64748b"/>

  <rect x="40" y="288" width="820" height="176" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <rect x="60" y="306" width="130" height="34" rx="17" fill="#16a34a"/>
  <text x="125" y="329" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">PASSIVE</text>
  <text x="210" y="329" font-family="system-ui, sans-serif" font-size="13" fill="#14532d">subject receives the action</text>
  <rect x="70" y="362" width="250" height="72" rx="7" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="195" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">SUBJECT · RECEIVES ACTION</text>
  <text x="195" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">The experiment</text>
  <rect x="350" y="362" width="190" height="72" rx="7" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="445" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">TO BE + PARTICIPLE</text>
  <text x="445" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">was conducted</text>
  <rect x="570" y="362" width="250" height="72" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="695" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">OPTIONAL AGENT</text>
  <text x="695" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">by the scientist.</text>

  <rect x="190" y="494" width="520" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">Agent unknown or unimportant? Omit it.</text>
  <text x="450" y="539" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">The experiment was conducted.</text>
</svg>
