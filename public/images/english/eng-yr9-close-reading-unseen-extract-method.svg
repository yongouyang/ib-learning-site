<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Read, notice, select, analyse, link: the unseen-extract workflow</title>
  <desc id="desc">A five-step workflow for an unseen extract. Read once for basic meaning; notice striking words, images, sentence shapes and shifts on a second reading; select three or four strong observations; analyse exact words, connotations and effects; then link each effect to the extract's bigger meaning or the writer's purpose.</desc>
  <rect width="960" height="500" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">A repeatable method for an unseen extract</text>

  <rect x="30" y="94" width="160" height="260" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="110" cy="126" r="18" fill="#3b82f6"/>
  <text x="110" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="110" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">READ</text>
  <text x="110" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">once for meaning:</text>
  <text x="110" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">who · what · where</text>
  <text x="110" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">what changes?</text>

  <text x="200" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" fill="#64748b">→</text>
  <rect x="218" y="94" width="160" height="260" rx="9" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="298" cy="126" r="18" fill="#0ea5e9"/>
  <text x="298" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="298" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0369a1">NOTICE</text>
  <text x="298" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">read again + annotate</text>
  <text x="298" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">words · images</text>
  <text x="298" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">sentence shapes · shifts</text>

  <text x="388" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" fill="#64748b">→</text>
  <rect x="406" y="94" width="160" height="260" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="486" cy="126" r="18" fill="#f59e0b"/>
  <text x="486" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="486" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#b45309">SELECT</text>
  <text x="486" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">three or four</text>
  <text x="486" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">strongest observations</text>
  <text x="486" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">not every annotation</text>

  <text x="576" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" fill="#64748b">→</text>
  <rect x="594" y="94" width="160" height="260" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="674" cy="126" r="18" fill="#8b5cf6"/>
  <text x="674" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="674" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#6d28d9">ANALYSE</text>
  <text x="674" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">zoom into exact words</text>
  <text x="674" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">explain connotations</text>
  <text x="674" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">and effects</text>

  <text x="764" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" fill="#64748b">→</text>
  <rect x="782" y="94" width="160" height="260" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="862" cy="126" r="18" fill="#22c55e"/>
  <text x="862" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="862" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#15803d">LINK</text>
  <text x="862" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">connect each effect to</text>
  <text x="862" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">the bigger meaning or</text>
  <text x="862" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">the writer's purpose</text>

  <rect x="170" y="396" width="620" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="423" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Keep the question or theme in view at every step.</text>
  <text x="480" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Select evidence you can say a lot about; depth beats a page of annotations.</text>
</svg>
