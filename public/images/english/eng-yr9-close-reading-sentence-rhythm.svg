<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Short, short, long: sentence rhythm in the note extract</title>
  <desc id="desc">The note's extract 'He ran. The alley narrowed. Somewhere behind him, a door opened, and footsteps — quick, unhurried, patient — began to follow.' is broken into two short sentences and one long sentence. Rhythm bars show two sharp beats followed by an extended beat, tightening the pace before the long sentence slows it and mirrors the pursuer's patience.</desc>
  <rect width="920" height="560" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Sentence length makes a rhythm you can hear</text>

  <rect x="40" y="78" width="540" height="382" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">THE NOTE'S EXTRACT</text>
  <rect x="64" y="132" width="492" height="64" rx="7" fill="#eff6ff"/>
  <text x="84" y="171" font-family="system-ui, sans-serif" font-size="18" font-style="italic" fill="#0f172a">He ran.</text>
  <rect x="64" y="212" width="492" height="64" rx="7" fill="#eff6ff"/>
  <text x="84" y="251" font-family="system-ui, sans-serif" font-size="18" font-style="italic" fill="#0f172a">The alley narrowed.</text>
  <rect x="64" y="292" width="492" height="140" rx="7" fill="#f5f3ff"/>
  <text x="84" y="326" font-family="system-ui, sans-serif" font-size="16" font-style="italic" fill="#0f172a">Somewhere behind him, a door opened,</text>
  <text x="84" y="355" font-family="system-ui, sans-serif" font-size="16" font-style="italic" fill="#0f172a">and footsteps — quick, unhurried, patient —</text>
  <text x="84" y="384" font-family="system-ui, sans-serif" font-size="16" font-style="italic" fill="#0f172a">began to follow.</text>

  <text x="750" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">RHYTHM MAP</text>
  <text x="610" y="163" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">SHORT</text>
  <rect x="690" y="146" width="62" height="24" rx="4" fill="#3b82f6"/>
  <text x="610" y="243" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">SHORT</text>
  <rect x="690" y="226" width="102" height="24" rx="4" fill="#3b82f6"/>
  <text x="610" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6d28d9">LONG</text>
  <rect x="690" y="323" width="192" height="24" rx="4" fill="#8b5cf6"/>
  <path d="M690 190 L690 202 M792 274 L792 286 M882 371 L882 400" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="750" y="414" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">sharp beat · sharp beat ·</text>
  <text x="750" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">extended beat</text>

  <rect x="70" y="488" width="780" height="48" rx="8" fill="#f1f5f9"/>
  <text x="460" y="509" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">Two short sentences tighten the pace; the long final sentence slows dreadfully,</text>
  <text x="460" y="528" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569">mirroring the pursuer's patience.</text>
</svg>
