<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Simple, compound and complex sentence clause blocks</title>
  <desc id="desc">Three sentence structures built from clause blocks. A simple sentence has one independent clause, a compound sentence joins two independent clauses with a conjunction, and a complex sentence joins a dependent clause to an independent clause.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Build the structure from its clauses</text>

  <rect x="40" y="72" width="150" height="100" rx="8" fill="#dbeafe"/>
  <text x="115" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">SIMPLE</text>
  <text x="115" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1e3a8a">one independent clause</text>
  <rect x="220" y="72" width="620" height="100" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="530" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">INDEPENDENT CLAUSE</text>
  <text x="530" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">The dog barked.</text>

  <rect x="40" y="210" width="150" height="100" rx="8" fill="#dcfce7"/>
  <text x="115" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#15803d">COMPOUND</text>
  <text x="115" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">independent + independent</text>
  <rect x="220" y="210" width="250" height="100" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="345" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">INDEPENDENT</text>
  <text x="345" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">The dog barked,</text>
  <rect x="490" y="237" width="70" height="46" rx="23" fill="#16a34a"/>
  <text x="525" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">and</text>
  <rect x="580" y="210" width="260" height="100" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="710" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">INDEPENDENT</text>
  <text x="710" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">the cat ran.</text>

  <rect x="40" y="348" width="150" height="100" rx="8" fill="#fef3c7"/>
  <text x="115" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#b45309">COMPLEX</text>
  <text x="115" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">dependent + independent</text>
  <rect x="220" y="348" width="310" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="375" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">DEPENDENT CLAUSE</text>
  <text x="375" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">Although the dog barked</text>
  <rect x="548" y="375" width="34" height="46" rx="17" fill="#f59e0b"/>
  <text x="565" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">,</text>
  <rect x="600" y="348" width="240" height="100" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="720" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">INDEPENDENT</text>
  <text x="720" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">the cat stayed.</text>

  <text x="450" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Ask how many clauses can stand alone — then notice how they are joined.</text>
</svg>
