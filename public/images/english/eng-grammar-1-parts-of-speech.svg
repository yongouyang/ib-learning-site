<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">The eight parts of speech</title>
  <desc id="desc">A central hub labelled Parts of Speech is surrounded by eight labelled icons representing noun, pronoun, verb, adjective, adverb, preposition, conjunction and interjection, the eight categories every word in a sentence belongs to.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <!-- Central hub -->
  <g>
    <rect x="325" y="224" width="150" height="52" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="400" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Parts of Speech</text>
  </g>

  <!-- Noun icon: house (person, place, thing) -->
  <g transform="translate(140, 160)">
    <polygon points="-19,-4 0,-22 19,-4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-14" y="-4" width="28" height="22" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="-4" y="6" width="8" height="12" fill="#ffffff"/>
  </g>

  <!-- Pronoun icon: person (replaces a noun) -->
  <g transform="translate(315, 160)">
    <circle cx="0" cy="-10" r="10" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <path d="M -16 20 Q 0 -4 16 20 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Verb icon: lightning bolt (action) -->
  <g transform="translate(485, 160)">
    <polygon points="4,-22 -12,4 -3,4 -6,22 12,-6 2,-6" fill="#fbbf24" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Adjective icon: star (describes a noun) -->
  <g transform="translate(660, 160)">
    <polygon points="0,-20 5,-7 19,-7 8,2 12,17 0,9 -12,17 -8,2 -19,-7 -5,-7" fill="#10b981" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Adverb icon: motion arrow (describes how) -->
  <g transform="translate(140, 340)">
    <line x1="-28" y1="-10" x2="-14" y2="-10" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="-8" y2="0" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="10" x2="-14" y2="10" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-2" y1="0" x2="18" y2="0" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
    <polygon points="16,-8 30,0 16,8" fill="#6366f1"/>
  </g>

  <!-- Preposition icon: ball on a surface (shows relationship) -->
  <g transform="translate(315, 340)">
    <line x1="-26" y1="12" x2="26" y2="12" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  </g>

  <!-- Conjunction icon: chain link (joins) -->
  <g transform="translate(485, 340)">
    <circle cx="-9" cy="0" r="11" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="9" cy="0" r="11" fill="none" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <!-- Interjection icon: speech bubble with exclamation -->
  <g transform="translate(660, 340)">
    <rect x="-22" y="-20" width="44" height="28" rx="9" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="-6,7 -12,20 4,7" fill="#ffffff" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="0" y1="-13" x2="0" y2="-4" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="1" r="2.4" fill="#ef4444"/>
  </g>

  <!-- Labels with backing rectangles -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">
    <!-- Noun label -->
    <rect x="95" y="95" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="140" y="112" text-anchor="middle">Noun</text>
    <line x1="140" y1="119" x2="140" y2="132" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Pronoun label -->
    <rect x="270" y="95" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="315" y="112" text-anchor="middle">Pronoun</text>
    <line x1="315" y1="119" x2="315" y2="132" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Verb label -->
    <rect x="440" y="95" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="485" y="112" text-anchor="middle">Verb</text>
    <line x1="485" y1="119" x2="485" y2="132" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Adjective label -->
    <rect x="615" y="95" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="660" y="112" text-anchor="middle">Adjective</text>
    <line x1="660" y1="119" x2="660" y2="132" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Adverb label -->
    <rect x="95" y="386" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="140" y="403" text-anchor="middle">Adverb</text>
    <line x1="140" y1="386" x2="140" y2="368" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Preposition label -->
    <rect x="265" y="386" width="100" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="315" y="403" text-anchor="middle">Preposition</text>
    <line x1="315" y1="386" x2="315" y2="368" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Conjunction label -->
    <rect x="435" y="386" width="100" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="485" y="403" text-anchor="middle">Conjunction</text>
    <line x1="485" y1="386" x2="485" y2="368" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Interjection label -->
    <rect x="610" y="386" width="100" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="660" y="403" text-anchor="middle">Interjection</text>
    <line x1="660" y1="386" x2="660" y2="368" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
