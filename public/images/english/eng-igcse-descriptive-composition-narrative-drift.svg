<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" role="img" aria-labelledby="title desc">
  <title id="title">Sensory description versus narrative drift</title>
  <desc id="desc">Description stays focused on observation and minimal change, such as light fading, a train pulling in or a crowd going quiet. Narrative drift begins when consequential action verbs form a plot chain: a thief grabs a purse, a trader chases him and the narrator runs. The rescue is to cut the event but keep its sensory residue: the shout, overturned basket and oranges rolling across the stones.</desc>
  <rect width="920" height="590" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Keep the place in focus — do not let a plot take over</text>

  <rect x="40" y="80" width="395" height="322" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="237" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#15803d">SENSORY DESCRIPTION</text>
  <text x="237" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#14532d">observation + minimal change</text>
  <rect x="70" y="176" width="335" height="76" rx="7" fill="#ffffff"/>
  <text x="237" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">the light fades · a train pulls in</text>
  <text x="237" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">a crowd goes quiet</text>
  <text x="237" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#15803d">the scene may change, but no plot develops</text>
  <text x="237" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">attention stays on what is</text>
  <text x="237" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">seen · heard · smelled</text>
  <text x="237" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">precise detail replaces a chain of events</text>

  <rect x="485" y="80" width="395" height="322" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="682" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">NARRATIVE DRIFT</text>
  <text x="682" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f1d1d">consequential actions queue into a plot</text>
  <rect x="515" y="176" width="335" height="76" rx="7" fill="#ffffff"/>
  <text x="682" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">a problem appears; someone acts;</text>
  <text x="682" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">events lead to a goal</text>
  <rect x="520" y="278" width="96" height="44" rx="6" fill="#fee2e2"/>
  <text x="568" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">grabbed</text>
  <text x="632" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#b91c1c">→</text>
  <rect x="648" y="278" width="96" height="44" rx="6" fill="#fee2e2"/>
  <text x="696" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">chased</text>
  <text x="760" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#b91c1c">→</text>
  <rect x="776" y="278" width="76" height="44" rx="6" fill="#fee2e2"/>
  <text x="814" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">ran</text>
  <text x="682" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">CONSEQUENTIAL VERBS = PLOT CHAIN</text>
  <text x="682" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">the place becomes a backdrop for a story</text>

  <path d="M700 412 C700 452 240 452 240 412" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="234,418 246,418 240,406" fill="#64748b"/>
  <rect x="90" y="458" width="740" height="92" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="460" y="488" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">RESCUE · CUT THE EVENT, KEEP ITS SENSORY RESIDUE</text>
  <text x="460" y="519" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">the shout · the overturned basket · oranges rolling across the stones</text>
  <text x="460" y="541" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Retain the observed detail; remove the chase.</text>
</svg>
