<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Formal letter layout and conventions</title>
  <desc id="desc">A formal letter with its parts labelled: the sender’s address, the date, the recipient’s address, the salutation, a subject line, the body paragraphs, and a sign-off matched to the salutation.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Formal letter layout</text>
  <rect x="70" y="64" width="380" height="370" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">A. Okafor</text>
  <text x="90" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">12 Marine Road</text>
  <text x="90" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Singapore 440012</text>
  <text x="90" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">4 March 2026</text>
  <text x="90" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">The Customer Services Manager</text>
  <text x="90" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Northline Rail</text>
  <text x="90" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">88 Central Way</text>
  <text x="90" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Dear Sir or Madam,</text>
  <text x="90" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Subject: delay on the 07:12 service</text>
  <text x="90" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">I am writing to complain about the delay</text>
  <text x="90" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">on 28 February, which left me stranded.</text>
  <text x="90" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Yours faithfully,</text>
  <text x="90" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">A. Okafor</text>
  <rect x="480" y="64" width="280" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="620.0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Why each part matters</text>
  <text x="502" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Your address: top right or left, no</text>
  <text x="502" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">name needed above it.</text>
  <text x="502" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="502" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Recipient and date: signals you</text>
  <text x="502" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">expect a formal reply.</text>
  <text x="502" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="502" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Salutation: “Dear Sir or Madam” when</text>
  <text x="502" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">the name is unknown.</text>
  <text x="502" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="502" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Sign-off must match:</text>
  <text x="502" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">  Dear Sir or Madam → Yours faithfully</text>
  <text x="502" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">  Dear Ms Chen → Yours sincerely</text>
  <text x="502" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="502" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Subject line: tells the reader the</text>
  <text x="502" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">purpose at once.</text>
  <text x="502" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155"></text>
  <text x="502" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">One point per paragraph, and a</text>
  <text x="502" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">clear request at the end.</text>
  <text x="400" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">An informal letter needs only your address, the date, “Dear …” and a friendly sign-off like Best wishes.</text>
</svg>
