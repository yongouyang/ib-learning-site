<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Speaker at a podium with rhetorical appeals and audience</title>
  <desc id="desc">A diagram showing a speaker standing at a podium and addressing an audience. Above the speaker are icons representing ethos (badge), pathos (heart), and logos (bar chart). Labels identify the speaker, audience, and the three rhetorical appeals.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Audience silhouettes in background -->
  <g fill="#cbd5e1">
    <circle cx="120" cy="360" r="18"/>
    <path d="M 90 430 Q 120 390 150 430 L 150 470 L 90 470 Z"/>
    <circle cx="200" cy="350" r="20"/>
    <path d="M 165 430 Q 200 385 235 430 L 235 470 L 165 470 Z"/>
    <circle cx="600" cy="350" r="20"/>
    <path d="M 565 430 Q 600 385 635 430 L 635 470 L 565 470 Z"/>
    <circle cx="680" cy="360" r="18"/>
    <path d="M 650 430 Q 680 390 710 430 L 710 470 L 650 470 Z"/>
    <circle cx="400" cy="340" r="22"/>
    <path d="M 360 430 Q 400 380 440 430 L 440 470 L 360 470 Z"/>
  </g>

  <!-- Stage floor -->
  <path d="M 50 400 L 750 400 L 780 470 L 20 470 Z" fill="url(#stageGrad)" stroke="#475569" stroke-width="2"/>

  <!-- Podium -->
  <g transform="translate(360, 260)">
    <rect x="0" y="0" width="80" height="110" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="-10" y="-15" width="100" height="25" rx="4" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <!-- Microphone -->
    <line x1="40" y1="-15" x2="40" y2="-55" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="-62" r="10" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Speaker -->
  <g transform="translate(385, 140)">
    <!-- Body -->
    <path d="M -35 130 Q -45 200 -50 240 L 50 240 Q 45 200 35 130 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Neck -->
    <rect x="-10" y="80" width="20" height="30" fill="#f1c40f"/>
    <!-- Head -->
    <circle cx="0" cy="55" r="32" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
    <!-- Hair -->
    <path d="M -32 45 Q -20 10 0 12 Q 25 10 32 45 Q 32 25 20 15 Q 0 5 -20 15 Q -32 25 -32 45" fill="#1f2937"/>
    <!-- Face -->
    <circle cx="-10" cy="55" r="3" fill="#1f2937"/>
    <circle cx="10" cy="55" r="3" fill="#1f2937"/>
    <path d="M -8 68 Q 0 74 8 68" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Appeal icons above speaker -->
  <g transform="translate(260, 60)">
    <!-- Ethos badge -->
    <circle cx="30" cy="30" r="26" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <path d="M 30 18 L 34 26 L 43 27 L 36 34 L 38 43 L 30 39 L 22 43 L 24 34 L 17 27 L 26 26 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <rect x="15" y="62" width="30" height="20" rx="4" fill="#f9fafb" stroke="#e2e8f0" stroke-width="1"/>
    <text x="30" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Ethos</text>
  </g>

  <g transform="translate(360, 40)">
    <!-- Pathos heart -->
    <path d="M 30 50 C 10 30 0 20 0 10 C 0 0 10 -5 18 2 C 24 8 30 20 30 20 C 30 20 36 8 42 2 C 50 -5 60 0 60 10 C 60 20 50 30 30 50 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <rect x="10" y="62" width="40" height="20" rx="4" fill="#f9fafb" stroke="#e2e8f0" stroke-width="1"/>
    <text x="30" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Pathos</text>
  </g>

  <g transform="translate(470, 60)">
    <!-- Logos chart -->
    <rect x="5" y="15" width="50" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <line x1="10" y1="50" x2="50" y2="50" stroke="#16a34a" stroke-width="2"/>
    <line x1="10" y1="50" x2="10" y2="20" stroke="#16a34a" stroke-width="2"/>
    <rect x="14" y="35" width="8" height="15" fill="#22c55e"/>
    <rect x="26" y="25" width="8" height="25" fill="#22c55e"/>
    <rect x="38" y="18" width="8" height="32" fill="#22c55e"/>
    <rect x="15" y="62" width="30" height="20" rx="4" fill="#f9fafb" stroke="#e2e8f0" stroke-width="1"/>
    <text x="30" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Logos</text>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(540, 180)">
    <rect x="0" y="0" width="180" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 0 50 L -20 70 L 20 60" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 4 52 L -14 68 L 18 58" fill="#ffffff" stroke="none"/>
    <text x="90" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Claim → Reason →</text>
    <text x="90" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Evidence</text>
  </g>

  <!-- Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0f172a">
    <!-- Speaker label -->
    <rect x="360" y="250" width="80" height="24" rx="4" fill="#f9fafb" opacity="0.95"/>
    <text x="400" y="267" text-anchor="middle" font-weight="600">Speaker</text>

    <!-- Audience label -->
    <rect x="360" y="440" width="80" height="24" rx="4" fill="#f9fafb" opacity="0.95"/>
    <text x="400" y="457" text-anchor="middle" font-weight="600">Audience</text>

    <!-- Appeals label -->
    <rect x="340" y="10" width="120" height="24" rx="4" fill="#f9fafb" opacity="0.95"/>
    <text x="400" y="27" text-anchor="middle" font-weight="600">Rhetorical Appeals</text>
  </g>
</svg>
