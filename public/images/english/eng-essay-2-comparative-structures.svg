<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Comparative essay structures: point-by-point versus block method</title>
  <desc id="desc">Two essay skeletons compared. The point-by-point (integrated) structure discusses both Text A and Text B inside every paragraph on a shared point such as theme or narrative voice, fuelled by comparative connectives. The block method writes all of Text A first, then all of Text B, so the texts never meet — a structure to avoid.</desc>

  <rect x="0" y="0" width="800" height="460" fill="#f8fafc"/>

  <!-- Column headers -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">
    <rect x="150" y="26" width="240" height="28" rx="4" fill="#f1f5f9"/>
    <text x="270" y="45" text-anchor="middle">Point-by-point (integrated) ✓</text>
    <rect x="450" y="26" width="160" height="28" rx="4" fill="#f1f5f9"/>
    <text x="530" y="45" text-anchor="middle">Block method ✗</text>
  </g>

  <!-- Left column: point-by-point skeleton -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Introduction -->
    <rect x="190" y="72" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="270" y="96" text-anchor="middle" font-size="13" fill="#1e293b">Introduction</text>
    <line x1="270" y1="110" x2="270" y2="128" stroke="#94a3b8" stroke-width="2"/>

    <!-- Paragraph 1 -->
    <rect x="150" y="128" width="240" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="270" y="149" text-anchor="middle" font-size="13" fill="#475569">Shared point: theme</text>
    <rect x="165" y="160" width="100" height="30" rx="4" fill="#dbeafe"/>
    <text x="215" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Text A</text>
    <rect x="275" y="160" width="100" height="30" rx="4" fill="#fef3c7"/>
    <text x="325" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Text B</text>
    <line x1="270" y1="208" x2="270" y2="226" stroke="#94a3b8" stroke-width="2"/>

    <!-- Paragraph 2 -->
    <rect x="150" y="226" width="240" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="270" y="247" text-anchor="middle" font-size="13" fill="#475569">Shared point: narrative voice</text>
    <rect x="165" y="258" width="100" height="30" rx="4" fill="#dbeafe"/>
    <text x="215" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Text A</text>
    <rect x="275" y="258" width="100" height="30" rx="4" fill="#fef3c7"/>
    <text x="325" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Text B</text>
    <line x1="270" y1="306" x2="270" y2="324" stroke="#94a3b8" stroke-width="2"/>

    <!-- Conclusion -->
    <rect x="190" y="324" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="270" y="348" text-anchor="middle" font-size="13" fill="#1e293b">Conclusion</text>

    <!-- Connectives footer chip -->
    <rect x="115" y="390" width="310" height="28" rx="4" fill="#f1f5f9"/>
    <text x="270" y="409" text-anchor="middle" font-size="13" fill="#1e293b">Connectives: similarly · however · whereas</text>
  </g>

  <!-- Right column: block method skeleton -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Introduction -->
    <rect x="450" y="72" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="530" y="96" text-anchor="middle" font-size="13" fill="#1e293b">Introduction</text>
    <line x1="530" y1="110" x2="530" y2="128" stroke="#94a3b8" stroke-width="2"/>

    <!-- Text A block -->
    <rect x="430" y="128" width="200" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="530" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Text A only</text>
    <line x1="530" y1="172" x2="530" y2="188" stroke="#94a3b8" stroke-width="2"/>
    <rect x="430" y="188" width="200" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="530" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Text A only</text>

    <!-- gap: no connector — the texts never meet -->

    <!-- Text B block -->
    <rect x="430" y="262" width="200" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="530" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Text B only</text>
    <line x1="530" y1="306" x2="530" y2="318" stroke="#94a3b8" stroke-width="2"/>
    <rect x="430" y="318" width="200" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="530" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Text B only</text>
    <line x1="530" y1="362" x2="530" y2="380" stroke="#94a3b8" stroke-width="2"/>

    <!-- Conclusion -->
    <rect x="450" y="380" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="530" y="404" text-anchor="middle" font-size="13" fill="#1e293b">Conclusion</text>
  </g>

  <!-- Right-side labels with leader lines -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">
    <rect x="648" y="163" width="122" height="26" rx="4" fill="#f1f5f9"/>
    <text x="709" y="181" text-anchor="middle">All of Text A…</text>
    <line x1="646" y1="176" x2="632" y2="176" stroke="#6b7280" stroke-width="1.5"/>

    <rect x="648" y="233" width="132" height="26" rx="4" fill="#f1f5f9"/>
    <text x="714" y="251" text-anchor="middle">Texts never meet</text>
    <line x1="646" y1="246" x2="534" y2="246" stroke="#6b7280" stroke-width="1.5"/>

    <rect x="648" y="299" width="140" height="26" rx="4" fill="#f1f5f9"/>
    <text x="718" y="317" text-anchor="middle">…then all of Text B</text>
    <line x1="646" y1="312" x2="632" y2="312" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
