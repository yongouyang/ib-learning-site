<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Directed writing: five read, five plan, about forty draft, five check</title>
  <desc id="desc">A proportional timing bar for a planned Section A hour: minutes 0 to 5 read the 1(b) task first and then the texts; minutes 5 to 10 choose lane and register and plan four or five points; about 40 minutes draft 250 to 350 words; and the final five minutes proofread for W5 accuracy.</desc>
  <rect width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Protect the draft — and protect the final check</text>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">A planned Section A hour · approximate timings</text>

  <rect x="70" y="100" width="69" height="90" fill="#3b82f6"/>
  <rect x="139" y="100" width="69" height="90" fill="#0ea5e9"/>
  <rect x="208" y="100" width="553" height="90" fill="#8b5cf6"/>
  <rect x="761" y="100" width="69" height="90" fill="#16a34a"/>
  <rect x="70" y="100" width="760" height="90" rx="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="104" y="140">READ</text><text x="104" y="163">5 min</text>
    <text x="173" y="140">PLAN</text><text x="173" y="163">5 min</text>
    <text x="484" y="140">DRAFT</text><text x="484" y="163">about 40 minutes</text>
    <text x="795" y="140">CHECK</text><text x="795" y="163">5 min</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="70" y="214">0</text><text x="139" y="214">5</text><text x="208" y="214">10</text><text x="761" y="214">50</text><text x="830" y="214">55 min</text>
  </g>

  <rect x="40" y="254" width="190" height="224" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0–5 · READ</text>
  <text x="135" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">read the 1(b) task FIRST</text>
  <text x="135" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">then read the texts:</text>
  <text x="135" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">mark claims to develop</text>
  <text x="135" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">and weak spots to challenge</text>

  <rect x="250" y="254" width="190" height="224" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="345" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369a1">5–10 · PLAN</text>
  <text x="345" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">choose lane + register</text>
  <text x="345" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">jot four or five points:</text>
  <text x="345" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">source idea</text>
  <text x="345" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">+ my move</text>

  <rect x="460" y="254" width="190" height="224" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="555" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">~40 · DRAFT</text>
  <text x="555" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">250–350 words in view</text>
  <text x="555" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">roughly three developed</text>
  <text x="555" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">paragraphs inside</text>
  <text x="555" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">a short opening + close</text>

  <rect x="670" y="254" width="190" height="224" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="765" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">FINAL 5 · CHECK</text>
  <text x="765" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">proofread deliberately</text>
  <text x="765" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">spelling · punctuation</text>
  <text x="765" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">grammar</text>
  <text x="765" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">W5 accuracy is marked</text>
</svg>
