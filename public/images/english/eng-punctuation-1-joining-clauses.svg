<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Three correct ways to join two independent clauses</title>
  <desc id="desc">A diagram showing the same two independent clauses — 'It was sports day' and 'the sun was shining' — joined three correct ways: with a full stop, with a semicolon, and with a comma plus the conjunction 'and'. A fourth row shows that joining them with a comma alone is an error called a comma splice.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <!-- Heading -->
  <text x="400" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Joining two independent clauses</text>
  <text x="400" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Each clause can stand alone — a comma by itself is not strong enough</text>

  <g font-family="system-ui, -apple-system, sans-serif">

    <!-- Option 1: full stop -->
    <rect x="70" y="95" width="660" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="92" y="118" width="118" height="24" rx="4" fill="#f1f5f9"/>
    <text x="151" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">1 · Full stop</text>
    <rect x="288" y="116" width="44" height="28" rx="14" fill="#e0e7ff"/>
    <text x="310" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">.</text>
    <text x="352" y="136" font-size="15" fill="#1e293b">It was sports day. The sun was shining.</text>
    <text x="706" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#059669">✓</text>

    <!-- Option 2: semicolon -->
    <rect x="70" y="185" width="660" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="92" y="208" width="124" height="24" rx="4" fill="#f1f5f9"/>
    <text x="154" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">2 · Semicolon</text>
    <rect x="288" y="206" width="44" height="28" rx="14" fill="#e0e7ff"/>
    <text x="310" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">;</text>
    <text x="352" y="226" font-size="15" fill="#1e293b">It was sports day; the sun was shining.</text>
    <text x="706" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#059669">✓</text>

    <!-- Option 3: comma + coordinating conjunction -->
    <rect x="70" y="275" width="660" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="92" y="298" width="186" height="24" rx="4" fill="#f1f5f9"/>
    <text x="185" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">3 · Comma + conjunction</text>
    <rect x="288" y="296" width="44" height="28" rx="14" fill="#e0e7ff"/>
    <text x="310" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">, and</text>
    <text x="352" y="316" font-size="15" fill="#1e293b">It was sports day, and the sun was shining.</text>
    <text x="706" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#059669">✓</text>

    <!-- Error: comma splice -->
    <rect x="70" y="365" width="660" height="70" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="92" y="388" width="120" height="24" rx="4" fill="#f1f5f9"/>
    <text x="152" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Comma splice</text>
    <rect x="288" y="386" width="44" height="28" rx="14" fill="#fee2e2"/>
    <text x="310" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">,</text>
    <text x="352" y="406" font-size="15" fill="#1e293b">It was sports day, the sun was shining.</text>
    <text x="706" y="410" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">✗</text>

  </g>
</svg>
