<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Enter late, leave early</title>
  <desc id="desc">A timeline of the whole imagined story above, and the narrower window the writer actually narrates below, showing how a short story enters close to the conflict and leaves soon after it resolves.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Enter late, leave early</text>
  <line x1="80" y1="140" x2="720" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">everything that happens</text>
  <circle cx="110" cy="140" r="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.4"/>
  <text x="110" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">ordinary life</text>
  <circle cx="250" cy="140" r="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.4"/>
  <text x="250" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">years of drifting</text>
  <circle cx="390" cy="140" r="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.4"/>
  <text x="390" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">the argument</text>
  <circle cx="530" cy="140" r="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.4"/>
  <text x="530" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">the decision</text>
  <circle cx="670" cy="140" r="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.4"/>
  <text x="670" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">aftermath</text>
  <line x1="80" y1="250" x2="720" y2="250" stroke="#2563eb" stroke-width="2.4"/>
  <text x="80" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8">what you actually write</text>
  <rect x="330" y="238" width="240" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="450" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">the scene we need</text>
  <text x="330" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">enter here</text>
  <line x1="330" y1="296" x2="330" y2="316" stroke="#dc2626" stroke-width="1.6"/>
  <text x="570" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">leave here</text>
  <line x1="570" y1="296" x2="570" y2="316" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="80" y="330" width="660" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410.0" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">What the reader does not need</text>
  <text x="104" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Backstory can arrive in the middle of the scene, in half a sentence, when a character thinks of it.</text>
  <text x="104" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Everything before the trouble belongs in summary, if it belongs anywhere at all.</text>
  <text x="104" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Ending soon after the climax leaves the reader working — which is the point.</text>
</svg>
