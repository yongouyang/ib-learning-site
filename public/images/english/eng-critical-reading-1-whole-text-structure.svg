<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Reading structure across a whole text</title>
  <desc id="desc">A whole-text reading links an opening, structural shifts and an ending. The opening establishes an image and focus; shifts in perspective, pace or focus change the reader's experience; the ending echoes the opening image with something altered. Comparing the opening and ending reveals deliberate shaping.</desc>
  <rect width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Do not isolate one paragraph — track the whole design</text>

  <rect x="45" y="100" width="235" height="250" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="65" y="120" width="195" height="38" rx="6" fill="#2563eb"/>
  <text x="162" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1 · OPENING</text>
  <rect x="105" y="186" width="115" height="74" rx="5" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="163" y1="186" x2="163" y2="260" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="153" cy="223" r="3" fill="#3b82f6"/>
  <text x="162" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">image + focus established</text>
  <text x="162" y="319" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">What are we invited</text>
  <text x="162" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">to notice first?</text>

  <line x1="282" y1="225" x2="318" y2="225" stroke="#64748b" stroke-width="2"/>
  <polygon points="312,219 312,231 324,225" fill="#64748b"/>
  <rect x="332" y="100" width="235" height="250" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="352" y="120" width="195" height="38" rx="6" fill="#7c3aed"/>
  <text x="450" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2 · SHIFTS</text>
  <path d="M390 248 L425 202 L462 238 L510 178" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <circle cx="425" cy="202" r="5" fill="#8b5cf6"/>
  <circle cx="462" cy="238" r="5" fill="#8b5cf6"/>
  <text x="450" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">perspective · pace · focus</text>
  <text x="450" y="319" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Where does the text</text>
  <text x="450" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">change direction?</text>

  <line x1="569" y1="225" x2="605" y2="225" stroke="#64748b" stroke-width="2"/>
  <polygon points="599,219 599,231 611,225" fill="#64748b"/>
  <rect x="619" y="100" width="235" height="250" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <rect x="639" y="120" width="195" height="38" rx="6" fill="#16a34a"/>
  <text x="736" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3 · ENDING</text>
  <rect x="679" y="186" width="115" height="74" rx="5" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="737" y1="186" x2="737" y2="260" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="727" cy="223" r="3" fill="#22c55e"/>
  <path d="M737 260 L757 233 L774 260" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="736" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">opening image returns, altered</text>
  <text x="736" y="319" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">An ending can become</text>
  <text x="736" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">a new beginning.</text>

  <path d="M736 362 C736 440 162 440 162 362" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="156,368 168,368 162,356" fill="#64748b"/>
  <rect x="280" y="396" width="340" height="58" rx="8" fill="#f1f5f9"/>
  <text x="450" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">COMPARE THE ECHO</text>
  <text x="450" y="442" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">What has changed — and why end there?</text>
  <text x="450" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Structure is order and arrangement; the relationship between parts creates meaning.</text>
</svg>
