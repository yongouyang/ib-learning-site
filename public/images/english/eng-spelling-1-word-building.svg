<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Building words from roots, prefixes and suffixes</title>
  <desc id="desc">A word-building diagram showing a root word with prefixes attached to the front and suffixes to the back, with examples such as appear becoming disappear or appearance.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Roots, prefixes and suffixes</text>
  <rect x="290" y="140" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">root</text>
  <text x="380" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">appear</text>
  <text x="230" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600">prefix</text>
  <text x="230" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">dis-  re-  un-</text>
  <text x="560" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="600">suffix</text>
  <text x="560" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">-ance  -ing  -ed</text>
  <line x1="300" y1="175" x2="270" y2="175" stroke="#7c3aed" stroke-width="2"/>
  <line x1="470" y1="175" x2="500" y2="175" stroke="#15803d" stroke-width="2"/>
  <rect x="40" y="240" width="340" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="210.0" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Prefix changes the meaning</text>
  <text x="62" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">dis- + appear = disappear (not there)</text>
  <text x="62" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">re- + appear = reappear (again)</text>
  <text x="62" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">un- + happy = unhappy (not happy)</text>
  <text x="62" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">mis- + spell = misspell (wrongly)</text>
  <rect x="420" y="240" width="340" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="590.0" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Suffix changes the job</text>
  <text x="442" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">appear + ance = appearance (a noun)</text>
  <text x="442" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">appear + ing = appearing (a verb part)</text>
  <text x="442" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">beauty + ful = beautiful (adjective)</text>
  <text x="442" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">hope + less = hopeless (without)</text>
  <text x="400" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">The root carries the core meaning, and it is often shared with other languages.</text>
  <text x="400" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Spelling the root correctly first makes the whole word much easier to spell.</text>
</svg>
