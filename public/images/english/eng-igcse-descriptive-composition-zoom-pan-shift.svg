<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Establish, zoom, shift, resonate: a four-frame storyboard for a descriptive composition</title>
  <desc id="desc">A storyboard of four frames showing how to structure a 350-450 word descriptive composition: frame one is a wide establishing shot of a harbour, frame two zooms into one boat through a magnifying lens, frame three shifts focus to a lit cottage as the light changes, and frame four ends on a single resonant image of the sun echoed on the water. Each frame carries a word budget.</desc>

  <rect x="0" y="0" width="960" height="620" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">STRUCTURE A DESCRIPTION LIKE A CAMERA MOVEMENT</text>

  <!-- Frame 1: ESTABLISH — wide shot -->
  <rect x="48" y="88" width="184" height="140" fill="#e0f2fe"/>
  <circle cx="200" cy="120" r="16" fill="#f59e0b"/>
  <polygon points="56,228 116,148 176,228" fill="#94a3b8"/>
  <polygon points="140,228 190,168 232,228" fill="#64748b"/>
  <rect x="48" y="228" width="184" height="94" fill="#bfdbfe"/>
  <line x1="60" y1="250" x2="220" y2="250" stroke="#60a5fa" stroke-width="2"/>
  <line x1="70" y1="272" x2="210" y2="272" stroke="#60a5fa" stroke-width="2"/>
  <line x1="62" y1="294" x2="218" y2="294" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="82" cy="212" r="4" fill="#1e293b"/>
  <line x1="82" y1="216" x2="82" y2="226" stroke="#1e293b" stroke-width="2"/>

  <!-- Frame 2: ZOOM — magnifier on one detail -->
  <rect x="283" y="88" width="184" height="234" fill="#f1f5f9"/>
  <polygon points="291,210 334,148 372,210" fill="#e2e8f0"/>
  <polygon points="352,210 396,158 436,210" fill="#e2e8f0"/>
  <circle cx="375" cy="185" r="62" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <line x1="418" y1="228" x2="452" y2="262" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="375" y1="150" x2="375" y2="200" stroke="#334155" stroke-width="3"/>
  <polygon points="375,152 375,196 402,196" fill="#f59e0b"/>
  <polygon points="335,200 415,200 402,218 348,218" fill="#64748b"/>
  <line x1="330" y1="226" x2="420" y2="226" stroke="#60a5fa" stroke-width="2"/>

  <!-- Frame 3: SHIFT — light changes, eye moves to the cottage -->
  <rect x="518" y="88" width="184" height="140" fill="#fef3c7"/>
  <circle cx="530" cy="110" r="2" fill="#64748b"/>
  <circle cx="640" cy="100" r="2" fill="#64748b"/>
  <circle cx="600" cy="130" r="2" fill="#64748b"/>
  <polygon points="526,228 580,160 634,228" fill="#94a3b8"/>
  <polygon points="610,228 655,178 694,228" fill="#64748b"/>
  <circle cx="560" cy="220" r="13" fill="#f59e0b"/>
  <rect x="518" y="228" width="184" height="94" fill="#bfdbfe"/>
  <rect x="540" y="250" width="40" height="32" fill="#475569"/>
  <polygon points="536,250 560,234 584,250" fill="#334155"/>
  <rect x="552" y="260" width="10" height="10" fill="#f59e0b"/>
  <path d="M 610 300 Q 650 280 690 296" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="684,290 684,302 696,296" fill="#475569"/>

  <!-- Frame 4: RESONATE — single echoing image -->
  <rect x="753" y="88" width="184" height="140" fill="#f1f5f9"/>
  <rect x="753" y="228" width="184" height="94" fill="#bfdbfe"/>
  <circle cx="845" cy="250" r="10" fill="#f59e0b"/>
  <line x1="837" y1="268" x2="853" y2="268" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="839" y1="278" x2="851" y2="278" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="841" y1="288" x2="849" y2="288" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Panel borders -->
  <rect x="40" y="80" width="200" height="250" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="275" y="80" width="200" height="250" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="510" y="80" width="200" height="250" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="745" y="80" width="200" height="250" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Arrows between frames -->
  <line x1="246" y1="205" x2="264" y2="205" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="264,200 264,210 274,205" fill="#64748b"/>
  <line x1="481" y1="205" x2="499" y2="205" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="499,200 499,210 509,205" fill="#64748b"/>
  <line x1="716" y1="205" x2="734" y2="205" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="734,200 734,210 744,205" fill="#64748b"/>

  <!-- Label groups -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="346" width="200" height="80" rx="4" fill="#f1f5f9"/>
    <text x="140" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">1 · ESTABLISH</text>
    <text x="140" y="391" text-anchor="middle" font-size="12" fill="#475569">the wide shot, one mood</text>
    <text x="140" y="408" text-anchor="middle" font-size="12" fill="#475569">about 100 words</text>

    <rect x="275" y="346" width="200" height="80" rx="4" fill="#f1f5f9"/>
    <text x="375" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">2 · ZOOM</text>
    <text x="375" y="391" text-anchor="middle" font-size="12" fill="#475569">one detail, up close</text>
    <text x="375" y="408" text-anchor="middle" font-size="12" fill="#475569">about 100 words</text>

    <rect x="510" y="346" width="200" height="80" rx="4" fill="#f1f5f9"/>
    <text x="610" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">3 · SHIFT</text>
    <text x="610" y="391" text-anchor="middle" font-size="12" fill="#475569">move the eye or the light</text>
    <text x="610" y="408" text-anchor="middle" font-size="12" fill="#475569">about 100 words</text>

    <rect x="745" y="346" width="200" height="80" rx="4" fill="#f1f5f9"/>
    <text x="845" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">4 · RESONATE</text>
    <text x="845" y="391" text-anchor="middle" font-size="12" fill="#475569">echo the opening image</text>
    <text x="845" y="408" text-anchor="middle" font-size="12" fill="#475569">about 80 words</text>
  </g>

  <text x="480" y="482" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">The event stays minimal — the focus moves, not the plot. Total: about 350-450 words.</text>
</svg>
