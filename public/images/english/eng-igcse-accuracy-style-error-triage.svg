<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">W5 error triage pyramid and the five-minute proofreading protocol</title>
  <desc id="desc">A three-tier pyramid showing which errors to fix first under exam time pressure: sentence boundaries at the top (comma splices, fused sentences, accidental fragments), verb control in the middle (tense drift, agreement), and surface slips at the base (homophones, spelling, stray commas). Below, a four-pass proofreading protocol: read for sense, sentence boundaries, verbs and tense, spelling and confusables.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <text x="60" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e293b">W5 error triage: fix in this order when time is short</text>

  <!-- Pyramid -->
  <polygon points="230,80 277,180 183,180" fill="#dc2626"/>
  <polygon points="183,180 277,180 323,280 137,280" fill="#d97706"/>
  <polygon points="137,280 323,280 370,380 90,380" fill="#059669"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="230" y="158">1</text>
    <text x="230" y="242">2</text>
    <text x="230" y="336">3</text>
  </g>

  <!-- Legend -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="420" y="96" width="34" height="34" rx="6" fill="#dc2626"/>
    <text x="437" y="119" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="466" y="112" font-size="14" font-weight="700" fill="#1e293b">Fix first: sentence boundaries</text>
    <text x="466" y="130" font-size="11" fill="#475569">comma splices, fused sentences, accidental fragments</text>

    <rect x="420" y="213" width="34" height="34" rx="6" fill="#d97706"/>
    <text x="437" y="236" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="466" y="229" font-size="14" font-weight="700" fill="#1e293b">Then: verb control</text>
    <text x="466" y="247" font-size="11" fill="#475569">tense drift and subject-verb agreement</text>

    <rect x="420" y="330" width="34" height="34" rx="6" fill="#059669"/>
    <text x="437" y="353" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="466" y="346" font-size="14" font-weight="700" fill="#1e293b">Last: surface slips</text>
    <text x="466" y="364" font-size="11" fill="#475569">homophones, spelling slips, stray commas</text>
  </g>

  <!-- Protocol strip -->
  <rect x="60" y="408" width="680" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">The five-minute proofreading protocol: one pass per job</text>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="80" y="442" width="150" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="155" y="460" font-size="11" font-weight="600" fill="#1e293b">Pass 1: read for sense</text>

    <rect x="240" y="442" width="160" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="320" y="460" font-size="11" font-weight="600" fill="#1e293b">Pass 2: sentence boundaries</text>

    <rect x="410" y="442" width="150" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="485" y="460" font-size="11" font-weight="600" fill="#1e293b">Pass 3: verbs and tense</text>

    <rect x="570" y="442" width="150" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="645" y="460" font-size="11" font-weight="600" fill="#1e293b">Pass 4: spelling, confusables</text>
  </g>
</svg>
