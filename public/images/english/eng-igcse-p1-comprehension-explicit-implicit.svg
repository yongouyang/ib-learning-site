<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Explicit versus implicit meaning in a short passage</title>
  <desc id="desc">A three-line passage about a ferry crossing. A blue callout marks the directly stated fact that the ferry left at six as explicit meaning. Two callouts on the right mark the phrases 'zipped his coat to the chin' and 'watched the town's lights shrink' as implicit signals of cold, discomfort and reluctance to leave.</desc>

  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>

  <text x="450" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e293b">Reading a text at two levels</text>
  <text x="450" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#475569">R1 retrieves what is stated · R2 infers what is signalled</text>

  <!-- Passage panel -->
  <rect x="240" y="120" width="420" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="450" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#1e293b">The ferry left the harbour at six.</text>
  <text x="450" y="203" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#1e293b">On deck, Tomas zipped his coat to the chin</text>
  <text x="450" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#1e293b">and watched the town's lights shrink behind the swell.</text>

  <!-- Highlight underlines beneath key phrases -->
  <rect x="330" y="176" width="240" height="4" rx="2" fill="#3b82f6"/>
  <rect x="407" y="211" width="190" height="4" rx="2" fill="#10b981"/>
  <rect x="295" y="236" width="224" height="4" rx="2" fill="#f59e0b"/>

  <!-- Explicit callout (left) -->
  <rect x="30" y="150" width="180" height="110" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">EXPLICIT (R1)</text>
  <text x="120" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">stated directly in</text>
  <text x="120" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the words: a fact</text>
  <text x="120" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">you simply retrieve</text>
  <line x1="210" y1="205" x2="328" y2="180" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Implicit callout 1 (right, upper) -->
  <rect x="690" y="140" width="180" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="780" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857">IMPLICIT (R2)</text>
  <text x="780" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">zipped to the chin</text>
  <text x="780" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">suggests cold and</text>
  <text x="780" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">discomfort</text>
  <line x1="690" y1="195" x2="599" y2="213" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Implicit callout 2 (right, lower) -->
  <rect x="690" y="280" width="180" height="110" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b45309">IMPLICIT (R2)</text>
  <text x="780" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">a lingering look at</text>
  <text x="780" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the shrinking lights</text>
  <text x="780" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">suggests reluctance</text>
  <line x1="690" y1="335" x2="521" y2="238" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Rule of thumb strip -->
  <rect x="200" y="400" width="500" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="424" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Rule of thumb</text>
  <text x="450" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">explicit = the text says it · implicit = the text shows it</text>
</svg>
