<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Discursive, argumentative and persuasive writing compared</title>
  <desc id="desc">Three registers are compared by task word, stance, reasoning and audience. Discursive tasks use 'discuss' or 'consider', explore both sides and reach a measured conclusion. Argumentative tasks use 'argue', commit to a reason-led position and rebut a fairly stated counter-argument. Persuasive tasks use 'persuade', commit to an audience-led position and use rhetorical tools plus a call to action. All three engage the source.</desc>
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">The task word sets the register — and the register sets the rules</text>

  <rect x="35" y="72" width="280" height="476" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="35" y="72" width="280" height="64" rx="10" fill="#2563eb"/>
  <text x="175" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">DISCURSIVE</text>
  <text x="57" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">TASK WORD</text>
  <text x="57" y="196" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">“discuss” · “consider”</text>
  <line x1="57" y1="216" x2="293" y2="216" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="57" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">STANCE</text>
  <text x="57" y="274" font-family="system-ui, sans-serif" font-size="14" fill="#334155">balanced · exploratory</text>
  <text x="57" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">do not commit too early</text>
  <line x1="57" y1="318" x2="293" y2="318" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="57" y="350" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">REASONING</text>
  <text x="57" y="376" font-family="system-ui, sans-serif" font-size="13" fill="#334155">strongest case on each side;</text>
  <text x="57" y="398" font-family="system-ui, sans-serif" font-size="13" fill="#334155">weigh, then reach a</text>
  <text x="57" y="420" font-family="system-ui, sans-serif" font-size="13" fill="#334155">measured conclusion</text>
  <line x1="57" y1="440" x2="293" y2="440" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="57" y="472" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">AUDIENCE</text>
  <text x="57" y="498" font-family="system-ui, sans-serif" font-size="13" fill="#334155">invite considered judgement,</text>
  <text x="57" y="520" font-family="system-ui, sans-serif" font-size="13" fill="#334155">not a one-sided rant</text>

  <rect x="340" y="72" width="280" height="476" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <rect x="340" y="72" width="280" height="64" rx="10" fill="#16a34a"/>
  <text x="480" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ARGUMENTATIVE</text>
  <text x="362" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">TASK WORD</text>
  <text x="362" y="196" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">“argue”</text>
  <line x1="362" y1="216" x2="598" y2="216" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="362" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">STANCE</text>
  <text x="362" y="274" font-family="system-ui, sans-serif" font-size="14" fill="#334155">committed · reason-led</text>
  <text x="362" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">a clear position throughout</text>
  <line x1="362" y1="318" x2="598" y2="318" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="362" y="350" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">REASONING</text>
  <text x="362" y="376" font-family="system-ui, sans-serif" font-size="13" fill="#334155">logical support; state the</text>
  <text x="362" y="398" font-family="system-ui, sans-serif" font-size="13" fill="#334155">counter-argument fairly,</text>
  <text x="362" y="420" font-family="system-ui, sans-serif" font-size="13" fill="#334155">then rebut it</text>
  <line x1="362" y1="440" x2="598" y2="440" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="362" y="472" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">AUDIENCE</text>
  <text x="362" y="498" font-family="system-ui, sans-serif" font-size="13" fill="#334155">win assent through</text>
  <text x="362" y="520" font-family="system-ui, sans-serif" font-size="13" fill="#334155">reasons and fair rebuttal</text>

  <rect x="645" y="72" width="280" height="476" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="645" y="72" width="280" height="64" rx="10" fill="#f59e0b"/>
  <text x="785" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">PERSUASIVE</text>
  <text x="667" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">TASK WORD</text>
  <text x="667" y="196" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">“persuade”</text>
  <line x1="667" y1="216" x2="903" y2="216" stroke="#fde68a" stroke-width="1.5"/>
  <text x="667" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">STANCE</text>
  <text x="667" y="274" font-family="system-ui, sans-serif" font-size="14" fill="#334155">committed · audience-led</text>
  <text x="667" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">move the reader to agree or act</text>
  <line x1="667" y1="318" x2="903" y2="318" stroke="#fde68a" stroke-width="1.5"/>
  <text x="667" y="350" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">REASONING</text>
  <text x="667" y="376" font-family="system-ui, sans-serif" font-size="13" fill="#334155">direct address · emotive language</text>
  <text x="667" y="398" font-family="system-ui, sans-serif" font-size="13" fill="#334155">rhetorical questions ·</text>
  <text x="667" y="420" font-family="system-ui, sans-serif" font-size="13" fill="#334155">a call to action</text>
  <line x1="667" y1="440" x2="903" y2="440" stroke="#fde68a" stroke-width="1.5"/>
  <text x="667" y="472" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">AUDIENCE</text>
  <text x="667" y="498" font-family="system-ui, sans-serif" font-size="13" fill="#334155">shape language around</text>
  <text x="667" y="520" font-family="system-ui, sans-serif" font-size="13" fill="#334155">the listeners or readers</text>

  <rect x="225" y="578" width="510" height="40" rx="20" fill="#ede9fe"/>
  <text x="480" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">ALL THREE REGISTERS STILL ENGAGE THE SOURCE</text>
</svg>
