<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Line breaks and enjambment in poetry</title>
  <desc id="desc">A poem shown with each line break marked, contrasting an end-stopped line that stops with punctuation against an enjambed line where the sentence runs on and pulls the reader down the page.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Line breaks and enjambment</text>
  <rect x="40" y="64" width="360" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220.0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">The same sentence, three ways</text>
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0f172a">The tide came in,</text>
  <text x="360" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">end</text>
  <line x1="70" y1="120" x2="370" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0f172a">and took the sand.</text>
  <text x="360" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">end</text>
  <line x1="70" y1="144" x2="370" y2="144" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b">The tide came in</text>
  <text x="360" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">enjambed</text>
  <line x1="70" y1="194" x2="370" y2="194" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0f172a">and took the sand.</text>
  <text x="360" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">end</text>
  <line x1="70" y1="218" x2="370" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b">The tide came</text>
  <text x="360" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">enjambed</text>
  <line x1="70" y1="268" x2="370" y2="268" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b">in, and took the sand.</text>
  <text x="360" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">enjambed</text>
  <line x1="70" y1="292" x2="370" y2="292" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="430" y="64" width="330" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="595.0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">What each choice does</text>
  <text x="452" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">End-stopped (punctuation at the break):</text>
  <text x="452" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">the reading voice stops — calm, final.</text>
  <text x="452" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155"></text>
  <text x="452" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Enjambed (sentence runs over):</text>
  <text x="452" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">speed, flow or suspense; the eye is</text>
  <text x="452" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">dragged on.</text>
  <text x="452" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155"></text>
  <text x="452" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Break a line to stress its last word.</text>
  <text x="452" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155"></text>
  <text x="452" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Break a line to make a double meaning:</text>
  <text x="452" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">the line reads one way, then the next</text>
  <text x="452" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">line twists it.</text>
  <text x="452" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155"></text>
  <text x="452" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">A stanza break does the same at a</text>
  <text x="452" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">larger scale — use it to mark a change.</text>
  <text x="400" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Every line break is a decision: poems do not run to the margin like prose.</text>
</svg>
