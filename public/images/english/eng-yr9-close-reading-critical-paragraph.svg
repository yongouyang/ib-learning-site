<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Building a critical paragraph</title>
  <desc id="desc">The structure of an analytical paragraph: a point, a short quotation, the writer’s method, the effect on the reader, and a link back to the question, with an example of each part.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Building a critical paragraph</text>
  <rect x="60" y="70" width="680" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="70" width="110" height="56" rx="8" fill="#dbeafe" stroke="none"/>
  <text x="115" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Point</text>
  <text x="186" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">What is your argument in one sentence?</text>
  <text x="186" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">The writer presents the house as a place of waiting.</text>
  <rect x="60" y="138" width="680" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="138" width="110" height="56" rx="8" fill="#dbeafe" stroke="none"/>
  <text x="115" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Evidence</text>
  <text x="186" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">A short quotation, embedded in your sentence.</text>
  <text x="186" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">using the phrase “the clock ticked on”</text>
  <rect x="60" y="206" width="680" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="206" width="110" height="56" rx="8" fill="#dbeafe" stroke="none"/>
  <text x="115" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Method</text>
  <text x="186" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Name the technique precisely.</text>
  <text x="186" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">the personification of time as a restless visitor</text>
  <rect x="60" y="274" width="680" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="274" width="110" height="56" rx="8" fill="#dbeafe" stroke="none"/>
  <text x="115" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Effect</text>
  <text x="186" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">What it makes the reader think or feel.</text>
  <text x="186" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">it makes the silence feel active rather than empty</text>
  <rect x="60" y="342" width="680" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="342" width="110" height="56" rx="8" fill="#dbeafe" stroke="none"/>
  <text x="115" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">Link</text>
  <text x="186" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Return to the question.</text>
  <text x="186" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">which presents waiting as a kind of work</text>
  <text x="400" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Name the method with the right word — metaphor, sibilance, short sentence — not just “this makes it interesting”.</text>
</svg>
