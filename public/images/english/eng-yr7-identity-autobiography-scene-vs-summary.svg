<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Scene and summary in life writing</title>
  <desc id="desc">Two columns compare writing a moment in scene with the same event written as summary, showing how detail, dialogue and pace differ.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Scene versus summary</text>
  <rect x="40" y="64" width="350" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="215.0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Scene — slow, close, in the moment</text>
  <text x="64" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Slowed down to real time.</text>
  <text x="64" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="64" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Dialogue and small actions.</text>
  <text x="64" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="64" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Sensory detail: what you saw,</text>
  <text x="64" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">heard, smelled.</text>
  <text x="64" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="64" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">“The kettle clicked off and she still</text>
  <text x="64" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">had not turned round.”</text>
  <text x="64" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="64" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="64" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Use it for the moments that</text>
  <text x="64" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">changed something.</text>
  <rect x="410" y="64" width="350" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="585.0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Summary — fast, wide, over time</text>
  <text x="434" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Compresses months or years into</text>
  <text x="434" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">a sentence or two.</text>
  <text x="434" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="434" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">No dialogue, few details.</text>
  <text x="434" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="434" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Tells rather than shows.</text>
  <text x="434" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="434" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">“We moved three times that year,’</text>
  <text x="434" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">which I did not question.”</text>
  <text x="434" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="434" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155"></text>
  <text x="434" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Use it to travel between the</text>
  <text x="434" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">scenes that matter.</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Reflection is the third mode: stepping back to say what it meant, usually in the present tense.</text>
  <text x="400" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">A strong autobiographical piece moves between all three.</text>
</svg>
