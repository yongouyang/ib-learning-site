<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
  <title id="title">A sensory planning board: one mood, lead senses, precise images</title>
  <desc id="desc">A planning board controls description before drafting. One mood word, 'neglected', directs two or three lead senses — sight, smell and touch — which generate five precise images: a cracked pane, dust filming the glass, a stiff door, cold soil and one living leaf. The board selects rather than lists all five senses.</desc>
  <rect width="920" height="570" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Fix the sensory choices in the plan, not mid-draft</text>

  <rect x="40" y="88" width="240" height="354" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="160" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">1 · ONE MOOD</text>
  <rect x="70" y="160" width="180" height="84" rx="8" fill="#ffffff"/>
  <text x="160" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#4c1d95">neglected</text>
  <text x="160" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">every detail must serve it</text>
  <text x="160" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">keep light + weather</text>
  <text x="160" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">consistent with the mood</text>
  <text x="160" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6d28d9">one dominant atmosphere</text>

  <text x="300" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#64748b">→</text>
  <rect x="330" y="88" width="240" height="354" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">2 · 2–3 LEAD SENSES</text>
  <rect x="362" y="158" width="176" height="46" rx="7" fill="#ffffff"/>
  <text x="450" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#0f172a">SIGHT</text>
  <rect x="362" y="220" width="176" height="46" rx="7" fill="#ffffff"/>
  <text x="450" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#0f172a">SMELL</text>
  <rect x="362" y="282" width="176" height="46" rx="7" fill="#ffffff"/>
  <text x="450" y="311" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#0f172a">TOUCH</text>
  <text x="450" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">choose; do not list all five</text>
  <text x="450" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb">add one unexpected detail</text>

  <text x="590" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#64748b">→</text>
  <rect x="620" y="88" width="260" height="354" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="750" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">3 · 4–6 PRECISE IMAGES</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#334155">
    <rect x="648" y="150" width="204" height="40" rx="6" fill="#ffffff"/><text x="750" y="176" text-anchor="middle">a cracked pane</text>
    <rect x="648" y="200" width="204" height="40" rx="6" fill="#ffffff"/><text x="750" y="226" text-anchor="middle">dust filming the glass</text>
    <rect x="648" y="250" width="204" height="40" rx="6" fill="#ffffff"/><text x="750" y="276" text-anchor="middle">a stiff door</text>
    <rect x="648" y="300" width="204" height="40" rx="6" fill="#ffffff"/><text x="750" y="326" text-anchor="middle">cold soil</text>
    <rect x="648" y="350" width="204" height="40" rx="6" fill="#ffffff"/><text x="750" y="376" text-anchor="middle">one living leaf</text>
  </g>
  <text x="750" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">a bank you can write well</text>

  <rect x="145" y="480" width="630" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="503" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Mood directs selection; senses supply detail; images make it concrete.</text>
  <text x="460" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Prefer one precise verb to two vague adjectives.</text>
</svg>
