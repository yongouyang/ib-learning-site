<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Advertisement poster showing visual literacy techniques</title>
  <desc id="desc">A sample advertisement poster with labelled visual elements including colour, image, slogan, typography, layout, logo and target audience, demonstrating how visual choices create meaning.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="520" fill="#f8fafc"/>

  <!-- Sample poster frame -->
  <rect x="230" y="40" width="340" height="440" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Poster header band -->
  <rect x="230" y="40" width="340" height="90" rx="8" fill="#0ea5e9"/>
  <rect x="230" y="122" width="340" height="8" fill="#0284c7"/>

  <!-- Slogan text -->
  <text x="400" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff">REFRESH</text>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e0f2fe">Pure energy in every drop</text>

  <!-- Product image: water bottle -->
  <ellipse cx="400" cy="270" rx="55" ry="110" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="400" cy="170" rx="30" ry="12" fill="#0ea5e9"/>
  <rect x="375" y="170" width="50" height="12" rx="3" fill="#0284c7"/>
  <ellipse cx="400" cy="182" rx="25" ry="8" fill="#7dd3fc"/>
  <path d="M370 250 Q400 290 430 250" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="420" cy="210" r="8" fill="#ffffff" opacity="0.7"/>

  <!-- Splash drops -->
  <circle cx="340" cy="250" r="8" fill="#38bdf8"/>
  <circle cx="355" cy="230" r="5" fill="#38bdf8"/>
  <circle cx="460" cy="240" r="7" fill="#38bdf8"/>
  <circle cx="475" cy="265" r="5" fill="#38bdf8"/>

  <!-- Logo / brand mark -->
  <circle cx="285" cy="400" r="22" fill="#f59e0b"/>
  <text x="285" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">H₂O</text>

  <!-- Tagline -->
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">100% natural hydration</text>

  <!-- Call to action -->
  <rect x="345" y="410" width="110" height="32" rx="16" fill="#f97316"/>
  <text x="400" y="431" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">BUY NOW</text>

  <!-- Small print -->
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#94a3b8">Terms and conditions apply. See website for details.</text>

  <!-- Labels and leader lines -->

  <!-- Colour label -->
  <line x1="230" y1="95" x2="120" y2="80" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="120" cy="80" r="3" fill="#6b7280"/>
  <rect x="20" y="58" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Colour</text>
  <text x="70" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">sets mood: blue = fresh</text>

  <!-- Slogan label -->
  <line x1="400" y1="130" x2="100" y2="209" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="100" cy="209" r="3" fill="#6b7280"/>
  <rect x="10" y="188" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Slogan</text>
  <text x="60" y="223" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">memorable message</text>

  <!-- Typography label -->
  <line x1="330" y1="95" x2="100" y2="145" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="100" cy="145" r="3" fill="#6b7280"/>
  <rect x="10" y="123" width="90" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="55" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Typography</text>
  <text x="55" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">font, size, weight</text>

  <!-- Image label -->
  <line x1="400" y1="240" x2="120" y2="280" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="120" cy="280" r="3" fill="#6b7280"/>
  <rect x="20" y="258" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Image</text>
  <text x="70" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">product as focal point</text>

  <!-- Layout label -->
  <line x1="570" y1="95" x2="690" y2="80" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="690" cy="80" r="3" fill="#6b7280"/>
  <rect x="640" y="58" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Layout</text>
  <text x="710" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">arrangement of elements</text>

  <!-- Logo label -->
  <line x1="263" y1="400" x2="120" y2="339" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="120" cy="339" r="3" fill="#6b7280"/>
  <rect x="20" y="318" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Logo</text>
  <text x="70" y="353" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">brand identity</text>

  <!-- Target audience label -->
  <line x1="570" y1="345" x2="700" y2="360" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="700" cy="360" r="3" fill="#6b7280"/>
  <rect x="620" y="338" width="160" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Target audience</text>
  <text x="700" y="373" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">who the ad is designed for</text>

  <!-- Call to action label -->
  <line x1="455" y1="426" x2="690" y2="440" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="690" cy="440" r="3" fill="#6b7280"/>
  <rect x="600" y="418" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="438" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Call to action</text>
  <text x="690" y="453" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">tells the viewer what to do</text>
</svg>