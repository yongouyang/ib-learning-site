<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Open novel showing key elements of novel study</title>
  <desc id="desc">An open book is surrounded by labelled icons representing character, setting, plot, theme and narrative perspective, the core elements used when studying and analysing a novel.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <!-- Central open book -->
  <g transform="translate(400, 250)">
    <!-- Pages -->
    <path d="M -130 -90 Q -70 -120 0 -90 Q 70 -120 130 -90 L 130 110 Q 70 80 0 110 Q -70 80 -130 110 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <line x1="0" y1="-90" x2="0" y2="110" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Covers -->
    <path d="M -135 -95 Q -70 -125 0 -95 L 0 -90 Q -70 -120 -130 -90 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
    <path d="M 135 -95 Q 70 -125 0 -95 L 0 -90 Q 70 -120 130 -90 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  </g>

  <!-- Text lines on pages -->
  <g fill="#64748b">
    <rect x="295" y="190" width="80" height="6" rx="3"/>
    <rect x="295" y="205" width="70" height="6" rx="3"/>
    <rect x="295" y="220" width="85" height="6" rx="3"/>
    <rect x="425" y="190" width="80" height="6" rx="3"/>
    <rect x="425" y="205" width="75" height="6" rx="3"/>
    <rect x="425" y="220" width="80" height="6" rx="3"/>
  </g>

  <!-- Character icon (top left) -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="-20" r="18" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <path d="M -28 38 Q 0 -8 28 38 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Setting icon (top right) -->
  <g transform="translate(620, 150)">
    <circle cx="0" cy="0" r="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Plot icon (bottom left) -->
  <g transform="translate(180, 360)">
    <polyline points="-30,20 -10,5 10,-15 30,-25" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-30" cy="20" r="4" fill="#10b981"/>
    <circle cx="-10" cy="5" r="4" fill="#10b981"/>
    <circle cx="10" cy="-15" r="4" fill="#10b981"/>
    <circle cx="30" cy="-25" r="4" fill="#10b981"/>
  </g>

  <!-- Theme icon (bottom right) -->
  <g transform="translate(620, 360)">
    <circle cx="0" cy="-10" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <rect x="-10" y="12" width="20" height="12" rx="2" fill="#9ca3af"/>
    <line x1="-18" y1="-28" x2="-26" y2="-40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="-28" x2="26" y2="-40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-32" x2="0" y2="-46" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Perspective icon (top centre) -->
  <g transform="translate(400, 90)">
    <path d="M -35 0 Q 0 -28 35 0 Q 0 28 -35 0 Z" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#6366f1"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Labels with backing rectangles -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">
    <!-- Character label -->
    <rect x="135" y="110" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="180" y="127" text-anchor="middle">Character</text>
    <line x1="180" y1="134" x2="180" y2="150" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Setting label -->
    <rect x="575" y="110" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="620" y="127" text-anchor="middle">Setting</text>
    <line x1="620" y1="134" x2="620" y2="150" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Perspective label -->
    <rect x="355" y="42" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="400" y="59" text-anchor="middle">Perspective</text>
    <line x1="400" y1="66" x2="400" y2="78" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Plot label -->
    <rect x="135" y="400" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="180" y="417" text-anchor="middle">Plot</text>
    <line x1="180" y1="393" x2="180" y2="380" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Theme label -->
    <rect x="575" y="400" width="90" height="24" rx="4" fill="#f1f5f9" opacity="0.95"/>
    <text x="620" y="417" text-anchor="middle">Theme</text>
    <line x1="620" y1="393" x2="620" y2="380" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
