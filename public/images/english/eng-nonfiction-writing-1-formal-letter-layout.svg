<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
  <title id="title">Layout of a formal letter</title>
  <desc id="desc">A labelled diagram of formal letter layout: the writer's address with the date beneath in the top right, the recipient's name and address on the left below it, a salutation, a first paragraph stating the purpose, body paragraphs with one clear point each, a final paragraph saying what should happen next, and a sign-off — 'Yours sincerely' for a named recipient, 'Yours faithfully' after 'Dear Sir/Madam'.</desc>

  <rect x="0" y="0" width="840" height="460" fill="#f8fafc"/>

  <!-- Letter sheet -->
  <rect x="300" y="24" width="280" height="396" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Writer's address (top right) and date beneath -->
  <g fill="#94a3b8">
    <rect x="480" y="48" width="86" height="6" rx="3"/>
    <rect x="480" y="58" width="86" height="6" rx="3"/>
    <rect x="480" y="68" width="86" height="6" rx="3"/>
    <rect x="500" y="88" width="66" height="6" rx="3"/>
  </g>

  <!-- Recipient's name and address (left, below) -->
  <g fill="#94a3b8">
    <rect x="314" y="118" width="86" height="6" rx="3"/>
    <rect x="314" y="128" width="86" height="6" rx="3"/>
    <rect x="314" y="138" width="86" height="6" rx="3"/>
  </g>

  <!-- Salutation -->
  <text x="314" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-style="italic" fill="#334155">Dear Mr Okafor,</text>

  <!-- Paragraph 1: purpose -->
  <g fill="#94a3b8">
    <rect x="314" y="196" width="252" height="6" rx="3"/>
    <rect x="314" y="206" width="252" height="6" rx="3"/>
    <rect x="314" y="216" width="180" height="6" rx="3"/>
  </g>

  <!-- Body paragraphs -->
  <g fill="#94a3b8">
    <rect x="314" y="244" width="252" height="6" rx="3"/>
    <rect x="314" y="254" width="252" height="6" rx="3"/>
    <rect x="314" y="264" width="252" height="6" rx="3"/>
    <rect x="314" y="274" width="252" height="6" rx="3"/>
    <rect x="314" y="284" width="252" height="6" rx="3"/>
    <rect x="314" y="294" width="140" height="6" rx="3"/>
  </g>

  <!-- Final paragraph -->
  <g fill="#94a3b8">
    <rect x="314" y="322" width="252" height="6" rx="3"/>
    <rect x="314" y="332" width="252" height="6" rx="3"/>
    <rect x="314" y="342" width="190" height="6" rx="3"/>
  </g>

  <!-- Sign-off and signature -->
  <text x="314" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-style="italic" fill="#334155">Yours sincerely,</text>
  <rect x="314" y="398" width="66" height="6" rx="3" fill="#94a3b8"/>

  <!-- Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">
    <!-- Recipient's name and address -->
    <rect x="16" y="117" width="224" height="26" rx="4" fill="#f1f5f9"/>
    <text x="128" y="134" text-anchor="middle">Recipient's name and address</text>
    <line x1="240" y1="130" x2="306" y2="130" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Salutation -->
    <rect x="16" y="159" width="224" height="26" rx="4" fill="#f1f5f9"/>
    <text x="128" y="176" text-anchor="middle">Dear + name, or Dear Sir/Madam</text>
    <line x1="240" y1="172" x2="306" y2="172" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Paragraph 1 -->
    <rect x="16" y="196" width="224" height="26" rx="4" fill="#f1f5f9"/>
    <text x="128" y="213" text-anchor="middle">Paragraph 1 states your purpose</text>
    <line x1="240" y1="209" x2="306" y2="209" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Sign-off pairing -->
    <rect x="16" y="360" width="224" height="40" rx="4" fill="#f1f5f9"/>
    <text x="128" y="376" text-anchor="middle">Named &#8594; 'Yours sincerely'</text>
    <text x="128" y="392" text-anchor="middle">Sir/Madam &#8594; 'Yours faithfully'</text>
    <line x1="240" y1="380" x2="306" y2="380" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Writer's address and date -->
    <rect x="592" y="53" width="224" height="26" rx="4" fill="#f1f5f9"/>
    <text x="704" y="70" text-anchor="middle">Your address, date beneath</text>
    <line x1="592" y1="66" x2="572" y2="66" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Body -->
    <rect x="592" y="259" width="224" height="26" rx="4" fill="#f1f5f9"/>
    <text x="704" y="276" text-anchor="middle">Body: one point per paragraph</text>
    <line x1="592" y1="272" x2="572" y2="272" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Final paragraph -->
    <rect x="592" y="315" width="224" height="40" rx="4" fill="#f1f5f9"/>
    <text x="704" y="331" text-anchor="middle">Final paragraph:</text>
    <text x="704" y="347" text-anchor="middle">what you want next</text>
    <line x1="592" y1="335" x2="572" y2="335" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
