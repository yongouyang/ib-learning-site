<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The four great Chinese inventions</title>
  <desc id="desc">Four panels for papermaking, printing, gunpowder and the compass, each with what it changed, plus tea, calligraphy and Peking opera as cultural traditions.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">四大发明 sì dà fāmíng — the four great inventions</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">造纸术 印刷术 火药 指南针</text>
  <rect x="60" y="88" width="370" height="116" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="112" cy="140" r="28" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <rect x="98" y="126" width="28" height="28" rx="3" fill="#ffffff" stroke="#9f1239" stroke-width="1.5"/><path d="M 104 136 l 16 0 M 104 144 l 16 0" stroke="#9f1239" stroke-width="1.4"/>
  <text x="164" y="132" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">造纸术</text>
  <text x="164" y="152" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">zàozhǐshù</text>
  <text x="164" y="170" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">papermaking</text>
  <text x="76" y="192" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#9f1239">cheap writing material — knowledge could travel</text>
  <rect x="450" y="88" width="370" height="116" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="502" cy="140" r="28" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <rect x="488" y="124" width="28" height="32" rx="3" fill="#ffffff" stroke="#9f1239" stroke-width="1.5"/><path d="M 494 132 l 4 4 M 502 132 l 4 4 M 494 142 l 4 4 M 502 142 l 4 4" stroke="#9f1239" stroke-width="1.6"/>
  <text x="554" y="132" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">印刷术</text>
  <text x="554" y="152" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">yìnshuāshù</text>
  <text x="554" y="170" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">printing</text>
  <text x="466" y="192" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#9f1239">books could be copied quickly</text>
  <rect x="60" y="218" width="370" height="116" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="112" cy="270" r="28" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <path d="M 112 248 l 6 12 l 10 -6 l -4 12 l 12 2 l -10 8 l 8 8 l -14 -2" fill="none" stroke="#9f1239" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="164" y="262" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">火药</text>
  <text x="164" y="282" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">huǒyào</text>
  <text x="164" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">gunpowder</text>
  <text x="76" y="322" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#9f1239">fireworks and, later, weapons</text>
  <rect x="450" y="218" width="370" height="116" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="502" cy="270" r="28" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="502" cy="270" r="20" fill="#ffffff" stroke="#9f1239" stroke-width="1.5"/><path d="M 502 256 l 7 12 l -14 0 z" fill="#be123c"/>
  <text x="554" y="262" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">指南针</text>
  <text x="554" y="282" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">zhǐnánzhēn</text>
  <text x="554" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">compass</text>
  <text x="466" y="322" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#9f1239">sailors could navigate far from land</text>
  <rect x="60" y="352" width="760" height="60" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="376" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">茶文化 chá wénhuà — tea began as medicine and became a way of welcoming a guest.</text>
  <text x="80" y="398" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">书法 shūfǎ cursive brushwork and 京剧 jīngjù Peking opera are living traditions, not museum pieces.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">Papermaking and printing together made knowledge cheap to copy — the wings of learning.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Gunpowder and the compass changed travel and celebration as much as warfare.</text>
</svg>
