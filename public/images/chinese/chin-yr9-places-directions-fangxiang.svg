<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Compass points and position words in Chinese</title>
  <desc id="desc">A compass rose with east, south, west and north, and position words in front of, behind, left of, right of and beside, around a central box.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">地方与方向 — places and directions</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">请问，银行在哪里？Qǐngwèn, yínháng zài nǎlǐ? — Excuse me, where is the bank?</text>
  <circle cx="270" cy="268" r="120" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="270" cy="268" r="46" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="270" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">中心</text>
  <text x="270" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">centre</text>
  <line x1="270" y1="268" x2="270" y2="180" stroke="#fda4af" stroke-width="2"/>
  <circle cx="270" cy="180" r="22" fill="#be123c"/>
  <text x="270.0" y="181.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">北</text>
  <text x="270.0" y="214.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">běi</text>
  <line x1="270" y1="268" x2="358" y2="268" stroke="#fda4af" stroke-width="2"/>
  <circle cx="358" cy="268" r="22" fill="#be123c"/>
  <text x="358.0" y="269.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">东</text>
  <text x="358.0" y="302.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">dōng</text>
  <line x1="270" y1="268" x2="270" y2="356" stroke="#fda4af" stroke-width="2"/>
  <circle cx="270" cy="356" r="22" fill="#be123c"/>
  <text x="270.0" y="357.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">南</text>
  <text x="270.0" y="390.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">nán</text>
  <line x1="270" y1="268" x2="182" y2="268" stroke="#fda4af" stroke-width="2"/>
  <circle cx="182" cy="268" r="22" fill="#be123c"/>
  <text x="182.0" y="269.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">西</text>
  <text x="182.0" y="302.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">xī</text>
  <rect x="520" y="100" width="320" height="52" rx="8" fill="#fff1f2" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="538" y="132" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">前面</text>
  <text x="578" y="132" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">qiánmiàn</text>
  <text x="800" y="132" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">in front of</text>
  <rect x="520" y="162" width="320" height="52" rx="8" fill="#eff6ff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="538" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">后面</text>
  <text x="578" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">hòumiàn</text>
  <text x="800" y="194" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">behind</text>
  <rect x="520" y="224" width="320" height="52" rx="8" fill="#f0fdf4" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="538" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">左边</text>
  <text x="578" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">zuǒbiān</text>
  <text x="800" y="256" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">on the left</text>
  <rect x="520" y="286" width="320" height="52" rx="8" fill="#fefce8" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="538" y="318" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">右边</text>
  <text x="578" y="318" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">yòubiān</text>
  <text x="800" y="318" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">on the right</text>
  <rect x="520" y="348" width="320" height="52" rx="8" fill="#f5f3ff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="538" y="380" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">旁边</text>
  <text x="578" y="380" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">pángbiān</text>
  <text x="800" y="380" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">beside</text>
  <rect x="60" y="406" width="780" height="28" rx="8" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.3"/>
  <text x="80" y="425" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">往前走，然后往右拐。Wǎng qián zǒu, ránhòu wǎng yòu guǎi. — Go straight on, then turn right.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">往 wǎng before a direction means towards: 往东走 is walk east.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">远 yuǎn is far and 近 jìn is near: 学校离这里很近 — the school is close to here.</text>
</svg>
