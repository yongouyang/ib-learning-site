<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese core family members</title>
  <desc id="desc">A family diagram with ba ba and ma ma, and the four sibling words. Chinese has separate words for older and younger brothers and sisters, so ge ge and jie jie are grouped as older and di di and mei mei as younger.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">爸爸 妈妈 哥哥 姐姐 弟弟 妹妹</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Chinese has separate words for older and younger siblings</text>
  <rect x="300" y="86" width="140" height="76" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.7"/>
  <text x="370.0" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1c1917">爸爸</text>
  <text x="370.0" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">bàba</text>
  <text x="370.0" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">dad</text>
  <rect x="460" y="86" width="140" height="76" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.7"/>
  <text x="530.0" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1c1917">妈妈</text>
  <text x="530.0" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">māma</text>
  <text x="530.0" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">mum</text>
  <text x="450" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">父母 fùmǔ — parents</text>
  <rect x="60" y="200" width="340" height="182" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.6"/>
  <text x="230" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#9f1239">哥哥 姐姐 — older</text>
  <rect x="80" y="240" width="140" height="76" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.7"/>
  <text x="150.0" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1c1917">哥哥</text>
  <text x="150.0" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">gēge</text>
  <text x="150.0" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">older brother</text>
  <rect x="240" y="240" width="140" height="76" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.7"/>
  <text x="310.0" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1c1917">姐姐</text>
  <text x="310.0" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">jiějie</text>
  <text x="310.0" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">older sister</text>
  <text x="230" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">always older than you</text>
  <rect x="480" y="200" width="340" height="182" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="650" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">弟弟 妹妹 — younger</text>
  <rect x="500" y="240" width="140" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.7"/>
  <text x="570.0" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1c1917">弟弟</text>
  <text x="570.0" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">dìdi</text>
  <text x="570.0" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">younger brother</text>
  <rect x="660" y="240" width="140" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.7"/>
  <text x="730.0" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1c1917">妹妹</text>
  <text x="730.0" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">mèimei</text>
  <text x="730.0" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">younger sister</text>
  <text x="650" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">always younger than you</text>
  <rect x="60" y="394" width="760" height="32" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="415" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">我爱我的家人。Wǒ ài wǒ de jiārén. — I love my family.    我的 wǒ de = my (的 shows possession)</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">家 jiā means family or home, and 家人 jiārén means the family members.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">The repeated characters in 爸爸 and 妈妈 are said with the second syllable light and quick.</text>
</svg>
