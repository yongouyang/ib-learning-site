<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese food vocabulary</title>
  <desc id="desc">Seven common Chinese foods with their characters, pinyin and English, plus counting words for a bowl of rice and a baozi.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">中国食物 Zhōngguó shíwù — Chinese food</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">米饭 mǐfàn · 面条 miàntiáo · 饺子 jiǎozi</text>
  <rect x="40" y="88" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <path d="M 110 126 q 22 18 44 0 l 0 12 q -22 14 -44 0 z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="132" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">米饭</text>
  <text x="132" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">mǐfàn</text>
  <text x="132" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">cooked rice</text>
  <rect x="244" y="88" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <path d="M 316 120 q 20 10 40 0 M 316 128 q 20 10 40 0 M 316 136 q 20 10 40 0" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
  <text x="336" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">面条</text>
  <text x="336" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">miàntiáo</text>
  <text x="336" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">noodles</text>
  <rect x="448" y="88" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <path d="M 520 142 q 20 -30 40 0 q -20 10 -40 0 z" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/>
  <text x="540" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">饺子</text>
  <text x="540" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">jiǎozi</text>
  <text x="540" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">dumplings</text>
  <rect x="652" y="88" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <ellipse cx="744" cy="132" rx="21" ry="16" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><path d="M 736 126 l 16 0" stroke="#b45309" stroke-width="1.3"/>
  <text x="744" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">包子</text>
  <text x="744" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">bāozi</text>
  <text x="744" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">steamed buns</text>
  <rect x="40" y="220" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <ellipse cx="132" cy="264" rx="18" ry="14" fill="#ffffff" stroke="#a8a29e" stroke-width="1.4"/><circle cx="132" cy="264" r="7" fill="#f59e0b"/>
  <text x="132" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">鸡蛋</text>
  <text x="132" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">jīdàn</text>
  <text x="132" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">egg</text>
  <rect x="244" y="220" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="316" y="252" width="40" height="24" rx="12" fill="#d6a35c" stroke="#8b5e34" stroke-width="1.4"/>
  <text x="336" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">面包</text>
  <text x="336" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">miànbāo</text>
  <text x="336" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">bread</text>
  <rect x="448" y="220" width="184" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <circle cx="540" cy="262" r="14" fill="#dc2626"/><path d="M 540 248 q 6 -8 10 -2" fill="none" stroke="#15803d" stroke-width="2"/><circle cx="512" cy="270" r="10" fill="#f97316"/>
  <text x="540" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">水果</text>
  <text x="540" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">shuǐguǒ</text>
  <text x="540" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">fruit</text>
  <rect x="40" y="352" width="800" height="54" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="378" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">一碗米饭 yī wǎn mǐfàn — a bowl of rice (碗 wǎn = bowl)    ·    一个包子 yī gè bāozi — one baozi</text>
  <text x="60" y="398" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">我们晚上吃饺子。Wǒmen wǎnshang chī jiǎozi. — We eat dumplings in the evening.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">饺子 are traditional at Chinese New Year: their shape resembles old silver ingots, symbolising wealth.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Northern China favours wheat foods such as 面条 and 包子; the south favours rice.</text>
</svg>
