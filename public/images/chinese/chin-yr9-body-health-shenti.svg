  <rect x="390" y="300" width="460" height="116" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="410" y="326" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917">我肚子疼。Wǒ dùzi téng. — My stomach hurts.</text>
  <text x="410" y="350" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">疼 téng and 痛 tòng both mean to hurt.</text>
  <text x="410" y="374" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">我感冒了。Wǒ gǎnmào le. — I have caught a cold.</text>
  <text x="410" y="398" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">因为下雨，所以我没去。because it rained, I did not go.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">我发烧了。Wǒ fāshāo le. — I have a fever.    你应该多喝水。Nǐ yīnggāi duō hē shuǐ. — You should drink more water.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">因为…所以… links a reason to a result, and 应该 yīnggāi means should.</text>
</svg>
