<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese body parts with numbered callouts</title>
  <desc id="desc">A simple figure with nine numbered body parts beside a legend giving the characters, pinyin and English, plus the pattern for saying what hurts.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">身体 shēntǐ — body parts</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">我头疼。Wǒ tóu téng. — My head hurts.</text>
