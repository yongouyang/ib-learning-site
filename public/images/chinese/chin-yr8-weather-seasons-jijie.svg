<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The four seasons and Chinese weather words</title>
  <desc id="desc">A wheel of the four seasons with their months and typical weather, plus weather words, temperature and the question about the weather.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">季节与天气 — seasons and weather</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">今天天气怎么样？Jīntiān tiānqì zěnmeyàng? — What is the weather like today?</text>
  <circle cx="338" cy="252" r="54" fill="#bbf7d0" stroke="#57534e" stroke-width="1.5"/>
  <text x="338.0" y="238.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1c1917">春天</text>
  <text x="338.0" y="256.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">chūntiān</text>
  <text x="338.0" y="271.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#78716c">spring</text>
  <text x="338.0" y="287.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="400" fill="#57534e">三月–五月</text>
  <circle cx="222" cy="368" r="54" fill="#fecaca" stroke="#57534e" stroke-width="1.5"/>
  <text x="222.0" y="354.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1c1917">夏天</text>
  <text x="222.0" y="372.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">xiàtiān</text>
  <text x="222.0" y="387.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#78716c">summer</text>
  <text x="222.0" y="403.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="400" fill="#57534e">六月–八月</text>
  <circle cx="106" cy="252" r="54" fill="#fde68a" stroke="#57534e" stroke-width="1.5"/>
  <text x="106.0" y="238.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1c1917">秋天</text>
  <text x="106.0" y="256.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">qiūtiān</text>
  <text x="106.0" y="271.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#78716c">autumn</text>
  <text x="106.0" y="287.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="400" fill="#57534e">九月–十一月</text>
  <circle cx="222" cy="136" r="54" fill="#dbeafe" stroke="#57534e" stroke-width="1.5"/>
  <text x="222.0" y="122.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1c1917">冬天</text>
  <text x="222.0" y="140.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">dōngtiān</text>
  <text x="222.0" y="155.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#78716c">winter</text>
  <text x="222.0" y="171.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="400" fill="#57534e">十二月–二月</text>
  <circle cx="222" cy="252" r="42" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="222" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917">四季</text>
  <text x="222" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#be123c">sìjì</text>
  <rect x="452" y="86" width="388" height="150" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="472" y="114" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917">天气 words</text>
  <text x="472" y="140" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">晴天 qíngtiān  sunny</text>
  <text x="472" y="159" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">下雨 xiàyǔ  to rain</text>
  <text x="472" y="178" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">下雪 xiàxuě  to snow</text>
  <text x="472" y="197" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">刮风 guāfēng  windy</text>
  <text x="472" y="216" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">多云 duōyún  cloudy</text>
  <rect x="452" y="248" width="388" height="146" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="472" y="274" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917">温度 and comparing</text>
  <text x="472" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">三十度 sānshí dù  thirty degrees</text>
  <text x="472" y="319" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">今天比昨天冷。It is colder today than yesterday.</text>
  <text x="472" y="338" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">明天会下雨。It will rain tomorrow.</text>
  <text x="472" y="357" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">冷 lěng cold  ·  热 rè hot</text>
  <text x="472" y="376" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">我最喜欢春天。I like spring best.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">会 huì marks the future: 明天会下雪 — it will snow tomorrow.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Seasons and months take 月: 三月 is March and 十二月 is December. Degrees take 度: 三十度 is thirty degrees.</text>
</svg>
