<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Building Chinese numbers from eleven to ninety-nine</title>
  <desc id="desc">Three rules: ten plus a digit makes eleven to nineteen, a digit plus ten makes the tens, and digit plus ten plus digit makes the numbers in between. Fifteen is shiwu, never yishiwu.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Numbers 11–99: three rules, no exceptions</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">十 shí = ten — and the number is read exactly as it is written</text>
  <rect x="60" y="80" width="760" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="60" y="80" width="170" height="110" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="145" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#9f1239">11–19</text>
  <text x="145" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">十 + digit</text>
  <text x="145" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#a8a29e">read left to right</text>
  <rect x="262" y="100" width="150" height="72" rx="8" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.3"/>
  <text x="337" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1c1917">十一</text>
  <text x="337" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">shíyī</text>
  <text x="432" y="146" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#be123c">11</text>
  <rect x="530" y="100" width="150" height="72" rx="8" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.3"/>
  <text x="605" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1c1917">十二</text>
  <text x="605" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">shí’èr</text>
  <text x="700" y="146" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#be123c">12</text>
  <rect x="60" y="204" width="760" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="60" y="204" width="170" height="110" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="145" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#9f1239">20, 30 … 90</text>
  <text x="145" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">digit + 十</text>
  <text x="145" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#a8a29e">read left to right</text>
  <rect x="262" y="224" width="150" height="72" rx="8" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.3"/>
  <text x="337" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1c1917">二十</text>
  <text x="337" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">èrshí</text>
  <text x="432" y="270" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#be123c">20</text>
  <rect x="530" y="224" width="150" height="72" rx="8" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.3"/>
  <text x="605" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1c1917">三十</text>
  <text x="605" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">sānshí</text>
  <text x="700" y="270" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#be123c">30</text>
  <rect x="60" y="328" width="760" height="110" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="60" y="328" width="170" height="110" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="145" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#9f1239">21–99</text>
  <text x="145" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">digit + 十 + digit</text>
  <text x="145" y="414" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#a8a29e">read left to right</text>
  <rect x="262" y="348" width="150" height="72" rx="8" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.3"/>
  <text x="337" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1c1917">二十一</text>
  <text x="337" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">èrshíyī</text>
  <text x="432" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#be123c">21</text>
  <rect x="530" y="348" width="150" height="72" rx="8" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.3"/>
  <text x="605" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1c1917">九十九</text>
  <text x="605" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">jiǔshíjiǔ</text>
  <text x="700" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#be123c">99</text>
  <rect x="60" y="452" width="760" height="40" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.3"/>
  <text x="80" y="478" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9f1239">47 = 四十七 sìshí-qī  —  "four ten seven"      ·      15 is 十五 shíwǔ, never 一十五</text>
</svg>
