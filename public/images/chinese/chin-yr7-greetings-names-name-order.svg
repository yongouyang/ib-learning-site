<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese name order with the surname first</title>
  <desc id="desc">The name Wang Xiaoming is unpacked: the first character Wang is the surname and the last two characters Xiaoming are the given name, with English order shown for comparison and five common surnames listed.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">Chinese names put the surname first</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">姓 xìng — surname    ·    名字 míngzi — given name</text>
  <rect x="60" y="96" width="420" height="182" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.8"/>
  <text x="72" y="120" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#9f1239">Chinese order</text>
  <rect x="120" y="132" width="88" height="92" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="1.8"/>
  <text x="164" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#1c1917">王</text>
  <text x="164" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Wáng</text>
  <rect x="240" y="132" width="88" height="92" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="284" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#1c1917">小</text>
  <text x="284" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Xiǎo</text>
  <rect x="330" y="132" width="88" height="92" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="374" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#1c1917">明</text>
  <text x="374" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">míng</text>
  <text x="150" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#be123c">姓 surname</text>
  <text x="300" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">名字 given name</text>
  <rect x="520" y="96" width="320" height="182" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
  <text x="532" y="120" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">English order</text>
  <rect x="542" y="132" width="280" height="92" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="682" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">Xiaoming Wang</text>
  <text x="682" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">given name · surname</text>
  <rect x="60" y="296" width="760" height="58" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="320" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Most surnames are one character; given names are usually one or two.</text>
  <text x="80" y="342" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">我姓王。Wǒ xìng Wáng. — My surname is Wang.    他叫王小明。Tā jiào Wáng Xiǎomíng. — He is called Wang Xiaoming.</text>
  <rect x="60" y="368" width="760" height="52" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="80" y="392" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#9f1239">Common surnames</text>
  <text x="210" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">王</text>
  <text x="240" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Wáng</text>
  <text x="335" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">李</text>
  <text x="365" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Lǐ</text>
  <text x="460" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">张</text>
  <text x="490" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Zhāng</text>
  <text x="585" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">刘</text>
  <text x="615" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Liú</text>
  <text x="710" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#1c1917">陈</text>
  <text x="740" y="394" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Chén</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">Family comes first in Chinese culture, and the name order reflects that.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Titles come after the surname: 王老师 is Teacher Wang.</text>
</svg>
