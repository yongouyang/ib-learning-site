<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A Chinese floor plan with rooms and furniture</title>
  <desc id="desc">A flat plan labelled in Chinese with pinyin: sitting room, bedroom, kitchen, bathroom, study and hall, plus the furniture in each room and the verb you for saying what exists.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">房间 fángjiān — rooms and furniture</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">有 yǒu says something exists: 家里有三间卧室 — the home has three bedrooms</text>
  <rect x="60" y="88" width="250" height="140" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="185.0" y="142.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">客厅</text>
  <text x="185.0" y="162.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">kètīng</text>
  <text x="185.0" y="178.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">sitting room</text>
  <text x="185.0" y="194.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">沙发 椅子</text>
  <rect x="310" y="88" width="150" height="140" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="385.0" y="142.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">卧室</text>
  <text x="385.0" y="162.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">wòshì</text>
  <text x="385.0" y="178.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">bedroom</text>
  <text x="385.0" y="194.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">床 柜子</text>
  <rect x="460" y="88" width="150" height="68" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="535.0" y="106.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">厨房</text>
  <text x="535.0" y="126.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">chúfáng</text>
  <text x="535.0" y="142.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">kitchen</text>
  <text x="535.0" y="158.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">桌子</text>
  <rect x="460" y="156" width="150" height="72" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="535.0" y="176.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">卫生间</text>
  <text x="535.0" y="196.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">wèishēngjiān</text>
  <text x="535.0" y="212.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">bathroom</text>
  <rect x="60" y="228" width="250" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="185.0" y="252.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">书房</text>
  <text x="185.0" y="272.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">shūfáng</text>
  <text x="185.0" y="288.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">study</text>
  <text x="185.0" y="304.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">书桌 书架</text>
  <rect x="310" y="228" width="150" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="385.0" y="252.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">饭厅</text>
  <text x="385.0" y="272.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">fàntīng</text>
  <text x="385.0" y="288.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">dining room</text>
  <text x="385.0" y="304.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">桌子</text>
  <rect x="460" y="228" width="150" height="80" fill="#fafaf9" stroke="#57534e" stroke-width="1.6"/>
  <text x="535.0" y="252.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">门厅</text>
  <text x="535.0" y="272.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">méntīng</text>
  <text x="535.0" y="288.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">hall</text>
  <rect x="636" y="88" width="204" height="100" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.6"/>
  <text x="738" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9f1239">Where things are: 在</text>
  <text x="738" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">沙发在客厅里。</text>
  <text x="738" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">Shāfā zài kètīng lǐ.</text>
  <text x="738" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">The sofa is in the sitting room.</text>
  <rect x="636" y="200" width="204" height="108" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.6"/>
  <text x="738" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">位置 words</text>
  <text x="738" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">里 lǐ  inside</text>
  <text x="738" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">上 shàng  on</text>
  <text x="738" y="288" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">下 xià  under</text>
  <text x="738" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">旁边 pángbiān  beside</text>
  <rect x="60" y="316" width="760" height="40" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="341" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">间 jiān counts rooms: 三间卧室 is three bedrooms.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">有 yǒu states what exists and 在 zài states where something is — two different verbs.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">The last character of a compound tells you the kind of room: 书房 is a study, 卧室 a bedroom.</text>
</svg>
