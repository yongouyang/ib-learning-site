<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A Chinese daily routine from morning to night</title>
  <desc id="desc">A day timeline with six routine verbs, each shown with characters, pinyin and English: get up, eat breakfast, go to school, have lessons, go home and sleep.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">日常生活 rìcháng shēnghuó — daily routine</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">从早上到晚上 — from morning to night</text>
  <line x1="60" y1="200" x2="820" y2="200" stroke="#fda4af" stroke-width="3"/>
  <line x1="110" y1="200" x2="110" y2="180" stroke="#fda4af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="50" y="106" width="120" height="74" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.6"/>
  <text x="110" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">起床</text>
  <text x="110" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">qǐchuáng</text>
  <text x="110" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">get up</text>
  <circle cx="110" cy="200" r="7" fill="#be123c"/>
  <line x1="244" y1="232" x2="244" y2="200" stroke="#fda4af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="184" y="236" width="120" height="74" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.6"/>
  <text x="244" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">吃早饭</text>
  <text x="244" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">chī zǎofàn</text>
  <text x="244" y="304" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">eat breakfast</text>
  <circle cx="244" cy="200" r="7" fill="#be123c"/>
  <line x1="378" y1="200" x2="378" y2="180" stroke="#fda4af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="318" y="106" width="120" height="74" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.6"/>
  <text x="378" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">上学</text>
  <text x="378" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">shàngxué</text>
  <text x="378" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">go to school</text>
  <circle cx="378" cy="200" r="7" fill="#be123c"/>
  <line x1="512" y1="232" x2="512" y2="200" stroke="#fda4af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="452" y="236" width="120" height="74" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.6"/>
  <text x="512" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">上课</text>
  <text x="512" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">shàngkè</text>
  <text x="512" y="304" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">have lessons</text>
  <circle cx="512" cy="200" r="7" fill="#be123c"/>
  <line x1="646" y1="200" x2="646" y2="180" stroke="#fda4af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="586" y="106" width="120" height="74" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.6"/>
  <text x="646" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">回家</text>
  <text x="646" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">huí jiā</text>
  <text x="646" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">go home</text>
  <circle cx="646" cy="200" r="7" fill="#be123c"/>
  <line x1="780" y1="232" x2="780" y2="200" stroke="#fda4af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="720" y="236" width="120" height="74" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.6"/>
  <text x="780" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">睡觉</text>
  <text x="780" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">shuìjiào</text>
  <text x="780" y="304" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">sleep</text>
  <circle cx="780" cy="200" r="7" fill="#be123c"/>
  <rect x="60" y="336" width="760" height="44" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="362" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">我每天七点起床，八点上学。Wǒ měitiān qī diǎn qǐchuáng, bā diǎn shàngxué.</text>
  <rect x="60" y="390" width="760" height="32" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="80" y="411" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">每天 měitiān every day   ·   有时候 yǒushíhou sometimes   ·   常常 chángcháng often</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">Time comes before the verb: 我七点起床 — I get up at seven, not I get up seven o’clock.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Frequency words such as 每天 and 常常 also sit before the verb.</text>
</svg>
