<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The structure of a Chinese fable</title>
  <desc id="desc">Two parts: the story, with characters, events and a result, and the moral it teaches. Three questions lead you to the moral, and some fables state it outright while others leave it hidden.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <defs><marker id="ca" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#be123c"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">寓言的结构 — the structure of a fable</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">every fable has two parts: 故事 the story, then 寓意 the moral</text>
  <rect x="60" y="88" width="760" height="60" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.8"/>
  <text x="440" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#9f1239">第一部分 — the story</text>
  <text x="440" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">人物 characters, often animals  ·  发生的事情 events  ·  结果 the result</text>
  <rect x="60" y="164" width="240" height="84" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="180" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">人物</text>
  <text x="180" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">characters — often animals</text>
  <rect x="316" y="164" width="240" height="84" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="436" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">事情</text>
  <text x="436" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">what happens</text>
  <rect x="572" y="164" width="240" height="84" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="692" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1c1917">结果</text>
  <text x="692" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">how it ends</text>
  <line x1="440" y1="252" x2="440" y2="284" stroke="#be123c" stroke-width="2.4" marker-end="url(#ca)"/>
  <rect x="60" y="290" width="760" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="440" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">第二部分 — the moral</text>
  <text x="440" y="344" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">the lesson the story teaches  ·  有的直接写出来，有的藏起来让读者思考</text>
  <rect x="60" y="376" width="760" height="52" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="80" y="398" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1c1917">Three questions to find the moral:</text>
  <text x="80" y="418" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#be123c">发生了什么？  ·  人物做得对不对？  ·  这个故事想告诉我什么道理？</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">Some fables end with the moral spelled out, for example 这个故事告诉我们…</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Others hide the moral so the reader works it out — answering the three questions gets you there.</text>
</svg>
