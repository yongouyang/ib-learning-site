<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese idioms: literal meaning and figurative meaning</title>
  <desc id="desc">Four idioms are shown with what they say literally and what they actually mean: drawing legs on a snake, a frog at the bottom of a well, playing the lute to a cow, and mending the fold after a sheep is lost.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">成语 chéngyǔ — literal vs figurative</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">四个字 four characters, with a meaning you cannot guess from the words alone</text>
  <rect x="60" y="88" width="370" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="245" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">画蛇添足</text>
  <text x="245" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">huà shé tiān zú</text>
  <text x="76" y="172" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">字面 literally: draw legs on a snake</text>
  <text x="76" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9f1239">比喻 figuratively: ruining something by adding too much</text>
  <rect x="450" y="88" width="370" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="635" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">井底之蛙</text>
  <text x="635" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">jǐng dǐ zhī wā</text>
  <text x="466" y="172" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">字面 literally: a frog at the bottom of a well</text>
  <text x="466" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9f1239">比喻 figuratively: someone with a very narrow view</text>
  <rect x="60" y="222" width="370" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="245" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">对牛弹琴</text>
  <text x="245" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">duì niú tán qín</text>
  <text x="76" y="306" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">字面 literally: play the lute to a cow</text>
  <text x="76" y="328" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9f1239">比喻 figuratively: say something wasted on the listener</text>
  <rect x="450" y="222" width="370" height="120" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="635" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">亡羊补牢</text>
  <text x="635" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">wáng yáng bǔ láo</text>
  <text x="466" y="306" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">字面 literally: mend the fold after a sheep is lost</text>
  <text x="466" y="328" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9f1239">比喻 figuratively: it is not too late to fix the problem</text>
  <rect x="60" y="362" width="760" height="56" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="386" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Most 成语 come from ancient stories, so the four characters label a whole story rather than describing anything.</text>
  <text x="80" y="408" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Use them sparingly and only where the meaning fits — a 成语 in the wrong sentence sounds worse than plain words.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">亡羊补牢 is the encouraging one: the sheep is already lost, but fixing the pen still matters.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">对牛弹琴 blames the speaker for choosing the wrong listener, not the cow.</text>
</svg>
