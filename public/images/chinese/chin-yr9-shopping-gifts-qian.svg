<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese money and asking prices</title>
  <desc id="desc">How yuan, jiao and fen work in spoken Chinese, how to ask how much something costs, and the words for expensive and cheap.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">钱 qián — money and prices</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">多少钱？Duōshao qián? — How much is it?</text>
  <rect x="60" y="88" width="370" height="150" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.8"/>
  <text x="80" y="116" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9f1239">块 kuài and 毛 máo</text>
  <text x="80" y="142" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">12.50 is 十二块五毛</text>
  <text x="80" y="166" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">shí’èr kuài wǔ máo</text>
  <text x="80" y="190" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">1 块 = 10 毛, and 1 毛 = 10 分 fēn.</text>
  <text x="80" y="212" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">Spoken Chinese uses 块, not 元 yuán, in shops.</text>
  <rect x="450" y="88" width="370" height="150" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.8"/>
  <text x="470" y="116" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1917">Buying things</text>
  <text x="470" y="144" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">这个多少钱？How much is this?</text>
  <text x="470" y="166" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">太贵了！That is too expensive!</text>
  <text x="470" y="188" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">便宜一点吧。Make it a bit cheaper.</text>
  <text x="470" y="210" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">我买了。I will take it.</text>
  <rect x="60" y="254" width="760" height="74" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="278" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">贵 guì = expensive · 便宜 piányi = cheap · 还是 háishì = or (in a choice)</text>
  <text x="80" y="302" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">你要红的还是蓝的？Nǐ yào hóng de háishì lán de? — Do you want the red one or the blue one?</text>
  <rect x="60" y="336" width="760" height="90" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.4"/>
  <text x="80" y="360" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">Comparing with 比 bǐ and 更 gèng</text>
  <text x="80" y="384" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">这个比那个便宜。Zhège bǐ nàge piányi. — This one is cheaper than that one.</text>
  <text x="80" y="406" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">这个更好。Zhège gèng hǎo. — This one is even better.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">块 is the spoken word for the yuan, so prices sound like 十块, 二十块.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">礼物 lǐwù is a gift, and 送给 sòng gěi means to give to someone.</text>
</svg>
