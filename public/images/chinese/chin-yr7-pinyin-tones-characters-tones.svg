<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The four tones and the neutral tone in Mandarin</title>
  <desc id="desc">Five panels show the pitch of each tone: a high flat first tone, a rising second tone, a falling-rising third tone, a falling fourth tone, and a light neutral tone. The syllable ma means mother, hemp, horse, to scold or a question particle depending on the tone.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">The four tones and the neutral tone</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">the same letters, five different words: mā má mǎ mà ma</text>
  <rect x="44" y="92" width="152" height="286" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="120" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#be123c">1st</text>
  <rect x="62" y="136" width="116" height="96" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="62" y1="136" x2="178" y2="136" stroke="#f0efee" stroke-width="1"/>
  <line x1="62" y1="160" x2="178" y2="160" stroke="#f0efee" stroke-width="1"/>
  <line x1="62" y1="184" x2="178" y2="184" stroke="#f0efee" stroke-width="1"/>
  <line x1="62" y1="208" x2="178" y2="208" stroke="#f0efee" stroke-width="1"/>
  <line x1="62" y1="232" x2="178" y2="232" stroke="#f0efee" stroke-width="1"/>
  <line x1="72" y1="159" x2="168" y2="159" stroke="#be123c" stroke-width="3"/>
  <text x="120" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1c1917">mā</text>
  <text x="120" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#1c1917">妈</text>
  <text x="120" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">mum</text>
  <text x="120" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">high and flat</text>
  <rect x="211" y="92" width="152" height="286" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="287" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#c2410c">2nd</text>
  <rect x="229" y="136" width="116" height="96" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="229" y1="136" x2="345" y2="136" stroke="#f0efee" stroke-width="1"/>
  <line x1="229" y1="160" x2="345" y2="160" stroke="#f0efee" stroke-width="1"/>
  <line x1="229" y1="184" x2="345" y2="184" stroke="#f0efee" stroke-width="1"/>
  <line x1="229" y1="208" x2="345" y2="208" stroke="#f0efee" stroke-width="1"/>
  <line x1="229" y1="232" x2="345" y2="232" stroke="#f0efee" stroke-width="1"/>
  <line x1="239" y1="203" x2="335" y2="157" stroke="#c2410c" stroke-width="3"/>
  <text x="287" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1c1917">má</text>
  <text x="287" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#1c1917">麻</text>
  <text x="287" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">hemp</text>
  <text x="287" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#c2410c">rising</text>
  <rect x="378" y="92" width="152" height="286" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="454" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a16207">3rd</text>
  <rect x="396" y="136" width="116" height="96" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="396" y1="136" x2="512" y2="136" stroke="#f0efee" stroke-width="1"/>
  <line x1="396" y1="160" x2="512" y2="160" stroke="#f0efee" stroke-width="1"/>
  <line x1="396" y1="184" x2="512" y2="184" stroke="#f0efee" stroke-width="1"/>
  <line x1="396" y1="208" x2="512" y2="208" stroke="#f0efee" stroke-width="1"/>
  <line x1="396" y1="232" x2="512" y2="232" stroke="#f0efee" stroke-width="1"/>
  <path d="M 406 165 C 436 224, 468 224, 502 163" fill="none" stroke="#a16207" stroke-width="3"/>
  <text x="454" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1c1917">mǎ</text>
  <text x="454" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#1c1917">马</text>
  <text x="454" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">horse</text>
  <text x="454" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a16207">falling-rising</text>
  <rect x="545" y="92" width="152" height="286" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="621" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803d">4th</text>
  <rect x="563" y="136" width="116" height="96" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="563" y1="136" x2="679" y2="136" stroke="#f0efee" stroke-width="1"/>
  <line x1="563" y1="160" x2="679" y2="160" stroke="#f0efee" stroke-width="1"/>
  <line x1="563" y1="184" x2="679" y2="184" stroke="#f0efee" stroke-width="1"/>
  <line x1="563" y1="208" x2="679" y2="208" stroke="#f0efee" stroke-width="1"/>
  <line x1="563" y1="232" x2="679" y2="232" stroke="#f0efee" stroke-width="1"/>
  <line x1="573" y1="157" x2="669" y2="205" stroke="#15803d" stroke-width="3"/>
  <text x="621" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1c1917">mà</text>
  <text x="621" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#1c1917">骂</text>
  <text x="621" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">to scold</text>
  <text x="621" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#15803d">falling</text>
  <rect x="712" y="92" width="152" height="286" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="788" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6366f1">neutral</text>
  <rect x="730" y="136" width="116" height="96" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="730" y1="136" x2="846" y2="136" stroke="#f0efee" stroke-width="1"/>
  <line x1="730" y1="160" x2="846" y2="160" stroke="#f0efee" stroke-width="1"/>
  <line x1="730" y1="184" x2="846" y2="184" stroke="#f0efee" stroke-width="1"/>
  <line x1="730" y1="208" x2="846" y2="208" stroke="#f0efee" stroke-width="1"/>
  <line x1="730" y1="232" x2="846" y2="232" stroke="#f0efee" stroke-width="1"/>
  <circle cx="788.0" cy="184.0" r="6" fill="#6366f1"/>
  <text x="788" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1c1917">ma</text>
  <text x="788" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#1c1917">吗</text>
  <text x="788" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">question particle</text>
  <text x="788" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#6366f1">light and quick</text>
  <rect x="44" y="394" width="792" height="32" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="415" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">When two third tones meet, the first becomes a second tone: 你好 is written nǐ hǎo but said ní hǎo (third-tone sandhi).</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">The pitch pattern is part of the word, not an accent — the wrong tone changes the meaning.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">The neutral tone is short and light and carries no tone mark.</text>
</svg>
