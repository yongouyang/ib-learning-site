<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The forms of classical Chinese poetry</title>
  <desc id="desc">A five-character quatrain and a seven-character quatrain shown line by line, with the rule that characters per line and lines per poem give the form its name.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">古诗 gǔshī — the forms of classical poetry</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">五言绝句 wǔyán juéjù · 七言绝句 qīyán juéjù</text>
  <rect x="60" y="88" width="370" height="268" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.8"/>
  <text x="80" y="116" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#9f1239">五言绝句 — five characters per line</text>
  <text x="80" y="138" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">4 lines × 5 characters = 20</text>
  <text x="80" y="174" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">床前明月光，</text>
  <text x="240" y="174" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Chuáng qián míng yuè guāng</text>
  <text x="80" y="220" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">疑是地上霜。</text>
  <text x="240" y="220" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Yí shì dì shàng shuāng</text>
  <text x="80" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">举头望明月，</text>
  <text x="240" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Jǔ tóu wàng míng yuè</text>
  <text x="80" y="312" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">低头思故乡。</text>
  <text x="240" y="312" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Dī tóu sī gùxiāng</text>
  <text x="80" y="342" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">《静夜思》李白 — Li Bai, Quiet Night Thoughts</text>
  <rect x="450" y="88" width="370" height="268" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="470" y="116" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">七言绝句 — seven characters per line</text>
  <text x="470" y="138" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">4 lines × 7 characters = 28</text>
  <text x="470" y="174" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">春眠不觉晓，</text>
  <text x="650" y="174" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Chūn mián bù jué xiǎo</text>
  <text x="470" y="220" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">处处闻啼鸟。</text>
  <text x="650" y="220" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Chùchù wén tí niǎo</text>
  <text x="470" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">夜来风雨声，</text>
  <text x="650" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Yè lái fēng yǔ shēng</text>
  <text x="470" y="312" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#be123c">花落知多少。</text>
  <text x="650" y="312" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#a8a29e">Huā luò zhī duōshǎo</text>
  <text x="470" y="342" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">《春晓》孟浩然 — Meng Haoran, Spring Dawn</text>
  <rect x="60" y="376" width="760" height="52" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="80" y="400" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">绝句 juéjù is four lines; 律诗 lǜshī is eight. The number of characters per line comes first: 五言 five, 七言 seven.</text>
  <text x="80" y="420" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">意象 yìxiàng are the images that carry the feeling — the moon for homesickness, the birds for spring.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">Reading a poem in four steps: read it aloud, mark the images, find the feeling, then the form.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Rhyme and rhythm matter: classical poems were written to be chanted, not silently read.</text>
</svg>
