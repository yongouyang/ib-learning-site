<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Chinese clothes vocabulary</title>
  <desc id="desc">Nine clothing words with their characters, pinyin and English, plus the measure words jian, tiao and shuang used for counting clothes.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">衣服 yīfu — clothes</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Learn each word with its measure word</text>
  <rect x="40" y="84" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(52,118)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 12 4 l 7 4 l 7 -4 l 10 6 l -5 9 l -3 -2 l 0 22 l -20 0 l 0 -22 l -3 2 l -5 -9 z"/>
  </g>
  <text x="152" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">衣服</text>
  <text x="152" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">yīfu</text>
  <text x="152" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">clothes</text>
  <rect x="244" y="84" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(256,118)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 12 4 l 7 4 l 7 -4 l 10 6 l -5 9 l -3 -2 l 0 22 l -20 0 l 0 -22 l -3 2 l -5 -9 z"/>
  </g>
  <text x="356" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">T恤</text>
  <text x="356" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">T-xù</text>
  <text x="356" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">T-shirt</text>
  <rect x="448" y="84" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(460,118)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 8 4 l 24 0 l 2 32 l -9 0 l -5 -18 l -5 18 l -9 0 z"/>
  </g>
  <text x="560" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">裤子</text>
  <text x="560" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">kùzi</text>
  <text x="560" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">trousers</text>
  <rect x="40" y="184" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(52,218)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 8 4 l 24 0 l 2 32 l -9 0 l -5 -18 l -5 18 l -9 0 z"/>
  </g>
  <text x="152" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">裙子</text>
  <text x="152" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">qúnzi</text>
  <text x="152" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">skirt / dress</text>
  <rect x="244" y="184" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(256,218)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 3 24 q 0 -8 7 -8 l 7 0 l 0 6 l 13 0 q 8 0 8 8 l 0 4 l -35 0 z"/>
  </g>
  <text x="356" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">鞋子</text>
  <text x="356" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">xiézi</text>
  <text x="356" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">shoes</text>
  <rect x="448" y="184" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(460,218)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 3 24 q 0 -8 7 -8 l 7 0 l 0 6 l 13 0 q 8 0 8 8 l 0 4 l -35 0 z"/>
  </g>
  <text x="560" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">袜子</text>
  <text x="560" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">wàzi</text>
  <text x="560" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">socks</text>
  <rect x="40" y="284" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(52,318)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 12 4 l 7 4 l 7 -4 l 10 6 l -5 9 l -3 -2 l 0 22 l -20 0 l 0 -22 l -3 2 l -5 -9 z"/>
  </g>
  <text x="152" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">帽子</text>
  <text x="152" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">màozi</text>
  <text x="152" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">hat / cap</text>
  <rect x="244" y="284" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(256,318)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 12 4 l 7 4 l 7 -4 l 10 6 l -5 9 l -3 -2 l 0 22 l -20 0 l 0 -22 l -3 2 l -5 -9 z"/>
  </g>
  <text x="356" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">外套</text>
  <text x="356" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">wàitào</text>
  <text x="356" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">coat / jacket</text>
  <rect x="448" y="284" width="184" height="92" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <g transform="translate(460,318)" fill="#fecdd3" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round">
    <circle cx="14" cy="18" r="8" fill="none"/><circle cx="26" cy="18" r="8" fill="none"/><path d="M 20 18 l 0 3"/>
  </g>
  <text x="560" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1c1917">眼镜</text>
  <text x="560" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c">yǎnjìng</text>
  <text x="560" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">glasses</text>
  <rect x="676" y="84" width="164" height="226" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.6"/>
  <text x="758" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#9f1239">Measure words</text>
  <text x="758" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">件 jiàn</text>
  <text x="758" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#b91c1c">一件T恤</text>
  <text x="758" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">tops</text>
  <text x="758" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">条 tiáo</text>
  <text x="758" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#b91c1c">一条裤子</text>
  <text x="758" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">trousers, skirts</text>
  <text x="758" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1917">双 shuāng</text>
  <text x="758" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#b91c1c">一双鞋</text>
  <text x="758" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">pairs of shoes, socks</text>
  <rect x="40" y="392" width="800" height="34" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="60" y="414" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">我的鞋子是黑色的。Wǒ de xiézi shì hēisè de. — My shoes are black.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">子 zi is a light, neutral-tone ending on many nouns: 裤子 kùzi, 裙子 qúnzi, 帽子 màozi.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">The measure word sits between the number and the noun: 一件衣服 is one item of clothing.</text>
</svg>
