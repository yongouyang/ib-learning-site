<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Three Chinese festivals through the year</title>
  <desc id="desc">A year wheel placing the Spring Festival, the Dragon Boat Festival and the Mid-Autumn Festival, with the dates, the foods and the customs of each.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">节日 jiérì — festivals through the year</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">春节 端午节 中秋节</text>
  <circle cx="250" cy="148" r="50" fill="#fecaca" stroke="#57534e" stroke-width="1.5"/>
  <text x="250.0" y="138.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">春节</text>
  <text x="250.0" y="156.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#be123c">chūnjié</text>
  <text x="250.0" y="174.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#57534e">一月–二月  Jan–Feb</text>
  <circle cx="402" cy="278" r="50" fill="#bbf7d0" stroke="#57534e" stroke-width="1.5"/>
  <text x="402.0" y="268.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">端午节</text>
  <text x="402.0" y="286.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#be123c">duānwǔjié</text>
  <text x="402.0" y="304.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#57534e">五月  May</text>
  <circle cx="250" cy="408" r="50" fill="#fde68a" stroke="#57534e" stroke-width="1.5"/>
  <text x="250.0" y="398.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">中秋节</text>
  <text x="250.0" y="416.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#be123c">zhōngqiūjié</text>
  <text x="250.0" y="434.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#57534e">八月  Aug–Sep</text>
  <circle cx="98" cy="278" r="50" fill="#dbeafe" stroke="#57534e" stroke-width="1.5"/>
  <text x="98.0" y="268.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1c1917">国庆节</text>
  <text x="98.0" y="286.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#be123c">guóqìngjié</text>
  <text x="98.0" y="304.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#57534e">十月  October</text>
  <circle cx="240" cy="250" r="46" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="250" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917">中国节日</text>
  <text x="250" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#78716c">festivals</text>
  <rect x="470" y="100" width="370" height="72" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="486" y="128" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9f1239">春节</text>
  <text x="522" y="128" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">chūnjié</text>
  <text x="486" y="148" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1c1917">Spring Festival</text>
  <text x="486" y="166" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">饺子 dumplings, red couplets, 红包 red envelopes, family reunion</text>
  <rect x="470" y="182" width="370" height="72" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="486" y="210" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9f1239">端午节</text>
  <text x="537" y="210" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">duānwǔjié</text>
  <text x="486" y="230" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1c1917">Dragon Boat Festival</text>
  <text x="486" y="248" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">粽子 sticky-rice parcels and dragon boat races</text>
  <rect x="470" y="264" width="370" height="72" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="486" y="292" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9f1239">中秋节</text>
  <text x="537" y="292" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">zhōngqiūjié</text>
  <text x="486" y="312" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1c1917">Mid-Autumn Festival</text>
  <text x="486" y="330" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#78716c">月饼 mooncakes, lanterns, looking at the full moon</text>
  <rect x="470" y="346" width="370" height="88" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="490" y="370" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">生日 shēngrì — birthdays</text>
  <text x="490" y="392" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">生日快乐！Shēngrì kuàilè! — Happy birthday!</text>
  <text x="490" y="412" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">吃长寿面 — eat long noodles for a long life.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">The Spring Festival is the biggest one: families travel home and eat together on New Year’s Eve.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Mooncakes are shared at Mid-Autumn, and 粽子 are eaten at the Dragon Boat Festival.</text>
</svg>
