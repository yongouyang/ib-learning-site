<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Myths and legends in Chinese tradition</title>
  <desc id="desc">A comparison of myth and legend, with two creation myths and two legends, showing what each explains.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">神话与传说 — myths and legends</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">一样吗？Are they the same thing?</text>
  <rect x="60" y="88" width="370" height="110" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.8"/>
  <text x="80" y="118" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9f1239">神话 shénhuà — myth</text>
  <text x="80" y="142" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Explains how the world began or why nature works.</text>
  <text x="80" y="164" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">The characters are gods or giant heroes.</text>
  <text x="80" y="186" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">盘古开天 · 女娲造人</text>
  <rect x="450" y="88" width="370" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="470" y="118" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">传说 chuánshuō — legend</text>
  <text x="470" y="142" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Explains a festival, a place or a family line.</text>
  <text x="470" y="164" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">The characters are often ordinary people.</text>
  <text x="470" y="186" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">嫦娥奔月 · 牛郎织女</text>
  <rect x="60" y="212" width="370" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="76" y="242" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">盘古开天</text>
  <text x="146" y="242" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">Pángǔ kāitiān</text>
  <text x="76" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Pan Gu separates sky and earth</text>
  <text x="76" y="288" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">leaves his body to become mountains and rivers</text>
  <rect x="450" y="212" width="370" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="466" y="242" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">女娲造人</text>
  <text x="536" y="242" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">Nǚwā zàorén</text>
  <text x="466" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Nüwa moulds people from clay</text>
  <text x="466" y="288" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">explains where people came from</text>
  <rect x="60" y="320" width="370" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="76" y="350" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">嫦娥奔月</text>
  <text x="146" y="350" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">Cháng’é bēnyuè</text>
  <text x="76" y="374" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">Chang’e flies to the moon</text>
  <text x="76" y="396" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">ties to the Mid-Autumn Festival</text>
  <rect x="450" y="320" width="370" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="466" y="350" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c1917">牛郎织女</text>
  <text x="536" y="350" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#be123c">Niúláng Zhīnǚ</text>
  <text x="466" y="374" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1c1917">the cowherd and the weaver girl</text>
  <text x="466" y="396" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#78716c">the lovers meet once a year, on the seventh night</text>
  <rect x="60" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1c1917">神话 explains the world; 传说 explains a festival or a place — and both are told rather than written down.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Both carry the values a culture wants to pass on: hard work, loyalty, patience.</text>
</svg>
