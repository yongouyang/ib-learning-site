<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Three rhetorical devices in Chinese scenery writing</title>
  <desc id="desc">Metaphor, personification and parallelism, each shown with a definition and a worked example from scenery description.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcfb"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1c1917">修辞手法 xiūcí shǒufǎ — three devices</text>
  <text x="440" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">比喻 拟人 排比</text>
  <rect x="60" y="88" width="760" height="100" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="60" y="88" width="150" height="100" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="135" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#9f1239">比喻</text>
  <text x="135" y="154" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">bǐyù</text>
  <text x="230" y="118" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1917">metaphor</text>
  <text x="230" y="140" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">comparing one thing to another with 像 or 好像</text>
  <text x="230" y="166" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#be123c">月亮像一只小船。</text>
  <text x="230" y="182" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">The moon is like a little boat.</text>
  <rect x="60" y="200" width="760" height="100" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="60" y="200" width="150" height="100" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="135" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#9f1239">拟人</text>
  <text x="135" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">nǐrén</text>
  <text x="230" y="230" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1917">personification</text>
  <text x="230" y="252" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">giving an animal, plant or object human actions</text>
  <text x="230" y="278" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#be123c">小草偷偷地钻出来。</text>
  <text x="230" y="294" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">The grass sneaks up out of the ground.</text>
  <rect x="60" y="312" width="760" height="100" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="60" y="312" width="150" height="100" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="135" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#9f1239">排比</text>
  <text x="135" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#be123c">páibǐ</text>
  <text x="230" y="342" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1917">parallelism</text>
  <text x="230" y="364" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#78716c">three or more phrases with the same pattern in a row</text>
  <text x="230" y="390" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#be123c">春天来了，花开了，鸟叫了。</text>
  <text x="230" y="406" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#a8a29e">Spring came, the flowers opened, the birds sang.</text>
  <rect x="60" y="424" width="760" height="20" rx="6" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.3"/>
  <text x="70" y="438" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#78716c">顺序 order also matters: 由远及近 from far to near, 移步换景 as you walk, or 时间顺序 through the day.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1c1917">比喻 makes a picture, 拟人 makes it alive, and 排比 gives it rhythm.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#78716c">Writers often use all three together, with the five senses supplying the detail.</text>
</svg>
