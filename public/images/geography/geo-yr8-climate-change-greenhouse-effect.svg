<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" aria-labelledby="title desc">
  <title id="title">The natural greenhouse effect</title>
  <desc id="desc">The Sun sends short-wave energy through the atmosphere to warm the Earth surface. The warm surface gives off infrared heat, greenhouse gases in the atmosphere absorb some of it and re-radiate it in all directions, and some heat escapes to space.</desc>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">The natural greenhouse effect</text>
  <circle cx="120" cy="110" r="30" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round"><line x1="120" y1="62" x2="120" y2="48"/><line x1="168" y1="110" x2="182" y2="110"/><line x1="72" y1="110" x2="58" y2="110"/><line x1="86" y1="76" x2="76" y2="66"/></g>
  <rect x="104.8" y="146.0" width="30.5" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="120" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b45309">Sun</text>
  <rect x="0" y="230" width="820" height="86" fill="#e0f2fe" opacity="0.75"/>
  <text x="28" y="250" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Atmosphere</text>
  <circle cx="300" cy="272" r="15" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="277" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">CO₂</text>
  <circle cx="360" cy="272" r="15" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="277" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">CH₄</text>
  <circle cx="420" cy="272" r="15" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="420" y="277" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">H₂O</text>
  <circle cx="480" cy="272" r="15" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="277" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">N₂O</text>
  <rect x="564.7" y="246.0" width="110.6" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="620" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0369a1">greenhouse gases</text>
  <path d="M 200 300 L 330 400" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 330 400 L 322 392 L 318 404 Z" fill="#f59e0b"/>
  <rect x="139.3" y="340.0" width="141.4" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="210" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b45309">incoming solar energy</text>
  <path d="M 640 300 L 700 150" stroke="#ef4444" stroke-width="3"/>
  <path d="M 700 150 L 690 158 L 700 166 Z" fill="#ef4444"/>
  <rect x="655.9" y="120.0" width="172.2" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="742" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">some heat escapes to space</text>
  <path d="M 380 400 L 330 330" stroke="#ef4444" stroke-width="3"/>
  <path d="M 330 330 L 332 342 L 342 336 Z" fill="#ef4444"/>
  <path d="M 452 330 L 520 402" stroke="#ef4444" stroke-width="3"/>
  <path d="M 520 402 L 514 391 L 508 400 Z" fill="#ef4444"/>
  <rect x="261.6" y="288.0" width="276.9" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">infrared heat given off by the warm surface</text>
  <path d="M 0 470 Q 410 372 820 470 L 820 540 L 0 540 Z" fill="#a3a380" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="360.3" y="411.0" width="99.4" height="20" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="410" y="424" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#334155">Earth surface</text>
  <rect x="60" y="480" width="700" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Without any greenhouse effect the average would be about -18 °C; with it, about 15 °C.</text>
</svg>
