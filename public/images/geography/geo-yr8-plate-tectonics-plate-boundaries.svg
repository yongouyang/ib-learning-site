<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">The three types of plate boundary</title>
  <desc id="desc">Three cross-section diagrams. At a constructive boundary the plates move apart and magma rises to form new crust. At a destructive boundary the denser oceanic plate sinks beneath the continental plate, creating a trench and explosive volcanoes. At a conservative boundary the plates slide past each other, producing earthquakes but no volcanoes.</desc>
  <rect x="0" y="0" width="940" height="520" fill="#f8fafc"/>
  <text x="470" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">How plates move decides what happens at the boundary</text>
  <rect x="40" y="62" width="260" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Constructive (divergent)</text>
  <rect x="340" y="62" width="260" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="470" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Destructive (convergent)</text>
  <rect x="640" y="62" width="260" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="770" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Conservative (transform)</text>
  <path d="M 60 300 L 155 300 L 155 210 L 60 210 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.5"/>
  <path d="M 225 300 L 300 300 L 300 210 L 225 210 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.5"/>
  <path d="M 155 300 L 155 246 L 190 216 L 225 246 L 225 300 Z" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M 130 258 L 104 258" stroke="#dc2626" stroke-width="2.5"/><path d="M 104 258 L 114 252 L 114 264 Z" fill="#dc2626"/>
  <path d="M 250 258 L 276 258" stroke="#dc2626" stroke-width="2.5"/><path d="M 276 258 L 266 252 L 266 264 Z" fill="#dc2626"/>
  <rect x="137.8" y="194.0" width="104.4" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="190" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">mid-ocean ridge</text>
  <rect x="116.2" y="314.0" width="147.5" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="190" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">magma rises, new crust</text>

  <path d="M 360 300 L 520 300 L 520 205 L 360 205 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.5"/>
  <path d="M 605 252 L 516 288 L 548 332 L 605 300 Z" fill="#a5b4fc" stroke="#4338ca" stroke-width="1.5"/>
  <path d="M 430 205 L 452 158 L 474 205 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M 452 158 L 448 146 L 456 146 Z" fill="#dc2626"/>
  <path d="M 596 262 L 546 282" stroke="#dc2626" stroke-width="2.5"/><path d="M 546 282 L 556 276 L 556 288 Z" fill="#dc2626"/>
  <path d="M 508 288 L 522 292" stroke="#0f172a" stroke-width="2"/>
  <rect x="393.6" y="130.0" width="116.7" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="452" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">explosive volcano</text>
  <rect x="501.5" y="224.0" width="129.0" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="566" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3730a3">oceanic plate sinks</text>
  <rect x="427.5" y="318.0" width="49.0" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="452" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0f172a">trench</text>
  <line x1="474" y1="322" x2="506" y2="298" stroke="#64748b" stroke-width="1.2"/>

  <path d="M 660 300 L 780 300 L 780 210 L 660 210 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.5"/>
  <path d="M 780 300 L 880 300 L 880 210 L 780 210 Z" fill="#e7e5e4" stroke="#78716c" stroke-width="1.5"/>
  <path d="M 700 255 L 700 200" stroke="#dc2626" stroke-width="2.5"/><path d="M 700 200 L 694 210 L 706 210 Z" fill="#dc2626"/>
  <path d="M 840 255 L 840 300" stroke="#dc2626" stroke-width="2.5"/><path d="M 840 300 L 834 290 L 846 290 Z" fill="#dc2626"/>
  <path d="M 780 300 L 780 210" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="677.8" y="314.0" width="184.5" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="770" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">plates slide past each other</text>
  <rect x="702.4" y="178.0" width="135.2" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="770" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">powerful earthquakes</text>
  <rect x="40" y="372" width="860" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="400" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">What each boundary makes</text>
  <text x="60" y="428" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Constructive: new crust, mid-ocean ridges, gently sloping volcanoes (Mid-Atlantic Ridge).</text>
  <text x="60" y="450" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Destructive: subduction, deep-sea trenches, explosive volcanoes, fold mountains (the Andes, the Himalayas).</text>
  <text x="60" y="472" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Conservative: no crust made or destroyed, no volcanoes, but powerful earthquakes (San Andreas Fault).</text>
</svg>
