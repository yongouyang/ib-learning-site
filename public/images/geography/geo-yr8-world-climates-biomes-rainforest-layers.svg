<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The four layers of a tropical rainforest</title>
  <desc id="desc">A forest cross-section with a height scale in metres. A few giant trees rise above a continuous leafy canopy, below which is a shaded under-canopy, and finally the dark forest floor where little grows and dead matter rots quickly.</desc>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">The four layers of a tropical rainforest</text>
  <line x1="120" y1="96" x2="120" y2="404" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="112" y1="404" x2="120" y2="404" stroke="#94a3b8" stroke-width="1"/>
  <text x="106" y="408" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">0</text>
  <line x1="112" y1="304" x2="120" y2="304" stroke="#94a3b8" stroke-width="1"/>
  <text x="106" y="308" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">20</text>
  <line x1="112" y1="204" x2="120" y2="204" stroke="#94a3b8" stroke-width="1"/>
  <text x="106" y="208" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">40</text>
  <line x1="112" y1="104" x2="120" y2="104" stroke="#94a3b8" stroke-width="1"/>
  <text x="106" y="108" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">60</text>
  <text x="96" y="78" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">m</text>
  <line x1="190" y1="404" x2="190" y2="126" stroke="#78350f" stroke-width="7"/>
  <circle cx="190" cy="112" r="30" fill="#15803d" opacity="0.9"/>
  <line x1="268" y1="404" x2="268" y2="142" stroke="#78350f" stroke-width="7"/>
  <circle cx="268" cy="128" r="30" fill="#15803d" opacity="0.9"/>
  <g fill="#16a34a" opacity="0.92">
    <circle cx="182" cy="214" r="30"/>
    <circle cx="226" cy="214" r="30"/>
    <circle cx="270" cy="214" r="30"/>
    <circle cx="314" cy="214" r="30"/>
    <circle cx="358" cy="214" r="30"/>
    <circle cx="402" cy="214" r="30"/>
    <circle cx="446" cy="214" r="30"/>
    <circle cx="490" cy="214" r="30"/>
  </g>
  <g fill="#166534" opacity="0.85">
    <circle cx="200" cy="248" r="24"/>
    <circle cx="252" cy="248" r="24"/>
    <circle cx="304" cy="248" r="24"/>
    <circle cx="356" cy="248" r="24"/>
    <circle cx="408" cy="248" r="24"/>
    <circle cx="460" cy="248" r="24"/>
  </g>
  <g fill="#4d7c0f" opacity="0.85">
    <ellipse cx="194" cy="330" rx="26" ry="18"/>
    <ellipse cx="252" cy="330" rx="26" ry="18"/>
    <ellipse cx="310" cy="330" rx="26" ry="18"/>
    <ellipse cx="368" cy="330" rx="26" ry="18"/>
    <ellipse cx="426" cy="330" rx="26" ry="18"/>
    <ellipse cx="484" cy="330" rx="26" ry="18"/>
  </g>
  <rect x="130" y="396" width="350" height="12" fill="#78350f"/>
  <g stroke="#a16207" stroke-width="2" stroke-linecap="round">
    <line x1="150" y1="392" x2="162" y2="386"/>
    <line x1="184" y1="392" x2="196" y2="386"/>
    <line x1="218" y1="392" x2="230" y2="386"/>
    <line x1="252" y1="392" x2="264" y2="386"/>
    <line x1="286" y1="392" x2="298" y2="386"/>
    <line x1="320" y1="392" x2="332" y2="386"/>
    <line x1="354" y1="392" x2="366" y2="386"/>
    <line x1="388" y1="392" x2="400" y2="386"/>
    <line x1="422" y1="392" x2="434" y2="386"/>
    <line x1="456" y1="392" x2="468" y2="386"/>
  </g>
  <line x1="500" y1="104" x2="560" y2="104" stroke="#64748b" stroke-width="1.2"/>
  <text x="570" y="108" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Emergent layer — a few giant trees to 60 m</text>
  <line x1="500" y1="214" x2="560" y2="214" stroke="#64748b" stroke-width="1.2"/>
  <text x="570" y="218" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Canopy — leafy roof 20–40 m, where most life is found</text>
  <line x1="500" y1="330" x2="560" y2="330" stroke="#64748b" stroke-width="1.2"/>
  <text x="570" y="334" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Under-canopy — shaded and humid</text>
  <line x1="500" y1="392" x2="560" y2="392" stroke="#64748b" stroke-width="1.2"/>
  <text x="570" y="396" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Forest floor — dark, dead matter rots fast</text>
  <rect x="120" y="432" width="660" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="456" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Rainforests cover about 6% of the land surface but hold over half of all plant and animal species.</text>
  <text x="450" y="476" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">The soil is poor: heavy rain leaches nutrients away, so almost all of them are locked up in living plants.</text>
</svg>
