<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Push factors, pull factors and the obstacles between them</title>
  <desc id="desc">Two columns of labelled boxes. On the left, push factors such as unemployment, war, drought and poor services drive people away. On the right, pull factors such as jobs, schools, safety and family attract people to a new place. A band in the middle lists the obstacles that make moving hard.</desc>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Every migration is a balance of pushes and pulls</text>
  <rect x="40" y="66" width="330" height="300" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
  <text x="205" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">Push factors</text>
  <text x="205" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">reasons that drive people away</text>
  <rect x="70" y="132" width="270" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="205" y="157" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d">unemployment and low wages</text>
  <rect x="70" y="184" width="270" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="205" y="209" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d">war and persecution</text>
  <rect x="70" y="236" width="270" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="205" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d">food shortages and drought</text>
  <rect x="70" y="288" width="270" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="205" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d">poor healthcare and education</text>
  <rect x="530" y="66" width="330" height="300" rx="10" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="695" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803d">Pull factors</text>
  <text x="695" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">reasons that draw people in</text>
  <rect x="560" y="132" width="270" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="695" y="157" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#14532d">job opportunities and higher wages</text>
  <rect x="560" y="184" width="270" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="695" y="209" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#14532d">better schools and hospitals</text>
  <rect x="560" y="236" width="270" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="695" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#14532d">safety and political freedom</text>
  <rect x="560" y="288" width="270" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="695" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#14532d">family already living there</text>
  <rect x="386" y="120" width="128" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Intervening</text>
  <text x="450" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155">obstacles</text>
  <text x="450" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">distance</text>
  <text x="450" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">and cost</text>
  <text x="450" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">visas and</text>
  <text x="450" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">borders</text>
  <text x="450" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">language</text>
  <path d="M 374 220 L 356 220" stroke="#dc2626" stroke-width="2.5"/><path d="M 356 220 L 366 214 L 366 226 Z" fill="#dc2626"/>
  <path d="M 526 220 L 544 220" stroke="#16a34a" stroke-width="2.5"/><path d="M 544 220 L 534 214 L 534 226 Z" fill="#16a34a"/>
  <rect x="40" y="386" width="820" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="412" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Migration is rarely about one factor alone — and the same factor can be a push or a pull depending on perspective.</text>
  <text x="450" y="438" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Low wages push workers out of one country and pull employers into it; a visa can stop the move completely.</text>
</svg>
