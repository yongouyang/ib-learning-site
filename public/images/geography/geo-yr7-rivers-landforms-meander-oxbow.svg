<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Three stages in the formation of an oxbow lake from a meander</title>
  <desc id="desc">Three river diagrams in sequence. First a meander bend forms. Then erosion on the outer bank narrows the neck between the two sides of the loop. Finally a flood cuts through the neck, leaving the old loop sealed off as a curved oxbow lake beside the straighter channel.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">How a meander becomes an oxbow lake</text>
  <rect x="60" y="64" width="220" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="64" width="220" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="600" y="64" width="220" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 80 230 C 110 150, 190 150, 215 230 C 235 295, 255 295, 262 240" fill="none" stroke="#0ea5e9" stroke-width="11" stroke-linecap="round"/>
  <circle cx="455" cy="190" r="52" fill="none" stroke="#0ea5e9" stroke-width="11"/>
  <line x1="350" y1="170" x2="407" y2="170" stroke="#0ea5e9" stroke-width="11" stroke-linecap="round"/>
  <line x1="350" y1="212" x2="408" y2="212" stroke="#0ea5e9" stroke-width="11" stroke-linecap="round"/>
  <path d="M 390 156 L 390 166" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 383 159 L 390 166 L 397 159" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 390 226 L 390 216" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 383 223 L 390 216 L 397 223" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 625 200 C 670 186, 720 186, 800 198" fill="none" stroke="#0ea5e9" stroke-width="11" stroke-linecap="round"/>
  <path d="M 660 268 C 700 296, 760 296, 790 262" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#64748b" stroke-width="1.5"><line x1="666" y1="276" x2="676" y2="284"/></g>
  <text x="170" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">1. A bend forms</text>
  <text x="440" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">2. Erosion narrows the neck</text>
  <text x="710" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">3. A flood cuts through</text>
  <rect x="60" y="366" width="760" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="396" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Two processes do the work</text>
  <line x1="80" y1="424" x2="110" y2="424" stroke="#0369a1" stroke-width="4"/>
  <text x="122" y="429" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#334155">Fast flow on the outside of the bend erodes the bank into a steep river cliff.</text>
  <line x1="80" y1="456" x2="110" y2="456" stroke="#38bdf8" stroke-width="4"/>
  <text x="122" y="461" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#334155">Slow flow on the inside deposits sediment, building a slip-off slope (point bar).</text>
</svg>
