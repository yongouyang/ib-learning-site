<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" role="img" aria-labelledby="title desc">
  <title id="title">The rise of the urban population and the growth of megacities</title>
  <desc id="desc">A line graph showing the share of the world population living in cities: about 3% in 1800, more than half by 2008, and approaching 60% today. Two callouts note that the number of megacities has grown from two in 1950 to more than thirty today, and that a megacity has over ten million inhabitants.</desc>
  <rect x="0" y="0" width="880" height="510" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">The world is becoming urban</text>
  <line x1="110" y1="380" x2="600" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="120" x2="110" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="104" y1="380" x2="110" y2="380" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="384" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">0</text>
  <line x1="104" y1="294" x2="110" y2="294" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="298" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">20</text>
  <line x1="104" y1="207" x2="110" y2="207" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="211" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">40</text>
  <line x1="104" y1="120" x2="110" y2="120" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="124" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">60</text>
  <text x="98" y="110" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">%</text>
  <text x="130" y="402" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">1800</text>
  <text x="360" y="402" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">1950</text>
  <text x="500" y="402" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">2008</text>
  <text x="580" y="402" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">today</text>
  <path d="M 130 367 C 300 340, 420 200, 500 156 C 530 143, 556 132, 580 124" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="130" cy="367" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="156" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="580" cy="124" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <rect x="133.7" y="340.0" width="68.6" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="168" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0369a1">about 3%</text>
  <rect x="445.3" y="128.0" width="109.5" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="500" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0369a1">more than half</text>
  <rect x="577.9" y="112.0" width="116.3" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="636" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0369a1">approaching 60%</text>
  <rect x="630" y="180" width="220" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="740" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Megacities</text>
  <text x="740" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">over 10 million people</text>
  <text x="740" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">1950: 2</text>
  <text x="740" y="292" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">today: more than 30</text>
  <text x="740" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">Tokyo ≈ 37 million</text>
  <text x="740" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Delhi · Shanghai · Dhaka</text>
  <text x="740" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Lagos · Bangkok (primate city)</text>
  <rect x="110" y="428" width="740" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="452" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Rich countries urbanised first and are now 70–90% urban. The fastest urbanisation today is in Africa and Asia.</text>
  <text x="480" y="474" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Towns and cities now hold approaching 60% of the world population, and the share keeps rising.</text>
</svg>
