<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">The three types of rainfall: relief, convectional and frontal</title>
  <desc id="desc">Three labelled diagrams. Relief rainfall: moist wind is forced up over hills, rain falls on the windward slope, and the leeward side is left as a dry rain shadow. Convectional rainfall: the Sun heats the ground, warm air rises and a towering cloud gives heavy afternoon rain. Frontal rainfall: warm air rises up over denser cold air at a front, producing a broad band of steady rain.</desc>
  <rect x="0" y="0" width="920" height="520" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">All three happen because air rises, cools and condenses</text>
  <rect x="40" y="62" width="240" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Relief rainfall</text>
  <rect x="340" y="62" width="240" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Convectional rainfall</text>
  <rect x="640" y="62" width="240" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="760" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Frontal rainfall</text>
  <path d="M 100 300 L 150 190 L 200 300 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M 62 232 L 106 214" stroke="#0ea5e9" stroke-width="2.5"/>
  <path d="M 106 214 L 112 232" stroke="#94a3b8" stroke-width="2"/>
  <rect x="55.2" y="194.0" width="73.6" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="92" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">moist wind</text>
  <g stroke="#2563eb" stroke-width="2"><line x1="128" y1="228" x2="122" y2="246"/><line x1="142" y1="222" x2="136" y2="240"/><line x1="156" y1="220" x2="150" y2="238"/></g>
  <rect x="113.7" y="252.0" width="36.6" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="132" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">rain</text>
  <g stroke="#b45309" stroke-width="2" stroke-linecap="round"><line x1="212" y1="252" x2="212" y2="264"/><line x1="222" y1="258" x2="222" y2="270"/></g>
  <rect x="176.1" y="274.0" width="79.8" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="216" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b45309">rain shadow</text>
  <circle cx="378" cy="120" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"><line x1="378" y1="94" x2="378" y2="86"/><line x1="402" y1="120" x2="410" y2="120"/><line x1="354" y1="120" x2="346" y2="120"/></g>
  <path d="M 404 320 C 404 250, 424 214, 444 200 C 472 180, 500 200, 498 224 C 518 228, 520 256, 504 264" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <g stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"><line x1="424" y1="298" x2="424" y2="252"/><line x1="470" y1="298" x2="470" y2="244"/></g>
  <path d="M 424 246 L 419 256 L 429 256 Z" fill="#ef4444"/><path d="M 470 238 L 465 248 L 475 248 Z" fill="#ef4444"/>
  <g stroke="#2563eb" stroke-width="2"><line x1="452" y1="272" x2="446" y2="300"/><line x1="466" y1="272" x2="460" y2="300"/><line x1="480" y1="272" x2="474" y2="300"/></g>
  <rect x="393.2" y="324.0" width="73.6" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="430" y="336" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b45309">hot ground</text>
  <rect x="454.4" y="220.0" width="135.2" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="522" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1d4ed8">heavy afternoon rain</text>
  <path d="M 660 300 L 860 300 L 860 268 L 700 268 Z" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M 700 268 L 860 268 L 860 152 Z" fill="#fecaca" stroke="#f87171" stroke-width="1.5" opacity="0.85"/>
  <path d="M 712 258 L 830 168" stroke="#ef4444" stroke-width="2.5"/>
  <path d="M 826 174 L 818 170 L 822 180 Z" fill="#ef4444"/>
  <rect x="657.4" y="228.0" width="61.3" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="688" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">warm air</text>
  <rect x="669.4" y="310.0" width="61.3" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="700" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3730a3">cold air</text>
  <g stroke="#2563eb" stroke-width="2"><line x1="770" y1="206" x2="764" y2="226"/><line x1="790" y1="192" x2="784" y2="212"/><line x1="810" y1="180" x2="804" y2="200"/></g>
  <rect x="776.1" y="152.0" width="79.8" height="19.0" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="816" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1d4ed8">steady rain</text>
  <rect x="40" y="386" width="840" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="416" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">The same sequence every time</text>
  <text x="460" y="448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">Air is forced to rise  →  it cools  →  water vapour condenses  →  rain falls</text>
  <text x="460" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Relief rises over hills  ·  convectional rises over hot ground  ·  frontal rises over cold air</text>
</svg>
