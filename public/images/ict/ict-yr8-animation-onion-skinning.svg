<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Onion skinning over a stop-frame camera view</title>
  <desc id="desc">A camera frame containing three faint ghost positions of a ball and the live position, each a small even step apart. A checklist asks whether the distance moved matches the previous frame, whether parts that should not move have stayed still, and whether the set has been nudged.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Onion skinning: see the last frame while you shoot the next</text>
  <rect x="60" y="88" width="470" height="268" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="295" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#475569">live camera view</text>
  <circle cx="150" cy="330" r="21" fill="#6366f1" opacity="0.18"/>
  <circle cx="212" cy="300" r="21" fill="#6366f1" opacity="0.32"/>
  <circle cx="274" cy="270" r="21" fill="#6366f1" opacity="0.5"/>
  <circle cx="336" cy="240" r="21" fill="#6366f1"/>
  <text x="336" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">now</text>
  <line x1="150" y1="412" x2="212" y2="412" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="212" y1="412" x2="274" y2="412" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="274" y1="412" x2="336" y2="412" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="255" y="428" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">equal steps</text>
  <rect x="570" y="84" width="270" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="584" y="108" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#334155">Has the ball moved the same distance?</text>
  <text x="584" y="128" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6366f1">even steps, not jumps</text>
  <rect x="570" y="170" width="270" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="584" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#334155">Has anything moved that should not have?</text>
  <text x="584" y="214" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6366f1">a head drifting when only an arm should</text>
  <rect x="570" y="256" width="270" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="584" y="280" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#334155">Has the whole set been nudged?</text>
  <text x="584" y="300" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6366f1">camera locked, positions marked with tape</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">One bad frame — a hand in shot, a bumped prop — flashes visibly at playback speed, so delete it and retake.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Keep the camera locked, review the last few frames often, and the motion will stay smooth.</text>
  <rect x="570" y="314" width="270" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="584" y="342" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">The faint ghosts are the frames</text>
  <text x="584" y="364" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">you have already shot, drawn over</text>
  <text x="584" y="386" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the live view. Match their spacing.</text>
</svg>
