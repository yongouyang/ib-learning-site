<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">How a machine learning model is trained and used</title>
  <desc id="desc">Labelled examples flow into a training process that adjusts the model settings, producing a model that predicts on new unseen examples; the new examples can feed back as more training data. Warnings note that poor data produces poor predictions and that a model which only works on its training data has overfitted.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M 0 0 L 7 3 L 0 6 z" fill="#64748b"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Data, training, model — then predictions on new examples</text>
  <rect x="40" y="100" width="220" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="150" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">Training data</text>
  <text x="150" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">thousands of example emails</text>
  <text x="150" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">already labelled</text>
  <rect x="60" y="190" width="180" height="26" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="150" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1e3a8a">prize → spam</text>
  <rect x="60" y="224" width="180" height="26" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="150" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1e3a8a">meeting → not spam</text>
  <rect x="60" y="258" width="180" height="26" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="150" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1e3a8a">offer → spam</text>
  <line x1="266" y1="200" x2="340" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="346" y="140" width="190" height="120" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="1.8"/>
  <text x="441" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#4338ca">Training</text>
  <text x="441" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">the algorithm adjusts the</text>
  <text x="441" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">model’s internal settings</text>
  <text x="441" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">over and over</text>
  <line x1="542" y1="200" x2="616" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="622" y="140" width="218" height="120" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  <text x="731" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#14532d">Model</text>
  <text x="731" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">the learned patterns,</text>
  <text x="731" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">stored as numbers</text>
  <text x="731" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#14532d">spam? not spam?</text>
  <path d="M 731 268 Q 731 320 500 320 Q 300 320 150 320 Q 60 320 60 306" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#475569">new, unseen examples — and a good model generalises to them</text>
  <rect x="60" y="368" width="340" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="230" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">Garbage in, garbage out.</text>
  <rect x="480" y="368" width="340" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="650" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">Overfitted = memorised past papers</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Quality beats quantity: a model trained on messy, wrong or one-sided data learns messy, one-sided patterns.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Training is not memorising — the test of a model is how it handles examples it never saw while training.</text>
</svg>
