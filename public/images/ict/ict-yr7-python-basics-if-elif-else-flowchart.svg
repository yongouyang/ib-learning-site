<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A flowchart of if, elif and else</title>
  <desc id="desc">A program flow starts with a score of 78, then tests whether the score is at least 70; if so it prints Distinction, otherwise it tests whether the score is at least 50 and prints Pass, otherwise it prints Try again. Only the first true branch runs.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M 0 0 L 7 3 L 0 6 z" fill="#64748b"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Only the first true branch runs</text>
  <rect x="110" y="92" width="220" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="220.0" y="119.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">score = 78</text>
  <line x1="220" y1="136" x2="220" y2="158" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <polygon points="220,158.0 330.0,196 220,234.0 110.0,196" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="220" y="201" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12">score &gt;= 70?</text>
  <line x1="330" y1="196" x2="474" y2="196" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="474" y="174" width="220" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  <text x="584.0" y="201.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">print("Distinction")</text>
  <line x1="220" y1="234" x2="220" y2="256" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="196" y="250" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">no</text>
  <polygon points="220,256.0 330.0,294 220,332.0 110.0,294" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="220" y="299" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12">score &gt;= 50?</text>
  <line x1="330" y1="294" x2="474" y2="294" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="474" y="272" width="220" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  <text x="584.0" y="299.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">print("Pass")</text>
  <line x1="220" y1="332" x2="220" y2="354" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="196" y="348" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">no</text>
  <rect x="110" y="358" width="220" height="44" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="220.0" y="385.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">print("Try again")</text>
  <rect x="240.8" y="138.0" width="34.5" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="258" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#15803d">yes</text>
  <rect x="240.8" y="236.0" width="34.5" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="258" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#15803d">yes</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Each condition uses comparison operators:   ==   !=   &lt;   &gt;   &lt;=   &gt;=</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Indent the body of every branch — Python enforces it — and test the most specific condition first.</text>
</svg>
