<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The rule of thirds applied to framing</title>
  <desc id="desc">A camera frame divided by two horizontal and two vertical lines into nine boxes. The subject stands on the left vertical third with their eyes on the upper horizontal third and looking room to the right. Notes cover headroom, background clutter and level horizons.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Place the subject on a third, not in the middle</text>
  <rect x="60" y="88" width="460" height="268" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <line x1="213" y1="88" x2="213" y2="356" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="60" y1="177" x2="520" y2="177" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="367" y1="88" x2="367" y2="356" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="60" y1="267" x2="520" y2="267" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <circle cx="213" cy="177" r="26" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <path d="M 128 352 C 146 262 176 203 213 203 C 250 203 280 262 298 352" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <circle cx="204" cy="171" r="3" fill="#4338ca"/><circle cx="222" cy="171" r="3" fill="#4338ca"/>
  <rect x="127.9" y="217.3" width="170.9" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="213.33333333333334" y="229.33333333333331" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#4338ca">eyes on the upper third</text>
  <rect x="254.7" y="123.3" width="157.2" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="333.33333333333337" y="135.33333333333331" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#15803d">looking room in front</text>
  <text x="60" y="382" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Headroom above the head, looking room in front of the face — not behind it.</text>
  <text x="60" y="404" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Check the background: clutter, and lampposts growing out of heads.</text>
  <rect x="570" y="84" width="270" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="584" y="108" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">Centred framing</text>
  <text x="584" y="130" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">feels static and dull</text>
  <rect x="570" y="170" width="270" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="584" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">Natural frames</text>
  <text x="584" y="216" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">doorways and windows draw the eye</text>
  <rect x="570" y="256" width="270" height="68" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="584" y="280" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">Break it on purpose</text>
  <text x="584" y="302" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">know the rule first, then choose</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Review the framing on the screen before you press record, not after the scene has finished.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Seat interview subjects so they look across the frame towards the interviewer beside the camera.</text>
  <rect x="392" y="257" width="112" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="448" y="269" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">keep the horizon level</text>
</svg>
