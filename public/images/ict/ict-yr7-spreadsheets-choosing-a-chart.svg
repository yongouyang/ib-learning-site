<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Four chart types and the question each one answers</title>
  <desc id="desc">Four panels: a bar chart compares amounts across separate categories, a line chart shows change over time, a pie chart shows parts of a whole, and a scatter graph reveals a relationship between two variables.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Pick the chart that answers your question</text>
  <rect x="60" y="72" width="360" height="172" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="96" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca">Bar or column</text>
  <text x="76" y="118" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">Compare amounts across separate categories</text>
  <rect x="308" y="170" width="16" height="26" rx="3" fill="#6366f1"/>
  <rect x="332" y="152" width="16" height="44" rx="3" fill="#6366f1"/>
  <rect x="356" y="162" width="16" height="34" rx="3" fill="#6366f1"/>
  <rect x="380" y="138" width="16" height="58" rx="3" fill="#6366f1"/>
  <text x="76" y="212" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· favourite sports of a class</text>
  <text x="76" y="232" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· rainfall in different cities</text>
  <rect x="460" y="72" width="360" height="172" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="476" y="96" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca">Line</text>
  <text x="476" y="118" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">Show how one quantity changes over time</text>
  <polyline points="708,184 732,170 756,176 780,152 804,140" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <circle cx="708" cy="184" r="3.5" fill="#6366f1"/>
  <circle cx="732" cy="170" r="3.5" fill="#6366f1"/>
  <circle cx="756" cy="176" r="3.5" fill="#6366f1"/>
  <circle cx="780" cy="152" r="3.5" fill="#6366f1"/>
  <circle cx="804" cy="140" r="3.5" fill="#6366f1"/>
  <text x="476" y="212" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· temperature across a week</text>
  <text x="476" y="232" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· savings month by month</text>
  <rect x="60" y="260" width="360" height="172" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="284" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca">Pie</text>
  <text x="76" y="306" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">Show parts of a whole that add to 100%</text>
  <circle cx="352" cy="354" r="34" fill="#6366f1"/>
  <path d="M 352 354 L 352 320 A 34 34 0 0 1 382 371 Z" fill="#a5b4fc"/>
  <text x="76" y="400" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· a handful of categories only</text>
  <text x="76" y="420" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· ten slices become unreadable</text>
  <rect x="460" y="260" width="360" height="172" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="476" y="284" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca">Scatter</text>
  <text x="476" y="306" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">Reveal a relationship between two variables</text>
  <circle cx="720" cy="376" r="3.5" fill="#6366f1"/>
  <circle cx="728" cy="370" r="3.5" fill="#6366f1"/>
  <circle cx="736" cy="370" r="3.5" fill="#6366f1"/>
  <circle cx="744" cy="360" r="3.5" fill="#6366f1"/>
  <circle cx="752" cy="360" r="3.5" fill="#6366f1"/>
  <circle cx="760" cy="354" r="3.5" fill="#6366f1"/>
  <circle cx="768" cy="346" r="3.5" fill="#6366f1"/>
  <circle cx="776" cy="346" r="3.5" fill="#6366f1"/>
  <circle cx="784" cy="337" r="3.5" fill="#6366f1"/>
  <circle cx="792" cy="336" r="3.5" fill="#6366f1"/>
  <circle cx="800" cy="328" r="3.5" fill="#6366f1"/>
  <text x="476" y="400" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· height against arm span</text>
  <text x="476" y="420" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">· does one rise with the other?</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Every chart needs a clear title and labelled axes so the reader knows what they are looking at.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Watch for misleading charts: a truncated value axis exaggerates small differences, and 3-D effects distort sizes.</text>
</svg>
