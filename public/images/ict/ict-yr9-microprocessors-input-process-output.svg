<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The input, process, output model for a thermostat</title>
  <desc id="desc">Three columns: inputs such as a temperature sensor and a keypad feed a microcontroller that compares the reading with the target, and outputs turn on a heater or a fan. A loop arrow shows the cycle repeating, and a microwave oven is given as a second example.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M 0 0 L 7 3 L 0 6 z" fill="#64748b"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Input, process, output — and most systems loop</text>
  <rect x="60" y="96" width="180" height="300" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="96" width="180" height="46" rx="10" fill="#dbeafe"/>
  <text x="150" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Input</text>
  <text x="150" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#64748b">data entering from the world</text>
  <text x="74" y="196" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· keypad buttons</text>
  <text x="74" y="246" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· door switch</text>
  <text x="74" y="296" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· temperature sensor</text>
  <text x="74" y="346" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· light sensor</text>
  <rect x="350" y="96" width="180" height="300" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="350" y="96" width="180" height="46" rx="10" fill="#ede9fe"/>
  <text x="440" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6366f1">Process</text>
  <text x="440" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#64748b">the program decides and calculates</text>
  <text x="364" y="196" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· the control chip runs a program</text>
  <text x="364" y="246" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· compare with the target</text>
  <text x="364" y="296" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· if temperature > 30°C, then…</text>
  <rect x="640" y="96" width="180" height="300" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <rect x="640" y="96" width="180" height="46" rx="10" fill="#dcfce7"/>
  <text x="730" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#22c55e">Output</text>
  <text x="730" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#64748b">the result delivered back</text>
  <text x="654" y="196" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· display</text>
  <text x="654" y="246" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· motor spinning</text>
  <text x="654" y="296" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· LED lighting</text>
  <text x="654" y="346" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#334155">· buzzer sounding</text>
  <line x1="246" y1="240" x2="344" y2="240" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="536" y1="240" x2="634" y2="240" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="295" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">data</text>
  <text x="585" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">drives</text>
  <path d="M 820 396 Q 820 444 440 444 Q 60 444 60 396" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <rect x="251" y="415" width="378" height="19" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="440" y="427" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">the loop repeats: sense, decide, act — over and over</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">A microwave oven is the same model: the keypad and door switch are inputs, the control chip processes time and power,</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">and the magnetron, turntable motor and display are outputs. Plan the inputs, the rules and the outputs before any code.</text>
</svg>
