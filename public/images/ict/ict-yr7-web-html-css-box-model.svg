<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The CSS box model as four nested layers</title>
  <desc id="desc">Four nested rectangles: the innermost is the content, surrounded by padding, then the border, then the transparent margin that pushes neighbouring boxes away. A caption shows that a 100 pixel content box with 10 pixel padding and a 2 pixel border occupies 124 pixels across.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Every element is a box, from the inside out</text>
  <rect x="90" y="100" width="420" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="140" y="140" width="320" height="220" rx="8" fill="none" stroke="#0f172a" stroke-width="3"/>
  <rect x="166" y="166" width="268" height="168" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="196" y="196" width="208" height="108" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">content</text>
  <text x="300" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">the text or image itself</text>
  <line x1="560" y1="116" x2="512" y2="116" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="568" y="116" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4338ca">margin</text>
  <text x="568" y="136" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">transparent space outside the border</text>
  <line x1="560" y1="200" x2="462" y2="200" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="568" y="200" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4338ca">border</text>
  <text x="568" y="220" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">border: 2px solid black — thickness, style, colour</text>
  <line x1="560" y1="284" x2="436" y2="284" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="568" y="284" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4338ca">padding</text>
  <text x="568" y="304" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">space between content and border — cushioning</text>
  <line x1="560" y1="248" x2="406" y2="248" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="568" y="252" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4338ca">content</text>
  <text x="568" y="272" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">the text or image itself</text>
  <rect x="272.5" y="124.0" width="54.9" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="300" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">margin</text>
  <rect x="272.5" y="164.0" width="54.9" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="300" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0f172a">border</text>
  <rect x="161.1" y="415.5" width="277.8" height="19.5" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="300" y="428" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#4338ca">100 + 10 + 10 + 2 + 2 = 124 px across</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Padding grows the box from within; margin pushes other elements away — the pair beginners mix up.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Browser developer tools show this exact diagram for any element on any website.</text>
</svg>
