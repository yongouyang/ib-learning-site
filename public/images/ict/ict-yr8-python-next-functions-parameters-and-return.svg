<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A function as a machine that takes arguments and returns a value</title>
  <desc id="desc">A box labelled square with parameter n and body return n times n. An argument of 5 enters from the left, a 25 is returned on the right, and a panel below contrasts print, which displays a value for a human, with return, which hands the value back to the program.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M 0 0 L 7 3 L 0 6 z" fill="#64748b"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">A function takes arguments and returns a value</text>
  <rect x="109.5" y="225.0" width="81.0" height="20" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="150" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#4338ca">square(5)</text>
  <line x1="196" y1="234" x2="306" y2="234" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="250" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">argument</text>
  <rect x="310" y="160" width="260" height="148" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="440" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1e293b">def square(n):</text>
  <text x="440" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#4338ca">    return n * n</text>
  <text x="440" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">n is a parameter: a placeholder</text>
  <text x="440" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">that any value can fill</text>
  <line x1="574" y1="234" x2="684" y2="234" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="715.6" y="225.0" width="28.9" height="20" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="730" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#15803d">25</text>
  <text x="730" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">returned</text>
  <rect x="310" y="330" width="260" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="357" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">answer = square(5)   →   25</text>
  <rect x="60" y="300" width="220" height="110" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="170" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">print()</text>
  <text x="170" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">shows a value to a human</text>
  <text x="170" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">on the screen, then forgets it</text>
  <rect x="600" y="300" width="220" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="710" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#14532d">return</text>
  <text x="710" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">hands the value back so the</text>
  <text x="710" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#475569">program can keep using it</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Code inside a function runs when the function is called, not when it is defined — DRY: do not repeat yourself.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Name functions with verbs that say what they do: calculate_total, get_valid_input.</text>
</svg>
