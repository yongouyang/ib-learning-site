<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">How layers stack in an image editor</title>
  <desc id="desc">Four offset sheets represent image layers: a background photo at the bottom, then a cut-out object, a shadow and text above it. The layer panel on the right lists the same stack with an opacity slider, and a note explains that flattening is permanent.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Image layers: separate sheets you can move, hide or delete</text>
  <rect x="70" y="110" width="270" height="180" rx="8" fill="#93c5fd" stroke="#ffffff" stroke-width="2"/>
  <text x="86" y="136" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0f172a">Background photo</text>
  <rect x="96" y="144" width="270" height="180" rx="8" fill="#fca5a5" stroke="#ffffff" stroke-width="2"/>
  <text x="112" y="170" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0f172a">Cut-out object</text>
  <rect x="122" y="178" width="270" height="180" rx="8" fill="#c4b5fd" stroke="#ffffff" stroke-width="2"/>
  <text x="138" y="204" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0f172a">Shadow (60% opacity)</text>
  <rect x="148" y="212" width="270" height="180" rx="8" fill="#fcd34d" stroke="#ffffff" stroke-width="2"/>
  <text x="164" y="238" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#0f172a">Text</text>
  <rect x="70" y="110" width="270" height="180" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="41.2" y="92.0" width="177.7" height="19" rx="4" fill="#ffffff" opacity="0.93"/>
  <text x="130" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#334155">top sheet hides the rest</text>
  <rect x="430" y="96" width="400" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="448" y="122" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Layers</text>
  <rect x="448" y="126" width="364" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="466" cy="142" r="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="482" y="146" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">4   Text</text>
  <rect x="448" y="166" width="364" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="466" cy="182" r="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="482" y="186" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">3   Shadow</text>
  <rect x="448" y="206" width="364" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="466" cy="222" r="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="482" y="226" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">2   Cut-out object</text>
  <rect x="448" y="246" width="364" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="466" cy="262" r="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="482" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">1   Background photo</text>
  <text x="448" y="324" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#334155">Opacity</text>
  <rect x="510" y="314" width="270" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="510" y="314" width="160" height="10" rx="5" fill="#6366f1"/>
  <circle cx="670" cy="319" r="7" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="448" y="352" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#b91c1c">Flattening merges everything into one layer —</text>
  <text x="448" y="372" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#b91c1c">it can never be separated again, so export last.</text>
  <rect x="40" y="398" width="800" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="424" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Each sheet can be edited, moved, hidden or deleted without touching the others.</text>
  <text x="440" y="446" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Lowering opacity blends a layer with what is underneath — useful for ghosted backgrounds and shadows.</text>
  <text x="440" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">Keep the layered project file while you work; flatten only when you export.</text>
  <text x="440" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#64748b">View the layers panel to reorder the stack — the top sheet hides what is beneath it.</text>
</svg>
