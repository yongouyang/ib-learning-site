<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Steps in the persecution of Jewish Germans, 1933 to 1939</title>
  <desc id="desc">A timeline with four stops: the April 1933 boycott of Jewish shops and professions, the 1935 Nuremberg Laws removing citizenship, Kristallnacht in November 1938, and the flight of around three hundred thousand Jews from Germany and Austria by 1939.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">Persecution was deliberate and step by step</text>
  <line x1="70" y1="150" x2="810" y2="150" stroke="#8b7a60" stroke-width="2.5"/>
  <circle cx="160" cy="150" r="9" fill="#b91c1c"/>
  <text x="160" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#78350f">April 1933</text>
  <rect x="72" y="176" width="176" height="132" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="160" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">Boycott of Jewish shops</text>
  <text x="160" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">and doctors’ and lawyers’</text>
  <text x="160" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">offices; dismissal from the</text>
  <text x="160" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">civil service</text>
  <circle cx="350" cy="150" r="9" fill="#b91c1c"/>
  <text x="350" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#78350f">1935</text>
  <rect x="262" y="176" width="176" height="132" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="350" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">Nuremberg Laws:</text>
  <text x="350" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">citizenship removed,</text>
  <text x="350" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">marriage banned,</text>
  <text x="350" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">‘Jewish’ defined by ancestry</text>
  <circle cx="540" cy="150" r="9" fill="#b91c1c"/>
  <text x="540" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#78350f">November 1938</text>
  <rect x="452" y="176" width="176" height="132" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="540" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">Kristallnacht: synagogues</text>
  <text x="540" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">burned, windows smashed,</text>
  <text x="540" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">about 100 killed,</text>
  <text x="540" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">30,000 men sent to camps</text>
  <circle cx="730" cy="150" r="9" fill="#b91c1c"/>
  <text x="730" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#78350f">1933–1939</text>
  <rect x="642" y="176" width="176" height="132" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="730" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">About 300,000 Jews fled</text>
  <text x="730" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">Germany and Austria,</text>
  <text x="730" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">including Anne Frank’s</text>
  <text x="730" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">family, to Amsterdam</text>
  <rect x="70" y="330" width="760" height="74" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Daily life became a maze of exclusions — from parks, swimming pools, universities and professions.</text>
  <text x="440" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">After Kristallnacht the Jewish community was forced to pay for the damage the regime had caused.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">By 1939 Jewish Germans had been stripped of their rights, their property and their dignity.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Who counted as Jewish was defined by ancestry, not by belief or by how people lived.</text>
</svg>
