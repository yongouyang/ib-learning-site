<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The D-Day landings and the defeat of Germany</title>
  <desc id="desc">Britain and the decoy target of Calais above the Channel, then the Normandy coast with the five landing beaches from Utah in the west to Sword in the east. A timeline underneath runs from 6 June 1944 to unconditional surrender on 7 and 8 May 1945.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hd" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#78350f"/></marker><marker id="hb" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#1d4ed8"/></marker><marker id="hr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#b91c1c"/></marker><marker id="hg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#15803d"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">D-Day, 6 June 1944: Operation Overlord</text>
  <rect x="70" y="72" width="220" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="180" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">BRITAIN</text>
  <text x="180" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#1d4ed8">the Allies assemble</text>
  <rect x="610" y="72" width="200" height="58" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="710" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">Calais</text>
  <text x="710" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#b91c1c">the expected target</text>
  <path d="M 240 120 C 380 148, 500 140, 606 118" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#hr)"/>
  <text x="430" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">a deception campaign convinced Hitler the attack would come at Calais</text>
  <rect x="70" y="170" width="740" height="86" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="440" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0369a1">the English Channel</text>
  <rect x="70" y="256" width="740" height="34" fill="#fde68a"/>
  <line x1="165" y1="238" x2="165" y2="266" stroke="#78350f" stroke-width="2.2" marker-end="url(#hd)"/>
  <rect x="110" y="290" width="112" height="42" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="166" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Utah</text>
  <text x="166" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">American</text>
  <line x1="315" y1="238" x2="315" y2="266" stroke="#78350f" stroke-width="2.2" marker-end="url(#hd)"/>
  <rect x="260" y="290" width="112" height="42" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="316" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Omaha</text>
  <text x="316" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">American</text>
  <line x1="465" y1="238" x2="465" y2="266" stroke="#78350f" stroke-width="2.2" marker-end="url(#hd)"/>
  <rect x="410" y="290" width="112" height="42" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="466" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Gold</text>
  <text x="466" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">British</text>
  <line x1="615" y1="238" x2="615" y2="266" stroke="#78350f" stroke-width="2.2" marker-end="url(#hd)"/>
  <rect x="560" y="290" width="112" height="42" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="616" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Juno</text>
  <text x="616" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">Canadian</text>
  <line x1="765" y1="238" x2="765" y2="266" stroke="#78350f" stroke-width="2.2" marker-end="url(#hd)"/>
  <rect x="710" y="290" width="112" height="42" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="766" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Sword</text>
  <text x="766" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">British</text>
  <text x="440" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#78350f">NORMANDY — about 156,000 Allied troops landed by sea and air</text>
  <line x1="90" y1="372" x2="800" y2="372" stroke="#8b7a60" stroke-width="2"/>
  <circle cx="100" cy="372" r="7" fill="#78350f"/>
  <text x="100" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">6 June 1944</text>
  <text x="100" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#3f2d1c">the landings</text>
  <circle cx="272" cy="372" r="7" fill="#78350f"/>
  <text x="272" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">August 1944</text>
  <text x="272" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#3f2d1c">Paris liberated</text>
  <circle cx="444" cy="372" r="7" fill="#78350f"/>
  <text x="444" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">December 1944</text>
  <text x="444" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#3f2d1c">the Battle of the Bulge fails</text>
  <circle cx="616" cy="372" r="7" fill="#78350f"/>
  <text x="616" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">30 April 1945</text>
  <text x="616" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#3f2d1c">Hitler takes his own life</text>
  <circle cx="788" cy="372" r="7" fill="#78350f"/>
  <text x="788" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">7–8 May 1945</text>
  <text x="788" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#3f2d1c">VE Day: unconditional surrender</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Hard fighting followed the landings — British and Canadian troops at Caen, American troops at Cherbourg — before the breakout.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">In 1945 the Allies crossed the Rhine from the west while the Red Army closed on Berlin from the east. The war in Asia continued.</text>
</svg>
