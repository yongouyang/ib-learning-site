<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Six problems facing Tsarist Russia in 1900</title>
  <desc id="desc">Six panels describe the autocracy, inequality, the peasants, industrial workers, the non-Russian nationalities and the spread of revolutionary ideas. Together they show a regime that looked strong but was cracking underneath.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">Tsarist Russia in 1900: strong on the surface</text>
  <rect x="60" y="70" width="760" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="440" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#78350f">Tsar Nicholas II — an autocrat; the Romanov dynasty had held absolute power for nearly 300 years</text>
  <rect x="60" y="126" width="240" height="118" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="180" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Autocracy</text>
  <line x1="110" y1="162" x2="250" y2="162" stroke="#e7d3c0" stroke-width="1.5"/>
  <text x="180" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">no elected parliament with real authority</text>
  <text x="180" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">and no free press; the Okhrana secret</text>
  <text x="180" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">police hunted critics</text>
  <rect x="316" y="126" width="240" height="118" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="436" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Inequality</text>
  <line x1="366" y1="162" x2="506" y2="162" stroke="#e7d3c0" stroke-width="1.5"/>
  <text x="436" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">the Tsar, aristocrats and the Orthodox</text>
  <text x="436" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">Church owned much of the land and wealth</text>
  <rect x="572" y="126" width="240" height="118" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="692" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Peasants</text>
  <line x1="622" y1="162" x2="762" y2="162" stroke="#e7d3c0" stroke-width="1.5"/>
  <text x="692" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">about 80% of Russians were peasants, many</text>
  <text x="692" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">freed from serfdom only in 1861, living</text>
  <text x="692" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">close to starvation</text>
  <rect x="60" y="260" width="240" height="118" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="180" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Industrial workers</text>
  <line x1="110" y1="296" x2="250" y2="296" stroke="#e7d3c0" stroke-width="1.5"/>
  <text x="180" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">long hours, low wages and crowded, filthy</text>
  <text x="180" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">housing; trade unions were banned</text>
  <rect x="316" y="260" width="240" height="118" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="436" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Nationalities</text>
  <line x1="366" y1="296" x2="506" y2="296" stroke="#e7d3c0" stroke-width="1.5"/>
  <text x="436" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">Poles, Finns and Ukrainians resented</text>
  <text x="436" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">forced Russification</text>
  <rect x="572" y="260" width="240" height="118" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="692" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Revolutionary ideas</text>
  <line x1="622" y1="296" x2="762" y2="296" stroke="#e7d3c0" stroke-width="1.5"/>
  <text x="692" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">liberals wanted a constitutional monarchy;</text>
  <text x="692" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">Marxists wanted to overthrow the whole</text>
  <text x="692" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b4a35">system</text>
  <rect x="60" y="394" width="760" height="30" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="414" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#7f1d1d">The regime looked strong, but beneath the surface it was cracking.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Russia was a vast empire ruling many peoples, and reform had not kept pace with a rapidly changing society.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Revolutionary ideas spread in the cities, while the countryside remained desperately poor.</text>
</svg>
