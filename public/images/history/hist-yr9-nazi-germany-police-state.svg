<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The Nazi police state: terror, informers and camps</title>
  <desc id="desc">Hitler at the top, then Himmler and the SS, then four branches: the Gestapo, the network of informers, the concentration camps that began at Dachau in March 1933, and the courts brought under Nazi control so that the terror appeared legal.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hd" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#78350f"/></marker><marker id="hb" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#1d4ed8"/></marker><marker id="hr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#b91c1c"/></marker><marker id="hg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#15803d"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">The police state: controlled by fear</text>
  <rect x="350" y="72" width="180" height="42" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="440" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#78350f">Hitler</text>
  <line x1="440" y1="114" x2="440" y2="128" stroke="#78350f" stroke-width="2" marker-end="url(#hd)"/>
  <rect x="270" y="128" width="340" height="62" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="1.8"/>
  <text x="440" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3730a3">Heinrich Himmler and the SS</text>
  <text x="440" y="171" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">grew from Hitler’s bodyguard into the organisation</text>
  <text x="440" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">running terror and the camps</text>
  <line x1="90" y1="204" x2="790" y2="204" stroke="#8b7a60" stroke-width="1.8"/>
  <line x1="440" y1="193" x2="440" y2="204" stroke="#78350f" stroke-width="2" marker-end="url(#hd)"/>
  <line x1="148" y1="204" x2="148" y2="226" stroke="#8b7a60" stroke-width="1.5"/>
  <rect x="60" y="226" width="176" height="124" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="148" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Gestapo</text>
  <text x="148" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">secret state police: arrest</text>
  <text x="148" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">without trial, tapped</text>
  <text x="148" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">telephones, opened letters</text>
  <line x1="344" y1="204" x2="344" y2="226" stroke="#8b7a60" stroke-width="1.5"/>
  <rect x="256" y="226" width="176" height="124" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="344" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Informers</text>
  <text x="344" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">neighbours, colleagues and</text>
  <text x="344" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">even children denounced each</text>
  <text x="344" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">other</text>
  <line x1="540" y1="204" x2="540" y2="226" stroke="#8b7a60" stroke-width="1.5"/>
  <rect x="452" y="226" width="176" height="124" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="540" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Concentration camps</text>
  <text x="540" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">Dachau opened in March 1933</text>
  <text x="540" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">for political prisoners; the</text>
  <text x="540" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">system later expanded</text>
  <text x="540" y="333" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">enormously</text>
  <line x1="736" y1="204" x2="736" y2="226" stroke="#8b7a60" stroke-width="1.5"/>
  <rect x="648" y="226" width="176" height="124" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="736" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Judges and courts</text>
  <text x="736" y="276" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">brought under Nazi control, so</text>
  <text x="736" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">the terror appeared legal</text>
  <rect x="60" y="362" width="760" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="388" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#7f1d1d">Because nobody knew who might be an informer, most people kept quiet.</text>
  <text x="440" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d">Fear of the knock on the door did the Gestapo’s work for it.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">People who spoke out, listened to foreign radio or told jokes about the regime could disappear into a camp.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">The terror was dressed up as law: the courts were Nazified, so arrests and imprisonments looked legal.</text>
</svg>
