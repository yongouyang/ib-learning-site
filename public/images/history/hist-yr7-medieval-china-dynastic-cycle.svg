<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The Chinese dynastic cycle</title>
  <desc id="desc">A ring of five stages: a new dynasty unifies the country and restores peace, strong rule follows with just government, then decline through corruption and higher taxes, then natural disasters read as signs the Mandate of Heaven is lost, then rebellion and invasion, after which a new dynasty claims the Mandate and the cycle repeats.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hc" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#b45309"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">The dynastic cycle and the Mandate of Heaven</text>
  <path d="M 538 160 Q 585 171 580 216" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#hc)" opacity="0.85"/>
  <path d="M 620 265 Q 675 305 645 332" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#hc)" opacity="0.85"/>
  <path d="M 483 367 Q 440 388 397 367" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#hc)" opacity="0.85"/>
  <path d="M 235 332 Q 205 305 260 265" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#hc)" opacity="0.85"/>
  <path d="M 300 216 Q 295 171 342 160" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#hc)" opacity="0.85"/>
  <rect x="350.0" y="118.0" width="180" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="440.0" y="141.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">New dynasty</text>
  <text x="440.0" y="162.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">unifies the country, restores peace</text>
  <rect x="587.7641290737884" y="202.2999266862564" width="180" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="677.7641290737884" y="225.2999266862564" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Strong rule</text>
  <text x="677.7641290737884" y="246.2999266862564" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">just government, roads and canals</text>
  <rect x="496.9463130731183" y="338.7000733137436" width="180" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="586.9463130731183" y="361.7000733137436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Decline</text>
  <text x="586.9463130731183" y="382.7000733137436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">corruption, higher taxes, bribery</text>
  <rect x="203.0536869268817" y="338.7000733137436" width="180" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="293.0536869268817" y="361.7000733137436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Disaster</text>
  <text x="293.0536869268817" y="382.7000733137436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">floods, droughts and famine</text>
  <rect x="112.23587092621159" y="202.29992668625644" width="180" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="202.2358709262116" y="225.29992668625644" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Rebellion</text>
  <text x="202.2358709262116" y="246.29992668625644" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">the dynasty falls, war returns</text>
  <rect x="330" y="234" width="220" height="68" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#78350f">The Mandate of Heaven</text>
  <text x="440" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#7c6a52">the right to rule, granted by</text>
  <text x="440" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#7c6a52">heaven to a worthy ruler</text>
  <rect x="381.9" y="92.0" width="116.3" height="19" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="440" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#15803d">Mandate granted</text>
  <rect x="392.1" y="400.0" width="95.8" height="19" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="440" y="412" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">Mandate lost</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Chinese thinkers used this cycle to explain the rise and fall of dynasties from 221 BCE to 1912 CE.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Disasters were read as proof the emperor had lost heaven’s support — which gave rebellions their justification.</text>
</svg>
