<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Primary and secondary sources compared</title>
  <desc id="desc">Two columns of examples. Primary sources were created during the period by someone who was there: letters, diaries, official documents, coins, photographs, buildings and oral accounts. Secondary sources were created afterwards by someone who was not there: textbooks, documentaries, museum displays and historians books.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">Primary and secondary sources</text>
  <rect x="60" y="84" width="370" height="250" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="60" y="84" width="370" height="44" rx="10" fill="#fef3c7"/>
  <text x="245" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#78350f">Primary source</text>
  <text x="80" y="152" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Created during the period, by someone</text>
  <text x="80" y="172" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">who was there.</text>
  <text x="90" y="204" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  letters and diaries</text>
  <text x="90" y="230" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  official documents</text>
  <text x="90" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  coins and tools</text>
  <text x="90" y="282" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  photographs and buildings</text>
  <text x="90" y="308" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  oral accounts</text>
  <rect x="450" y="84" width="370" height="250" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="450" y="84" width="370" height="44" rx="10" fill="#dbeafe"/>
  <text x="635" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Secondary source</text>
  <text x="470" y="152" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Created afterwards, by someone who</text>
  <text x="470" y="172" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">was not there.</text>
  <text x="480" y="204" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  textbooks</text>
  <text x="480" y="230" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  documentaries</text>
  <text x="480" y="256" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  museum displays</text>
  <text x="480" y="282" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">·  a historian’s book</text>
  <rect x="60" y="346" width="760" height="74" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Neither is automatically better: a primary source can be biased, mistaken or incomplete,</text>
  <text x="440" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">while a good secondary source can draw on far more evidence than any eyewitness had.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Some sources sit between the two: a memoir written fifty years later is primary evidence for the writer’s memory,</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">but it was shaped by everything that happened in between. Skilled historians use both and cross-check them.</text>
</svg>
