<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A cross-section through the Western Front trenches</title>
  <desc id="desc">Two opposing trench systems cut into the ground with a fire step, sandbag parapets and duckboards, separated by no man's land of mud, shell craters and barbed wire. Labels name the parts and the conditions soldiers endured, including trench foot, rats, lice and shell shock.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">A trench cross-section on the Western Front</text>
  <text x="440" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5b4a35">no man’s land — shell-torn mud, craters and barbed wire</text>
  <rect x="40" y="196" width="800" height="190" rx="0" fill="#e2d6c0" stroke="#c9b48f" stroke-width="1.2"/>
  <rect x="40" y="386" width="800" height="30" rx="0" fill="#cfc0a4" stroke="#bda98a" stroke-width="1.2"/>
  <line x1="40" y1="196" x2="840" y2="196" stroke="#8b7a60" stroke-width="1.6"/>
  <ellipse cx="330" cy="202" rx="26" ry="10" fill="#d8c9ae" stroke="#bda98a" stroke-width="1.2"/>
  <ellipse cx="392" cy="204" rx="26" ry="13" fill="#d8c9ae" stroke="#bda98a" stroke-width="1.2"/>
  <ellipse cx="452" cy="201" rx="26" ry="9" fill="#d8c9ae" stroke="#bda98a" stroke-width="1.2"/>
  <ellipse cx="510" cy="203" rx="26" ry="11" fill="#d8c9ae" stroke="#bda98a" stroke-width="1.2"/>
  <line x1="264" y1="196" x2="264" y2="174" stroke="#7c6a52" stroke-width="2.4"/>
  <line x1="292" y1="196" x2="292" y2="174" stroke="#7c6a52" stroke-width="2.4"/>
  <path d="M 264 184 l 14 -8 l 14 8 l 14 -8 l 14 8" fill="none" stroke="#8b7a60" stroke-width="1.3"/>
  <path d="M 264 192 l 14 -8 l 14 8 l 14 -8 l 14 8" fill="none" stroke="#8b7a60" stroke-width="1.3"/>
  <line x1="556" y1="196" x2="556" y2="174" stroke="#7c6a52" stroke-width="2.4"/>
  <line x1="584" y1="196" x2="584" y2="174" stroke="#7c6a52" stroke-width="2.4"/>
  <path d="M 556 184 l 14 -8 l 14 8 l 14 -8 l 14 8" fill="none" stroke="#8b7a60" stroke-width="1.3"/>
  <path d="M 556 192 l 14 -8 l 14 8 l 14 -8 l 14 8" fill="none" stroke="#8b7a60" stroke-width="1.3"/>
  <rect x="78" y="200" width="144" height="146" fill="#ffffff" stroke="#8b7a60" stroke-width="1.5"/>
  <rect x="78" y="176" width="144" height="20" fill="#d6c9b4" stroke="#8b7a60" stroke-width="1.2"/>
  <rect x="88" y="268" width="124" height="14" fill="#c9b48f"/>
  <rect x="86" y="330" width="128" height="10" fill="#b9a781"/>
  <rect x="108" y="344" width="84" height="34" fill="#efe7d8" stroke="#bda98a" stroke-width="1.2"/>
  <text x="150" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3f2d1c">British line</text>
  <rect x="118.2" y="177.0" width="63.6" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="150" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">sandbags</text>
  <rect x="115.1" y="251.0" width="69.8" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="150" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">fire step</text>
  <rect x="112.0" y="311.0" width="76.0" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="150" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">duckboards</text>
  <rect x="105.8" y="350.0" width="88.4" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="150" y="361" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">dugout below</text>
  <rect x="628" y="200" width="144" height="146" fill="#ffffff" stroke="#8b7a60" stroke-width="1.5"/>
  <rect x="628" y="176" width="144" height="20" fill="#d6c9b4" stroke="#8b7a60" stroke-width="1.2"/>
  <rect x="638" y="268" width="124" height="14" fill="#c9b48f"/>
  <rect x="636" y="330" width="128" height="10" fill="#b9a781"/>
  <rect x="658" y="344" width="84" height="34" fill="#efe7d8" stroke="#bda98a" stroke-width="1.2"/>
  <text x="700" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3f2d1c">German line</text>
  <rect x="668.2" y="177.0" width="63.6" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="700" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">sandbags</text>
  <rect x="665.1" y="251.0" width="69.8" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="700" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">fire step</text>
  <rect x="662.0" y="311.0" width="76.0" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="700" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">duckboards</text>
  <rect x="655.8" y="350.0" width="88.4" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="700" y="361" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">dugout below</text>
  <rect x="725.8" y="203.0" width="88.4" height="18" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="770" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b4a35">ground level</text>
  <line x1="760" y1="210" x2="700" y2="197" stroke="#8b7a60" stroke-width="1.2"/>
  <rect x="51.9" y="394.5" width="196.3" height="18.5" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="150" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">mud, rats, lice, trench foot</text>
  <rect x="595.4" y="394.5" width="209.3" height="18.5" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="700" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5b4a35">constant shelling, shell shock</text>
  <text x="150" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#7c6a52">opposing trenches 90–200 m apart</text>
  <text x="700" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#7c6a52">trench walls shored with timber</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">The trench line ran more than 700 kilometres from the Belgian coast to Switzerland and barely moved for three years.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Attacks followed a grim pattern: a bombardment, then infantry went over the top into machine-gun fire.</text>
</svg>
