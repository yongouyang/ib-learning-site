<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Island hopping across the Pacific, 1942 to 1945</title>
  <desc id="desc">A schematic of the two Allied drives towards Japan. The central Pacific drive runs from Midway in June 1942 through Iwo Jima to Okinawa, while the south-west drive runs from Guadalcanal through Leyte Gulf. Bypassed islands were cut off and left to wither on the vine.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#b91c1c"/></marker><marker id="hg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#15803d"/></marker><marker id="hb" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#1d4ed8"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">Island hopping: capture the key islands, cut off the rest</text>
  <rect x="40" y="80" width="800" height="254" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="440" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#0369a1">the Pacific Ocean — a schematic, not a map to scale</text>
  <rect x="70" y="112" width="150" height="62" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="145" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">JAPAN</text>
  <text x="145" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#92400e">Home islands</text>
  <rect x="660" y="112" width="150" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="735" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#7f1d1d">Pearl Harbor</text>
  <text x="735" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#7f1d1d">attacked Dec 1941</text>
  <line x1="224" y1="140" x2="654" y2="140" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#hr)"/>
  <text x="440" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#b91c1c">Japan strikes first</text>
  <path d="M 600 200 C 480 176, 360 186, 240 196" fill="none" stroke="#15803d" stroke-width="2.4" marker-end="url(#hg)"/>
  <path d="M 512 262 C 470 292, 430 296, 392 282" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#hb)"/>
  <rect x="379.6" y="160.5" width="150.7" height="18.5" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="455" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#15803d">central Pacific drive</text>
  <rect x="108.9" y="288.5" width="118.2" height="18.5" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="168" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#1d4ed8">south-west drive</text>
  <circle cx="600" cy="200" r="16" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="537.2" y="221.0" width="125.6" height="18" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="600" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#0369a1">Midway · June 1942</text>
  <circle cx="330" cy="206" r="16" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="264.1" y="233.0" width="131.8" height="18" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="330" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#0369a1">Iwo Jima · Feb 1945</text>
  <circle cx="225" cy="190" r="16" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="162.2" y="207.0" width="125.6" height="18" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="225" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#0369a1">Okinawa · Apr 1945</text>
  <circle cx="500" cy="258" r="16" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="427.9" y="279.0" width="144.2" height="18" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="500" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#0369a1">Guadalcanal · 1942–43</text>
  <circle cx="380" cy="276" r="16" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="307.9" y="297.0" width="144.2" height="18" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="380" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#0369a1">Leyte Gulf · Oct 1944</text>
  <circle cx="688" cy="248" r="13" fill="none" stroke="#7c6a52" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="600.4" y="271.0" width="175.2" height="18" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="688" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#7c6a52">left to wither on the vine</text>
  <rect x="40" y="342" width="800" height="88" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="60" y="362" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">Midway was the turning point: American codebreakers read Japan’s plans and sank four Japanese carriers.</text>
  <text x="60" y="381" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">Leyte Gulf was the largest naval battle in history. At Iwo Jima and Okinawa the Japanese fought to the last man,</text>
  <text x="60" y="400" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3f2d1c">and kamikaze pilots crashed explosive-laden planes into Allied ships.</text>
  <text x="60" y="419" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#7c6a52">Over 100,000 Japanese and tens of thousands of Allied dead convinced American leaders that invading Japan could cost millions of lives.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Instead of attacking every Japanese-held island, the Allies captured selected bases and cut the rest off.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Each captured island became an airfield and a naval base for the next step towards Japan.</text>
</svg>
