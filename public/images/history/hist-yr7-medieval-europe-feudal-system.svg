<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">The feudal pyramid of land and loyalty</title>
  <desc id="desc">A four-tier pyramid: the king at the top, then tenants-in-chief, then knights, then the peasants who were about ninety per cent of the population. Land is granted downwards and service and loyalty flow upwards.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hd" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#78350f"/></marker><marker id="hr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#b91c1c"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">The feudal system: land downwards, service upwards</text>
  <polygon points="147.0,146 353.0,146 339.0,88 161.0,88" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="250" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">King</text>
  <text x="250" y="134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5b4a35">in theory owned all the land</text>
  <polygon points="109.19999999999999,210 390.8,210 376.8,152 123.19999999999999,152" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
  <text x="250" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Tenants-in-chief</text>
  <text x="250" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5b4a35">barons and bishops — granted large estates called fiefs</text>
  <polygon points="71.4,274 428.6,274 414.6,216 85.4,216" fill="#fcd0a1" stroke="#c2410c" stroke-width="1.8"/>
  <text x="250" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Knights</text>
  <text x="250" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5b4a35">granted land in return for fighting for their lord</text>
  <polygon points="33.599999999999994,338 466.4,338 452.4,280 47.599999999999994,280" fill="#e7d3c0" stroke="#78350f" stroke-width="1.8"/>
  <text x="250" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">Peasants</text>
  <text x="250" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5b4a35">about 90% of the population — serfs owed unpaid labour, rents and fees</text>
  <line x1="492" y1="384" x2="492" y2="116" stroke="#b91c1c" stroke-width="2" marker-end="url(#hr)"/>
  <text x="506" y="250" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">service</text>
  <text x="506" y="270" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">and loyalty</text>
  <line x1="590" y1="116" x2="590" y2="384" stroke="#78350f" stroke-width="2" marker-end="url(#hd)"/>
  <text x="604" y="250" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#78350f">land</text>
  <text x="604" y="270" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#78350f">granted</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">After the Norman Conquest of 1066 William the Conqueror bound society together with a chain of mutual obligations.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">In return for service the lord offered protection and the right to farm — but it locked almost everyone into the rank they were born in.</text>
</svg>
