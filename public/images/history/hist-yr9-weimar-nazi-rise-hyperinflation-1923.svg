<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">How hyperinflation happened in 1923</title>
  <desc id="desc">A cause chain running from unpaid reparations to the occupation of the Ruhr, strike pay printed as new money, and prices exploding: a loaf of bread costing about 250 marks in January 1923 cost around 200 billion marks by November. A price ladder shows the scale. Below, the Munich Putsch of November 1923 is crushed and Adolf Hitler draws the lesson that the Nazis must win power through elections rather than violence.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hh" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#78350f"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">The crisis year of 1923: hyperinflation</text>
  <rect x="60" y="84" width="320" height="38" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.4"/>
  <text x="220" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">Germany fell behind on reparations</text>
  <line x1="220" y1="122" x2="220" y2="132" stroke="#78350f" stroke-width="1.6" marker-end="url(#hh)"/>
  <rect x="60" y="132" width="320" height="38" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.4"/>
  <text x="220" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">French and Belgian troops occupied the Ruhr</text>
  <line x1="220" y1="170" x2="220" y2="180" stroke="#78350f" stroke-width="1.6" marker-end="url(#hh)"/>
  <rect x="60" y="180" width="320" height="38" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.4"/>
  <text x="220" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">workers struck, so the government printed money</text>
  <line x1="220" y1="218" x2="220" y2="228" stroke="#78350f" stroke-width="1.6" marker-end="url(#hh)"/>
  <rect x="60" y="228" width="320" height="38" rx="8" fill="#fee2e2" stroke="#b45309" stroke-width="1.8"/>
  <text x="220" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">more money chasing fewer goods</text>
  <line x1="220" y1="266" x2="220" y2="276" stroke="#78350f" stroke-width="1.6" marker-end="url(#hh)"/>
  <rect x="60" y="276" width="320" height="38" rx="8" fill="#fee2e2" stroke="#b45309" stroke-width="1.8"/>
  <text x="220" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">prices exploded: a loaf cost 200 billion marks</text>
  <text x="430" y="100" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#3f2d1c">The price of a loaf of bread</text>
  <text x="430" y="118" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">the scale is not linear — each step is about a hundred times the last</text>
  <rect x="430" y="150" width="120" height="32" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="171" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#78350f">250 marks</text>
  <text x="430" y="144" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">January 1923</text>
  <rect x="430" y="200" width="220" height="32" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="221" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#78350f">several thousand marks</text>
  <text x="430" y="194" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">mid 1923</text>
  <rect x="430" y="250" width="310" height="32" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="271" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#78350f">millions of marks</text>
  <text x="430" y="244" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">autumn 1923</text>
  <rect x="430" y="300" width="390" height="32" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="321" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#78350f">about 200 billion marks</text>
  <text x="430" y="294" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c6a52">November 1923</text>
  <rect x="60" y="332" width="770" height="92" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="80" y="358" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">November 1923: the Munich Putsch</text>
  <text x="80" y="382" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">Hitler’s armed uprising in Munich was crushed by police. In prison he wrote Mein Kampf and drew a decisive lesson:</text>
  <text x="80" y="404" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">the Nazis would win power through elections, not violence. Late in 1923 the new Rentenmark stabilised the currency.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Savings and pensions became worthless overnight, while people with debts or mortgages actually benefited.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Ordinary Germans never forgot the terror of 1923 — which the Nazis would exploit in the years that followed.</text>
</svg>
