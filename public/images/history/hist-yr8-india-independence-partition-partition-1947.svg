<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A schematic of the 1947 partition of India</title>
  <desc id="desc">Three blocks represent Hindu-majority India and the two wings of Muslim-majority Pakistan, sixteen hundred kilometres apart, divided by the Radcliffe Line. Arrows show Muslims moving to Pakistan and Hindus and Sikhs moving to India, and panels give the numbers: about ten to fifteen million people crossed the new borders and an estimated one to two million were killed.</desc>
  <rect x="0" y="0" width="880" height="520" fill="#fdfcf8"/>
  <defs><marker id="hd" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#78350f"/></marker><marker id="hb" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#1d4ed8"/></marker><marker id="hr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#b91c1c"/></marker><marker id="hg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#15803d"/></marker></defs>
  <text x="440" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#3f2d1c">Partition, 1947: a line drawn through a divided land</text>
  <rect x="52" y="96" width="150" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="127" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">West</text>
  <text x="127" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">Pakistan</text>
  <text x="127" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#166534">Muslim-majority</text>
  <rect x="216" y="86" width="420" height="210" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="426" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#78350f">INDIA</text>
  <text x="426" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#92400e">Hindu-majority</text>
  <rect x="650" y="136" width="178" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="739" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">East</text>
  <text x="739" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">Pakistan</text>
  <text x="739" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#166534">Muslim-majority · 1,600 km away</text>
  <line x1="210" y1="80" x2="210" y2="302" stroke="#7c2d12" stroke-width="2.4" stroke-dasharray="8 5"/>
  <line x1="644" y1="80" x2="644" y2="302" stroke="#7c2d12" stroke-width="2.4" stroke-dasharray="8 5"/>
  <rect x="157.4" y="62.5" width="105.1" height="18.5" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="210" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c2d12">Radcliffe Line</text>
  <rect x="591.4" y="62.5" width="105.1" height="18.5" rx="4" fill="#fffdf7" opacity="0.94"/>
  <text x="644" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#7c2d12">Radcliffe Line</text>
  <line x1="300" y1="206" x2="176" y2="206" stroke="#15803d" stroke-width="2.2" marker-end="url(#hg)"/>
  <text x="238" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#166534">Muslims</text>
  <line x1="188" y1="244" x2="312" y2="244" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#hb)"/>
  <text x="272" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#1e3a8a">Hindus and Sikhs</text>
  <line x1="560" y1="238" x2="720" y2="238" stroke="#15803d" stroke-width="2.2" marker-end="url(#hg)"/>
  <text x="610" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#166534">Muslims</text>
  <text x="440" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#78350f">about 10–15 million people crossed</text>
  <rect x="52" y="314" width="700" height="56" rx="8" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="66" y="338" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">Britain, Congress and the Muslim League could not agree a united India — so the subcontinent was divided,</text>
  <text x="66" y="358" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#3f2d1c">and the boundary was announced only after independence.</text>
  <rect x="52" y="374" width="700" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="66" y="402" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7f1d1d">An estimated 1–2 million people were killed in communal violence, especially in Punjab; trains arrived full of dead.</text>
  <rect x="40" y="436" width="800" height="64" rx="10" fill="#ffffff" stroke="#d6c9b4" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#3f2d1c">Cyril Radcliffe, a British lawyer who had never been to India, was given barely five weeks to draw the new borders.</text>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c6a52">Gandhi, heartbroken that India had been divided, was assassinated by a Hindu extremist in January 1948.</text>
</svg>
