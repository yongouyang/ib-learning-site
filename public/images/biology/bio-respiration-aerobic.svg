<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="title desc">
  <title id="title">Aerobic Respiration</title>
  <desc id="desc">Diagram showing the word equation for aerobic respiration and a mitochondrion inside a cell.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#f9fafb" rx="12"/>
  <text x="390" y="34" text-anchor="middle" class="title">Aerobic Respiration</text>

  <!-- Cell -->
  <circle cx="390" cy="230" r="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>

  <!-- Mitochondrion -->
  <ellipse cx="390" cy="230" rx="75" ry="45" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>
  <path d="M345,230 Q360,210 375,230 Q390,250 405,230 Q420,210 435,230" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round"/>
  <text x="390" y="235" text-anchor="middle" class="label" fill="#fff">Mitochondrion</text>

  <!-- Glucose -->
  <rect x="60" y="205" width="90" height="38" rx="8" fill="#fde047" stroke="#d97706" stroke-width="2"/>
  <text x="105" y="222" text-anchor="middle" class="label">Glucose</text>
  <text x="105" y="235" text-anchor="middle" class="sublabel">C₆H₁₂O₆</text>

  <!-- Oxygen -->
  <rect x="60" y="260" width="90" height="38" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="277" text-anchor="middle" class="label">Oxygen</text>
  <text x="105" y="290" text-anchor="middle" class="sublabel">O₂</text>

  <!-- Inputs arrows -->
  <line x1="150" y1="224" x2="280" y2="230" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>
  <line x1="150" y1="279" x2="280" y2="250" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>

  <!-- Outputs -->
  <rect x="610" y="185" width="100" height="38" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="660" y="202" text-anchor="middle" class="label">Carbon dioxide</text>
  <text x="660" y="215" text-anchor="middle" class="sublabel">CO₂</text>

  <rect x="610" y="240" width="100" height="38" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="660" y="257" text-anchor="middle" class="label">Water</text>
  <text x="660" y="270" text-anchor="middle" class="sublabel">H₂O</text>

  <!-- Output arrows -->
  <line x1="465" y1="220" x2="610" y2="204" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>
  <line x1="465" y1="245" x2="610" y2="259" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>

  <!-- Energy burst -->
  <path d="M400,185 L410,160 L420,185 L445,175 L425,195 L440,215 L415,205 L405,230 L395,205 L370,215 L385,195 L365,175 L390,185 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="405" y="155" text-anchor="middle" class="label" fill="#a16207">ATP energy</text>

  <!-- Word equation -->
  <rect x="165" y="330" width="450" height="38" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="390" y="353" text-anchor="middle" class="sublabel">Glucose + Oxygen → Carbon dioxide + Water + ATP</text>
</svg>
