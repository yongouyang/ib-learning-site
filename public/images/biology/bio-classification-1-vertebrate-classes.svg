<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">The Five Classes of Vertebrates</title>
  <desc id="desc">A diagram showing the five vertebrate classes with key distinguishing features: fish, amphibians, reptiles, birds, and mammals.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .class-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #111827; }
      .box { stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="820" height="420" fill="#f9fafb" rx="12"/>
  <text x="410" y="36" text-anchor="middle" class="title">The Five Classes of Vertebrates</text>

  <!-- Fish -->
  <rect x="30" y="60" width="136" height="200" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="98" y="84" text-anchor="middle" class="class-title">Fish</text>
  <path d="M70,150 Q90,130 110,150 L130,140 L110,150 L130,160 L110,150 Q90,170 70,150 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="85" cy="145" r="3" fill="#1f2937"/>
  <text x="98" y="190" text-anchor="middle" class="sublabel">Gills, scales,</text>
  <text x="98" y="208" text-anchor="middle" class="sublabel">fins, eggs in water</text>
  <text x="98" y="226" text-anchor="middle" class="sublabel">Ectothermic</text>

  <!-- Amphibians -->
  <rect x="182" y="60" width="136" height="200" fill="#d1fae5" stroke="#10b981" class="box"/>
  <text x="250" y="84" text-anchor="middle" class="class-title">Amphibians</text>
  <ellipse cx="250" cy="155" rx="35" ry="20" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <circle cx="235" cy="150" r="3" fill="#1f2937"/>
  <path d="M215,165 Q235,175 255,165" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" class="sublabel">Moist skin, lungs,</text>
  <text x="250" y="208" text-anchor="middle" class="sublabel">metamorphosis</text>
  <text x="250" y="226" text-anchor="middle" class="sublabel">Ectothermic</text>

  <!-- Reptiles -->
  <rect x="334" y="60" width="136" height="200" fill="#fef3c7" stroke="#f59e0b" class="box"/>
  <text x="402" y="84" text-anchor="middle" class="class-title">Reptiles</text>
  <ellipse cx="402" cy="155" rx="40" ry="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <circle cx="375" cy="150" r="3" fill="#1f2937"/>
  <path d="M360,165 Q380,172 400,165" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="402" y="190" text-anchor="middle" class="sublabel">Dry scaly skin,</text>
  <text x="402" y="208" text-anchor="middle" class="sublabel">lungs, eggs on land</text>
  <text x="402" y="226" text-anchor="middle" class="sublabel">Ectothermic</text>

  <!-- Birds -->
  <rect x="486" y="60" width="136" height="200" fill="#fee2e2" stroke="#ef4444" class="box"/>
  <text x="554" y="84" text-anchor="middle" class="class-title">Birds</text>
  <ellipse cx="554" cy="150" rx="30" ry="20" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <path d="M530,140 L515,130 L530,145" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="540" cy="145" r="3" fill="#1f2937"/>
  <path d="M550,155 L560,165" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="554" y="190" text-anchor="middle" class="sublabel">Feathers, beak, wings,</text>
  <text x="554" y="208" text-anchor="middle" class="sublabel">hard-shelled eggs</text>
  <text x="554" y="226" text-anchor="middle" class="sublabel">Endothermic</text>

  <!-- Mammals -->
  <rect x="638" y="60" width="136" height="200" fill="#f3e8ff" stroke="#9333ea" class="box"/>
  <text x="706" y="84" text-anchor="middle" class="class-title">Mammals</text>
  <ellipse cx="706" cy="155" rx="32" ry="22" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2"/>
  <circle cx="685" cy="150" r="3" fill="#1f2937"/>
  <ellipse cx="675" cy="135" rx="8" ry="5" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2"/>
  <ellipse cx="720" cy="135" rx="8" ry="5" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2"/>
  <path d="M690,168 Q706,175 722,168" fill="none" stroke="#7e22ce" stroke-width="2"/>
  <text x="706" y="190" text-anchor="middle" class="sublabel">Hair/fur, milk,</text>
  <text x="706" y="208" text-anchor="middle" class="sublabel">live young (most)</text>
  <text x="706" y="226" text-anchor="middle" class="sublabel">Endothermic</text>

  <!-- Legend -->
  <rect x="30" y="290" width="360" height="110" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>
  <text x="210" y="315" text-anchor="middle" class="label">Shared feature</text>
  <text x="210" y="340" text-anchor="middle" class="sublabel">All vertebrates have a backbone (vertebral column)</text>
  <line x1="100" y1="360" x2="320" y2="360" stroke="#6b7280" stroke-width="2"/>
  <rect x="120" y="370" width="180" height="22" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="4"/>
  <text x="210" y="385" text-anchor="middle" class="sublabel">Warm-blooded (endothermic)</text>

  <rect x="414" y="290" width="360" height="110" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>
  <text x="594" y="315" text-anchor="middle" class="label">Temperature regulation</text>
  <text x="594" y="340" text-anchor="middle" class="sublabel">Fish, amphibians, reptiles = ectothermic (cold-blooded)</text>
  <text x="594" y="360" text-anchor="middle" class="sublabel">Birds, mammals = endothermic (warm-blooded)</text>
  <rect x="474" y="370" width="240" height="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
  <text x="594" y="385" text-anchor="middle" class="sublabel">Cold-blooded (ectothermic)</text>
</svg>