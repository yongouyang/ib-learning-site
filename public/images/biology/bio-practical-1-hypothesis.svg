<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" role="img" aria-labelledby="title desc">
  <title id="title">Hypothesis format</title>
  <desc id="desc">A flow diagram showing the if-then-because format for writing a testable hypothesis.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .box { stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#f9fafb" rx="12"/>
  <text x="370" y="34" text-anchor="middle" class="title">Writing a Testable Hypothesis</text>

  <!-- IF box -->
  <rect x="60" y="120" width="160" height="70" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="140" y="148" text-anchor="middle" class="label">IF</text>
  <text x="140" y="168" text-anchor="middle" class="sublabel">independent variable changes</text>

  <!-- THEN box -->
  <rect x="290" y="120" width="160" height="70" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="370" y="148" text-anchor="middle" class="label">THEN</text>
  <text x="370" y="168" text-anchor="middle" class="sublabel">dependent variable changes</text>

  <!-- BECAUSE box -->
  <rect x="520" y="120" width="160" height="70" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="600" y="148" text-anchor="middle" class="label">BECAUSE</text>
  <text x="600" y="168" text-anchor="middle" class="sublabel">scientific reasoning</text>

  <!-- Arrows -->
  <line x1="220" y1="155" x2="290" y2="155" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>
  <line x1="450" y1="155" x2="520" y2="155" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>

  <!-- Example -->
  <rect x="70" y="250" width="600" height="70" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="370" y="275" text-anchor="middle" class="label">Example</text>
  <text x="370" y="298" text-anchor="middle" class="sublabel">If light intensity increases, then the rate of photosynthesis will increase,</text>
  <text x="370" y="315" text-anchor="middle" class="sublabel">because more light energy drives the light-dependent reactions.</text>
</svg>