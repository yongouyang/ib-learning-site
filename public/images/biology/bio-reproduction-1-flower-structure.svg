<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Flower Structure and Pollination</title>
  <desc id="desc">A cross-section of a typical insect-pollinated flower showing petals, sepals, stamen, carpel and ovule.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Flower Structure and Pollination</text>

  <!-- Sepals -->
  <path d="M340,120 Q320,80 360,70 Q400,60 440,70 Q480,80 460,120 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <path d="M330,140 Q290,130 300,170 Q310,210 350,190 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <path d="M470,140 Q510,130 500,170 Q490,210 450,190 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

  <!-- Petals -->
  <path d="M360,130 Q300,110 280,170 Q270,230 330,230 Q370,220 385,180 Z" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
  <path d="M440,130 Q500,110 520,170 Q530,230 470,230 Q430,220 415,180 Z" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
  <path d="M400,125 Q430,90 400,70 Q370,90 400,125 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
  <path d="M385,190 Q350,240 400,260 Q450,240 415,190 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>

  <!-- Stamen (left) -->
  <line x1="360" y1="210" x2="335" y2="160" stroke="#16a34a" stroke-width="4"/>
  <ellipse cx="330" cy="150" rx="18" ry="12" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <line x1="335" y1="160" x2="335" y2="220" class="line"/>
  <rect x="280" y="150" width="80" height="18" rx="4" class="label-bg"/>
  <text x="285" y="162" class="label">Anther</text>

  <!-- Stamen (right) -->
  <line x1="440" y1="210" x2="465" y2="160" stroke="#16a34a" stroke-width="4"/>
  <ellipse cx="470" cy="150" rx="18" ry="12" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <line x1="465" y1="160" x2="510" y2="150" class="line"/>
  <rect x="515" y="141" width="80" height="18" rx="4" class="label-bg"/>
  <text x="520" y="153" class="label">Filament</text>

  <!-- Carpel -->
  <path d="M400,130 Q420,130 420,150 L430,220 Q435,250 400,250 Q365,250 370,220 L380,150 Q380,130 400,130 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="400" cy="130" rx="22" ry="10" fill="#a7f3d0" stroke="#16a34a" stroke-width="2"/>

  <!-- Stigma label -->
  <line x1="420" y1="130" x2="480" y2="110" class="line"/>
  <rect x="485" y="101" width="70" height="18" rx="4" class="label-bg"/>
  <text x="490" y="113" class="label">Stigma</text>

  <!-- Style label -->
  <line x1="415" y1="170" x2="510" y2="185" class="line"/>
  <rect x="515" y="176" width="60" height="18" rx="4" class="label-bg"/>
  <text x="520" y="188" class="label">Style</text>

  <!-- Ovary / ovules -->
  <ellipse cx="390" cy="230" rx="14" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <ellipse cx="410" cy="230" rx="14" ry="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <line x1="425" y1="235" x2="500" y2="250" class="line"/>
  <rect x="505" y="241" width="70" height="18" rx="4" class="label-bg"/>
  <text x="510" y="253" class="label">Ovary</text>
  <line x1="390" y1="230" x2="300" y2="230" class="line"/>
  <rect x="210" y="221" width="85" height="18" rx="4" class="label-bg"/>
  <text x="215" y="233" class="label">Ovules</text>

  <!-- Nectary -->
  <ellipse cx="400" cy="280" rx="35" ry="12" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <line x1="435" y1="280" x2="520" y2="300" class="line"/>
  <rect x="525" y="291" width="70" height="18" rx="4" class="label-bg"/>
  <text x="530" y="303" class="label">Nectary</text>

  <!-- Petal label -->
  <line x1="300" y1="200" x2="210" y2="200" class="line"/>
  <rect x="150" y="191" width="55" height="18" rx="4" class="label-bg"/>
  <text x="155" y="203" class="label">Petal</text>

  <!-- Sepal label -->
  <line x1="330" y1="110" x2="250" y2="100" class="line"/>
  <rect x="185" y="91" width="60" height="18" rx="4" class="label-bg"/>
  <text x="190" y="103" class="label">Sepal</text>

  <!-- Insect pollinator hint -->
  <ellipse cx="230" cy="150" rx="18" ry="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <path d="M210,140 L200,125 M250,140 L260,125 M215,155 L205,165 M245,155 L255,165" stroke="#b45309" stroke-width="2" fill="none"/>
  <line x1="230" y1="150" x2="280" y2="150" class="line"/>
  <rect x="185" y="131" width="90" height="18" rx="4" class="label-bg"/>
  <text x="190" y="143" class="label">Pollinator</text>
</svg>