<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Magnification worked example</title>
  <desc id="desc">A drawn plant cell measuring 45 mm is compared with the real cell measuring 0.09 mm. The calculation magnification equals image size divided by actual size, 45 divided by 0.09, gives 500 times.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .working { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .meas { stroke: #374151; stroke-width: 2; fill: none; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#374151"/>
    </marker>
    <g id="pcell">
      <rect x="-130" y="-90" width="260" height="180" rx="18" fill="#d1fae5" stroke="#059669" stroke-width="4"/>
      <rect x="-120" y="-80" width="240" height="160" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
      <rect x="-100" y="-58" width="150" height="116" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
      <circle cx="82" cy="-18" r="26" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
      <ellipse cx="62" cy="48" rx="18" ry="10" fill="#22c55e"/>
      <ellipse cx="96" cy="30" rx="16" ry="9" fill="#16a34a"/>
      <ellipse cx="84" cy="66" rx="14" ry="8" fill="#22c55e"/>
    </g>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Magnification: a Worked Example</text>

  <!-- Left: the image -->
  <text x="210" y="70" text-anchor="middle" class="label">The image (what you measure)</text>
  <use href="#pcell" transform="translate(210 200)"/>
  <line x1="80" y1="322" x2="340" y2="322" class="meas" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="130" y="338" width="160" height="20" rx="4" fill="#f9fafb"/>
  <text x="210" y="352" text-anchor="middle" class="label">image size = 45 mm</text>

  <!-- Right: the real cell -->
  <text x="620" y="70" text-anchor="middle" class="label">The real cell</text>
  <use href="#pcell" transform="translate(620 200) scale(0.25)"/>
  <line x1="588" y1="240" x2="652" y2="240" class="meas" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="530" y="252" width="180" height="20" rx="4" fill="#f9fafb"/>
  <text x="620" y="266" text-anchor="middle" class="label">actual size = 0.09 mm</text>

  <!-- Working band -->
  <rect x="60" y="392" width="680" height="92" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="400" y="426" text-anchor="middle" class="working">magnification = image size ÷ actual size = 45 mm ÷ 0.09 mm = ×500</text>
  <text x="400" y="456" text-anchor="middle" class="sublabel">A ratio, so it carries no units — and both measurements must share the same units before you divide (1 mm = 1000 µm).</text>
</svg>
