<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Dicotyledonous leaf cross-section</title>
  <desc id="desc">A labelled cross-section of a dicot leaf. From top to bottom: waxy cuticle, upper epidermis, palisade mesophyll cells containing chloroplasts, spongy mesophyll with air spaces, and the lower epidermis with guard cells around a stoma. A vascular bundle in the middle contains xylem above phloem.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .chip { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="36" text-anchor="middle" class="title">Dicotyledonous Leaf Cross-Section</text>

  <!-- Leaf interior background -->
  <rect x="170" y="92" width="386" height="262" fill="#f0fdf4"/>

  <!-- Upper epidermis cells -->
  <g fill="#d1fae5" stroke="#34d399" stroke-width="1.5">
    <rect x="170" y="94" width="36" height="30"/>
    <rect x="208" y="94" width="36" height="30"/>
    <rect x="246" y="94" width="36" height="30"/>
    <rect x="284" y="94" width="36" height="30"/>
    <rect x="322" y="94" width="36" height="30"/>
    <rect x="360" y="94" width="36" height="30"/>
    <rect x="398" y="94" width="36" height="30"/>
    <rect x="436" y="94" width="36" height="30"/>
    <rect x="474" y="94" width="36" height="30"/>
    <rect x="512" y="94" width="36" height="30"/>
  </g>

  <!-- Palisade mesophyll columns -->
  <g fill="#86efac" stroke="#22c55e" stroke-width="1.5">
    <rect x="172" y="124" width="16" height="100" rx="6"/>
    <rect x="192" y="124" width="16" height="100" rx="6"/>
    <rect x="212" y="124" width="16" height="100" rx="6"/>
    <rect x="232" y="124" width="16" height="100" rx="6"/>
    <rect x="252" y="124" width="16" height="100" rx="6"/>
    <rect x="272" y="124" width="16" height="100" rx="6"/>
    <rect x="292" y="124" width="16" height="100" rx="6"/>
    <rect x="312" y="124" width="16" height="100" rx="6"/>
    <rect x="332" y="124" width="16" height="100" rx="6"/>
    <rect x="352" y="124" width="16" height="100" rx="6"/>
    <rect x="372" y="124" width="16" height="100" rx="6"/>
    <rect x="392" y="124" width="16" height="100" rx="6"/>
    <rect x="412" y="124" width="16" height="100" rx="6"/>
    <rect x="532" y="124" width="16" height="100" rx="6"/>
  </g>

  <!-- Chloroplasts -->
  <g fill="#15803d">
    <circle cx="180" cy="150" r="3"/>
    <circle cx="200" cy="170" r="3.5"/>
    <circle cx="220" cy="140" r="3"/>
    <circle cx="240" cy="165" r="3"/>
    <circle cx="260" cy="145" r="3"/>
    <circle cx="280" cy="170" r="3"/>
    <circle cx="300" cy="150" r="3"/>
    <circle cx="320" cy="165" r="3"/>
    <circle cx="340" cy="145" r="3"/>
    <circle cx="360" cy="170" r="3"/>
    <circle cx="380" cy="150" r="3"/>
    <circle cx="400" cy="160" r="3"/>
    <circle cx="540" cy="160" r="3"/>
  </g>

  <!-- Spongy mesophyll cells with air spaces between them -->
  <g fill="#bbf7d0" stroke="#4ade80" stroke-width="1.5">
    <circle cx="230" cy="245" r="15"/>
    <circle cx="270" cy="255" r="17"/>
    <circle cx="310" cy="240" r="15"/>
    <circle cx="350" cy="258" r="16"/>
    <circle cx="390" cy="245" r="15"/>
    <circle cx="250" cy="295" r="16"/>
    <circle cx="300" cy="300" r="15"/>
    <circle cx="340" cy="290" r="17"/>
    <circle cx="390" cy="300" r="15"/>
    <circle cx="415" cy="270" r="14"/>
  </g>

  <!-- Lower epidermis cells (gap left for the stoma) -->
  <g fill="#d1fae5" stroke="#34d399" stroke-width="1.5">
    <rect x="170" y="324" width="36" height="30"/>
    <rect x="208" y="324" width="36" height="30"/>
    <rect x="246" y="324" width="36" height="30"/>
    <rect x="284" y="324" width="36" height="30"/>
    <rect x="390" y="324" width="36" height="30"/>
    <rect x="428" y="324" width="36" height="30"/>
    <rect x="466" y="324" width="36" height="30"/>
    <rect x="504" y="324" width="36" height="30"/>
  </g>

  <!-- Guard cells and stoma -->
  <ellipse cx="338" cy="352" rx="16" ry="11" transform="rotate(-12 338 352)" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="374" cy="352" rx="16" ry="11" transform="rotate(12 374 352)" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="356" cy="351" rx="4" ry="8" fill="#064e3b"/>

  <!-- Vascular bundle with xylem above phloem -->
  <ellipse cx="480" cy="210" rx="48" ry="110" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <ellipse cx="480" cy="165" rx="26" ry="38" fill="#3b82f6"/>
  <ellipse cx="480" cy="255" rx="26" ry="32" fill="#f97316"/>

  <!-- Waxy cuticle -->
  <rect x="170" y="86" width="386" height="6" rx="3" fill="#fcd34d"/>

  <!-- Left labels -->
  <line x1="120" y1="67" x2="210" y2="88" class="line"/>
  <rect x="16" y="58" width="104" height="18" rx="4" class="chip"/>
  <text x="22" y="71" class="label">Waxy cuticle</text>

  <line x1="150" y1="101" x2="200" y2="108" class="line"/>
  <rect x="16" y="92" width="134" height="18" rx="4" class="chip"/>
  <text x="22" y="105" class="label">Upper epidermis</text>

  <line x1="166" y1="137" x2="195" y2="150" class="line"/>
  <rect x="16" y="128" width="150" height="18" rx="4" class="chip"/>
  <text x="22" y="141" class="label">Palisade mesophyll</text>

  <line x1="122" y1="173" x2="203" y2="170" class="line"/>
  <rect x="16" y="164" width="106" height="18" rx="4" class="chip"/>
  <text x="22" y="177" class="label">Chloroplasts</text>

  <line x1="166" y1="245" x2="214" y2="247" class="line"/>
  <rect x="16" y="236" width="150" height="18" rx="4" class="chip"/>
  <text x="22" y="249" class="label">Spongy mesophyll</text>

  <line x1="106" y1="281" x2="212" y2="284" class="line"/>
  <rect x="16" y="272" width="90" height="18" rx="4" class="chip"/>
  <text x="22" y="285" class="label">Air spaces</text>

  <line x1="158" y1="327" x2="195" y2="338" class="line"/>
  <rect x="16" y="318" width="142" height="18" rx="4" class="chip"/>
  <text x="22" y="331" class="label">Lower epidermis</text>

  <line x1="114" y1="381" x2="330" y2="361" class="line"/>
  <rect x="16" y="372" width="98" height="18" rx="4" class="chip"/>
  <text x="22" y="385" class="label">Guard cells</text>

  <line x1="325" y1="400" x2="354" y2="358" class="line"/>
  <rect x="300" y="400" width="64" height="18" rx="4" class="chip"/>
  <text x="306" y="413" class="label">Stoma</text>

  <!-- Right labels -->
  <line x1="490" y1="104" x2="590" y2="97" class="line"/>
  <rect x="592" y="88" width="186" height="18" rx="4" class="chip"/>
  <text x="598" y="101" class="label">Vascular bundle (vein)</text>

  <line x1="506" y1="165" x2="590" y2="179" class="line"/>
  <rect x="592" y="170" width="164" height="18" rx="4" class="chip"/>
  <text x="598" y="183" class="label">Xylem: carries water</text>

  <line x1="506" y1="255" x2="590" y2="224" class="line"/>
  <rect x="592" y="215" width="192" height="18" rx="4" class="chip"/>
  <text x="598" y="228" class="label">Phloem: carries sucrose</text>

  <!-- Caption -->
  <text x="400" y="490" text-anchor="middle" class="sublabel">Palisade cells packed with chloroplasts trap light · air spaces and stomata exchange gases · xylem brings water, phloem carries sucrose away</text>
</svg>
