<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">Fermentation in Plants and Yeast</title>
  <desc id="desc">Diagram showing anaerobic respiration in yeast producing ethanol and carbon dioxide, with bread and brewing examples.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .yeast { fill: #fde68a; stroke: #d97706; stroke-width: 2; }
    </style>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#f9fafb" rx="12"/>
  <text x="390" y="34" text-anchor="middle" class="title">Fermentation in Plants and Yeast</text>

  <!-- Yeast cell -->
  <circle cx="220" cy="180" r="70" class="yeast"/>
  <circle cx="200" cy="160" r="8" fill="#a855f7" opacity="0.8"/>
  <circle cx="245" cy="170" r="10" fill="#a855f7" opacity="0.8"/>
  <circle cx="225" cy="205" r="7" fill="#a855f7" opacity="0.8"/>
  <text x="220" y="184" text-anchor="middle" class="label">Yeast cell</text>

  <!-- Glucose in -->
  <rect x="50" y="160" width="80" height="36" rx="6" fill="#fde047" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="178" text-anchor="middle" class="label">Glucose</text>
  <line x1="130" y1="178" x2="150" y2="178" class="arrow" stroke="#6b7280" marker-end="url(#arrow-red)"/>

  <!-- Ethanol out -->
  <rect x="360" y="130" width="90" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="405" y="148" text-anchor="middle" class="label">Ethanol</text>
  <text x="405" y="160" text-anchor="middle" class="sublabel">C₂H₅OH</text>
  <line x1="290" y1="160" x2="360" y2="148" class="arrow" stroke="#6b7280" marker-end="url(#arrow-red)"/>

  <!-- CO2 out -->
  <rect x="360" y="200" width="110" height="36" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="415" y="218" text-anchor="middle" class="label">Carbon dioxide</text>
  <line x1="290" y1="200" x2="360" y2="218" class="arrow" stroke="#6b7280" marker-end="url(#arrow-red)"/>

  <!-- Energy -->
  <path d="M240,110 L250,85 L260,110 L285,100 L265,120 L280,140 L255,130 L245,155 L235,130 L210,140 L225,120 L200,100 L225,110 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="250" y="80" text-anchor="middle" class="label" fill="#a16207">2 ATP</text>

  <!-- Bread example -->
  <rect x="540" y="110" width="190" height="90" fill="#fff7ed" stroke="#fdba74" stroke-width="2" rx="8"/>
  <ellipse cx="635" cy="160" rx="50" ry="28" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="615" cy="155" r="5" fill="#92400e" opacity="0.4"/>
  <circle cx="650" cy="165" r="6" fill="#92400e" opacity="0.4"/>
  <circle cx="635" cy="145" r="4" fill="#92400e" opacity="0.4"/>
  <text x="635" y="180" text-anchor="middle" class="label">Bread</text>
  <text x="635" y="195" text-anchor="middle" class="sublabel">CO₂ makes dough rise</text>

  <!-- Brewing example -->
  <rect x="540" y="230" width="190" height="90" fill="#f0fdf4" stroke="#86efac" stroke-width="2" rx="8"/>
  <path d="M600,300 L600,250 L670,250 L670,300 C670,315 600,315 600,300" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <ellipse cx="635" cy="250" rx="35" ry="10" fill="#86efac" stroke="#22c55e" stroke-width="2"/>
  <text x="635" y="290" text-anchor="middle" class="label">Brewing</text>
  <text x="635" y="305" text-anchor="middle" class="sublabel">Ethanol + CO₂</text>

  <!-- Equation -->
  <rect x="165" y="360" width="450" height="38" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="390" y="383" text-anchor="middle" class="sublabel">Glucose → Ethanol + Carbon dioxide + small amount of ATP</text>
</svg>
