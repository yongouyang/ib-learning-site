<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Punnett square for a Pp × Pp cross in pea plants</title>
  <desc id="desc">A 2 by 2 Punnett square for crossing two heterozygous pea plants (Pp × Pp), where purple flowers (P) are dominant to white (p). Offspring genotypes are 1 PP : 2 Pp : 1 pp, giving a phenotype ratio of 3 purple to 1 white.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .big { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Punnett Square: Pp × Pp in Pea Plants</text>
  <text x="400" y="60" text-anchor="middle" class="sublabel">purple flowers (P) are dominant to white (p); both parents are heterozygous</text>

  <!-- Gametes from parent 1 (top) -->
  <text x="420" y="86" text-anchor="middle" class="sublabel">gametes from parent 1</text>
  <circle cx="360" cy="112" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="117" text-anchor="middle" class="label">P</text>
  <circle cx="480" cy="112" r="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="480" y="117" text-anchor="middle" class="label">p</text>

  <!-- Gametes from parent 2 (left) -->
  <text x="206" y="260" text-anchor="middle" class="sublabel" transform="rotate(-90 206 260)">gametes from parent 2</text>
  <circle cx="250" cy="200" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" class="label">P</text>
  <circle cx="250" cy="320" r="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="250" y="325" text-anchor="middle" class="label">p</text>

  <!-- Grid cells -->
  <rect x="300" y="140" width="120" height="120" fill="#ede9fe"/>
  <rect x="420" y="140" width="120" height="120" fill="#ede9fe"/>
  <rect x="300" y="260" width="120" height="120" fill="#ede9fe"/>
  <rect x="420" y="260" width="120" height="120" fill="#f3f4f6"/>
  <rect x="300" y="140" width="240" height="240" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="260" x2="540" y2="260" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="140" x2="420" y2="380" stroke="#374151" stroke-width="2"/>

  <!-- Offspring genotypes -->
  <text x="360" y="196" text-anchor="middle" class="big" fill="#5b21b6">PP</text>
  <text x="480" y="196" text-anchor="middle" class="big" fill="#5b21b6">Pp</text>
  <text x="360" y="316" text-anchor="middle" class="big" fill="#5b21b6">Pp</text>
  <text x="480" y="316" text-anchor="middle" class="big" fill="#6b7280">pp</text>

  <!-- Phenotype dots -->
  <circle cx="360" cy="226" r="11" fill="#7c3aed"/>
  <circle cx="480" cy="226" r="11" fill="#7c3aed"/>
  <circle cx="360" cy="346" r="11" fill="#7c3aed"/>
  <circle cx="480" cy="346" r="11" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>

  <!-- Summary panel -->
  <rect x="575" y="140" width="195" height="210" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="672" y="166" text-anchor="middle" class="label">Offspring</text>
  <text x="588" y="196" class="sublabel">genotype ratio:</text>
  <text x="588" y="218" class="label">1 PP : 2 Pp : 1 pp</text>
  <text x="588" y="240" class="sublabel">(25% : 50% : 25%)</text>
  <text x="588" y="272" class="sublabel">phenotype ratio:</text>
  <text x="588" y="294" class="label">3 purple : 1 white</text>
  <text x="588" y="316" class="sublabel">= 3 : 1</text>

  <!-- Reminder band -->
  <rect x="90" y="430" width="620" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="454" text-anchor="middle" class="sublabel">each offspring has a 1 in 4 (25%) chance of pp — ratios are probabilities, not guaranteed family sizes</text>
</svg>
