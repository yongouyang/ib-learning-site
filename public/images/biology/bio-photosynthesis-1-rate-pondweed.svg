<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Investigating the Rate of Photosynthesis</title>
  <desc id="desc">Diagram of the pondweed practical showing a beaker, lamp at varying distances, pondweed releasing oxygen bubbles, and the inverse square law relationship.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .axis { stroke: #374151; stroke-width: 2.5; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .curve { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#f9fafb" rx="12"/>
  <text x="440" y="38" text-anchor="middle" class="title">Investigating the Rate of Photosynthesis</text>

  <!-- Setup panel -->
  <rect x="40" y="60" width="420" height="430" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="250" y="85" text-anchor="middle" class="label">Pondweed practical</text>

  <!-- Lamp -->
  <g transform="translate(100, 160)">
    <path d="M0,0 L40,0 L35,50 L5,50 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="20" cy="0" rx="20" ry="8" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <rect x="12" y="50" width="16" height="20" fill="#9ca3af"/>
    <rect x="-5" y="70" width="50" height="8" rx="2" fill="#6b7280"/>
    <!-- Light rays -->
    <line x1="45" y1="10" x2="90" y2="40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="25" x2="95" y2="80" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="40" x2="90" y2="120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="70" y="140" width="60" height="18" rx="4" class="label-bg"/>
  <text x="100" y="153" text-anchor="middle" class="label">Lamp</text>

  <!-- Distance labels -->
  <line x1="100" y1="260" x2="250" y2="260" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="175" y="255" text-anchor="middle" class="sublabel">distance d</text>

  <!-- Beaker -->
  <path d="M250,250 L250,390 Q250,410 270,410 L370,410 Q390,410 390,390 L390,250" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" fill-opacity="0.4"/>
  <rect x="250" y="330" width="140" height="80" fill="#dbeafe" opacity="0.6"/>
  <text x="320" y="390" text-anchor="middle" class="sublabel">Water + NaHCO₃</text>

  <!-- Pondweed -->
  <g transform="translate(320, 300)">
    <path d="M0,90 Q-5,60 0,40 Q5,20 0,0" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-8" cy="15" rx="8" ry="4" fill="#22c55e" transform="rotate(-30 -8 15)"/>
    <ellipse cx="8" cy="30" rx="8" ry="4" fill="#22c55e" transform="rotate(30 8 30)"/>
    <ellipse cx="-7" cy="50" rx="7" ry="3" fill="#22c55e" transform="rotate(-20 -7 50)"/>
  </g>

  <!-- Bubbles -->
  <circle cx="325" cy="285" r="5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="335" cy="270" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="328" cy="255" r="5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="340" cy="240" r="3" fill="#3b82f6" opacity="0.7"/>
  <line x1="360" y1="220" x2="410" y2="200" class="line"/>
  <rect x="412" y="192" width="36" height="18" rx="4" class="label-bg"/>
  <text x="416" y="204" text-anchor="start" class="label">O₂</text>

  <!-- Inverted cylinder -->
  <path d="M290,250 L290,310 Q290,320 300,320 L330,320 Q340,320 340,310 L340,250" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" fill-opacity="0.5"/>
  <text x="315" y="235" text-anchor="middle" class="sublabel">Collect gas</text>

  <!-- Counting -->
  <rect x="60" y="340" width="130" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="125" y="360" text-anchor="middle" class="label">Count bubbles</text>
  <text x="125" y="378" text-anchor="middle" class="sublabel">per minute</text>
  <line x1="190" y1="365" x2="250" y2="340" class="line"/>

  <!-- Graph panel -->
  <rect x="480" y="60" width="360" height="300" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="660" y="85" text-anchor="middle" class="label">Rate vs light intensity</text>

  <!-- Graph axes -->
  <line x1="520" y1="320" x2="800" y2="320" class="axis" marker-end="url(#arrow-head)"/>
  <line x1="520" y1="320" x2="520" y2="110" class="axis" marker-end="url(#arrow-head)"/>
  <text x="660" y="345" text-anchor="middle" class="sublabel">Light intensity</text>
  <text x="490" y="220" text-anchor="middle" class="sublabel" transform="rotate(-90 490 220)">Rate</text>

  <!-- Grid -->
  <line x1="520" y1="280" x2="800" y2="280" class="grid"/>
  <line x1="520" y1="240" x2="800" y2="240" class="grid"/>
  <line x1="520" y1="200" x2="800" y2="200" class="grid"/>
  <line x1="520" y1="160" x2="800" y2="160" class="grid"/>
  <line x1="520" y1="120" x2="800" y2="120" class="grid"/>

  <!-- Curve -->
  <path d="M520,300 Q580,280 640,220 T760,160" class="curve"/>

  <!-- Inverse square law box -->
  <rect x="480" y="380" width="360" height="110" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="660" y="405" text-anchor="middle" class="label">Inverse square law</text>
  <text x="660" y="430" text-anchor="middle" class="sublabel">Rate ∝ 1 ÷ d²</text>
  <text x="660" y="450" text-anchor="middle" class="sublabel">Double the distance → light falls to ¼</text>
  <text x="660" y="470" text-anchor="middle" class="sublabel">Rate drops to roughly one quarter</text>
</svg>