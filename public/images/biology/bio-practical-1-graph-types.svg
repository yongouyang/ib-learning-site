<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a graph type</title>
  <desc id="desc">Four example graphs: line graph, bar chart, histogram, and scatter graph, with notes on when to use each.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #374151; }
      .axis { stroke: #4b5563; stroke-width: 2; fill: none; }
      .bar { stroke: #15803d; stroke-width: 1.5; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Graphing and Data Presentation</text>

  <!-- Line graph panel -->
  <rect x="30" y="55" width="360" height="190" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="210" y="78" text-anchor="middle" class="panel-title">Line graph</text>
  <text x="210" y="94" text-anchor="middle" class="sublabel">Both variables continuous</text>

  <line x1="70" y1="210" x2="70" y2="110" class="axis"/>
  <line x1="70" y1="210" x2="340" y2="210" class="axis"/>
  <text x="56" y="120" class="sublabel" transform="rotate(-90 56 160)">Rate</text>
  <text x="205" y="235" text-anchor="middle" class="sublabel">Time</text>

  <polyline points="70,190 130,170 190,140 250,110 310,100" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="70" cy="190" r="3" fill="#16a34a"/>
  <circle cx="130" cy="170" r="3" fill="#16a34a"/>
  <circle cx="190" cy="140" r="3" fill="#16a34a"/>
  <circle cx="250" cy="110" r="3" fill="#16a34a"/>
  <circle cx="310" cy="100" r="3" fill="#16a34a"/>

  <!-- Bar chart panel -->
  <rect x="410" y="55" width="360" height="190" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="590" y="78" text-anchor="middle" class="panel-title">Bar chart</text>
  <text x="590" y="94" text-anchor="middle" class="sublabel">Independent variable is categorical</text>

  <line x1="450" y1="210" x2="450" y2="110" class="axis"/>
  <line x1="450" y1="210" x2="720" y2="210" class="axis"/>
  <text x="420" y="120" class="sublabel" transform="rotate(-90 420 160)">Zone of inhibition (mm)</text>
  <text x="585" y="235" text-anchor="middle" class="sublabel">Antimicrobial</text>

  <rect x="475" y="150" width="45" height="60" class="bar" fill="#86efac"/>
  <rect x="540" y="120" width="45" height="90" class="bar" fill="#86efac"/>
  <rect x="605" y="170" width="45" height="40" class="bar" fill="#86efac"/>
  <rect x="670" y="140" width="45" height="70" class="bar" fill="#86efac"/>
  <text x="497" y="230" text-anchor="middle" class="sublabel">A</text>
  <text x="562" y="230" text-anchor="middle" class="sublabel">B</text>
  <text x="627" y="230" text-anchor="middle" class="sublabel">C</text>
  <text x="692" y="230" text-anchor="middle" class="sublabel">D</text>

  <!-- Histogram panel -->
  <rect x="30" y="260" width="360" height="190" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="210" y="283" text-anchor="middle" class="panel-title">Histogram</text>
  <text x="210" y="299" text-anchor="middle" class="sublabel">Continuous data grouped in intervals</text>

  <line x1="70" y1="415" x2="70" y2="315" class="axis"/>
  <line x1="70" y1="415" x2="340" y2="415" class="axis"/>
  <text x="56" y="325" class="sublabel" transform="rotate(-90 56 365)">Frequency</text>
  <text x="205" y="440" text-anchor="middle" class="sublabel">Plant height (cm)</text>

  <rect x="85" y="375" width="60" height="40" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="145" y="355" width="60" height="60" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="205" y="325" width="60" height="90" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="265" y="365" width="60" height="50" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="455" text-anchor="middle" class="sublabel">0–10</text>
  <text x="175" y="455" text-anchor="middle" class="sublabel">11–20</text>
  <text x="235" y="455" text-anchor="middle" class="sublabel">21–30</text>
  <text x="295" y="455" text-anchor="middle" class="sublabel">31–40</text>

  <!-- Scatter graph panel -->
  <rect x="410" y="260" width="360" height="190" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="590" y="283" text-anchor="middle" class="panel-title">Scatter graph</text>
  <text x="590" y="299" text-anchor="middle" class="sublabel">Looking for correlation</text>

  <line x1="450" y1="415" x2="450" y2="315" class="axis"/>
  <line x1="450" y1="415" x2="720" y2="415" class="axis"/>
  <text x="420" y="325" class="sublabel" transform="rotate(-90 420 365)">Hand span (cm)</text>
  <text x="585" y="440" text-anchor="middle" class="sublabel">Height (cm)</text>

  <circle cx="480" cy="395" r="4" fill="#f97316"/>
  <circle cx="510" cy="375" r="4" fill="#f97316"/>
  <circle cx="540" cy="380" r="4" fill="#f97316"/>
  <circle cx="570" cy="355" r="4" fill="#f97316"/>
  <circle cx="600" cy="340" r="4" fill="#f97316"/>
  <circle cx="630" cy="330" r="4" fill="#f97316"/>
  <circle cx="660" cy="315" r="4" fill="#f97316"/>
  <circle cx="690" cy="305" r="4" fill="#f97316"/>
  <line x1="470" y1="405" x2="700" y2="295" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
</svg>