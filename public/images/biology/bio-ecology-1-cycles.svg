<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Carbon and Nitrogen Cycles</title>
  <desc id="desc">Two diagrams side by side: the carbon cycle showing photosynthesis, feeding, respiration, decomposition and combustion; and the nitrogen cycle showing fixation, nitrification, assimilation, ammonification and denitrification.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#f9fafb" rx="12"/>
  <text x="440" y="34" text-anchor="middle" class="title">Carbon and Nitrogen Cycles</text>

  <!-- Carbon cycle panel -->
  <rect x="30" y="55" width="400" height="445" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="230" y="82" text-anchor="middle" class="panel-title">Carbon cycle</text>

  <!-- Atmosphere -->
  <rect x="145" y="110" width="170" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="135" text-anchor="middle" class="label">Atmosphere (CO₂)</text>
  <text x="230" y="152" text-anchor="middle" class="sublabel">Carbon enters air</text>

  <!-- Plant -->
  <g transform="translate(155, 220)">
    <rect x="35" y="50" width="8" height="40" fill="#78350f"/>
    <path d="M39,50 Q10,20 0,40 Q25,55 39,50 Z" fill="#16a34a"/>
    <path d="M39,35 Q60,5 80,25 Q60,45 39,35 Z" fill="#16a34a"/>
    <path d="M39,20 Q20,0 10,15 Q25,30 39,20 Z" fill="#16a34a"/>
  </g>
  <text x="195" y="325" text-anchor="middle" class="label">Producers</text>
  <text x="195" y="340" text-anchor="middle" class="sublabel">Photosynthesis</text>

  <!-- Animal -->
  <ellipse cx="340" cy="280" rx="35" ry="22" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
  <ellipse cx="320" cy="265" r="15" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
  <circle cx="316" cy="262" r="2.5" fill="#1f2937"/>
  <circle cx="326" cy="262" r="2.5" fill="#1f2937"/>
  <text x="340" y="325" text-anchor="middle" class="label">Consumers</text>

  <!-- Decomposers -->
  <rect x="170" y="410" width="120" height="45" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="230" y="430" text-anchor="middle" class="label">Decomposers</text>
  <text x="230" y="446" text-anchor="middle" class="sublabel">Bacteria &amp; fungi</text>

  <!-- Fossil fuels -->
  <rect x="340" y="400" width="70" height="55" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
  <text x="375" y="425" text-anchor="middle" class="label">Fossil</text>
  <text x="375" y="442" text-anchor="middle" class="label">fuels</text>

  <!-- Arrows: all rerouted in the review redesign (fuchsia review markers) -->
  <!-- Photosynthesis: atmosphere -> producers (left of the respiration pair) -->
  <line x1="170" y1="165" x2="170" y2="213" class="arrow" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <!-- Respiration: producers -> atmosphere -->
  <line x1="205" y1="213" x2="205" y2="165" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <!-- Feeding: producers -> consumers -->
  <line x1="240" y1="280" x2="300" y2="280" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Death & waste: producers and consumers -> decomposers -->
  <line x1="195" y1="348" x2="195" y2="406" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="325" y1="305" x2="262" y2="406" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Decomposition: decomposers -> atmosphere (outer-left elbow, no crossings) -->
  <path d="M168,432 L60,432 L60,137 L142,137" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Fossilisation: decomposers -> fossil fuels -->
  <line x1="292" y1="432" x2="336" y2="432" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Combustion: fossil fuels -> atmosphere (outer-right elbow, no crossings) -->
  <path d="M385,400 L385,137 L318,137" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <text x="160" y="192" text-anchor="end" class="sublabel">Photosynthesis</text>
  <text x="215" y="192" text-anchor="start" class="sublabel">Respiration</text>
  <text x="270" y="266" text-anchor="middle" class="sublabel">Feeding</text>
  <text x="250" y="358" text-anchor="middle" class="sublabel">Death &amp; waste</text>
  <text x="114" y="424" text-anchor="middle" class="sublabel">Decomposition</text>
  <text x="397" y="270" text-anchor="middle" class="sublabel" transform="rotate(-90 397 270)">Combustion</text>

  <!-- Nitrogen cycle panel -->
  <rect x="450" y="55" width="400" height="445" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="650" y="82" text-anchor="middle" class="panel-title">Nitrogen cycle</text>

  <!-- Atmosphere N2 -->
  <rect x="565" y="110" width="170" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="135" text-anchor="middle" class="label">Atmosphere (N₂)</text>
  <text x="650" y="152" text-anchor="middle" class="sublabel">78% unusable gas</text>

  <!-- Nitrogen fixation bacteria -->
  <rect x="640" y="215" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="237" text-anchor="middle" class="label">Nitrogen fixation</text>
  <text x="700" y="253" text-anchor="middle" class="sublabel">N₂ → NH₄⁺</text>

  <!-- Nitrification -->
  <rect x="640" y="290" width="120" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="312" text-anchor="middle" class="label">Nitrification</text>
  <text x="700" y="328" text-anchor="middle" class="sublabel">NH₄⁺ → NO₃⁻</text>

  <!-- Plants -->
  <g transform="translate(595, 385)">
    <rect x="35" y="40" width="8" height="35" fill="#78350f"/>
    <path d="M39,40 Q15,15 5,30 Q25,45 39,40 Z" fill="#16a34a"/>
    <path d="M39,25 Q60,5 75,20 Q55,35 39,25 Z" fill="#16a34a"/>
  </g>
  <text x="633" y="472" text-anchor="middle" class="label">Assimilation</text>
  <text x="633" y="488" text-anchor="middle" class="sublabel">Plants absorb nitrates</text>

  <!-- Decomposers / ammonification -->
  <rect x="470" y="380" width="120" height="50" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="530" y="402" text-anchor="middle" class="label">Ammonification</text>
  <text x="530" y="418" text-anchor="middle" class="sublabel">Dead matter → NH₄⁺</text>

  <!-- Denitrification -->
  <rect x="680" y="380" width="120" height="45" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
  <text x="740" y="402" text-anchor="middle" class="label">Denitrification</text>
  <text x="740" y="418" text-anchor="middle" class="sublabel">NO₃⁻ → N₂</text>

  <!-- Arrows: all rerouted in the review redesign (fuchsia review markers) -->
  <!-- Atmosphere -> fixation (lightning note alongside) -->
  <line x1="700" y1="165" x2="700" y2="213" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Fixation -> nitrification (NH4+) -->
  <line x1="700" y1="265" x2="700" y2="288" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Nitrification -> plants (assimilation) -->
  <line x1="655" y1="342" x2="632" y2="383" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Plants -> ammonification (death & waste) -->
  <line x1="620" y1="455" x2="575" y2="432" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Ammonification -> nitrification (NH4+, elbow around the plants) -->
  <path d="M530,380 L530,315 L638,315" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Nitrification -> denitrification (NO3-) -->
  <line x1="730" y1="342" x2="730" y2="378" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <!-- Denitrification -> atmosphere (outer-right elbow, no crossings) -->
  <path d="M800,402 L822,402 L822,137 L737,137" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <text x="688" y="192" text-anchor="end" class="sublabel">Lightning also fixes small amounts</text>
</svg>