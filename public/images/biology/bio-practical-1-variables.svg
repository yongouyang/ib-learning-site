<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">Variables in a scientific investigation</title>
  <desc id="desc">Diagram of a pondweed photosynthesis experiment showing the independent variable, dependent variable, and variables that must be controlled.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#f9fafb" rx="12"/>
  <text x="390" y="34" text-anchor="middle" class="title">Variables in a Scientific Investigation</text>

  <!-- Beaker -->
  <path d="M300,160 L300,320 Q300,345 325,345 L455,345 Q480,345 480,320 L480,160" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" fill-opacity="0.5"/>
  <ellipse cx="390" cy="160" rx="90" ry="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" fill-opacity="0.5"/>

  <!-- Water -->
  <path d="M310,210 L310,315 Q310,335 330,335 L450,335 Q470,335 470,315 L470,210 Q390,225 310,210" fill="#bae6fd" stroke="none" opacity="0.7"/>

  <!-- Pondweed stem -->
  <path d="M390,335 Q385,280 390,230 Q395,190 390,170" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="390" cy="170" rx="22" ry="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <ellipse cx="382" cy="205" rx="18" ry="10" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(-20 382 205)"/>
  <ellipse cx="398" cy="250" rx="18" ry="10" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(20 398 250)"/>

  <!-- Bubbles -->
  <circle cx="370" cy="200" r="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="360" cy="170" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="380" cy="145" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="410" cy="185" r="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="425" cy="155" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Light source -->
  <rect x="80" y="200" width="90" height="60" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="125" y="230" text-anchor="middle" class="label">Light source</text>
  <text x="125" y="246" text-anchor="middle" class="sublabel">(changed by you)</text>

  <!-- Light rays -->
  <line x1="170" y1="220" x2="290" y2="220" class="arrow" stroke="#f59e0b" marker-end="url(#arrow-green)"/>
  <line x1="170" y1="240" x2="290" y2="250" class="arrow" stroke="#f59e0b" marker-end="url(#arrow-green)"/>

  <!-- IV label -->
  <line x1="200" y1="180" x2="200" y2="150" class="line"/>
  <rect x="140" y="131" width="120" height="18" rx="4" class="label-bg"/>
  <text x="145" y="144" class="label">Independent variable</text>

  <!-- DV label -->
  <line x1="360" y1="130" x2="360" y2="105" class="line"/>
  <rect x="280" y="86" width="160" height="18" rx="4" class="label-bg"/>
  <text x="285" y="99" class="label">Dependent variable: O₂ bubbles</text>

  <!-- Controlled variables panel -->
  <rect x="560" y="130" width="190" height="190" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="655" y="155" text-anchor="middle" class="label">Controlled variables</text>
  <text x="655" y="172" text-anchor="middle" class="sublabel">(kept constant)</text>

  <rect x="580" y="190" width="150" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="655" y="208" text-anchor="middle" class="label">Temperature</text>

  <rect x="580" y="230" width="150" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="655" y="248" text-anchor="middle" class="label">CO₂ concentration</text>

  <rect x="580" y="270" width="150" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="655" y="288" text-anchor="middle" class="label">Type/length of pondweed</text>

  <!-- Connection to beaker -->
  <line x1="560" y1="225" x2="485" y2="225" class="line"/>
  <text x="520" y="360" text-anchor="middle" class="sublabel">Change only ONE variable and measure ONE variable.</text>
</svg>