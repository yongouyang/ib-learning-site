<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
  <title id="title">Structure of a villus and its two absorption routes</title>
  <desc id="desc">A finger-like villus projecting into the small-intestine lumen. Microvilli cover its one-cell-thick epithelium. Inside are a branching blood capillary network and a central blind-ended lacteal. Glucose and amino acids enter the blood capillaries for transport in blood; fatty acids and glycerol enter the lacteal for transport in lymph.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .route { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 600; fill: #1f2937; }
      .leader { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .brush { stroke: #047857; stroke-width: 3; stroke-linecap: round; }
    </style>
    <marker id="arrow-blood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-lymph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a16207"/>
    </marker>
  </defs>

  <rect width="900" height="800" rx="12" fill="#f9fafb"/>
  <text x="450" y="36" text-anchor="middle" class="title">A villus: absorption into blood and lymph</text>
  <text x="450" y="70" text-anchor="middle" class="label">Lumen of the small intestine</text>
  <text x="450" y="91" text-anchor="middle" class="sublabel">digested food molecules in solution</text>

