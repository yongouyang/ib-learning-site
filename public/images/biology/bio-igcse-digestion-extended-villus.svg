  <text x="685" y="575" class="label">Villus core</text>
  <text x="685" y="598" class="sublabel">connective tissue</text>
  <path d="M675 568 H590 L530 535" class="leader"/>

  <rect x="55" y="660" width="790" height="45" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="450" y="689" text-anchor="middle" class="route">Glucose + amino acids → blood capillaries → blood</text>

  <rect x="55" y="720" width="790" height="45" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="450" y="749" text-anchor="middle" class="route">Fatty acids + glycerol → lacteal → lymph</text>
</svg>
