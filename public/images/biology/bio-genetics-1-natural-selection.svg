<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Natural Selection in Peppered Moths</title>
  <desc id="desc">Diagram showing how pale peppered moths were camouflaged on clean lichen-covered trees, while dark moths survived better on soot-darkened trees during the Industrial Revolution.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#f9fafb" rx="12"/>
  <text x="460" y="34" text-anchor="middle" class="title">Natural Selection: Peppered Moths</text>

  <!-- Before Industrial Revolution -->
  <rect x="40" y="55" width="410" height="340" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="245" y="80" text-anchor="middle" class="panel-title" style="font-size:14px; font-weight:700; fill:#374151">Before Industrial Revolution</text>
  <text x="245" y="98" text-anchor="middle" class="sublabel">Clean, lichen-covered trees</text>

  <!-- Tree trunk -->
  <rect x="180" y="120" width="130" height="250" rx="20" fill="#d6d3d1" stroke="#a8a29e" stroke-width="2"/>
  <!-- Lichen patches -->
  <ellipse cx="210" cy="160" rx="18" ry="12" fill="#fef3c7" opacity="0.9"/>
  <ellipse cx="270" cy="200" rx="22" ry="14" fill="#fef3c7" opacity="0.9"/>
  <ellipse cx="225" cy="260" rx="16" ry="10" fill="#fef3c7" opacity="0.9"/>
  <ellipse cx="285" cy="310" rx="20" ry="13" fill="#fef3c7" opacity="0.9"/>

  <!-- Pale moths (camouflaged) -->
  <ellipse cx="210" cy="170" rx="16" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="1" transform="rotate(-10 210 170)"/>
  <ellipse cx="270" cy="205" rx="16" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="1" transform="rotate(10 270 205)"/>
  <ellipse cx="230" cy="270" rx="16" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="1" transform="rotate(-5 230 270)"/>

  <!-- Dark moth (visible, being targeted) -->
  <ellipse cx="285" cy="315" rx="16" ry="8" fill="#374151" stroke="#111827" stroke-width="1" transform="rotate(5 285 315)"/>

  <!-- Bird attacking dark moth -->
  <g transform="translate(300, 250)">
    <path d="M0,0 Q20,-15 35,0 Q25,10 0,0" fill="#ef4444"/>
    <circle cx="28" cy="-2" r="2.5" fill="#111827"/>
    <path d="M35,-2 L42,-5 L35,2" fill="#f59e0b"/>
  </g>
  <line x1="310" y1="270" x2="285" y2="310" class="line" stroke="#ef4444" marker-end="url(#arrow)"/>
  <rect x="295" y="275" width="95" height="18" rx="4" class="label-bg"/>
  <text x="299" y="288" class="label" fill="#b91c1c">Eaten (visible)</text>

  <!-- Pale moth label -->
  <line x1="180" y1="160" x2="155" y2="140" class="line"/>
  <rect x="25" y="122" width="130" height="18" rx="4" class="label-bg"/>
  <text x="29" y="135" class="label">Camouflaged</text>
  <rect x="25" y="142" width="130" height="16" rx="4" class="label-bg"/>
  <text x="29" y="154" class="sublabel">Survives &amp; reproduces</text>

  <!-- After Industrial Revolution -->
  <rect x="470" y="55" width="410" height="340" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="675" y="80" text-anchor="middle" class="panel-title" style="font-size:14px; font-weight:700; fill:#374151">During Industrial Revolution</text>
  <text x="675" y="98" text-anchor="middle" class="sublabel">Pollution darkened tree trunks</text>

  <!-- Dark tree trunk -->
  <rect x="610" y="120" width="130" height="250" rx="20" fill="#44403c" stroke="#1c1917" stroke-width="2"/>

  <!-- Dark moths (camouflaged) -->
  <ellipse cx="640" cy="165" rx="16" ry="8" fill="#374151" stroke="#111827" stroke-width="1" transform="rotate(-10 640 165)"/>
  <ellipse cx="700" cy="210" rx="16" ry="8" fill="#374151" stroke="#111827" stroke-width="1" transform="rotate(10 700 210)"/>
  <ellipse cx="660" cy="275" rx="16" ry="8" fill="#374151" stroke="#111827" stroke-width="1" transform="rotate(-5 660 275)"/>

  <!-- Pale moth (visible, being targeted) -->
  <ellipse cx="705" cy="320" rx="16" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="1" transform="rotate(5 705 320)"/>

  <!-- Bird attacking pale moth -->
  <g transform="translate(720, 255)">
    <path d="M0,0 Q20,-15 35,0 Q25,10 0,0" fill="#ef4444"/>
    <circle cx="28" cy="-2" r="2.5" fill="#111827"/>
    <path d="M35,-2 L42,-5 L35,2" fill="#f59e0b"/>
  </g>
  <line x1="730" y1="275" x2="705" y2="315" class="line" stroke="#ef4444" marker-end="url(#arrow)"/>
  <rect x="725" y="280" width="95" height="18" rx="4" class="label-bg"/>
  <text x="729" y="293" class="label" fill="#b91c1c">Eaten (visible)</text>

  <!-- Dark moth label -->
  <line x1="740" y1="165" x2="790" y2="140" class="line"/>
  <rect x="790" y="127" width="130" height="18" rx="4" class="label-bg"/>
  <text x="794" y="140" class="label">Camouflaged</text>
  <rect x="790" y="147" width="130" height="16" rx="4" class="label-bg"/>
  <text x="794" y="159" class="sublabel">Survives &amp; reproduces</text>

  <!-- Conclusion -->
  <rect x="180" y="405" width="560" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="460" y="429" text-anchor="middle" class="sublabel">Over generations, the frequency of the advantageous allele increases — the population evolves.</text>
</svg>