<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Human Female Reproductive System</title>
  <desc id="desc">A labelled diagram of the female reproductive system showing the ovaries, oviducts, uterus, cervix and vagina.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="760" height="500" fill="#f9fafb" rx="12"/>
  <text x="380" y="34" text-anchor="middle" class="title">Human Female Reproductive System</text>

  <!-- Body outline -->
  <path d="M340,70 Q290,70 280,120 L280,450 Q280,470 300,470 L460,470 Q480,470 480,450 L480,120 Q470,70 420,70 Z" fill="#fce7f3" stroke="#f472b6" stroke-width="2" opacity="0.4"/>

  <!-- Uterus -->
  <path d="M360,180 Q340,180 340,220 L340,320 Q340,370 380,370 Q420,370 420,320 L420,220 Q420,180 400,180 Q390,200 380,180 Q370,200 360,180 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>

  <!-- Endometrium -->
  <path d="M350,220 Q380,240 410,220" fill="none" stroke="#be185d" stroke-width="2" opacity="0.5"/>
  <path d="M350,320 Q380,340 410,320" fill="none" stroke="#be185d" stroke-width="2" opacity="0.5"/>

  <!-- Cervix -->
  <rect x="365" y="370" width="30" height="45" rx="6" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
  <line x1="430" y1="390" x2="510" y2="390" class="line"/>
  <rect x="515" y="381" width="60" height="18" rx="4" class="label-bg"/>
  <text x="520" y="393" class="label">Cervix</text>

  <!-- Vagina -->
  <rect x="360" y="415" width="40" height="70" rx="8" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
  <line x1="430" y1="445" x2="510" y2="445" class="line"/>
  <rect x="515" y="436" width="60" height="18" rx="4" class="label-bg"/>
  <text x="520" y="448" class="label">Vagina</text>

  <!-- Uterus label -->
  <line x1="340" y1="280" x2="260" y2="280" class="line"/>
  <rect x="175" y="271" width="80" height="18" rx="4" class="label-bg"/>
  <text x="180" y="283" class="label">Uterus</text>
  <text x="180" y="300" class="sublabel">(womb)</text>

  <!-- Oviducts -->
  <path d="M340,220 Q280,200 270,160 Q260,130 290,130" fill="none" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <path d="M420,220 Q480,200 490,160 Q500,130 470,130" fill="none" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <line x1="270" y1="160" x2="190" y2="160" class="line"/>
  <rect x="95" y="151" width="90" height="18" rx="4" class="label-bg"/>
  <text x="100" y="163" class="label">Oviduct</text>

  <!-- Ovaries -->
  <ellipse cx="290" cy="130" rx="22" ry="16" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <ellipse cx="470" cy="130" rx="22" ry="16" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <line x1="290" y1="110" x2="230" y2="90" class="line"/>
  <rect x="150" y="81" width="75" height="18" rx="4" class="label-bg"/>
  <text x="155" y="93" class="label">Ovary</text>
  <text x="155" y="110" class="sublabel">Releases eggs</text>

  <!-- Egg release -->
  <circle cx="295" cy="145" r="7" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M295,152 Q300,180 310,200" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="240" y="210" class="sublabel">Ovulation</text>

  <!-- Egg cell inset -->
  <rect x="540" y="110" width="170" height="110" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="8"/>
  <text x="625" y="135" text-anchor="middle" class="label">Egg cell (ovum)</text>
  <circle cx="625" cy="175" r="28" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <circle cx="625" cy="175" r="10" fill="#f472b6" opacity="0.6"/>
  <text x="625" y="220" text-anchor="middle" class="sublabel">Large cell with nutrients</text>
</svg>