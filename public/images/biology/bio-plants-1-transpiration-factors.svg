<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Factors Affecting Transpiration Rate</title>
  <desc id="desc">Diagram showing how light intensity, temperature, wind, and humidity affect the rate of transpiration from a leaf.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Factors Affecting Transpiration Rate</text>

  <!-- Leaf in centre -->
  <path d="M360,240 Q400,180 440,240 Q400,300 360,240" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  <line x1="400" y1="210" x2="400" y2="270" stroke="#16a34a" stroke-width="2"/>
  <line x1="380" y1="235" x2="420" y2="245" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Stoma releasing water vapour -->
  <line x1="400" y1="270" x2="400" y2="310" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="385" y1="275" x2="370" y2="305" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="415" y1="275" x2="430" y2="305" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>

  <!-- Factor 1: Light -->
  <g transform="translate(120, 110)">
    <rect x="0" y="0" width="150" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="75" y="25" text-anchor="middle" class="panel-title">Light intensity</text>
    <circle cx="75" cy="55" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <line x1="75" y1="37" x2="75" y2="30" stroke="#ca8a04" stroke-width="2"/>
    <line x1="75" y1="73" x2="75" y2="80" stroke="#ca8a04" stroke-width="2"/>
    <line x1="57" y1="55" x2="50" y2="55" stroke="#ca8a04" stroke-width="2"/>
    <line x1="93" y1="55" x2="100" y2="55" stroke="#ca8a04" stroke-width="2"/>
    <text x="75" y="100" text-anchor="middle" class="sublabel">More light →</text>
    <text x="75" y="115" text-anchor="middle" class="sublabel">stomata open wider</text>
  </g>

  <!-- Factor 2: Temperature -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="150" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="75" y="25" text-anchor="middle" class="panel-title">Temperature</text>
    <circle cx="55" cy="60" r="8" fill="#3b82f6"/>
    <circle cx="75" cy="50" r="10" fill="#3b82f6"/>
    <circle cx="95" cy="65" r="7" fill="#3b82f6"/>
    <line x1="55" y1="75" x2="95" y2="75" stroke="#ef4444" stroke-width="2"/>
    <path d="M85,70 L95,75 L85,80" fill="#ef4444"/>
    <text x="75" y="100" text-anchor="middle" class="sublabel">Higher temp →</text>
    <text x="75" y="115" text-anchor="middle" class="sublabel">faster evaporation</text>
  </g>

  <!-- Factor 3: Wind -->
  <g transform="translate(120, 320)">
    <rect x="0" y="0" width="150" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="75" y="25" text-anchor="middle" class="panel-title">Air movement</text>
    <path d="M25,55 Q45,45 65,55 Q85,65 105,55" fill="none" stroke="#6b7280" stroke-width="2"/>
    <path d="M25,70 Q45,60 65,70 Q85,80 105,70" fill="none" stroke="#6b7280" stroke-width="2"/>
    <path d="M95,50 L110,55 L95,60" fill="#6b7280"/>
    <text x="75" y="100" text-anchor="middle" class="sublabel">Wind removes</text>
    <text x="75" y="115" text-anchor="middle" class="sublabel">humid boundary layer</text>
  </g>

  <!-- Factor 4: Humidity -->
  <g transform="translate(530, 320)">
    <rect x="0" y="0" width="150" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="75" y="25" text-anchor="middle" class="panel-title">Humidity</text>
    <circle cx="55" cy="60" r="5" fill="#3b82f6" opacity="0.6"/>
    <circle cx="75" cy="50" r="6" fill="#3b82f6" opacity="0.6"/>
    <circle cx="95" cy="65" r="5" fill="#3b82f6" opacity="0.6"/>
    <circle cx="65" cy="70" r="4" fill="#3b82f6" opacity="0.6"/>
    <circle cx="85" cy="55" r="4" fill="#3b82f6" opacity="0.6"/>
    <text x="75" y="100" text-anchor="middle" class="sublabel">High humidity →</text>
    <text x="75" y="115" text-anchor="middle" class="sublabel">shallow gradient</text>
  </g>

  <!-- Result arrows -->
  <line x1="270" y1="170" x2="340" y2="220" class="arrow" stroke="#16a34a" marker-end="url(#arrow-red)"/>
  <line x1="530" y1="170" x2="460" y2="220" class="arrow" stroke="#16a34a" marker-end="url(#arrow-red)"/>
  <line x1="270" y1="380" x2="340" y2="290" class="arrow" stroke="#16a34a" marker-end="url(#arrow-red)"/>
  <line x1="530" y1="380" x2="460" y2="290" class="arrow" stroke="#16a34a" marker-end="url(#arrow-red)"/>

  <text x="400" y="370" text-anchor="middle" class="label">Rate of transpiration</text>
</svg>