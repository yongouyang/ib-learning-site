<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">The Menstrual Cycle</title>
  <desc id="desc">A 28-day menstrual cycle diagram showing the uterus lining changes, ovulation and key hormone levels.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .axis { stroke: #9ca3af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Puberty and the Menstrual Cycle</text>

  <!-- Cycle timeline -->
  <rect x="60" y="60" width="680" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="120" y="85" text-anchor="middle" class="label">Days 1-5</text>
  <text x="120" y="105" text-anchor="middle" class="sublabel">Menstruation</text>
  <text x="120" y="125" text-anchor="middle" class="sublabel">Lining sheds</text>

  <text x="300" y="85" text-anchor="middle" class="label">Days 5-14</text>
  <text x="300" y="105" text-anchor="middle" class="sublabel">Lining rebuilds</text>
  <text x="300" y="125" text-anchor="middle" class="sublabel">Oestrogen rises</text>

  <text x="480" y="85" text-anchor="middle" class="label">Day ~14</text>
  <text x="480" y="105" text-anchor="middle" class="sublabel">Ovulation</text>
  <text x="480" y="125" text-anchor="middle" class="sublabel">Egg released</text>

  <text x="660" y="85" text-anchor="middle" class="label">Days 14-28</text>
  <text x="660" y="105" text-anchor="middle" class="sublabel">Progesterone</text>
  <text x="660" y="125" text-anchor="middle" class="sublabel">maintains lining</text>

  <!-- Dividers -->
  <line x1="210" y1="70" x2="210" y2="140" class="line"/>
  <line x1="390" y1="70" x2="390" y2="140" class="line"/>
  <line x1="570" y1="70" x2="570" y2="140" class="line"/>

  <!-- Uterus lining diagram -->
  <text x="400" y="180" text-anchor="middle" class="label">Uterus lining (endometrium) thickness through the cycle</text>

  <!-- Uterus shapes -->
  <g transform="translate(0,0)">
    <path d="M140,240 Q120,240 120,280 L120,310 Q120,330 150,330 Q160,330 160,310 L160,280 Q160,240 140,240 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
    <path d="M125,280 Q140,290 155,280" fill="none" stroke="#be185d" stroke-width="4"/>
    <text x="140" y="360" text-anchor="middle" class="sublabel">Day 1-5</text>
    <text x="140" y="375" text-anchor="middle" class="sublabel">Thin / shedding</text>
  </g>

  <g transform="translate(0,0)">
    <path d="M300,230 Q270,230 270,280 L270,310 Q270,335 300,335 Q330,335 330,310 L330,280 Q330,230 300,230 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
    <path d="M280,280 Q300,305 320,280" fill="none" stroke="#be185d" stroke-width="8"/>
    <text x="300" y="360" text-anchor="middle" class="sublabel">Day 10</text>
    <text x="300" y="375" text-anchor="middle" class="sublabel">Thickening</text>
  </g>

  <g transform="translate(0,0)">
    <path d="M460,220 Q420,220 420,280 L420,310 Q420,345 460,345 Q500,345 500,310 L500,280 Q500,220 460,220 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
    <path d="M430,280 Q460,315 490,280" fill="none" stroke="#be185d" stroke-width="14"/>
    <circle cx="510" cy="250" r="8" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="360" text-anchor="middle" class="sublabel">Day 14</text>
    <text x="460" y="375" text-anchor="middle" class="sublabel">Ovulation</text>
  </g>

  <g transform="translate(0,0)">
    <path d="M620,220 Q580,220 580,280 L580,310 Q580,345 620,345 Q660,345 660,310 L660,280 Q660,220 620,220 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
    <path d="M590,280 Q620,320 650,280" fill="none" stroke="#be185d" stroke-width="16"/>
    <text x="620" y="360" text-anchor="middle" class="sublabel">Day 20-28</text>
    <text x="620" y="375" text-anchor="middle" class="sublabel">Maintained</text>
  </g>

  <!-- Hormone graph -->
  <text x="400" y="415" text-anchor="middle" class="label">Hormone levels</text>
  <line x1="80" y1="440" x2="720" y2="440" class="axis"/>
  <line x1="80" y1="440" x2="80" y2="500" class="axis"/>
  <line x1="80" y1="500" x2="720" y2="500" class="axis"/>
  <text x="80" y="515" text-anchor="middle" class="sublabel">Day 1</text>
  <text x="400" y="515" text-anchor="middle" class="sublabel">Day 14</text>
  <text x="720" y="515" text-anchor="middle" class="sublabel">Day 28</text>

  <!-- Oestrogen curve -->
  <path d="M80,480 Q200,480 280,440 Q360,400 400,440 Q500,460 720,440" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <!-- Progesterone curve -->
  <path d="M80,490 Q300,490 400,470 Q480,420 600,440 Q700,450 720,490" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <!-- LH spike -->
  <path d="M360,480 L400,420 L440,480" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- FSH curve -->
  <path d="M80,485 Q180,470 280,485 Q360,480 400,470 Q500,485 720,485" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Legend -->
  <rect x="520" y="453" width="190" height="48" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <line x1="530" y1="466" x2="550" y2="466" stroke="#22c55e" stroke-width="2.5"/>
  <text x="555" y="469" class="sublabel">Oestrogen</text>
  <line x1="530" y1="480" x2="550" y2="480" stroke="#f97316" stroke-width="2.5"/>
  <text x="555" y="483" class="sublabel">Progesterone</text>
  <line x1="630" y1="466" x2="650" y2="466" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="655" y="469" class="sublabel">LH surge</text>
  <line x1="630" y1="480" x2="650" y2="480" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="655" y="483" class="sublabel">FSH</text>
</svg>