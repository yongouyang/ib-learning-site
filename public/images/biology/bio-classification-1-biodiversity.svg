<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Biodiversity and Its Importance</title>
  <desc id="desc">A diagram showing the three levels of biodiversity and examples of ecosystem services that biodiversity provides.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .level-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #111827; }
      .box { stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="820" height="500" fill="#f9fafb" rx="12"/>
  <text x="410" y="36" text-anchor="middle" class="title">Biodiversity and Its Importance</text>

  <!-- Three levels -->
  <rect x="30" y="60" width="250" height="160" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="155" y="84" text-anchor="middle" class="level-title">Species diversity</text>
  <text x="155" y="110" text-anchor="middle" class="sublabel">Variety of different species</text>
  <circle cx="90" cy="145" r="14" fill="#4ade80"/>
  <circle cx="130" cy="150" r="10" fill="#22c55e"/>
  <path d="M165,135 Q180,125 195,135 L195,155 Q180,145 165,155 Z" fill="#16a34a"/>
  <ellipse cx="220" cy="145" rx="12" ry="8" fill="#86efac"/>
  <text x="155" y="185" text-anchor="middle" class="sublabel">Highest in rainforests</text>
  <text x="155" y="203" text-anchor="middle" class="sublabel">and coral reefs</text>

  <rect x="285" y="60" width="250" height="160" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="410" y="84" text-anchor="middle" class="level-title">Genetic diversity</text>
  <text x="410" y="110" text-anchor="middle" class="sublabel">Variation in genes within a species</text>
  <rect x="340" y="130" width="30" height="40" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="380" y="125" width="30" height="50" rx="4" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="420" y="135" width="30" height="30" rx="4" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="460" y="130" width="30" height="40" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="195" text-anchor="middle" class="sublabel">Helps populations survive</text>
  <text x="410" y="213" text-anchor="middle" class="sublabel">disease and change</text>

  <rect x="540" y="60" width="250" height="160" fill="#fef3c7" stroke="#f59e0b" class="box"/>
  <text x="665" y="84" text-anchor="middle" class="level-title">Ecosystem diversity</text>
  <text x="665" y="110" text-anchor="middle" class="sublabel">Variety of habitats and processes</text>
  <path d="M600,160 Q630,120 660,160 Q690,120 720,160" fill="none" stroke="#d97706" stroke-width="3"/>
  <path d="M610,165 L650,165 L640,140 Z" fill="#fbbf24"/>
  <path d="M670,165 L720,165 L705,135 Z" fill="#fbbf24"/>
  <text x="665" y="195" text-anchor="middle" class="sublabel">Forests, wetlands, grasslands,</text>
  <text x="665" y="213" text-anchor="middle" class="sublabel">oceans, deserts</text>

  <!-- Ecosystem services -->
  <rect x="30" y="250" width="760" height="170" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>
  <text x="410" y="280" text-anchor="middle" class="label">Why biodiversity matters: ecosystem services</text>

  <!-- Pollination -->
  <rect x="55" y="300" width="130" height="100" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <ellipse cx="95" cy="340" rx="12" ry="8" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <line x1="85" y1="335" x2="75" y2="325" stroke="#1f2937" stroke-width="2"/>
  <line x1="105" y1="335" x2="115" y2="325" stroke="#1f2937" stroke-width="2"/>
  <text x="120" y="345" text-anchor="middle" class="sublabel">Pollination</text>
  <text x="120" y="365" text-anchor="middle" class="sublabel">bees, butterflies</text>
  <text x="120" y="385" text-anchor="middle" class="sublabel">~75% of crops</text>

  <!-- Water purification -->
  <rect x="205" y="300" width="130" height="100" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <path d="M240,350 Q255,330 270,350 Q285,330 300,350" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="270" y="375" text-anchor="middle" class="sublabel">Water purification</text>
  <text x="270" y="393" text-anchor="middle" class="sublabel">wetlands filter</text>

  <!-- Climate regulation -->
  <rect x="355" y="300" width="130" height="100" fill="#d1fae5" stroke="#10b981" class="box"/>
  <path d="M390,360 L405,330 L420,360 L405,350 Z" fill="#22c55e"/>
  <ellipse cx="405" cy="365" rx="20" ry="8" fill="#16a34a"/>
  <text x="420" y="375" text-anchor="middle" class="sublabel">Climate regulation</text>
  <text x="420" y="393" text-anchor="middle" class="sublabel">forests absorb CO₂</text>

  <!-- Pest control -->
  <rect x="505" y="300" width="130" height="100" fill="#fee2e2" stroke="#ef4444" class="box"/>
  <circle cx="550" cy="345" r="12" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <path d="M565,350 L585,340" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="590" cy="338" r="6" fill="#ef4444"/>
  <text x="570" y="375" text-anchor="middle" class="sublabel">Pest control</text>
  <text x="570" y="393" text-anchor="middle" class="sublabel">predators regulate prey</text>

  <!-- Resources -->
  <rect x="655" y="300" width="115" height="100" fill="#f3e8ff" stroke="#9333ea" class="box"/>
  <rect x="680" y="335" width="30" height="40" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2" rx="4"/>
  <path d="M695,330 L695,315" stroke="#7e22ce" stroke-width="2"/>
  <ellipse cx="695" cy="310" rx="8" ry="5" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2"/>
  <text x="712" y="375" text-anchor="middle" class="sublabel">Resources</text>
  <text x="712" y="393" text-anchor="middle" class="sublabel">food, medicines</text>

  <!-- Threats -->
  <rect x="30" y="440" width="760" height="45" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="6"/>
  <text x="410" y="460" text-anchor="middle" class="sublabel">Threats: habitat loss, climate change, pollution, overexploitation, invasive species.</text>
  <text x="410" y="478" text-anchor="middle" class="sublabel">Current extinction rate is 100–1,000× the natural background rate.</text>
</svg>