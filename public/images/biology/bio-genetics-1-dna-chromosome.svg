<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">DNA, Genes, and Chromosomes</title>
  <desc id="desc">Diagram showing a cell nucleus containing chromosomes, a zoomed-in chromosome with a highlighted gene, and the DNA double helix with complementary base pairs A-T and C-G.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="920" height="480" fill="#f9fafb" rx="12"/>
  <text x="460" y="34" text-anchor="middle" class="title">DNA, Genes, and Chromosomes</text>

  <!-- Cell -->
  <circle cx="170" cy="240" r="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="3" opacity="0.5"/>
  <text x="170" y="115" text-anchor="middle" class="label">Body cell (2n)</text>

  <!-- Nucleus -->
  <circle cx="170" cy="240" r="65" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="170" y="245" text-anchor="middle" class="label">Nucleus</text>

  <!-- Chromosomes inside nucleus -->
  <g stroke="#7c3aed" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M145,225 Q155,205 165,225 Q175,245 185,225"/>
    <path d="M175,250 Q185,230 195,250 Q205,270 215,250"/>
    <path d="M130,255 Q140,235 150,255 Q160,275 170,255"/>
  </g>

  <!-- Zoom arrow -->
  <line x1="250" y1="240" x2="330" y2="240" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="225" text-anchor="middle" class="sublabel">zoom in</text>

  <!-- Enlarged chromosome -->
  <rect x="360" y="130" width="180" height="220" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" class="label">Chromosome</text>

  <!-- X-shaped chromosome -->
  <g stroke="#7c3aed" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M410,185 Q450,240 490,295"/>
    <path d="M490,185 Q450,240 410,295"/>
  </g>
  <!-- Centromere -->
  <circle cx="450" cy="240" r="9" fill="#a855f7" stroke="#6b21a8" stroke-width="2"/>

  <!-- Highlighted gene region -->
  <rect x="470" y="270" width="60" height="18" rx="4" fill="#fde047" opacity="0.8"/>
  <line x1="500" y1="290" x2="500" y2="323" class="line"/>
  <rect x="452" y="323" width="96" height="30" rx="4" class="label-bg"/>
  <text x="456" y="335" class="label">Gene</text>
  <text x="456" y="348" class="label">(DNA segment)</text>

  <!-- DNA double helix zoom -->
  <rect x="580" y="130" width="310" height="220" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="735" y="155" text-anchor="middle" class="label">DNA double helix</text>

  <!-- Helix strands -->
  <path d="M620,180 C660,180 660,300 700,300 C740,300 740,180 780,180 C820,180 820,300 860,300" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <path d="M620,300 C660,300 660,180 700,180 C740,180 740,300 780,300 C820,300 820,180 860,180" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

  <!-- Base pairs -->
  <line x1="632" y1="270" x2="648" y2="270" stroke="#10b981" stroke-width="4"/>
  <text x="625" y="265" text-anchor="end" class="sublabel" fill="#047857">A</text>
  <text x="660" y="265" text-anchor="start" class="sublabel" fill="#047857">T</text>

  <line x1="672" y1="210" x2="688" y2="210" stroke="#f97316" stroke-width="4"/>
  <text x="665" y="205" text-anchor="end" class="sublabel" fill="#c2410c">C</text>
  <text x="700" y="205" text-anchor="start" class="sublabel" fill="#c2410c">G</text>

  <line x1="712" y1="270" x2="728" y2="270" stroke="#10b981" stroke-width="4"/>
  <text x="705" y="265" text-anchor="end" class="sublabel" fill="#047857">T</text>
  <text x="740" y="265" text-anchor="start" class="sublabel" fill="#047857">A</text>

  <line x1="752" y1="210" x2="768" y2="210" stroke="#f97316" stroke-width="4"/>
  <text x="745" y="205" text-anchor="end" class="sublabel" fill="#c2410c">G</text>
  <text x="780" y="205" text-anchor="start" class="sublabel" fill="#c2410c">C</text>

  <line x1="792" y1="270" x2="808" y2="270" stroke="#10b981" stroke-width="4"/>
  <text x="785" y="265" text-anchor="end" class="sublabel" fill="#047857">A</text>
  <text x="820" y="265" text-anchor="start" class="sublabel" fill="#047857">T</text>

  <line x1="832" y1="210" x2="848" y2="210" stroke="#f97316" stroke-width="4"/>
  <text x="825" y="205" text-anchor="end" class="sublabel" fill="#c2410c">C</text>
  <text x="860" y="205" text-anchor="start" class="sublabel" fill="#c2410c">G</text>

  <!-- Base pairing label -->
  <line x1="735" y1="330" x2="735" y2="360" class="line"/>
  <rect x="667" y="360" width="136" height="18" rx="4" class="label-bg"/>
  <text x="671" y="373" class="label">A-T and C-G pairing</text>

  <!-- Diploid / haploid summary -->
  <rect x="60" y="390" width="380" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="250" y="412" text-anchor="middle" class="label">Human body cells: 46 chromosomes (23 pairs) = diploid (2n)</text>
  <text x="250" y="432" text-anchor="middle" class="sublabel">Gametes (sperm/egg): 23 single chromosomes = haploid (n)</text>

  <!-- Gamete icons -->
  <text x="580" y="412" text-anchor="middle" class="label">Gametes carry one chromosome from each pair</text>
  <g transform="translate(490, 425)" stroke="#7c3aed" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M10,15 Q20,-5 30,15"/>
    <path d="M60,15 Q70,-5 80,15"/>
    <path d="M110,15 Q120,-5 130,15"/>
  </g>
  <text x="700" y="432" text-anchor="start" class="sublabel">(only 23 single chromosomes each)</text>
</svg>