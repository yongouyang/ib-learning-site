<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Diffusion and Osmosis</title>
  <desc id="desc">Two panels showing diffusion of particles down a concentration gradient, and osmosis of water through a selectively permeable membrane.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .membrane { fill: #d1d5db; stroke: #6b7280; stroke-width: 2; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#f9fafb" rx="12"/>
  <text x="380" y="34" text-anchor="middle" class="title">Diffusion and Osmosis</text>

  <!-- Diffusion panel -->
  <rect x="30" y="55" width="335" height="340" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="197" y="82" text-anchor="middle" class="panel-title">Diffusion</text>

  <!-- Container -->
  <rect x="55" y="100" width="285" height="160" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" rx="6"/>
  <text x="85" y="125" class="label" fill="#1e40af">High concentration</text>
  <text x="228" y="125" class="label" fill="#1e40af">Low concentration</text>

  <!-- Particles -->
  <circle cx="95" cy="160" r="8" fill="#f97316"/>
  <circle cx="125" cy="190" r="8" fill="#f97316"/>
  <circle cx="110" cy="225" r="8" fill="#f97316"/>
  <circle cx="150" cy="150" r="8" fill="#f97316"/>
  <circle cx="170" cy="210" r="8" fill="#f97316"/>
  <circle cx="280" cy="180" r="8" fill="#f97316"/>
  <circle cx="310" cy="220" r="8" fill="#f97316"/>

  <!-- Diffusion arrows -->
  <line x1="180" y1="185" x2="250" y2="185" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="135" y1="215" x2="210" y2="235" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="160" y1="155" x2="230" y2="145" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <text x="197" y="290" text-anchor="middle" class="sublabel">Particles move from high → low concentration</text>
  <text x="197" y="308" text-anchor="middle" class="sublabel">until evenly spread (dynamic equilibrium).</text>

  <line x1="85" y1="320" x2="40" y2="345" class="line"/>
  <rect x="5" y="346" width="75" height="18" rx="4" class="label-bg"/>
  <text x="9" y="358" class="label">No energy</text>

  <line x1="310" y1="320" x2="355" y2="345" class="line"/>
  <rect x="305" y="346" width="90" height="18" rx="4" class="label-bg"/>
  <text x="309" y="358" class="label">Down gradient</text>

  <!-- Osmosis panel -->
  <rect x="395" y="55" width="335" height="340" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="562" y="82" text-anchor="middle" class="panel-title">Osmosis</text>

  <!-- Container -->
  <rect x="420" y="100" width="285" height="160" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" rx="6"/>
  <!-- Membrane -->
  <rect x="540" y="100" width="14" height="160" class="membrane"/>

  <!-- Water molecules -->
  <circle cx="460" cy="140" r="6" fill="#3b82f6"/>
  <circle cx="500" cy="170" r="6" fill="#3b82f6"/>
  <circle cx="475" cy="210" r="6" fill="#3b82f6"/>
  <circle cx="520" cy="130" r="6" fill="#3b82f6"/>
  <circle cx="440" cy="200" r="6" fill="#3b82f6"/>

  <circle cx="650" cy="150" r="6" fill="#3b82f6" opacity="0.25"/>
  <circle cx="680" cy="190" r="6" fill="#3b82f6" opacity="0.25"/>
  <circle cx="630" cy="220" r="6" fill="#3b82f6" opacity="0.25"/>

  <!-- Solute particles (right side only) -->
  <circle cx="660" cy="130" r="8" fill="#ef4444" opacity="0.9"/>
  <circle cx="680" cy="240" r="8" fill="#ef4444" opacity="0.9"/>
  <circle cx="630" cy="170" r="8" fill="#ef4444" opacity="0.9"/>

  <!-- Water arrow -->
  <line x1="520" y1="180" x2="545" y2="180" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="210" x2="545" y2="220" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="150" x2="545" y2="145" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>

  <text x="480" y="290" text-anchor="middle" class="sublabel">Dilute side</text>
  <text x="547" y="290" text-anchor="middle" class="sublabel">Membrane</text>
  <text x="650" y="290" text-anchor="middle" class="sublabel">Concentrated side</text>
  <text x="562" y="315" text-anchor="middle" class="sublabel">Water moves through a selectively permeable membrane</text>
  <text x="562" y="333" text-anchor="middle" class="sublabel">towards the higher solute concentration.</text>
</svg>
