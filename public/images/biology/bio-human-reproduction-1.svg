<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Human Reproduction and Development Timeline</title>
  <desc id="desc">A timeline showing the main stages of human reproduction and development from puberty, through the menstrual cycle, fertilisation, pregnancy, birth, and childhood.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .stage-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #374151; }
      .stage-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .arrow { stroke: #10b981; stroke-width: 4; fill: none; stroke-linecap: round; }
      .circle { fill: #d1fae5; stroke: #10b981; stroke-width: 2.5; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
      .icon-body { fill: #6ee7b7; }
      .icon-detail { fill: #059669; }
    </style>
  </defs>

  <rect width="900" height="420" fill="#f9fafb" rx="12"/>
  <text x="450" y="38" text-anchor="middle" class="title">Human Reproduction &amp; Development</text>

  <!-- Timeline arrow -->
  <line x1="80" y1="210" x2="820" y2="210" class="arrow"/>
  <polygon points="830,210 815,202 815,218" fill="#10b981"/>

  <!-- Stage 1: Puberty -->
  <g transform="translate(75, 100)">
    <rect x="-55" y="0" width="110" height="95" class="panel" rx="10"/>
    <circle cx="0" cy="25" r="18" class="circle"/>
    <text x="0" y="31" text-anchor="middle" class="icon-detail" font-size="18">🧍</text>
    <text x="0" y="58" text-anchor="middle" class="stage-title">Puberty</text>
    <text x="0" y="75" text-anchor="middle" class="stage-text">Hormones begin</text>
    <text x="0" y="88" text-anchor="middle" class="stage-text">physical changes</text>
  </g>
  <circle cx="75" cy="210" r="6" fill="#10b981"/>

  <!-- Stage 2: Menstrual cycle -->
  <g transform="translate(210, 100)">
    <rect x="-55" y="0" width="110" height="95" class="panel" rx="10"/>
    <circle cx="0" cy="25" r="18" class="circle"/>
    <text x="0" y="31" text-anchor="middle" class="icon-detail" font-size="18">🔄</text>
    <text x="0" y="58" text-anchor="middle" class="stage-title">Cycle</text>
    <text x="0" y="75" text-anchor="middle" class="stage-text">Oestrogen builds</text>
    <text x="0" y="88" text-anchor="middle" class="stage-text">the uterus lining</text>
  </g>
  <circle cx="210" cy="210" r="6" fill="#10b981"/>

  <!-- Stage 3: Fertilisation -->
  <g transform="translate(345, 100)">
    <rect x="-55" y="0" width="110" height="95" class="panel" rx="10"/>
    <circle cx="0" cy="25" r="18" class="circle"/>
    <text x="0" y="31" text-anchor="middle" class="icon-detail" font-size="18">🧬</text>
    <text x="0" y="58" text-anchor="middle" class="stage-title">Fertilisation</text>
    <text x="0" y="75" text-anchor="middle" class="stage-text">Sperm + egg</text>
    <text x="0" y="88" text-anchor="middle" class="stage-text">form a zygote</text>
  </g>
  <circle cx="345" cy="210" r="6" fill="#10b981"/>

  <!-- Stage 4: Pregnancy -->
  <g transform="translate(480, 100)">
    <rect x="-55" y="0" width="110" height="95" class="panel" rx="10"/>
    <circle cx="0" cy="25" r="18" class="circle"/>
    <text x="0" y="31" text-anchor="middle" class="icon-detail" font-size="18">🤰</text>
    <text x="0" y="58" text-anchor="middle" class="stage-title">Pregnancy</text>
    <text x="0" y="75" text-anchor="middle" class="stage-text">Embryo implants</text>
    <text x="0" y="88" text-anchor="middle" class="stage-text">and develops</text>
  </g>
  <circle cx="480" cy="210" r="6" fill="#10b981"/>

  <!-- Stage 5: Birth -->
  <g transform="translate(615, 100)">
    <rect x="-55" y="0" width="110" height="95" class="panel" rx="10"/>
    <circle cx="0" cy="25" r="18" class="circle"/>
    <text x="0" y="31" text-anchor="middle" class="icon-detail" font-size="18">👶</text>
    <text x="0" y="58" text-anchor="middle" class="stage-title">Birth</text>
    <text x="0" y="75" text-anchor="middle" class="stage-text">Cervix dilates</text>
    <text x="0" y="88" text-anchor="middle" class="stage-text">baby is born</text>
  </g>
  <circle cx="615" cy="210" r="6" fill="#10b981"/>

  <!-- Stage 6: Childhood -->
  <g transform="translate(750, 100)">
    <rect x="-55" y="0" width="110" height="95" class="panel" rx="10"/>
    <circle cx="0" cy="25" r="18" class="circle"/>
    <text x="0" y="31" text-anchor="middle" class="icon-detail" font-size="18">🏃</text>
    <text x="0" y="58" text-anchor="middle" class="stage-title">Childhood</text>
    <text x="0" y="75" text-anchor="middle" class="stage-text">Growth and skills</text>
    <text x="0" y="88" text-anchor="middle" class="stage-text">develop rapidly</text>
  </g>
  <circle cx="750" cy="210" r="6" fill="#10b981"/>

  <!-- Summary box -->
  <rect x="90" y="290" width="720" height="95" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="8"/>
  <text x="450" y="320" text-anchor="middle" class="stage-title">Key Structures Supporting the Foetus</text>
  <text x="450" y="345" text-anchor="middle" class="stage-text">Placenta — exchanges oxygen, nutrients, and waste; maternal and foetal blood do NOT mix.</text>
  <text x="450" y="365" text-anchor="middle" class="stage-text">Umbilical cord — connects foetus to placenta and carries blood between them.</text>
  <text x="450" y="385" text-anchor="middle" class="stage-text">Amniotic sac — fluid-filled bag that cushions and protects the developing foetus.</text>
</svg>