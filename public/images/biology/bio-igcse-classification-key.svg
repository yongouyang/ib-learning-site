<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">A dichotomous key for six organisms</title>
  <desc id="desc">A branching key. Choice 1 asks about a backbone: yes leads to choice 2 about feathers (eagle or salmon); no leads to choice 3 about having more than four pairs of legs. Yes leads to choice 4 about a long many-segmented body (centipede or crab); no leads to choice 5 about six legs (ant or spider).</desc>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .qtext { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #065f46; }
      .org { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #064e3b; }
      .grp { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #047857; }
      .yn { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; fill: #374151; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#f9fafb" rx="12"/>
  <text x="500" y="34" text-anchor="middle" class="title">A Dichotomous Key for Six Organisms</text>

  <!-- Edges -->
  <path d="M500 97 C500 130 190 130 190 164" class="line"/>
  <path d="M500 97 C500 130 650 130 650 164" class="line"/>
  <path d="M190 198 C190 300 95 320 95 400" class="line"/>
  <path d="M190 198 C190 300 261 320 261 400" class="line"/>
  <path d="M650 198 C650 235 480 235 480 271" class="line"/>
  <path d="M650 198 C650 235 850 235 850 271" class="line"/>
  <path d="M480 305 C480 350 427 360 427 400" class="line"/>
  <path d="M480 305 C480 350 593 360 593 400" class="line"/>
  <path d="M850 305 C850 350 759 360 759 400" class="line"/>
  <path d="M850 305 C850 350 925 360 925 400" class="line"/>

  <!-- Edge labels -->
  <rect x="326" y="114" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="343" y="126" text-anchor="middle" class="yn">yes</text>
  <rect x="576" y="114" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="593" y="126" text-anchor="middle" class="yn">no</text>
  <rect x="103" y="282" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="120" y="294" text-anchor="middle" class="yn">yes</text>
  <rect x="228" y="282" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="245" y="294" text-anchor="middle" class="yn">no</text>
  <rect x="528" y="217" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="545" y="229" text-anchor="middle" class="yn">yes</text>
  <rect x="758" y="217" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="775" y="229" text-anchor="middle" class="yn">no</text>
  <rect x="413" y="337" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="430" y="349" text-anchor="middle" class="yn">yes</text>
  <rect x="543" y="337" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="560" y="349" text-anchor="middle" class="yn">no</text>
  <rect x="768" y="337" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="785" y="349" text-anchor="middle" class="yn">yes</text>
  <rect x="888" y="337" width="34" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="905" y="349" text-anchor="middle" class="yn">no</text>

  <!-- Question nodes -->
  <rect x="380" y="63" width="240" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="84" text-anchor="middle" class="qtext">1. Does it have a backbone?</text>

  <rect x="95" y="164" width="190" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="185" text-anchor="middle" class="qtext">2. Does it have feathers?</text>

  <rect x="530" y="164" width="240" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="185" text-anchor="middle" class="qtext">3. More than four pairs of legs?</text>

  <rect x="315" y="271" width="330" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="292" text-anchor="middle" class="qtext">4. Body long, with many similar segments?</text>

  <rect x="750" y="271" width="200" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="850" y="292" text-anchor="middle" class="qtext">5. Does it have six legs?</text>

  <!-- Leaf cards -->
  <rect x="20" y="400" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="95" y="428" text-anchor="middle" class="org">EAGLE</text>
  <text x="95" y="448" text-anchor="middle" class="grp">bird</text>

  <rect x="186" y="400" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="261" y="428" text-anchor="middle" class="org">SALMON</text>
  <text x="261" y="448" text-anchor="middle" class="grp">fish</text>

  <rect x="352" y="400" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="427" y="428" text-anchor="middle" class="org">CENTIPEDE</text>
  <text x="427" y="448" text-anchor="middle" class="grp">myriapod</text>

  <rect x="518" y="400" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="593" y="428" text-anchor="middle" class="org">CRAB</text>
  <text x="593" y="448" text-anchor="middle" class="grp">crustacean</text>

  <rect x="684" y="400" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="759" y="428" text-anchor="middle" class="org">ANT</text>
  <text x="759" y="448" text-anchor="middle" class="grp">insect</text>

  <rect x="850" y="400" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="925" y="428" text-anchor="middle" class="org">SPIDER</text>
  <text x="925" y="448" text-anchor="middle" class="grp">arachnid</text>

  <text x="500" y="498" text-anchor="middle" class="sublabel">At each numbered choice, follow the branch that matches the specimen — every branch ends at exactly one organism.</text>
</svg>
