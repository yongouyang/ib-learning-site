<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">Major Invertebrate Groups</title>
  <desc id="desc">A diagram showing the major invertebrate groups and their key features: arthropods, molluscs, annelids, cnidarians, and echinoderms.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .group-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #111827; }
      .box { stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="840" height="500" fill="#f9fafb" rx="12"/>
  <text x="420" y="36" text-anchor="middle" class="title">Major Invertebrate Groups</text>

  <!-- Arthropods -->
  <rect x="30" y="70" width="250" height="240" fill="#fee2e2" stroke="#ef4444" class="box"/>
  <text x="155" y="94" text-anchor="middle" class="group-title">Arthropods (largest phylum)</text>
  <text x="155" y="116" text-anchor="middle" class="sublabel">Jointed legs, segmented body, exoskeleton (chitin)</text>

  <!-- Insect -->
  <ellipse cx="80" cy="170" rx="22" ry="14" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="80" cy="155" r="10" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <line x1="80" y1="145" x2="70" y2="135" stroke="#b91c1c" stroke-width="2"/>
  <line x1="80" y1="145" x2="90" y2="135" stroke="#b91c1c" stroke-width="2"/>
  <line x1="70" y1="178" x2="55" y2="195" stroke="#b91c1c" stroke-width="2"/>
  <line x1="90" y1="178" x2="105" y2="195" stroke="#b91c1c" stroke-width="2"/>
  <line x1="75" y1="180" x2="65" y2="198" stroke="#b91c1c" stroke-width="2"/>
  <line x1="85" y1="180" x2="95" y2="198" stroke="#b91c1c" stroke-width="2"/>
  <text x="80" y="220" text-anchor="middle" class="sublabel">Insect</text>
  <text x="80" y="236" text-anchor="middle" class="sublabel">
    <tspan x="80" dy="0">6 legs</tspan>
    <tspan x="80" dy="14">3 body parts</tspan>
  </text>

  <!-- Spider -->
  <ellipse cx="160" cy="165" rx="20" ry="14" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="160" cy="150" r="12" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <line x1="150" y1="160" x2="130" y2="180" stroke="#b91c1c" stroke-width="2"/>
  <line x1="155" y1="162" x2="140" y2="185" stroke="#b91c1c" stroke-width="2"/>
  <line x1="170" y1="160" x2="190" y2="180" stroke="#b91c1c" stroke-width="2"/>
  <line x1="165" y1="162" x2="180" y2="185" stroke="#b91c1c" stroke-width="2"/>
  <text x="160" y="220" text-anchor="middle" class="sublabel">Arachnid</text>
  <text x="160" y="236" text-anchor="middle" class="sublabel">
    <tspan x="160" dy="0">8 legs</tspan>
    <tspan x="160" dy="14">2 body parts</tspan>
  </text>

  <!-- Crab -->
  <ellipse cx="235" cy="160" rx="28" ry="18" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="220" cy="150" r="4" fill="#1f2937"/>
  <circle cx="235" cy="150" r="4" fill="#1f2937"/>
  <path d="M210,168 L190,180" stroke="#b91c1c" stroke-width="3"/>
  <path d="M260,168 L280,180" stroke="#b91c1c" stroke-width="3"/>
  <text x="235" y="220" text-anchor="middle" class="sublabel">Crustacean</text>
  <text x="235" y="236" text-anchor="middle" class="sublabel">5+ leg pairs</text>

  <!-- Molluscs -->
  <rect x="310" y="70" width="150" height="240" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="385" y="94" text-anchor="middle" class="group-title">Molluscs</text>
  <text x="385" y="116" text-anchor="middle" class="sublabel">Soft body, often shell</text>
  <path d="M360,180 Q385,150 410,180 Q385,210 360,180 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <text x="385" y="210" text-anchor="middle" class="sublabel">Snail</text>
  <path d="M370,220 L400,220" stroke="#1d4ed8" stroke-width="4"/>
  <text x="385" y="240" text-anchor="middle" class="sublabel">Clam</text>
  <ellipse cx="385" cy="265" rx="14" ry="18" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="385" cy="260" r="4" fill="#1f2937"/>
  <circle cx="380" cy="258" r="2" fill="#1f2937"/>
  <circle cx="390" cy="258" r="2" fill="#1f2937"/>
  <text x="385" y="294" text-anchor="middle" class="sublabel">Octopus</text>

  <!-- Annelids -->
  <rect x="490" y="70" width="150" height="240" fill="#fef3c7" stroke="#f59e0b" class="box"/>
  <text x="565" y="94" text-anchor="middle" class="group-title">Annelids</text>
  <text x="565" y="116" text-anchor="middle" class="sublabel">Segmented worms</text>
  <g stroke="#b45309" stroke-width="2">
    <ellipse cx="525" cy="170" rx="18" ry="10" fill="#fde68a"/>
    <ellipse cx="550" cy="170" rx="18" ry="10" fill="#fde68a"/>
    <ellipse cx="575" cy="170" rx="18" ry="10" fill="#fde68a"/>
    <ellipse cx="600" cy="170" rx="18" ry="10" fill="#fde68a"/>
  </g>
  <text x="565" y="210" text-anchor="middle" class="sublabel">Earthworm</text>
  <text x="565" y="230" text-anchor="middle" class="sublabel">Ring-like segments</text>

  <!-- Cnidarians -->
  <rect x="670" y="70" width="150" height="240" fill="#d1fae5" stroke="#10b981" class="box"/>
  <text x="745" y="94" text-anchor="middle" class="group-title">Cnidarians</text>
  <text x="745" y="116" text-anchor="middle" class="sublabel">Stinging cells, radial symmetry</text>
  <path d="M720,170 Q745,130 770,170 Q745,210 720,170" fill="#6ee7b7" stroke="#047857" stroke-width="2"/>
  <path d="M730,180 L725,200" stroke="#047857" stroke-width="1.5"/>
  <path d="M745,185 L745,205" stroke="#047857" stroke-width="1.5"/>
  <path d="M760,180 L765,200" stroke="#047857" stroke-width="1.5"/>
  <text x="745" y="220" text-anchor="middle" class="sublabel">Jellyfish</text>

  <!-- Echinoderms -->
  <rect x="310" y="340" width="250" height="140" fill="#f3e8ff" stroke="#9333ea" class="box"/>
  <text x="435" y="364" text-anchor="middle" class="group-title">Echinoderms</text>
  <text x="435" y="386" text-anchor="middle" class="sublabel">Spiny skin, radial symmetry (usually 5-part), tube feet</text>
  <g transform="translate(435,425)">
    <polygon points="0,-25 7,-8 25,-5 12,8 16,25 0,16 -16,25 -12,8 -25,-5 -7,-8" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#7e22ce"/>
  </g>
  <text x="435" y="470" text-anchor="middle" class="sublabel">Starfish</text>

  <!-- Key fact -->
  <rect x="30" y="340" width="250" height="140" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>
  <text x="155" y="368" text-anchor="middle" class="label">Key fact</text>
  <text x="155" y="396" text-anchor="middle" class="sublabel">Invertebrates make up</text>
  <text x="155" y="416" text-anchor="middle" class="sublabel">over 95% of all</text>
  <text x="155" y="436" text-anchor="middle" class="sublabel">animal species.</text>
  <text x="155" y="456" text-anchor="middle" class="sublabel">They have no backbone.</text>
</svg>