<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Lifestyle and Non-Communicable Disease</title>
  <desc id="desc">Diagram showing lifestyle and genetic risk factors that contribute to non-communicable diseases.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Lifestyle and Non-Communicable Disease</text>

  <!-- Central NCD box -->
  <rect x="270" y="175" width="260" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="400" y="208" text-anchor="middle" class="label">Non-communicable diseases (NCDs)</text>
  <text x="400" y="228" text-anchor="middle" class="sublabel">Not caused by pathogens; cannot spread</text>
  <text x="400" y="246" text-anchor="middle" class="sublabel">between people</text>

  <!-- Risk factor boxes -->
  <!-- Diet -->
  <rect x="50" y="70" width="150" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  <rect x="85" y="90" width="50" height="20" rx="4" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="90" y="100" width="40" height="10" rx="2" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="125" y="130" text-anchor="middle" class="label">Diet</text>
  <text x="125" y="145" text-anchor="middle" class="sublabel">fat, salt, sugar</text>

  <!-- Smoking -->
  <rect x="600" y="70" width="150" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  <rect x="655" y="100" width="30" height="8" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="685" y1="104" x2="695" y2="104" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M695,104 Q700,95 705,104" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M640,115 Q655,95 670,115 Q685,95 700,115" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
  <text x="675" y="135" text-anchor="middle" class="label">Smoking</text>
  <text x="675" y="150" text-anchor="middle" class="sublabel">carcinogens, tar, CO</text>

  <!-- Alcohol -->
  <rect x="600" y="280" width="150" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  <rect x="655" y="300" width="24" height="42" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="660" y="305" width="14" height="20" fill="#3b82f6" opacity="0.3"/>
  <text x="675" y="355" text-anchor="middle" class="label">Alcohol</text>
  <text x="675" y="370" text-anchor="middle" class="sublabel">liver damage</text>

  <!-- Lack of exercise -->
  <rect x="50" y="280" width="150" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  <circle cx="105" cy="315" r="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <line x1="105" y1="325" x2="105" y2="345" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="335" x2="115" y2="335" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="345" x2="95" y2="360" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="345" x2="115" y2="360" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <text x="125" y="355" text-anchor="middle" class="label">Lack of exercise</text>
  <text x="125" y="370" text-anchor="middle" class="sublabel">obesity, CVD</text>

  <!-- Genetics -->
  <rect x="325" y="340" width="150" height="80" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  <path d="M355,360 L355,380 L365,400 M355,380 L365,360 M355,380 L345,400" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M375,360 L375,380 L365,400 M375,380 L365,360 M375,380 L385,400" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="395" text-anchor="middle" class="label">Genetics</text>

  <!-- Outcomes below NCD box -->
  <rect x="270" y="300" width="260" height="28" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="4"/>
  <text x="400" y="318" text-anchor="middle" class="sublabel" fill="#991b1b">Heart disease · Diabetes · Cancer · Stroke</text>

  <!-- Arrows -->
  <line x1="200" y1="120" x2="270" y2="190" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="600" y1="120" x2="530" y2="190" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="200" y1="320" x2="270" y2="250" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="600" y1="320" x2="530" y2="250" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="400" y1="340" x2="400" y2="267" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <!-- Labels pointing to central box -->
  <line x1="400" y1="175" x2="400" y2="155" class="line"/>
  <rect x="330" y="137" width="140" height="18" rx="4" class="label-bg"/>
  <text x="335" y="149" class="label">Multifactorial causes</text>
</svg>