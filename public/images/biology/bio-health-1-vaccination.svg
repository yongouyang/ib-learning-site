<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">Vaccination and Immunity</title>
  <desc id="desc">Diagram showing how a vaccine triggers a primary immune response and memory cells, leading to a faster secondary response on later exposure.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#f9fafb" rx="12"/>
  <text x="430" y="34" text-anchor="middle" class="title">Vaccination and Immunity</text>

  <!-- Step 1: Vaccine -->
  <rect x="50" y="70" width="190" height="240" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="145" y="96" text-anchor="middle" class="panel-title">1. Vaccine given</text>
  <rect x="105" y="120" width="40" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="115" y="110" width="20" height="10" rx="2" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <line x1="125" y1="125" x2="125" y2="160" stroke="#3b82f6" stroke-width="2"/>
  <rect x="115" y="165" width="20" height="20" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="145" y="230" text-anchor="middle" class="sublabel">Weakened, dead</text>
  <text x="145" y="245" text-anchor="middle" class="sublabel">or fragment only</text>
  <text x="145" y="260" text-anchor="middle" class="sublabel">cannot cause disease</text>

  <!-- Arrow -->
  <line x1="250" y1="190" x2="290" y2="190" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <!-- Step 2: Primary response -->
  <rect x="310" y="70" width="240" height="240" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="430" y="96" text-anchor="middle" class="panel-title">2. Primary response</text>
  <circle cx="390" cy="160" r="28" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="165" text-anchor="middle" class="label" fill="#4c1d95">B cell</text>
  <circle cx="470" cy="160" r="28" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="165" text-anchor="middle" class="label" fill="#4c1d95">T cell</text>
  <!-- Antibodies -->
  <path d="M370,200 L370,225 L360,240 M370,225 L380,240" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M390,200 L390,225 L380,240 M390,225 L400,240" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M450,200 L450,225 L440,240 M450,225 L460,240" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M470,200 L470,225 L460,240 M470,225 L480,240" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Memory cells -->
  <circle cx="410" cy="270" r="18" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="450" cy="270" r="18" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="305" text-anchor="middle" class="sublabel" fill="#4c1d95">Memory cells</text>

  <!-- Arrow -->
  <line x1="560" y1="190" x2="600" y2="190" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <!-- Step 3: Secondary response -->
  <rect x="620" y="70" width="200" height="240" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="720" y="96" text-anchor="middle" class="panel-title">3. Later infection</text>
  <!-- Pathogen -->
  <circle cx="720" cy="150" r="28" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <line x1="720" y1="115" x2="720" y2="105" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="720" y1="185" x2="720" y2="195" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="685" y1="150" x2="675" y2="150" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="755" y1="150" x2="765" y2="150" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <!-- Antibodies attacking -->
  <path d="M680,190 L690,175 L700,190" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M720,210 L720,230 L710,245 M720,230 L730,245" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M760,190 L750,175 L740,190" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720" y="280" text-anchor="middle" class="sublabel">Memory cells recognise</text>
  <text x="720" y="295" text-anchor="middle" class="sublabel">pathogen and respond fast</text>

  <!-- Summary caption -->
  <rect x="130" y="340" width="600" height="40" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="430" y="365" text-anchor="middle" class="sublabel">Result: long-lasting immunity without causing the disease.</text>
</svg>