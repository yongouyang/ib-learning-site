<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">The Photosynthesis Equation</title>
  <desc id="desc">Diagram showing the inputs and outputs of photosynthesis: carbon dioxide and water, powered by light energy, produce glucose and oxygen inside a chloroplast.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#f9fafb" rx="12"/>
  <text x="400" y="38" text-anchor="middle" class="title">The Photosynthesis Equation</text>

  <!-- Sun -->
  <g transform="translate(400, 95)">
    <circle cx="0" cy="0" r="22" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-32" x2="0" y2="-40"/>
      <line x1="0" y1="32" x2="0" y2="40"/>
      <line x1="-32" y1="0" x2="-40" y2="0"/>
      <line x1="32" y1="0" x2="40" y2="0"/>
      <line x1="23" y1="23" x2="29" y2="29"/>
      <line x1="-23" y1="23" x2="-29" y2="29"/>
      <line x1="23" y1="-23" x2="29" y2="-29"/>
      <line x1="-23" y1="-23" x2="-29" y2="-29"/>
    </g>
  </g>
  <rect x="373" y="128" width="54" height="18" rx="4" class="label-bg"/>
  <text x="400" y="141" text-anchor="middle" class="sublabel">Light energy</text>

  <!-- Inputs -->
  <rect x="60" y="175" width="120" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="196" text-anchor="middle" class="label">Carbon dioxide</text>
  <text x="120" y="211" text-anchor="middle" class="sublabel">CO₂ from air via stomata</text>

  <rect x="60" y="250" width="120" height="46" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="271" text-anchor="middle" class="label">Water</text>
  <text x="120" y="286" text-anchor="middle" class="sublabel">H₂O from roots via xylem</text>

  <!-- Chloroplast -->
  <ellipse cx="400" cy="240" rx="110" ry="70" fill="#86efac" stroke="#16a34a" stroke-width="3"/>
  <g fill="#22c55e" opacity="0.4">
    <ellipse cx="360" cy="230" rx="28" ry="12"/>
    <ellipse cx="400" cy="260" rx="30" ry="10"/>
    <ellipse cx="440" cy="220" rx="26" ry="11"/>
  </g>
  <rect x="345" y="235" width="110" height="20" rx="4" class="label-bg"/>
  <text x="400" y="248" text-anchor="middle" class="label">Chloroplast</text>

  <!-- Input arrows -->
  <line x1="180" y1="198" x2="290" y2="225" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>
  <line x1="180" y1="273" x2="290" y2="255" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>
  <line x1="400" y1="150" x2="400" y2="170" class="arrow" stroke="#fbbf24" marker-end="url(#arrow-green)"/>

  <!-- Outputs -->
  <rect x="620" y="175" width="120" height="46" rx="8" fill="#fde047" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="196" text-anchor="middle" class="label">Glucose</text>
  <text x="680" y="211" text-anchor="middle" class="sublabel">C₆H₁₂O₆</text>

  <rect x="620" y="250" width="120" height="46" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="680" y="271" text-anchor="middle" class="label">Oxygen</text>
  <text x="680" y="286" text-anchor="middle" class="sublabel">O₂ released</text>

  <!-- Output arrows -->
  <line x1="510" y1="225" x2="620" y2="198" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>
  <line x1="510" y1="255" x2="620" y2="273" class="arrow" stroke="#6b7280" marker-end="url(#arrow-green)"/>

  <!-- Word equation -->
  <rect x="110" y="340" width="580" height="42" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="400" y="365" text-anchor="middle" class="sublabel">Carbon dioxide + Water</text>
  <text x="400" y="378" text-anchor="middle" class="sublabel">→ Glucose + Oxygen</text>
</svg>