<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Biological drawing rules</title>
  <desc id="desc">Example of a correct biological drawing showing clean pencil lines, ruled label lines, a title, and a scale bar.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .drawing-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .cell { fill: none; stroke: #111827; stroke-width: 2; }
      .nucleus { fill: none; stroke: #111827; stroke-width: 2; }
      .ruled { stroke: #111827; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="720" height="440" fill="#f9fafb" rx="12"/>
  <text x="360" y="34" text-anchor="middle" class="title">Biological Drawing Rules</text>

  <!-- Drawing area -->
  <rect x="180" y="70" width="360" height="290" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="6"/>

  <!-- Title underlined -->
  <text x="360" y="100" text-anchor="middle" class="drawing-title">Onion epidermis cells</text>
  <line x1="265" y1="105" x2="455" y2="105" stroke="#111827" stroke-width="1.5"/>

  <!-- Cells -->
  <rect x="230" y="140" width="90" height="55" class="cell"/>
  <rect x="320" y="140" width="90" height="55" class="cell"/>
  <rect x="410" y="140" width="90" height="55" class="cell"/>

  <rect x="230" y="195" width="90" height="55" class="cell"/>
  <rect x="320" y="195" width="90" height="55" class="cell"/>
  <rect x="410" y="195" width="90" height="55" class="cell"/>

  <rect x="230" y="250" width="90" height="55" class="cell"/>
  <rect x="320" y="250" width="90" height="55" class="cell"/>
  <rect x="410" y="250" width="90" height="55" class="cell"/>

  <!-- Nuclei -->
  <circle cx="275" cy="167" r="10" class="nucleus"/>
  <circle cx="365" cy="222" r="10" class="nucleus"/>
  <circle cx="455" cy="277" r="10" class="nucleus"/>
  <circle cx="410" cy="167" r="10" class="nucleus"/>
  <circle cx="320" cy="277" r="10" class="nucleus"/>

  <!-- Ruled label lines -->
  <line x1="500" y1="167" x2="590" y2="167" class="ruled"/>
  <rect x="594" y="157" width="55" height="18" rx="4" class="label-bg"/>
  <text x="598" y="170" class="label">Cell wall</text>

  <line x1="500" y1="222" x2="590" y2="222" class="ruled"/>
  <rect x="594" y="212" width="55" height="18" rx="4" class="label-bg"/>
  <text x="598" y="225" class="label">Nucleus</text>

  <line x1="500" y1="277" x2="590" y2="277" class="ruled"/>
  <rect x="594" y="267" width="60" height="18" rx="4" class="label-bg"/>
  <text x="598" y="280" class="label">Cytoplasm</text>

  <!-- Scale bar -->
  <line x1="250" y1="340" x2="350" y2="340" stroke="#111827" stroke-width="3"/>
  <text x="300" y="355" text-anchor="middle" class="sublabel">50 µm</text>

  <!-- Rule callouts -->
  <rect x="30" y="130" width="120" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="146" text-anchor="middle" class="label">Use a sharp pencil</text>

  <rect x="30" y="170" width="120" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="186" text-anchor="middle" class="label">No shading or colour</text>

  <rect x="30" y="210" width="120" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="226" text-anchor="middle" class="label">Ruled label lines</text>

  <rect x="30" y="250" width="120" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="90" y="266" text-anchor="middle" class="label">Include scale bar</text>

  <text x="360" y="410" text-anchor="middle" class="sublabel">Draw large, use continuous lines, and label only what you can actually see.</text>
</svg>