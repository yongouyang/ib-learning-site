<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">Pathogens and Disease Transmission</title>
  <desc id="desc">Diagram showing the four main types of pathogens and the main routes by which communicable diseases are transmitted.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="820" height="460" fill="#f9fafb" rx="12"/>
  <text x="410" y="34" text-anchor="middle" class="title">Pathogens and Disease Transmission</text>

  <!-- Pathogen type panels -->
  <g id="bacteria-panel">
    <rect x="35" y="55" width="175" height="170" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="122" y="82" text-anchor="middle" class="panel-title">Bacteria</text>
    <ellipse cx="122" cy="125" rx="38" ry="20" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <path d="M85,125 Q70,115 60,125" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <path d="M85,132 Q72,140 62,132" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <text x="122" y="168" text-anchor="middle" class="sublabel">e.g. cholera, TB</text>
    <text x="122" y="183" text-anchor="middle" class="sublabel">Salmonella</text>
  </g>

  <g id="virus-panel">
    <rect x="220" y="55" width="175" height="170" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="307" y="82" text-anchor="middle" class="panel-title">Viruses</text>
    <circle cx="307" cy="125" r="28" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    <line x1="307" y1="85" x2="307" y2="75" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="307" y1="165" x2="307" y2="175" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="267" y1="125" x2="257" y2="125" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="347" y1="125" x2="357" y2="125" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="279" y1="97" x2="272" y2="90" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="335" y1="97" x2="342" y2="90" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="279" y1="153" x2="272" y2="160" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="335" y1="153" x2="342" y2="160" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="307" y="168" text-anchor="middle" class="sublabel">e.g. flu, HIV</text>
    <text x="307" y="183" text-anchor="middle" class="sublabel">COVID-19</text>
  </g>

  <g id="fungi-panel">
    <rect x="405" y="55" width="175" height="170" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="492" y="82" text-anchor="middle" class="panel-title">Fungi</text>
    <circle cx="472" cy="125" r="18" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <circle cx="512" cy="125" r="18" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <path d="M472,143 Q472,165 460,175" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M492,143 Q492,160 502,172" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M512,143 Q512,165 524,175" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <text x="492" y="168" text-anchor="middle" class="sublabel">e.g. athlete's foot</text>
    <text x="492" y="183" text-anchor="middle" class="sublabel">ringworm</text>
  </g>

  <g id="protist-panel">
    <rect x="590" y="55" width="175" height="170" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
    <text x="677" y="82" text-anchor="middle" class="panel-title">Protists</text>
    <path d="M650,125 Q660,105 680,115 Q700,105 710,125 Q720,145 700,150 Q680,160 660,145 Q640,145 650,125 Z" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="685" cy="130" r="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M650,140 Q640,155 630,150" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <text x="677" y="168" text-anchor="middle" class="sublabel">e.g. Plasmodium</text>
    <text x="677" y="183" text-anchor="middle" class="sublabel">(malaria)</text>
  </g>

  <!-- Transmission route panels -->
  <text x="410" y="255" text-anchor="middle" class="panel-title">Transmission Routes</text>

  <g id="airborne">
    <rect x="35" y="270" width="120" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
    <path d="M65,305 Q55,295 70,290 Q85,280 100,290 Q115,285 110,305 Q120,315 105,320 Q90,330 75,320 Q60,325 55,310 Q50,300 65,305 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="80" cy="310" r="4" fill="#3b82f6"/>
    <circle cx="95" cy="315" r="3" fill="#3b82f6"/>
    <circle cx="90" cy="302" r="3" fill="#3b82f6"/>
    <text x="95" y="355" text-anchor="middle" class="label">Airborne</text>
    <text x="95" y="370" text-anchor="middle" class="sublabel">droplets</text>
  </g>

  <g id="waterborne">
    <rect x="165" y="270" width="120" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
    <path d="M95,300 Q95,285 105,275 Q115,285 115,300 Q115,320 95,320 Q75,320 75,300 Q75,285 85,275 Q95,285 95,300 Z" transform="translate(95,15)" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="225" y="355" text-anchor="middle" class="label">Waterborne</text>
    <text x="225" y="370" text-anchor="middle" class="sublabel">contaminated water</text>
  </g>

  <g id="foodborne">
    <rect x="295" y="270" width="120" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
    <ellipse cx="355" cy="315" rx="32" ry="14" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <rect x="340" y="305" width="16" height="10" rx="2" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="358" y="308" width="14" height="8" rx="2" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <text x="355" y="355" text-anchor="middle" class="label">Foodborne</text>
    <text x="355" y="370" text-anchor="middle" class="sublabel">contaminated food</text>
  </g>

  <g id="direct-contact">
    <rect x="425" y="270" width="120" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
    <path d="M460,305 Q450,295 460,285 Q470,275 480,285 Q490,280 495,290 Q505,295 500,305 Q510,315 500,325 Q490,335 480,325 Q470,330 460,320 Q450,315 460,305 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="485" y="355" text-anchor="middle" class="label">Direct contact</text>
    <text x="485" y="370" text-anchor="middle" class="sublabel">touch / surfaces</text>
  </g>

  <g id="vector-borne">
    <rect x="555" y="270" width="120" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
    <ellipse cx="615" cy="315" rx="18" ry="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
    <line x1="615" y1="309" x2="615" y2="295" stroke="#4b5563" stroke-width="2"/>
    <path d="M615,295 Q605,285 600,290" fill="none" stroke="#4b5563" stroke-width="1.5"/>
    <path d="M615,295 Q625,285 630,290" fill="none" stroke="#4b5563" stroke-width="1.5"/>
    <path d="M615,302 Q595,295 590,305" fill="none" stroke="#4b5563" stroke-width="1.5"/>
    <path d="M615,302 Q635,295 640,305" fill="none" stroke="#4b5563" stroke-width="1.5"/>
    <text x="615" y="355" text-anchor="middle" class="label">Vector-borne</text>
    <text x="615" y="370" text-anchor="middle" class="sublabel">e.g. mosquito</text>
  </g>

  <g id="sexual-blood">
    <rect x="685" y="270" width="120" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
    <path d="M725,305 C725,290 735,285 745,295 C755,285 765,290 765,305 C765,320 745,335 745,335 C745,335 725,320 725,305 Z" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="745" y="355" text-anchor="middle" class="label">Sexual / blood</text>
    <text x="745" y="370" text-anchor="middle" class="sublabel">body fluids</text>
  </g>
</svg>