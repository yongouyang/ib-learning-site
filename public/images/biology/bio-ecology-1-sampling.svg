<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
  <title id="title">Sampling Techniques for Population Size</title>
  <desc id="desc">Three panels showing quadrat sampling, transect sampling, and capture-mark-recapture for estimating population sizes.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="820" height="560" fill="#f9fafb" rx="12"/>
  <text x="410" y="34" text-anchor="middle" class="title">Sampling Techniques</text>

  <!-- Quadrat panel -->
  <rect x="30" y="55" width="365" height="220" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="212" y="82" text-anchor="middle" class="panel-title">Quadrat sampling</text>

  <!-- Field -->
  <rect x="55" y="100" width="200" height="150" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- Random quadrats -->
  <rect x="70" y="120" width="50" height="50" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4"/>
  <rect x="150" y="150" width="50" height="50" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4"/>
  <rect x="100" y="190" width="50" height="50" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4"/>
  <!-- Plants -->
  <circle cx="95" cy="145" r="6" fill="#16a34a"/>
  <circle cx="110" cy="155" r="6" fill="#16a34a"/>
  <circle cx="90" cy="160" r="6" fill="#16a34a"/>
  <circle cx="170" cy="175" r="6" fill="#16a34a"/>
  <circle cx="185" cy="170" r="6" fill="#16a34a"/>
  <circle cx="120" cy="215" r="6" fill="#16a34a"/>
  <circle cx="135" cy="225" r="6" fill="#16a34a"/>

  <line x1="270" y1="130" x2="320" y2="120" class="line"/>
  <rect x="250" y="101" width="122" height="18" rx="4" class="label-bg"/>
  <text x="254" y="113" class="label">Random placement</text>

  <line x1="270" y1="220" x2="330" y2="220" class="line"/>
  <rect x="250" y="221" width="130" height="32" rx="4" class="label-bg"/>
  <text x="254" y="235" class="label">Mean × total area</text>
  <text x="254" y="248" class="sublabel">quadrat area</text>

  <!-- Transect panel -->
  <rect x="425" y="55" width="365" height="220" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="607" y="82" text-anchor="middle" class="panel-title">Transect sampling</text>

  <!-- Habitat gradient -->
  <rect x="450" y="110" width="280" height="120" fill="url(#grad)" stroke="#6b7280" stroke-width="2"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Transect line -->
  <line x1="470" y1="210" x2="710" y2="210" stroke="#1f2937" stroke-width="2"/>
  <!-- Quadrats along line -->
  <rect x="485" y="160" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3"/>
  <rect x="555" y="160" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3"/>
  <rect x="625" y="160" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3"/>
  <rect x="695" y="160" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3"/>
  <!-- Organisms -->
  <circle cx="505" cy="180" r="5" fill="#3b82f6"/>
  <circle cx="575" cy="180" r="5" fill="#3b82f6"/>
  <circle cx="645" cy="180" r="5" fill="#16a34a"/>
  <circle cx="715" cy="180" r="5" fill="#16a34a"/>

  <line x1="650" y1="150" x2="720" y2="120" class="line"/>
  <rect x="635" y="101" width="145" height="18" rx="4" class="label-bg"/>
  <text x="639" y="113" class="label">Environmental gradient</text>

  <line x1="505" y1="240" x2="450" y2="255" class="line"/>
  <rect x="350" y="256" width="108" height="18" rx="4" class="label-bg"/>
  <text x="354" y="268" class="label">Regular intervals</text>

  <!-- Capture-mark-recapture panel -->
  <rect x="30" y="300" width="760" height="235" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="410" y="327" text-anchor="middle" class="panel-title">Capture-mark-recapture (Lincoln Index)</text>

  <!-- Population area -->
  <rect x="60" y="350" width="300" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="210" y="375" text-anchor="middle" class="label">Population area</text>

  <!-- Mice -->
  <ellipse cx="110" cy="420" rx="18" ry="12" fill="#9ca3af"/>
  <ellipse cx="160" cy="450" rx="18" ry="12" fill="#9ca3af"/>
  <ellipse cx="210" cy="410" rx="18" ry="12" fill="#9ca3af"/>
  <ellipse cx="260" cy="440" rx="18" ry="12" fill="#9ca3af"/>
  <ellipse cx="310" cy="420" rx="18" ry="12" fill="#9ca3af"/>
  <ellipse cx="140" cy="390" rx="18" ry="12" fill="#9ca3af"/>

  <!-- Marked mice -->
  <ellipse cx="190" cy="470" rx="18" ry="12" fill="#9ca3af" stroke="#ef4444" stroke-width="3"/>
  <ellipse cx="290" cy="470" rx="18" ry="12" fill="#9ca3af" stroke="#ef4444" stroke-width="3"/>
  <ellipse cx="240" cy="390" rx="18" ry="12" fill="#9ca3af" stroke="#ef4444" stroke-width="3"/>

  <!-- Step boxes -->
  <rect x="390" y="360" width="180" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="382" text-anchor="middle" class="label">1. Capture first sample</text>
  <text x="480" y="400" text-anchor="middle" class="sublabel">Mark harmlessly, release</text>

  <rect x="590" y="360" width="180" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="382" text-anchor="middle" class="label">2. Recapture later</text>
  <text x="680" y="400" text-anchor="middle" class="sublabel">Count marked individuals</text>

  <!-- Formula -->
  <rect x="390" y="440" width="380" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="465" text-anchor="middle" class="label">Population ≈ (first sample × second sample)</text>
  <text x="580" y="483" text-anchor="middle" class="label">÷ marked recaptured</text>
</svg>