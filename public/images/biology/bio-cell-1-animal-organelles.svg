<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Animal Cell Organelles</title>
  <desc id="desc">Labelled diagram of a typical animal cell showing the nucleus, cell membrane, cytoplasm, mitochondria, and ribosomes.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .cell-membrane { fill: none; stroke: #f472b6; stroke-width: 4; }
      .cytoplasm { fill: #e0f2fe; }
      .nucleus { fill: #a78bfa; }
      .mitochondrion { fill: #fb923c; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Animal Cell Organelles</text>

  <!-- Animal cell -->
  <g transform="translate(250, 110)">
    <rect x="0" y="0" width="300" height="260" rx="100" class="cytoplasm"/>
    <rect x="0" y="0" width="300" height="260" rx="100" class="cell-membrane"/>

    <!-- Nucleus -->
    <circle cx="150" cy="125" r="48" class="nucleus"/>
    <circle cx="150" cy="125" r="48" fill="none" stroke="#7c3aed" stroke-width="2"/>

    <!-- Mitochondria -->
    <ellipse cx="80" cy="75" rx="28" ry="16" class="mitochondrion" transform="rotate(-20 80 75)"/>
    <path d="M68 71 Q80 83 92 71" fill="none" stroke="#c2410c" stroke-width="2" transform="rotate(-20 80 75)"/>
    <ellipse cx="220" cy="195" rx="28" ry="16" class="mitochondrion" transform="rotate(15 220 195)"/>
    <path d="M208 191 Q220 203 232 191" fill="none" stroke="#c2410c" stroke-width="2" transform="rotate(15 220 195)"/>

    <!-- Ribosomes -->
    <g fill="#64748b">
      <circle cx="60" cy="200" r="3"/>
      <circle cx="75" cy="215" r="3"/>
      <circle cx="240" cy="80" r="3"/>
      <circle cx="255" cy="95" r="3"/>
      <circle cx="110" cy="230" r="3"/>
      <circle cx="200" cy="60" r="3"/>
    </g>
  </g>

  <!-- Labels -->
  <line x1="400" y1="135" x2="470" y2="115" class="line"/>
  <rect x="472" y="106" width="110" height="18" rx="4" class="label-bg"/>
  <text x="476" y="118" class="label">Cell membrane</text>

  <line x1="550" y1="240" x2="470" y2="255" class="line"/>
  <rect x="472" y="246" width="78" height="18" rx="4" class="label-bg"/>
  <text x="476" y="258" class="label">Cytoplasm</text>

  <line x1="400" y1="235" x2="400" y2="300" class="line"/>
  <rect x="356" y="301" width="88" height="18" rx="4" class="label-bg"/>
  <text x="360" y="313" class="label">Nucleus (DNA)</text>

  <line x1="330" y1="185" x2="260" y2="170" class="line"/>
  <rect x="155" y="161" width="82" height="18" rx="4" class="label-bg"/>
  <text x="159" y="173" class="label">Mitochondria</text>

  <line x1="470" y1="305" x2="560" y2="320" class="line"/>
  <rect x="562" y="311" width="82" height="18" rx="4" class="label-bg"/>
  <text x="566" y="323" class="label">Mitochondria</text>

  <line x1="310" y1="325" x2="240" y2="340" class="line"/>
  <rect x="150" y="331" width="70" height="18" rx="4" class="label-bg"/>
  <text x="154" y="343" class="label">Ribosomes</text>

  <rect x="220" y="400" width="360" height="50" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="400" y="420" text-anchor="middle" class="sublabel">Mitochondria produce ATP; ribosomes synthesise proteins;</text>
  <text x="400" y="438" text-anchor="middle" class="sublabel">the nucleus controls all cell activities.</text>
</svg>