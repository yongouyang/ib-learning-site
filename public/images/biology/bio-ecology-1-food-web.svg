<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Food Webs and Interdependence</title>
  <desc id="desc">A simple food web showing how aphids, ladybirds, birds, frogs and spiders are interconnected through feeding.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#f9fafb" rx="12"/>
  <text x="380" y="34" text-anchor="middle" class="title">Food Webs and Interdependence</text>

  <!-- Producer: rose bush -->
  <g>
    <rect x="320" y="380" width="16" height="60" fill="#78350f"/>
    <path d="M328,380 Q280,340 260,370 Q290,390 328,380 Z" fill="#16a34a"/>
    <path d="M328,360 Q360,320 390,350 Q360,380 328,360 Z" fill="#16a34a"/>
    <path d="M328,340 Q300,300 270,330 Q300,360 328,340 Z" fill="#16a34a"/>
    <circle cx="275" cy="355" r="5" fill="#ef4444"/>
    <circle cx="355" cy="345" r="5" fill="#ef4444"/>
  </g>
  <text x="328" y="470" text-anchor="middle" class="label">Rose plant (producer)</text>

  <!-- Primary consumer: aphids -->
  <ellipse cx="280" cy="260" rx="22" ry="14" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="270" cy="255" r="2.5" fill="#1f2937"/>
  <circle cx="290" cy="255" r="2.5" fill="#1f2937"/>
  <text x="280" y="265" text-anchor="middle" class="sublabel" fill="#713f12">Aphids</text>

  <!-- Secondary consumers -->
  <ellipse cx="180" cy="160" rx="28" ry="18" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="170" cy="155" r="3" fill="#1f2937"/>
  <circle cx="190" cy="155" r="3" fill="#1f2937"/>
  <circle cx="180" cy="165" r="4" fill="#1f2937"/>
  <text x="180" y="200" text-anchor="middle" class="label">Ladybird</text>

  <ellipse cx="400" cy="160" rx="30" ry="20" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <circle cx="390" cy="155" r="3" fill="#1f2937"/>
  <circle cx="410" cy="155" r="3" fill="#1f2937"/>
  <text x="400" y="200" text-anchor="middle" class="label">Spider</text>

  <ellipse cx="560" cy="200" rx="34" ry="22" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
  <circle cx="550" cy="195" r="3" fill="#1f2937"/>
  <circle cx="570" cy="195" r="3" fill="#1f2937"/>
  <text x="560" y="240" text-anchor="middle" class="label">Frog</text>

  <!-- Tertiary consumer: bird -->
  <ellipse cx="180" cy="70" rx="35" ry="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <polygon points="150,65 138,75 150,78" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <circle cx="170" cy="65" r="3" fill="#1f2937"/>
  <circle cx="190" cy="65" r="3" fill="#1f2937"/>
  <text x="180" y="35" text-anchor="middle" class="label">Bird</text>

  <!-- Feeding arrows -->
  <line x1="280" y1="340" x2="280" y2="280" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="275" y1="245" x2="205" y2="180" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="295" y1="250" x2="375" y2="170" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="300" y1="255" x2="535" y2="205" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="200" y1="150" x2="155" y2="90" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <line x1="415" y1="145" x2="205" y2="85" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>

  <!-- Keystone species label -->
  <line x1="590" y1="200" x2="680" y2="200" class="line"/>
  <rect x="682" y="191" width="70" height="18" rx="4" class="label-bg"/>
  <text x="686" y="203" class="label">Food web</text>

  <!-- Impact annotation -->
  <rect x="50" y="370" width="220" height="70" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="160" y="392" text-anchor="middle" class="label">Pesticide removes aphids</text>
  <text x="160" y="410" text-anchor="middle" class="sublabel">Ladybirds and spiders lose food;</text>
  <text x="160" y="425" text-anchor="middle" class="sublabel">birds that eat them also decline.</text>
</svg>