<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Antibiotics, Antiseptics and Resistance</title>
  <desc id="desc">Diagram comparing how antibiotics affect bacteria but not viruses, and how antiseptics work on external surfaces.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#f9fafb" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Antibiotics, Antiseptics and Resistance</text>

  <!-- Antibiotic action panel -->
  <rect x="30" y="55" width="270" height="360" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="165" y="82" text-anchor="middle" class="panel-title">Antibiotics kill bacteria</text>

  <ellipse cx="120" cy="150" rx="45" ry="25" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" class="sublabel" fill="#14532d">Cell wall</text>

  <rect x="180" y="120" width="36" height="20" rx="10" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
  <text x="198" y="134" text-anchor="middle" class="sublabel" fill="#854d0e">AB</text>

  <line x1="180" y1="150" x2="150" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <path d="M90,240 L100,225 L110,245 L125,220 L140,245 L155,225 L165,245 L150,260 L130,255 L110,265 L90,255 Z" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="125" y="290" text-anchor="middle" class="sublabel">Cell wall disrupted</text>
  <text x="125" y="305" text-anchor="middle" class="sublabel">bacterium bursts</text>

  <line x1="120" y1="180" x2="120" y2="220" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 2"/>

  <text x="165" y="350" text-anchor="middle" class="sublabel">Targets bacterial structures</text>
  <text x="165" y="365" text-anchor="middle" class="sublabel">(cell wall, ribosomes, DNA)</text>

  <!-- No effect on viruses panel -->
  <rect x="315" y="55" width="270" height="360" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="450" y="82" text-anchor="middle" class="panel-title">No effect on viruses</text>

  <circle cx="450" cy="180" r="38" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <line x1="450" y1="130" x2="450" y2="115" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="450" y1="230" x2="450" y2="245" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="400" y1="180" x2="385" y2="180" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="500" y1="180" x2="515" y2="180" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>

  <circle cx="450" cy="260" r="25" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <line x1="435" y1="245" x2="465" y2="275" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="465" y1="245" x2="435" y2="275" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="450" y="305" text-anchor="middle" class="sublabel">Antibiotics do not</text>
  <text x="450" y="320" text-anchor="middle" class="sublabel">work against viruses</text>

  <text x="450" y="365" text-anchor="middle" class="sublabel">Colds, flu and COVID-19 are viral</text>

  <!-- Antiseptics & resistance panel -->
  <rect x="600" y="55" width="270" height="360" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="735" y="82" text-anchor="middle" class="panel-title">Antiseptics &amp; resistance</text>

  <path d="M680,150 Q670,140 680,130 Q690,120 705,130 Q720,120 735,130 Q750,140 740,155 Q750,170 735,180 Q720,190 705,180 Q690,190 680,175 Q670,165 680,150 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="710" y="165" text-anchor="middle" class="label" fill="#92400e">Skin</text>

  <path d="M735,100 Q745,85 755,100 Q765,120 745,130 Q725,120 735,100 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="745" y="105" text-anchor="middle" class="sublabel" fill="#1e40af">Antiseptic</text>

  <rect x="630" y="230" width="210" height="120" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="735" y="250" text-anchor="middle" class="label">Antibiotic resistance</text>
  <circle cx="670" cy="285" r="10" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="680" y1="285" x2="710" y2="285" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="665" y="305" text-anchor="middle" class="sublabel">susceptible dies</text>
  <circle cx="760" cy="285" r="10" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="290" text-anchor="middle" class="sublabel" fill="#14532d">R</text>
  <text x="765" y="305" text-anchor="middle" class="sublabel">resistant survives</text>
  <circle cx="790" cy="325" r="8" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="810" cy="315" r="8" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="735" y="345" text-anchor="middle" class="sublabel">Resistant bacteria multiply</text>
</svg>