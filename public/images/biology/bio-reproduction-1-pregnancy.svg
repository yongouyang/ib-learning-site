<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <title id="title">Fertilisation, Pregnancy and Birth</title>
  <desc id="desc">Diagram showing sperm fertilising an egg in the oviduct, implantation in the uterus, and the placenta and amniotic sac during pregnancy.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #374151; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="840" height="520" fill="#f9fafb" rx="12"/>
  <text x="420" y="34" text-anchor="middle" class="title">Fertilisation, Pregnancy and Birth</text>

  <!-- Left: fertilisation in oviduct -->
  <rect x="30" y="55" width="360" height="280" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="210" y="82" text-anchor="middle" class="panel-title">Fertilisation</text>

  <!-- Oviduct -->
  <path d="M90,120 Q60,200 90,280 Q120,360 180,300 Q240,240 300,300" fill="none" stroke="#f472b6" stroke-width="28" stroke-linecap="round"/>
  <path d="M90,120 Q60,200 90,280 Q120,360 180,300 Q240,240 300,300" fill="none" stroke="#fbcfe8" stroke-width="20" stroke-linecap="round"/>

  <!-- Egg -->
  <circle cx="210" cy="240" r="22" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <circle cx="205" cy="235" r="8" fill="#f472b6" opacity="0.6"/>

  <!-- Sperm -->
  <g transform="translate(0,0)">
    <ellipse cx="150" cy="210" rx="8" ry="5" fill="#3b82f6"/>
    <line x1="158" y1="210" x2="175" y2="210" stroke="#3b82f6" stroke-width="2"/>
    <path d="M175,210 Q182,207 188,210 Q182,213 175,210" fill="#3b82f6"/>
  </g>
  <g transform="translate(30,35)">
    <ellipse cx="150" cy="210" rx="8" ry="5" fill="#3b82f6"/>
    <line x1="158" y1="210" x2="175" y2="210" stroke="#3b82f6" stroke-width="2"/>
    <path d="M175,210 Q182,207 188,210 Q182,213 175,210" fill="#3b82f6"/>
  </g>
  <line x1="120" y1="210" x2="60" y2="190" class="line"/>
  <rect x="10" y="181" width="70" height="18" rx="4" class="label-bg"/>
  <text x="15" y="193" class="label">Sperm</text>

  <!-- Fertilised egg -->
  <circle cx="260" cy="280" r="12" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
  <line x1="270" y1="280" x2="320" y2="260" class="line"/>
  <rect x="325" y="251" width="55" height="18" rx="4" class="label-bg"/>
  <text x="330" y="263" class="label">Zygote</text>

  <!-- Zygote divides -->
  <circle cx="120" cy="315" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="138" cy="315" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="156" cy="315" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="174" cy="315" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="147" y="350" text-anchor="middle" class="sublabel">Mitosis divisions</text>
  <text x="147" y="365" text-anchor="middle" class="sublabel">towards uterus</text>

  <!-- Right: pregnancy in uterus -->
  <rect x="410" y="55" width="400" height="440" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="10"/>
  <text x="610" y="82" text-anchor="middle" class="panel-title">Pregnancy</text>

  <!-- Uterus -->
  <path d="M520,140 Q480,140 480,200 L480,320 Q480,380 520,380 L700,380 Q740,380 740,320 L740,200 Q740,140 700,140 Q680,180 660,140 Q640,180 620,140 Q600,180 580,140 Q560,180 540,140 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>

  <!-- Endometrium -->
  <path d="M495,200 Q610,230 725,200" fill="none" stroke="#be185d" stroke-width="4" opacity="0.5"/>
  <path d="M495,320 Q610,350 725,320" fill="none" stroke="#be185d" stroke-width="4" opacity="0.5"/>

  <!-- Amniotic sac -->
  <ellipse cx="610" cy="260" rx="90" ry="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <text x="610" y="210" text-anchor="middle" class="sublabel">Amniotic sac</text>

  <!-- Foetus -->
  <ellipse cx="610" cy="270" rx="45" ry="32" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="595" cy="258" r="6" fill="#1f2937"/>
  <path d="M585,270 Q575,290 590,300" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <path d="M635,270 Q645,290 630,300" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Umbilical cord -->
  <path d="M610,302 Q610,340 630,360" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  <line x1="640" y1="350" x2="720" y2="380" class="line"/>
  <rect x="725" y="364" width="70" height="30" rx="4" class="label-bg"/>
  <text x="730" y="376" class="label">Umbilical</text>
  <text x="730" y="389" class="label">cord</text>

  <!-- Placenta -->
  <path d="M655,220 Q690,220 690,260 Q690,300 655,300 Q640,300 640,260 Q640,220 655,220 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <line x1="690" y1="260" x2="750" y2="240" class="line"/>
  <rect x="751" y="231" width="59" height="18" rx="4" class="label-bg"/>
  <text x="756" y="243" class="label">Placenta</text>

  <!-- Exchange arrows -->
  <line x1="665" y1="250" x2="720" y2="230" class="arrow" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <text x="730" y="220" class="sublabel">O₂, nutrients</text>
  <line x1="665" y1="270" x2="720" y2="290" class="arrow" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <text x="730" y="305" class="sublabel">CO₂, waste</text>

  <text x="610" y="425" text-anchor="middle" class="sublabel">Maternal and foetal blood do NOT mix.</text>

  <!-- Birth labels -->
  <line x1="520" y1="380" x2="450" y2="430" class="line"/>
  <rect x="380" y="431" width="110" height="18" rx="4" class="label-bg"/>
  <text x="385" y="443" class="label">Cervix dilates</text>
  <line x1="700" y1="380" x2="750" y2="430" class="line"/>
  <rect x="755" y="431" width="40" height="18" rx="4" class="label-bg"/>
  <text x="760" y="443" class="label">Birth</text>
</svg>