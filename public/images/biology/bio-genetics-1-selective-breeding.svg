<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Selective Breeding of Dairy Cattle</title>
  <desc id="desc">Diagram showing the steps of selective breeding: humans choose parent cows with high milk yield, breed them, select the best offspring, and repeat over many generations.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#f9fafb" rx="12"/>
  <text x="440" y="34" text-anchor="middle" class="title">Selective Breeding (Artificial Selection)</text>

  <!-- Step 1: Choose parents -->
  <rect x="40" y="70" width="180" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" class="label">Step 1</text>
  <text x="130" y="115" text-anchor="middle" class="sublabel">Choose parents</text>

  <!-- Cow icons -->
  <g transform="translate(65, 140)">
    <ellipse cx="45" cy="35" rx="38" ry="24" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="75" cy="28" r="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="80" cy="24" r="2" fill="#111827"/>
    <path d="M85,35 L95,30 L90,45 Z" fill="#f59e0b"/>
    <rect x="25" y="55" width="10" height="25" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="55" y="55" width="10" height="25" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="15" y="55" width="10" height="22" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="68" y="55" width="10" height="22" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <!-- Milk pail -->
    <rect x="100" y="55" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="112" y="67" text-anchor="middle" class="label" fill="#1d4ed8" style="font-size:10px">High</text>
    <text x="112" y="79" text-anchor="middle" class="label" fill="#1d4ed8" style="font-size:10px">milk</text>
  </g>

  <!-- Human selector -->
  <g transform="translate(110, 215)">
    <circle cx="0" cy="0" r="10" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="35" stroke="#ef4444" stroke-width="3"/>
    <line x1="-12" y1="20" x2="12" y2="20" stroke="#ef4444" stroke-width="3"/>
    <line x1="0" y1="35" x2="-10" y2="55" stroke="#ef4444" stroke-width="3"/>
    <line x1="0" y1="35" x2="10" y2="55" stroke="#ef4444" stroke-width="3"/>
  </g>
  <rect x="55" y="288" width="150" height="30" rx="4" class="label-bg"/>
  <text x="59" y="300" class="label">Humans choose</text>
  <text x="59" y="313" class="label">desired traits</text>

  <!-- Arrow to step 2 -->
  <line x1="220" y1="200" x2="250" y2="200" class="arrow" stroke="#6b7280" marker-end="url(#arrow)"/>

  <!-- Step 2: Breed -->
  <rect x="260" y="70" width="180" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" class="label">Step 2</text>
  <text x="350" y="115" text-anchor="middle" class="sublabel">Breed selected parents</text>

  <!-- Two cows with heart/offspring -->
  <g transform="translate(285, 150)">
    <ellipse cx="25" cy="20" rx="22" ry="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="42" cy="16" r="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="15" y="32" width="6" height="15" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="35" y="32" width="6" height="15" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  </g>
  <g transform="translate(375, 150)">
    <ellipse cx="25" cy="20" rx="22" ry="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="42" cy="16" r="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="15" y="32" width="6" height="15" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="35" y="32" width="6" height="15" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  </g>
  <!-- Heart between -->
  <path d="M350,190 C345,180 335,180 335,190 C335,200 350,210 350,210 C350,210 365,200 365,190 C365,180 355,180 350,190" fill="#ef4444"/>
  <!-- Offspring -->
  <g transform="translate(320, 230)">
    <ellipse cx="30" cy="18" rx="25" ry="15" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="50" cy="13" r="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="18" y="30" width="6" height="14" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="40" y="30" width="6" height="14" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="350" y="295" text-anchor="middle" class="sublabel">Offspring produced</text>

  <!-- Arrow to step 3 -->
  <line x1="440" y1="200" x2="470" y2="200" class="arrow" stroke="#6b7280" marker-end="url(#arrow)"/>

  <!-- Step 3: Select best offspring -->
  <rect x="480" y="70" width="180" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="570" y="95" text-anchor="middle" class="label">Step 3</text>
  <text x="570" y="115" text-anchor="middle" class="sublabel">Select best offspring</text>

  <g transform="translate(505, 150)">
    <!-- Three offspring -->
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="33" cy="16" r="7" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="13" y="30" width="5" height="12" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="28" y="30" width="5" height="12" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>

    <ellipse cx="70" cy="20" rx="18" ry="12" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle cx="83" cy="16" r="7" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="63" y="30" width="5" height="12" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="78" y="30" width="5" height="12" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>

    <ellipse cx="45" cy="70" rx="20" ry="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="60" cy="65" r="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="35" y="80" width="6" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="55" y="80" width="6" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <!-- Check mark on best -->
    <circle cx="75" cy="55" r="10" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <path d="M70,55 L74,59 L82,50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="570" y="295" text-anchor="middle" class="sublabel">Highest milk yield chosen</text>

  <!-- Arrow loop -->
  <path d="M570,330 C570,360 400,360 400,330" fill="none" class="arrow" stroke="#6b7280" marker-end="url(#arrow)"/>
  <text x="485" y="375" text-anchor="middle" class="label">Repeat over many generations</text>

  <!-- Risk warning -->
  <rect x="700" y="70" width="160" height="260" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="780" y="95" text-anchor="middle" class="label" fill="#b91c1c">Risks</text>
  <text x="780" y="125" text-anchor="middle" class="sublabel">Reduced genetic</text>
  <text x="780" y="142" text-anchor="middle" class="sublabel">diversity</text>
  <text x="780" y="170" text-anchor="middle" class="sublabel">Harmful recessive</text>
  <text x="780" y="187" text-anchor="middle" class="sublabel">alleles increase</text>
  <text x="780" y="215" text-anchor="middle" class="sublabel">Inbreeding</text>
  <text x="780" y="232" text-anchor="middle" class="sublabel">depression</text>
  <path d="M700,255 L700,270" class="line"/>
  <text x="780" y="290" text-anchor="middle" class="sublabel">e.g. hip dysplasia,</text>
  <text x="780" y="307" text-anchor="middle" class="sublabel">breathing problems</text>
</svg>