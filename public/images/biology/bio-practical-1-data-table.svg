<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Collecting and recording data</title>
  <desc id="desc">A results table showing repeat measurements, an anomalous result, mean calculations, and the range used to assess precision.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .header { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; }
      .outlier { fill: #fee2e2; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
    </style>
  </defs>

  <rect width="800" height="440" fill="#f9fafb" rx="12"/>
  <text x="400" y="34" text-anchor="middle" class="title">Collecting and Recording Data</text>

  <!-- Table -->
  <g transform="translate(80,80)">
    <!-- Header row -->
    <rect x="0" y="0" width="130" height="36" class="header"/>
    <rect x="130" y="0" width="100" height="36" class="header"/>
    <rect x="230" y="0" width="100" height="36" class="header"/>
    <rect x="330" y="0" width="100" height="36" class="header"/>
    <rect x="430" y="0" width="90" height="36" class="header"/>
    <rect x="520" y="0" width="120" height="36" class="header"/>

    <text x="65" y="22" text-anchor="middle" class="label">Temperature (°C)</text>
    <text x="180" y="22" text-anchor="middle" class="label">Repeat 1</text>
    <text x="280" y="22" text-anchor="middle" class="label">Repeat 2</text>
    <text x="380" y="22" text-anchor="middle" class="label">Repeat 3</text>
    <text x="475" y="22" text-anchor="middle" class="label">Mean</text>
    <text x="580" y="22" text-anchor="middle" class="label">Range</text>

    <!-- Row 1 -->
    <rect x="0" y="36" width="130" height="34" class="cell"/>
    <rect x="130" y="36" width="100" height="34" class="cell"/>
    <rect x="230" y="36" width="100" height="34" class="cell"/>
    <rect x="330" y="36" width="100" height="34" class="cell"/>
    <rect x="430" y="36" width="90" height="34" class="cell"/>
    <rect x="520" y="36" width="120" height="34" class="cell"/>
    <text x="65" y="57" text-anchor="middle" class="sublabel">20</text>
    <text x="180" y="57" text-anchor="middle" class="sublabel">12</text>
    <text x="280" y="57" text-anchor="middle" class="sublabel">11</text>
    <text x="380" y="57" text-anchor="middle" class="sublabel">12</text>
    <text x="475" y="57" text-anchor="middle" class="sublabel">11.7</text>
    <text x="580" y="57" text-anchor="middle" class="sublabel">12 − 11 = 1</text>

    <!-- Row 2 -->
    <rect x="0" y="70" width="130" height="34" class="cell"/>
    <rect x="130" y="70" width="100" height="34" class="cell"/>
    <rect x="230" y="70" width="100" height="34" class="cell"/>
    <rect x="330" y="70" width="100" height="34" class="cell"/>
    <rect x="430" y="70" width="90" height="34" class="cell"/>
    <rect x="520" y="70" width="120" height="34" class="cell"/>
    <text x="65" y="91" text-anchor="middle" class="sublabel">30</text>
    <text x="180" y="91" text-anchor="middle" class="sublabel">22</text>
    <text x="280" y="91" text-anchor="middle" class="sublabel">23</text>
    <text x="380" y="91" text-anchor="middle" class="sublabel">22</text>
    <text x="475" y="91" text-anchor="middle" class="sublabel">22.3</text>
    <text x="580" y="91" text-anchor="middle" class="sublabel">23 − 22 = 1</text>

    <!-- Row 3 outlier -->
    <rect x="0" y="104" width="130" height="34" class="cell"/>
    <rect x="130" y="104" width="100" height="34" class="cell"/>
    <rect x="230" y="104" width="100" height="34" class="cell outlier"/>
    <rect x="330" y="104" width="100" height="34" class="cell"/>
    <rect x="430" y="104" width="90" height="34" class="cell"/>
    <rect x="520" y="104" width="120" height="34" class="cell"/>
    <text x="65" y="125" text-anchor="middle" class="sublabel">40</text>
    <text x="180" y="125" text-anchor="middle" class="sublabel">35</text>
    <text x="280" y="125" text-anchor="middle" class="label" fill="#b91c1c">72</text>
    <text x="380" y="125" text-anchor="middle" class="sublabel">36</text>
    <text x="475" y="125" text-anchor="middle" class="sublabel">35.5*</text>
    <text x="580" y="125" text-anchor="middle" class="sublabel">36 − 35 = 1</text>
  </g>

  <!-- Annotations -->
  <line x1="390" y1="196" x2="390" y2="230" class="line"/>
  <rect x="315" y="231" width="168" height="18" rx="4" class="label-bg"/>
  <text x="320" y="244" class="label">Anomalous result excluded</text>

  <line x1="155" y1="80" x2="140" y2="68" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="85" y="50" width="107" height="18" rx="4" class="label-bg"/>
  <text x="89" y="63" class="label">Headings + units</text>

  <line x1="660" y1="80" x2="648" y2="68" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="575" y="50" width="140" height="18" rx="4" class="label-bg"/>
  <text x="579" y="63" class="label">Range shows precision</text>

  <text x="400" y="310" text-anchor="middle" class="sublabel">*Mean calculated after excluding the anomalous 72; the exclusion is noted.</text>

  <rect x="100" y="340" width="600" height="60" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="365" text-anchor="middle" class="label">Key rules</text>
  <text x="400" y="385" text-anchor="middle" class="sublabel">Repeat each condition at least 3 times • record units • identify and explain outliers</text>
</svg>