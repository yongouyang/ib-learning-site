<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Mineral Nutrition and Deficiency Symptoms</title>
  <desc id="desc">Diagram showing plant roots absorbing mineral ions from soil, and leaves showing deficiency symptoms for nitrates, magnesium, and potassium.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #4b5563; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
      .label-bg { fill: #f9fafb; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin="round"; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="860" height="520" fill="#f9fafb" rx="12"/>
  <text x="430" y="38" text-anchor="middle" class="title">Mineral Nutrition and Deficiency Symptoms</text>

  <!-- Soil -->
  <rect x="40" y="360" width="300" height="120" fill="#d4a373" stroke="#a16207" stroke-width="2" rx="8"/>
  <text x="190" y="390" text-anchor="middle" class="label" fill="#78350f">Soil</text>

  <!-- Mineral ions -->
  <g>
    <circle cx="100" cy="420" r="14" fill="#3b82f6"/>
    <text x="100" y="424" text-anchor="middle" class="label" fill="#ffffff">NO₃⁻</text>
  </g>
  <g>
    <circle cx="170" cy="440" r="14" fill="#a855f7"/>
    <text x="170" y="444" text-anchor="middle" class="label" fill="#ffffff">Mg²⁺</text>
  </g>
  <g>
    <circle cx="240" cy="415" r="14" fill="#ef4444"/>
    <text x="240" y="419" text-anchor="middle" class="label" fill="#ffffff">K⁺</text>
  </g>
  <text x="170" y="470" text-anchor="middle" class="sublabel">Mineral ions absorbed by roots</text>

  <!-- Roots -->
  <path d="M190,360 Q190,320 170,300 Q150,280 160,250" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <path d="M190,360 Q210,320 230,300 Q250,280 240,250" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <path d="M190,360 Q190,310 190,240" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="190" y1="250" x2="130" y2="210" class="line"/>
  <rect x="70" y="192" width="110" height="18" rx="4" class="label-bg"/>
  <text x="75" y="205" text-anchor="start" class="label">Root hairs</text>

  <!-- Stem -->
  <rect x="178" y="120" width="24" height="130" fill="#a3e635" stroke="#65a30d" stroke-width="2"/>

  <!-- Leaves -->
  <g transform="translate(120, 80)">
    <path d="M0,40 Q60,-10 120,40 Q60,90 0,40 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <line x1="10" y1="40" x2="110" y2="40" stroke="#22c55e" stroke-width="1.5"/>
    <text x="60" y="44" text-anchor="middle" class="sublabel" fill="#14532d">Healthy leaf</text>
  </g>

  <!-- Nitrate deficiency leaf -->
  <g transform="translate(460, 90)">
    <path d="M0,35 Q55,-10 110,35 Q55,80 0,35 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <line x1="10" y1="35" x2="100" y2="35" stroke="#eab308" stroke-width="1.5"/>
    <rect x="15" y="15" width="80" height="40" rx="4" fill="#f9fafb" opacity="0.7"/>
    <text x="55" y="32" text-anchor="middle" class="label" fill="#854d0e">Nitrate deficiency</text>
    <text x="55" y="48" text-anchor="middle" class="sublabel" fill="#854d0e">Stunted, yellow older leaves</text>
  </g>

  <!-- Magnesium deficiency leaf -->
  <g transform="translate(460, 210)">
    <path d="M0,35 Q55,-10 110,35 Q55,80 0,35 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <line x1="10" y1="35" x2="100" y2="35" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="10" fill="#fef08a" opacity="0.8"/>
    <circle cx="70" cy="28" r="8" fill="#fef08a" opacity="0.8"/>
    <circle cx="55" cy="50" r="7" fill="#fef08a" opacity="0.8"/>
    <rect x="12" y="12" width="86" height="46" rx="4" fill="#f9fafb" opacity="0.7"/>
    <text x="55" y="30" text-anchor="middle" class="label" fill="#14532d">Magnesium deficiency</text>
    <text x="55" y="46" text-anchor="middle" class="sublabel" fill="#14532d">Yellowing between veins</text>
  </g>

  <!-- Potassium deficiency leaf -->
  <g transform="translate(460, 330)">
    <path d="M0,35 Q55,-10 110,35 Q55,80 0,35 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <line x1="10" y1="35" x2="100" y2="35" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M5,35 L105,35" stroke="#fde047" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M5,25 L105,25" stroke="#fde047" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <rect x="12" y="12" width="86" height="46" rx="4" fill="#f9fafb" opacity="0.7"/>
    <text x="55" y="30" text-anchor="middle" class="label" fill="#14532d">Potassium deficiency</text>
    <text x="55" y="46" text-anchor="middle" class="sublabel" fill="#14532d">Yellow leaf edges</text>
  </g>

  <!-- Labels -->
  <line x1="270" y1="120" x2="450" y2="60" class="line"/>
  <rect x="330" y="45" width="110" height="18" rx="4" class="label-bg"/>
  <text x="335" y="58" text-anchor="start" class="label">Healthy plant</text>

  <line x1="280" y1="420" x2="460" y2="140" class="line"/>
  <line x1="270" y1="425" x2="460" y2="260" class="line"/>
  <line x1="280" y1="430" x2="460" y2="380" class="line"/>

  <!-- Fertiliser note -->
  <rect x="620" y="390" width="200" height="60" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="720" y="410" text-anchor="middle" class="label">Fertilisers (NPK)</text>
  <text x="720" y="428" text-anchor="middle" class="sublabel">Replace minerals lost</text>
  <text x="720" y="443" text-anchor="middle" class="sublabel">by harvesting crops</text>
</svg>