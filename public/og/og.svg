<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for the site-wide social card. Rendered to src/app/opengraph-image.png by
       scripts/generate-og-image.mjs (Playwright Chromium, same mechanism as the PWA icons).
       Social platforms do NOT render SVG og:image, so the PNG is the shipped artefact. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Octav mark (public/icons/icon.svg glyph, 72-unit canvas scaled 1.667 -> 120px) -->
  <g transform="translate(540 78) scale(1.6667)" fill="none" stroke="#ffffff" stroke-width="5">
    <ellipse cx="36" cy="38" rx="22" ry="26"/>
    <rect x="24" y="44" width="5" height="8" rx="1" fill="#ffffff" stroke="none" opacity="0.5"/>
    <rect x="31" y="38" width="5" height="14" rx="1" fill="#ffffff" stroke="none" opacity="0.7"/>
    <rect x="38" y="30" width="5" height="22" rx="1" fill="#ffffff" stroke="none" opacity="0.85"/>
    <rect x="45" y="22" width="5" height="30" rx="1" fill="#ffffff" stroke="none"/>
    <path d="M47 20L50 18L49 22" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    <circle cx="52" cy="16" r="3" fill="#fbbf24" stroke="none"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="600" y="330" font-size="84" font-weight="700" letter-spacing="-1">Octav Learning</text>
    <text x="600" y="400" font-size="34" fill-opacity="0.95">Illustrated notes · smart flashcards · marked practice</text>
    <text x="600" y="470" font-size="28" font-weight="600" fill-opacity="0.85">KS3 · IGCSE · IB DP — maths, sciences, languages &amp; humanities</text>
  </g>
</svg>
