name: CI/CD

# Single pipeline: build-and-test → e2e (per-device matrix) → deploy.
# Security scans (Semgrep SAST + OSV-Scanner SCA) run in parallel with e2e
# and are full gates — for PRs AND for deploy (Phase 3 of
# docs/security-scanning-plan.md). Deploy runs only on pushes to develop
# (or manual dispatch on develop) and only after the full gate chain is
# green — e2e and security included. Deploy details:
# docs/aws-deployment-plan.md §6. Auth via GitHub OIDC (no stored AWS keys) —
# the role is managed by terraform/modules/ci and trusts only this repo @
# develop. Manual dispatch accepts a `deploy_only` input (escape hatch):
# skips all gate jobs and deploys develop HEAD as-is — for fixing deploy-stage
# issues (secrets, terraform) without a 16-minute full-pipeline wait.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Escape hatch: skip build/test/security gates, deploy develop HEAD as-is'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    # Skipped when the run is a deploy_only manual dispatch.
    if: ${{ inputs.deploy_only != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Audit content
        run: npm run audit:content

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    if: ${{ inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      # Don't cancel the other device jobs when one fails — we want the full
      # per-device picture in a single run.
      fail-fast: false
      matrix:
        project: ['iPhone SE', 'iPad Pro', 'Desktop Chrome']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # All three projects run under Chromium (iPhone/iPad devices set
      # defaultBrowserType: 'chromium'), so skip Firefox/WebKit downloads.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (${{ matrix.project }})
        run: npx playwright test --project="${{ matrix.project }}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Security gates (docs/security-scanning-plan.md Phase 3) — run in
  # parallel with e2e; both block PRs and deploys. Local triage:
  # npm run security. Suppressions: .semgrepignore + osv-scanner.toml.
  semgrep:
    name: Semgrep (SAST)
    if: ${{ inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # semgrep/semgrep-action is deprecated — run the OSS CLI directly.
      # pipx is preinstalled on ubuntu runners.
      - name: Run Semgrep scan
        run: >-
          pipx run semgrep scan
          --config p/typescript --config p/react
          --config p/security-audit --config p/secrets
          --error

  # Official reusable workflow (google/osv-scanner-action). Default scan-args
  # are `--recursive ./` — covers package-lock.json AND tools/package-lock.json.
  osv-scanner:
    name: OSV-Scanner (SCA)
    if: ${{ inputs.deploy_only != true }}
    permissions:
      actions: read          # required for SARIF upload
      security-events: write # results land in Security > Code scanning
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0

  deploy:
    needs: [build-and-test, e2e, semgrep, osv-scanner]
    # Pushes/dispatches on develop only — never PRs, never main.
    # always()+!failure() so the deploy_only dispatch (gates skipped) still
    # runs, while any real gate failure on a normal run still blocks it.
    if: >-
      always() && !failure() && !cancelled() &&
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_REGION: ap-east-1
      SITE_URL: https://d2c1g77zfmjpm3.cloudfront.net
      SITE_BUCKET: iblearn-site-305655353474
      DISTRIBUTION_ID: E1BMVEW6YOKNUY
      # Feedback Lambda env (FEEDBACK_PROVIDER / FEEDBACK_API_KEY / ...). Until
      # the Moonshot key decision: leave the FEEDBACK_ENV secret unset →
      # unconfigured (GET {configured:false}, POST 501, "Mark with AI" hidden).
      # When decided, add e.g.
      # {"FEEDBACK_PROVIDER":"openai-compatible","FEEDBACK_API_KEY":"sk-..."}.
      TF_VAR_feedback_env: ${{ secrets.FEEDBACK_ENV || '{}' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The layout validator (diagnose-illustrations.mjs) renders SVGs with
      # headless Chromium — browsers are not preinstalled on the runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Only the illustration gates are unique to deploy — build-and-test
      # already ran validate:content, audit:content, lint and vitest on this
      # same commit (deploy `needs:` it, so they can't be bypassed on a
      # normal run; deploy_only is the explicit skip-everything hatch).
      - name: Quality gates
        run: |
          npm run validate:illustrations
          npm run validate:illustration-layout

      - name: Build static export
        run: npm run build:static

      - name: Build feedback Lambda zip
        run: npm run build:lambda

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Repo variable preferred; secret accepted as fallback (the role
          # ARN is not sensitive, but either placement works).
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9

      - name: Terraform apply
        working-directory: terraform/envs/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Sync static site to S3
        run: |
          aws s3 sync out/ s3://$SITE_BUCKET --delete \
            --exclude "_next/static/*" --exclude "sw.js" --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=300"
          aws s3 sync out/_next/static s3://$SITE_BUCKET/_next/static --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp out/sw.js s3://$SITE_BUCKET/sw.js --cache-control "no-cache"
          aws s3 cp out/manifest.webmanifest s3://$SITE_BUCKET/manifest.webmanifest --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

      - name: Smoke check
        run: |
          curl -fsS "$SITE_URL/" > /dev/null
          curl -fsS "$SITE_URL/subjects/math/math-algebra-1/study" > /dev/null
          curl -fsS "$SITE_URL/api/feedback" | grep -q '"configured"'
          echo "Smoke checks passed."
