name: Security Scan (nightly)

# Nightly dependency CVE watch — catches newly-disclosed vulnerabilities in
# the current lockfiles without a code push. Push/PR/deploy scanning moved
# into ci.yml (docs/security-scanning-plan.md Phase 3); this workflow keeps
# only the schedule trigger so scans don't double-run.

on:
  schedule:
    # Nightly at 03:17 UTC — off-the-hour to avoid the UTC top-of-hour herd.
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep scan
        run: >-
          pipx run semgrep scan
          --config p/typescript --config p/react
          --config p/security-audit --config p/secrets
          --error

  # Official reusable workflow (google/osv-scanner-action). Default scan-args
  # are `--recursive ./` — covers package-lock.json AND tools/package-lock.json.
  osv-scanner:
    name: OSV-Scanner (SCA)
    permissions:
      actions: read          # required for SARIF upload
      security-events: write # results land in Security > Code scanning
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
